<script>
var SEGS = [{"t": "h1", "s": "吕祖先天一气太乙金华宗旨（先天虚无太乙金华宗旨）", "o": "吕祖先天一气太乙金华宗旨（先天虚无太乙金华宗旨）", "i": 0}, {"t": "q", "s": "道教内丹典籍，共十三章，托名吕洞宾（吕祖）降乩传授，学界一般认为成书于明清之际。正文为「吕祖曰」原旨，文内「按：」「谨按：」等括注为历代有修证者的注解（如闵一得（闵小艮）《古书隐楼藏书》系统所传注语）。", "o": "道教内丹典籍，共十三章，托名吕洞宾（吕祖）降乩传授，学界一般认为成书于明清之际。正文为「吕祖曰」原旨，文内「按：」「謹按：」等括注为历代有修证者的注解（如闵一得（闵小艮）《古书隐楼藏书》系统所传注语）。", "i": 1}, {"t": "q", "s": "文本来源：中国哲学书电子化计划（ctext.org）《先天虚无太乙金华宗旨》十三章。", "o": "文本来源：中国哲学书电子化计划（ctext.org）《先天虚无太乙金华宗旨》十三章。", "i": 2}, {"t": "h2", "s": "天心章第一", "o": "天心章第一", "i": 3}, {"t": "p", "s": "中国哲学书电子化计划", "o": "中國哲學書電子化計劃", "i": 4}, {"t": "p", "s": "1 吕祖全书卷四十九", "o": "1 呂祖全書卷四十九", "i": 5}, {"t": "p", "s": "2   武林王世陛云轩重镌", "o": "2   武林王世陛雲軒重鐫", "i": 6}, {"t": "p", "s": "3   钱塘邵志琳纯一增辑", "o": "3   錢塘邵志琳純一增輯", "i": 7}, {"t": "p", "s": "4 先天虚无太乙<b>金华</b>宗旨", "o": "4 先天虛無太乙金華宗旨", "i": 8}, {"t": "p", "s": "5 吕祖曰。自然曰道，道无名相，一性而已，一<b>元神</b>而已，性命不可见，寄之天光，天光不可见，寄之两目。古来仙真，皆口口相传，传一得一。自太上见化，东华递传嵓 他版：「嵓」为「某」，以及南北两宗，全真可为极盛，盛者盛其徒众，衰者衰于心传，以至今日，滥泛极矣！凌替极矣！极则返，故蒙净明许祖，垂慈普度，特立教外别传之旨，接引上根。闻者千劫难逢，受者一时法会。皆当仰体许祖苦心，必于人伦日用间，立定脚跟，方可修真悟性。我今叨为度师，先以太乙<b>金华</b>宗旨发明，然后细为开说。太乙者，无上之谓。丹诀甚多，总假有为而臻无为，非一超直入之旨。所传宗旨，直提性功，不落第二法门，所以为妙。<b>金华</b>即光也。光是何色？取象于<b>金华</b>，亦秘一光字在内，是先天太乙之真炁，水乡铅只一味者，此也。<span class=\"key\">回光之功，全用逆法</span>，注想<b>天心</b>，<b>天心</b>居日月中。《黄庭经》云：「寸田尺宅可治生，尺宅，面也，面上寸田，非<b>天心</b>而何？方寸中具有郁罗萧台之胜，玉京丹阙之奇，乃至虚至灵之神所注。」儒曰：「虚中」；释曰：「灵台」；道曰：「祖土」，曰：「黄庭」，曰：「玄关」，曰：「先天窍」。盖<b>天心</b>犹宅舍一般，光乃主人翁也。故一<b>回光</b>，周身之气皆上朝，如圣王定都立极，执玉帛者万国；又如主人精明，奴婢自然奉命，各司其事。诸子只去<b>回光</b>，便是无上妙谛。光易动而难定，<mark>回之既久，此光凝结，即是自然法身</mark>，而凝神于九霄之上矣。《心印经》所谓默朝飞升者，此也。", "o": "5 呂祖曰。自然曰道，道無名相，一性而已，一<b>元神</b>而已，性命不可見，寄之天光，天光不可見，寄之兩目。古來仙真，皆口口相傳，傳一得一。自太上見化，東華遞傳嵓 他版：「嵓」為「某」，以及南北兩宗，全真可為極盛，盛者盛其徒眾，衰者衰于心傳，以至今日，濫泛極矣！凌替極矣！極則返，故蒙淨明許祖，垂慈普度，特立教外別傳之旨，接引上根。聞者千劫難逢，受者一時法會。皆當仰體許祖苦心，必於人倫日用間，立定腳跟，方可修真悟性。我今叨為度師，先以太乙金華宗旨發明，然後細為開說。太乙者，無上之謂。丹訣甚多，總假有為而臻無為，非一超直入之旨。所傳宗旨，直提性功，不落第二法門，所以為妙。金華即光也。光是何色？取象於金華，亦秘一光字在內，是先天太乙之真炁，水鄉鉛只一味者，此也。<span class=\"key\">回光之功，全用逆法</span>，注想<b>天心</b>，<b>天心</b>居日月中。《黃庭經》云：「寸田尺宅可治生，尺宅，面也，面上寸田，非<b>天心</b>而何？方寸中具有鬱羅蕭臺之勝，玉京丹闕之奇，乃至虛至靈之神所注。」儒曰：「虛中」；釋曰：「靈臺」；道曰：「祖土」，曰：「黃庭」，曰：「玄關」，曰：「先天竅」。蓋<b>天心</b>猶宅舍一般，光乃主人翁也。故一<b>回光</b>，周身之氣皆上朝，如聖王定都立極，執玉帛者萬國；又如主人精明，奴婢自然奉命，各司其事。諸子只去<b>回光</b>，便是無上妙諦。光易動而難定，回之既久，此光凝結，即是自然<b>法身</b>，而凝神於九霄之上矣。《心印經》所謂默朝飛昇者，此也。", "i": 9}, {"t": "p", "s": "6 宗旨行去，别无求进之法，只在纯想于此。《楞严经》云：「<mark>纯想即飞</mark>，必生天上」。天非苍苍之天也，即生身于<b>乾宫</b>是也。久之，自然身外天也有身。", "o": "6 宗旨行去，別無求進之法，只在純想於此。《楞嚴經》云：「純想即飛，必生天上」。天非蒼蒼之天也，即生身於乾宮是也。久之，自然身外天也有身。", "i": 10}, {"t": "p", "s": "7 <b>金华</b>即<b>金丹</b>，神明变化，各师于心，此中妙诀，虽不差毫末，然而甚活，全要聪明，又须沉静，非极聪明人行不得，非极沉静人守不得。", "o": "7 金華即<b>金丹</b>，神明變化，各師于心，此中妙訣，雖不差毫末，然而甚活，全要聰明，又須沉靜，非極聰明人行不得，非極沉靜人守不得。", "i": 11}, {"t": "h2", "s": "元神识神章第二", "o": "元神識神章第二", "i": 12}, {"t": "p", "s": "中国哲学书电子化计划", "o": "中國哲學書電子化計劃", "i": 13}, {"t": "p", "s": "祖师曰：天地视人如蜉蝣，大道视天地亦泡影。惟<b>元神</b>真性，则超元会而上之。其精气则随天地而败坏矣。然有<b>元神</b>在，即无极也。生天生地皆由此矣。学人但能护<b>元神</b>，则超生阴阳外，不在三界中，此惟<b>见性</b>方可，所谓本来面目也。", "o": "祖師曰：天地視人如蜉蝣，大道視天地亦泡影。惟<b>元神</b>真性，則超元會而上之。其精氣則隨天地而敗壞矣。然有<b>元神</b>在，即無極也。生天生地皆由此矣。學人但能護<b>元神</b>，則超生陰陽外，不在三界中，此惟見性方可，所謂本來面目也。", "i": 14}, {"t": "note", "s": "「按：<mark>此见性方可四字是棒喝</mark>，万不可删，而誊本删之，今仍补入。祖意盖言人于大道，乃有行而不能入，得而不能守者，总以未见真性本体，不能无疑，大障随之，此其所以不入不守也。非真见而曰守，不过守所闻焉耳。若果能见，未有不能守也。故祖圣意，重在<b>见性</b>一边，一得故知此章四字为棒喝，是承上章而来也。」", "o": "「按：此見性方可四字是棒喝，萬不可刪，而謄本刪之，今仍補入。祖意蓋言人於大道，乃有行而不能入，得而不能守者，總以未見真性本體，不能無疑，大障隨之，此其所以不入不守也。非真見而曰守，不過守所聞焉耳。若果能見，未有不能守也。故祖聖意，重在見性一邊，一得故知此章四字為棒喝，是承上章而來也。」", "i": 15}, {"t": "p", "s": "凡人投胎时，<b>元神</b>居方寸，而<b>识神</b>则居下心。下面<b>血肉心</b>，形如大桃，有肺以覆翼之，肝以佐之，大小肠承之，假如一日不食，心上便大不自在，以致闻惊而跳，闻怒而闷，见死亡则悲，见美色则眩，头上何尝微微有些儿动。问：方寸不能动乎？方寸中之<b>真意</b>，如何能动。到动时便不妙，然亦最妙，凡人死时方动，此为不妙；最妙者，光已凝结为<b>法身</b>，渐渐灵通欲动矣，此<mark>千古不传之秘</mark>也。", "o": "凡人投胎時，<b>元神</b>居方寸，而識神則居下心。下面<b>血肉心</b>，形如大桃，有肺以覆翼之，肝以佐之，大小腸承之，假如一日不食，心上便大不自在，以致聞驚而跳，聞怒而悶，見死亡則悲，見美色則眩，頭上何嘗微微有些兒動。問：方寸不能動乎？方寸中之<b>真意</b>，如何能動。到動時便不妙，然亦最妙，凡人死時方動，此為不妙；最妙者，光已凝結為<b>法身</b>，漸漸靈通欲動矣，此千古不傳之秘也。", "i": 16}, {"t": "note", "s": "「谨按：此<mark>千古不传之秘</mark>，非仅光凝<b>法身</b>一节，如云<b>元神</b>居方寸，<b>识神</b>居下心，古哲未尝一并指示，而后学乃有误认<b>识心</b>为心，而加之以运注，翻著有为，以致助火。盖此<b>血肉心</b>体，<b>识神</b>所依，属阴火，惟宜致虚致寂而致无者。<b>元神</b>乃真性，来自乾，亦属火，天火也。祖师故并而标出之。」", "o": "「謹按：此千古不傳之秘，非僅光凝<b>法身</b>一節，如云<b>元神</b>居方寸，識神居下心，古哲未嘗一併指示，而後學乃有誤認識心為心，而加之以運注，翻著有為，以致助火。蓋此<b>血肉心</b>體，識神所依，屬陰火，惟宜致虛致寂而致無者。<b>元神</b>乃真性，來自乾，亦屬火，天火也。祖師故並而標出之。」", "i": 17}, {"t": "p", "s": "下<b>识心</b>，如强藩悍将，欺天君孤立，便尔遥执纪纲，久之太阿倒置矣。今拟光照元宫，如英明主有伊周佐之，日日<b>回光</b>，如左右臣工尽心辅弼，内政既肃，自然一切奸邪，无不倒戈乞命矣。", "o": "下識心，如強藩悍將，欺天君孤立，便爾遙執紀綱，久之太阿倒置矣。今擬光照元宮，如英明主有伊周佐之，日日<b>回光</b>，如左右臣工盡心輔弼，內政既肅，自然一切奸邪，無不倒戈乞命矣。", "i": 18}, {"t": "p", "s": "丹道，以<b>精水</b>、<b>神火</b>、<b>意土</b>三者，为无上之诀《碧苑坛经》诀作宝。<b>精水</b>云何？乃先天真一之炁，<b>神火</b>即光也，<b>意土</b>即中宫<b>天心</b>也。以<b>神火</b>为用，<b>意土</b>为体，<b>精水</b>为基。凡人以意生身，身不止七尺者为身也。盖身有魄焉，魄附识而用，识依魄而生。魄阴也，识之体也，识不断，则生生世世，魄之变形易舍无已也。惟有魂者，神之所藏也。魂昼寓于目，夜舍于肝，寓目而视，舍肝而梦，梦者神游也，九天九地，刹那历遍。觉则冥冥焉《吕版》冥冥焉后另有渊渊焉，拘于形也，即拘于魄也。故<b>回光</b>即所以炼魂，即所以保神，即所以制魄，即所以断识。古人出世法，炼尽阴滓，以返纯乾，不过消魄全魂耳。<b>回光</b>者，消阴制魄之诀也，无返乾之功，秪有<b>回光</b>之诀，光即乾也，回之即返之也。只守此法，自然精足，<b>神火</b>发生，<b>意土</b>凝定，而圣胎可结矣。蜣螂转丸，而丸中生白，神注之纯功也。粪丸中尚可生胎离壳，而吾<b>天心</b>休息处，注神于此，安得不生身乎。", "o": "丹道，以<b>精水</b>、<b>神火</b>、<b>意土</b>三者，為無上之訣《碧苑壇經》訣作寶。<b>精水</b>云何？乃先天真一之炁，<b>神火</b>即光也，<b>意土</b>即中宮<b>天心</b>也。以<b>神火</b>為用，<b>意土</b>為體，<b>精水</b>為基。凡人以意生身，身不止七尺者為身也。蓋身有魄焉，魄附識而用，識依魄而生。魄陰也，識之體也，識不斷，則生生世世，魄之變形易舍無已也。惟有魂者，神之所藏也。魂晝寓於目，夜舍於肝，寓目而視，舍肝而夢，夢者神游也，九天九地，剎那歷遍。覺則冥冥焉《呂版》冥冥焉後另有淵淵焉，拘於形也，即拘於魄也。故<b>回光</b>即所以煉魂，即所以保神，即所以制魄，即所以斷識。古人出世法，煉盡陰滓，以返純乾，不過消魄全魂耳。<b>回光</b>者，消陰制魄之訣也，無返乾之功，秪有<b>回光</b>之訣，光即乾也，回之即返之也。只守此法，自然精足，<b>神火</b>發生，<b>意土</b>凝定，而聖胎可結矣。蜣螂轉丸，而丸中生白，神注之純功也。糞丸中尚可生胎離殼，而吾<b>天心</b>休息處，注神於此，安得不生身乎。", "i": 19}, {"t": "note", "s": "「按：此功法，究其入手，以<b>回光</b>聚天池，是由泥丸外宫，悬于天目有如日然，以意引由<b>绛阙</b>，存照<b>中黄</b>，透入<b>玄窍</b>，乃达<b>神室</b>。既则牵降<b>识神</b>，下达下田，其时必有津液护识护神而就冶炼者也。此是<b>回光</b>光聚泥丸以后功夫，大忌燥妄，又忌散漫与昏沈。法惟万虑皆空，一念不扰，待得<b>天心</b>一开，则自油然照入。是时也，不独一身百窍，窍窍放光，大地天元，三才三宝，皆可悠然感至者。故我斯时总<mark>以不采采之</mark>，其妙更无穷焉。而祖师不之示者，恐学者鄞鄂未固，而世财未充，且于言外藏有妙义，不可不为述及也。盖<b>神室</b>毘连<b>绛阙</b>，<b>绛阙</b>一地，纯以无作无为为事，如是寂体寂照，<b>绛阙</b>乃凉，<b>识神</b>有制，始自随神下降下田，受烹受炼，而无逆违之验。其妙在于一念虚寂，则六贼六根自无驻足处。中宫始泰，<b>元神</b>得以临莅，而胎元有兆矣。祖师玄意盖如此。是即无为功里施功之作用，而即儒宗之使由不使知也。斯篇妙语，乃樵云大师得自驻世神人张蓬头者。神人本姓瞿，故明殉节忠宣公讳式耜之子，管天仙亦以师礼事之者。乾隆四十三年，云游至金盖，斯时樵云大师尚未皈依太虚也。越四载，太虚翁至，谕将斯论注于是章之下，今故述之。」", "o": "「按：此功法，究其入手，以<b>回光</b>聚天池，是由泥丸外宮，懸於天目有如日然，以意引由絳闕，存照中黃，透入玄竅，乃達<b>神室</b>。既則牽降識神，下達下田，其時必有津液護識護神而就冶煉者也。此是<b>回光</b>光聚泥丸以後功夫，大忌燥妄，又忌散漫與昏沈。法惟萬慮皆空，一念不擾，待得<b>天心</b>一開，則自油然照入。是時也，不獨一身百竅，竅竅放光，大地天元，三才三寶，皆可悠然感至者。故我斯時總以不採採之，其妙更無窮焉。而祖師不之示者，恐學者鄞鄂未固，而世財未充，且於言外藏有妙義，不可不為述及也。蓋<b>神室</b>毘連絳闕，絳闕一地，純以無作無為為事，如是寂體寂照，絳闕乃涼，識神有製，始自隨神下降下田，受烹受煉，而無逆違之驗。其妙在於一念虛寂，則六賊六根自無駐足處。中宮始泰，<b>元神</b>得以臨莅，而胎元有兆矣。祖師玄意蓋如此。是即無為功裡施功之作用，而即儒宗之使由不使知也。斯篇妙語，乃樵雲大師得自駐世神人張蓬頭者。神人本姓瞿，故明殉節忠宣公諱式耜之子，管天仙亦以師禮事之者。乾隆四十三年，雲游至金蓋，斯時樵雲大師尚未皈依太虛也。越四載，太虛翁至，諭將斯論註於是章之下，今故述之。」", "i": 20}, {"t": "p", "s": "一灵真性，既落<b>乾宫</b>，便分魂魄。魂在<b>天心</b>，阳也，轻清之气也，此自太虚得来，与元始同形。魄阴也，沉浊之气也，附于有形之凡体。魂好生，魄望死。一切好色动气皆魄之所为，即<b>识神</b>也。死后享血食，活则大苦，阴返阴也。以类聚也，学人炼尽阴魄，即为<b>纯阳</b>。", "o": "一靈真性，既落乾宮，便分魂魄。魂在<b>天心</b>，陽也，輕清之氣也，此自太虛得來，與元始同形。魄陰也，沉濁之氣也，附於有形之凡體。魂好生，魄望死。一切好色動氣皆魄之所為，即識神也。死後享血食，活則大苦，陰返陰也。以類聚也，學人煉盡陰魄，即為純陽。", "i": 21}, {"t": "h2", "s": "回光守中章第三", "o": "回光守中章第三", "i": 22}, {"t": "p", "s": "中国哲学书电子化计划", "o": "中國哲學書電子化計劃", "i": 23}, {"t": "p", "s": "祖师曰：<b>回光</b>之名何昉乎？昉之自文始真人也。即关尹子。<b>回光</b>则天地阴阳之气无不凝，所谓精思者此也，纯气者此也，纯想者此也。初行之诀，是有中似无，久之功成，身外有身，乃无中生有。百日专功，光才真，方为<b>神火</b>。百日后，光自然聚。一点真阳，忽生黍珠，如夫妇交合有胎，便当静以待之，光之回，即火候也。", "o": "祖師曰：<b>回光</b>之名何昉乎？昉之自文始真人也。即關尹子。<b>回光</b>則天地陰陽之氣無不凝，所謂精思者此也，純氣者此也，純想者此也。初行之訣，是有中似無，久之功成，身外有身，乃無中生有。百日專功，光纔真，方為<b>神火</b>。百日後，光自然聚。一點真陽，忽生黍珠，如夫婦交合有胎，便當靜以待之，光之回，即火候也。", "i": 24}, {"t": "note", "s": "「<b>回光</b>之益之妙，本文详矣，<b>回光</b>得聚之诀亦备矣。然犹有欲取先与玄妙一诀，可引而伸之，其诀乃放光以引耳。放光妙用，在知廓其气机，欲廓气机，在知气透九霄，欲行上透，须知下达，下达作用，须先目光聚于<b>乾宫</b>，光足则下达中下，乃穿闾后透，透顶而上。透愈高，现愈广，觉广仍以事回耳，此未传之秘也。」", "o": "「<b>回光</b>之益之妙，本文詳矣，<b>回光</b>得聚之訣亦備矣。然猶有欲取先與玄妙一訣，可引而伸之，其訣乃放光以引耳。放光妙用，在知廓其氣機，欲廓氣機，在知氣透九霄，欲行上透，須知下達，下達作用，須先目光聚於乾宮，光足則下達中下，乃穿閭後透，透頂而上。透愈高，現愈廣，覺廣仍以事回耳，此未傳之秘也。」", "i": 25}, {"t": "p", "s": "夫元化之中，有阳光为主宰，有形者为日，在人为目，走漏神识，莫此甚顺。故<b>金华</b>之道，全用<b>逆法</b>。<b>回光</b>者，非回一身之精华，直回造化之真气，非止一时之妄想，直空千劫之轮回。故一息当一年，人间时刻也，一息当百年，九途长夜也。凡人自㘞户卧切，音和。地一声之后，逐境顺生，至老未尝逆视，阳气衰灭，便是九幽之界。故《楞严经》云：「<mark>纯想即飞</mark>，纯情即堕」。学人想少情多，沈沦下道。惟谛观息静，便成正觉，用<b>逆法</b>也。《阴符经》云：「<mark>机在目</mark>」。《黄帝素问》云：「人身精华，皆上注于空窍是也。」得此一节，长生者在兹，超升者亦在兹矣。此贯彻三教功夫也。", "o": "夫元化之中，有陽光為主宰，有形者為日，在人為目，走漏神識，莫此甚順。故金華之道，全用<b>逆法</b>。<b>回光</b>者，非回一身之精華，直回造化之眞氣，非止一時之妄想，直空千劫之輪迴。故一息當一年，人間時刻也，一息當百年，九途長夜也。凡人自㘞戶臥切，音和。地一聲之後，逐境順生，至老未嘗逆視，陽氣衰滅，便是九幽之界。故《楞嚴經》云：「純想卽飛，純情卽墮」。學人想少情多，沈淪下道。惟諦觀息靜，便成正覺，用<b>逆法</b>也。《陰符經》云：「機在目」。《黃帝素問》云：「人身精華，皆上注於空竅是也。」得此一節，長生者在茲，超升者亦在茲矣。此貫徹三教功夫也。", "i": 26}, {"t": "p", "s": "光不在身中，亦不在身外，山河日月大地，无非此光，故不独在身中。聪明智慧，一切运转，亦无非此光，所以亦不在身外。天地之光华，布满大千，一身之光华，亦自漫天盖地，所以一<b>回光</b>，天地山河，一切皆回矣。人之精华，上注于目，此人身之大关楗也。子辈思之，一日不静坐，此光流转，何所底止！若一刻能静坐，万劫千生，从此了彻。万法归于静，真不可思议，此妙谛也。然工夫下手，由浅入深，由粗入细，总以不间断为妙。功夫始终则一，但其间冷煖自知，要归于天空海阔，万法如如，方为得手。", "o": "光不在身中，亦不在身外，山河日月大地，無非此光，故不獨在身中。聰明智慧，一切運轉，亦無非此光，所以亦不在身外。天地之光華，布滿大千，一身之光華，亦自漫天蓋地，所以一<b>回光</b>，天地山河，一切皆回矣。人之精華，上注於目，此人身之大關楗也。子輩思之，一日不靜坐，此光流轉，何所底止！若一刻能靜坐，萬劫千生，從此了徹。萬法歸於靜，真不可思議，此妙諦也。然工夫下手，由淺入深，由粗入細，總以不間斷為妙。功夫始終則一，但其間冷煖自知，要歸於天空海闊，萬法如如，方為得手。", "i": 27}, {"t": "p", "s": "圣圣相传，不离反照。孔云：「知止」，释号：「观心」，老云：「内观」，皆此法也。但返照二字，人人能言，不能得手，未识二字之义耳。返者，自知觉之心，返乎形神未兆之初，即吾六尺之中，返求个天地未生之体。今人但一、二时闲坐，反顾其私，便云返照，安得到头！", "o": "聖聖相傳，不離反照。孔云：「知止」，釋號：「觀心」，老云：「內觀」，皆此法也。但返照二字，人人能言，不能得手，未識二字之義耳。返者，自知覺之心，返乎形神未兆之初，即吾六尺之中，返求箇天地未生之體。今人但一、二時閒坐，反顧其私，便云返照，安得到頭！", "i": 28}, {"t": "p", "s": "佛道二祖，教人看鼻尖者，非谓著念于鼻端也。亦非谓眼观鼻端，而念又注<b>中黄</b>也。眼之所至，心亦至焉，心之所至，气亦至焉，何能一上而一下也，又何能忽上而忽下也。此皆认指为月。毕竟如何？曰鼻端二字最妙，只是借鼻以为眼之准耳。初不在鼻上，盖以太开眼，则视远，而不见鼻矣。太闭眼。则眼合，而不见鼻矣。大开失之外走，易于散乱。太闭失之内驰，易于昏沈。惟垂帘得中，恰好望见鼻端，故取以为准。只是垂帘恰好去处，彼光自然透入，不劳你注射与不注射也。", "o": "佛道二祖，教人看鼻尖者，非謂著念於鼻端也。亦非謂眼觀鼻端，而念又注中黃也。眼之所至，心亦至焉，心之所至，氣亦至焉，何能一上而一下也，又何能忽上而忽下也。此皆認指為月。畢竟如何？曰鼻端二字最妙，只是借鼻以為眼之準耳。初不在鼻上，蓋以太開眼，則視遠，而不見鼻矣。太閉眼。則眼合，而不見鼻矣。大開失之外走，易於散亂。太閉失之內馳，易於昏沈。惟垂簾得中，恰好望見鼻端，故取以為準。只是垂簾恰好去處，彼光自然透入，不勞你注射與不注射也。", "i": 29}, {"t": "note", "s": "「<b>天心</b>章言以意引临心后关前，是示功夫已到之人，统说<b>回光</b>之全功也，此言不必念又注黄中，是教初学凝神一处以聚光，不可分心两处也。待得透入之后，则鼻尖是指，<b>中黄</b>是月。看鼻尖者，用以为眼之准，使无外走内驰之弊，惟垂帘为得中，然意初不在鼻而在天目。所以聚光于此，光既得聚，则又须引光下注<b>中黄</b>，盖以<b>中黄</b>，在人身地天之中正，即易之黄中，释氏所谓<b>缘中</b>，吾宗名曰<b>玄牝</b>之门，乃是生天生地生人生物之<b>玄窍</b>，修真成道之基，基于此者，初学如何便得注此。故须假鼻尖以为准，始得光聚天目。天目为三光之都会，而山根为人之性户，上达泥丸，中达黄中，下通脐后者。故须凝聚光于此处，由此而下注，是乃不易之功法。然忌太著意，又忌无意，兼忌躐等而进。自然总以光聚黄中为得也。」", "o": "「<b>天心</b>章言以意引臨心後關前，是示功夫已到之人，統說<b>回光</b>之全功也，此言不必念又注黃中，是教初學凝神一處以聚光，不可分心兩處也。待得透入之後，則鼻尖是指，中黃是月。看鼻尖者，用以為眼之準，使無外走內馳之弊，惟垂簾為得中，然意初不在鼻而在天目。所以聚光於此，光既得聚，則又須引光下注中黃，蓋以中黃，在人身地天之中正，即易之黃中，釋氏所謂緣中，吾宗名曰<b>玄牝</b>之門，乃是生天生地生人生物之玄竅，修真成道之基，基於此者，初學如何便得注此。故須假鼻尖以為準，始得光聚天目。天目為三光之都會，而山根為人之性戶，上達泥丸，中達黃中，下通臍後者。故須凝聚光於此處，由此而下注，是乃不易之功法。然忌太著意，又忌無意，兼忌躐等而進。自然總以光聚黃中為得也。」", "i": 30}, {"t": "p", "s": "看鼻端只在最初入静处，举眼一视，定个准则便放下。如泥水匠人用线一般，彼只起手一挂，便依了做去，不只管把线看也。", "o": "看鼻端只在最初入靜處，舉眼一視，定箇準則便放下。如泥水匠人用線一般，彼只起手一挂，便依了做去，不只管把線看也。", "i": 31}, {"t": "p", "s": "<b>止观</b>是佛法，原不秘的。以两目谛观鼻端，正身安坐，系心<b>缘中</b>，道言「<b>中黄</b>」，佛言「<b>缘中</b>」，一也。不必言头中，初学但于两目中间齐平处，系念便了。光是活泼泼的东西，系念眼之齐平处，光自然透入，不必著一念于<b>中黄</b>也。此数语，以括尽要旨。其余入静出静前后，以小<b>止观</b>书印证，可也。", "o": "止觀是佛法，原不秘的。以兩目諦觀鼻端，正身安坐，繫心緣中，道言「中黃」，佛言「緣中」，一也。不必言頭中，初學但於兩目中間齊平處，繫念便了。光是活潑潑的東西，繫念眼之齊平處，光自然透入，不必著一念於中黃也。此數語，以括盡要旨。其餘入靜出靜前後，以小止觀書印證，可也。", "i": 32}, {"t": "p", "s": "<b>缘中</b>二字极妙。中无不在，遍大千皆在里许，聊指造化之机，缘此入门耳。缘此为端倪，非有定著也，即此一字之义，活甚，妙甚。", "o": "緣中二字極妙。中無不在，遍大千皆在裏許，聊指造化之機，緣此入門耳。緣此為端倪，非有定著也，卽此一字之義，活甚，妙甚。", "i": 33}, {"t": "p", "s": "<b>止观</b>二字，原离不得，即定慧也。以后凡念起时，不要仍旧兀坐，当究此念在何处，从何起，从何灭，反复推穷，了不可得。即见此念起处也，不要又讨过起处，所谓觅心了不可得。吾与汝安心竟，此是正观，反此者名为邪观。如是不可得已，即仍旧绵绵去，<mark>止而继之以观，观而继之以止</mark>，是定慧双修法，此为<b>回光</b>。回者，止也，光者，观也。止而不观，名为有回无光，观而不止，名为有光而无回，志之。", "o": "止觀二字，原離不得，卽定慧也。以後凡念起時，不要仍舊兀坐，當究此念在何處，從何起，從何滅，反覆推窮，了不可得。卽見此念起處也，不要又討過起處，所謂覓心了不可得。吾與汝安心竟，此是正觀，反此者名為邪觀。如是不可得已，即仍舊綿綿去，止而繼之以觀，觀而繼之以止，是定慧雙修法，此為<b>回光</b>。回者，止也，光者，觀也。止而不觀，名為有回無光，觀而不止，名為有光而無回，誌之。", "i": 34}, {"t": "note", "s": "「<b>止观</b>原文，有此推究功法，是为未见心体，且不真信心体本虚本无，本净本寂，故有等等推究，造至了不可得，盖已为汝安心竟也。此一句是为即境指点法，若已<b>见性</b>，一照即觉，妄自遁矣，不劳推究。妄去体验，不劳寻觅。然只可为已<b>见性</b>者道，若未<b>见性</b>，必令从推究体得，尚须当下点破，信根方坚，疑根方断也。此后绵绵行去，但嘱勿动勿随，凭他妄况弥天盖地，而吾体自存。种种妄况，一切如浮云之点太虚，与我何损之有？盖此种种妄况，乃是气机，第无净尽之理，一起扫除之念，此念即妄，此起即著。古德云：『驱除烦恼重增念，趋向真如即是邪。』故吾宗但嘱勿动，动则非逐即随，岂仅乱性已哉。谨按此节祖意，乃在知止，故有等等推究功法也。吾辈事之，但加心信以行，一味返妄归真。返妄归真。不外回字，<b>回光</b>自返，无劳引导。一得寂体宗旨，谓当静也照，动也照，第照字须若春之日，秋之月，乃为得宜耳。」", "o": "「止觀原文，有此推究功法，是為未見心體，且不真信心體本虛本無，本淨本寂，故有等等推究，造至了不可得，蓋已為汝安心竟也。此一句是為即境指點法，若已見性，一照即覺，妄自遁矣，不勞推究。妄去體驗，不勞尋覓。然只可為已見性者道，若未見性，必令從推究體得，尚須當下點破，信根方堅，疑根方斷也。此後綿綿行去，但囑勿動勿隨，憑他妄況彌天蓋地，而吾體自存。種種妄況，一切如浮雲之點太虛，與我何損之有？蓋此種種妄況，乃是氣機，第無淨盡之理，一起掃除之念，此念即妄，此起即著。古德云：『驅除煩惱重增念，趨向真如即是邪。』故吾宗但囑勿動，動則非逐即隨，豈僅亂性已哉。謹按此節祖意，乃在知止，故有等等推究功法也。吾輩事之，但加心信以行，一味返妄歸真。返妄歸真。不外回字，<b>回光</b>自返，無勞引導。一得寂體宗旨，謂當靜也照，動也照，第照字須若春之日，秋之月，乃為得宜耳。」", "i": 35}, {"t": "h2", "s": "回光调息章第四", "o": "回光調息章第四", "i": 36}, {"t": "p", "s": "中国哲学书电子化计划", "o": "中國哲學書電子化計劃", "i": 37}, {"t": "p", "s": "祖师曰：宗旨只要纯心行去，不求验而验自至。大约初机病痛，昏沉散乱，二种尽之。却此机窍，无过寄心于息，息者自心也。自心为息，心一动，而即有气，气本心之所化也。吾人动念至速，霎顷起一妄念，即一呼吸应之。故内呼吸与外呼吸，如声响之相应，一日有几万息，即有几万妄念。神明漏尽，如木槁灰死矣。然则欲无念乎？不能无念也。欲无息乎？不能无息也。莫若即其病而为药，则<mark>心息相依</mark>是已。故<b>回光</b>兼之以调息，此法全用<b>耳光</b>。一是目光，一是<b>耳光</b>。目光者，外日月交光也，<b>耳光</b>者，内日月交精也。然精即光之凝定处，同出而异名也。故聪明总一灵光而已。坐时用目垂帘后，定个准则便放下。然竟放，又恐不能，即存心于听息。息之出入，不可使耳闻，听惟听其无声。一有声，便粗浮而不入细，当耐心轻轻微微，愈放愈微，愈微愈静，久之，忽然微者速断，此则<b>真息</b>现在，而心体可识矣。盖心细则息细，心一则动气也，息细则心细，气一则动心也。定心必先之养气者，亦以心无处入手，故缘气为之端倪，所谓纯气之守也。", "o": "祖師曰：宗旨只要純心行去，不求驗而驗自至。大約初機病痛，昏沉散亂，二種盡之。卻此機竅，無過寄心於息，息者自心也。自心為息，心一動，而即有氣，氣本心之所化也。吾人動念至速，霎頃起一妄念，即一呼吸應之。故內呼吸與外呼吸，如聲響之相應，一日有幾萬息，即有幾萬妄念。神明漏盡，如木槁灰死矣。然則欲無念乎？不能無念也。欲無息乎？不能無息也。莫若即其病而為藥，則<mark>心息相依</mark>是已。故<b>回光</b>兼之以調息，此法全用<b>耳光</b>。一是目光，一是<b>耳光</b>。目光者，外日月交光也，<b>耳光</b>者，內日月交精也。然精即光之凝定處，同出而異名也。故聰明總一靈光而已。坐時用目垂簾後，定個準則便放下。然竟放，又恐不能，即存心於聽息。息之出入，不可使耳聞，聽惟聽其無聲。一有聲，便粗浮而不入細，當耐心輕輕微微，愈放愈微，愈微愈靜，久之，忽然微者速斷，此則<b>真息</b>現在，而心體可識矣。蓋心細則息細，心一則動氣也，息細則心細，氣一則動心也。定心必先之養氣者，亦以心無處入手，故緣氣為之端倪，所謂純氣之守也。", "i": 38}, {"t": "note", "s": "「调息用<b>耳光</b>，秘法也。然有耳聋一辈，息之粗细不得闻，奈何？是当体之以觉，盖以气由心化，心无形，其粗其细，不易觉。气则无质而尚有迹，可<b>体觉</b>也。迹粗则加静其心，心静则迹自细，而息已微矣。迹造至无，则息已造<b>真息</b>息矣。较用<b>耳光</b>，得调更速。故古有调息不若调心之妙用也。年老耳聋之人，舍是<b>体觉</b>一诀，此步功夫终难入彀也。况觉乃性精，迹乃命末，是亦有性命相顾之义，先师太虚翁曾为高海留言之，谨采以补祖示之所未及。」", "o": "「調息用<b>耳光</b>，秘法也。然有耳聾一輩，息之粗細不得聞，奈何？是當體之以覺，蓋以氣由心化，心無形，其粗其細，不易覺。氣則無質而尚有跡，可體覺也。跡粗則加靜其心，心靜則跡自細，而息已微矣。跡造至無，則息已造<b>真息</b>息矣。較用<b>耳光</b>，得調更速。故古有調息不若調心之妙用也。年老耳聾之人，捨是體覺一訣，此步功夫終難入彀也。况覺乃性精，跡乃命末，是亦有性命相顧之義，先師太虛翁曾為高海留言之，謹採以補祖示之所未及。」", "i": 39}, {"t": "p", "s": "子辈不明动字，动者，以线索牵动言，即「掣」之别名也。既可以奔驰使之动，独不可以纯静使之宁乎。此大圣人，视心气之交，而善立方便，以惠后人也。丹书云：「鸡能抱卵心常听」，此要妙诀也。盖鸡之所以能生卵者，以暖气也。暖气止能温其壳，不能入其中，则以心引气入，其听也，一心注焉，心入则气入，得暖气而生矣。故母鸡虽有时出外，而常作侧耳势，其神之所注未尝少间也。神之所注，未尝少间，即暖气亦昼夜无间，而神活矣。神活者，由其心之先死也。人能死心，<b>元神</b>即活。死心非枯槁之谓，乃专一不分之谓也。佛云：「置心一处，无事不办。」心易走，即以气纯之，气易粗，即以心细之，如此而心焉有不定者乎。", "o": "子輩不明動字，動者，以線索牽動言，即「掣」之別名也。既可以奔馳使之動，獨不可以純靜使之寧乎。此大聖人，視心氣之交，而善立方便，以惠後人也。丹書云：「雞能抱卵心常聽」，此要妙訣也。蓋雞之所以能生卵者，以暖氣也。暖氣止能溫其殼，不能入其中，則以心引氣入，其聽也，一心注焉，心入則氣入，得暖氣而生矣。故母雞雖有時出外，而常作側耳勢，其神之所注未嘗少間也。神之所注，未嘗少間，卽暖氣亦晝夜無間，而神活矣。神活者，由其心之先死也。人能死心，<b>元神</b>卽活。死心非枯槁之謂，乃專一不分之謂也。佛云：「置心一處，無事不辦。」心易走，卽以氣純之，氣易粗，卽以心細之，如此而心焉有不定者乎。", "i": 40}, {"t": "p", "s": "大约昏沈、散乱二病，只要静功，日日无间，自有大休歇处。若不静坐时，虽有散乱，亦不自知。既知散乱，即是却散乱之机也。昏沈而不知，与昏沈而知，相去奚啻千里！不知之昏沈，真昏沈也。知之昏沈，非全昏沈也，清明在是矣。", "o": "大約昏沈、散亂二病，只要靜功，日日無間，自有大休歇處。若不靜坐時，雖有散亂，亦不自知。旣知散亂，卽是卻散亂之機也。昏沈而不知，與昏沈而知，相去奚啻千里！不知之昏沈，眞昏沈也。知之昏沈，非全昏沈也，清明在是矣。", "i": 41}, {"t": "p", "s": "散乱者，神驰也，昏沉者，神未清也。散乱易治，昏沉难医。譬之病焉，有痛有痒者，药之可也，昏沉则麻木不仁之症也。散者可以收之，乱者可以整之，若昏沉，则蠢蠢焉，冥冥焉。散乱尚有方所，至昏沉全是魄用事也。散乱尚有魂在，至昏沉则纯阴为主矣。静坐时欲睡去，便是昏沉。却昏沉，只在调息，息即口鼻出入之息，虽非<b>真息</b>，而<b>真息</b>之出入，亦于此寄焉。凡坐须要静心纯气，心何以静，用在息上，息之出入，惟心自知，不可使耳闻，不闻则细，细则清，闻则粗，粗则浊，浊则昏沉而欲睡，自然之理也。虽然心用在息上，又要善会，亦是不用之用，只要微微照听可耳。何谓照？即眼光自照。目惟<b>内视</b>而不外视，不外视而惺然者，即<b>内视</b>也，非寔有<b>内视</b>。何谓听？即<b>耳光</b>自听，耳惟<b>内听</b>而不外听。听者听其无声，视者视其无形。目不外视，耳不外听，则闭而欲内驰。惟<b>内视</b><b>内听</b>，则既不外肆，又不内驰，而中不昏沉矣，此即日月交精交光者也。", "o": "散亂者，神馳也，昏沉者，神未清也。散亂易治，昏沉難醫。譬之病焉，有痛有癢者，藥之可也，昏沉則麻木不仁之症也。散者可以收之，亂者可以整之，若昏沉，則蠢蠢焉，冥冥焉。散亂尚有方所，至昏沉全是魄用事也。散亂尚有魂在，至昏沉則純陰為主矣。靜坐時欲睡去，便是昏沉。卻昏沉，只在調息，息即口鼻出入之息，雖非<b>真息</b>，而<b>真息</b>之出入，亦於此寄焉。凡坐須要靜心純氣，心何以靜，用在息上，息之出入，惟心自知，不可使耳聞，不聞則細，細則清，聞則粗，粗則濁，濁則昏沉而欲睡，自然之理也。雖然心用在息上，又要善會，亦是不用之用，只要微微照聽可耳。何謂照？即眼光自照。目惟內視而不外視，不外視而惺然者，即內視也，非寔有內視。何謂聽？即<b>耳光</b>自聽，耳惟內聽而不外聽。聽者聽其無聲，視者視其無形。目不外視，耳不外聽，則閉而欲內馳。惟內視內聽，則既不外肆，又不內馳，而中不昏沉矣，此即日月交精交光者也。", "i": 42}, {"t": "p", "s": "昏沉欲睡，即起散步，神清再坐。清晨有暇，坐一炷香为妙。过午人事多扰，易落昏沉，然亦不必限定一炷香，只要诸缘放下，静坐片时，久久便有入头，不落昏睡矣。", "o": "昏沉欲睡，即起散步，神清再坐。清晨有暇，坐一炷香為妙。過午人事多擾，易落昏沉，然亦不必限定一炷香，只要諸緣放下，靜坐片時，久久便有入頭，不落昏睡矣。", "i": 43}, {"t": "h2", "s": "回光差谬章第五", "o": "回光差謬章第五", "i": 44}, {"t": "p", "s": "中国哲学书电子化计划", "o": "中國哲學書電子化計劃", "i": 45}, {"t": "p", "s": "祖师曰：诸子工夫，渐渐纯熟，然枯木嵒前错路多，正要细细开示。此中消息，身到方知，吾今则可以言矣。吾宗与禅学不同，有一步一步证验，请先言其差别处，然后再言证验。宗旨将行之际，预作方便，勿多用心，放教活泼泼地，令气和心适，然后入静。静时正要得机得窍，不可坐在无事中里，所谓无记，空也。万缘放下之中，惺惺自若也。又不可著意承当，凡太认真，即易有此。非谓不宜认真，但真消息，在若存若无之间，以有意无意得之可也。惺惺不昧之中，放下自若也。又不可堕于<b>蕴界</b>，所谓<b>蕴界</b>者，乃<b>五阴魔</b>用事。如一般入定，而槁木死灰之意多，大地阳春之意少。此则落阴界，其气冷，其息沉，且有许多寒衰景象，久之便堕木石。又不可随于万缘，如一入静，而无端众绪忽至，欲却之不能，随之反觉顺适，此名主为奴役，久之落于色欲界。上者生人，下者生狸奴中，若狐仙是也。彼在名山中，亦自受用，风月花果，琪树瑶草，三五百年受用去，多至数千年，然报尽还生诸趣中。此数者，皆差路也。差路既知，然后可求证验。", "o": "祖師曰：諸子工夫，漸漸純熟，然枯木嵒前錯路多，正要細細開示。此中消息，身到方知，吾今則可以言矣。吾宗與禪學不同，有一步一步證驗，請先言其差別處，然後再言證驗。宗旨將行之際，預作方便，勿多用心，放教活潑潑地，令氣和心適，然後入靜。靜時正要得機得竅，不可坐在無事中裏，所謂無記，空也。萬緣放下之中，惺惺自若也。又不可著意承當，凡太認真，即易有此。非謂不宜認真，但真消息，在若存若無之間，以有意無意得之可也。惺惺不昧之中，放下自若也。又不可墮於蘊界，所謂蘊界者，乃五陰魔用事。如一般入定，而槁木死灰之意多，大地陽春之意少。此則落陰界，其氣冷，其息沉，且有許多寒衰景象，久之便墮木石。又不可隨於萬緣，如一入靜，而無端眾緒忽至，欲卻之不能，隨之反覺順適，此名主為奴役，久之落於色欲界。上者生人，下者生狸奴中，若狐仙是也。彼在名山中，亦自受用，風月花果，琪樹瑤草，三五百年受用去，多至數千年，然報盡還生諸趣中。此數者，皆差路也。差路既知，然後可求證驗。", "i": 46}, {"t": "h2", "s": "回光证验章第六", "o": "回光證驗章第六", "i": 47}, {"t": "p", "s": "中国哲学书电子化计划", "o": "中國哲學書電子化計劃", "i": 48}, {"t": "p", "s": "祖师曰：证验亦多，不可以小根小器承当，必思度尽众生。不可以轻心慢心承当，必须请事斯语。静中绵绵无间，神情悦豫，如醉如浴，此为遍体阳和，<b>金华乍吐</b>也。既而万颧俱寂，皓月中天，觉大地俱是光明境界，此为心体开明，<b>金华正放</b>也。既而遍体充寔，不畏风霜，人当之兴味索然者，我遇之精神更旺，黄金起屋，白玉为台；世间腐朽之物，我以真气呵之立生；红血为乳，七尺肉团，无非金宝，此则<b>金华大凝</b>也。第一段是应《观无量寿增补经》：「日落大水，行树法象。」日落者，从混沌立基，无极也。上善若水，清而无暇，此即太极主宰，出震之帝也。震为木，故以行树象焉，七重行树，七窍光明也。西北乾方，移一位为坎，日落大水，乾坎之象也。坎为子方，冬至雷在地中，隐隐隆隆，至震而阳出地上矣，行树之象也，余可类而推之者。第二段即肇基于此，大地为冰，琉璃宝地，光明渐渐凝矣。所以有蓬台而继之佛现也，金性既现，非佛而何，佛者大觉金仙也。此大段证验耳。", "o": "祖師曰：證驗亦多，不可以小根小器承當，必思度盡眾生。不可以輕心慢心承當，必須請事斯語。靜中綿綿無間，神情悅豫，如醉如浴，此為遍體陽和，金華乍吐也。既而萬顴俱寂，皓月中天，覺大地俱是光明境界，此為心體開明，金華正放也。既而遍體充寔，不畏風霜，人當之興味索然者，我遇之精神更旺，黃金起屋，白玉為臺；世間腐朽之物，我以真氣呵之立生；紅血為乳，七尺肉團，無非金寶，此則金華大凝也。第一段是應《觀無量壽增補經》：「日落大水，行樹法象。」日落者，從混沌立基，無極也。上善若水，清而無暇，此即太極主宰，出震之帝也。震為木，故以行樹象焉，七重行樹，七竅光明也。西北乾方，移一位為坎，日落大水，乾坎之象也。坎為子方，冬至雷在地中，隱隱隆隆，至震而陽出地上矣，行樹之象也，餘可類而推之者。第二段即肇基於此，大地為冰，琉璃寶地，光明漸漸凝矣。所以有蓬臺而繼之佛現也，金性既現，非佛而何，佛者大覺金仙也。此大段證驗耳。", "i": 49}, {"t": "note", "s": "「山本此下载有宣示秘文。至此鸾笔忽停，时值月晦，倏大明亮，非日非月，而毫末不隐，异香充塞，空中隐隐闻有天乐，久之，鸾始飞舞，判曰：『此毘卢遮那如来光注也。』吾宗太上曾言：『惜我于无量劫前，位证无量寿主，境土极西，去今西牛贺洲十万八千里，国曰无量寿国，我于斯地，集诸同志，万五千人，即身即世，即世即身，以觉通性，灭度一切光明藏中，法界如琉璃，而大地行树，七宝凝成。人无男女，莲华化生，飞潜动植，无不咸若，寿亦无量』。今之阿弥陀佛国，即昔无量寿国也。今嵒于龙峤演说先天虚无太一<b>金华</b>宗旨，盖亦欲自此修证，可俾东土化成极乐国，善哉善哉。宏愿肇宣，宏运斯应，朕兆有开必先，<b>性光</b>无远勿届。今得感降祖<b>性光</b>注，福庇无量矣。祖性，即毘卢遮那如来也。长春邱祖亦降坛，训曰：『《金刚经》曰：如来者，无所从来，亦无所去，故名如来。心存则现，念隐即泯，泯现者迹耳，并无生灭者也。』其时众真咸会，各有颂赞，不能悉述，识其要训如此。此真八万劫一集之会，不期于龙峤遇之。得读是书者，慎毋自弃，裔孙太定谨识。此先哲石庵氏所志。今蒋氏所本乃中宗后裔，掩袭此书而抑北宗，故削去之，誊本亦然，兹特为补录。」", "o": "「山本此下載有宣示秘文。至此鸞筆忽停，時值月晦，倏大明亮，非日非月，而毫末不隱，異香充塞，空中隱隱聞有天樂，久之，鸞始飛舞，判曰：『此毘盧遮那如來光注也。』吾宗太上曾言：『惜我於無量劫前，位證無量壽主，境土極西，去今西牛賀洲十萬八千里，國曰無量壽國，我於斯地，集諸同志，萬五千人，即身即世，即世即身，以覺通性，滅度一切光明藏中，法界如琉璃，而大地行樹，七寶凝成。人無男女，蓮華化生，飛潛動植，無不咸若，壽亦無量』。今之阿彌陀佛國，即昔無量壽國也。今嵒於龍嶠演說先天虛無太一金華宗旨，蓋亦欲自此修證，可俾東土化成極樂國，善哉善哉。宏願肇宣，宏運斯應，朕兆有開必先，<b>性光</b>無遠勿屆。今得感降祖<b>性光</b>注，福庇無量矣。祖性，即毘盧遮那如來也。長春邱祖亦降壇，訓曰：『《金剛經》曰：如來者，無所從來，亦無所去，故名如來。心存則現，念隱即泯，泯現者跡耳，並無生滅者也。』其時眾真咸會，各有頌讚，不能悉述，識其要訓如此。此真八萬劫一集之會，不期於龍嶠遇之。得讀是書者，慎毋自棄，裔孫太定謹識。此先哲石菴氏所誌。今蔣氏所本乃中宗後裔，掩襲此書而抑北宗，故削去之，謄本亦然，茲特為補錄。」", "i": 50}, {"t": "p", "s": "现在可考证者有三：一则坐去，<b>神入谷中</b>，闻人说话，如隔里许，一一明了，而声入皆如谷中答响，未尝不闻，我未尝一闻，此为神在谷中，随时可以自验；一则静中，目光腾腾，满前皆白，如在云中，开眼觅身，无从觅视，此为<b>虚室生白</b>，内外通明，吉祥止止也；一则静中，肉身𬘡缊，如绵如玉，坐中若留不住，而腾腾上浮，此为<b>神归顶天</b>，久之上升可以立待。此三者，皆现在可验者也。然亦说不尽的，随人根器，各现殊胜。如《摩诃增补<b>止观</b>》中所云：「善根发相是也。」此事如人饮水，冷煖自知，须自己信得过方真。先天一炁，即在现前证验中自讨一炁，若得丹，亦立成此一粒真黍也。一粒复一粒从微而至著。有时时之先天，一粒是也，有统体之先天，一粒乃至无量也。一粒有一粒之力量，此要自己<mark>愿大</mark>，为第一义。", "o": "現在可考證者有三：一則坐去，<b>神入谷中</b>，聞人說話，如隔里許，一一明了，而聲入皆如谷中答響，未嘗不聞，我未嘗一聞，此為神在谷中，隨時可以自驗；一則靜中，目光騰騰，滿前皆白，如在雲中，開眼覓身，無從覓視，此為虛室生白，內外通明，吉祥止止也；一則靜中，肉身絪縕，如綿如玉，坐中若留不住，而騰騰上浮，此為神歸頂天，久之上昇可以立待。此三者，皆現在可驗者也。然亦說不盡的，隨人根器，各現殊勝。如《摩訶增補止觀》中所云：「善根發相是也。」此事如人飲水，冷煖自知，須自己信得過方真。先天一炁，即在現前證驗中自討一炁，若得丹，亦立成此一粒真黍也。一粒復一粒從微而至著。有時時之先天，一粒是也，有統體之先天，一粒乃至無量也。一粒有一粒之力量，此要自己願大，為第一義。", "i": 51}, {"t": "note", "s": "「蒋本誊本自家<mark>愿大</mark>改作胆大，此悮笔，是大有关系。盖<mark>愿大</mark>两字，即承根器而来，<mark>愿大</mark>者，大根大器人，非自了汉也。况上文功作，并无奇异，何须胆大乎？」", "o": "「蔣本謄本自家願大改作膽大，此悞筆，是大有關係。蓋願大兩字，即承根器而來，願大者，大根大器人，非自了漢也。況上文功作，並無奇異，何須膽大乎？」", "i": 52}, {"t": "h2", "s": "回光活法章第七", "o": "回光活法章第七", "i": 53}, {"t": "p", "s": "中国哲学书电子化计划", "o": "中國哲學書電子化計劃", "i": 54}, {"t": "p", "s": "祖师曰：<b>回光</b>循循然行去，不要废弃正业。古人云：「事来要应过，物来要识过。」子以正念治事，即光不为物转，当境即回。此时时无相之<b>回光</b>也。", "o": "祖師曰：<b>回光</b>循循然行去，不要廢棄正業。古人云：「事來要應過，物來要識過。」子以正念治事，即光不為物轉，當境即回。此時時無相之<b>回光</b>也。", "i": 55}, {"t": "p", "s": "日用间，能刻刻随事返照，不著一毫人我相。便是随地<b>回光</b>，此第一妙用。清晨能遣尽诸缘，静坐一、二时。最妙。凡应事接物，只用返法，便无一刻间断。如此行之两月三月，天上诸真，必来印证矣。", "o": "日用間，能刻刻隨事返照，不著一毫人我相。便是隨地<b>回光</b>，此第一妙用。清晨能遣盡諸緣，靜坐一、二時。最妙。凡應事接物，只用返法，便無一刻間斷。如此行之兩月三月，天上諸真，必來印證矣。", "i": 56}, {"t": "h2", "s": "逍遥诀章第八", "o": "逍遙訣章第八", "i": 57}, {"t": "p", "s": "中国哲学书电子化计划", "o": "中國哲學書電子化計劃", "i": 58}, {"t": "p", "s": "祖师曰：", "o": "祖師曰：", "i": 59}, {"t": "p", "s": "<mark>玉清留下逍遥诀</mark>，四字<span class=\"key\">凝神入气穴</span>。", "o": "玉清留下逍遙訣，四字凝神入氣穴。", "i": 60}, {"t": "p", "s": "六月俄看白雪飞，三更又见日轮赫。", "o": "六月俄看白雪飛，三更又見日輪赫。", "i": 61}, {"t": "p", "s": "水中吹起藉巽风，天上游归食坤德。", "o": "水中吹起藉巽風，天上遊歸食坤德。", "i": 62}, {"t": "p", "s": "更有一句玄中玄，无何有乡是真宅。", "o": "更有一句玄中玄，無何有鄉是真宅。", "i": 63}, {"t": "p", "s": "律诗一首，玄奥已尽。大道之要，不外<span class=\"key\">无为而为</span>四字。<mark>惟无为，故不滞方所形象</mark>，惟<span class=\"key\">无为而为</span>，故不堕顽空死虚。作用不外一中，而<span class=\"key\">枢机全在二目</span>。二目者，<b>斗柄</b>也，斡旋造化，转运阴阳，其大药则始终一水中金，而已。即水中铅。前言<b>回光</b>，乃指初机，从外以制内，即辅以得主。此为中、下之士，修下二关，以透上一关者也。今路头渐明，机括渐熟，天不爱道，直泄无上宗旨，诸子秘之秘之，勉之勉之！夫<b>回光</b>其总名耳。功夫进一层，则光华盛一番，回法更妙一番。前者由外制内，今则居中御外。前者即辅相主，今则奉主宣献，面目一大颠倒矣。法子欲入静，先调摄身心，自在安和，放下万缘，一丝不挂。<b>天心</b>正位乎中，然后两目垂帘，如奉圣旨，以召大臣，孰敢不至。次以二目内照坎宫，光华所到，真阳即出以应之。离外阳而内阴，乾体也。一阴入内而为主，随物生心，顺出流转，今<b>回光</b>内照，不随物生，阴气即住，而光华注照，则<b>纯阳</b>也。同类必亲，故坎阳上腾，非坎阳也，仍是乾阳应乾阳耳。二物一遇，便纽结不散，𬘡缊活动，倏来倏去，倏浮倏沉，自己元宫中，恍如太虚无量，徧身轻妙欲腾，所谓<b>云满千山</b>也。次则来往无踪，浮沉无辨，脉住气停，此则真交媾矣，所谓<b>月涵万水</b>也。使其杳冥中，忽然<b>天心</b>一动，此则<b>一阳来复</b>，<b>活子时</b>也。然而此中消息要细说。", "o": "律詩一首，玄奧已盡。大道之要，不外無為而為四字。惟無為，故不滯方所形象，惟無為而為，故不墮頑空死虛。作用不外一中，而樞機全在二目。二目者，<b>斗柄</b>也，斡旋造化，轉運陰陽，其大葯則始終一水中金，而已。即水中鉛。前言<b>回光</b>，乃指初機，從外以制內，即輔以得主。此為中、下之士，修下二關，以透上一關者也。今路頭漸明，機括漸熟，天不愛道，直泄無上宗旨，諸子秘之秘之，勉之勉之！夫<b>回光</b>其總名耳。功夫進一層，則光華盛一番，回法更妙一番。前者由外制內，今則居中御外。前者即輔相主，今則奉主宣獻，面目一大顛倒矣。法子欲入靜，先調攝身心，自在安和，放下萬緣，一絲不掛。<b>天心</b>正位乎中，然後兩目垂簾，如奉聖旨，以召大臣，孰敢不至。次以二目內照坎宮，光華所到，真陽即出以應之。離外陽而內陰，乾體也。一陰入內而為主，隨物生心，順出流轉，今<b>回光</b>內照，不隨物生，陰氣即住，而光華注照，則純陽也。同類必親，故坎陽上騰，非坎陽也，仍是乾陽應乾陽耳。二物一遇，便紐結不散，絪緼活動，倏來倏去，倏浮倏沉，自己元宮中，恍如太虛無量，徧身輕妙欲騰，所謂雲滿千山也。次則來往無踪，浮沉無辨，脈住氣停，此則真交媾矣，所謂月涵萬水也。使其杳冥中，忽然<b>天心</b>一動，此則一陽來復，活子時也。然而此中消息要細說。", "i": 64}, {"t": "note", "s": "「山本此下，载有王昆阳律师玄论。时为康熙戊辰秋，律师自北南来，馆于杭城宗阳宫，靖庵隐真往谒，呈上此书，律师郑重其仪，拜而阅之，曰：太上心传备于此矣。是乃即世圆行之功法，而淑世功验，亦于此下，不可偏在一身看。其大旨，微露在斡旋造化二句，虽无一字及普济，而此章内功缜密之中，正陶冶全世功法，不言世而世在其中。行功至此章，身世方有真验可得。二三子毋自歉，亦勿自恃，大行正有待也。乃命小子识之，今故附梓于后，后学者勉之。太定谨白。一得今按蒋本，此注不录，誊本亦不载，律师谓行有待，信矣。」", "o": "「山本此下，載有王崑陽律師玄論。時為康熙戊辰秋，律師自北南來，館於杭城宗陽宮，靖菴隱真往謁，呈上此書，律師鄭重其儀，拜而閱之，曰：太上心傳備於此矣。是乃即世圓行之功法，而淑世功驗，亦於此下，不可偏在一身看。其大旨，微露在斡旋造化二句，雖無一字及普濟，而此章內功縝密之中，正陶冶全世功法，不言世而世在其中。行功至此章，身世方有真驗可得。二三子毋自歉，亦勿自恃，大行正有待也。乃命小子識之，今故附梓於後，後學者勉之。太定謹白。一得今按蔣本，此註不錄，謄本亦不載，律師謂行有待，信矣。」", "i": 65}, {"t": "p", "s": "凡人一听，耳目逐物而动，物去则已，此之动静，全是民庶，而天君反随之役，是尝与鬼居矣。今令一动一静，皆与人俱，人乃真人。即身中天君也。彼动即与之俱动，动则天根也；静则与之俱静，静则月窟也；静动无端，亦与之为静动无端；休息上下，亦与之为休息上下，所谓天根月窟闲来往也。<b>天心</b>镇静，动违其时，则失之嫩；<b>天心</b>已动，而后动以应之，则失之老；<b>天心</b>一动，即以<b>真意</b>上升<b>乾宫</b>，而神光视顶，为导引焉，此动而应时者也。<b>天心</b>既升乾顶，游扬自得，忽而欲寂，急以<b>真意</b>引入黄庭，而目光视<b>中黄</b><b>神室</b>焉，既而欲寂者，一念不生矣。视内者，忽忘其视矣，尔时身心，便当一场大放，万缘泯迹，即我之<b>神室</b>鼎炉，亦不知在何所，欲觅己身，了不可得，此为天入地中，<b>众妙归根</b>之时也，即此便是<span class=\"key\">凝神入气穴</span>。夫一<b>回光</b>也，始而散者欲敛，六用不行，此为<b>涵养本原</b>，<b>添油接命</b>也。既而敛者，自然优游，不费纤毫之力，此为<b>安神祖窍</b>，<b>翕聚先天</b>也。既而影响俱灭，寂然大定，此为<b>蛰藏气穴</b>，<b>众妙归根</b>也。一节中具有三节，一节中具有九节，俱是后日发挥。今以一节中，具有三节言之，当其涵养而初静也。翕聚亦为涵养，蛰藏亦为涵养，至后而涵养皆蛰藏矣。中一层可类推，不易处而处分矣，此为无形之窍，千处万处一处也。不易时而时分焉，此为无候之时。元会运世一刻也。", "o": "凡人一聽，耳目逐物而動，物去則已，此之動靜，全是民庶，而天君反隨之役，是嘗與鬼居矣。今令一動一靜，皆與人俱，人乃真人。即身中天君也。彼動即與之俱動，動則天根也；靜則與之俱靜，靜則月窟也；靜動無端，亦與之為靜動無端；休息上下，亦與之為休息上下，所謂天根月窟閑來往也。<b>天心</b>鎮靜，動違其時，則失之嫩；<b>天心</b>已動，而後動以應之，則失之老；<b>天心</b>一動，即以<b>真意</b>上升乾宮，而神光視頂，為導引焉，此動而應時者也。<b>天心</b>既升乾頂，游揚自得，忽而欲寂，急以<b>真意</b>引入黃庭，而目光視中黃<b>神室</b>焉，既而欲寂者，一念不生矣。視內者，忽忘其視矣，爾時身心，便當一場大放，萬緣泯迹，即我之<b>神室</b>鼎爐，亦不知在何所，欲覓己身，了不可得，此為天入地中，眾妙歸根之時也，即此便是凝神入氣穴。夫一<b>回光</b>也，始而散者欲斂，六用不行，此為涵養本原，<b>添油接命</b>也。既而斂者，自然優游，不費纖毫之力，此為安神祖竅，<b>翕聚先天</b>也。既而影響俱滅，寂然大定，此為蟄藏氣穴，眾妙歸根也。一節中具有三節，一節中具有九節，俱是後日發揮。今以一節中，具有三節言之，當其涵養而初靜也。翕聚亦為涵養，蟄藏亦為涵養，至後而涵養皆蟄藏矣。中一層可類推，不易處而處分矣，此為無形之竅，千處萬處一處也。不易時而時分焉，此為無候之時。元會運世一刻也。", "i": 66}, {"t": "note", "s": "「谨按：无形之窍，<b>玄窍</b>是也。<mark>玄窍无处，三才尽在玄窍之中</mark>，何大何小，何远何近，何人何物，何身何世之有分限哉！无候之候，活时是也，<mark>活时无候，万古总在活时之中</mark>，何上元下元、春夏秋冬、子午卯酉、月日时刻之可执哉！然而欲开<b>玄窍</b>，须于活子活午者，动极而静，静极而动，窍之得体，盖于此耳。何为活子？万类无声，一机时振，而无所向者是。何为活午？万路齐开，一机时寂，而无所归者是。盖以窍无刻闭，机寂则现，机搅则隐，现则觉，隐则迷，觉则循真，迷则入惑。<span class=\"key\">欲启玄窍，绝无动运法</span>，惟在寂体。是故智者，但自栖神虚无，气机之动静，含光视之而已。亦不须作意寂定于其间，故能无入而不自得，<b>回光</b>妙诀盖如此。循是诀者，活子亦得，活午亦得，正子正午，或得或失，不出乎心。心为机所自出耳，是为正本清源之要旨。曰子曰午者，动与静，阴与阳，乃于此别。而得有后先，有清浊，有老嫩，乃在一节之中具有九节焉。其说繁琐，五种仙眷所自出，有非一言得了者。师故论云，俟后日发挥。」", "o": "「謹按：無形之竅，玄竅是也。玄竅無處，三才盡在玄竅之中，何大何小，何遠何近，何人何物，何身何世之有分限哉！無候之候，活時是也，活時無候，萬古總在活時之中，何上元下元、春夏秋冬、子午卯酉、月日時刻之可執哉！然而欲開玄竅，須於活子活午者，動極而靜，靜極而動，竅之得體，蓋於此耳。何為活子？萬類無聲，一機時振，而無所向者是。何為活午？萬路齊開，一機時寂，而無所歸者是。蓋以竅無刻閉，機寂則現，機攪則隱，現則覺，隱則迷，覺則循真，迷則入惑。欲啟玄竅，絕無動運法，惟在寂體。是故智者，但自棲神虛無，氣機之動靜，含光視之而已。亦不須作意寂定於其間，故能無入而不自得，<b>回光</b>妙訣蓋如此。循是訣者，活子亦得，活午亦得，正子正午，或得或失，不出乎心。心為機所自出耳，是為正本清源之要旨。曰子曰午者，動與靜，陰與陽，乃於此別。而得有後先，有清濁，有老嫩，乃在一節之中具有九節焉。其說繁瑣，五種仙眷所自出，有非一言得了者。師故論云，俟後日發揮。」", "i": 67}, {"t": "p", "s": "凡心非静极，则不能动，动动忘动，非本体之动也。故曰感于物而动，性之欲也，若不感于物而动，即天地之动也。不以天之动对天之性，句落下说个欲字，欲在有物也，此为出位之思，动而有动矣。一念不起，则正念乃生，此为<b>真意</b>。寂然大定中，而天机忽动，非无念之动乎，<span class=\"key\">无为而为</span>，即此意。诗首二句，全括<b>金华</b>作用。次二句是日月互体意，「六月」即离火也，「白雪飞」即离中真阴，将返乎坤也。「三更」即坎水也，「日轮」即坎中一阳将赫然而返乎乾也。取坎填离，即在其中。次二句说<b>斗柄</b>作用，升降全机，「水中」非坎乎？目为巽风，目光照入坎宫，摄召太阳之精是也。「天上」即<b>乾宫</b>，「游归食坤德」即神入照中，天入地中，养火也。末二句是指出诀中诀，诀中之诀，始终离不得，所谓洗心涤虑，为<b>沐浴</b>也。圣学以知止始，以止至善终，始乎无极，归乎无极。佛以无住而生心，为一大藏教旨。吾道以「致虚」二字，完性命全功。总之三教不过一句，为出死入生之神丹。「神丹」维何？曰<span class=\"key\">一切处无心</span>而已。吾道最秘者<b>沐浴</b>，如此一部全功，不过「空心」二字，足以了之，今一言指破，省却数十年参访矣。", "o": "凡心非靜極，則不能動，動動忘動，非本體之動也。故曰感於物而動，性之欲也，若不感於物而動，即天地之動也。不以天之動對天之性，句落下說箇欲字，欲在有物也，此為出位之思，動而有動矣。一念不起，則正念乃生，此為<b>真意</b>。寂然大定中，而天機忽動，非無念之動乎，無為而為，即此意。詩首二句，全括金華作用。次二句是日月互體意，「六月」即離火也，「白雪飛」即離中真陰，將返乎坤也。「三更」即坎水也，「日輪」即坎中一陽將赫然而返乎乾也。取坎填離，即在其中。次二句說<b>斗柄</b>作用，升降全機，「水中」非坎乎？目為巽風，目光照入坎宮，攝召太陽之精是也。「天上」即乾宮，「遊歸食坤德」即神入照中，天入地中，養火也。末二句是指出訣中訣，訣中之訣，始終離不得，所謂洗心滌慮，為<b>沐浴</b>也。聖學以知止始，以止至善終，始乎無極，歸乎無極。佛以無住而生心，為一大藏教旨。吾道以「致虛」二字，完性命全功。總之三教不過一句，為出死入生之神丹。「神丹」維何？曰一切處無心而已。吾道最秘者<b>沐浴</b>，如此一部全功，不過「空心」二字，足以了之，今一言指破，省卻數十年參訪矣。", "i": 68}, {"t": "p", "s": "子辈不明一节中具有三节，我以佛家「空、假、中」三观为喻，三观先空，看一切物皆空；次假，虽知其空，然不毁万物，仍于空中建立一切事；既不毁万物，而又不著万物，此为中观。当其修空观时，亦知万物不可毁，而又不著，此兼三观也。然毕竟以看得空为得力，故修空观。则空固空，假亦空，中亦空。修假观，是用上得力居多，则假固假，空亦假，中亦假。中道时亦作空想，然不名为空而名为中矣。亦作假观，然不名为假而名为中矣，至于中则不必言矣。吾虽有时单言离，有时兼说坎，究竟不曾移动一句。开口提云：<span class=\"key\">枢机全在二目</span>。所谓枢机者，用也，用即斡旋造化，非言造化止此也。六根七窍，悉是光明藏，岂取二目，而他概不问乎？用坎阳，仍用离光照摄，即此便明。朱子云阳讳玄，育北宗派，尝云：「瞎子不好修道，聋子不妨。」与吾言何异，特表其主辅轻重耳。日月原是一物，日中含真阴，是真月之精，月窟不在月而在日，所谓月之窟也，不然只须言月足矣。月中翕真阳，是真日之光，日光反在月中，所谓天之根也，不然只须言天足矣。一日一月，分开止是半个，合来方成一个全体。如一夫一妇，独居不成家室，有夫有妇，方算得一家完全。然而物难喻道，夫妇分开，不失为两人，日月分开，不成全体矣。知此则耳目犹是也。吾谓瞎子已无耳，聋子已无目，如此看来，说甚一物，说甚两物，说甚六根，六根一根也。说甚七窍，七窍一窍也。吾言只透露其相通处，所以不见有两，子辈专执其隔处，所以随处换却眼睛。", "o": "子輩不明一節中具有三節，我以佛家「空、假、中」三觀為喻，三觀先空，看一切物皆空；次假，雖知其空，然不毀萬物，仍於空中建立一切事；既不毀萬物，而又不著萬物，此為中觀。當其修空觀時，亦知萬物不可毀，而又不著，此兼三觀也。然畢竟以看得空為得力，故修空觀。則空固空，假亦空，中亦空。修假觀，是用上得力居多，則假固假，空亦假，中亦假。中道時亦作空想，然不名為空而名為中矣。亦作假觀，然不名為假而名為中矣，至於中則不必言矣。吾雖有時單言離，有時兼說坎，究竟不曾移動一句。開口提云：樞機全在二目。所謂樞機者，用也，用即斡旋造化，非言造化止此也。六根七竅，悉是光明藏，豈取二目，而他概不問乎？用坎陽，仍用離光照攝，即此便明。朱子雲陽諱玄，育北宗派，嘗云：「瞎子不好修道，聾子不妨。」與吾言何異，特表其主輔輕重耳。日月原是一物，日中含真陰，是真月之精，月窟不在月而在日，所謂月之窟也，不然只須言月足矣。月中翕真陽，是真日之光，日光反在月中，所謂天之根也，不然只須言天足矣。一日一月，分開止是半箇，合來方成一箇全體。如一夫一婦，獨居不成家室，有夫有婦，方算得一家完全。然而物難喻道，夫婦分開，不失為兩人，日月分開，不成全體矣。知此則耳目猶是也。吾謂瞎子已無耳，聾子已無目，如此看來，說甚一物，說甚兩物，說甚六根，六根一根也。說甚七竅，七竅一竅也。吾言只透露其相通處，所以不見有兩，子輩專執其隔處，所以隨處換卻眼睛。", "i": 69}, {"t": "h2", "s": "百日立基章第九", "o": "百日立基章第九", "i": 70}, {"t": "p", "s": "中国哲学书电子化计划", "o": "中國哲學書電子化計劃", "i": 71}, {"t": "p", "s": "祖师曰：《心印经》云：「<mark>回风混合，百日功灵</mark>。」总之立基百日，方有真光。如子辈尚是目光，非<b>神火</b>也，非<b>性光</b>也，非慧智炬烛也。回之百日，则精气自足，真阳自生，水中自有真火，以此持行，自然交媾，自然结胎，吾方在不识不知之天，而婴儿已成矣。<mark>若略作意，便是外道</mark>。", "o": "祖師曰：《心印經》云：「迴風混合，百日功靈。」總之立基百日，方有真光。如子輩尚是目光，非<b>神火</b>也，非<b>性光</b>也，非慧智炬燭也。回之百日，則精氣自足，真陽自生，水中自有真火，以此持行，自然交媾，自然結胎，吾方在不識不知之天，而嬰兒已成矣。<mark>若略作意，便是外道</mark>。", "i": 72}, {"t": "p", "s": "<b>百日立基</b>，非百日也。一日立基，非一日也。一息立基，非呼吸之谓也。息者自心也，自心为息，<b>元神</b>也，元气也，元精也。升降离合，悉从心起，有无虚寔，咸在念中。<mark>一息一生持</mark>，何止百日，然百日亦一息也。", "o": "<b>百日立基</b>，非百日也。一日立基，非一日也。一息立基，非呼吸之謂也。息者自心也，自心為息，<b>元神</b>也，元氣也，元精也。升降離合，悉從心起，有無虛寔，咸在念中。<mark>一息一生持</mark>，何止百日，然百日亦一息也。", "i": 73}, {"t": "p", "s": "百日只在得力，昼中得力，夜中受用，夜中得力，昼中受用。", "o": "百日只在得力，晝中得力，夜中受用，夜中得力，晝中受用。", "i": 74}, {"t": "p", "s": "<b>百日立基</b>，玉旨也。上真言语，无不与人身应。真师言语，无不与学人应。此是玄中之玄，不可解者也。<b>见性</b>乃知，所以学人，必求真师授记，任性发出，一一皆验。", "o": "<b>百日立基</b>，玉旨也。上真言語，無不與人身應。真師言語，無不與學人應。此是玄中之玄，不可解者也。見性乃知，所以學人，必求真師授記，任性發出，一一皆驗。", "i": 75}, {"t": "h2", "s": "性光识光章第十", "o": "性光識光章第十", "i": 76}, {"t": "p", "s": "中国哲学书电子化计划", "o": "中國哲學書電子化計劃", "i": 77}, {"t": "p", "s": "祖师曰：<b>回光</b>法，原道行止坐卧，只要自得机窍。吾前开示云：「<b>虚室生白</b>」，光非白也。但有一说，初未见光时，此为效验，若见为光，而有意著之，即落意识，非<b>性光</b>也。子不管他有光无光，只要无念生念。何谓无念？千休千处得；何为生念？一念一生持。此念乃正念，与平日念不同。今心为念，念者，现在心也。此心即光即药。凡人视物，任眼睛一照去，不及分别，此为<b>性光</b>，如镜之无心而照也，如水之无心而鉴也。少顷，即为「<b>识光</b>」，以其分别也。镜有影，已无镜矣；水有象，已非水矣。光有识，尚何光哉！", "o": "祖師曰：<b>回光</b>法，原道行止坐臥，只要自得機竅。吾前開示云：「虛室生白」，光非白也。但有一說，初未見光時，此為效驗，若見為光，而有意著之，即落意識，非<b>性光</b>也。子不管他有光無光，只要無念生念。何謂無念？千休千處得；何為生念？一念一生持。此念乃正念，與平日念不同。今心為念，念者，現在心也。此心即光即藥。凡人視物，任眼睛一照去，不及分別，此為<b>性光</b>，如鏡之無心而照也，如水之無心而鑑也。少頃，即為「識光」，以其分別也。鏡有影，已無鏡矣；水有象，已非水矣。光有識，尚何光哉！", "i": 78}, {"t": "p", "s": "子辈初则「<b>性光</b>」，转念则识，识起而光杳不可觅，非无光也，光已为识矣。黄帝曰：「声动不生声而生响」，即此义也。《楞严推勘入门》曰：「不在尘，不在识，惟选根」，此则何意？尘是外物，所谓器界也。与吾了不相涉，逐物则认物为己。物必有还，通还户牖，明还日月，将他为自，终非吾有。至于不汝还者，非汝而谁。明还日月，见日月之明无还也。天有无日月之时，人无有无见日月之性。若然，则分别日月者，还可与为吾有耶。不知因明暗而分别者，当明暗两忘之时，分别何在？故亦有还，此为内尘也。惟<b>见性</b>无还，见见之时，见非是见，则<b>见性</b>亦还矣。还者还其识流转之<b>见性</b>，即阿难使汝流转，心目为咎也。初言八还上七者，皆明其一一有还，姑留<b>见性</b>，以为阿难拄杖。究竟<b>见性</b>既带八识，非真不还也。最后并此一破，方为真<b>见性</b>，真不还矣。子等<b>回光</b>，正回其最初不还之光，故一毫识念用不著。使汝流转者，惟此六根，使汝成菩提者，亦惟此六根。而尘与识皆不用，非用根也，用其根中之性耳。今不堕识<b>回光</b>，则用根中之元性，落识而<b>回光</b>，则用根中之识性，毫厘之辨，乃在此也。", "o": "子輩初則「<b>性光</b>」，轉念則識，識起而光杳不可覓，非無光也，光已為識矣。黃帝曰：「聲動不生聲而生響」，即此義也。《楞嚴推勘入門》曰：「不在塵，不在識，惟選根」，此則何意？塵是外物，所謂器界也。與吾了不相涉，逐物則認物為己。物必有還，通還戶牖，明還日月，將他為自，終非吾有。至於不汝還者，非汝而誰。明還日月，見日月之明無還也。天有無日月之時，人無有無見日月之性。若然，則分別日月者，還可與為吾有耶。不知因明暗而分別者，當明暗兩忘之時，分別何在？故亦有還，此為內塵也。惟見性無還，見見之時，見非是見，則見性亦還矣。還者還其識流轉之見性，即阿難使汝流轉，心目為咎也。初言八還上七者，皆明其一一有還，姑留見性，以為阿難拄杖。究竟見性既帶八識，非真不還也。最後並此一破，方為真見性，真不還矣。子等<b>回光</b>，正回其最初不還之光，故一毫識念用不著。使汝流轉者，惟此六根，使汝成菩提者，亦惟此六根。而塵與識皆不用，非用根也，用其根中之性耳。今不墮識<b>回光</b>，則用根中之元性，落識而<b>回光</b>，則用根中之識性，毫釐之辨，乃在此也。", "i": 79}, {"t": "p", "s": "用心即为<b>识光</b>，放下乃为<b>性光</b>。毫厘千里，不可不辨。<mark>识不断，则神不生</mark>；心不空，则丹不结。", "o": "用心即為識光，放下乃為<b>性光</b>。毫釐千里，不可不辨。識不斷，則神不生；心不空，則丹不結。", "i": 80}, {"t": "p", "s": "<mark>心静则丹，心空即药</mark>。不著一物，是名心静，不留一物，是名心空。空见为空，空犹未空，<mark>空忘其空，斯为真空</mark>。", "o": "心靜則丹，心空即藥。不著一物，是名心靜，不留一物，是名心空。空見為空，空猶未空，空忘其空，斯為真空。", "i": 81}, {"t": "h2", "s": "坎离交媾章第十一", "o": "坎離交媾章第十一", "i": 82}, {"t": "p", "s": "中国哲学书电子化计划", "o": "中國哲學書電子化計劃", "i": 83}, {"t": "p", "s": "祖师曰：凡漏泄精神，动而交物者，皆离也。凡收转神识，静而中涵者，皆坎也。七窍之外走者为离，七窍之内返者为坎。一阴主于逐色随声，一阳主于返闻收见。坎离即阴阳，阴阳即性命，性命即身心，身心即神炁。一自敛息，精神不为境缘流转，即是真交。而沉默趺坐时，又无论矣。", "o": "祖師曰：凡漏泄精神，動而交物者，皆離也。凡收轉神識，靜而中涵者，皆坎也。七竅之外走者為離，七竅之內返者為坎。一陰主於逐色隨聲，一陽主於返聞收見。坎離即陰陽，陰陽即性命，性命即身心，身心即神炁。一自斂息，精神不為境緣流轉，即是真交。而沉默趺坐時，又無論矣。", "i": 84}, {"t": "h2", "s": "周天章第十二", "o": "週天章第十二", "i": 85}, {"t": "p", "s": "中国哲学书电子化计划", "o": "中國哲學書電子化計劃", "i": 86}, {"t": "p", "s": "祖师曰：<b>周天</b>非以气作主，以心到为妙诀。若毕竟如何<b>周天</b>，是助长也，无心而守，无意而行。仰观乎天，三百六十五度，刻刻变迁，而<b>斗枢</b>终古不移。蒋本誊本俱作<b>斗柄</b>。钱恬斋方伯藏本作北辰，朱石君中堂佩本亦作北辰，而注载当从龙峤本作<b>斗枢</b>。其下有注曰：<b>斗枢</b>，即北斗第三禄存星君，德合北极辰星，辰星者，镇星也，动而不出其极者，故北斗禄存星君亦自终古不移其处，斗为<b>天心</b>盖以此。邵子诗曰：冬至子之半，<b>天心</b>无改移。以其定若枢然，故曰<b>斗枢</b>。况按是书出自龙峤山房，世本不足据云。可见是书，都中自有陶本可采，蒋侍郎何故不之采？想必悮于王和尚也。吾心亦犹是也。心即<b>斗枢</b>，气即群星。吾身之气，四肢百骸，原是贯通，不要十分著力。于此煅炼<b>识神</b>，断除妄见，然后药生，药非有形之物，此<b>性光</b>也。而即先天之真炁，然必于大定后方见，<mark>并无采法，言采者大谬矣</mark>。见之既久，心地光明，自然心空漏尽，解脱尘海。若今日龙虎，明日水火，终成妄想。吾昔受火龙真人口诀如是，不知丹书所说更何如也。", "o": "祖師曰：週天非以氣作主，以心到為妙訣。若畢竟如何週天，是助長也，無心而守，無意而行。仰觀乎天，三百六十五度，刻刻變遷，而斗樞終古不移。蔣本謄本俱作<b>斗柄</b>。錢恬齋方伯藏本作北辰，朱石君中堂佩本亦作北辰，而註載當從龍嶠本作斗樞。其下有註曰：斗樞，即北斗第三祿存星君，德合北極辰星，辰星者，鎮星也，動而不出其極者，故北斗祿存星君亦自終古不移其處，斗為<b>天心</b>蓋以此。邵子詩曰：冬至子之半，<b>天心</b>無改移。以其定若樞然，故曰斗樞。况按是書出自龍嶠山房，世本不足據云。可見是書，都中自有陶本可採，蔣侍郎何故不之採？想必悞於王和尚也。吾心亦猶是也。心即斗樞，氣即羣星。吾身之氣，四肢百骸，原是貫通，不要十分著力。於此煅煉識神，斷除妄見，然後藥生，藥非有形之物，此<b>性光</b>也。而即先天之真炁，然必於大定後方見，並無採法，言採者大謬矣。見之既久，心地光明，自然心空漏盡，解脫塵海。若今日龍虎，明日水火，終成妄想。吾昔受火龍真人口訣如是，不知丹書所說更何如也。", "i": 87}, {"t": "p", "s": "一日有一<b>周天</b>，一刻有一<b>周天</b>，坎离交处，便是一周。我之交，即天之回旋也。未能休歇，所以有交之时，即有不交之时。然天之回旋，未尝少息。果能阴阳交泰，大地阳和，我之中宫正位，万物一时畅遂，即丹经<b>沐浴</b>法也。非<b>大周天</b>而何？石庵氏曰：居中有话，莫小用了。□今世本皆失采入。此中火候，寔寔有大小不同，究竟无大小可别。石庵氏曰：吾辈可以悟矣，小就惜哉！到得工夫自然，不知坎离为何物，天地为何等，孰为交，孰为一周两周，何处觅大小之分别耶？总之一身旋运难真。不真，见得极大亦小，真则一回旋，天地万物，悉与之回旋，即在方寸处，极小亦为极大。故<mark>金丹火候，全要行归自然</mark>。不自然，天地自还天地，万物各归万物。若欲强之使合，终不能合。即如天时亢旱，阴阳不和。乾坤未尝一日不周，然终见得有多少不自然处。我能转运阴阳，调摄自然，一时云蒸雨降，草木酣适，山河流畅，纵有乖戾，亦觉顿释，此即<b>大周天</b>也。", "o": "一日有一週天，一刻有一週天，坎離交處，便是一週。我之交，即天之回旋也。未能休歇，所以有交之時，即有不交之時。然天之回旋，未嘗少息。果能陰陽交泰，大地陽和，我之中宮正位，萬物一時暢遂，即丹經<b>沐浴</b>法也。非大週天而何？石菴氏曰：居中有話，莫小用了。□今世本皆失採入。此中火候，寔寔有大小不同，究竟無大小可別。石菴氏曰：吾輩可以悟矣，小就惜哉！到得工夫自然，不知坎離為何物，天地為何等，孰為交，孰為一週兩週，何處覓大小之分別耶？總之一身旋運難真。不真，見得極大亦小，真則一迴旋，天地萬物，悉與之迴旋，即在方寸處，極小亦為極大。故<b>金丹</b>火候，全要行歸自然。不自然，天地自還天地，萬物各歸萬物。若欲強之使合，終不能合。即如天時亢旱，陰陽不和。乾坤未嘗一日不週，然終見得有多少不自然處。我能轉運陰陽，調攝自然，一時雲蒸雨降，草木酣適，山河流暢，縱有乖戾，亦覺頓釋，此即<b>大周天</b>也。", "i": 88}, {"t": "note", "s": "「不可无此棒喝。不真即妄，毫厘而亿万亿也。治身得真，医世在其中矣。寂而体之，祖即以天时验内功，旨哉旨哉。」", "o": "「不可無此棒喝。不真即妄，毫釐而億萬億也。治身得真，醫世在其中矣。寂而體之，祖即以天時驗內功，旨哉旨哉。」", "i": 89}, {"t": "p", "s": "问：<b>活子时</b>其妙，必认定<b>正子时</b>，似著相？曰：不著相。不指明<b>正子时</b>，何从而识<b>活子时</b>，既识得<b>活子时</b>，确然又有<b>正子时</b>，是一是二，非正非活，总要人看得真，<mark>一真则无不正，无不活</mark>矣。见得不真，何者为活，何者为正耶。即如<b>活子时</b>，是时时见得的。毕竟到<b>正子时</b>，志气清明，<b>活子时</b>愈觉发现。若未识得活的，且只向正的时候验取，则正者现前，活者无不神妙矣。", "o": "問：活子時其妙，必認定正子時，似著相？曰：不著相。不指明正子時，何從而識活子時，既識得活子時，確然又有正子時，是一是二，非正非活，總要人看得真，一真則無不正，無不活矣。見得不真，何者為活，何者為正耶。即如活子時，是時時見得的。畢竟到正子時，志氣清明，活子時愈覺發現。若未識得活的，且只向正的時候驗取，則正者現前，活者無不神妙矣。", "i": 90}, {"t": "h2", "s": "劝世歌章第十三", "o": "勸世歌章第十三", "i": 91}, {"t": "p", "s": "中国哲学书电子化计划", "o": "中國哲學書電子化計劃", "i": 92}, {"t": "p", "s": "祖师曰：", "o": "祖師曰：", "i": 93}, {"t": "p", "s": "吾因度世丹衷热，不惜婆心并饶舌。", "o": "吾因度世丹衷熱，不惜婆心并饒舌。", "i": 94}, {"t": "p", "s": "世尊亦为大因缘，直指生死真可惜。", "o": "世尊亦為大因緣，直指生死真可惜。", "i": 95}, {"t": "p", "s": "老君也患有吾身，传示谷神人不识。", "o": "老君也患有吾身，傳示谷神人不識。", "i": 96}, {"t": "p", "s": "吾今略说寻真路：黄中通理载大易，", "o": "吾今略說尋真路：黃中通理載大易，", "i": 97}, {"t": "p", "s": "正位居体是玄关，子午中间堪<b>定息</b>。", "o": "正位居體是玄關，子午中間堪<b>定息</b>。", "i": 98}, {"t": "p", "s": "光回祖窍万神安，药产川源一炁出。", "o": "光回祖竅萬神安，藥產川源一炁出。", "i": 99}, {"t": "p", "s": "透幙变化有金光，一轮红日常赫赫。", "o": "透幙變化有金光，一輪紅日常赫赫。", "i": 100}, {"t": "p", "s": "世人错认坎离精，搬运心肾成间隔。", "o": "世人錯認坎離精，搬運心腎成間隔。", "i": 101}, {"t": "p", "s": "如何人道合<b>天心</b>，天若符兮道自合。", "o": "如何人道合<b>天心</b>，天若符兮道自合。", "i": 102}, {"t": "p", "s": "万缘放下毫不起，此是先天真无极。", "o": "萬緣放下毫不起，此是先天真無極。", "i": 103}, {"t": "p", "s": "太虚穆穆朕兆捐，性命关头忘意识。", "o": "太虛穆穆朕兆捐，性命關頭忘意識。", "i": 104}, {"t": "p", "s": "意识忘后见本真，水清珠见玄难测。", "o": "意識忘後見本真，水清珠見玄難測。", "i": 105}, {"t": "p", "s": "无始烦障一旦空，玉清降下九龙册。", "o": "無始煩障一旦空，玉清降下九龍冊。", "i": 106}, {"t": "p", "s": "步霄汉兮登天阙，掌风霆兮驱霹雳。", "o": "步霄漢兮登天闕，掌風霆兮驅霹靂。", "i": 107}, {"t": "p", "s": "凝神<b>定息</b>是初机，退藏密地是常寂。", "o": "凝神<b>定息</b>是初機，退藏密地是常寂。", "i": 108}, {"t": "p", "s": "吾昔度张珍奴二词，会有宗旨。「子后午前」非时也，坎离耳。「<b>定息</b>」者，息息归根，<b>中黄</b>也。坐者，心不动也。夹脊者，非背上轮子，乃直透玉淸大路也。双关者，此处有难言。忌忘神守，而贵虚寂与无。所守，守此义也。液于是化，血于是成。而后于是返先天，气于是返神，神于是还虚，虚于是合道，道于是圆志，志于是满愿。诀不胜述，此处是也。此十三句惟我宗坛遣册有之。至如地雷震动由头者，真气生也。黄芽出土者，真药生也。而基皆筑于神守双关也。此一句亦惟宗坛遣册有之。小小二段，已尽修行大路，明此可不惑于人言。", "o": "吾昔度張珍奴二詞，會有宗旨。「子後午前」非時也，坎離耳。「<b>定息</b>」者，息息歸根，中黃也。坐者，心不動也。夾脊者，非背上輪子，乃直透玉淸大路也。雙關者，此處有難言。忌忘神守，而貴虛寂與無。所守，守此義也。液於是化，血於是成。而後於是返先天，氣於是返神，神於是還虛，虛於是合道，道於是圓志，志於是滿願。訣不勝述，此處是也。此十三句惟我宗壇遣冊有之。至如地雷震動由頭者，眞氣生也。黃芽出土者，眞藥生也。而基皆築於神守雙關也。此一句亦惟宗壇遣冊有之。小小二段，已盡修行大路，明此可不惑於人言。", "i": 109}, {"t": "p", "s": "昔夫子与颜子登太山顶，望吴门白马，颜子见为疋练，太用眼力，神光走落，故致蚤死。<b>回光</b>可不勉哉！", "o": "昔夫子與顏子登太山頂，望吳門白馬，顏子見為疋練，太用眼力，神光走落，故致蚤死。<b>回光</b>可不勉哉！", "i": 110}, {"t": "p", "s": "<b>回光</b>在纯心行去，只将<b>真息</b>凝照于中宫，久之自然通灵达变也。总是心静气定为基，心忘气凝为效，气息心空为丹成，心气浑一为温养，明心<b>见性</b>为了道。子辈各宜勉力行去，错过光阴可惜也。七子勉之！<mark>一日不行，一日即鬼也</mark>。一息行此，一息真仙也。参赞化育，其基于此。七子勉之！", "o": "<b>回光</b>在純心行去，只將<b>真息</b>凝照於中宮，久之自然通靈達變也。總是心靜氣定為基，心忘氣凝為效，氣息心空為丹成，心氣渾一為溫養，明心見性為了道。子輩各宜勉力行去，錯過光陰可惜也。七子勉之！<mark>一日不行，一日即鬼也</mark>。一息行此，一息真仙也。參贊化育，其基於此。七子勉之！", "i": 111}, {"t": "p", "s": "吕祖师先天虚无太乙<b>金华</b>宗旨终", "o": "呂祖師先天虛無太乙金華宗旨終", "i": 112}];
