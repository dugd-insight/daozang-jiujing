：道不负人，人乃负道。", "o": "註曰：人問世所重之極至者日富、日貴，二者皆人之所欲也，故天下之人，莫不央其<b>性命</b>之情，盡其平生之志，爭先力求而以得之為快也。觀其所以然者，無過浸淫於利祿聲色而已矣。殊不知利祿聲色，實為伐<b>性命</b>之戈矛，囚一身之桂桔。夫世之人不明道德<b>性命</b>之妙，惟饕利祿，日恣責瞋，汨沒愛河，漂流慾海，是非、人我交戰，胸中喜怒哀樂互殘軀體，是致尸魔，促其氣壽。寒暑削其容光，不覺在生一世，瞥然水上之嘔。光景百年，瞬若石中之火。縱使金高北斗，玉等南山，迨至無常，而欲買身，使不為螻蟻之窟穴可乎。哀哉，痛哉！命未告終，真靈已投於別殼矣。虛靜天師曰：今生不覺，別後換殼，投入別殼，展轉不覺。吁！與其不覺投於異類，曷容棲遲於大道耶。道遂功成，身超碧落，乘雲氣，御飛龍，而游乎無極，死生不變乎己，而位號真人矣。至此乃大丈夫得意之秋，至榮至顯之日也。若乃區區俗務，碌碌塵心，而墮於世網者，縱負班、馬之雄才，兼有蘇、張之榮顯，抑不過為土上之游魂，行屍之陰鬼耳，烏云為真大丈夫哉。是以仙翁首詠是章，蓋於時達高明之士言之，可因一言而自悟，速求大道出離迷塗，為無為事，乃真大丈夫，降此俱無足取。參學弟子宗源日觀仙翁之詩、無名子之註，而不省悟者，真愚冥之甚也，見聞之士可不下手速修耶。別本註曰：難莫難於遇人，易莫易於成道。現宰官長者之身，結同志得道之友，鍊一黍於一霎之中，立地成道。然紆朱懷金，門深似海，有道之士，望望然去之，此遇人之難成道之易也。易莫易於遇人，難莫難於成道，百錢掛杖，四海一身，風植靈根，親傳至道。然龍虎之文易解，<b>刀圭</b>之鎖難開，得藥忘言，鍊鉛無計，遇此人之易，成道之難也。安得親扣玄關，二者俱全哉。仙翁瞻游成都，遇青城丈人，得傳金液還丹之道，警歎成道之難，故作是詩，以結丹友。其章云：試問堆金等山嶽，無常買得不來無。辭意近切如此。雖有拱璧以先駟馬，不如坐進此道。仙翁遠矣，高山流水，落落知音。子野陸墅曰：道不負人，人乃負道。", "i": 10}, {"t": "p", "s": "人生虽有百年期，寿夭穷通莫预知。昨日街头方走马，今朝棺内已眠尸。", "o": "人生雖有百年期，壽夭窮通莫預知。昨日街頭方走馬，今朝棺內已眠屍。", "i": 11}, {"t": "p", "s": "妻财抛下非君有，罪业将行难自欺。大药不求争得遇，知之不炼是愚痴。", "o": "妻財拋下非君有，罪業將行難自欺。大藥不求爭得遇，知之不鍊是愚癡。", "i": 12}, {"t": "note", "s": "注云：人寿夭穷通、富贵贫贱，未有不默意于未然之先，然非常人可测度而预知之者。故人寿虽日百年，迨其七十固已稀矣。今以有限易摧之身，终日汨汨而逐无涯不测之事，不亦难乎。一息不来，则茶然疲投而不知所归，可不谓之大哀耶。是以昨方走马，今日眠尸，出息不保入息者也。当斯之时，虽则荣耀居极品俸禄，至万钟家丰无价之珍，室美倾城之态，悉皆抛下，非己有也。所可与之偕行而不可欺者，昔所造之罪业而已。所以万般将不去，惟有业随身也。夫人欲免轮回而不堕于世网者，莫若<b>金丹</b>大药，为升天之灵梯，超几之捷径也。其道至简至易，虽愚昧小人得而行之，亦立跻圣位。奈何上圣秘重，不许轻泄，传之者皆口口相授，不记文字，是以难遇也。自匪勤求苦志，诚动高穹，未或闻于一二也。昔谢自然以玆道之难遇，欲求真师于蓬莱，竭其家产以备舟楫，不顾洪涛巨浪之厄，直往而不少惮，遂感神人而语之曰：蓬莱隔弱水三万里，一芥不为之浮，子将安往。赤城山有司马子微在焉，子往师之。谢回舟寻访赤城，果遇子微授道，修之不辍，不数载白日升天。噫！人之精诚一发于中，感格于神人者，将无往而不遇矣。人苟能操心秉志如此，奚虑<b>金丹</b>不得耶。道不负人，人自负之耳。《参同契》曰：大道无适莫兮，惟传于贤者。倘不推诚而力慕，争得遇之耶。惟夫<b>金丹</b>秘要诚难遇矣，得遇之者，皆风有仙骨，祖宗阴德累积深厚也。然亦须有财力，丹友三人，方能成就。此理惟达者知，诚难一一具言也。阴真君《六五精微论》曰：欲学此道，须假资财。如无资财，<b>金丹</b>即不成也。又须三人，方可修炼。所以冲熙王君遇仙人刘海蟾，得<b>金丹</b>衍，无财下工，遂入洛谒富韩公，赖其力成道而去。苟通之而又有力，不早修炼者，不亦愚痴之甚乎。仙翁赠刘君诗曰：闻君知药已多年，何不收心炼汞铅。莫教烛被风吹灭，六道轮回莫怨天。亦此意也。别本注曰：麟凤不出世，神仙不常见。有能空梦泡幻影之身，可脱生死老病之苦，为人间希有之事。道上逢师，师边得旨，下手速修犹太迟耳。仙翁非是诗，其末章云：大道不求争得遇，知之不炼是愚痴。其叮咛恳切如此语。侪。如未闻则已，既遇至人，岂容痴钝。中夜以，兴，行其素愿，结半辰之黍米，抱九载之灵胎，以藏太虚，神游八极，露紫云之半面，应仙谶于洪都，罔俾旌阳，专翼晋代。", "o": "註云：人壽夭窮通、富貴貧賤，未有不默意於未然之先，然非常人可測度而預知之者。故人壽雖日百年，迨其七十固已稀矣。今以有限易摧之身，終日汨汨而逐無涯不測之事，不亦難乎。一息不來，則茶然疲投而不知所歸，可不謂之大哀耶。是以昨方走馬，今日眠屍，出息不保入息者也。當斯之時，雖則榮耀居極品俸祿，至萬鐘家豐無價之珍，室美傾城之態，悉皆拋下，非己有也。所可與之偕行而不可欺者，昔所造之罪業而已。所以萬般將不去，惟有業隨身也。夫人欲免輪迴而不墮於世網者，莫若<b>金丹</b>大藥，為升天之靈梯，超几之捷徑也。其道至簡至易，雖愚昧小人得而行之，亦立躋聖位。奈何上聖祕重，不許輕泄，傳之者皆口口相授，不記文字，是以難遇也。自匪勤求苦志，誠動高穹，未或聞於一二也。昔謝自然以玆道之難遇，欲求真師於蓬萊，竭其家產以備舟楫，不顧洪濤巨浪之厄，直往而不少憚，遂感神人而語之曰：蓬萊隔弱水三萬里，一芥不為之浮，子將安往。赤城山有司馬子微在焉，子往師之。謝回舟尋訪赤城，果遇子微授道，修之不輟，不數載白日昇天。噫！人之精誠一發於中，感格於神人者，將無往而不遇矣。人苟能操心秉志如此，奚慮<b>金丹</b>不得耶。道不負人，人自負之耳。《參同契》曰：大道無適莫兮，惟傳於賢者。倘不推誠而力慕，爭得遇之耶。惟夫<b>金丹</b>祕要誠難遇矣，得遇之者，皆風有仙骨，祖宗陰德累積深厚也。然亦須有財力，丹友三人，方能成就。此理惟達者知，誠難一一具言也。陰真君《六五精微論》曰：欲學此道，須假資財。如無資財，<b>金丹</b>即不成也。又須三人，方可修鍊。所以沖熙王君遇仙人劉海蟾，得<b>金丹</b>衍，無財下工，遂入洛謁富韓公，賴其力成道而去。苟通之而又有力，不早修鍊者，不亦愚癡之甚乎。仙翁贈劉君詩曰：聞君知藥已多年，何不收心鍊汞鉛。莫教燭被風吹滅，六道輪迴莫怨天。亦此意也。別本註曰：麟鳳不出世，神仙不常見。有能空夢泡幻影之身，可脫生死老病之苦，為人間希有之事。道上逢師，師邊得旨，下手速修猶太遲耳。仙翁非是詩，其末章云：大道不求爭得遇，知之不鍊是愚癡。其叮嚀懇切如此語。儕。如未聞則已，既遇至人，豈容癡鈍。中夜以，興，行其素願，結半辰之黍米，抱九載之靈胎，以藏太虛，神遊八極，露紫雲之半面，應仙讖於洪都，罔俾旌陽，專翼晉代。", "i": 13}, {"t": "note", "s": "疏曰：果州谢真人上升，在州城西门外金泉山，贞元十一年月十二日，白昼轻举，州人尽见。时郡守李坚以状闻，且为之传。上赐诏褒谕曰：所部之中，灵仙表异，玄风益振，至道弥张。韩昌黎诗曰：果州南充县，寒如谢自然。童骇无所知，但闻有神仙。轻生学其衍，乃在金泉山。一朝坐虚空，云雾生其间如聆竿笙韵，来自冥冥天。须臾自轻举，飘若云中烟。里胥上其事，郡守警且叹。驱车领官吏，屹俗争相先。入门无所见，冠屦如蜕蝉。皆云神仙事，的的信可传。王伯厚《困学纪闻》载：王荃，字半真。岐下阳平人。元丰中，赐冲熙处士。张芸史为功行碑，谓超世之姿，与陈图南伴。程伊川先生不闻作诗，惟寄王子真诗云：我亦有丹君信否，用时还解济斯民。伊川先生入嵩山，子真已候于松下，问何以知之，曰：去年已有消息来矣。盖先生前年欲往，以事而止。又《改斋馒录》载：王荃，字子真，有道之士。富郑公尝客之。元丰中，神宗赐号冲熙处士。元符三年，游茅山，受上清录。先是，茅山中峰石洞忽开，乃华阳洞天便门也，自左元放仙去即开阅千载矣，至是复开。又前期累日甘露降，道士刘混康曰：此铃有异。无何，先生至受录之夕，仙乐闻于空，浮之上。山中刻石载其事。", "o": "疏曰：果州謝真人上昇，在州城西門外金泉山，貞元十一年月十二日，白晝輕舉，州人盡見。時郡守李堅以狀聞，且為之傳。上賜詔褒諭曰：所部之中，靈仙表異，玄風益振，至道彌張。韓昌黎詩曰：果州南充縣，寒如謝自然。童駭無所知，但聞有神仙。輕生學其衍，乃在金泉山。一朝坐虛空，雲霧生其間如聆竿笙韻，來自冥冥天。須臾自輕舉，飄若雲中煙。里胥上其事，郡守警且嘆。驅車領官吏，屹俗爭相先。入門無所見，冠屨如蛻蟬。皆云神仙事，的的信可傳。王伯厚《困學紀聞》載：王荃，字半真。岐下陽平人。元豐中，賜沖熙處士。張芸史為功行碑，謂超世之姿，與陳圖南伴。程伊川先生不聞作詩，惟寄王子真詩云：我亦有丹君信否，用時還解濟斯民。伊川先生入嵩山，子真已候於松下，問何以知之，曰：去年已有消息來矣。蓋先生前年欲往，以事而止。又《改齋饅錄》載：王荃，字子真，有道之士。富鄭公嘗客之。元豐中，神宗賜號沖熙處士。元符三年，游茅山，受上清錄。先是，茅山中峰石洞忽開，乃華陽洞天便門也，自左元放仙去即開閱千載矣，至是復開。又前期累日甘露降，道士劉混康曰：此鈴有異。無何，先生至受錄之夕，仙樂聞于空，浮之上。山中刻石載其事。", "i": 14}, {"t": "p", "s": "草木<b>阴阳</b>亦两齐，若还阙一不芳菲。", "o": "草木陰陽亦兩齊，若還闕一不芳菲。", "i": 15}, {"t": "p", "s": "初开绿叶阳先倡，次发红花阴后随。", "o": "初開綠葉陽先倡，次發紅花陰後隨。", "i": 16}, {"t": "p", "s": "常道即玆为日用，真源返此有谁知。", "o": "常道即玆為日用，真源返此有誰知。", "i": 17}, {"t": "p", "s": "报言学道诸君子，不识<b>阴阳</b>莫乱为。", "o": "報言學道諸君子，不識陰陽莫亂為。", "i": 18}, {"t": "note", "s": "注曰：草木未生之初，含孕至朴。及其甲拆，禀一气以萌芽。故抽一干以象一气，次分两叶以象<b>阴阳</b>。又于两叶中间复抽一药，以应三才。过此已往，渐渐支离，花叶芬菲。春以之生而开绿叶，夏以之长而发红花，此阳气使之然也。秋以之肃而结实，冬以之杀而粪本，此阴气使之然也。<b>阴阳</b>两齐，化生不已，若还缺一，则万物不生。故真一子曰：孤阴不自产，寡阳不自成。是以天地氤氲，万物化醇。男女媾精，万物化生。常道即玆，以为日用。真源反复，有<b>阴阳</b>颠倒互用之机，人能炼之，可以超生死。学者苟不明此而反我者，乃蒙蔽耳。", "o": "註曰：草木未生之初，含孕至朴。及其甲拆，稟一氣以萌芽。故抽一榦以象一氣，次分兩葉以象陰陽。又於兩葉中間復抽一藥，以應三才。過此已往，漸漸支離，花葉芬菲。春以之生而開綠葉，夏以之長而發紅花，此陽氣使之然也。秋以之肅而結實，冬以之殺而糞本，此陰氣使之然也。陰陽兩齊，化生不已，若還缺一，則萬物不生。故真一子曰：孤陰不自產，寡陽不自成。是以天地氤氳，萬物化醇。男女媾精，萬物化生。常道即玆，以為日用。真源反覆，有陰陽顛倒互用之機，人能鍊之，可以超生死。學者苟不明此而反我者，乃蒙蔽耳。", "i": 19}, {"t": "p", "s": "阳裹阴精质不刚一作，莫把孤阴为有阳，独修一物转赢廷。劳形按引皆非道，服气餐霞总是狂。举世馒求<b>铅汞</b>伏，何时得见虎龙降。劝君穷取生身处，返本还元是药王。", "o": "陽裹陰精質不剛一作，莫把孤陰為有陽，獨修一物轉贏廷。勞形按引皆非道，服氣餐霞總是狂。舉世饅求鉛汞伏，何時得見虎龍降。勸君窮取生身處，返本還元是藥王。", "i": 20}, {"t": "note", "s": "注曰：阳裹阴精，己之真精也。精能生气，气能生神，荣卫一身，莫大于此，油桔灯灭，髓竭人亡。此言精气实一身之根本也，奈何此物属阴，其质不刚，其性好飞，日逐前后便溺、涕唾汗泪，易失难擒，不受制炼，故圣人谓之太阳流光，其性猛烈，若不得混元真一，阳丹以制之，兼以阴中阳火以育之，则无由凝结以成变化。若只修此一物，转见廷赢。按引劳形，皆非正道。养霞服气，总是狂图。设使吞日月之精华，光生五藏，运双关于夹脊，脑补精还，以至尸解投胎，出神入定，千门万法，不过修阳裹阴精一物而已。孤阴无阳，如牝鸡自卯，欲抱成鸡，岂可得乎。钟离公曰：涕唾精津气血液，七般物事总皆阴。若将此物为仙质，怎得飞神贯玉京。以此言之，一身之中，非惟真精一物属阴，五脏六腑俱阴非阳。分心肾为<b>坎离</b>，以肝肺为<b>龙虎</b>，得乎？用神气为子母，执津液为<b>铅汞</b>，得乎？若执此等治身而求纯阳之证，犹如去玲加冰，除热用汤，飞龟飞蛇，愈见乖张。《参同契》曰：使二女同居，颜色甚殊，苏秦通言，张仪结媒，发辨利舌，奋为美辞，推心调合，谐为夫妇，弊发腐齿，终不相知。此喻以女妻女，以阴炼阴，安能有产化之道哉。真龙真虎者，一八是也。<b>真铅</b><b>真汞</b>者，<b>龙虎</b>二弦之气也。此道至简不繁，至近匪遥，但学者执僻坚，以傍门非类之药为<b>铅汞</b>，及以大道真诀为非，深可悲伤。故钟离公曰：求仙不识<b>真铅</b>汞，护读丹经千万篇。不识个中含蓄意，谤他真语作虚言。故仙翁直指<b>铅汞</b>所产川源之处，身从何生，命从何立。返此之本，还此之源，颠倒修之，则真龙真虎自降，<b>真铅</b><b>真汞</b>自伏。非药之王，其孰能与于此哉。近世多矣，十六岁童男童女，使之交合，泄而成胎，谓之胎元丹，谓之紫河车，以此为<b>金丹</b>大药，是犹接竹点月，不亦远之愈远乎。后天地生有形有质者，皆非至药。盖形而下者，非先天之道也。又上阳子曰：《契》云：是非历藏法，内视有所思，阴道厌九一，浊乱弄元胞，诸衍甚众多，千条有万余。彭真人曰：世人不达大道之宗元，而趋傍门之曲迳，此属多般皆为左道，乖讹天理，悖乱至真，不达黄帝之文，全失老君之旨，本期永寿，反尔伤身。仆曰：只为世人执己而修，则千条万径无非傍门者矣。仙翁垂悯直言，穷取生身处，岂不直露天机。此正合钟离公云：生我之门、死我之户。大哉，上贤说道，下稍无人承当何哉？绿为世人因业识中来，却又因业识中去。一阳奔走于形，虽男子身中皆阴，若执一己而修，岂能还其元而返其本，又将何而回阳换骨哉。是以大修行人，求先天<b>真铅</b>，叉从一初受气生身之处求之，方可得彼先天真一气，以还其元而返其本也，此为男子修仙之道。女人修行，则以乳房为生气所，其法充简。是以男子修仙日炼气，女人修仙曰链形。坎女修炼，先积气于乳房，然后安炉立鼎，行太阴链形之法，其道易成者，良有旨。宣和中，洞宾游吴兴，见一妓张珍奴，色华美，性澹素，虽落风尘，每夕沐浴更衣灶香告天，求脱去甚切。洞宾作一士访之，珍奴见之，风神秀异，殊敬尽欢而去。明日又至，如是往往月余，终不及乱。张珍奴曰：荷君春顾甚久，独不留一宿，罄枕席之欢娱，岂妾猥漏，不足奉君子耶？士曰：不然。人贵心相知，何叉如此哉。且如汝每夜告天，实何所求。珍曰：失身于此，又将何为。但自念奴入是门中，妄施粉黛，以假为真，歌枢艳曲，以悲为乐。本是一团臭脓皮袋，借为饰以惑人，每每悔叹，世之愚夫不自尊贵。过我门者，观我如一枝花，情牵意恋，留恋不拾，非但求财，多致身顶。妾虽假容交惧，觉办愈重，惟旦夕告天，早析了脱。士曰：汝志如此，何不学道。珍奴曰：陷于此地，何从得师。士曰：吾为汝师可乎。珍即拜叩。士曰：再来乃可。遂去。珍日夜望不至，深自悔恨，自书曰：逢师许多时，不说些兄个。安得仍前相对坐，懊恨韶光空自过。直到如今问头我。笔未竟，士忽来见，所书读其韵曰：别无巧妙与，你方见一个。子后午前定息坐，夹脊双关昆仑过。急时得气力思量我。珍大喜，士乃以太阴链形丹法与之。珍自是神气裕然，若大开悟。不知密有，所传尤多，珍亦不以告人。临别留步蟾官云：<b>坎离</b><b>坤</b>兑分子午，须认取自家宗祖。地雷震动山头雨，要洗濯黄芽出土。捉得金精牢闭固，辨甲庚要生<b>龙虎</b>。待他问汝甚传人，但说先生姓吕。珍方悟是吕先生。即佯狂，丐于市，投荒地密修真诀，愈三年，尸解而去。修行事不问男女，若勇猛心坚成道爻矣。", "o": "註曰：陽裹陰精，己之真精也。精能生氣，氣能生神，榮衛一身，莫大於此，油桔燈滅，髓竭人亡。此言精氣實一身之根本也，奈何此物屬陰，其質不剛，其性好飛，日逐前後便溺、涕唾汗淚，易失難擒，不受制鍊，故聖人謂之太陽流光，其性猛烈，若不得混元真一，陽丹以制之，兼以陰中陽火以育之，則無由凝結以成變化。若只修此一物，轉見廷贏。按引勞形，皆非正道。養霞服氣，總是狂圖。設使吞日月之精華，光生五藏，運雙關於夾脊，腦補精還，以至尸解投胎，出神入定，千門萬法，不過修陽裹陰精一物而已。孤陰無陽，如牝雞自卯，欲抱成雞，豈可得乎。鍾離公曰：涕唾精津氣血液，七般物事總皆陰。若將此物為仙質，怎得飛神貫玉京。以此言之，一身之中，非惟真精一物屬陰，五臟六腑俱陰非陽。分心腎為坎離，以肝肺為龍虎，得乎？用神氣為子母，執津液為鉛汞，得乎？若執此等治身而求純陽之證，猶如去玲加冰，除熱用湯，飛龜飛蛇，愈見乖張。《參同契》曰：使二女同居，顏色甚殊，蘇秦通言，張儀結媒，發辨利舌，奮為美辭，推心調合，諧為夫婦，弊髮腐齒，終不相知。此喻以女妻女，以陰鍊陰，安能有產化之道哉。真龍真虎者，一八是也。真鉛<b>真汞</b>者，龍虎二弦之氣也。此道至簡不繁，至近匪遙，但學者執僻堅，以傍門非類之藥為鉛汞，及以大道真訣為非，深可悲傷。故鍾離公曰：求仙不識真鉛汞，護讀丹經千萬篇。不識箇中含蓄意，謗他真語作虛言。故仙翁直指鉛汞所產川源之處，身從何生，命從何立。返此之本，還此之源，顛倒修之，則真龍真虎自降，真鉛<b>真汞</b>自伏。非藥之王，其孰能與於此哉。近世多矣，十六歲童男童女，使之交合，泄而成胎，謂之胎元丹，謂之紫河車，以此為<b>金丹</b>大藥，是猶接竹點月，不亦遠之愈遠乎。後天地生有形有質者，皆非至藥。蓋形而下者，非先天之道也。又上陽子曰：《契》云：是非歷藏法，內視有所思，陰道厭九一，濁亂弄元胞，諸衍甚眾多，千條有萬餘。彭真人曰：世人不達大道之宗元，而趨傍門之曲逕，此屬多般皆為左道，乖訛天理，悖亂至真，不達黃帝之文，全失老君之旨，本期永壽，反爾傷身。僕曰：只為世人執己而修，則千條萬徑無非傍門者矣。仙翁垂憫直言，窮取生身處，豈不直露天機。此正合鍾離公云：生我之門、死我之戶。大哉，上賢說道，下稍無人承當何哉？綠為世人因業識中來，卻又因業識中去。一陽奔走於形，雖男子身中皆陰，若執一己而修，豈能還其元而返其本，又將何而回陽換骨哉。是以大修行人，求先天真鉛，叉從一初受氣生身之處求之，方可得彼先天真一氣，以還其元而返其本也，此為男子修仙之道。女人修行，則以乳房為生氣所，其法充簡。是以男子修仙日鍊氣，女人修仙曰鍊形。坎女修鍊，先積氣  "o": "草木金銀皆滓質，雲霞日月屬朦朧。", "i": 28}, {"t": "p", "s": "更饶吐纳并存想，总与<b>金丹</b>事不同。", "o": "更饒吐納并存想，總與<b>金丹</b>事不同。", "i": 29}, {"t": "note", "s": "注曰：<b>真铅</b>之要，以二八之气为宗，此外皆非至道，枉施功耳。夷门破迷歌曰：孤寡不是道，<b>阴阳</b>失宗旨。王真人曰：学人刚要辞妻妾，不念无为无不为。高象先曰：或阳兮孤妻，或阴兮独宿。此皆言孤阴寡阳、独修一物之意。或者不知又执此说，以行房中御女之衍，毁谤仙道，咎将谁归。殊不知喻阳夫阴妻之义，非人问夫妻也。《破迷歌》曰：休粮不是道，死后作饿鬼。以上诸物皆后天地生，查滓之类，易遇难成，乌可与<b>金丹</b>大药同旦而语哉。疏曰：休粮绝粒、吐纳存想等法，皆傍门俗士因不休妻之句误。以探阴之衍为<b>金丹</b>者多矣，胡不全究太白真人《破迷歌》乎：行气不是道，津液非神水。存想不是道，画饼岂为饵。探阴不是道，精竭命随逝。断盐不是道，饮食无滋味。辟谷不是道，饥馁伤脾胃。休妻不是道，<b>阴阳</b>失宗位。如何却是道，太一舍真气o,气交而不交，升降效天地。二物相配合，起自于元始。媳女与婴儿，匹配成既济。本是真<b>阴阳</b>，夫妻同一义。所以不须休，孤阳岂成事。出世为金仙，<b>金丹</b>非容易。志士不说真，大洞隐深义。<b>五行</b>不顺行，虎向水中生。<b>五行</b>类倒卫，龙从火裹出。斯言真妙言，便是太一力。仙翁律诗所以盖本此也。夷门《破迷歌》：太一含真气，龙自火中生，虎自水中起，<b>阴阳</b>知颠倒，本自于元始。<b>五行</b>不顺行，还同于天地。及休妻之义，皆不及《太一歌》明白。世人既不知<b>五行</b>频倒，又安能知真<b>阴阳</b>之不须休乎。学仙之士，于仙书名目不能尽知，又安能详玩全文混融一于理乎。是以<b>金丹</b>大道，世远书亡，性昏道晦，诅因休妻馒遣<b>阴阳</b>隔之说，讹为世问夫妻，流入淫衍。惜哉！丹成气满，自然绝粒，非如服黑豆、胡麻子等药，以度凶年。或者饵药辟谷；以卫流世，安能成纯阳之仙。问有专饵草木，纵得长生，亦非纯阳之质。右警劝世人，明大道，破傍门。此系空玄子分类。", "o": "註曰：真鉛之要，以二八之氣為宗，此外皆非至道，枉施功耳。夷門破迷歌曰：孤寡不是道，陰陽失宗旨。王真人曰：學人剛要辭妻妾，不念無為無不為。高象先曰：或陽兮孤妻，或陰兮獨宿。此皆言孤陰寡陽、獨修一物之意。或者不知又執此說，以行房中御女之衍，毀謗仙道，咎將誰歸。殊不知喻陽夫陰妻之義，非人問夫妻也。《破迷歌》曰：休糧不是道，死後作餓鬼。以上諸物皆後天地生，查滓之類，易遇難成，烏可與<b>金丹</b>大藥同旦而語哉。疏曰：休糧絕粒、吐納存想等法，皆傍門俗士因不休妻之句誤。以探陰之衍為<b>金丹</b>者多矣，胡不全究太白真人《破迷歌》乎：行氣不是道，津液非神水。存想不是道，畫餅豈為餌。探陰不是道，精竭命隨逝。斷鹽不是道，飲食無滋味。辟穀不是道，饑餒傷脾胃。休妻不是道，陰陽失宗位。如何卻是道，太一舍真氣o,氣交而不交，升降效天地。二物相配合，起自於元始。媳女與嬰兒，匹配成既濟。本是真陰陽，夫妻同一義。所以不須休，孤陽豈成事。出世為金仙，<b>金丹</b>非容易。志士不說真，大洞隱深義。<b>五行</b>不順行，虎向水中生。<b>五行</b>類倒衛，龍從火裹出。斯言真妙言，便是太一力。仙翁律詩所以蓋本此也。夷門《破迷歌》：太一含真氣，龍自火中生，虎自水中起，陰陽知顛倒，本自於元始。<b>五行</b>不順行，還同於天地。及休妻之義，皆不及《太一歌》明白。世人既不知<b>五行</b>頻倒，又安能知真陰陽之不須休乎。學仙之士，於仙書名目不能盡知，又安能詳玩全文混融一於理乎。是以<b>金丹</b>大道，世遠書亡，性昏道晦，詛因休妻饅遣陰陽隔之說，訛為世問夫妻，流入淫衍。惜哉！丹成氣滿，自然絕粒，非如服黑豆、胡麻子等藥，以度凶年。或者餌藥辟穀；以衛流世，安能成純陽之仙。問有專餌草木，縱得長生，亦非純陽之質。右警勸世人，明大道，破傍門。此係空玄子分類。", "i": 30}, {"t": "p", "s": "学仙须是学<b>天仙</b>，惟有<b>金丹</b>最的瑞。", "o": "學仙須是學<b>天仙</b>，惟有<b>金丹</b>最的瑞。", "i": 31}, {"t": "p", "s": "二物会时情性合，<b>五行</b>全处<b>龙虎</b>蟠。", "o": "二物會時情性合，<b>五行</b>全處龍虎蟠。", "i": 32}, {"t": "p", "s": "本因<b>戊己</b>为媒聘，遂使夫妻镇合欢。", "o": "本因<b>戊己</b>為媒聘，遂使夫妻鎮合歡。", "i": 33}, {"t": "p", "s": "只候功成朝帝阙，九霞光裹驾翔鸾。", "o": "只候功成朝帝闕，九霞光裹駕翔鸞。", "i": 34}, {"t": "note", "s": "注曰：仙有数等，阴神至灵而无形者，<b>鬼仙</b>也。处世无诸疾恼而永寿者，<b>人仙</b>也。飞空走雾、饥渴不挠、寒暑无侵、遨游海岛、长生不死者，<b>地仙</b>也。<mark>形神俱妙</mark>、与道合真、步日月无影、入金石无碍、水火不焚溺、变化无穷、或老或少、隐显莫测、若存若亡、消则成气、息则成形、著龟莫能测、鬼神莫能知者，<b>天仙</b>也。阴真君曰：若能绝欲，兼修胎息，移神入壳，入定投尸，托阴生化而不坏者，可为下品仙也。若授六甲符录，正一盟威。上清大洞经录等法，及剑卫、尸解等衍得道者，立为南官列仙，隐诸洞府，为中品仙也。若是修<b>金丹</b>大药得道者，全身冲天，为无极上品之<b>天仙</b>也。故仙翁勉修真之士，须立志慷慨，特达不韦，无为彼中下之仙，直为无上九品极上<b>天仙</b>可也。夫五金、八石、朱砂、水银、黑铅、白锡、黄丹、雄黄、雌黄、枇霜、粉霜、曾青、胆矾、秋石、草木灰霜、水查滓煮伏之类，以至自己津精气血液等，此皆后天。是天地未分之前，混元真一之气，谓之无中生有。圣人以法追摄于一个时辰内，结成一粒，大如黍米，号日<b>金丹</b>，又日<b>真铅</b>，又日阳丹，又日真一精，又日真一水，又日真水，又日水虎，又日太一含真气。人得一粒饵之，立跻圣地，此乃天上之甲科，<b>天仙</b>之大道也，举世无知者。真一之气，生于天地之○先，混于虚无之中，恍惚杳冥，视之不见，听之不闻，搏之不得，如之何凝结而成黍米哉。圣人以实而形虚，以有而形无。实而有者，真阴真阳也，同类无情之物也。虚而无者，二八初弦之气也，有气而无质者也。两者相形，一物生焉。所谓一物者，真一之气，凝而为一黍之珠者也。经曰：元始悬一宝珠，大如黍米，在空玄之中。此其证也。圣人恐泄天地之机，以真阴真阳取喻青龙白虎也，以两弦之气取喻<b>真铅</b><b>真汞</b>也。今仙翁于诗曲中，复以青龙之一物名日赤龙，曰震龙，日天魂、<b>乾</b>象、<b>乾</b>炉、玉鼎、玉液、扶桑、海龙、上弦、束阳、长男、赤汞、朱砂、朱砂鼎、离日、赤凤，已上无过比类青龙之一名也。又以白虎之一物名日黑虎，日兑虎，日地魄、<b>坤</b>位、<b>坤</b>鼎、金鼎、金炉、华岳、岩虎、下弦、西川、少女、黑铅、偃月炉、坎月、黑龟，已上无过比类白虎一名也。又以龙之弦气名日<b>真汞</b>，日诧女，日木液、青娥、砂裹汞、朱裹汞，日精，日情，日黄芽、流珠、青衣、女子、金乌、离女、牝龙、真火、二八媳女、玉液、玉芝之类，其实一也。又以虎弦气名日<b>真铅</b>，日金公，日金精、水中金、水中银，日性，日白雪、素练、郎君、玉兔、坎男、真水、九三郎君、<b>刀圭</b>之类，其实一也。此言二物会时情性合者，二物即<b>龙虎</b>也。青龙在束，束方属木，木能生火，龙之弦气为火，日情，属南方，谓之朱雀也。白虎在西，西方属金，金能生水，虎之弦气为水，日性，属北方，谓之玄武也。夫龙木、虎金、情水、性火，谓之<b>四象</b>。<b>四象</b>会合于中官而成丹者，土也。此真<b>五行</b>也。<b>龙虎</b>二物相交，则情性合矣。<b>龙虎</b>合而成丹，则<b>五行</b>全矣。故日二物会时情性合，<b>五行</b>全处虎龙蟠也。木龙在束，金虎在西，二物问隔，孰能使之配合而为夫妻耶，配合在<b>黄婆</b>而已。左手擒龙，右手捉虎，使之合并也。<b>戊己</b>属土，故谓之<b>黄婆</b>。金木问隔，<b>黄婆</b>能使之合并。<b>黄婆</b>能使之配合，岂知非媒聘使之欢合而为夫妻乎。两者异，真一之气藏。两者同，真一之气变。真一之气变，真人自出现，此<b>外药</b>之法象。饵<b>金丹</b>后，复有十月之功，链形成气。又有九载抱一，化气成神。方能<mark>形神俱妙</mark>，与道合真，膺录授图，上宾于天。丹熟人问，道成天上。九霞光裹，两腋风生，驾凤验鸾，翱翔碧落。自非夙植灵根，广积阴惊，其孰能与于此哉。陆子野曰：<b>天仙</b>非<b>金丹</b>不能成其道。<b>金丹</b>是何物？曰：分明元是我家物，寄在<b>坤</b>官<b>坤</b>是人。所言二物者何物也？我与彼也。彼我会，则情性和而<b>五行</b>备。<b>龙虎</b>，情性而已。且道这会如何？会，所谓有用，用中无用。无功，功裹施功。竹密不妨流水过，山高岂碍白云飞。<b>戊己</b>，乃中也。中者，得其正位。<b>戊己</b>者，意土也。彼我之意相会，则夫妻之情惧悦而得矣。所以<b>戊己</b>为生物之乡，生物系乎意也。真土无位，真意无形，神哉神哉。", "o": "註曰：仙有數等，陰神至靈而無形者，<b>鬼仙</b>也。處世無諸疾惱而永壽者，<b>人仙</b>也。飛空走霧、飢渴不撓、寒暑無侵、遨遊海島、長生不死者，<b>地仙</b>也。<mark>形神俱妙</mark>、與道合真、步日月無影、入金石無礙、水火不焚溺、變化無窮、或老或少、隱顯莫測、若存若亡、消則成氣、息則成形、著龜莫能測、鬼神莫能知者，<b>天仙</b>也。陰真君曰：若能絕欲，兼修胎息，移神入殼，入定投尸，託陰生化而不壞者，可為下品仙也。若授六甲符錄，正一盟威。上清大洞經錄等法，及劍衛、尸解等衍得道者，立為南官列仙，隱諸洞府，為中品仙也。若是修<b>金丹</b>大藥得道者，全身沖天，為無極上品之<b>天仙</b>也。故仙翁勉修真之士，須立志慷慨，特達不韋，無為彼中下之仙，直為無上九品極上<b>天仙</b>可也。夫五金、八石、朱砂、水銀、黑鉛、白錫、黃丹、雄黃、雌黃、枇霜、粉霜、曾青、膽礬、秋石、草木灰霜、水查滓煮伏之類，以至自己津精氣血液等，此皆後天。是天地未分之前，混元真一之氣，謂之無中生有。聖人以法追攝於一箇時辰內，結成一粒，大如黍米，號日<b>金丹</b>，又日真鉛，又日陽丹，又日真一精，又日真一水，又日真水，又日水虎，又日太一含真氣。人得一粒餌之，立躋聖地，此乃天上之甲科，<b>天仙</b>之大道也，舉世無知者。真一之氣，生於天地之○先，混於虛無之中，恍惚杳冥，視之不見，聽之不聞，搏之不得，如之何凝結而成黍米哉。聖人以實而形虛，以有而形無。實而有者，真陰真陽也，同類無情之物也。虛而無者，二八初弦之氣也，有氣而無質者也。兩者相形，一物生焉。所謂一物者，真一之氣，凝而為一黍之珠者也。經曰：元始懸一寶珠，大如黍米，在空玄之中。此其證也。聖人恐泄天地之機，以真陰真陽取喻青龍白虎也，以兩弦之氣取喻真鉛<b>真汞</b>也。今仙翁於詩曲中，復以青龍之一物名日赤龍，曰震龍，日天魂、<b>乾</b>象、<b>乾</b>爐、玉鼎、玉液、扶桑、海龍、上弦、束陽、長男、赤汞、朱砂、朱砂鼎、離日、赤鳳，已上無過比類青龍之一名也。又以白虎之一物名日黑虎，日兌虎，日地魄、<b>坤</b>位、<b>坤</b>鼎、金鼎、金爐、華嶽、巖虎、下弦、西川、少女、黑鉛、偃月爐、坎月、黑龜，已上無過比類白虎一名也。又以龍之弦氣名日<b>真汞</b>，日詫女，日木液、青娥、砂裹汞、朱裹汞，日精，日情，日黃芽、流珠、青衣、女子、金烏、離女、牝龍、真火、二八媳女、玉液、玉芝之類，其實一也。又以虎弦氣名日真鉛，日金公，日金精、水中金、水中銀，日性，日白雪、素練、郎君、玉兔、坎男、真水、九三郎君、<b>刀圭</b>之類，其實一也。此言二物會時情性合者，二物即龍虎也。青龍在束，束方屬木，木能生火，龍之弦氣為火，日情，屬南方，謂之朱雀也。白虎在西，西方屬金，金能生水，虎之弦氣為水，日性，屬北方，謂之玄武也。夫龍木、虎金、情水、性火，謂之<b>四象</b>。<b>四象</b>會合於中官而成丹者，土也。此真<b>五行</b>也。龍虎二物相交，則情性合矣。龍虎合而成丹，則<b>五行</b>全矣。故日二物會時情性合，<b>五行</b>全處虎龍蟠也。木龍在束，金虎在西，二物問隔，孰能使之配合而為夫妻耶，配合在黃婆而已。左手擒龍，右手捉虎，使之合併也。<b>戊己</b>屬土，故謂之黃婆。金木問隔，黃婆能使之合併。黃婆能使之配合，豈知非媒聘使之歡合而為夫妻乎。兩者異，真一之氣藏。兩者同，真一之氣變。真一之氣變，真人自出現，此外藥之法象。餌<b>金丹</b>後，復有十月之功，鍊形成氣。又有九載抱一，化氣成神。方能<mark>形神俱妙</mark>，與道合真，膺錄授圖，上賓于天。丹熟人問，道成天上。九霞光裹，兩腋風生，駕鳳驗鸞，翱翔碧落。自非夙植靈根，廣積陰驚，其孰能與於此哉。陸子野曰：<b>天仙</b>非<b>金丹</b>不能成其道。<b>金丹</b>是何物？曰：分明元是我家物，寄在<b>坤</b>官<b>坤</b>是人。所言二物者何物也？我與彼也。彼我會，則情性和而<b>五行</b>備。龍虎，情性而已。且道這會如何？會，所謂有用，用中無用。無功，功裹施功。竹密不妨流水過，山高豈礙白雲飛。<b>戊己</b>，乃中也。中者，得其正位。<b>戊己</b>者，意土也。彼我之意相會，則夫妻之情懼悅而得矣。所以<b>戊己</b>為生物之鄉，生物係乎意也。真土無位，真意無形，神哉神哉。", "i": 35}, {"t": "note", "s": "疏曰：《传道集》云：仙非一也，纯阴而无阳者，鬼也。纯阳而无阴者，仙也。<b>阴阳</b>相杂者，人也。惟人者，可以鬼，可以仙。仙有五等：<b>鬼仙</b>者，阴中超脱，神像不明，鬼关无姓，三山无名，虽不轮回，又难返蓬瀛，终无所归，止于投胎夺舍。盖以神识内守，一心不散，意中以出阴神，乃清灵之鬼，非纯阳之仙。以其一志，阴灵不散，故日<b>鬼仙</b>。崇释之徒，用功至此，乃曰得道，诚可笑也。<b>人仙</b>者，不能全于大道，止于一法一衍，功能安乐延年。<b>地仙</b>者，法天地升降之理，取日月生成之数，身中用年月，日中用时刻，识<b>龙虎</b>配<b>坎离</b>，<b>五行</b>颠倒，气传子母，液行夫妇，三田返覆，烧成丹药，永镇下田，链形住世，长生不死，以作陆地神仙。神仙者，以<b>地仙</b>厌居尘世，用功不已，链形成象，五气朝元，三阳聚顶，功满忘形，胎仙自化，阴尽阳纯，<mark>身外有身</mark>，脱质升仙，超几入圣，谢绝尘世，以返三山。<b>天仙</b>者，厌居三岛，而传道人问，功行满足十界。之，质，一阳天为无形而为丹道上有功，人问有行，受天书以返洞天，升于八又升于三清灵元自然之有中生有者，以有形之物变化而成也。其始有形矣无中生有，取而服之，无质而质，质生则能化有形为无形，化后天气为先天气盖无质者，真一之气也，虎之中，纯一无伪，人能知其机而盗则可以诱真一之气服之一粒，非无为无作立跻圣域者？此也。枯坐独修几火几药而能成者也。本一物也，物之中，各含<b>阴阳</b>而成<b>四象</b>为一而土在其中，为真<b>五行</b>。合为一未合，，返其本源，此<b>金丹</b>也。则各藏真一之气寓于物。物既同，则交真一之气，《商岩口授经》二物者工夫到日鲜莹洁白下工夫，则目现心悟安能化有形<mark>形神俱妙</mark>。寓于真龙真使之凝结生分为二物，二<b>四象</b>合<b>五行</b>二物始为丹。傅若坚心静定灵光如月即虚室生白也。须见日轮红光涌出再持守则白光灭矣。此二物得了，即丹基欲结。", "o": "疏曰：《傳道集》云：仙非一也，純陰而無陽者，鬼也。純陽而無陰者，仙也。陰陽相雜者，人也。惟人者，可以鬼，可以仙。仙有五等：<b>鬼仙</b>者，陰中超脫，神像不明，鬼關無姓，三山無名，雖不輪迴，又難返蓬瀛，終無所歸，止於投胎奪舍。蓋以神識內守，一心不散，意中以出陰神，乃清靈之鬼，非純陽之仙。以其一志，陰靈不散，故日<b>鬼仙</b>。崇釋之徒，用功至此，乃曰得道，誠可笑也。<b>人仙</b>者，不能全於大道，止於一法一衍，功能安樂延年。<b>地仙</b>者，法天地升降之理，取日月生成之數，身中用年月，日中用時刻，識龍虎配坎離，<b>五行</b>顛倒，氣傳子母，液行夫婦，三田返覆，燒成丹藥，永鎮下田，鍊形住世，長生不死，以作陸地神仙。神仙者，以<b>地仙</b>厭居塵世，用功不已，鍊形成象，五氣朝元，三陽聚頂，功滿忘形，胎仙自化，陰盡陽純，<mark>身外有身</mark>，脫質升仙，超几入聖，謝絕塵世，以返三山。<b>天仙</b>者，厭居三島，而傳道人問，功行滿足十界。之，質，一陽天為無形而為丹道上有功，人問有行，受天書以返洞天，升於八又升於三清靈元自然之有中生有者，以有形之物變化而成也。其始有形矣無中生有，取而服之，無質而質，質生則能化有形為無形，化後天氣為先天氣蓋無質者，真一之氣也，虎之中，純一無偽，人能知其機而盜則可以誘真一之氣服之一粒，非無為無作立躋聖域者？此也。枯坐獨修几火几藥而能成者也。本一物也，物之中，各含陰陽而成<b>四象</b>為一而土在其中，為真<b>五行</b>。合為一未合，，返其本源，此<b>金丹</b>也。則各藏真一之氣寓於物。物既同，則交真一之氣，《商岩口授經》二物者工夫到日鮮瑩潔白下工夫，則目現心悟安能化有形<mark>形神俱妙</mark>。寓於真龍真使之凝結生分為二物，二<b>四象</b>合<b>五行</b>二物始為丹。傅若堅心靜定靈光如月即虛室生白也。須見日輪紅光涌出再持守則白光滅矣。此二物得了，即丹基欲結。", "i": 36}, {"t": "p", "s": "此法真中妙更真，都绿我独异于人。", "o": "此法真中妙更真，都綠我獨異於人。", "i": 37}, {"t": "p", "s": "自知颠倒由离坎，谁识浮沉定主宾。", "o": "自知顛倒由離坎，誰識浮沉定主賓。", "i": 38}, {"t": "p", "s": "金鼎欲留朱裹汞，玉池先下水中银。", "o": "金鼎欲留朱裹汞，玉池先下水中銀。", "i": 39}, {"t": "p", "s": "神功运火非终旦，现出深潭日一轮。", "o": "神功運火非終旦，現出深潭日一輪。", "i": 40}, {"t": "note", "s": "注曰：此道至圣至神，至贵至尊，至简至易，玄中之玄，妙中之妙？举世罕闻。仙翁出乎其类，技乎其萃，独得深旨。故冲熙翁曰：<b>金丹</b>大道，举世道人无所许可，惟平叔一人而已。泰山也，河海也，丘埋行潦何敢冀焉。离，属火为阳而居南，所反为女者，外阳而内阴也，谓之<b>真汞</b>。坎，为阴而居北，所以反为男者，外阴而内阳也，谓之<b>真铅</b>。故仙翁曰：日居离位反为女，坎配蟾官却是男。不会个中颠倒意，休将管见事高谈。此言坎之男、离之女，犹父之精、母之血也。日之乌、月之兔也，砂之汞、铅之银也，天之玄、地之黄也，此数者皆指示<b>龙虎</b>初弦二气也。主宾者，阳尊高居左日主，阴位低下居右日宾。夫离为火，火炎上，火乃木之性，俱浮，属阳，故为主也。坎为水，水润下，水为金之性，俱沉，属阴，故为宾也。此常道也。今也离反为女，坎反为男，是主反为宾也。宾反为主，岂非颠倒乎，故日自知颠倒由离坎，谁识浮况定主宾。定主宾者，盖道中取二弦之气，颠倒之主宾，不取常道主宾，故日定主宾也。人人自有长生药，自是愚痴枉把抛。甘露降时天地合，黄芽生处<b>坎离</b>交。井蛙应谓无龙窟，篱鹦争知有凤巢。金鼎者，金为阴物，鼎中有火之气，是阴中有阳之象，白虎是也。玉池者，玉为阳物，池中有水之气，是阳中有阴之象，青龙是也。砂中汞者，龙之弦气也。水中银者，虎之弦气也。修丹之士，若欲以虎留恋龙之气，又先驱龙就虎，然后二物氤氲，两情交合，施功煆炼，自然凝结真一之精也。火即二弦之气也。旦者，一昼之首，子为六阳之元，故日日一也。圣人运动丹火，有神妙之功，不半时中，立得真一之精，一粒如黍，现于北海之中，赫然光透帘帏，若深潭现出一轮之红日也。非终旦者，明一时辰中<b>金丹</b>之成也，此药之法象也。", "o": "註曰：此道至聖至神，至貴至尊，至簡至易，玄中之玄，妙中之妙？舉世罕聞。仙翁出乎其類，技乎其萃，獨得深旨。故沖熙翁曰：<b>金丹</b>大道，舉世道人無所許可，惟平叔一人而已。泰山也，河海也，丘埋行潦何敢冀焉。離，屬火為陽而居南，所反為女者，外陽而內陰也，謂之<b>真汞</b>。坎，為陰而居北，所以反為男者，外陰而內陽也，謂之真鉛。故仙翁曰：日居離位反為女，坎配蟾官卻是男。不會箇中顛倒意，休將管見事高談。此言坎之男、離之女，猶父之精、母之血也。日之烏、月之兔也，砂之汞、鉛之銀也，天之玄、地之黃也，此數者皆指示龍虎初弦二氣也。主賓者，陽尊高居左日主，陰位低下居右日賓。夫離為火，火炎上，火乃木之性，俱浮，屬陽，故為主也。坎為水，水潤下，水為金之性，俱沉，屬陰，故為賓也。此常道也。今也離反為女，坎反為男，是主反為賓也。賓反為主，豈非顛倒乎，故日自知顛倒由離坎，誰識浮況定主賓。定主賓者，蓋道中取二弦之氣，顛倒之主賓，不取常道主賓，故日定主賓也。人人自有長生藥，自是愚癡枉把拋。甘露降時天地合，黃芽生處坎離交。井蛙應謂無龍窟，籬鸚爭知有鳳巢。金鼎者，金為陰物，鼎中有火之氣，是陰中有陽之象，白虎是也。玉池者，玉為陽物，池中有水之氣，是陽中有陰之象，青龍是也。砂中汞者，龍之弦氣也。水中銀者，虎之弦氣也。修丹之士，若欲以虎留戀龍之氣，又先驅龍就虎，然後二物氤氳，兩情交合，施功煆鍊，自然凝結真一之精也。火即二弦之氣也。旦者，一晝之首，子為六陽之元，故日日一也。聖人運動丹火，有神妙之功，不半時中，立得真一之精，一粒如黍，現於北海之中，赫然光透簾幃，若深潭現出一輪之紅日也。非終旦者，明一時辰中<b>金丹</b>之成也，此藥之法象也。", "i": 41}, {"t": "note", "s": "疏曰：坎男离女、日乌月兔、天玄地黄，金阴之鼎有火焉，玉阳之池有水焉。主反为宾，宾反为主，皆是阴中取阳，阳中取阴也。颠倒<b>五行</b>逆修，以至于太极。太极者，先天未判之气也。<b>金丹</b>之结阳也，火非世问之几火也，二弦之气皆火也。二弦者，其初也有气而无质，其源也至清而无浊，在年为二八月<b>阴阳</b>之平，在月为上下弦金水之半。上阳子陈政虚曰：妙之一字，夫谁肯信。异于人者，世人迷于爱欲之中，我却于爱欲之中，而有分别。何谓分别，圣人以离坎颠倒而用之，谓之火上水下，以<b>乾</b><b>坤</b>颠倒而用之，谓之地在天上。以夫妇颠倒而用之，谓男下女上。浮沉者，火炎木浮而在上为主，水降金沉而在下为宾。此乃人之道，此为世问法也，此为顺<b>五行</b>也。今焉火木虽浮，使之就下而反为宾。金水须沉，使之逆上而反为主。是之谓仙道也，是出世问法也，是为水火既济也，是为颠倒<b>五行</b>也。金鼎玉池，道光所注不出颠倒之机，而反失于欲留先下之义。子野以金鼎喻彼此，却合紫阳翁之意，何哉？绿自己之精气血液者，朱裹汞也，不可令其走逸，故云欲留彼此之华也。灵池丹井丹泉者，水中银也，即先天一点真气，故云先下又欲留者，但令其住而不令其去，要取人而不失于己。先下者，彼到而我待之，铅至而汞迎之，坎动则离受之。<b>金丹</b>之道，先要得此欲留先下四字之旨。运火非旦者，叉得其温和而运之。故《参同契》云：发火初温微，亦如爻动时。纯阳翁云：中宵漏永温温，铅鼎光透帘帏。盖万物生化之初，其受<b>阴阳</b>之气只霎时中。况此上仙之道，其炼先天之气，又为迅速。故佛云：如露亦如电者，谓其至精至微而甚功疾，为不可久矣。久则有损，而亏神功。若得此先天<b>真铅</b>，归于悬胎室内，岂非深潭之现红日也。", "o": "疏曰：坎男離女、日烏月兔、天玄地黃，金陰之鼎有火焉，玉陽之池有水焉。主反為賓，賓反為主，皆是陰中取陽，陽中取陰也。顛倒<b>五行</b>逆修，以至於太極。太極者，先天未判之氣也。<b>金丹</b>之結陽也，火非世問之几火也，二弦之氣皆火也。二弦者，其初也有氣而無質，其源也至清而無濁，在年為二八月陰陽之平，在月為上下弦金水之半。上陽子陳政虛曰：妙之一字，夫誰肯信。異於人者，世人迷於愛慾之中，我卻於愛慾之中，而有分別。何謂分別，聖人以離坎顛倒而用之，謂之火上水下，以<b>乾</b><b>坤</b>顛倒而用之，謂之地在天上。以夫婦顛倒而用之，謂男下女上。浮沉者，火炎木浮而在上為主，水降金沉而在下為賓。此乃人之道，此為世問法也，此為順<b>五行</b>也。今焉火木雖浮，使之就下而反為賓。金水須沉，使之逆上而反為主。是之謂仙道也，是出世問法也，是為水火既濟也，是為顛倒<b>五行</b>也。金鼎玉池，道光所註不出顛倒之機，而反失於欲留先下之義。子野以金鼎喻彼此，卻合紫陽翁之意，何哉？綠自己之精氣血液者，朱裹汞也，不可令其走逸，故云欲留彼此之華也。靈池丹井丹泉者，水中銀也，即先天一點真氣，故云先下又欲留者，但令其住而不令其去，要取人而不失於己。先下者，彼到而我待之，鉛至而汞迎之，坎動則離受之。<b>金丹</b>之道，先要得此欲留先下四字之旨。運火非旦者，叉得其溫和而運之。故《參同契》云：發火初溫微，亦如爻動時。純陽翁云：中宵漏永溫溫，鉛鼎光透簾幃。蓋萬物生化之初，其受陰陽之氣只霎時中。況此上仙之道，其鍊先天之氣，又為迅速。故佛云：如露亦如電者，謂其至精至微而甚功疾，為不可久矣。久則有損，而虧神功。若得此先天真鉛，歸于懸胎室內，豈非深潭之現紅日也。", "i": 42}, {"t": "p", "s": "人人自有长生药，自是愚痴枉把抛。", "o": "人人自有長生藥，自是愚癡枉把拋。", "i": 43}, {"t": "p", "s": "甘露降时天地合，黄芽生处<b>坎离</b>交。", "o": "甘露降時天地合，黃芽生處坎離交。", "i": 44}, {"t": "p", "s": "井蛙应谓无龙窟，篱钨争知有凤巢。", "o": "井蛙應謂無龍窟，籬鎢爭知有鳳巢。", "i": 45}, {"t": "p", "s": "丹熟自然金满屋，何须寻草学烧茅。", "o": "丹熟自然金滿屋，何須尋草學燒茅。", "i": 46}, {"t": "note", "s": "注曰：甘露、黄芽，皆<b>金丹</b>异名也。天地、<b>坎离</b>，皆<b>龙虎</b>之象也。天地之气氤氲，甘露自降。<b>坎离</b>之气交并，黄芽自生。<b>龙虎</b>二弦之道交接，真一之气自结。此般至宝，家家自有，以其太近，故轻而弃之，殊不知此乃升天之灵梯也。近世学者多执傍门非类，孤阴寡阳，有中生有，易遇难成等法，而自误其身，不知斯道简而易成者，有如井底之蛙，篱问之雀，安知有龙窟凤巢也。黍粒之珠既悬，天地之金可掬。昔邵刚中精于黄白之卫，世号为小淮南王，后遇仙翁韩子陶法师于水上，北面事之，出汞金百镒献陶以为质，陶笑而不顾，邵敌血书盟，陶遂授道焉。既竟，陶取汞一掬入口漱之，吐于水盆中，水　为之涌沸，沸定，成紫金一探，此示其内丹大药有如此之神妙，岂待穷年卒岁，弄草烧茅之辈可得而见之乎。经文不日地藏发泄，金玉露形，又其证也。疏曰：吕纯阳以土瓦石为金，南唐耿仙姑捏雪成银，陈泥丸含汞立<b>乾</b>。《传道集》云：口中可以<b>乾</b>汞，皆熟之验。右<b>外药</b>。", "o": "註曰：甘露、黃芽，皆<b>金丹</b>異名也。天地、坎離，皆龍虎之象也。天地之氣氤氳，甘露自降。坎離之氣交併，黃芽自生。龍虎二弦之道交接，真一之氣自結。此般至寶，家家自有，以其太近，故輕而棄之，殊不知此乃升天之靈梯也。近世學者多執傍門非類，孤陰寡陽，有中生有，易遇難成等法，而自誤其身，不知斯道簡而易成者，有如井底之蛙，籬問之雀，安知有龍窟鳳巢也。黍粒之珠既懸，天地之金可掬。昔邵剛中精於黃白之衛，世號為小淮南王，後遇仙翁韓子陶法師於水上，北面事之，出汞金百鎰獻陶以為質，陶笑而不顧，邵敵血書盟，陶遂授道焉。既竟，陶取汞一掬入口漱之，吐於水盆中，水　為之湧 </b>之祖。萬物類之以生成，千靈承之以舒慘。至於高天厚地，洞府名山，玄象靈官，神仙聖眾，風雨晦明，春夏秋冬，未兆之前，莫不由此，鉛氣產出而成變化者也。修丹之士，得真一之水，萬事畢矣。真一之黍，吞歸五內，運火十月，鍊盡韋陰，化為純陽真一之仙，陰魔尸鬼逃遁無門。仙黃欲留祕旨於人問，未聞有知音者，大有逕庭，不近人情故也。蓋善根種而靈骨鍾，靈骨鍾而仙可冀。靈骨之鍾、善根之種也，不於一生二生，而於無量萬億生中種諸善根，纔出頭來，飄飄然便有出塵氣象。噫！走骨行尸，一瓶一缽，便欲登仙，神仙中人不易得也，胡不捫己之心，與平几之心有以異乎，無以異乎。我之仙事亦無涯也，鈴也廣大變通為己任，獨高一世，鶴立雞常，人笑我為迂疏，我知我非几俗。赤精亦松乃吾友，蓬萊方丈乃吾家。自然遭遇異人親傳至道，結合心友，一黍丹成。仙翁欲向人問留此不傳之祕旨，莫怪子期期不遇，怎生得箇這般人。", "i": 62}, {"t": "note", "s": "疏曰：土者，言其会极之地。壬者，言其生物之初。真一之水，未成形之气也。真一之黍，已成形之气也。<b>四象</b>各怀真土，一四成五，二三成五，<b>四象</b>皆土也。壬，水也，天一之所生壬在子先，为一阳之首。壬在子先者，即亥末子初也。生气之元，<b>五行</b>之先，故皆始于壬也。真一子曰：真一之精，止成变化者也。其文出《金钥匙》。莫不因此<b>铅汞</b>产出，即真一之水壬也。", "o": "疏曰：土者，言其會極之地。壬者，言其生物之初。真一之水，未成形之氣也。真一之黍，已成形之氣也。<b>四象</b>各懷真土，一四成五，二三成五，<b>四象</b>皆土也。壬，水也，天一之所生壬在子先，為一陽之首。壬在子先者，即亥末子初也。生氣之元，<b>五行</b>之先，故皆始於壬也。真一子曰：真一之精，止成變化者也。其文出《金鑰匙》。莫不因此鉛汞產出，即真一之水壬也。", "i": 63}, {"t": "p", "s": "好把<b>真铅</b>著意寻，莫教容易度光阴。", "o": "好把真鉛著意尋，莫教容易度光陰。", "i": 64}, {"t": "p", "s": "但将地魄擒朱汞，自有天魂制水金。", "o": "但將地魄擒朱汞，自有天魂制水金。", "i": 65}, {"t": "p", "s": "可谓道高<b>龙虎</b>伏，堪言德重鬼神钦。", "o": "可謂道高龍虎伏，堪言德重鬼神欽。", "i": 66}, {"t": "p", "s": "已知永寿齐天地，烦恼无由更上心。", "o": "已知永壽齊天地，煩惱無由更上心。", "i": 67}, {"t": "note", "s": "注曰：<b>真铅</b>，即<b>金丹</b>也。地魄，在<b>外药</b>则白虎是也，<b>内药</b>即<b>金丹</b>也。天魂，在<b>外药</b>则青龙是也，<b>内药</b>即己身也。朱汞者，在外龙之弦气也，在内已之真气也。水金者，在外虎之弦气也，在内<b>金丹</b>也。又谓之朱裹汞，水中银。已上喻内外二事也。仙翁勉修真之士，速修<b>金丹</b>以超生死，无虚度日也。但将白虎擒龙，自有青龙制虎，二气捆缢以产<b>金丹</b>，既得<b>金丹</b>，复将此<b>金丹</b>吞入腹中，擒自己真气，其自己真气恋<b>金丹</b>而结圣胎也。内之真龙既降，则世外之<b>龙虎</b>自伏。内炼神魂鬼魄既圣，则世外之鬼神自钦。非道隆德邵，其龙孰能与于此哉。体化纯阳，寿齐天地，逍遥物外，自在人问，万念俱空，何烦恼之有。陆子野曰：地魄乃铅，天魂乃汞，以铅制汞，在彼我耳。", "o": "註曰：真鉛，即<b>金丹</b>也。地魄，在外藥則白虎是也，內藥即<b>金丹</b>也。天魂，在外藥則青龍是也，內藥即己身也。朱汞者，在外龍之弦氣也，在內已之真氣也。水金者，在外虎之弦氣也，在內<b>金丹</b>也。又謂之朱裹汞，水中銀。已上喻內外二事也。仙翁勉修真之士，速修<b>金丹</b>以超生死，無虛度日也。但將白虎擒龍，自有青龍制虎，二氣綑縊以產<b>金丹</b>，既得<b>金丹</b>，復將此<b>金丹</b>吞入腹中，擒自己真氣，其自己真氣戀<b>金丹</b>而結聖胎也。內之真龍既降，則世外之龍虎自伏。內鍊神魂鬼魄既聖，則世外之鬼神自欽。非道隆德邵，其龍孰能與於此哉。體化純陽，壽齊天地，逍遙物外，自在人問，萬念俱空，何煩惱之有。陸子野曰：地魄乃鉛，天魂乃汞，以鉛制汞，在彼我耳。", "i": 68}, {"t": "p", "s": "休炼三黄及四神，若寻众草便非真。", "o": "休鍊三黃及四神，若尋眾草便非真。", "i": 69}, {"t": "p", "s": "<b>阴阳</b>得类方交感，二八相当自合亲。", "o": "陰陽得類方交感，二八相當自合親。", "i": 70}, {"t": "p", "s": "潭底日红阴怪灭，山头月白药苗新。", "o": "潭底日紅陰怪滅，山頭月白藥苗新。", "i": 71}, {"t": "p", "s": "<span class=\"key\">时人要识真铅汞，不是凡砂及水银</span>。", "o": "時人要識真鉛汞，不是凡砂及水銀。", "i": 72}, {"t": "note", "s": "注曰：三黄四神，金石草木，皆后天地生，查滓之物，安能化有形而入于无形哉。外内不可以成胎，缀花不可以结子。真一之气，生于天地之先，杳杳冥冥，不可测度，因二八同类相当之物，合而成亲，捆缢交感之中，激而有象同类者，无情之情、不色之色，正谓乌肝八两、兔髓半斤是也。此二八相当之同类，合而成亲，则真一之气归于交感穴中，凝成黍粒，斯道妙矣。潭阴也，日阳也，潭底日红者，阴中之阳也。阴中之阳为纯阳，而无阴气，故曰阴怪灭也。乃是虎之弦气，谓之红铅。山阳也，月阴也，山头月白者，阳中之阴也。乃龙之弦气，初弦气故日药苗新，谓之黑铅。铅作汞。古歌曰：红铅黑汞大丹头，将红入黑是真修。此之谓也。圣人以此二物，于一时之中，造化成一粒阳丹。在北海之中，赫然如日，光透帘幛，即时探吞入腹，点己阴汞，则一身阴邪之气悉皆消灭，亦如晓日初自束海而升，赫然照耀，阴怪悉消灭矣。阴汞自下丹田，峰顶乍禀阳丹之气，渐渐凝结，萌芽新嫩，故药苗新也。亦如月之朔旦，与日相交，乍禀太阳之气，日没时则吐微光西方，于庚上状若蛾眉，月光新嫩，如药苗新也。此咏内外二药之法象也。《西华经》曰：阳中之阴名日媳女，阴中之阳名日金公。此乃壶中夫妇，紫府阶梯，悟之者神仙现在目前，迷之者尘沙杳隔万里。夫<b>外药</b>之<b>真铅</b><b>真汞</b>，即<b>龙虎</b>初弦之气也。内之<b>真铅</b><b>真汞</b>，即<b>金丹</b>与己之真气也。时人要识<b>真铅</b>汞，只此是真，此外皆非真道。此二真物，能化有形而入于无形，为真<b>人仙</b>子。乃若几砂几汞，岂可比伦哉。疏曰：丹经传于世者，多用砂中抽汞名为<b>真汞</b>，或用朱砂名为金体。转炼为丹，费财既多，费岁月亦久，成功则少。纵使有成，服之丧生者多矣，皆未识<b>真铅</b><b>真汞</b>者也。", "o": "註曰：三黃四神，金石草木，皆後天地生，查滓之物，安能化有形而入於無形哉。外內不可以成胎，綴花不可以結子。真一之氣，生於天地之先，杳杳冥冥，不可測度，因二八同類相當之物，合而成親，綑縊交感之中，激而有象同類者，無情之情、不色之色，正謂烏肝八兩、兔髓半斤是也。此二八相當之同類，合而成親，則真一之氣歸於交感穴中，凝成黍粒，斯道妙矣。潭陰也，日陽也，潭底日紅者，陰中之陽也。陰中之陽為純陽，而無陰氣，故曰陰怪滅也。乃是虎之弦氣，謂之紅鉛。山陽也，月陰也，山頭月白者，陽中之陰也。乃龍之弦氣，初弦氣故日藥苗新，謂之黑鉛。鉛作汞。古歌曰：紅鉛黑汞大丹頭，將紅入黑是真修。此之謂也。聖人以此二物，於一時之中，造化成一粒陽丹。在北海之中，赫然如日，光透簾幛，即時探吞入腹，點己陰汞，則一身陰邪之氣悉皆消滅，亦如曉日初自束海而升，赫然照耀，陰怪悉消滅矣。陰汞自下丹田，峰頂乍稟陽丹之氣，漸漸凝結，萌芽新嫩，故藥苗新也。亦如月之朔旦，與日相交，乍稟太陽之氣，日沒時則吐微光西方，於庚上狀若蛾眉，月光新嫩，如藥苗新也。此詠內外二藥之法象也。《西華經》曰：陽中之陰名日媳女，陰中之陽名日金公。此乃壺中夫婦，紫府階梯，悟之者神仙現在目前，迷之者塵沙杳隔萬里。夫外藥之真鉛<b>真汞</b>，即龍虎初弦之氣也。內之真鉛<b>真汞</b>，即<b>金丹</b>與己之真氣也。時人要識真鉛汞，只此是真，此外皆非真道。此二真物，能化有形而入於無形，為真<b>人仙</b>子。乃若几砂几汞，豈可比倫哉。疏曰：丹經傳於世者，多用砂中抽汞名為<b>真汞</b>，或用朱砂名為金體。轉鍊為丹，費財既多，費歲月亦久，成功則少。縱使有成，服之喪生者多矣，皆未識真鉛<b>真汞</b>者也。", "i": 73}, {"t": "p", "s": "不识玄中颠倒颠，争知火裹好栽莲。", "o": "不識玄中顛倒顛，爭知火裹好栽蓮。", "i": 74}, {"t": "p", "s": "牵将白虎归家养，产下明珠似月圆。", "o": "牽將白虎歸家養，產下明珠似月圓。", "i": 75}, {"t": "p", "s": "馒守药炉看<b>火候</b>，但安神息任天然。", "o": "饅守藥爐看<b>火候</b>，但安神息任天然。", "i": 76}, {"t": "p", "s": "草阴剥尽丹成熟，跳出樊笼寿万年。", "o": "草陰剝盡丹成熟，跳出樊籠壽萬年。", "i": 77}, {"t": "note", "s": "注曰：以人事推之，男儿固不可有孕，火裹固不可栽莲。然神仙玄妙之道，有颠倒颠之卫，辄使男儿有孕，亦犹火裹栽莲也。何则日离为男反为女，月坎为女反为男，此颠倒颠之义也。二物颠倒，则能生丹。以丹点已阴汞而结圣胎，养就婴兄，即是男儿有孕，亦犹火裹栽莲，岂非颠倒颠乎。故仙翁读《参同契》曰：<b>五行</b>逆兮，丹体常灵常存。言水逆而土，土逆而木，木逆而金，金逆而火，火逆而水，此颠倒颠之深旨也。", "o": "註曰：以人事推之，男兒固不可有孕，火裹固不可栽蓮。然神仙玄妙之道，有顛倒顛之衛，輒使男兒有孕，亦猶火裹栽蓮也。何則日離為男反為女，月坎為女反為男，此顛倒顛之義也。二物顛倒，則能生丹。以丹點已陰汞而結聖胎，養就嬰兄，即是男兒有孕，亦猶火裹栽蓮，豈非顛倒顛乎。故仙翁讀《參同契》曰：<b>五行</b>逆兮，丹體常靈常存。言水逆而土，土逆而木，木逆而金，金逆而火，火逆而水，此顛倒顛之深旨也。", "i": 78}, {"t": "p", "s": "颠倒颠之义明白也。青龙白虎，元是真一之精变为二物，分位东西，实同出而异名也。真一之精属汞，汞为龙，在东，故真一之精居东也。白虎本是真一精之子，寄体生在西，其家在东束也。故仙翁曰：金公本是东家子，送在西邻寄体生。认得唤来归合养，配将姹女作亲情是也。金公者，铅也。姹女者，汞也。以铅点己之汞而结为圣胎，所以牵将白虎归家养，配以青龙结为夫妇，产个明珠似月圆也。○似月圆者，修丹之士，先取上西畔半轮之月，得阳金八两。次取下东畔半轮之月，得弦水半斤。以此两个半轮之月，合气而生丹，故得<b>金丹</b>一粒似月圆也。亦如道光禅师谓，灵丹一粒，其重一斤。此乃两个八两合成一斤而言之，与仙翁月圆之意亦同。此比喻<b>外药</b>法象也。及得此丹吞入己腹中，则<b>金丹</b>却为白虎，又牵此白虎归己腹中，配以己汞，然后运阴符阳火，循历六十四卦，煅炼成金液还丹，一粒亦重一斤，似月圆也。此比喻<b>内药</b>法象也。内丹所以似月圆者，盖运火之卦，一卦有六爻，六十四卦计三百八十四爻，象一斤三百八十四铢也。外丹所以似月圆者，一斤乃上下二弦，半轮二八之数，故似月圆也。《参同契》云：上弦兑亦八，下弦艮亦八，两弦合其精，<b>乾</b><b>坤</b>体乃成。二八应一斤，易道正不倾。故真一子曰：上下两弦，一，斤之数分三百八十四铢，以用运火符爻所是也。仙翁指示月圆之意，要使学者洞明造化之指，分内外二八之数，不可一槩而论之也。火非人间火也，元始之祖气也，<b>阴阳</b>之气而无质者也。亦无药可守，谩言而已。青霞子曰：鼎鼎非金鼎，炉炉非玉炉。火从离下发，水向坎中符。三性既会合，二物自相拘。固济胎不泄，变化在须臾。高象先曰：天地捆缊，男女姤精。<b>四象</b><b>五行</b>随辐辏，<mark>昼夜屯蒙法自然</mark>，焉用孜孜看<b>火候</b>。此言世间之鼎炉，乃自然鼎炉中之火也。但<mark>安神定息</mark>，任其自然，调文治武，则符刻漏不得分毫差忒，不半时辰，立得丹饵。然后复依此进退，阴符阳火，运用抽添，防危虑险，十月功圆，剥尽群阴，体化纯阳，跳出尘笼寿万年也。此方为金液还丹也，尚未能入妙，更抱一九载，使气归神，方为九转金液大还丹也。于斯时也，<mark>形神俱妙</mark>，与道合真矣。", "o": "顛倒顛之義明白也。青龍白虎，元是真一之精變為二物，分位東西，實同出而異名也。真一之精屬汞，汞為龍，在東，故真一之精居東也。白虎本是真一精之子，寄體生在西，其家在東束也。故仙翁曰：金公本是東家子，送在西鄰寄體生。認得唤來歸合養，配將姹女作親情是也。金公者，鉛也。姹女者，汞也。以鉛點己之汞而結為聖胎，所以牽將白虎歸家養，配以青龍結為夫婦，產箇明珠似月圓也。○似月圓者，修丹之士，先取上西畔半輪之月，得陽金八兩。次取下東畔半輪之月，得弦水半斤。以此兩箇半輪之月，合氣而生丹，故得<b>金丹</b>一粒似月圓也。亦如道光禪師謂，靈丹一粒，其重一斤。此乃兩箇八兩合成一斤而言之，與仙翁月圓之意亦同。此比喻外藥法象也。及得此丹吞入己腹中，則<b>金丹</b>卻為白虎，又牽此白虎歸己腹中，配以己汞，然後運陰符陽火，循歷六十四卦，煅鍊成金液還丹，一粒亦重一斤，似月圓也。此比喻內藥法象也。內丹所以似月圓者，蓋運火之卦，一卦有六爻，六十四卦計三百八十四爻，象一斤三百八十四銖也。外丹所以似月圓者，一斤乃上下二弦，半輪二八之數，故似月圓也。《參同契》云：上弦兌亦八，下弦艮亦八，兩弦合其精，<b>乾</b><b>坤</b>體乃成。二八應一斤，易道正不傾。故真一子曰：上下兩弦，一，斤之數分三百八十四銖，以用運火符爻所是也。仙翁指示月圓之意，要使學者洞明造化之指，分內外二八之數，不可一槩而論之也。火非人間火也，元始之祖氣也，陰陽之氣而無質者也。亦無藥可守，謾言而已。青霞子曰：鼎鼎非金鼎，爐爐非玉爐。火從離下發，水向坎中符。三性既會合，二物自相拘。固濟胎不泄，變化在須臾。高象先曰：天地綑緼，男女姤精。<b>四象</b><b>五行</b>隨輻輳，晝夜屯蒙法自然，焉用孜孜看<b>火候</b>。此言世間之鼎爐，乃自然鼎爐中之火也。但<mark>安神定息</mark>，任其自然，調文治武，則符刻漏不得分毫差忒，不半時辰，立得丹餌。然後復依此進退，陰符陽火，運用抽添，防危慮險，十月功圓，剝盡羣陰，體化純陽，跳出塵籠壽萬年也。此方為金液還丹也，尚未能入妙，更抱一九載，使氣歸神，方為九轉金液大還丹也。於斯時也，<mark>形神俱妙</mark>，與道合真矣。", "i": 79}, {"t": "note", "s": "疏曰：汞者，太阳流珠也。得金华而结<b>金丹</b>，本因太阳流珠而生。太阳流珠又因东方青龙而生，故为东方之子，金公是也。金公，<b>金丹</b>也。本是东家之子，太阳流珠寄体于西方金华而生，张随注《参同契》云：一月三十日，三百六十时，象小炉鼎。一年十二月，卦气节度、火侯进退，象大炉鼎。推荡成六百篇，非世间之火也。神仙嗟凡人不识真火，故设卦爻而象之。夫卦者，火之筌蹄也。见火之用，卦爻可忘。无名子之注本此也。", "o": "疏曰：汞者，太陽流珠也。得金華而結<b>金丹</b>，本因太陽流珠而生。太陽流珠又因東方青龍而生，故為東方之子，金公是也。金公，<b>金丹</b>也。本是東家之子，太陽流珠寄體於西方金華而生，張隨註《參同契》云：一月三十日，三百六十時，象小爐鼎。一年十二月，卦氣節度、火侯進退，象大爐鼎。推盪成六百篇，非世間之火也。神仙嗟凡人不識真火，故設卦爻而象之。夫卦者，火之筌蹄也。見火之用，卦爻可忘。無名子之註本此也。", "i": 80}, {"t": "p", "s": "要知产药川源处，只在西南是本乡。", "o": "要知產藥川源處，只在西南是本鄉。", "i": 81}, {"t": "p", "s": "铅见癸生急须采，金逢望远不堪尝。", "o": "鉛見癸生急須採，金逢望遠不堪嘗。", "i": 82}, {"t": "p", "s": "送归土釜牢封固，次入疏珠厮配当。", "o": "送歸土釜牢封固，次入疏珠廝配當。", "i": 83}, {"t": "p", "s": "药重一斤须二八，调停<b>火候</b>托<b>阴阳</b>。", "o": "藥重一斤須二八，調停<b>火候</b>託陰陽。", "i": 84}, {"t": "note", "s": "注曰：《西华经》曰：药生西方，收归<b>戊己</b>。探及其时，下功有日。夫西南<b>坤</b>地，虎生处也。<b>坤</b>方又是月所生之处，故日本月。是金水之精，上下两弦合气成丹。是以<b>金丹</b>药村土产川源之处，实出于<b>坤</b>地也。铅遇癸生，时将丑也。金逢望远，月将亏也。月之圆存乎口诀，时之子妙在心传。周天息数微微数，玉漏声寒滴滴符。此真人口口相传之密旨也。陆思诚作《悟真篇后序》云：以此诗传者，多谬以铅为若字，以金为如字，甚失仙翁旨意。铅与金即<b>金丹</b>也。陆公发其瑞救鲁鱼之失，秘其源惧竹帛之传。吾侪亲授师旨，当自知之。如或不然，空玄之中，去地五丈。黍米之珠，未易得也。奈何纷纷傍门，以圭丹为铅金，在天癸时探取，真同兄戏。又有<b>坤</b>纳癸之说，如叶文叔者，可付之一笑。盖<b>金丹</b>以癸日子时下工，不得逾时过刻，是以急探也。望日既远，月亏气喊，故不堪尝也。盖癸日遁得壬子时、天壬地癸会于北方，故朱震《易传》曰：晦日朔旦，坎月离日会于壬癸。坎月戊也，离日己也。又曰：三日暮震，象月出庚。八日兑，象月现丁。十五<b>乾</b>，象月盈甲壬。十六日日一巽，象月退辛。二十三日艮，象月消丙。三十日<b>坤</b>，象月灭乙藏癸。晦日朔旦，月中坎水流戊，日中离火就己。此乃天机要旨，当以口诀，难以书传，未遇真师，徒尔妄意强猜穿凿而已。饵丹归丹田土釜之中，固济胎不泄，运火飞流珠之汞以配之，则胎结圣矣。乌肝八两、兔髓半斤，合成一斤，故日药重一斤须二八也。火实无火，不过假托<b>阴阳</b>二气，调停而运用耳。", "o": "註曰：《西華經》曰：藥生西方，收歸<b>戊己</b>。探及其時，下功有日。夫西南<b>坤</b>地，虎生處也。<b>坤</b>方又是月所生之處，故日本月。是金水之精，上下兩弦合氣成丹。是以<b>金丹</b>藥村土產川源之處，實出於<b>坤</b>地也。鉛遇癸生，時將丑也。金逢望遠，月將虧也。月之圓存乎口訣，時之子妙在心傳。周天息數微微數，玉漏聲寒滴滴符。此真人口口相傳之密旨也。陸思誠作《悟真篇後序》云：以此詩傳者，多謬以鉛為若字，以金為如字，甚失仙翁旨意。鉛與金即<b>金丹</b>也。陸公發其瑞救魯魚之失，祕其源懼竹帛之傳。吾儕親授師旨，當自知之。如或不然，空玄之中，去地五丈。黍米之珠，未易得也。奈何紛紛傍門，以圭丹為鉛金，在天癸時探取，真同兄戲。又有<b>坤</b>納癸之說，如葉文叔者，可付之一笑。蓋<b>金丹</b>以癸日子時下工，不得逾時過刻，是以急探也。望日既遠，月虧氣喊，故不堪嘗也。蓋癸日遁得壬子時、天壬地癸會于北方，故朱震《易傳》曰：晦日朔旦，坎月離日會于壬癸。坎月戊也，離日己也。又曰：三日暮震，象月出庚。八日兌，象月現丁。十五<b>乾</b>，象月盈甲壬。十六日日一巽，象月退辛。二十三日艮，象月消丙。三十日<b>坤</b>，象月滅乙藏癸。晦日朔旦，月中坎水流戊，日中離火就己。此乃天機要旨，當以口訣，難以書傳，未遇真師，徒爾妄意強猜穿鑿而已。餌丹歸丹田土釜之中，固濟胎不泄，運火飛流珠之汞以配之，則胎結聖矣。烏肝八兩、兔髓半斤，合成一斤，故日藥重一斤須二八也。火實無火，不過假託陰陽二氣，調停而運用耳。", "i": 85}, {"t": "note", "s": "疏曰：人因癸生之时，或探天癸，或遁时癸，安知《悟真》之秘旨。时将丑者，言时已过也。月将亏者，言日已过也。日时既过，铅已息者将消，金已盈者将亏。探之无有，尝之无效，《易》日…水流湿，火就燥。流就者，水火之性也。<b>戊己</b>者，水火中之土也。水流火就，皆怀<b>戊己</b>以生成。壬癸者，日月藏用之地也。<b>戊己</b>者，日月显明之方也。壬癸拱子，<b>戊己</b>拱午。子午朔望，日月魂魄，<b>金丹</b>之妙用也。详见一月小周天数中。阳为火也，阴亦为火也。火实无火，乃天地日月之精气，假托而运用之。", "o": "疏曰：人因癸生之時，或探天癸，或遁時癸，安知《悟真》之祕旨。時將丑者，言時已過也。月將虧者，言日已過也。日時既過，鉛已息者將消，金已盈者將虧。探之無有，嘗之無效，《易》日…水流濕，火就燥。流就者，水火之性也。<b>戊己</b>者，水火中之土也。水流火就，皆懷<b>戊己</b>以生成。壬癸者，日月藏用之地也。<b>戊己</b>者，日月顯明之方也。壬癸拱子，<b>戊己</b>拱午。子午朔望，日月魂魄，<b>金丹</b>之妙用也。詳見一月小周天數中。陽為火也，陰亦為火也。火實無火，乃天地日月之精氣，假託而運用之。", "i": 86}, {"t": "p", "s": "万卷仙经语总同，<b>金丹</b>只此是根宗。", "o": "萬卷仙經語總同，<b>金丹</b>只此是根宗。", "i": 87}, {"t": "p", "s": "依他<b>坤</b>位生成体，种在<b>乾</b>家交感宫。", "o": "依他<b>坤</b>位生成體，種在<b>乾</b>家交感宮。", "i": 88}, {"t": "p", "s": "莫怪天机都泄漏，只绿学者自愚蒙。", "o": "莫怪天機都泄漏，只綠學者自愚蒙。", "i": 89}, {"t": "p", "s": "若人了得诗中意，立见三清太上翁。", "o": "若人了得詩中意，立見三清太上翁。", "i": 90}, {"t": "note", "s": "注曰：万卷仙经，至当归一，莫不以<b>龙虎</b>二八初弦之气为丹之质，但依<b>坤</b>母生成之理逆而修之，得丹之后，种在<b>乾</b>父交感之官，以运符火。修丹至要，不出铅火二字，铅火为大丹之本。仙翁于此泄尽天机，学者皓首迷蒙，何不近取诸身，以明至道，结成一黍，立宾于天。疏曰：崔公《入药镜》云：产在<b>坤</b>，种在<b>乾</b>是也。产在<b>坤</b>，先天气<b>外药</b>也。种在<b>乾</b>，后天气<b>内药</b>也。<b>坤</b>母生成之理，<b>坤</b>位西南，月出于庚，金水生成，两弦妙用，此产在<b>坤</b>也。<b>乾</b>父交感之官，中官北海，犹<b>乾</b>之在西北，饵丹于中，<b>铅汞</b>交感，以成变化，此种在<b>乾</b>也。铅者，白虎也。火者，青龙也。白虎之弦气铅，亦为水青龙之弦气火，非凡火。铅者，月之精，生于水，成于金，有质而有气，天地妙化之根也。火者，日之精，生于木，克于金，有气而无质，天地发生之本也。故日修丹之要、大丹之本，不出铅火也。陆子野曰：地为<b>坤</b>位，我是<b>乾</b>宗。藉彼<b>坤</b>中生物之气，自种灵根于家国之下，以成圣胎尔。万卷千经理不过此也。", "o": "註曰：萬卷仙經，至當歸一，莫不以龍虎二八初弦之氣為丹之質，但依<b>坤</b>母生成之理逆而修之，得丹之後，種在<b>乾</b>父交感之官，以運符火。修丹至要，不出鉛火二字，鉛火為大丹之本。仙翁於此泄盡天機，學者皓首迷蒙，何不近取諸身，以明至道，結成一黍，立賓于天。疏曰：崔公《入藥鏡》云：產在<b>坤</b>，種在<b>乾</b>是也。產在<b>坤</b>，先天氣外藥也。種在<b>乾</b>，後天氣內藥也。<b>坤</b>母生成之理，<b>坤</b>位西南，月出於庚，金水生成，兩弦妙用，此產在<b>坤</b>也。<b>乾</b>父交感之官，中官北海，猶<b>乾</b>之在西北，餌丹於中，鉛汞交感，以成變化，此種在<b>乾</b>也。鉛者，白虎也。火者，青龍也。白虎之弦氣鉛，亦為水青龍之弦氣火，非凡火。鉛者，月之精，生於水，成於金，有質而有氣，天地妙化之根也。火者，日之精，生於木，克於金，有氣而無質，天地發生之本也。故日修丹之要、大丹之本，不出鉛火也。陸子野曰：地為<b>坤</b>位，我是<b>乾</b>宗。藉彼<b>坤</b>中生物之氣，自種靈根於家國之下，以成聖胎爾。萬卷千經理不過此也。", "i": 91}, {"t": "p", "s": "三五一都三个字，古今明者实然稀。", "o": "三五一都三箇字，古今明者實然稀。", "i": 92}, {"t": "p", "s": "束三南二同成五，北一西方四共之。", "o": "束三南二同成五，北一西方四共之。", "i": 93}, {"t": "p", "s": "<b>戊己</b>自归生数五，三家相见结婴儿。", "o": "<b>戊己</b>自歸生數五，三家相見結嬰兒。", "i": 94}, {"t": "p", "s": "是知太一含真气，十月胎圆入圣基。", "o": "是知太一含真氣，十月胎圓入聖基。", "i": 95}, {"t": "note", "s": "注曰：三五一，不离<b>龙虎</b>也。龙属木，木数三，居东。木能生火，故龙之弦气属火。火数二，居南。二物同源，故三与二合成一五也。虎属金，金数四，居西。金能生水，放虎之弦气属水，水数＇，居北。二物同官，故四与一合成二五也。二物之五交于<b>戊己</b>之中官，中宫属土，土生数五，是为三五也。三五合而成丹，丹者，一也，故日三五一也。此三个字，自古迄今，能合三五一而成丹，能了达婴兄者，实稀有也。一即<b>金丹</b>也。婴儿者，即丹也。丹是一，一是真一之气，天地之母气也。己之真气，天地之子气也。以母气咽归五内，以伏子气，犹猫伏鼠而不走也。子母之气相恋，于胞胎之中结成婴儿之一，故日太一含真气，言含真一之气，如人怀胎十月满足，然后降生圣胎，亦如之十月功圆，自然神圣，故日十月胎圆入圣基。后人以肾为婴兄，安有如此之功。", "o": "註曰：三五一，不離龍虎也。龍屬木，木數三，居東。木能生火，故龍之弦氣屬火。火數二，居南。二物同源，故三與二合成一五也。虎屬金，金數四，居西。金能生水，放虎之弦氣屬水，水數＇，居北。二物同官，故四與一合成二五也。二物之五交於<b>戊己</b>之中官，中宮屬土，土生數五，是為三五也。三五合而成丹，丹者，一也，故日三五一也。此三箇字，自古迄今，能合三五一而成丹，能了達嬰兄者，實稀有也。一即<b>金丹</b>也。嬰兒者，即丹也。丹是一，一是真一之氣，天地之母氣也。己之真氣，天地之子氣也。以母氣咽歸五內，以伏子氣，猶貓伏鼠而不走也。子母之氣相戀，於胞胎之中結成嬰兒之一，故日太一含真氣，言含真一之氣，如人懷胎十月滿足，然後降生聖胎，亦如之十月功圓，自然神聖，故日十月胎圓入聖基。後人以腎為嬰兄，安有如此之功。", "i": 96}, {"t": "note", "s": "疏曰：一二三四五生数，生则有兆而未成形，非世问有质之<b>五行</b>，天地虚无之气，此为先天。六七八九十届成数，成则有形，非先天无质之<b>五行</b>，此为后天。天一地四为五，合中五成十。天三地二为五，合中五成十。两五相偶，亦合为天数二十有五。<b>金丹</b>因先天<b>五行</b>成丹，故只取<b>五行</b>生数。肾为婴儿，心为妮女，出于内外二景。存想神鬼之法皆阴也，是以无功焉。右分<b>内药</b>。", "o": "疏曰：一二三四五生數，生則有兆而未成形，非世問有質之<b>五行</b>，天地虛無之氣，此為先天。六七八九十屆成數，成則有形，非先天無質之<b>五行</b>，此為後天。天一地四為五，合中五成十。天三地二為五，合中五成十。兩五相偶，亦合為天數二十有五。<b>金丹</b>因先天<b>五行</b>成丹，故只取<b>五行</b>生數。腎為嬰兒，心為妮女，出於內外二景。存想神鬼之法皆陰也，是以無功焉。右分內藥。", "i": 97}, {"t": "h2", "s": "五一实四韵一首", "o": "五一實四韻一首", "i": 98}, {"t": "p", "s": "以象太一之奇", "o": "以象太一之奇", "i": 99}, {"t": "p", "s": "女子著青衣，郎君披素练。见之不可用，用之不可见。恍惚裹相逢，杳冥中有变。一作夫妇若相逢恩情自相恋。一霎火焰飞，真人自出现。", "o": "女子著青衣，郎君披素練。見之不可用，用之不可見。恍惚裹相逢，杳冥中有變。一作夫婦若相逢恩情自相戀。一霎火焰飛，真人自出現。", "i": 100}, {"t": "note", "s": "注曰：女子者，龙之弦气也，阳中之阴，故日女子，又名木姬。生于青龙，故著青衣也。郎君者，虎之弦气也，阴中之阳，故日郎君，又名金郎。生于白虎，故披素练也。有质可见者，后天地生滓质之物类也，以其有质，故可见而不可用也。无形可睹者，<b>龙虎</b>二八初弦之气也，以其有气而无质，故不可见而可用也，实探铅之枢机也。恍恍惚惚、杳杳冥冥者，混元真一之气也，生于天地之先不可测度。恍惚中有物者，龙之弦气也。杳冥中有精者，虎之弦气也。二孩之气在于恍惚之中、杳冥之内，捆缢相逢，磅砖相恋。故得真一之气灵非有，变而为一黍之珠，此无中生有之妙也。真人者，<b>金丹</b>也。圣人将一年火侯擭于一个时辰中，又于一个时辰中分为六侯，先于两候中运火煆炼，立得真一之气，结成一粒之珠，现在北海之中，大如黍米。岂非一霎时火，真人自出现乎。此道至妙至玄，苟非遭遇真师，口授真诀，其孰能与于此哉。仙仑咏此一章，所以五言四韵一首，表<b>五行</b><b>四象</b>而成一粒之<b>黍珠</b>也。丹虽是真一之气所变，苟不因<b>龙虎</b>二弦之气相交，则亦不能成丹矣。盖<b>龙虎</b>并二弦者<b>四象</b>，<b>四象</b>交会于中官而成丹。丹土也，乃真<b>五行</b>也。老君曰：<b>五行</b>即是药，<b>四象</b>不可阙是也。故<b>五行</b><b>四象</b>合而成丹，所以仙翁日五言四韵一首，以象太一之奇者，此也。阳子曰：此诗八句，括尽一部丹经之妙用。首句是<b>乾</b>家事为木汞，属我。二句是兑家事为铅，属他。三句则生人物矣，四句可以炼丹，五句为入室下功，六句乃防危杜险，七句即丹成九转，八句为行满三千。仙师布流此诗者，惟欲指出先天混元真一之气，即太一所舍之物气，学者可不求师乎。", "o": "註曰：女子者，龍之弦氣也，陽中之陰，故日女子，又名木姬。生於青龍，故著青衣也。郎君者，虎之弦氣也，陰中之陽，故日郎君，又名金郎。生於白虎，故披素練也。有質可見者，後天地生滓質之物類也，以其有質，故可見而不可用也。無形可睹者，龍虎二八初弦之氣也，以其有氣而無質，故不可見而可用也，實探鉛之樞機也。恍恍惚惚、杳杳冥冥者，混元真一之氣也，生於天地之先不可測度。恍惚中有物者，龍之弦氣也。杳冥中有精者，虎之弦氣也。二孩之氣在於恍惚之中、杳冥之內，綑縊相逢，磅磚相戀。故得真一之氣靈非有，變而為一黍之珠，此無中生有之妙也。真人者，<b>金丹</b>也。聖人將一年火侯擭於一箇時辰中，又於一箇時辰中分為六侯，先於兩候中運火煆鍊，立得真一之氣，結成一粒之珠，現在北海之中，大如黍米。豈非一霎時火，真人自出現乎。此道至妙至玄，苟非遭遇真師，口授真訣，其孰能與於此哉。仙侖詠此一章，所以五言四韻一首，表<b>五行</b><b>四象</b>而成一粒之<b>黍珠</b>也。丹雖是真一之氣所變，苟不因龍虎二弦之氣相交，則亦不能成丹矣。蓋龍虎并二弦者<b>四象</b>，<b>四象</b>交會於中官而成丹。丹土也，乃真<b>五行</b>也。老君曰：<b>五行</b>即是藥，<b>四象</b>不可闕是也。故<b>五行</b><b>四象</b>合而成丹，所以仙翁日五言四韻一首，以象太一之奇者，此也。陽子曰：此詩八句，括盡一部丹經之妙用。首句是<b>乾</b>家事為木汞，屬我。二句是兌家事為鉛，屬他。三句則生人物矣，四句可以鍊丹，五句為入室下功，六句乃防危杜險，七句即丹成九轉，八句為行滿三千。仙師布流此詩者，惟欲指出先天混元真一之氣，即太一所舍之物氣，學者可不求師乎。", "i": 101}];
