<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>南华真经（庄子） · 說劍（2/2）</title><link rel="stylesheet" href="../assets/reader.css"></head><body data-book="nanhua" data-ch="31" data-pg="2"><div class="toolbar"><span class="t">☯ <a href="index.html">南华真经（庄子）</a></span><span class="cnt">第 31 章 · 2/2 页</span><button id="btnTg">切换到繁体原文</button><button id="btnNotes">隐藏注解</button><button id="btnTheme">🌙</button><span class="dl">⬇ <a href="../nanhua_zhenjing_simp.txt" download>简体</a> · <a href="../nanhua_zhenjing.txt" download>原文</a></span></div><div class="wrap"><h2 class="ch">說劍<span class="pgno">第 2/2 页</span></h2><div class="content-simp"><p>于是文王不出宫三月，剑士皆服毙其处也。</p>
<div class="note"><span class="badge">历代注解</span><div>成玄英疏曰：赵惠王，名何，赵武灵王之子也。好击剑之士，养客三千，好无厌足。其国衰敝，故诸侯知其无道，共相谋议，欲将伐之也。</div></div></div><div class="content-trad"><p>於是文王不出宮三月，劍士皆服斃其處也。</p>
<div class="note"><span class="badge">历代注解</span><div>成玄英疏曰：趙惠王，名何，趙武靈王之子也。好擊劍之士，養客三千，好無厭足。其國衰敝，故諸侯知其無道，共相謀議，欲將伐之也。</div></div></div><div class="nav"><a href="c31_01.html">← 上一页</a><span class="mid"><a href="index.html">☰ 目录</a> · <a href="c31_01.html">說劍</a></span><a href="c32_01.html">下一页 →</a></div><p class="end">— 南华真经（庄子） · 說劍 · 2/2 —</p></div><script src="../assets/reader.js"></script></body></html>
