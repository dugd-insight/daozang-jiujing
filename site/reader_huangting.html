<script>
var SEGS = [{"t": "h1", "s": "太上黄庭内景经（黄庭内景经）", "o": "太上黄庭内景经（黄庭内景经）", "i": 0}, {"t": "q", "s": "道教上清派核心经典，托名太上大道玉晨君所传，叙存思身神、内观脏腑之内炼功夫，共三十六章。历代有修证注解以唐代梁丘子（白履忠）注最为著名，后世内丹家亦多发挥（务成子、蒋国祚等）。", "o": "道教上清派核心经典，托名太上大道玉晨君所传，叙存思身神、内观脏腑之内炼功夫，共三十六章。历代有修证注解以唐代梁丘子（白履忠）注最为著名，后世内丹家亦多发挥（务成子、蒋国祚等）。", "i": 1}, {"t": "q", "s": "文本来源：中国哲学书电子化计划（ctext.org）《黄庭内景经》。", "o": "文本来源：中国哲学书电子化计划（ctext.org）《黄庭内景经》。", "i": 2}, {"t": "h2", "s": "上清章第一", "o": "上清章第一", "i": 3}, {"t": "p", "s": "<b>上清</b>紫霞虚皇前，太上大道玉晨君。闲居<b>蕊珠</b>作<b>七言</b>，<span class=\"key\">散化五形变万神</span>。", "o": "<b>上清</b>紫霞虛皇前，太上大道玉晨君。閑居<b>蕊珠</b>作<b>七言</b>，散化五形變萬神。", "i": 4}, {"t": "p", "s": "是为<b>黄庭</b>曰内篇，<mark>琴心三叠舞胎仙</mark>。九气映明出霄间，神盖童子生紫烟。", "o": "是為黃庭曰內篇，琴心三疊舞<b>胎仙</b>。九氣映明出霄間，神蓋童子生紫煙。", "i": 5}, {"t": "p", "s": "是曰玉书可精研，<mark>咏之万过升三天</mark>。千灾以消百病痊，不惮虎狼之凶残，", "o": "是曰玉書可精研，詠之萬過昇三天。千災以消百病痊，不憚虎狼之兇殘，", "i": 6}, {"t": "p", "s": "亦以却老年永延。", "o": "亦以卻老年永延。", "i": 7}, {"t": "h2", "s": "上有章第二", "o": "上有章第二", "i": 8}, {"t": "p", "s": "<mark>上有魂灵下关元</mark>，左为<b>少阳</b>右<b>太阴</b>。后有<b>密户</b>前<b>生门</b>。<mark>出日入月呼吸存</mark>。", "o": "上有魂靈下關元，左為少陽右太陰。後有密戶前生門。<mark>出日入月呼吸存</mark>。", "i": 9}, {"t": "p", "s": "四气所合列宿分，紫烟上下三素云。灌溉五华植<b>灵根</b>，<mark>七液洞流冲庐间</mark>。", "o": "四氣所合列宿分，紫煙上下三素雲。灌溉五華植靈根，七液洞流沖廬間。", "i": 10}, {"t": "p", "s": "<mark>回紫抱黄入丹田</mark>，<mark>幽室内明照阳明</mark>。", "o": "回紫抱黃入<b>丹田</b>，幽室內明照陽明。", "i": 11}, {"t": "h2", "s": "口为章第三", "o": "口為章第三", "i": 12}, {"t": "p", "s": "口为<b>玉池</b>太和官。<mark>漱咽灵液灾不干</mark>。体生光华气香兰，却灭百邪玉炼颜。", "o": "口為<b>玉池</b>太和官。漱咽靈液災不干。體生光華氣香蘭，卻滅百邪玉煉顏。", "i": 13}, {"t": "p", "s": "<mark>审能修之登广寒</mark>。<mark>昼夜不寐乃成真</mark>，<mark>雷鸣电激神泯泯</mark>。", "o": "審能修之登廣寒。晝夜不寐乃成真，雷鳴電激神泯泯。", "i": 14}, {"t": "h2", "s": "黄庭章第四", "o": "黃庭章第四", "i": 15}, {"t": "p", "s": "<b>黄庭</b>内人服锦衣，紫华飞裙云气罗。丹青绿条翠灵柯。七蕤玉籥闭两扉，", "o": "黃庭內人服錦衣，紫華飛裙雲氣羅。丹青綠條翠靈柯。七蕤玉籥閉兩扉，", "i": 16}, {"t": "p", "s": "重扇金关密枢机。<b>玄泉</b>幽关高崔巍，<mark>三田之中精气微</mark>。<b>娇女</b>窈窕翳霄晖，", "o": "重扇金關密樞機。<b>玄泉</b>幽關高崔巍，<b>三田</b>之中精氣微。嬌女窈窕翳霄暉，", "i": 17}, {"t": "p", "s": "重堂焕焕明八威。天庭地关列斧斤，灵台盘固永不衰。", "o": "重堂煥煥明八威。天庭地關列斧斤，靈臺盤固永不衰。", "i": 18}, {"t": "h2", "s": "中池章第五", "o": "中池章第五", "i": 19}, {"t": "p", "s": "中池内神服<b>赤珠</b>，丹锦云袍带<b>虎符</b>。横津三寸灵所居，隐芝翳郁自相扶。", "o": "中池內神服<b>赤珠</b>，丹錦雲袍帶<b>虎符</b>。橫津三寸靈所居，隱芝翳鬱自相扶。", "i": 20}, {"t": "h2", "s": "天中章第六", "o": "天中章第六", "i": 21}, {"t": "p", "s": "天中之岳精谨修，云宅既清玉帝游。通利道路无终休，眉号<b>华盖</b>覆明珠。", "o": "天中之岳精謹修，雲宅既清玉帝游。通利道路無終休，眉號華蓋覆明珠。", "i": 22}, {"t": "p", "s": "九幽日月洞空无，宅中有真常衣丹。<mark>审能见之无疾患</mark>，<b>赤珠</b>灵裙华茜粲。", "o": "九幽日月洞空無，宅中有真常衣丹。審能見之無疾患，<b>赤珠</b>靈裙華茜粲。", "i": 23}, {"t": "p", "s": "<mark>舌下玄膺生死岸</mark>，出青入玄二气焕，子若遇之升天汉。", "o": "<mark>舌下玄膺生死岸</mark>，出青入玄二氣煥，子若遇之昇天漢。", "i": 24}, {"t": "h2", "s": "至道章第七", "o": "至道章第七", "i": 25}, {"t": "p", "s": "<mark>至道不烦决存真</mark>，<span class=\"key\">泥丸百节皆有神</span>。发神苍华字太元，脑神精根字<b>泥丸</b>，", "o": "至道不煩決存真，<b>泥丸</b>百節皆有神。發神蒼華字太元，腦神精根字<b>泥丸</b>，", "i": 26}, {"t": "p", "s": "眼神明上字英玄，鼻神玉垄字灵坚，耳神空闲字幽田，舌神通命字正伦，", "o": "眼神明上字英玄，鼻神玉壟字靈堅，耳神空閑字幽田，舌神通命字正倫，", "i": 27}, {"t": "p", "s": "齿神崿锋字罗千。<mark>一面之神宗泥丸</mark>，<mark>泥丸九真皆有房</mark>。方圆一寸处此中，", "o": "齒神崿鋒字羅千。<mark>一面之神宗泥丸</mark>，<mark>泥丸九真皆有房</mark>。方圓一寸處此中，", "i": 28}, {"t": "p", "s": "同服紫衣飞罗裳。<mark>但思一部寿无穷</mark>，非各别住俱脑中。列位次坐向外方。", "o": "同服紫衣飛羅裳。但思一部壽無窮，非各別住俱腦中。列位次坐向外方。", "i": 29}, {"t": "p", "s": "所存在心自相当。", "o": "所存在心自相當。", "i": 30}, {"t": "h2", "s": "心神章第八", "o": "心神章第八", "i": 31}, {"t": "p", "s": "<b>心神</b>丹元字守灵，<b>肺神</b>皓华字虚成。<b>肝神</b>龙烟字含明，翳郁导烟主浊清。", "o": "<b>心神</b>丹元字守靈，<b>肺神</b>皓華字虛成。<b>肝神</b>龍煙字含明，翳鬱導煙主濁清。", "i": 32}, {"t": "p", "s": "<b>肾神</b>玄冥字育婴，<b>脾神</b>常在字魂停。<b>胆神</b>龙曜字威明。六腑五藏神体精，", "o": "腎神玄冥字育嬰，<b>脾神</b>常在字魂停。膽神龍曜字威明。六腑五藏神體精，", "i": 33}, {"t": "p", "s": "皆在心内运天经。昼夜存之自长生。", "o": "皆在心內運天經。晝夜存之自長生。", "i": 34}, {"t": "h2", "s": "肺部章第九", "o": "肺部章第九", "i": 35}, {"t": "p", "s": "肺部之宫似<b>华盖</b>，下有童子坐玉阙。七元之子主调气，外应中岳鼻齐位。", "o": "肺部之宮似華蓋，下有童子坐玉闕。七元之子主調氣，外應中嶽鼻齊位。", "i": 36}, {"t": "p", "s": "素锦衣裳黄云带，喘息呼吸体不快。急存白元和六气，神仙久视无灾害。", "o": "素錦衣裳黃雲帶，喘息呼吸體不快。急存白元和六氣，神仙久視無災害。", "i": 37}, {"t": "p", "s": "用之不已形不滞。", "o": "用之不已形不滯。", "i": 38}, {"t": "h2", "s": "心部章第十", "o": "心部章第十", "i": 39}, {"t": "p", "s": "心部之宫莲含华，下有童子丹元家。主适寒热荣卫和，丹锦飞裳披玉罗。", "o": "心部之宮蓮含華，下有童子丹元家。主適寒熱榮衛和，丹錦飛裳披玉羅。", "i": 40}, {"t": "p", "s": "金铃朱带坐婆娑，调血理命身不枯，外应口舌吐五华。临绝呼之亦登苏，", "o": "金鈴朱帶坐婆娑，調血理命身不枯，外應口舌吐五華。臨絕呼之亦登蘇，", "i": 41}, {"t": "p", "s": "久久行之飞太霞。", "o": "久久行之飛太霞。", "i": 42}, {"t": "h2", "s": "肝部章第十一", "o": "肝部章第十一", "i": 43}, {"t": "p", "s": "肝部之中翠重里，下有青童神公子。主诸关键聪明始，青锦披裳佩玉铃。", "o": "肝部之中翠重里，下有青童神公子。主諸關鍵聰明始，青錦披裳佩玉鈴。", "i": 44}, {"t": "p", "s": "和制魂魄津液平，外应眼目日月清。百疴不钟存无英,同用七日自充盈。", "o": "和制魂魄津液平，外應眼目日月清。百痾不鍾存無英,同用七日自充盈。", "i": 45}, {"t": "p", "s": "垂绝念神死复生，摄魂还魄永无倾。", "o": "垂絕念神死復生，攝魂還魄永無傾。", "i": 46}, {"t": "h2", "s": "肾部章第十二", "o": "腎部章第十二", "i": 47}, {"t": "p", "s": "肾部之宫玄阙圆，中有童子冥上玄。主诸六府九液源，外应两耳百液津。", "o": "腎部之宮玄闕圓，中有童子冥上玄。主諸六府九液源，外應兩耳百液津。", "i": 48}, {"t": "p", "s": "苍锦云衣舞龙幡，上致明霞日月烟。百病千灾急当存，两部水王对<b>生门</b>，", "o": "蒼錦雲衣舞龍幡，上致明霞日月煙。百病千災急當存，兩部水王對生門，", "i": 49}, {"t": "p", "s": "使人长生升九天。", "o": "使人長生升九天。", "i": 50}, {"t": "h2", "s": "脾部章第十三", "o": "脾部章第十三", "i": 51}, {"t": "p", "s": "脾部之宫属戊已，中有明童黄裳里。消谷散气摄牙齿，是为太仓两明童。", "o": "脾部之宮屬戊已，中有明童黃裳里。消穀散氣攝牙齒，是為太倉兩明童。", "i": 52}, {"t": "p", "s": "坐在金台城九重，方圆一寸<b>命门</b>中。主调<b>百谷</b>五味香，辟却虚羸无病伤。", "o": "坐在金臺城九重，方圓一寸命門中。主調百穀五味香，闢卻虛羸無病傷。", "i": 53}, {"t": "p", "s": "外应尺宅气色芳，光华所生以表明。黄锦玉衣带虎章，注念三老子轻翔，", "o": "外應尺宅氣色芳，光華所生以表明。黃錦玉衣帶虎章，注念三老子輕翔，", "i": 54}, {"t": "p", "s": "长生高仙远死殃。", "o": "長生高仙遠死殃。", "i": 55}, {"t": "h2", "s": "胆部章第十四", "o": "膽部章第十四", "i": 56}, {"t": "p", "s": "胆部之宫六府精，中有童子曜威明。雷电八震扬玉旌，龙旗横天掷火铃。", "o": "膽部之宮六府精，中有童子曜威明。雷電八震揚玉旌，龍旗橫天擲火鈴。", "i": 57}, {"t": "p", "s": "主诸气力摄虎兵，外应眼童鼻柱间。脑发相扶亦俱鲜，九色锦衣绿华裙。", "o": "主諸氣力攝虎兵，外應眼童鼻柱間。腦發相扶亦俱鮮，九色錦衣綠華裙。", "i": 58}, {"t": "p", "s": "佩金带玉龙虎文，能存威明乘庆云，役使万神朝三元。", "o": "佩金帶玉龍虎文，能存威明乘慶雲，役使萬神朝三元。", "i": 59}, {"t": "h2", "s": "脾长章第十五", "o": "脾長章第十五", "i": 60}, {"t": "p", "s": "<mark>脾长一尺掩太仓</mark>，中部老君治<b>明堂</b>。厥字灵元名混康，<mark>治人百病消谷粮</mark>。", "o": "脾長一尺掩太倉，中部老君治<b>明堂</b>。厥字靈元名混康，治人百病消穀糧。", "i": 61}, {"t": "p", "s": "黄衣紫带龙虎章，长精益命赖君王。三呼我名神自通，三老同坐各有朋。", "o": "黃衣紫帶龍虎章，長精益命賴君王。三呼我名神自通，三老同坐各有朋。", "i": 62}, {"t": "p", "s": "或精或胎别执方，桃孩合延生华芒。男女回九有桃康，道父道母对相望。", "o": "或精或胎別執方，桃孩合延生華芒。男女回九有桃康，道父道母對相望。", "i": 63}, {"t": "p", "s": "师父师母丹玄乡，可用<b>存思</b>登虚空。殊途一会归要终，关塞<b>三关</b>握固停。", "o": "師父師母丹玄鄉，可用<b>存思</b>登虛空。殊途一會歸要終，關塞三關握固停。", "i": 64}, {"t": "p", "s": "含漱金醴吞玉英。遂至不饥三虫亡。心意常和致欣昌，五岳之云气彭亨。", "o": "含漱金醴吞玉英。遂至不饑三蟲亡。心意常和致欣昌，五岳之雲氣彭亨。", "i": 65}, {"t": "p", "s": "保灌玉庐以自偿，五形完坚无灾殃。", "o": "保灌玉廬以自償，五形完堅無災殃。", "i": 66}, {"t": "h2", "s": "上睹章第十六", "o": "上睹章第十六", "i": 67}, {"t": "p", "s": "上睹三元如连珠，落落明景照九隅。五灵夜烛焕八区，子存内皇与我游。", "o": "上睹三元如連珠，落落明景照九隅。五靈夜燭煥八區，子存內皇與我游。", "i": 68}, {"t": "p", "s": "身披凤衣衔<b>虎符</b>，一至不久升虚无。方寸之中念深藏，不方不圆闭牖窗。", "o": "身披鳳衣銜<b>虎符</b>，一至不久升虛無。方寸之中念深藏，不方不圓閉牖窗。", "i": 69}, {"t": "p", "s": "三神还精老方壮，魂魄内守不争竞。神生腹中衔玉当，灵注<b>幽阙</b>那得丧。", "o": "三神還精老方壯，魂魄內守不爭競。神生腹中銜玉當，靈注幽闕那得喪。", "i": 70}, {"t": "p", "s": "琳条万寻可荫仗，三魂自宁帝书命。", "o": "琳條萬尋可蔭仗，三魂自寧帝書命。", "i": 71}, {"t": "h2", "s": "灵台章第十七", "o": "靈臺章第十七", "i": 72}, {"t": "p", "s": "灵台郁蔼望黄野，三寸异室有上下。间关营卫高玄受，洞房紫极灵门户。", "o": "靈臺鬱藹望黃野，三寸異室有上下。間關營衛高玄受，洞房紫極靈門戶。", "i": 73}, {"t": "p", "s": "是昔太上告我者，左神公子发神语。右有白元并立处，<b>明堂</b>金匮玉房间。", "o": "是昔太上告我者，左神公子發神語。右有白元並立處，<b>明堂</b>金匱玉房間。", "i": 74}, {"t": "p", "s": "<b>上清</b>真人当吾前，黄裳子丹气频烦。借问何在两眉端，内侠日月列宿陈，", "o": "<b>上清</b>真人當吾前，黃裳子丹氣頻煩。借問何在兩眉端，內俠日月列宿陳，", "i": 75}, {"t": "p", "s": "七曜九元冠<b>生门</b>。", "o": "七曜九元冠生門。", "i": 76}, {"t": "h2", "s": "三关章第十八", "o": "三關章第十八", "i": 77}, {"t": "p", "s": "<b>三关</b>之中精气深，九微之内幽且阴。口为心关精神机，足为地关生命棐，", "o": "三關之中精氣深，九微之內幽且陰。口為心關精神機，足為地關生命棐，", "i": 78}, {"t": "p", "s": "手为人关把盛衰。", "o": "手為人關把盛衰。", "i": 79}, {"t": "h2", "s": "若得章第十九", "o": "若得章第十九", "i": 80}, {"t": "p", "s": "若得三宫存玄丹，太一流珠安<b>昆仑</b>。重重楼阁十二环，自高自下皆真人。", "o": "若得三宮存玄丹，太一流珠安昆侖。重重樓閣十二環，自高自下皆真人。", "i": 81}, {"t": "p", "s": "玉堂绛宇尽玄宫，<b>璇玑</b>玉衡色兰玕。瞻望童子坐盘桓，问谁家子在我身。", "o": "玉堂絳宇盡玄宮，璇璣玉衡色蘭玕。瞻望童子坐盤桓，問誰家子在我身。", "i": 82}, {"t": "p", "s": "此人何去入<b>泥丸</b>，千千百百自相连。一一十十似重山，云仪玉华侠耳门。", "o": "此人何去入<b>泥丸</b>，千千百百自相連。一一十十似重山，云儀玉華俠耳門。", "i": 83}, {"t": "p", "s": "赤帝黄老与己魂，三真扶胥共房津。五斗焕明是七元，日月飞行六合间。", "o": "赤帝黃老與己魂，三真扶胥共房津。五斗煥明是七元，日月飛行六合間。", "i": 84}, {"t": "p", "s": "帝乡天中地户端，面部魂神皆相存。", "o": "帝鄉天中地戶端，面部魂神皆相存。", "i": 85}, {"t": "h2", "s": "呼吸章第二十", "o": "呼吸章第二十", "i": 86}, {"t": "p", "s": "呼吸元气以求仙，仙公公子已在前。朱鸟吐缩白石源，结精育胞化生身。", "o": "呼吸元氣以求仙，仙公公子已在前。朱鳥吐縮白石源，結精育胞化生身。", "i": 87}, {"t": "p", "s": "留胎止精可长生，三气右回九道明。正一含华乃充盈，遥望一心如罗星。", "o": "留胎止精可長生，三氣右回九道明。正一含華乃充盈，遙望一心如羅星。", "i": 88}, {"t": "p", "s": "金室之下可不倾，延我白首反孩婴。", "o": "金室之下可不傾，延我白首反孩嬰。", "i": 89}, {"t": "h2", "s": "琼室章第二十一", "o": "瓊室章第二十一", "i": 90}, {"t": "p", "s": "琼室之中八素集，<b>泥丸</b>夫人当中立。长谷玄乡绕郊邑，六龙散飞难分别。", "o": "瓊室之中八素集，<b>泥丸</b>夫人當中立。長谷玄鄉繞郊邑，六龍散飛難分別。", "i": 91}, {"t": "p", "s": "<span class=\"key\">长生至慎房中急</span>，何为死作令神泣。忽之祸乡三灵殁，但当吸气录子精。", "o": "長生至慎房中急，何為死作令神泣。忽之禍鄉三靈歿，但當吸氣錄子精。", "i": 92}, {"t": "p", "s": "<mark>寸田尺宅可治生</mark>，若当决海百渎倾。叶去树枯失青青，气亡液漏非己形。", "o": "<mark>寸田尺宅可治生</mark>，若當決海百瀆傾。葉去樹枯失青青，氣亡液漏非己形。", "i": 93}, {"t": "p", "s": "专闭御景乃长宁，保我<b>泥丸</b>三奇灵。恬淡闭视内自明，物物不乾泰而平。", "o": "專閉禦景乃長寧，保我<b>泥丸</b>三奇靈。恬淡閉視內自明，物物不乾泰而平。", "i": 94}, {"t": "p", "s": "悫矣匪事老复丁，思咏玉书入<b>上清</b>。", "o": "愨矣匪事老復丁，思詠玉書入<b>上清</b>。", "i": 95}, {"t": "h2", "s": "常念章第二十二", "o": "常念章第二十二", "i": 96}, {"t": "p", "s": "常念三房相通达，洞得视见无内外。存漱五牙不饥渴，神华执巾六丁谒。", "o": "常念三房相通達，洞得視見無內外。存漱五牙不饑渴，神華執巾六丁謁。", "i": 97}, {"t": "p", "s": "<mark>急守精室勿妄泄</mark>，<mark>闭而宝之可长活</mark>。起自形中初不阔，三官近在易隐括。", "o": "急守<b>精室</b>勿妄洩，閉而寶之可長活。起自形中初不闊，三官近在易隱括。", "i": 98}, {"t": "p", "s": "虚无寂寂空中素，使形如是不当污。九室正虚神明舍，<b>存思</b>百念视节度。", "o": "虛無寂寂空中素，使形如是不當污。九室正虛神明舍，<b>存思</b>百念視節度。", "i": 99}, {"t": "p", "s": "六府修治勿令故，行自翱翔入天路。", "o": "六府修治勿令故，行自翱翔入天路。", "i": 100}, {"t": "h2", "s": "治生章第二十三", "o": "治生章第二十三", "i": 101}, {"t": "p", "s": "治生之道了不烦，但修洞玄与玉篇。兼行形中八景神，二十四真出自然。", "o": "治生之道了不煩，但修洞玄與玉篇。兼行形中八景神，二十四真出自然。", "i": 102}, {"t": "p", "s": "高拱无为魂魄安，清净神见与我言。安在紫房帏幕间，立坐室外三五玄。", "o": "高拱無為魂魄安，清凈神見與我言。安在紫房幃幕間，立坐室外三五玄。", "i": 103}, {"t": "p", "s": "烧香接手玉华前，共入太室<b>璇玑</b>门。高研恬淡道之园，内视密盼尽睹真。", "o": "燒香接手玉華前，共入太室璇璣門。高研恬淡道之園，內視密盼盡睹真。", "i": 104}, {"t": "p", "s": "真人在己莫问邻，何处远索求因缘。", "o": "真人在己莫問鄰，何處遠索求因緣。", "i": 105}, {"t": "h2", "s": "隐影章第二十四", "o": "隱影章第二十四", "i": 106}, {"t": "p", "s": "隐形灭形与世殊，含气养精口如朱。带执性命守虚无，名入<b>上清</b>死录除，", "o": "隱形滅形與世殊，含氣養精口如朱。帶執性命守虛無，名入<b>上清</b>死錄除，", "i": 107}, {"t": "p", "s": "三神之乐由隐居。倏欻游遨无遗忧，羽服一整八风驱。控驾三素乘晨霞，", "o": "三神之樂由隱居。倏欻游遨無遺憂，羽服一整八風驅。控駕三素乘晨霞，", "i": 108}, {"t": "p", "s": "金辇正立从玉舆。何不登山诵我书，郁郁窈窕真人墟。入山何难故踌躇，", "o": "金輦正立從玉輿。何不登山誦我書，鬱鬱窈窕真人墟。入山何難故躊躇，", "i": 109}, {"t": "p", "s": "人间纷纷臭帤如。", "o": "人間紛紛臭帤如。", "i": 110}, {"t": "h2", "s": "五行章第二十五", "o": "五行章第二十五", "i": 111}, {"t": "p", "s": "五行相推反归一，三五合气九九节。可用隐地回八术，伏牛<b>幽阙</b>罗品列。", "o": "五行相推反歸一，三五合氣九九節。可用隱地回八術，伏牛幽闕羅品列。", "i": 112}, {"t": "p", "s": "三明出华生死际，洞房灵象斗日月。父曰<b>泥丸</b>母雌一，二光焕照入子室。", "o": "三明出華生死際，洞房靈象斗日月。父曰<b>泥丸</b>母雌一，二光煥照入子室。", "i": 113}, {"t": "p", "s": "能存玄真万事毕，一身精神不可失。", "o": "能存玄真萬事畢，一身精神不可失。", "i": 114}, {"t": "h2", "s": "高奔章第二十六", "o": "高奔章第二十六", "i": 115}, {"t": "p", "s": "高奔日月吾上道，郁仪结璘善相保。乃见玉清虚无老，可以回颜填血脑。", "o": "高奔日月吾上道，鬱儀結璘善相保。乃見玉清虛無老，可以回顏填血腦。", "i": 116}, {"t": "p", "s": "口衔灵芒携五皇，腰带虎箓佩金珰，驾欻接生宴东蒙。", "o": "口銜靈芒攜五皇，腰帶虎籙佩金璫，駕欻接生宴東蒙。", "i": 117}, {"t": "h2", "s": "玄元章第二十七", "o": "玄元章第二十七", "i": 118}, {"t": "p", "s": "玄元上一魂魄炼，一之为物叵卒见。须得至真始顾盼，至忌死气诸秽贱。", "o": "玄元上一魂魄煉，一之為物叵卒見。須得至真始顧盼，至忌死氣諸穢賤。", "i": 119}, {"t": "p", "s": "六神合集虚中宴，结珠固精养神根。玉𥫽金籥常完坚，闭口屈舌食胎津，", "o": "六神合集虛中宴，結珠固精養神根。玉𥫽金籥常完堅，閉口屈舌食胎津，", "i": 120}, {"t": "p", "s": "使我遂炼获飞仙。", "o": "使我遂煉獲飛仙。", "i": 121}, {"t": "h2", "s": "仙人章第二十八", "o": "仙人章第二十八", "i": 122}, {"t": "p", "s": "仙人道士非有神，积精累气以为真。黄童妙音难可闻，玉书绛简赤丹文。", "o": "仙人道士非有神，積精累氣以為真。黃童妙音難可聞，玉書絳簡赤丹文。", "i": 123}, {"t": "p", "s": "字曰真人巾金巾，负甲持符开七门。火兵符图备灵关，前昂后卑高下陈。", "o": "字曰真人巾金巾，負甲持符開七門。火兵符圖備靈關，前昂後卑高下陳。", "i": 124}, {"t": "p", "s": "执剑百丈舞锦幡，十绝盘空扇纷纭。火铃冠霄队落烟，安在黄阙两眉间，", "o": "執劍百丈舞錦幡，十絕盤空扇紛紜。火鈴冠霄隊落煙，安在黃闕兩眉間，", "i": 125}, {"t": "p", "s": "此非枝叶实是根。", "o": "此非枝葉實是根。", "i": 126}, {"t": "h2", "s": "紫清章第二十九", "o": "紫清章第二十九", "i": 127}, {"t": "p", "s": "紫清上皇太道君，太玄太和侠侍端。化生万物使我仙，飞升十天驾玉轮。", "o": "紫清上皇太道君，太玄太和俠侍端。化生萬物使我仙，飛升十天駕玉輪。", "i": 128}, {"t": "p", "s": "<mark>昼夜七日思勿眠</mark>，子能行此可长存。积功成炼非自然，是由精诚亦由专。", "o": "晝夜七日思勿眠，子能行此可長存。積功成煉非自然，是由精誠亦由專。", "i": 129}, {"t": "p", "s": "内守坚固真之真，<span class=\"key\">虚中恬淡自致神</span>。", "o": "內守堅固真之真，虛中恬淡自致神。", "i": 130}, {"t": "h2", "s": "百谷章第三十", "o": "百穀章第三十", "i": 131}, {"t": "p", "s": "<b>百谷</b>之实土地精，五味外美邪魔腥。臭乱神明胎气零，那从反老得还婴。", "o": "百穀之實土地精，五味外美邪魔腥。臭亂神明胎氣零，那從反老得還嬰。", "i": 132}, {"t": "p", "s": "三魂忽忽魄糜倾，何不食气太和精，故能不死入黄宁。", "o": "三魂忽忽魄糜傾，何不食氣太和精，故能不死入黃寧。", "i": 133}, {"t": "h2", "s": "心典章第三十一", "o": "心典章第三十一", "i": 134}, {"t": "p", "s": "心典一体五藏王，动静念之道德行。清洁喜气自明光，坐起吾俱共栋梁。", "o": "心典一體五藏王，動靜念之道德行。清潔喜氣自明光，坐起吾俱共棟梁。", "i": 135}, {"t": "p", "s": "昼日曜景暮闭藏，通利华精调阴阳。", "o": "晝日曜景暮閉藏，通利華精調陰陽。", "i": 136}, {"t": "h2", "s": "经历章第三十二", "o": "經歷章第三十二", "i": 137}, {"t": "p", "s": "经历六合隐卯酉，两肾之神主延寿。转降适斗藏初九，知雄守雌可无老，", "o": "經歷六合隱卯酉，兩腎之神主延壽。轉降適斗藏初九，知雄守雌可無老，", "i": 138}, {"t": "p", "s": "知白见黑急坐守。", "o": "知白見黑急坐守。", "i": 139}, {"t": "h2", "s": "肝气章第三十三", "o": "肝氣章第三十三", "i": 140}, {"t": "p", "s": "肝气郁勃清且长，罗列六府生三光。心精意专内不倾，上合三焦下玉浆。", "o": "肝氣鬱勃清且長，羅列六府生三光。心精意專內不傾，上合三焦下玉漿。", "i": 141}, {"t": "p", "s": "玄液云行去臭香，治荡发齿炼五方。取津<b>玄膺</b>入<b>明堂</b>，下溉喉咙神明通。", "o": "玄液雲行去臭香，治蕩發齒煉五方。取津<b>玄膺</b>入<b>明堂</b>，下溉喉嚨神明通。", "i": 142}, {"t": "p", "s": "坐侍<b>华盖</b>游贵京，飘飖三帝席清凉。五色云气纷青葱，闭目内眄自相望。", "o": "坐侍華蓋游貴京，飄颻三帝席清涼。五色雲氣紛青蔥，閉目內眄自相望。", "i": 143}, {"t": "p", "s": "使心诸神还相崇，七玄英华开<b>命门</b>。通利天道存玄根，百二十年犹可还。", "o": "使心諸神還相崇，七玄英華開命門。通利天道存玄根，百二十年猶可還。", "i": 144}, {"t": "p", "s": "过此守道诚独难，唯待九转八琼丹。要复精思存七元，日月之华救老残，", "o": "過此守道誠獨難，唯待九轉八瓊丹。要復精思存七元，日月之華救老殘，", "i": 145}, {"t": "p", "s": "肝气周流络无端。", "o": "肝氣周流絡無端。", "i": 146}, {"t": "h2", "s": "肺之章第三十四", "o": "肺之章第三十四", "i": 147}, {"t": "p", "s": "肺之为气三焦起，视听幽冥候童子。调理五华精发齿，二十六咽<b>玉池</b>里。", "o": "肺之為氣三焦起，視聽幽冥候童子。調理五華精發齒，二十六咽<b>玉池</b>里。", "i": 148}, {"t": "p", "s": "开通百脉血液始，颜色生光金玉泽。齿坚发黑不知白，存此真神勿落落。", "o": "開通百脈血液始，顏色生光金玉澤。齒堅發黑不知白，存此真神勿落落。", "i": 149}, {"t": "p", "s": "当忆此宫有座席，众神合会转相索。", "o": "當憶此宮有座席，眾神合會轉相索。", "i": 150}, {"t": "h2", "s": "隐藏章第三十五", "o": "隱藏章第三十五", "i": 151}, {"t": "p", "s": "隐藏羽盖看天舍，朝拜太阳乐相呼。明神八威正辟邪，<b>脾神</b>还归是胃家。", "o": "隱藏羽蓋看天舍，朝拜太陽樂相呼。明神八威正闢邪，<b>脾神</b>還歸是胃家。", "i": 152}, {"t": "p", "s": "耽养<b>灵根</b>不复枯，闭塞<b>命门</b>保玉都。万神方胙寿有余，是谓脾建在中宫。", "o": "耽養靈根不復枯，閉塞命門保玉都。萬神方胙壽有餘，是謂脾建在中宮。", "i": 153}, {"t": "p", "s": "五藏六府神明主，上合天门入<b>明堂</b>。守雌存雄顶三光，外方内圆神在中。", "o": "五藏六府神明主，上合天門入<b>明堂</b>。守雌存雄頂三光，外方內圓神在中。", "i": 154}, {"t": "p", "s": "通利血脉五藏丰，骨青筋赤髓如霜。脾救七窍去不祥，日月列布设阴阳。", "o": "通利血脈五藏豐，骨青筋赤髓如霜。脾救七竅去不祥，日月列布設陰陽。", "i": 155}, {"t": "p", "s": "两神相会化玉英，淡然无味天人粮。子丹进馔肴正黄，乃曰瑯膏及玉霜。", "o": "兩神相會化玉英，淡然無味天人糧。子丹進饌肴正黃，乃曰瑯膏及玉霜。", "i": 156}, {"t": "p", "s": "太上隐环八素琼，溉益八液肾受精。伏于<b>太阴</b>见我形，扬风三玄出始青。", "o": "太上隱環八素瓊，溉益八液腎受精。伏於太陰見我形，揚風三玄出始青。", "i": 157}, {"t": "p", "s": "恍惚之间至清灵，坐于飙台见赤生。逸域熙真养华荣，内盼沉默炼五形。", "o": "恍惚之間至清靈，坐於飆臺見赤生。逸域熙真養華榮，內盼沉默煉五形。", "i": 158}, {"t": "p", "s": "三气徘徊得神明，隐龙遁芝云瑯英。可以充饥使万灵，上盖玄玄下虎章。", "o": "三氣徘徊得神明，隱龍遁芝云瑯英。可以充饑使萬靈，上蓋玄玄下虎章。", "i": 159}, {"t": "h2", "s": "沐浴章第三十六", "o": "沐浴章第三十六", "i": 160}, {"t": "p", "s": "沐浴盛洁弃肥薰，入室东向诵玉篇。约得万遍义自鲜，散发无欲以长存。", "o": "沐浴盛潔棄肥薰，入室東向誦玉篇。約得萬遍義自鮮，散發無欲以長存。", "i": 161}, {"t": "p", "s": "五味皆至正气还，夷心寂闷勿烦冤。过数已毕体神精，黄华玉女告子情。", "o": "五味皆至正氣還，夷心寂悶勿煩冤。過數已畢體神精，黃華玉女告子情。", "i": 162}, {"t": "p", "s": "真人既至使六丁，即受隐芝大洞经。十读四拜朝太上。先谒太帝后北向，", "o": "真人既至使六丁，即受隱芝大洞經。十讀四拜朝太上。先謁太帝後北向，", "i": 163}, {"t": "p", "s": "<b>黄庭</b>内经玉书畅。授者曰师受者盟，云锦凤罗金钮缠。以代割发肌肤全，", "o": "黃庭內經玉書暢。授者曰師受者盟，雲錦鳳羅金鈕纏。以代割發肌膚全，", "i": 164}, {"t": "p", "s": "携手登山歃液丹。金书玉景乃可宣，传得可授告三官。勿令七祖受冥患，", "o": "攜手登山歃液丹。金書玉景乃可宣，傳得可授告三官。勿令七祖受冥患，", "i": 165}, {"t": "p", "s": "太上微言致神仙，不死之道此真文。", "o": "太上微言致神仙，不死之道此真文。", "i": 166}, {"t": "hr", "s": "", "o": "", "i": 167}, {"t": "h1", "s": "黄庭外景经", "o": "黄庭外景经", "i": 168}, {"t": "q", "s": "道教存思内炼经典，与《黄庭内景经》相表里，旧分三篇（上部经/中部经/下部经），以七言韵文演述存神炼形之旨。文中〔注：…〕括注为历代有修证注解（务成子注传统、蒋国祚注等），与经文并行。", "o": "道教存思内炼经典，与《黄庭内景经》相表里，旧分三篇（上部经/中部经/下部经），以七言韵文演述存神炼形之旨。文中〔注：…〕括注为历代有修证注解（务成子注传统、蒋国祚注等），与经文并行。", "i": 169}, {"t": "q", "s": "文本来源：中国哲学书电子化计划（ctext.org）《黄庭外景经》。", "o": "文本来源：中国哲学书电子化计划（ctext.org）《黄庭外景经》。", "i": 170}, {"t": "note", "s": "蒋国祚注", "o": "蔣國祚注", "i": 171}, {"t": "p", "s": "外景经者皆櫽括内景之辞第其中较内景易晓者如悬膺气管<b>受精符</b>
