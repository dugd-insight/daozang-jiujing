var SEGS = [{"t": "h1", "s": "性命圭旨（性命双修万神圭旨）", "o": "性命圭旨（性命双修万神圭旨）", "i": 0}, {"t": "q", "s": "明·尹真人高弟撰（或谓尹真人弟子所述），四集（元亨利贞），性命双修、顺逆三关、九鼎炼心、移神内院之说，为明清内丹重要典籍，附有多幅丹道图说。", "o": "明·尹真人高弟撰（或谓尹真人弟子所述），四集（元亨利贞），性命双修、顺逆三关、九鼎炼心、移神内院之说，为明清内丹重要典籍，附有多幅丹道图说。", "i": 1}, {"t": "q", "s": "文本来源：中国哲学书电子化计划（ctext.org）《性命双修万神圭旨》。", "o": "文本来源：中国哲学书电子化计划（ctext.org）《性命双修万神圭旨》。", "i": 2}, {"t": "h2", "s": "大道说", "o": "大道说", "i": 3}, {"t": "p", "s": "庖羲上圣，画八卦以示人，使万世之下，知有养生之道。", "o": "庖羲上聖，畫八卦以示人，使萬世之下，知有養生之道。", "i": 4}, {"t": "note", "s": "口诀引证：广成子谓黄帝曰：至阴肃肃，至阳赫赫。赫赫发乎地，肃肃出乎天。我为汝遂于大明之上矣，至彼至阳之原也；为汝入于穹冥之门矣，至彼至阴之原也。", "o": "口诀引证：廣成子謂黃帝曰：至陰肅肅，至陽赫赫。赫赫發乎地，肅肅出乎天。我為汝遂於大明之上矣，至彼至陽之原也；為汝入於穹冥之門矣，至彼至陰之原也。", "i": 5}, {"t": "p", "s": "轩辕再拜曰：广成子之谓天矣。", "o": "軒轅再拜曰：廣成子之謂天矣。", "i": 6}, {"t": "p", "s": "周公繇易曰：君子终日<b>乾</b><b>乾</b>。", "o": "周公繇易曰：君子終日<b>乾</b><b>乾</b>。", "i": 7}, {"t": "note", "s": "口诀引证：孔子翼曰：终日<b>乾</b><b>乾</b>，反复道也。", "o": "口诀引证：孔子翼曰：終日<b>乾</b><b>乾</b>，反複道也。", "i": 8}, {"t": "p", "s": "夫道也者，位天地、育万物，曰道；揭日月、生五行，曰道；多于恒河沙数，曰道；孤则独无一侣，曰道；直入鸿蒙而还归溟滓，曰道；善集造化而颉超圣凡，曰道；目下机境未兆而突而灵通，曰道；眼前生杀分明而无能逃避，曰道；处卑污而大尊贵，曰道；居幽暗而极高明，曰道；细人刹尘，曰道；大包天地，日道：从无入有，曰道；作佛成仙，曰道。佛经五千四十八卷，也说不到了处；中庸三十三章，也说不到穷处；道德五千余言，也说不到极处。道也者，果何谓也？一言以定之，曰炁也。", "o": "夫道也者，位天地、育萬物，曰道；揭日月、生五行，曰道；多於恆河沙數，曰道；孤則獨無一侶，曰道；直入鴻蒙而還歸溟滓，曰道；善集造化而頡超聖凡，曰道；目下機境未兆而突而靈通，曰道；眼前生殺分明而無能逃避，曰道；處卑污而大尊貴，曰道；居幽暗而極高明，曰道；細人剎塵，曰道；大包天地，日道：從無入有，曰道；作佛成仙，曰道。佛經五千四十八卷，也說不到了處；中庸三十三章，也說不到窮處；道德五千餘言，也說不到極處。道也者，果何謂也？一言以定之，曰炁也。", "i": 9}, {"t": "p", "s": "原夫一炁蟠集，溟溟滓滓，窅窅莫测，氤氲活动，含灵至妙，是为太乙，是为未始之始。始也，是为道也，故曰无始。", "o": "原夫一炁蟠集，溟溟滓滓，窅窅莫測，氤氳活動，含靈至妙，是為太乙，是為未始之始。始也，是為道也，故曰無始。", "i": 10}, {"t": "p", "s": "夫天地之有始也，一炁动荡，虚无开合，雌雄感召，黑白交凝，有无相射，混混沌沌，冲虚至圣，包元含灵，神明变化，恍惚立报，是为太易，是为有始之始。始也，是谓道生一也，是曰元始。", "o": "夫天地之有始也，一炁動蕩，虛無開合，雌雄感召，黑白交凝，有無相射，混混沌沌，衝虛至聖，包元含靈，神明變化，恍惚立報，是為太易，是為有始之始。始也，是謂道生一也，是曰元始。", "i": 11}, {"t": "p", "s": "夫天地之太极也，一炁斯析，真宰自判，交映罗列，万灵肃护，阴阳判分，是为太极，是谓一生二也，是曰虚黄。", "o": "夫天地之太極也，一炁斯析，真宰自判，交映羅列，萬靈肅護，陰陽判分，是為太極，是謂一生二也，是曰虛黃。", "i": 12}, {"t": "p", "s": "阴阳既判，天地位焉，人乃育焉，是谓二生三也，是曰混元。", "o": "陰陽既判，天地位焉，人乃育焉，是謂二生三也，是曰混元。", "i": 13}, {"t": "p", "s": "阳之清者，升上而焕丽也，则日月星辰在焉。故天左运，三光右旋。阳之清者，腾上而会于阳也，故风云动而雷雨作焉。阴之浊者，重滞而就地也，则海岳奠峙而五谷草木昌焉。故岩岫出云，山泽通气。阴阳之气闭而不通也，则雪霜结而冻冰焉。阴之浊者，积冱而下凝也，穴岩幽藏而深邃，故五谷八石以错杂焉。天地之中，阴阳正气之所交也，圣人焉，仙佛焉，庶民焉，贤愚寿夭，实所宰焉。胎卵湿化，无所息焉。是为六合也，是谓三生万物也。", "o": "陽之清者，升上而煥麗也，則日月星辰在焉。故天左運，三光右旋。陽之清者，騰上而會於陽也，故風雲動而雷雨作焉。陰之濁者，重滯而就地也，則海岳奠峙而五穀草木昌焉。故岩岫出雲，山澤通氣。陰陽之氣閉而不通也，則雪霜結而凍冰焉。陰之濁者，積冱而下凝也，穴岩幽藏而深邃，故五穀八石以錯雜焉。天地之中，陰陽正氣之所交也，聖人焉，仙佛焉，庶民焉，賢愚壽夭，實所宰焉。胎卵濕化，無所息焉。是為六合也，是謂三生萬物也。", "i": 14}, {"t": "p", "s": "人禀氤氲之气而生，而长至于二八之年。则九三之阳乃纯。当是时也，岂非上德之大人乎？忽天一朝，谋报浑敦之德者至，乃日凿一窍，则九三之阳，蹄骤奔蹶，而去之六二之中矣。由是<b>乾</b>不能纯，而破于离；<b>坤</b>有所含，而实于坎。", "o": "人稟氤氳之氣而生，而長至於二八之年。則九三之陽乃純。當是時也，豈非上德之大人乎？忽天一朝，謀報渾敦之德者至，乃日鑿一竅，則九三之陽，蹄驟奔蹶，而去之六二之中矣。由是<b>乾</b>不能純，而破於離；<b>坤</b>有所含，而實於坎。", "i": 15}, {"t": "p", "s": "若夫至圣神人，能知道体太极之所以判，能知死生根本之所以始，能知<b>乾</b><b>坤</b>阴阳之所以乘，能知天地玄牡之所以交，是以法<b>乾</b><b>坤</b>之体，效<b>坎离</b>之用，振阴阳之柄，过生死之关，取坎中之阳，填离中之阴，离阴既实，则复纯白为<b>乾</b>矣。", "o": "若夫至聖神人，能知道體太極之所以判，能知死生根本之所以始，能知<b>乾</b><b>坤</b>陰陽之所以乘，能知天地玄牡之所以交，是以法<b>乾</b><b>坤</b>之體，效<b>坎離</b>之用，振陰陽之柄，過生死之關，取坎中之陽，填離中之陰，離陰既實，則複純白為<b>乾</b>矣。", "i": 16}, {"t": "p", "s": "斯时补足<b>乾</b>元，复全浑敦，以全亲之所生，以全天之所赋，是为囫囫囵囵一个完人也。再加向上功夫，精进不怠，则盆丹成而圣胎圆，圣胎圆而真人现。真人出现，变化无穷，隐显莫测，而与钟、吕、王、马并驾，亦又何难？", "o": "斯時補足<b>乾</b>元，複全渾敦，以全親之所生，以全天之所賦，是為囫囫圇圇一個完人也。再加向上功夫，精進不怠，則盆丹成而聖胎圓，聖胎圓而真人現。真人出現，變化無窮，隱顯莫測，而與鐘、呂、王、馬並駕，亦又何難？", "i": 17}, {"t": "p", "s": "奈何世人不明此道，盛不知养，衰不知救，日复一日，阳尽阴纯，死而为鬼。故紫阳真人曰：嗟夫！人身难得，光阴易迁，罔测修短，安逃业报？不自及早省悟，唯只甘分待终。若临期一念有差，立堕三涂恶辙，则动经尘劫，无有出期。当此之时，虽悔何及？", "o": "奈何世人不明此道，盛不知養，衰不知救，日複一日，陽盡陰純，死而為鬼。故紫陽真人曰：嗟夫！人身難得，光陰易遷，罔測修短，安逃業報？不自及早省悟，唯只甘分待終。若臨期一念有差，立墮三塗惡轍，則動經塵劫，無有出期。當此之時，雖悔何及？", "i": 18}, {"t": "p", "s": "故三教圣人，以<b>性命</b>学开方便门，教人熏修，以脱生死。", "o": "故三教聖人，以<b>性命</b>學開方便門，教人熏修，以脫生死。", "i": 19}, {"t": "p", "s": "儒家之教，教人顺<b>性命</b>以还造化，其道公。", "o": "儒家之教，教人順<b>性命</b>以還造化，其道公。", "i": 20}, {"t": "p", "s": "禅宗之教，教人幻<b>性命</b>以超大觉，其义高。", "o": "禪宗之教，教人幻<b>性命</b>以超大覺，其義高。", "i": 21}, {"t": "p", "s": "老氏之教，教人修<b>性命</b>而得长生，其旨切。", "o": "老氏之教，教人修<b>性命</b>而得長生，其旨切。", "i": 22}, {"t": "p", "s": "教虽分三，其道一也。", "o": "教雖分三，其道一也。", "i": 23}, {"t": "p", "s": "儒之圣教曰：安汝止，钦厥止，艮其止，止其方，缉熙敬止，在止至善。黄中通理，正位居体，思不出位，立不易方，居天下之广居，立天下之正位，行天下之大道。浑然在中，粹然至善。诚尽处腔子，里乐处方寸。神明之舍，道义之门，活泼泼地，乐在其中。肫肫其仁，渊渊其渊，浩浩其天，天下归仁，退藏于密，保思何虑之天，不识不知之地。难以悉纪，要而言之，无非为此<b>性命</b>之道也。", "o": "儒之聖教曰：安汝止，欽厥止，艮其止，止其方，緝熙敬止，在止至善。黃中通理，正位居體，思不出位，立不易方，居天下之廣居，立天下之正位，行天下之大道。渾然在中，粹然至善。誠盡處腔子，裏樂處方寸。神明之舍，道義之門，活潑潑地，樂在其中。肫肫其仁，淵淵其淵，浩浩其天，天下歸仁，退藏於密，保思何慮之天，不識不知之地。難以悉紀，要而言之，無非為此<b>性命</b>之道也。", "i": 24}, {"t": "p", "s": "道之玄教曰：玄牝之门，天地之根，生身处，复命关，<mark>金丹</mark>之母，<b>玄关</b>之窍，凝结之所，呼吸之根。甲乙坛，<b>戊己</b>门，心源性海，灵府灵台蓬莱岛。朱砂鼎、偃月炉、神室，气穴、土釜、谷神、<b>灵根</b>、把柄、<b>坎离</b>交媾之乡，千变万化之祖，生死不相关之地，鬼神觑不破之机。难以悉纪，要而言之，无非为此<b>性命</b>之道也。", "o": "道之玄教曰：玄牝之門，天地之根，生身處，複命關，<mark>金丹</mark>之母，<b>玄關</b>之竅，凝結之所，呼吸之根。甲乙壇，<b>戊己</b>門，心源性海，靈府靈台蓬萊島。朱砂鼎、偃月爐、神室，氣穴、土釜、穀神、<b>靈根</b>、把柄、<b>坎離</b>交媾之鄉，千變萬化之祖，生死不相關之地，鬼神覷不破之機。難以悉紀，要而言之，無非為此<b>性命</b>之道也。", "i": 25}, {"t": "p", "s": "释之禅教曰：不二法门、甚深法界、虚空藏、寂灭海、真实地、总持门。彼岸、净土、真境心他极乐国。如来藏、舍利子、菩萨地、光明藏、圆觉海、般若岸、法王城、西方、天堂、空中、真际、这个、三摩地、华藏海，陀罗尼门、不动道场、波罗蜜地，难以悉纪。要而言之，无非为此<b>性命</b>之道也。", "o": "釋之禪教曰：不二法門、甚深法界、虛空藏、寂滅海、真實地、總持門。彼岸、淨土、真境心他極樂國。如來藏、舍利子、菩薩地、光明藏、圓覺海、般若岸、法王城、西方、天堂、空中、真際、這個、三摩地、華藏海，陀羅尼門、不動道場、波羅蜜地，難以悉紀。要而言之，無非為此<b>性命</b>之道也。", "i": 26}, {"t": "p", "s": "儒曰：存心养性。道曰：修心炼性。释曰：明心见性。心性者，本体也。", "o": "儒曰：存心養性。道曰：修心煉性。釋曰：明心見性。心性者，本體也。", "i": 27}, {"t": "p", "s": "懦之执中者，执此本体之中也。道之守中者，守此本体之中也。释之空中者，本体之中本洞然而空也。", "o": "懦之執中者，執此本體之中也。道之守中者，守此本體之中也。釋之空中者，本體之中本洞然而空也。", "i": 28}, {"t": "p", "s": "道之得一者，得此本体之一也。释之归一者，归此本体之一也。儒之一贯者，以此本体之一而贯之也。", "o": "道之得一者，得此本體之一也。釋之歸一者，歸此本體之一也。儒之一貫者，以此本體之一而貫之也。", "i": 29}, {"t": "p", "s": "余于是而知：不执中、不一贯，其成圣而孔子乎？不守中，不得一，其能玄而老子乎？不空中、不归一，其能禅而释迦乎？唯此本体。以其虚空无朕，强名曰中；以其霹出端倪，强名曰一。言而中即一之藏也，一即中之用也。", "o": "餘於是而知：不執中、不一貫，其成聖而孔子乎？不守中，不得一，其能玄而老子乎？不空中、不歸一，其能禪而釋迦乎？唯此本體。以其虛空無朕，強名曰中；以其霹出端倪，強名曰一。言而中即一之藏也，一即中之用也。", "i": 30}, {"t": "p", "s": "故天得此而天天，地得此而地地，人得此而人人。而天地人之大道，原于此也。", "o": "故天得此而天天，地得此而地地，人得此而人人。而天地人之大道，原於此也。", "i": 31}, {"t": "p", "s": "皇得此而皇皇，帝得此而地地，王得此而王王。而皇帝王之大道，原于此也。", "o": "皇得此而皇皇，帝得此而地地，王得此而王王。而皇帝王之大道，原於此也。", "i": 32}, {"t": "p", "s": "圣得此而圣圣，玄得此而玄玄，禅得此而禅禅。而圣玄禅之大道，原于此也。", "o": "聖得此而聖聖，玄得此而玄玄，禪得此而禪禪。而聖玄禪之大道，原於此也。", "i": 33}, {"t": "p", "s": "帝皇之得道者，若羲农、黄帝焉。仕隐而得道者，如老、庄、关令焉。侯王而得道者，若子房、淮南焉。山岩而得道者，若钟、吕、希夷焉。", "o": "帝皇之得道者，若羲農、黃帝焉。仕隱而得道者，如老、莊、關令焉。侯王而得道者，若子房、淮南焉。山岩而得道者，若鐘、呂、希夷焉。", "i": 34}, {"t": "p", "s": "道之在天地间，成仙作佛者，历历不可以指数也。伏睹总仙之传，始知自古以来冲举者十万余人，拔宅者八千余处。奇若子晋之骖鸾、琴高之控鲤，寿若李脱之八百、安期之三千。或住世而留形，或厌世而尸解。复有道成而隐，但为身谋，不肯遗名于世间者、岂胜道哉？是以深山妙窟，代不乏人，或隐或显，宁具知乎？", "o": "道之在天地間，成仙作佛者，歷歷不可以指數也。伏睹總仙之傳，始知自古以來衝舉者十萬餘人，拔宅者八千餘處。奇若子晉之驂鸞、琴高之控鯉，壽若李脫之八百、安期之三千。或住世而留形，或厭世而尸解。複有道成而隱，但為身謀，不肯遺名於世間者、豈勝道哉？是以深山妙窟，代不乏人，或隱或顯，寧具知乎？", "i": 35}, {"t": "p", "s": "古之王公大人，折节下士，只为有道存尔。周子曰：天地间，至尊者道，至贵者德，至难得者人。人而至难得者，道德有于身而已矣。", "o": "古之王公大人，折節下士，只為有道存爾。周子曰：天地間，至尊者道，至貴者德，至難得者人。人而至難得者，道德有於身而已矣。", "i": 36}, {"t": "p", "s": "先哲云：人身难得今已得，大道难明今已明。此身不向今生度，更向何生度此身？", "o": "先哲云：人身難得今已得，大道難明今已明。此身不向今生度，更向何生度此身？", "i": 37}, {"t": "p", "s": "世人不明此身虚幻，是四大假合之物耳。速如水上之沤，瞬若石中之火。人寿虽曰百年，迨其七十，固亦稀矣。", "o": "世人不明此身虛幻，是四大假合之物耳。速如水上之漚，瞬若石中之火。人壽雖曰百年，迨其七十，固亦稀矣。", "i": 38}, {"t": "p", "s": "今以有限易摧之身，日逐无涯不测之事。一息不来，倏然长往，命未告终，真灵已殁于别壳矣。当斯之时，虽荣居极品，禄享千钟，家丰无价之珠，室富倾城之美，悉皆抛下，非已有也。所有与于偕行者，平昔所作罪业而已。故曰：万般将不去，唯有业随身。", "o": "今以有限易摧之身，日逐無涯不測之事。一息不來，倏然長往，命未告終，真靈已歿於別殼矣。當斯之時，雖榮居極品，祿享千鐘，家豐無價之珠，室富傾城之美，悉皆拋下，非已有也。所有與於偕行者，平昔所作罪業而已。故曰：萬般將不去，唯有業隨身。", "i": 39}, {"t": "p", "s": "回光集云：千年铁树开花易，一失人身再复难。", "o": "回光集云：千年鐵樹開花易，一失人身再複難。", "i": 40}, {"t": "p", "s": "悟真篇云：试问堆金等山岳，无常买得不来么？", "o": "悟真篇云：試問堆金等山嶽，無常買得不來麼？", "i": 41}, {"t": "p", "s": "吕纯阳云：万劫千生得个人，须知前世种来因。速觉悟，出迷津，莫使轮回受苦辛。", "o": "呂純陽云：萬劫千生得個人，須知前世種來因。速覺悟，出迷津，莫使輪回受苦辛。", "i": 42}, {"t": "p", "s": "张紫阳云：休教烛被风吹灭，六道轮回莫怨天。", "o": "張紫陽云：休教燭被風吹滅，六道輪回莫怨天。", "i": 43}, {"t": "p", "s": "三夏斯语，能不恤然失乎？", "o": "三夏斯語，能不恤然失乎？", "i": 44}, {"t": "p", "s": "夫人欲免轮回，而不堕于世纲者，莫若修炼<mark>金丹</mark>，为升天之灵梯，超凡之径路也。其道至简至易，虽愚昧小人得而行之，亦立跻圣域。奈何世之修真者，志道而不专精，专精而不勤久，是以学者众而成者寡也。", "o": "夫人欲免輪回，而不墮於世綱者，莫若修煉<mark>金丹</mark>，為升天之靈梯，超凡之徑路也。其道至簡至易，雖愚昧小人得而行之，亦立躋聖域。奈何世之修真者，志道而不專精，專精而不勤久，是以學者眾而成者寡也。", "i": 45}, {"t": "p", "s": "尚书曰：知之非艰，行之唯艰。", "o": "尚書曰：知之非艱，行之唯艱。", "i": 46}, {"t": "p", "s": "道经曰：上士闻道，勤而行之。闻而不行，道安能成？", "o": "道經曰：上士聞道，勤而行之。聞而不行，道安能成？", "i": 47}, {"t": "note", "s": "口诀引证：陈泥丸曰：我昔修行得真诀，昼夜功夫无断绝。一朝行满人不知，四面皆成夜光阙。", "o": "口诀引证：陳泥丸曰：我昔修行得真訣，晝夜功夫無斷絕。一朝行滿人不知，四面皆成夜光闕。", "i": 48}, {"t": "note", "s": "口诀引证：马丹阳曰：师恩深重终难报，誓死环墙炼至真。", "o": "口诀引证：馬丹陽曰：師恩深重終難報，誓死環牆煉至真。", "i": 49}, {"t": "p", "s": "二公念生死事大，无常迅速，发勇猛心，辨精进力，若不立此大志，安能脱樊笼，而超霄汉者哉？", "o": "二公念生死事大，無常迅速，發勇猛心，辨精進力，若不立此大志，安能脫樊籠，而超霄漢者哉？", "i": 50}, {"t": "p", "s": "吕祖有云：辛勤二三年，快活千万劫。", "o": "呂祖有云：辛勤二三年，快活千萬劫。", "i": 51}, {"t": "p", "s": "盖天有时而倾，地有时而陷，山有时而推，海有时而竭。唯道成之后，乘飞龙，驾紫雾，翱翔天外，逍遥虚空，数不得而限之，命不得而拘之，真常本体，无有尽时，回顾世间之乐，何乐如之？", "o": "蓋天有時而傾，地有時而陷，山有時而推，海有時而竭。唯道成之後，乘飛龍，駕紫霧，翱翔天外，逍遙虛空，數不得而限之，命不得而拘之，真常本體，無有盡時，回顧世間之樂，何樂如之？", "i": 52}, {"t": "p", "s": "尝稽道德经曰：虽珙壁以先驷马，不如坐进此道。此予道之所由作也。", "o": "嘗稽道德經曰：雖珙壁以先駟馬，不如坐進此道。此予道之所由作也。", "i": 53}, {"t": "h2", "s": "性命说", "o": "性命说", "i": 54}, {"t": "p", "s": "夫学之大，莫大于<b>性命</b>。<b>性命</b>之说，不明于世之久矣。", "o": "夫學之大，莫大於<b>性命</b>。<b>性命</b>之說，不明於世之久矣。", "i": 55}, {"t": "p", "s": "何谓之性？元始真如，一灵炯炯是也。", "o": "何謂之性？元始真如，一靈炯炯是也。", "i": 56}, {"t": "p", "s": "何谓之命？先天至精，一炁氤氲是也。", "o": "何謂之命？先天至精，一炁氤氳是也。", "i": 57}, {"t": "p", "s": "然有性，便有命；有命，便有性。<b>性命</b>原不可分。但以其在天，则谓之命；在人，则谓之性。<b>性命</b>实非有两。况性无命不立，命无性不存，而<b>性命</b>之理，又浑然合一者哉。", "o": "然有性，便有命；有命，便有性。<b>性命</b>原不可分。但以其在天，則謂之命；在人，則謂之性。<b>性命</b>實非有兩。況性無命不立，命無性不存，而<b>性命</b>之理，又渾然合一者哉。", "i": 58}, {"t": "p", "s": "故易曰：<b>乾</b>道变化，各正<b>性命</b>。中庸曰：天命之谓命。此之谓也。", "o": "故易曰：<b>乾</b>道變化，各正<b>性命</b>。中庸曰：天命之謂命。此之謂也。", "i": 59}, {"t": "p", "s": "乃玄门专以气为命，以修命为宗，以水府求玄立教。故详言命而略言性，是不知性也，究亦不知命。", "o": "乃玄門專以氣為命，以修命為宗，以水府求玄立教。故詳言命而略言性，是不知性也，究亦不知命。", "i": 60}, {"t": "p", "s": "禅家专以神为性，以修性为宗，以离宫修定立教。故详言性而略言命，是不知命也，究亦不知性。", "o": "禪家專以神為性，以修性為宗，以離宮修定立教。故詳言性而略言命，是不知命也，究亦不知性。", "i": 61}, {"t": "p", "s": "岂知<b>性命</b>本不相离，道释原无二致。神气虽有二用，<b>性命</b>则当双修也哉。", "o": "豈知<b>性命</b>本不相離，道釋原無二致。神氣雖有二用，<b>性命</b>則當雙修也哉。", "i": 62}, {"t": "p", "s": "贤人之学，存心以养性，修身以立命。圣人之学，尽性而至命。", "o": "賢人之學，存心以養性，修身以立命。聖人之學，盡性而至命。", "i": 63}, {"t": "p", "s": "谓性者神之始，神本于性，而性则未始神，神所由以灵。命者气之始，气本于命，而命则未始气，气所由以生。", "o": "謂性者神之始，神本於性，而性則未始神，神所由以靈。命者氣之始，氣本於命，而命則未始氣，氣所由以生。", "i": 64}, {"t": "p", "s": "身中之精，寂然不动。盖刚健中正，纯粹精者存，乃性之所寄也，为命之根矣。", "o": "身中之精，寂然不動。蓋剛健中正，純粹精者存，乃性之所寄也，為命之根矣。", "i": 65}, {"t": "p", "s": "心中之神，感而遂通。盖喜、怒、哀、惧、爱、恶欲者存，乃命之所寄也，为性之枢矣。", "o": "心中之神，感而遂通。蓋喜、怒、哀、懼、愛、惡欲者存，乃命之所寄也，為性之樞矣。", "i": 66}, {"t": "p", "s": "性而心也，而一神之中炯。命而身也，而一气之周流。故身心，精神之舍也。而精神，<b>性命</b>之根也。", "o": "性而心也，而一神之中炯。命而身也，而一氣之周流。故身心，精神之舍也。而精神，<b>性命</b>之根也。", "i": 67}, {"t": "p", "s": "性之造化，系手心。命之造化，系乎身。见解知识，出于心哉。思虑念想，心役性也。举动应酬，出于身哉。语默视听，身累命也。", "o": "性之造化，系手心。命之造化，系乎身。見解知識，出於心哉。思慮念想，心役性也。舉動應酬，出於身哉。語默視聽，身累命也。", "i": 68}, {"t": "p", "s": "命有身累，则有生死。性受心役，则有去来。有生死，不能至命也。有去来，不能尽性也。", "o": "命有身累，則有生死。性受心役，則有去來。有生死，不能至命也。有去來，不能盡性也。", "i": 69}, {"t": "p", "s": "故盈天地间，皆是生气，参赞两间，化育万物。其命之流行，而不息者乎？盖生之理，具于命也。盈天地间，皆是灵觉，明光上下，照临日月。未始性，而能性我之性者，性之始也。未始命，而能命我之命者，命之始也。", "o": "故盈天地間，皆是生氣，參贊兩間，化育萬物。其命之流行，而不息者乎？蓋生之理，具於命也。盈天地間，皆是靈覺，明光上下，照臨日月。未始性，而能性我之性者，性之始也。未始命，而能命我之命者，命之始也。", "i": 70}, {"t": "p", "s": "天窍圆而藏性，地窍方而藏命。禀虚灵以成性，中天地以立命。性成命立，其中有神。命蒂<mark>元气</mark>，性根<mark>元神</mark>。潜神于心，聚气于身。其中有道。", "o": "天竅圓而藏性，地竅方而藏命。稟虛靈以成性，中天地以立命。性成命立，其中有神。命蒂<mark>元氣</mark>，性根<mark>元神</mark>。潛神於心，聚氣於身。其中有道。", "i": 71}, {"t": "p", "s": "性有气质之性，有天赋之性；命有分定之命，有形气之命。", "o": "性有氣質之性，有天賦之性；命有分定之命，有形氣之命。", "i": 72}, {"t": "p", "s": "君子修天赋之性，克气质之性；修形气之命，付分定之命。分言之，则二；合言之，则一。其中有理。", "o": "君子修天賦之性，克氣質之性；修形氣之命，付分定之命。分言之，則二；合言之，則一。其中有理。", "i": 73}, {"t": "p", "s": "是以神不离气，气不离神，吾身之神气合，而后吾身之<b>性命</b>见矣。性不离命，命不离性，吾身之<b>性命</b>合，而后吾身未始性之性、未始命之命见矣。未始性之性、未始命之命，是吾之真<b>性命</b>也。我之真<b>性命</b>，即天地之真<b>性命</b>，亦即虚空之真<b>性命</b>也。", "o": "是以神不離氣，氣不離神，吾身之神氣合，而後吾身之<b>性命</b>見矣。性不離命，命不離性，吾身之<b>性命</b>合，而後吾身未始性之性、未始命之命見矣。未始性之性、未始命之命，是吾之真<b>性命</b>也。我之真<b>性命</b>，即天地之真<b>性命</b>，亦即虛空之真<b>性命</b>也。", "i": 74}, {"t": "p", "s": "故圣贤持戒定慧而虚其心，炼精气神而保其身。身保则命基永固，心虚则性体常明。性常明则无来无去，命永固则何死何生。况死而去者，仅仅形骸耳。而我之真<b>性命</b>，则通昼夜、配天地，彻古今者，何尝少有泯灭也哉。", "o": "故聖賢持戒定慧而虛其心，煉精氣神而保其身。身保則命基永固，心虛則性體常明。性常明則無來無去，命永固則何死何生。況死而去者，僅僅形骸耳。而我之真<b>性命</b>，則通晝夜、配天地，徹古今者，何嘗少有泯滅也哉。", "i": 75}, {"t": "p", "s": "尝观之草木焉，归根复命，而性在其中矣。性而神也，则花。花而实也，而命又在其中矣。自形中之神，以入神中之性，此之谓归根复命。", "o": "嘗觀之草木焉，歸根複命，而性在其中矣。性而神也，則花。花而實也，而命又在其中矣。自形中之神，以入神中之性，此之謂歸根複命。", "i": 76}, {"t": "p", "s": "又尝譬之男女媾精焉，而一点之善，落于子宫者，气合之而为命也，而性即存于其间。其即一阴一阳之相搏，而一点落于黄中之中以成性。乃妙合而凝，不测之神乎？此之谓<b>性命</b>妙合。", "o": "又嘗譬之男女媾精焉，而一點之善，落於子宮者，氣合之而為命也，而性即存於其間。其即一陰一陽之相搏，而一點落於黃中之中以成性。乃妙合而凝，不測之神乎？此之謂<b>性命</b>妙合。", "i": 77}, {"t": "p", "s": "奈妙合之道不明，修世者遗命，且并率性之窍妙，不得而知之，矧能炼之乎？非流于狂荡，则失于空寂，不知其命，末后何归。修命者遗性，且并造命之功夫，不得而知之，知能守之乎？", "o": "奈妙合之道不明，修世者遺命，且並率性之竅妙，不得而知之，矧能煉之乎？非流於狂蕩，則失於空寂，不知其命，末後何歸。修命者遺性，且並造命之功夫，不得而知之，知能守之乎？", "i": 78}, {"t": "p", "s": "非执于有作，则失于无为。不知其性，劫运何逃？即二氏之初，亦岂如是乎？", "o": "非執於有作，則失於無為。不知其性，劫運何逃？即二氏之初，亦豈如是乎？", "i": 79}, {"t": "p", "s": "吾闻释迦生于西方，亦得<mark>金丹</mark>之道，是<b>性命</b>兼修，为最上乘法，号曰金仙。", "o": "吾聞釋迦生於西方，亦得<mark>金丹</mark>之道，是<b>性命</b>兼修，為最上乘法，號曰金仙。", "i": 80}, {"t": "note", "s": "口诀引证：吕祖亦曰：只知性，不知命，此是修行第一病。只修祖性不修丹，万劫阴灵难入圣。", "o": "口诀引证：呂祖亦曰：只知性，不知命，此是修行第一病。只修祖性不修丹，萬劫陰靈難入聖。", "i": 81}, {"t": "p", "s": "岂但如今之导引者流，而以形骸为<b>性命</b>焉已哉。又岂但如今炼神炼气者流，而以神气为<b>性命</b>焉己哉。又岂但如今修性修命者流，而以<b>性命</b>为<b>性命</b>焉己哉。是皆不唯无益于<b>性命</b>，而且有害于<b>性命</b>。不得<b>性命</b>之真，良可叹也。", "o": "豈但如今之導引者流，而以形骸為<b>性命</b>焉已哉。又豈但如今煉神煉氣者流，而以神氣為<b>性命</b>焉己哉。又豈但如今修性修命者流，而以<b>性命</b>為<b>性命</b>焉己哉。是皆不唯無益於<b>性命</b>，而且有害於<b>性命</b>。不得<b>性命</b>之真，良可嘆也。", "i": 82}, {"t": "p", "s": "故尝论之，人在母腹，呼吸相会，是以母之<b>性命</b>为<b>性命</b>，而非自为<b>性命</b>。至于出胞断蒂，而后自为<b>性命</b>，然亦非真常之<b>性命</b>也。必于自为<b>性命</b>中，而养成<b>乾</b>元面目，露出一点真灵。", "o": "故嘗論之，人在母腹，呼吸相會，是以母之<b>性命</b>為<b>性命</b>，而非自為<b>性命</b>。至於出胞斷蒂，而後自為<b>性命</b>，然亦非真常之<b>性命</b>也。必於自為<b>性命</b>中，而養成<b>乾</b>元面目，露出一點真靈。", "i": 83}, {"t": "p", "s": "形依形，形不坏；神依性，神不灭。知性而尽性，尽性而至命。乃所谓虚空本体，无有尽时。天地有坏，这个不坏，而能重立<b>性命</b>，再造<b>乾</b><b>坤</b>者也。", "o": "形依形，形不壞；神依性，神不滅。知性而盡性，盡性而至命。乃所謂虛空本體，無有盡時。天地有壞，這個不壞，而能重立<b>性命</b>，再造<b>乾</b><b>坤</b>者也。", "i": 84}, {"t": "p", "s": "故道家不知此，则谓之傍门；释氏不知此，则谓之外道，又焉能合天地之德，而与太虚同体哉？噫！至此而<b>性命</b>之说，无余旨矣。", "o": "故道家不知此，則謂之傍門；釋氏不知此，則謂之外道，又焉能合天地之德，而與太虛同體哉？噫！至此而<b>性命</b>之說，無餘旨矣。", "i": 85}, {"t": "h2", "s": "死生说", "o": "死生说", "i": 86}, {"t": "p", "s": "大众好生恶死，以莫识死生故。生从何来，死从何去。徒在生前，奔驰谋作，致大亏生道，不得逍遥。故于死后，渺茫沦落，不戡破死门，竟堕轮转。", "o": "大眾好生惡死，以莫識死生故。生從何來，死從何去。徒在生前，奔馳謀作，致大虧生道，不得逍遙。故於死後，渺茫淪落，不戡破死門，竟墮輪轉。", "i": 87}, {"t": "p", "s": "所以仙佛出世，汲汲以一大事因缘，使人知去来处，徐徐引出生死苦海。易系曰：原始要终。故知死生之说，盖无始之始，强名<b>乾</b>元，即本来妙觉；无终之终，强名道岸，即无余涅盘。", "o": "所以仙佛出世，汲汲以一大事因緣，使人知去來處，徐徐引出生死苦海。易系曰：原始要終。故知死生之說，蓋無始之始，強名<b>乾</b>元，即本來妙覺；無終之終，強名道岸，即無餘涅盤。", "i": 88}, {"t": "p", "s": "生而生也，而其所以生者，固在于此；至死而死也，而其所以不死者，亦在于此。此而不知，则未有不随生而存，随死而亡者，沉溺恶道，出没无期。", "o": "生而生也，而其所以生者，固在於此；至死而死也，而其所以不死者，亦在於此。此而不知，則未有不隨生而存，隨死而亡者，沉溺惡道，出沒無期。", "i": 89}, {"t": "p", "s": "生则是第八<b>识神</b>阿赖耶主之，死亦是第八<b>识神</b>阿赖耶主之。投胎则此识先来，舍身则此识后去。故曰：去后来先作主公。经颂曰：善业从下冷，恶业从上冷，二皆至于心，一处同时舍。当此之际，如生龟解壳，活蟹落汤，地水火风，各自分散。", "o": "生則是第八<b>識神</b>阿賴耶主之，死亦是第八<b>識神</b>阿賴耶主之。投胎則此識先來，舍身則此識後去。故曰：去後來先作主公。經頌曰：善業從下冷，惡業從上冷，二皆至於心，一處同時舍。當此之際，如生龜解殼，活蟹落湯，地水火風，各自分散。", "i": 90}, {"t": "p", "s": "而神既离形，但看世界，与泼墨相似，东西莫辨，上下不知。只见有缘之处，一点妄明。见明色，发明见，想成流，爱为种。纳想为胎，入母中官，禀气受质。气则顿具四大，渐成诸根，心则顿具四蕴，渐成诸识。", "o": "而神既離形，但看世界，與潑墨相似，東西莫辨，上下不知。只見有緣之處，一點妄明。見明色，發明見，想成流，愛為種。納想為胎，入母中官，稟氣受質。氣則頓具四大，漸成諸根，心則頓具四蘊，漸成諸識。", "i": 91}, {"t": "p", "s": "十月胎完，及期而育，地覆天翻，人惊胞破，如行山巅蹶什之状。头悬足撑而出。囫囵一声，天命真元，著于<b>祖窍</b>。昼居二目，而藏于泥丸；夜潜两肾，而蓄于丹鼎。乳以养其五脏，炁则冲乎六腑。骨弱如绵，肉滑如饴，精之至也；视而不瞬，哮而不嘎，和之至也。此乃赤于混沌，纯静无知，属阴<b>坤</b>卦。", "o": "十月胎完，及期而育，地覆天翻，人驚胞破，如行山巔蹶什之狀。頭懸足撐而出。囫圇一聲，天命真元，著於<b>祖竅</b>。晝居二目，而藏於泥丸；夜潛兩腎，而蓄於丹鼎。乳以養其五臟，炁則衝乎六腑。骨弱如綿，肉滑如飴，精之至也；視而不瞬，哮而不嘎，和之至也。此乃赤於混沌，純靜無知，屬陰<b>坤</b>卦。", "i": 92}, {"t": "p", "s": "自一岁至三岁，长元炁六十四铢，一阳生乎复卦。", "o": "自一歲至三歲，長元炁六十四銖，一陽生乎複卦。", "i": 93}, {"t": "p", "s": "至五岁，又长元炁六十四铢，二阳生乎临卦。", "o": "至五歲，又長元炁六十四銖，二陽生乎臨卦。", "i": 94}, {"t": "p", "s": "至八岁，又长元炁六十四铢，三阳生手泰卦。", "o": "至八歲，又長元炁六十四銖，三陽生手泰卦。", "i": 95}, {"t": "p", "s": "至十岁，又长元炁六十四铢，四阳生手大壮。", "o": "至十歲，又長元炁六十四銖，四陽生手大壯。", "i": 96}, {"t": "p", "s": "至十三岁，又长元炁六十四铢，五阳生乎夬卦。", "o": "至十三歲，又長元炁六十四銖，五陽生乎夬卦。", "i": 97}, {"t": "p", "s": "至十六岁，又长元炁六十四铢，六阳是为<b>乾</b>卦。", "o": "至十六歲，又長元炁六十四銖，六陽是為<b>乾</b>卦。", "i": 98}, {"t": "p", "s": "盗天地三百六十铢之正炁，原父母二十四铢之祖炁，共得三百八十四铢，以全<b>周天</b>之造化，而为一斤之数也。", "o": "盜天地三百六十銖之正炁，原父母二十四銖之祖炁，共得三百八十四銖，以全<b>周天</b>之造化，而為一斤之數也。", "i": 99}, {"t": "p", "s": "此时，纯阳既备，微阴未萌，精炁充实，如得师指，修炼<b>性命</b>，立可成功矣。", "o": "此時，純陽既備，微陰未萌，精炁充實，如得師指，修煉<b>性命</b>，立可成功矣。", "i": 100}, {"t": "p", "s": "自此以后，欲情一动，元炁即泄，不知禁恳，贪恋无已。故由十六至二十四岁，耗元炁六十四铢，应乎姤卦。一阴初生，品物咸章，淳浇朴散，去本虽未远，愎霜之戒，己见于初，又若勤修炼，可谓不远复者矣。", "o": "自此以後，欲情一動，元炁即洩，不知禁懇，貪戀無已。故由十六至二十四歲，耗元炁六十四銖，應乎姤卦。一陰初生，品物咸章，淳澆樸散，去本雖未遠，愎霜之戒，己見於初，又若勤修煉，可謂不遠複者矣。", "i": 101}, {"t": "p", "s": "至三十二岁，耗元炁六十四铢，应乎遁卦。二阴浸长，阳德渐消，欲虑蜂起，真源流荡，然而血气方刚，志力果敢，若勤修炼，则建立丹基，亦易为力。", "o": "至三十二歲，耗元炁六十四銖，應乎遁卦。二陰浸長，陽德漸消，欲慮蜂起，真源流蕩，然而血氣方剛，志力果敢，若勤修煉，則建立丹基，亦易為力。", "i": 102}, {"t": "p", "s": "至四十岁，又耗元炁六十四铢，应乎否卦。天地不交，二气各复其所，阴用事于内，阳失位于外，若勤修炼，则危者可安，亡者可保。", "o": "至四十歲，又耗元炁六十四銖，應乎否卦。天地不交，二氣各複其所，陰用事於內，陽失位於外，若勤修煉，則危者可安，亡者可保。", "i": 103}, {"t": "p", "s": "至四十八岁，又耗元炁六十四铢，应乎观卦。二阳在外，而阳德微，重阴上行，而阴气盛，若勤修炼，则可抑方盛之阴柔，扶向微之阳德。", "o": "至四十八歲，又耗元炁六十四銖，應乎觀卦。二陽在外，而陽德微，重陰上行，而陰氣盛，若勤修煉，則可抑方盛之陰柔，扶向微之陽德。", "i": 104}, {"t": "p", "s": "至五十六岁，又耗元炁六十四铢，应乎剥卦。五阴并升乎上，一阳将反乎下，阴气横溃，阳力仅存，若勤修炼，如续火于将穷之木，布雨于垂槁之苗。", "o": "至五十六歲，又耗元炁六十四銖，應乎剝卦。五陰並升乎上，一陽將反乎下，陰氣橫潰，陽力僅存，若勤修煉，如續火於將窮之木，布雨於垂槁之苗。", "i": 105}, {"t": "p", "s": "至六十四岁，卦炁已周，所得天地父母之元炁三百八十四铢、而为一斤之数者，耗散已尽，复返于<b>坤</b>。纯阴用事，阳气未萌，若勤修炼，时时采药，时时栽接，则阴极而能生阳，穷上而能反下，革柔为刚，还老为强矣。", "o": "至六十四歲，卦炁已周，所得天地父母之元炁三百八十四銖、而為一斤之數者，耗散已盡，複返於<b>坤</b>。純陰用事，陽氣未萌，若勤修煉，時時採藥，時時栽接，則陰極而能生陽，窮上而能反下，革柔為剛，還老為強矣。", "i": 106}, {"t": "p", "s": "于此时不遇至人，汲汲修炼，虽保余年，皆籍谷精以培后天之精气，无复有先天之元炁矣，安能长生不死哉？", "o": "於此時不遇至人，汲汲修煉，雖保餘年，皆籍穀精以培後天之精氣，無複有先天之元炁矣，安能長生不死哉？", "i": 107}, {"t": "p", "s": "此所以虚化神、神化炁、炁化血、血化形、形化婴、婴化童、童化少、少化壮、壮化老、老化死、死复化为虚、虚复化为神、神复化为气、气复化为物，化化不间，犹环之无穷。", "o": "此所以虛化神、神化炁、炁化血、血化形、形化嬰、嬰化童、童化少、少化壯、壯化老、老化死、死複化為虛、虛複化為神、神複化為氣、氣複化為物，化化不間，猶環之無窮。", "i": 108}, {"t": "p", "s": "夫方物非欲生，不得不生，万物非欲死，不得不死。任他尘生尘灭，万化万生，不能脱离苦海，劫劫生生，轮回不绝，无终无始，如汲井轮。三界凡夫，无一不遭此沉溺。", "o": "夫方物非欲生，不得不生，萬物非欲死，不得不死。任他塵生塵滅，萬化萬生，不能脫離苦海，劫劫生生，輪回不絕，無終無始，如汲井輪。三界凡夫，無一不遭此沉溺。", "i": 109}, {"t": "p", "s": "故世人莫知生从何来，盖参父母未生前；死从何来，知来然后知生处。世人莫问死从何去，盖参魂游魄降后；生从何去，知去然后知死处。死之机由于生，生之机原于死。无死机不死，无生机不生。生死之机两相关，世人所以有生死，生死之机不相关，至人所以超生死。有生死者，身也；无生死者，心也。敦复则心生，迷复则心死。则危者可安，亡者可保。", "o": "故世人莫知生從何來，蓋參父母未生前；死從何來，知來然後知生處。世人莫問死從何去，蓋參魂游魄降後；生從何去，知去然後知死處。死之機由於生，生之機原於死。無死機不死，無生機不生。生死之機兩相關，世人所以有生死，生死之機不相關，至人所以超生死。有生死者，身也；無生死者，心也。敦複則心生，迷複則心死。則危者可安，亡者可保。", "i": 110}, {"t": "p", "s": "至四十八岁，又耗元炁六十四铢，应乎观卦。二阳在外，而阳德微，重阴上行，而阴气盛，若勤修炼，则可抑方盛之阴柔，扶向微之阳德。", "o": "至四十八歲，又耗元炁六十四銖，應乎觀卦。二陽在外，而陽德微，重陰上行，而陰氣盛，若勤修煉，則可抑方盛之陰柔，扶向微之陽德。", "i": 111}, {"t": "p", "s": "至五十六岁，又耗元炁六十四铢，应乎剥卦。五阴并升乎上，一阳将反乎下，阴气横溃，阳力仅存，若勤修炼，如续火于将穷之木，布雨于垂槁之苗。", "o": "至五十六歲，又耗元炁六十四銖，應乎剝卦。五陰並升乎上，一陽將反乎下，陰氣橫潰，陽力僅存，若勤修煉，如續火於將窮之木，布雨於垂槁之苗。", "i": 112}, {"t": "p", "s": "至六十四岁，卦炁已周，所得天地父母之元炁三百八十四铢、而为一斤之数者，耗散已尽，复返于<b>坤</b>。纯阴用事，阳气未萌，若勤修炼，时时采药，时时栽接，则阴极而能生阳，穷上而能反下，革柔为刚，还老为强矣。", "o": "至六十四歲，卦炁已周，所得天地父母之元炁三百八十四銖、而為一斤之數者，耗散已盡，複返於<b>坤</b>。純陰用事，陽氣未萌，若勤修煉，時時採藥，時時栽接，則陰極而能生陽，窮上而能反下，革柔為剛，還老為強矣。", "i": 113}, {"t": "p", "s": "于此时不遇至人，汲汲修炼，虽保余年，皆籍谷精以培后天之精气，无复有先天之元炁矣，安能长生不死哉？", "o": "於此時不遇至人，汲汲修煉，雖保餘年，皆籍穀精以培後天之精氣，無複有先天之元炁矣，安能長生不死哉？", "i": 114}, {"t": "p", "s": "此所以虚化神、神化炁、炁化血、血化形、形化婴、婴化童、童化少、少化壮、壮化老、老化死、死复化为虚、虚复化为神、神复化为气、气复化为物，化化不间，犹环之无穷。", "o": "此所以虛化神、神化炁、炁化血、血化形、形化嬰、嬰化童、童化少、少化壯、壯化老、老化死、死複化為虛、虛複化為神、神複化為氣、氣複化為物，化化不間，猶環之無窮。", "i": 115}, {"t": "p", "s": "夫方物非欲生，不得不生，万物非欲死，不得不死。任他尘生尘灭，万化万生，不能脱离苦海，劫劫生生，轮回不绝，无终无始，如汲井轮。三界凡夫，无一不遭此沉溺。", "o": "夫方物非欲生，不得不生，萬物非欲死，不得不死。任他塵生塵滅，萬化萬生，不能脫離苦海，劫劫生生，輪回不絕，無終無始，如汲井輪。三界凡夫，無一不遭此沉溺。", "i": 116}, {"t": "p", "s": "故世人莫知生从何来，盖参父母未生前；死从何来，知来然后知生处。世人莫问死从何去，盖参魂游魄降后；生从何去，知去然后知死处。死之机由于生，生之机原于死。无死机不死，无生机不生。生死之机两相关，世人所以有生死，生死之机不相关，至人所以超生死。有生死者，身也；无生死者，心也。敦复则心生迷，迷复则心死。", "o": "故世人莫知生從何來，蓋參父母未生前；死從何來，知來然後知生處。世人莫問死從何去，蓋參魂游魄降後；生從何去，知去然後知死處。死之機由於生，生之機原於死。無死機不死，無生機不生。生死之機兩相關，世人所以有生死，生死之機不相關，至人所以超生死。有生死者，身也；無生死者，心也。敦複則心生迷，迷複則心死。", "i": 117}, {"t": "p", "s": "故仙佛愍之，说一切众生，具有本来一灵真觉，但昏惑不见，使天命之性，浪化迁流，转转不悟。而世世堕落，失身于异类，透灵于别壳，至真性根，不复于人。", "o": "故仙佛愍之，說一切眾生，具有本來一靈真覺，但昏惑不見，使天命之性，浪化遷流，轉轉不悟。而世世墮落，失身於異類，透靈於別殼，至真性根，不複於人。", "i": 118}, {"t": "p", "s": "我当以圣道，令众生永离妄想，能致自身如仙家之长生、佛氏之不死去。", "o": "我當以聖道，令眾生永離妄想，能致自身如仙家之長生、佛氏之不死去。", "i": 119}, {"t": "h2", "s": "邪正说", "o": "邪正说", "i": 120}, {"t": "p", "s": "<mark>大道生天、生地</mark>，天地生人、生物。天、地、人、物一性同体。天有阴阳，地有刚柔，物有牝牡，人有男女。", "o": "<mark>大道生天、生地</mark>，天地生人、生物。天、地、人、物一性同體。天有陰陽，地有剛柔，物有牝牡，人有男女。", "i": 121}, {"t": "p", "s": "有阴阳斯有日月星辰，有刚柔斯有山川草木，有牝牡斯有胎卵湿化，有男女斯有配偶生育。", "o": "有陰陽斯有日月星辰，有剛柔斯有山川草木，有牝牡斯有胎卵濕化，有男女斯有配偶生育。", "i": 122}, {"t": "p", "s": "众生因配偶有淫欲，因生育有恩爱。有淫欲、恩爱，故有魔障、烦恼。有魔障、烦恼，故有一切苦厄。有一切苦厄，故有生老病死。", "o": "眾生因配偶有淫欲，因生育有恩愛。有淫欲、恩愛，故有魔障、煩惱。有魔障、煩惱，故有一切苦厄。有一切苦厄，故有生老病死。", "i": 123}, {"t": "p", "s": "是以太上蕴好生之德，开度世之门，著经立法，教人返朴还淳。无欲观妙，有欲观窍。致虚守静，归根复命。早复重积，深根妙蒂。得一守中，虚心实腹。弱志强骨，挫锐解纷，和光同尘。专气致柔，抱一无离。知雄守雌，知白守黑。闭门塞兑，被褐怀玉。窅窅冥冥，其精曰生，恍恍惚惚，其精不泄。日生则日长，不泄则不竭。精能化气，气能化神，神能还虚。五行不能盗，阴阳不能制。与道为体，超出天地。此乃老子清静无名之道也。", "o": "是以太上蘊好生之德，開度世之門，著經立法，教人返樸還淳。無欲觀妙，有欲觀竅。致虛守靜，歸根複命。早複重積，深根妙蒂。得一守中，虛心實腹。弱志強骨，挫銳解紛，和光同塵。專氣致柔，抱一無離。知雄守雌，知白守黑。閉門塞兌，被褐懷玉。窅窅冥冥，其精曰生，恍恍惚惚，其精不洩。日生則日長，不洩則不竭。精能化氣，氣能化神，神能還虛。五行不能盜，陰陽不能制。與道為體，超出天地。此乃老子清靜無名之道也。", "i": 124}, {"t": "p", "s": "至汉魏伯阳真人礼金碧经而作参同契，始有龙铅虎汞之名。爱及唐宋，诸仙叠出，丹经灿然。横说竖说，种种异名，载于丹书，不可胜数。究竟本来，无非吐露同出异名之一物耳。", "o": "至漢魏伯陽真人禮金碧經而作參同契，始有龍鉛虎汞之名。愛及唐宋，諸仙疊出，丹經燦然。橫說豎說，種種異名，載於丹書，不可勝數。究竟本來，無非吐露同出異名之一物耳。", "i": 125}, {"t": "p", "s": "盖圣师阐教，敷杨备细详说，实欲人人领悟、个个成真，殊不知名愈深而事愈繁，书愈多而道愈晦。况多为庚辞隐语，孔窍其门，使学者无罅缝可入，往往目眩心摇，望溟之叹。", "o": "蓋聖師闡教，敷楊備細詳說，實欲人人領悟、個個成真，殊不知名愈深而事愈繁，書愈多而道愈晦。況多為庚辭隱語，孔竅其門，使學者無罅縫可入，往往目眩心搖，望溟之嘆。", "i": 126}, {"t": "p", "s": "幸吾师尹真人出，欲续大道之一丝，以复无名之古教。于是剪除繁羌，撮其枢要，扫除譬喻，独露真诠，标摘正理，按图立象，不可施于笔者，笔之不可发于语者。语之直指何者是<b>铅汞</b>，何者是<b>龙虎</b>，何者是<b>鼎炉</b>，何者是药物，何者谓之采取，何者谓之抽添，何者谓之温养，何者谓之<b>火候</b>，何者是真种子，何者是真<b>性命</b>，何者是结胎，何者是了当，历历发明，毫发无隐。后之有志于道者，再不为丹经所惑也。", "o": "幸吾師尹真人出，欲續大道之一絲，以複無名之古教。於是剪除繁羌，撮其樞要，掃除譬喻，獨露真詮，標摘正理，按圖立象，不可施於筆者，筆之不可發於語者。語之直指何者是<b>鉛汞</b>，何者是<b>龍虎</b>，何者是<b>鼎爐</b>，何者是藥物，何者謂之採取，何者謂之抽添，何者謂之溫養，何者謂之<b>火候</b>，何者是真種子，何者是真<b>性命</b>，何者是結胎，何者是了當，歷歷發明，毫髮無隱。後之有志於道者，再不為丹經所惑也。", "i": 127}, {"t": "p", "s": "况丹经子书，汗牛充栋，讲理者多，留诀者少。初无下手入门，次无采药结胎，末无极则归著。后人不识次序，如何凑泊得来？不免有搀前越后之差，首颠尾倒之乱。学道一生，不得其门而入者多矣。间有入门者而不知升阶，有升阶者而不知登堂，有登堂者而不知入室。是以次第工夫乃修真之首务，岂可缺焉？", "o": "況丹經子書，汗牛充棟，講理者多，留訣者少。初無下手入門，次無採藥結胎，末無極則歸著。後人不識次序，如何湊泊得來？不免有攙前越後之差，首顛尾倒之亂。學道一生，不得其門而入者多矣。間有入門者而不知升階，有升階者而不知登堂，有登堂者而不知入室。是以次第工夫乃修真之首務，豈可缺焉？", "i": 128}, {"t": "p", "s": "予最爱藏经中四句偈曰：众生无边誓愿度，烦恼无边誓愿断，法门无量誓愿学，佛道无上誓愿成。世尊亦曰：度尽众生，然后作佛。区区由是，发一念慈悲，罄将师投秘诀彻底掀番，满盘托出，吁徕后之有缘，复返天界而不沉溺于苦海中者。此予之心也。", "o": "予最愛藏經中四句偈曰：眾生無邊誓願度，煩惱無邊誓願斷，法門無量誓願學，佛道無上誓願成。世尊亦曰：度盡眾生，然後作佛。區區由是，發一念慈悲，罄將師投秘訣徹底掀番，滿盤托出，籲徠後之有緣，複返天界而不沉溺於苦海中者。此予之心也。", "i": 129}, {"t": "p", "s": "其一曰：涵养本原，救护命宝。", "o": "其一曰：涵養本原，救護命寶。", "i": 130}, {"t": "p", "s": "其二曰：<span class=\"key\">安神祖窍，翕聚先天</span>。", "o": "其二曰：<span class=\"key\">安神祖竅，翕聚先天</span>。", "i": 131}, {"t": "p", "s": "其三曰：蛰藏气穴，众妙归根。", "o": "其三曰：蟄藏氣穴，眾妙歸根。", "i": 132}, {"t": "p", "s": "其四曰：<span class=\"key\">天人合发，采药归壶</span>。", "o": "其四曰：<span class=\"key\">天人合發，採藥歸壺</span>。", "i": 133}, {"t": "p", "s": "其五曰：<span class=\"key\">乾坤交媾，去矿留金</span>。", "o": "其五曰：<span class=\"key\">乾坤交媾，去礦留金</span>。", "i": 134}, {"t": "p", "s": "其六曰：灵丹入鼎，长养圣胎。", "o": "其六曰：靈丹入鼎，長養聖胎。", "i": 135}, {"t": "p", "s": "其七曰：<mark>婴儿现形</mark>，出离苦海。", "o": "其七曰：<mark>嬰兒現形</mark>，出離苦海。", "i": 136}, {"t": "p", "s": "其八曰：<span class=\"key\">移神内院，端拱冥心</span>。", "o": "其八曰：<span class=\"key\">移神內院，端拱冥心</span>。", "i": 137}, {"t": "p", "s": "其九曰：<span class=\"key\">本体虚空，超出三界</span>。", "o": "其九曰：<span class=\"key\">本體虛空，超出三界</span>。", "i": 138}, {"t": "p", "s": "于中更有炼形、结胎、<b>火候</b>等诸心法，以全九转还丹之功。", "o": "於中更有煉形、結胎、<b>火候</b>等諸心法，以全九轉還丹之功。", "i": 139}, {"t": "p", "s": "大道口诀，至此吐露尽矣。今之道者，峨冠方袍，自足自满，不肯低情下意，求师指授大道次第，惟只以盲弓盲，趋入旁蹊曲径。岂知道法三千六百、大丹二十四品皆是傍门，独此<mark>金丹</mark>一道是条修行正路。除此以外，再无别途可以成仙作佛也。", "o": "大道口訣，至此吐露盡矣。今之道者，峨冠方袍，自足自滿，不肯低情下意，求師指授大道次第，惟只以盲弓盲，趨入旁蹊曲徑。豈知道法三千六百、大丹二十四品皆是傍門，獨此<mark>金丹</mark>一道是條修行正路。除此以外，再無別途可以成仙作佛也。", "i": 140}, {"t": "p", "s": "故法华会上，世尊指曰：唯此一事实，余二即非真。", "o": "故法華會上，世尊指曰：唯此一事實，餘二即非真。", "i": 141}, {"t": "note", "s": "口诀引证：尹真人曰：九十六种外道，三千六百傍门，任他一切皆幻，只我这些是真。", "o": "口诀引证：尹真人曰：九十六種外道，三千六百傍門，任他一切皆幻，只我這些是真。", "i": 142}, {"t": "note", "s": "口诀引证：云房真人曰：道法三千六百门，人人各执一苗根，谁知些子<b>玄关</b>窍，不在三千六百门。", "o": "口诀引证：雲房真人曰：道法三千六百門，人人各執一苗根，誰知些子<b>玄關</b>竅，不在三千六百門。", "i": 143}, {"t": "p", "s": "盖玄夫大道，难遇易成而见功迟。傍门小术，易学难成而见效速。是以贪财好色之徒，往往迷而不悟。其中有好炉火者，有好彼家者，有视顶门者，有守脐蒂者，有运双睛者，有守印堂者，有摩脐轮者，有摇夹脊者，有兜外肾者，有转辘轳者，有三峰采战者，有食乳对炉者，有闭息行气者，有屈伸导引者，有三田还返者，有双提金井者，有哂背卧冰者，有饵芝服术看，有纳气咽津者，有内视存想者，有休粮辟谷者，有忍寒食秽者，有搬精运气者，有观鼻调息者，有离妻入山者，有定观鉴形者，有熊经鸟伸者，有餐霞服气者，有长坐不卧者，有打七炼魔者，有禅定不语者，有斋戒断味者，有梦游仙境者，有默朝上帝者，有密咒驱邪者，有见闻转诵者，有食己精为还元者，有捏尾闾为闭关者，有炼小便为秋食者，有采女经为红铅者，有抉阳用胞衣而炼紫河车者，有开关用黑铅而铸雌雄剑者，有闭目冥心而行八段锦者，有吐故纳新而行六字气者，有面壁而志在降龙伏虎者，有轻举而思以驾风骖者，有吞精咽华以翕日月者，有步罡愎斗以窥星辰者，有依卦爻之序而朝屯暮蒙者，有售黄白之术而烧茆弄火者，有希慕长生不死者，有驰志月日<mark>飞升</mark>者，有著相执而不化者，有著空流而不返者，有持戒定慧而望解脱者，有祛贪嗔痴而思清静者，有生而愿超西域者，有死而愿登天堂者，似此泯泯棼棼，难以悉举。", "o": "蓋玄夫大道，難遇易成而見功遲。傍門小術，易學難成而見效速。是以貪財好色之徒，往往迷而不悟。其中有好爐火者，有好彼家者，有視頂門者，有守臍蒂者，有運雙睛者，有守印堂者，有摩臍輪者，有搖夾脊者，有兜外腎者，有轉轆轤者，有三峰採戰者，有食乳對爐者，有閉息行氣者，有屈伸導引者，有三田還返者，有雙提金井者，有哂背臥冰者，有餌芝服術看，有納氣咽津者，有內視存想者，有休糧闢穀者，有忍寒食穢者，有搬精運氣者，有觀鼻調息者，有離妻入山者，有定觀鑒形者，有熊經鳥伸者，有餐霞服氣者，有長坐不臥者，有打七煉魔者，有禪定不語者，有齋戒斷味者，有夢游仙境者，有默朝上帝者，有密咒驅邪者，有見聞轉誦者，有食己精為還元者，有捏尾閭為閉關者，有煉小便為秋食者，有採女經為紅鉛者，有抉陽用胞衣而煉紫河車者，有開關用黑鉛而鑄雌雄劍者，有閉目冥心而行八段錦者，有吐故納新而行六字氣者，有面壁而志在降龍伏虎者，有輕舉而思以駕風驂者，有吞精咽華以翕日月者，有步罡愎斗以窺星辰者，有依卦爻之序而朝屯暮蒙者，有售黃白之術而燒茆弄火者，有希慕長生不死者，有馳志月日飛升者，有著相執而不化者，有著空流而不返者，有持戒定慧而望解脫者，有祛貪嗔癡而思清靜者，有生而願超西域者，有死而願登天堂者，似此泯泯棼棼，難以悉舉。", "i": 144}, {"t": "p", "s": "道释者流，执此一术一诀，便谓<mark>金丹</mark>大道，止于是矣。吁！此辈如管中窥豹，井底观天，妄引百端，支离万状，碎将至道，破段分门，以迷指迷，盲修瞎炼。不肯自思已错，更将错路教人。", "o": "道釋者流，執此一術一訣，便謂<mark>金丹</mark>大道，止於是矣。籲！此輩如管中窺豹，井底觀天，妄引百端，支離萬狀，碎將至道，破段分門，以迷指迷，盲修瞎煉。不肯自思已錯，更將錯路教人。", "i": 145}, {"t": "p", "s": "是以王良器作破迷歌，陈泥丸作罗浮吟，钟离翁作正道歌。历举傍门诸术之非，以救错行邪径之失也。", "o": "是以王良器作破迷歌，陳泥丸作羅浮吟，鐘離翁作正道歌。歷舉傍門諸術之非，以救錯行邪徑之失也。", "i": 146}, {"t": "p", "s": "于中亦有数条，可以攻疾病，救老残，益算延年，住世安乐。间或亦有超脱者，不过成个蓬岛仙罗汉果耳。", "o": "於中亦有數條，可以攻疾病，救老殘，益算延年，住世安樂。間或亦有超脫者，不過成個蓬島仙羅漢果耳。", "i": 147}, {"t": "p", "s": "故傅大土云：饶经八万劫，终是落空亡。此乃小乘功夫，不合大道全体。", "o": "故傅大土云：饒經八萬劫，終是落空亡。此乃小乘功夫，不合大道全體。", "i": 148}, {"t": "p", "s": "故张平叔云：学仙须是学天仙，唯有<mark>金丹</mark>最得端。", "o": "故張平叔云：學仙須是學天仙，唯有<mark>金丹</mark>最得端。", "i": 149}, {"t": "p", "s": "盖<mark>金丹</mark>之道，简而不繁。以虚无为体，以清静为用。有作以成其始，无为以成其终。从首至尾，并无高远难行之事。奈何世人，道在近而求诸远，事在易而求诸难，背明投暗，不亦感乎？", "o": "蓋<mark>金丹</mark>之道，簡而不繁。以虛無為體，以清靜為用。有作以成其始，無為以成其終。從首至尾，並無高遠難行之事。奈何世人，道在近而求諸遠，事在易而求諸難，背明投暗，不亦感乎？", "i": 150}, {"t": "p", "s": "夫金者，坚之称；丹者，圆之喻，是人毗卢性海<b>乾</b>元面目。世尊名之，空不空，如来藏。老君号之：玄又玄，众妙门。以此而言道，谓之无上至尊之道；以此而言法，谓之最上一乘之法。三教圣贤皆从此出修行正路。孰有正于此哉？", "o": "夫金者，堅之稱；丹者，圓之喻，是人毗盧性海<b>乾</b>元面目。世尊名之，空不空，如來藏。老君號之：玄又玄，眾妙門。以此而言道，謂之無上至尊之道；以此而言法，謂之最上一乘之法。三教聖賢皆從此出修行正路。孰有正於此哉？", "i": 151}, {"t": "p", "s": "子之本怀，正欲乘此皇极昭明之世，与群生同种<b>乾</b>元之因，共结龙华之伴，故作此说而挽邪归正，并吾师所授诸图诀窍明明指出，使诸学者印证丹经，一览而无疑矣。普照图、反照图、时照图、内照图", "o": "子之本懷，正欲乘此皇極昭明之世，與群生同種<b>乾</b>元之因，共結龍華之伴，故作此說而挽邪歸正，並吾師所授諸圖訣竅明明指出，使諸學者印証丹經，一覽而無疑矣。普照圖、反照圖、時照圖、內照圖", "i": 152}, {"t": "p", "s": "如此大法，万神圭旨是也！", "o": "如此大法，萬神圭旨是也！", "i": 153}, {"t": "p", "s": "人之<mark>元气</mark>逐日发生。子时复气到尾间。丑时临气到背堂。寅时泰气到玄枢。卯时大壮气到夹脊。辰时书气到陶道。已时<b>乾</b>气到玉枕。午时垢气到泥丸。未时豚气到明堂。申时否气到膻中。酉时观气到中浣。戍时剥气到<b>乾</b>阙。亥时<b>坤</b>气而归于气海矣。", "o": "人之<mark>元氣</mark>逐日發生。子時複氣到尾間。丑時臨氣到背堂。寅時泰氣到玄樞。卯時大壯氣到夾脊。辰時書氣到陶道。已時<b>乾</b>氣到玉枕。午時垢氣到泥丸。未時豚氣到明堂。申時否氣到膻中。酉時觀氣到中浣。戍時剝氣到<b>乾</b>闕。亥時<b>坤</b>氣而歸於氣海矣。", "i": 154}, {"t": "p", "s": "人身有任督二脉，为阴阳之总。任脉者，起于中极之，下循腹里，上关元至咽喉，属阴脉之海。督脉者，起于下极之。腧穿脊里，上风府，循额至鼻，属阳脉之海。鹿运属闾，盖能通其督脉也。龟纳鼻息，盖能通其任脉也。人能通此二脉，则百脉皆通而无疾矣。", "o": "人身有任督二脈，為陰陽之總。任脈者，起於中極之，下循腹裏，上關元至咽喉，屬陰脈之海。督脈者，起於下極之。腧穿脊裏，上風府，循額至鼻，屬陽脈之海。鹿運屬閭，蓋能通其督脈也。龜納鼻息，蓋能通其任脈也。人能通此二脈，則百脈皆通而無疾矣。", "i": 155}, {"t": "p", "s": "心者，君主之官，神明出焉。肺者，相传之官，治节出焉。肝者，将军之官，谋虑出焉。胆者，中正之官，决断出焉。膻中者，臣使之官，喜乐出焉。脾者，仓禀之首，五味出焉。大肠者，传道之官，变化出焉。小肠者，受盛之官，化物出焉。肾者，作强之官，技巧出焉。", "o": "心者，君主之官，神明出焉。肺者，相傳之官，治節出焉。肝者，將軍之官，謀慮出焉。膽者，中正之官，決斷出焉。膻中者，臣使之官，喜樂出焉。脾者，倉稟之首，五味出焉。大腸者，傳道之官，變化出焉。小腸者，受盛之官，化物出焉。腎者，作強之官，技巧出焉。", "i": 156}, {"t": "p", "s": "脑者，髓之海，诸髓皆属之，故上至泥丸，下至尾骶，俱肾主之。膻中，在两乳间，为之之海，能分布阴阳，为生化之源。故名之曰海膜，在肺下与助腹周围，相著如幕，以遮浊气，使不熏蒸上焦。幽门在大小肠之间，津液渗入膀胱。滓秽流入大肠，变化出矣。", "o": "腦者，髓之海，諸髓皆屬之，故上至泥丸，下至尾骶，俱腎主之。膻中，在兩乳間，為之之海，能分布陰陽，為生化之源。故名之曰海膜，在肺下與助腹周圍，相著如幕，以遮濁氣，使不熏蒸上焦。幽門在大小腸之間，津液滲入膀胱。滓穢流入大腸，變化出矣。", "i": 157}, {"t": "p", "s": "普照图之上一层者，直指心源性海之窍；中一层者，直指黄中正位之窍；下一层者，直指关<mark>元气</mark>海之窍。此谓前<b>三关</b>也。", "o": "普照圖之上一層者，直指心源性海之竅；中一層者，直指黃中正位之竅；下一層者，直指關<mark>元氣</mark>海之竅。此謂前<b>三關</b>也。", "i": 158}, {"t": "p", "s": "反照图之下一层者，指出尾闾太玄之窍，中一层者，指出夹脊双关之窍，上一层者，指出天谷泥丸之窍。此谓后<b>三关</b>也。丹阳云：前三三，后三三，收拾起，一担担，是此义也。", "o": "反照圖之下一層者，指出尾閭太玄之竅，中一層者，指出夾脊雙關之竅，上一層者，指出天穀泥丸之竅。此謂後<b>三關</b>也。丹陽云：前三三，後三三，收拾起，一擔擔，是此義也。", "i": 159}, {"t": "p", "s": "时照图者，发明阳升阳降之机，四象环中之妙。", "o": "時照圖者，發明陽升陽降之機，四象環中之妙。", "i": 160}, {"t": "p", "s": "内照囹者，指示五脏六腑、二十四椎、任督两脉，使内观者知有下手处。若人不明窍而言修，犹人未能立而言行也。从古诸仙皆口口相传、心心相授，不敢明将此窍示人，是惧泄天机之故耳。吾师尹公开佛之正知见，等众生如一子，绘此四图接引后之迷者，意在普度有缘，同出生死苦海。", "o": "內照囹者，指示五臟六腑、二十四椎、任督兩脈，使內觀者知有下手處。若人不明竅而言修，猶人未能立而言行也。從古諸仙皆口口相傳、心心相授，不敢明將此竅示人，是懼洩天機之故耳。吾師尹公開佛之正知見，等眾生如一子，繪此四圖接引後之迷者，意在普度有緣，同出生死苦海。", "i": 161}, {"t": "h2", "s": "火龙水虎说", "o": "火龙水虎说", "i": 162}, {"t": "p", "s": "夫黑铅、水虎者，是天地发生之根，乃有质而有气也。红铅、火龙者，是天地发生之本，乃有气而无质也。有质者，真铅也，大阴月之精也，为天地万物育形之母。无质者，真汞也，太阳日之光也，为天地万物发生之父。<b>铅汞</b>之体，互相孽胤，循环不绝，可谓生天、生地，生万物之祖宗也。", "o": "夫黑鉛、水虎者，是天地發生之根，乃有質而有氣也。紅鉛、火龍者，是天地發生之本，乃有氣而無質也。有質者，真鉛也，大陰月之精也，為天地萬物育形之母。無質者，真汞也，太陽日之光也，為天地萬物發生之父。<b>鉛汞</b>之體，互相孽胤，循環不絕，可謂生天、生地，生萬物之祖宗也。", "i": 163}, {"t": "p", "s": "古之至人，知神物隐于此，假法象而采取太阴之精，设鼎器而诱会大阳之气，使归神室，混混相交，交合不已，孽产无穷，而水中生魂，金中生魄，魂魄凝然，化为鄞鄂，交结百宝，名曰金液还丹。", "o": "古之至人，知神物隱於此，假法象而採取太陰之精，設鼎器而誘會大陽之氣，使歸神室，混混相交，交合不已，孽產無窮，而水中生魂，金中生魄，魂魄凝然，化為鄞鄂，交結百寶，名曰金液還丹。", "i": 164}, {"t": "h2", "s": "日乌月兔说", "o": "日乌月兔说", "i": 165}, {"t": "p", "s": "日者，阳也。阳内含阴，象砂中有汞也。阳无阴，则不能自耀其魂，故名曰雌火，乃阳中含阴也。日中有乌，卦属南方，谓之离女。故曰：日居高位反为女。", "o": "日者，陽也。陽內含陰，象砂中有汞也。陽無陰，則不能自耀其魂，故名曰雌火，乃陽中含陰也。日中有烏，卦屬南方，謂之離女。故曰：日居高位反為女。", "i": 166}, {"t": "p", "s": "月者，阴也。阴内含阳，象铅中有银也。阴无阳，则不能自莹其魄，故名曰雄金，乃阴中含阳也。月中有兔，卦属北方，谓之坎男。故曰：坎配蟾宫却是男。", "o": "月者，陰也。陰內含陽，象鉛中有銀也。陰無陽，則不能自瑩其魄，故名曰雄金，乃陰中含陽也。月中有兔，卦屬北方，謂之坎男。故曰：坎配蟾宮卻是男。", "i": 167}, {"t": "p", "s": "无漏云：铅求玉兔脑中精，汞取金鸟心内血，只驱二物结成丹，至道不繁无扭捏。", "o": "無漏云：鉛求玉兔腦中精，汞取金鳥心內血，只驅二物結成丹，至道不繁無扭捏。", "i": 168}, {"t": "p", "s": "悟真云：先把<b>乾</b><b>坤</b>为鼎器，次搏乌免药来烹，既驱二物归黄道，争得<mark>金丹</mark>不解生。", "o": "悟真云：先把<b>乾</b><b>坤</b>為鼎器，次搏烏免藥來烹，既驅二物歸黃道，爭得<mark>金丹</mark>不解生。", "i": 169}, {"t": "p", "s": "二物者，一体也。", "o": "二物者，一體也。", "i": 170}, {"t": "h2", "s": "大小鼎炉说", "o": "大小鼎炉说", "i": 171}, {"t": "p", "s": "凡修金液大丹，必先安炉立鼎。鼎之为器，非金非铁；炉之为具，非玉非石。黄庭为鼎，气穴为炉。黄庭正在气穴上，缕络相连，乃人身百脉交汇之处。鼎卦曰：正位凝命是也。此谓之小鼎妒也。", "o": "凡修金液大丹，必先安爐立鼎。鼎之為器，非金非鐵；爐之為具，非玉非石。黃庭為鼎，氣穴為爐。黃庭正在氣穴上，縷絡相連，乃人身百脈交匯之處。鼎卦曰：正位凝命是也。此謂之小鼎妒也。", "i": 172}, {"t": "p", "s": "<b>乾</b>位为鼎，<b>坤</b>位为炉。鼎中有水银之阴，即火龙性根也。炉内有玉蕊之阳，即水成命蒂也。虎在下，为发火之枢机；龙居上，起腾云之风浪。若炉内阳生阴降无差，则鼎中天魂地魄留恋，青龙与白虎相拘，玉免与金乌相抱。<b>火候</b>调停，炼成至宝。故青霞子曰：鼎鼎非金鼎，炉炉非玉炉。火从脐下发。水向顶中符。三姓既会合，二物自相拘。固济胎不泄，变化在须臾。此谓之大<b>鼎炉</b>也。内外二药说", "o": "<b>乾</b>位為鼎，<b>坤</b>位為爐。鼎中有水銀之陰，即火龍性根也。爐內有玉蕊之陽，即水成命蒂也。虎在下，為發火之樞機；龍居上，起騰雲之風浪。若爐內陽生陰降無差，則鼎中天魂地魄留戀，青龍與白虎相拘，玉免與金烏相抱。<b>火候</b>調停，煉成至寶。故青霞子曰：鼎鼎非金鼎，爐爐非玉爐。火從臍下發。水向頂中符。三姓既會合，二物自相拘。固濟胎不洩，變化在須臾。此謂之大<b>鼎爐</b>也。內外二藥說", "i": 173}, {"t": "p", "s": "凡修炼者，先修外药，后修内药。若高上之士，夙植<b>灵根</b>，故不炼外药，便炼内药。内药无为无方。为外药有为有以，为内药无形无质。而实有外药，有体有用。而实无外药，可以治病，可以长生。久视内药，可以超越，可以出有入无。外药外阴阳往来，内药内<b>坎离</b>辐辏。以外药言之，交感之精，先要不漏，呼吸之气，更要微微，思虑之神，贵在安静。以内药言之，炼精者，炼<mark>元精</mark>，抽坎中之元阳也，<mark>元精</mark>固，则交感之精自不泄漏；炼气者，炼<mark>元气</mark>，补离中之元阴也，<mark>元气</mark>住，则呼吸之气自不出入；炼神者，炼<mark>元神</mark>，<b>坎离</b>合体而复<b>乾</b>元，<mark>元神</mark>凝则思虑之神自然泰定。", "o": "凡修煉者，先修外藥，後修內藥。若高上之士，夙植<b>靈根</b>，故不煉外藥，便煉內藥。內藥無為無方。為外藥有為有以，為內藥無形無質。而實有外藥，有體有用。而實無外藥，可以治病，可以長生。久視內藥，可以超越，可以出有入無。外藥外陰陽往來，內藥內<b>坎離</b>輻輳。以外藥言之，交感之精，先要不漏，呼吸之氣，更要微微，思慮之神，貴在安靜。以內藥言之，煉精者，煉<mark>元精</mark>，抽坎中之元陽也，<mark>元精</mark>固，則交感之精自不洩漏；煉氣者，煉<mark>元氣</mark>，補離中之元陰也，<mark>元氣</mark>住，則呼吸之氣自不出入；煉神者，煉<mark>元神</mark>，<b>坎離</b>合體而複<b>乾</b>元，<mark>元神</mark>凝則思慮之神自然泰定。", "i": 174}, {"t": "p", "s": "内外兼修，成仙必矣。", "o": "內外兼修，成仙必矣。", "i": 175}, {"t": "h2", "s": "顺逆三关说", "o": "顺逆三关说", "i": 176}, {"t": "p", "s": "道生一、一生二、二生三、三生万物，此所谓顺去生人、生物。今则形化精、精化气、气化神、神化虚，此所谓逆来成仙、成佛。初关炼精化炁者，要识天癸生时，急急来之。采时须以徘徊之意，引火逼金行，颠倒转自然，鼎内大丹凝。中关炼气化神者，乘此火力炽盛，驾动河车，自太<b>玄关</b>逆流，至天谷穴，炁与神合，然后下降黄房。所谓<b>乾</b><b>坤</b>交媾罢，一点落黄庭。上关炼神还虚者，守一抱元，以神归于毗卢性海。", "o": "道生一、一生二、二生三、三生萬物，此所謂順去生人、生物。今則形化精、精化氣、氣化神、神化虛，此所謂逆來成仙、成佛。初關煉精化炁者，要識天癸生時，急急來之。採時須以徘徊之意，引火逼金行，顛倒轉自然，鼎內大丹凝。中關煉氣化神者，乘此火力熾盛，駕動河車，自太<b>玄關</b>逆流，至天谷穴，炁與神合，然後下降黃房。所謂<b>乾</b><b>坤</b>交媾罷，一點落黃庭。上關煉神還虛者，守一抱元，以神歸於毗盧性海。", "i": 177}, {"t": "p", "s": "盖<b>三关</b>自有为入无为者，渐法也。修上一关，兼下二关者，顿法也。若径作炼神还虚者，工夫列虚极静笃时，精自化炁，炁自化神。即关尹子忘精神而超生之上旨也。", "o": "蓋<b>三關</b>自有為入無為者，漸法也。修上一關，兼下二關者，頓法也。若徑作煉神還虛者，工夫列虛極靜篤時，精自化炁，炁自化神。即關尹子忘精神而超生之上旨也。", "i": 178}, {"t": "h2", "s": "尽性了命说", "o": "尽性了命说", "i": 179}, {"t": "p", "s": "丹田喻日，心中元性喻月。日光自返照月，盖交会之后实体乃生金也。月受日气，故初三生一阳者，丹既居鼎，觉一点灵光自心常照而无昼夜。一阳生于月之八日而二阳产矣。二阳者，丹之金气少旺，而元性又少现。自二阳生之于望而三阳纯矣，三阳纯者是所谓元性尽现而如月之圆矣。十六而一阴生，一阴者，性归于命之始也。自一阴生至于月之二十三而二阴产矣。二阴者，乃性归于命三之二也。自二阴生于月之三十日而三阴全矣。三阴金，乃性尽归于命也。方其始也，以命而取性。性全矣，又以性而安命。", "o": "丹田喻日，心中元性喻月。日光自返照月，蓋交會之後實體乃生金也。月受日氣，故初三生一陽者，丹既居鼎，覺一點靈光自心常照而無晝夜。一陽生於月之八日而二陽產矣。二陽者，丹之金氣少旺，而元性又少現。自二陽生之於望而三陽純矣，三陽純者是所謂元性盡現而如月之圓矣。十六而一陰生，一陰者，性歸於命之始也。自一陰生至於月之二十三而二陰產矣。二陰者，乃性歸於命三之二也。自二陰生於月之三十日而三陰全矣。三陰金，乃性盡歸於命也。方其始也，以命而取性。性全矣，又以性而安命。", "i": 180}, {"t": "p", "s": "此是<span class=\"key\">性命双修</span>大机括处。", "o": "此是<span class=\"key\">性命雙修</span>大機括處。", "i": 181}, {"t": "h2", "s": "真土根心说", "o": "真土根心说", "i": 182}, {"t": "p", "s": "夫天之气之所从生者，盖蕴于天地之土中而无尽藏也。人之气所从生者，盖蕴于人身之土中而无尽藏也。故仁义礼智之根，根之心；犹草木之根，根于土。草木之根根于土，自然畅茂，而条达仁义礼智之根根于心，自然生色而啐面。孟子曰：居移气，养移体。大学曰：心广体胖。心既广矣，体复胖矣，而谓病之不去体者，妄也。至若枝叶之或憔悴而枯槁也，则又如之何？亦唯直从于其根焉。而培之，而溉之，培之溉之而生意有不复息乎？盖草木之根，病则枝叶病。若人之心犹草木之根也，心病则身病，心不病则身不病。故身病由于心病。而体胖，数语乃去病之圣药也。魂魄说", "o": "夫天之氣之所從生者，蓋蘊於天地之土中而無盡藏也。人之氣所從生者，蓋蘊於人身之土中而無盡藏也。故仁義禮智之根，根之心；猶草木之根，根於土。草木之根根於土，自然暢茂，而條達仁義禮智之根根於心，自然生色而啐面。孟子曰：居移氣，養移體。大學曰：心廣體胖。心既廣矣，體複胖矣，而謂病之不去體者，妄也。至若枝葉之或憔悴而枯槁也，則又如之何？亦唯直從於其根焉。而培之，而溉之，培之溉之而生意有不複息乎？蓋草木之根，病則枝葉病。若人之心猶草木之根也，心病則身病，心不病則身不病。故身病由於心病。而體胖，數語乃去病之聖藥也。魂魄說", "i": 183}, {"t": "p", "s": "鬼云为魂，鬼白为魄。云者，风，风者，木；白者，气；气者，金。风散故轻清，轻清者，魄从魂升。金风故重浊，重浊者，魂从魄降。故圣人以魂运魄，众人以魄摄魂。魂昼寓目，魄夜舍肝。寓目能见，舍肝能梦。梦多者，魄制魂；觉多者，魂胜魄。盖因魄有精，因精有魂，因魂有神，因神有意，因意有魄。五者运行不已，所以我之伪心流转造化几亿万岁未有穷极。然核芽相生不知其几万株。天地虽大，不能芽空中之核；雌卵相生，不知其几万禽，阴阳虽妙，不能卵无雄之雌。是以圣人，万物之来，对之以性而不对之以心。性者，心未萌也，无心则无意，无意则无魄，无魄则不受生，而轮回永息矣。蟾光说", "o": "鬼云為魂，鬼白為魄。云者，風，風者，木；白者，氣；氣者，金。風散故輕清，輕清者，魄從魂升。金風故重濁，重濁者，魂從魄降。故聖人以魂運魄，眾人以魄攝魂。魂晝寓目，魄夜舍肝。寓目能見，舍肝能夢。夢多者，魄制魂；覺多者，魂勝魄。蓋因魄有精，因精有魂，因魂有神，因神有意，因意有魄。五者運行不已，所以我之偽心流轉造化幾億萬歲未有窮極。然核芽相生不知其幾萬株。天地雖大，不能芽空中之核；雌卵相生，不知其幾萬禽，陰陽雖妙，不能卵無雄之雌。是以聖人，萬物之來，對之以性而不對之以心。性者，心未萌也，無心則無意，無意則無魄，無魄則不受生，而輪回永息矣。蟾光說", "i": 184}, {"t": "p", "s": "太虚寥廓，皓月粲然，雪浪翻腾，金蟆吐耀。人见月之所以明而曰：金精盛则月明焉。孰知金之所以生者，自月而产也。人见金之产于月，而不知月之明本出于日也。月者，喻元性也。水，喻坎宫也。金蟆者，喻一点真阳之窍也。元性，喻月性之用也。性之初见，圆陀陀，光灿灿，状似流星。盖气质之性稍息，而<mark>元神</mark>真性就见，如云开则月现，雾散则阳晖。才见此物，分明便是<mark>元气</mark>产矣，速急采取。譬之，见贼便捉，毋令再逸。收归于鼎器之中，则一点<mark>元气</mark>蟾光终，不可得而出矣。降龙说", "o": "太虛寥廓，皓月粲然，雪浪翻騰，金蟆吐耀。人見月之所以明而曰：金精盛則月明焉。孰知金之所以生者，自月而產也。人見金之產於月，而不知月之明本出於日也。月者，喻元性也。水，喻坎宮也。金蟆者，喻一點真陽之竅也。元性，喻月性之用也。性之初見，圓陀陀，光燦燦，狀似流星。蓋氣質之性稍息，而<mark>元神</mark>真性就見，如雲開則月現，霧散則陽暉。才見此物，分明便是<mark>元氣</mark>產矣，速急採取。譬之，見賊便捉，毋令再逸。收歸於鼎器之中，則一點<mark>元氣</mark>蟾光終，不可得而出矣。降龍說", "i": 185}, {"t": "p", "s": "离日为汞，中有己土，强名曰龙。其形狞恶，主生人杀人之权，专成佛成仙之道，威能变化，感而遂通，云行雨施，品物流行，<b>乾</b>之九二，见龙在田，利见大人。", "o": "離日為汞，中有己土，強名曰龍。其形獰惡，主生人殺人之權，專成佛成仙之道，威能變化，感而遂通，雲行雨施，品物流行，<b>乾</b>之九二，見龍在田，利見大人。", "i": 186}, {"t": "p", "s": "子曰：龙德而正中也。世人不悟此龙生生之功，每服其害。若人悟而畏之，调而驭之，则能降此狞恶之龙而积至精之汞。降之者，制其心中真火，火性不飞，则龙可制而有得铅之时。", "o": "子曰：龍德而正中也。世人不悟此龍生生之功，每服其害。若人悟而畏之，調而馭之，則能降此獰惡之龍而積至精之汞。降之者，制其心中真火，火性不飛，則龍可制而有得鉛之時。", "i": 187}, {"t": "p", "s": "故曰：不积汞，何以取其铅，不降龙，无以伏其虎。且真铅真汞未易相投，而真虎真龙亦难降伏。学道者若能了得这个字，其他事皆未务也。伏虎说", "o": "故曰：不積汞，何以取其鉛，不降龍，無以伏其虎。且真鉛真汞未易相投，而真虎真龍亦難降伏。學道者若能了得這個字，其他事皆未務也。伏虎說", "i": 188}, {"t": "p", "s": "坎月为铅，铅中有戊土，强名曰虎，其形猖狂，虽能伤人杀人，却蕴大乘气象，举动风威，叩之则应，舍弘光大品物资生文。", "o": "坎月為鉛，鉛中有戊土，強名曰虎，其形猖狂，雖能傷人殺人，卻蘊大乘氣象，舉動風威，叩之則應，舍弘光大品物資生文。", "i": 189}, {"t": "note", "s": "口诀引证：王重阳曰：履虎尾，不咥人。", "o": "口诀引证：王重陽曰：履虎尾，不咥人。", "i": 190}, {"t": "p", "s": "亨又曰：愎道坦坦，幽人贞吉。", "o": "亨又曰：愎道坦坦，幽人貞吉。", "i": 191}, {"t": "note", "s": "口诀引证：孔子曰：素愎之往，独行愿也。", "o": "口诀引证：孔子曰：素愎之往，獨行願也。", "i": 192}, {"t": "p", "s": "若人悟而畏之，驯而调之，则能伏此猖狂之虎，以产先天之铅。伏之者，伏身中真水，水源至清，则虎可伏而无咥人之害。", "o": "若人悟而畏之，馴而調之，則能伏此猖狂之虎，以產先天之鉛。伏之者，伏身中真水，水源至清，則虎可伏而無咥人之害。", "i": 193}, {"t": "p", "s": "故历代圣师以降龙为炼已，以伏虎为持心。是以纯阳翁云：七返还丹在人，先须炼己待时。", "o": "故歷代聖師以降龍為煉已，以伏虎為持心。是以純陽翁云：七返還丹在人，先須煉己待時。", "i": 194}, {"t": "p", "s": "紫阳翁云：若要修成九转，先须炼己持心。皆此义也。", "o": "紫陽翁云：若要修成九轉，先須煉己持心。皆此義也。", "i": 195}, {"t": "h2", "s": "三家相见说", "o": "三家相见说", "i": 196}, {"t": "p", "s": "身、心、意谓之三家。<span class=\"key\">三家相见</span>者，胎圆也。精、气、神谓之三元。三元合一者，丹成也。摄三归一，在乎虚静。虚其心，则神与性合。静其身，则精与情寂。意<b>大定</b>，则三元混一。", "o": "身、心、意謂之三家。<span class=\"key\">三家相見</span>者，胎圓也。精、氣、神謂之三元。三元合一者，丹成也。攝三歸一，在乎虛靜。虛其心，則神與性合。靜其身，則精與情寂。意<b>大定</b>，則三元混一。", "i": 197}, {"t": "p", "s": "情合性谓之金木并，精合神谓之水火交，意<b>大定</b>谓之五行全。", "o": "情合性謂之金木並，精合神謂之水火交，意<b>大定</b>謂之五行全。", "i": 198}, {"t": "p", "s": "然而精化为炁者，由身之不动也。炁化为神者，由心之不动也。神化为虚者，由意之不动也。心若不动，则东三南二同成五也。身若不动，则北一西方四共之也。意若不动，则<b>戊己</b>还生数五也。", "o": "然而精化為炁者，由身之不動也。炁化為神者，由心之不動也。神化為虛者，由意之不動也。心若不動，則東三南二同成五也。身若不動，則北一西方四共之也。意若不動，則<b>戊己</b>還生數五也。", "i": 199}, {"t": "p", "s": "身，心、意合，则<span class=\"key\">三家相见</span>，结<b>婴儿</b>也。", "o": "身，心、意合，則<span class=\"key\">三家相見</span>，結<b>嬰兒</b>也。", "i": 200}, {"t": "h2", "s": "和合四象说", "o": "和合四象说", "i": 201}, {"t": "p", "s": "四象者，青龙、白虎、朱雀、玄武也。五行者，金、木、水、火、土也。龙木生火，同瞩乎心。心者，象帝之先灵妙，本有中之真无也。心若不动，则龙吟云起。朱雀敛翼，而<mark>元气</mark>聚矣。虎金生水，同系乎身。身者，历劫以来清静，自无中之妙有也。身若不动，则虎啸风生。玄龟潜伏，而<mark>元精</mark>凝矣。精凝气聚，则金木水火混融于真土之中，而精神魂魄攒簇于真意之内。真意者，<b>乾</b>元也。乃天地之母，阴阳之根，水火之本，日月之宗，三才之源，五行之祖，万物赖之以生成，千灵承之以舒惨。意若不动，则二物交、三宝结、四象和合、五行攒簇，俱会八中宫而大丹成矣。故紫阳云：五行全要八中央。盖此之谓也。", "o": "四象者，青龍、白虎、朱雀、玄武也。五行者，金、木、水、火、土也。龍木生火，同矚乎心。心者，象帝之先靈妙，本有中之真無也。心若不動，則龍吟雲起。朱雀斂翼，而<mark>元氣</mark>聚矣。虎金生水，同系乎身。身者，歷劫以來清靜，自無中之妙有也。身若不動，則虎嘯風生。玄龜潛伏，而<mark>元精</mark>凝矣。精凝氣聚，則金木水火混融於真土之中，而精神魂魄攢簇於真意之內。真意者，<b>乾</b>元也。乃天地之母，陰陽之根，水火之本，日月之宗，三才之源，五行之祖，萬物賴之以生成，千靈承之以舒慘。意若不動，則二物交、三寶結、四象和合、五行攢簇，俱會八中宮而大丹成矣。故紫陽云：五行全要八中央。蓋此之謂也。", "i": 202}, {"t": "h2", "s": "取坎填离说", "o": "取坎填离说", "i": 203}, {"t": "p", "s": "<b>铅汞</b>者，太极初分，先天之炁也。先天炁者，<b>龙虎</b>初弦之炁也。虎居北方坎水之中，而坎中阳爻原属于<b>乾</b>。劫运未交之先，<b>乾</b>因颠蹶驰骤误陷于<b>坤</b>。<b>乾</b>之中爻损而成离。离本汞居，故曰，坎内黄男名汞祖也。龙居南方离火之内，而离中阴爻原属于<b>坤</b>，混沌颠落之后，<b>坤</b>因含受孕育，得配于<b>乾</b>。<b>坤</b>之中爻实而为坎，坎本铅会，故曰离中玄女是铅家也。似此男女异室，<b>铅汞</b>异炉，阴阳不交，则天地否矣。圣人以意为<b>黄婆</b>，引坎内黄男，配离中玄女。夫妻一媾，即变纯<b>乾</b>，谓之<span class=\"key\">取坎填离</span>，复我先天本体。故悟真篇云：取将坎内中心实，点化离宫腹内阴，正此义也。", "o": "<b>鉛汞</b>者，太極初分，先天之炁也。先天炁者，<b>龍虎</b>初弦之炁也。虎居北方坎水之中，而坎中陽爻原屬於<b>乾</b>。劫運未交之先，<b>乾</b>因顛蹶馳驟誤陷於<b>坤</b>。<b>乾</b>之中爻損而成離。離本汞居，故曰，坎內黃男名汞祖也。龍居南方離火之內，而離中陰爻原屬於<b>坤</b>，混沌顛落之後，<b>坤</b>因含受孕育，得配於<b>乾</b>。<b>坤</b>之中爻實而為坎，坎本鉛會，故曰離中玄女是鉛家也。似此男女異室，<b>鉛汞</b>異爐，陰陽不交，則天地否矣。聖人以意為<b>黃婆</b>，引坎內黃男，配離中玄女。夫妻一媾，即變純<b>乾</b>，謂之<span class=\"key\">取坎填離</span>，複我先天本體。故悟真篇云：取將坎內中心實，點化離宮腹內陰，正此義也。", "i": 204}, {"t": "h2", "s": "念观音咒说", "o": "念观音咒说", "i": 205}, {"t": "p", "s": "此咒是观音菩萨微妙心印。若人书写六字大明咒者，即同书写三藏法宝；若人得念六字大明咒者，则同讽诵七轴灵文。又能开智慧门，能救百难苦，三世业冤，悉皆清静，一切罪障，尽得消除，解脱生死，安乐法身。然而念咒亦有密诀。故第一声中叫唵之，乃以呼吾身毗卢遮那佛也。第二声东而嘛之，乃以呼吾身不动尊佛也。第三声南而呢之，乃以呼吾身宝生佛也。第四声西而叭之，乃以呼吾身无量寿佛也。第五声北而咪之，乃以呼吾身不空成就佛也。第六声复上返于喉而作吽者，乃以呼吾身大势至金刚也。久则五炁归元，即成就不思议功德而证圆通也。", "o": "此咒是觀音菩薩微妙心印。若人書寫六字大明咒者，即同書寫三藏法寶；若人得念六字大明咒者，則同諷誦七軸靈文。又能開智慧門，能救百難苦，三世業冤，悉皆清靜，一切罪障，盡得消除，解脫生死，安樂法身。然而念咒亦有密訣。故第一聲中叫唵之，乃以呼吾身毗盧遮那佛也。第二聲東而嘛之，乃以呼吾身不動尊佛也。第三聲南而呢之，乃以呼吾身寶生佛也。第四聲西而叭之，乃以呼吾身無量壽佛也。第五聲北而咪之，乃以呼吾身不空成就佛也。第六聲複上返於喉而作吽者，乃以呼吾身大勢至金剛也。久則五炁歸元，即成就不思議功德而証圓通也。", "i": 206}, {"t": "h2", "s": "九鼎炼心说", "o": "九鼎炼心说", "i": 207}, {"t": "p", "s": "日也者，天之丹也，黑而荡之，则日不丹。心也者，人之丹也，物而霾之，则心不丹。故炼丹也者，炼去阴霾之物，以复其心之本体天命之性之自然也。天命之性，吾之真金也，人人之所必有者。气质之性，金之浊渣也。上智之所不无者，若以人伦日用之火而日炼之，则气质之性日除。气质之性日除，则天命之性自见矣。故五帝三王君也，而以君道而日炼其心；伊博周召相也，而以相道而日炼其心，孔曾思孟师也，而以师道而日炼其心。无时而不心在于道，无时而不以道而炼其心，此乃古大圣大贤为学之要法，百炼、炼心、炼性之明训也。", "o": "日也者，天之丹也，黑而蕩之，則日不丹。心也者，人之丹也，物而霾之，則心不丹。故煉丹也者，煉去陰霾之物，以複其心之本體天命之性之自然也。天命之性，吾之真金也，人人之所必有者。氣質之性，金之濁渣也。上智之所不無者，若以人倫日用之火而日煉之，則氣質之性日除。氣質之性日除，則天命之性自見矣。故五帝三王君也，而以君道而日煉其心；伊博周召相也，而以相道而日煉其心，孔曾思孟師也，而以師道而日煉其心。無時而不心在於道，無時而不以道而煉其心，此乃古大聖大賢為學之要法，百煉、煉心、煉性之明訓也。", "i": 208}, {"t": "h2", "s": "八识归元说", "o": "八识归元说", "i": 209}, {"t": "p", "s": "释氏谓，人之受生，必从父精母血与前生之<b>识神</b>三相合而后成胎。精气受之父母，神识不受之父母也。盖从无始劫流来，亦谓之生灭性。故曰：生灭与不生灭和合而成八识也。盖造化间有个万古不移之真宰，又有个与时推移之气运。真宰与气运合是谓天命之性。天命之性者，<mark>元神</mark>也。气质之性者，<b>识神</b>也。故儒家有变化气质之言，禅宗有返识为智之法。今人妄认方才中有个昭昭灵灵之物，浑然与物同体，便以为<mark>元神</mark>在。是殊不知此即死死生生之本，非不生不灭之<mark>元神</mark>也。噫，识识易，去识难，若不以天命<mark>元神</mark>战退无明业识。终在生灭场中，未见有出头日也。", "o": "釋氏謂，人之受生，必從父精母血與前生之<b>識神</b>三相合而後成胎。精氣受之父母，神識不受之父母也。蓋從無始劫流來，亦謂之生滅性。故曰：生滅與不生滅和合而成八識也。蓋造化間有個萬古不移之真宰，又有個與時推移之氣運。真宰與氣運合是謂天命之性。天命之性者，<mark>元神</mark>也。氣質之性者，<b>識神</b>也。故儒家有變化氣質之言，禪宗有返識為智之法。今人妄認方才中有個昭昭靈靈之物，渾然與物同體，便以為<mark>元神</mark>在。是殊不知此即死死生生之本，非不生不滅之<mark>元神</mark>也。噫，識識易，去識難，若不以天命<mark>元神</mark>戰退無明業識。終在生滅場中，未見有出頭日也。", "i": 210}, {"t": "h2", "s": "五气朝元说", "o": "五气朝元说", "i": 211}, {"t": "p", "s": "一气初判而列二仪，二仪定位而分五常，五常异地而各守一方，五方异气而各守一子。青帝之子名龙烟，受甲乙木德之三气。赤帝之子名丹元，受丙丁火德之二气。白帝之子名皓华，受庚辛金德之四气。黑帝之子名玄冥，受壬癸水德之一气。黄帝之子名常存，受<b>戊己</b>土德之五气。故金得土则生，木得土则旺，水得土则止，火得土则息。唯圣人知回几之道、得还元之理。于是攒五簇、四会、三合、二而归一也。盖身不动则精固而水朝元，心不动则气固而火朝元，真性寂则魂藏而木朝元，妄情忘则魄伏而金朝元，四大安和则意定而土朝元。此谓<span class=\"key\">五气朝元</span>，皆聚于顶也。", "o": "一氣初判而列二儀，二儀定位而分五常，五常異地而各守一方，五方異氣而各守一子。青帝之子名龍煙，受甲乙木德之三氣。赤帝之子名丹元，受丙丁火德之二氣。白帝之子名皓華，受庚辛金德之四氣。黑帝之子名玄冥，受壬癸水德之一氣。黃帝之子名常存，受<b>戊己</b>土德之五氣。故金得土則生，木得土則旺，水得土則止，火得土則息。唯聖人知回幾之道、得還元之理。於是攢五簇、四會、三合、二而歸一也。蓋身不動則精固而水朝元，心不動則氣固而火朝元，真性寂則魂藏而木朝元，妄情忘則魄伏而金朝元，四大安和則意定而土朝元。此謂<span class=\"key\">五氣朝元</span>，皆聚於頂也。", "i": 212}, {"t": "h2", "s": "待诏说", "o": "待诏说", "i": 213}, {"t": "p", "s": "九年面壁之后。灵台晶莹，觉海圆明，<b>性命</b>混融，形神俱妙。与天地合德，与太虚同体，此同丹道已成而积功累行不可缺也。盖道之与德犹阴之与阳，行之与功犹日之与足。钟离翁云：有功无行如无足，有行无功目不全。功行两圆足自备，谁云无分作神仙？是以古仙上圣<mark>金丹</mark>事成，温养事毕，游戏人间，和光混俗，随力建功，随方解缚，扶危拯厄，救劫匡时，普渡群迷，接引后学，道上有功，人间有行。功行满足，潜伏俟时，只待天书降诏，玉女来迎，驾雾腾云，直入三清圣境。如张紫阳翁悟真篇云：德行修逾八百，阴功积满三千，宝符降诏去朝天，稳驾琼舆凤辇。", "o": "九年面壁之後。靈台晶瑩，覺海圓明，<b>性命</b>混融，形神俱妙。與天地合德，與太虛同體，此同丹道已成而積功累行不可缺也。蓋道之與德猶陰之與陽，行之與功猶日之與足。鐘離翁云：有功無行如無足，有行無功目不全。功行兩圓足自備，誰雲無分作神仙？是以古仙上聖<mark>金丹</mark>事成，溫養事畢，游戲人間，和光混俗，隨力建功，隨方解縛，扶危拯厄，救劫匡時，普渡群迷，接引後學，道上有功，人間有行。功行滿足，潛伏俟時，只待天書降詔，玉女來迎，駕霧騰雲，直入三清聖境。如張紫陽翁悟真篇云：德行修逾八百，陰功積滿三千，寶符降詔去朝天，穩駕瓊輿鳳輦。", "i": 214}, {"t": "h2", "s": "飞升说", "o": "飞升说", "i": 215}, {"t": "p", "s": "仙有五等，佛有三乘，修持功行不齐，所以超脱稍异。<mark>飞升</mark>冲举者上也，坐化尸解者次也，投胎夺舍者又其次也。乘龙上升者，如黄帝、茅蒙、王玄甫、韦善俊是也。驾云上升者，如杨羲、李笈、蓝采和、孙不二是也。控鲤上升者，如子英、琴高是也。骖鸾上升者，如子晋、邓郁是也。跨鹤上升者，如桓问、屈处静是也。御风上升者，如葛由、武夷君是也。拔宅<mark>飞升</mark>者，如何候、尹喜、淮南王、许旌阳是也。白日冲举者，如蔡琼、冯长、马成子、浮丘伯是也。尝考到仙谱传，始知从古至今成仙者十万余人，拔宅者八千余处。所以纯阳翁于景福寺壁间题一联云：莫道神仙无学处，古今多少上升人。亨集<span class=\"key\">性命双修</span>万神圭旨第一节口诀涵养本原救护命宝（涵养本原图）（内附<mark>退藏沐浴</mark>、<mark>玉液炼形</mark>二法）", "o": "仙有五等，佛有三乘，修持功行不齊，所以超脫稍異。飛升衝舉者上也，坐化尸解者次也，投胎奪舍者又其次也。乘龍上升者，如黃帝、茅蒙、王玄甫、韋善俊是也。駕雲上升者，如楊羲、李笈、藍採和、孫不二是也。控鯉上升者，如子英、琴高是也。驂鸞上升者，如子晉、鄧鬱是也。跨鶴上升者，如桓問、屈處靜是也。御風上升者，如葛由、武夷君是也。拔宅飛升者，如何候、尹喜、淮南王、許旌陽是也。白日衝舉者，如蔡瓊、馮長、馬成子、浮丘伯是也。嘗考到仙譜傳，始知從古至今成仙者十萬餘人，拔宅者八千餘處。所以純陽翁於景福寺壁間題一聯云：莫道神仙無學處，古今多少上升人。亨集<span class=\"key\">性命雙修</span>萬神圭旨第一節口訣涵養本原救護命寶（涵養本原圖）（內附<mark>退藏沐浴</mark>、<mark>玉液煉形</mark>二法）", "i": 216}, {"t": "p", "s": "欲修长生，须识所生之本；欲求不死，当明不死之人。故曰：认得不死人，方才人不死。那不死的人，道家呼为铁汉，释氏唤作金刚，即世人本来妙觉真心是也。", "o": "欲修長生，須識所生之本；欲求不死，當明不死之人。故曰：認得不死人，方才人不死。那不死的人，道家呼為鐵漢，釋氏喚作金剛，即世人本來妙覺真心是也。", "i": 217}, {"t": "p", "s": "此心灵灵不昧、了了常知，其体不生不灭，其相无去无来。究之，于先天地之先，莫知其始；穷之，于后天地之后，莫知其终。高而无上，广不可极；渊而无下，深不可测。<b>乾</b><b>坤</b>依此而覆载，日月依此而照临，虚空依此而宽广，万灵依此而变通。", "o": "此心靈靈不昧、了了常知，其體不生不滅，其相無去無來。究之，於先天地之先，莫知其始；窮之，於後天地之後，莫知其終。高而無上，廣不可極；淵而無下，深不可測。<b>乾</b><b>坤</b>依此而覆載，日月依此而照臨，虛空依此而寬廣，萬靈依此而變通。", "i": 218}, {"t": "p", "s": "三教大圣，教人修道，是修这个；成仙成佛，也是这个；戴角披毛，也是这个。", "o": "三教大聖，教人修道，是修這個；成仙成佛，也是這個；戴角披毛，也是這個。", "i": 219}, {"t": "p", "s": "圣凡二路，由此而分。出生死，再无别途；登涅盘，唯此一法。然世间万汇，未有一物不被无常所吞，独有这个，无生灭可缚，无色相可窥，端端正正，停停当当，分分晓晓的，而人不悟其所本来也。", "o": "聖凡二路，由此而分。出生死，再無別途；登涅盤，唯此一法。然世間萬匯，未有一物不被無常所吞，獨有這個，無生滅可縛，無色相可窺，端端正正，停停當當，分分曉曉的，而人不悟其所本來也。", "i": 220}, {"t": "p", "s": "不悟者何，为有妄心。何为妄心？盖为一切众生从无始已来，迷却真心，不自觉知，故受轮转，枉入诸趣，原夫真心无妄，性智本明，妙湛<mark>元精</mark>。由妄瞥起，俄然晦昧，则失彼<mark>元精</mark>，枯湛发知，故转智为识，形中妄心，名之曰识。", "o": "不悟者何，為有妄心。何為妄心？蓋為一切眾生從無始已來，迷卻真心，不自覺知，故受輪轉，枉入諸趣，原夫真心無妄，性智本明，妙湛<mark>元精</mark>。由妄瞥起，俄然晦昧，則失彼<mark>元精</mark>，枯湛發知，故轉智為識，形中妄心，名之曰識。", "i": 221}, {"t": "p", "s": "心本无知，由识故知；性本无性，由识故生。生身种子，萌孽于兹，开有漏华，结生死果。今人妄认方寸中，有个昭昭灵灵之物，浑然与物同体，便以为<mark>元神</mark>在是。殊不知此即死死生生之<b>识神</b>，劫劫轮回之种子耳。", "o": "心本無知，由識故知；性本無性，由識故生。生身種子，萌孽於茲，開有漏華，結生死果。今人妄認方寸中，有個昭昭靈靈之物，渾然與物同體，便以為<mark>元神</mark>在是。殊不知此即死死生生之<b>識神</b>，劫劫輪回之種子耳。", "i": 222}, {"t": "p", "s": "故景岑云：学道之人不悟真，只为从前认<b>识神</b>，无量劫来生死本，痴人唤作本来人。", "o": "故景岑云：學道之人不悟真，只為從前認<b>識神</b>，無量劫來生死本，癡人喚作本來人。", "i": 223}, {"t": "p", "s": "嗟夫！世人以奴为主而不知，认贼为子而不觉。是以世尊教人：先断无始轮回根本者此也。此根既断，则诸识无依，复我元初常明本体。", "o": "嗟夫！世人以奴為主而不知，認賊為子而不覺。是以世尊教人：先斷無始輪回根本者此也。此根既斷，則諸識無依，複我元初常明本體。", "i": 224}, {"t": "p", "s": "然而大道茫茫，当从何处下手？是以齐襟必举领，整网要提纲。昔尹师指出：修行正路一条。教人打从源头上做起。若源头洁净，天理时时现前，识念自然污染不得。譬如昊日当空，魍魉灭迹，此一心地法门，是古今千圣不易之道。", "o": "然而大道茫茫，當從何處下手？是以齊襟必舉領，整網要提綱。昔尹師指出：修行正路一條。教人打從源頭上做起。若源頭潔淨，天理時時現前，識念自然污染不得。譬如昊日當空，魍魎滅跡，此一心地法門，是古今千聖不易之道。", "i": 225}, {"t": "p", "s": "故老子曰：若夫修道，先观其心。观心之法，妙在灵关一窍。人自受生感气之初，禀天地一点元阳，化生此窍，以藏<mark>元神</mark>。其中空空洞洞。至虚至明，乃吾人生生主宰。真所谓有之则生，无之则死，生死盛衰，皆由这个。", "o": "故老子曰：若夫修道，先觀其心。觀心之法，妙在靈關一竅。人自受生感氣之初，稟天地一點元陽，化生此竅，以藏<mark>元神</mark>。其中空空洞洞。至虛至明，乃吾人生生主宰。真所謂有之則生，無之則死，生死盛衰，皆由這個。", "i": 226}, {"t": "p", "s": "儒曰：灵台。", "o": "儒曰：靈台。", "i": 227}, {"t": "p", "s": "道曰：灵关。", "o": "道曰：靈關。", "i": 228}, {"t": "p", "s": "释曰：灵山。", "o": "釋曰：靈山。", "i": 229}, {"t": "p", "s": "三教同一法门，总不外此灵明一窍。", "o": "三教同一法門，總不外此靈明一竅。", "i": 230}, {"t": "p", "s": "释教曰：佛在灵山莫远求，灵山只在汝心头，人人有个灵山塔，好向灵山塔下修。论其所也。", "o": "釋教曰：佛在靈山莫遠求，靈山只在汝心頭，人人有個靈山塔，好向靈山塔下修。論其所也。", "i": 231}, {"t": "p", "s": "玄教曰：大道根茎识者稀，常人日用孰能知，为君指<mark>出神</mark>仙窟，一窍弯弯似月眉。论其形也。", "o": "玄教曰：大道根莖識者稀，常人日用孰能知，為君指<mark>出神</mark>仙窟，一竅彎彎似月眉。論其形也。", "i": 232}, {"t": "p", "s": "盖此窍乃神灵之台，秘密之府。真净、明妙、虚散、灵通、卓然而独存者也。众生之本原，故曰心地。诸佛之所得，故曰菩提。交彻融融，故曰法界，寂静常乐，故曰涅盘。不浊不漏，故曰清净。不妄不变，故曰真如。离过绝非，故曰佛性。护善遮恶，故曰总持。隐覆含摄，故曰如来藏。超越玄秘，故曰密严国。统众德而大备，烁群昏而独照，故曰圆觉。其实皆一窍也。背之则凡，顺之则圣。迷之则生死始，悟之则轮回息。", "o": "蓋此竅乃神靈之台，秘密之府。真淨、明妙、虛散、靈通、卓然而獨存者也。眾生之本原，故曰心地。諸佛之所得，故曰菩提。交徹融融，故曰法界，寂靜常樂，故曰涅盤。不濁不漏，故曰清淨。不妄不變，故曰真如。離過絕非，故曰佛性。護善遮惡，故曰總持。隱覆含攝，故曰如來藏。超越玄秘，故曰密嚴國。統眾德而大備，爍群昏而獨照，故曰圓覺。其實皆一竅也。背之則凡，順之則聖。迷之則生死始，悟之則輪回息。", "i": 233}, {"t": "p", "s": "欲息轮回，莫若体乎至道。欲体至道，莫若观照本心。应须音眼虚鉴，常教朗月辉明，每向定中慧照。时时保得此七情未发之中，时时全得此八识未染之体。外息诸缘，内绝诸妄。含眼光，凝耳韵，调鼻息，缄舌气，四肢不动，使眼耳鼻舌身之五识，各返其根，则精神魂魄意之五灵各安其位。", "o": "欲息輪回，莫若體乎至道。欲體至道，莫若觀照本心。應須音眼虛鑒，常教朗月輝明，每向定中慧照。時時保得此七情未發之中，時時全得此八識未染之體。外息諸緣，內絕諸妄。含眼光，凝耳韻，調鼻息，緘舌氣，四肢不動，使眼耳鼻舌身之五識，各返其根，則精神魂魄意之五靈各安其位。", "i": 234}, {"t": "p", "s": "二六时中，眼常要内观此窍，耳常要逆听此窍，至于舌准常要对著此窍，运用施为念念不离此窍，行住坐卧心心常在此窍。不可刹那忘照，率尔相违，神光一出便收来，造次弗离常在此。即子思所谓不可须臾离者是也。", "o": "二六時中，眼常要內觀此竅，耳常要逆聽此竅，至於舌准常要對著此竅，運用施為念念不離此竅，行住坐臥心心常在此竅。不可剎那忘照，率爾相違，神光一出便收來，造次弗離常在此。即子思所謂不可須臾離者是也。", "i": 235}, {"t": "p", "s": "先存之以虚其心，次忘之以廓其量，随处随时，无碍自在，正合<b>龙虎</b>经云：至妙之要，先存后忘。此又口诀中之口诀也。", "o": "先存之以虛其心，次忘之以廓其量，隨處隨時，無礙自在，正合<b>龍虎</b>經云：至妙之要，先存後忘。此又口訣中之口訣也。", "i": 236}, {"t": "p", "s": "然要进除六识，尤在知所先后。意虽为六识之主帅，眼实为五贼之先锋。故古德云：心是枢机，目为盗贼。欲伏其心，先摄其目。盖弩之发动在机，心之缘引在目。机不动则弩住，目不动则心住。", "o": "然要進除六識，尤在知所先後。意雖為六識之主帥，眼實為五賊之先鋒。故古德云：心是樞機，目為盜賊。欲伏其心，先攝其目。蓋弩之發動在機，心之緣引在目。機不動則弩住，目不動則心住。", "i": 237}, {"t": "p", "s": "阴符经曰：机在目。", "o": "陰符經曰：機在目。", "i": 238}, {"t": "p", "s": "道德经曰：不见可欲，而心不乱。", "o": "道德經曰：不見可欲，而心不亂。", "i": 239}, {"t": "p", "s": "鲁论曰：非礼勿视。", "o": "魯論曰：非禮勿視。", "i": 240}, {"t": "note", "s": "口诀引证：朱子曰：制于外所以养其中也。", "o": "口诀引证：朱子曰：制於外所以養其中也。", "i": 241}, {"t": "p", "s": "金笥宝箓曰：眼乃神通玄牝门，抑之于眼使归心。", "o": "金笥寶籙曰：眼乃神通玄牝門，抑之於眼使歸心。", "i": 242}, {"t": "p", "s": "眼守此窍不离，即如来正法眼，合涅盘心之秘旨，故楞严经云：作是观者，名为正观；若他观者，名为邪观。", "o": "眼守此竅不離，即如來正法眼，合涅盤心之秘旨，故楞嚴經云：作是觀者，名為正觀；若他觀者，名為邪觀。", "i": 243}, {"t": "p", "s": "又观经观心品云：三界之中，以心为主。能观心者，究竟解脱；不能观者，毕竟沉沦。", "o": "又觀經觀心品云：三界之中，以心為主。能觀心者，究竟解脫；不能觀者，畢竟沉淪。", "i": 244}, {"t": "p", "s": "道德首章云：常有欲以观其侥者，观此窍也。常无欲以观其妙者，观此窍中之妙也。", "o": "道德首章云：常有欲以觀其僥者，觀此竅也。常無欲以觀其妙者，觀此竅中之妙也。", "i": 245}, {"t": "p", "s": "昔黄帝三月内观者，观此也。", "o": "昔黃帝三月內觀者，觀此也。", "i": 246}, {"t": "note", "s": "口诀引证：太上亦曰：吾从无量劫来，观心得道，乃至虚无。", "o": "口诀引证：太上亦曰：吾從無量劫來，觀心得道，乃至虛無。", "i": 247}, {"t": "p", "s": "观心非易，止念尤难。是以念头起处，系人生死之根。", "o": "觀心非易，止念尤難。是以念頭起處，系人生死之根。", "i": 248}, {"t": "p", "s": "古仙云：大道教人先止念，念头不住亦徒然。", "o": "古仙云：大道教人先止念，念頭不住亦徒然。", "i": 249}, {"t": "p", "s": "圆觉经云：居一切时，不起妄念于诸妄心，亦不息灭住妄想境。不加了知于无了知，不辨真实。", "o": "圓覺經云：居一切時，不起妄念於諸妄心，亦不息滅住妄想境。不加了知於無了知，不辨真實。", "i": 250}, {"t": "p", "s": "起信论云：心若驰散，即便摄来，令往正念，念起即觉，觉之即无，修行妙门，唯在于此。", "o": "起信論云：心若馳散，即便攝來，令往正念，念起即覺，覺之即無，修行妙門，唯在於此。", "i": 251}, {"t": "p", "s": "虚靖天师云：不怕念起，只怕觉迟，念起是病，不续是药。", "o": "虛靖天師云：不怕念起，只怕覺遲，念起是病，不續是藥。", "i": 252}, {"t": "p", "s": "当知妄念起于识根，对境成妄，实非有体。在众生时，智劣识强，但名为识。当佛地时，智强识劣，但名为智。只转其名，不转其体。初一心源廓然妙湛，由知见立知，妄尘生起，故有妄念。若知见无见，则智性真净，复还妙湛，洞彻精了，而意念消。", "o": "當知妄念起於識根，對境成妄，實非有體。在眾生時，智劣識強，但名為識。當佛地時，智強識劣，但名為智。只轉其名，不轉其體。初一心源廓然妙湛，由知見立知，妄塵生起，故有妄念。若知見無見，則智性真淨，複還妙湛，洞徹精了，而意念消。", "i": 253}, {"t": "p", "s": "意念既消，自六识而下莫不皆消。即文殊所谓一根既返元，六根成解脱。既无六根，则无六尘e既无六尘，则无六识。既无六识，则无轮回种子。既无轮回种子，则我一点真心独立无依，空空荡荡，光光净净，而万劫常存，永不生灭矣。", "o": "意念既消，自六識而下莫不皆消。即文殊所謂一根既返元，六根成解脫。既無六根，則無六塵e既無六塵，則無六識。既無六識，則無輪回種子。既無輪回種子，則我一點真心獨立無依，空空蕩蕩，光光淨淨，而萬劫常存，永不生滅矣。", "i": 254}, {"t": "p", "s": "此法直指人心，一了百当。何等直截，何等简易。但能培养本原，观照本窍，久则油然心新，浩然气畅，凝然不动，寂然无思，豁然知空，了然悟性。此所谓皮肤剥落尽，一真将次见矣。", "o": "此法直指人心，一了百當。何等直截，何等簡易。但能培養本原，觀照本竅，久則油然心新，浩然氣暢，凝然不動，寂然無思，豁然知空，了然悟性。此所謂皮膚剝落盡，一真將次見矣。", "i": 255}, {"t": "p", "s": "工夫至此，自然精神朗发，智慧日生，心性灵通，隐显自在。自然有一段清静阖辟之机，自然有一段飞跃活动之趣。自然有一点元阳真炁从中而出，降黄庭，入土釜，贯尾闾，穿夹脊，上冲天谷，下达曲江，流通百脉，灌溉三田，驱逐一身百窍之阴邪，涤荡五脏六腑之浊秽。如服善见王之药，众病咸消。若奏狮子筋之弦，群音顿绝。所以云：一心疗万病，不假药方多。", "o": "工夫至此，自然精神朗發，智慧日生，心性靈通，隱顯自在。自然有一段清靜闔闢之機，自然有一段飛躍活動之趣。自然有一點元陽真炁從中而出，降黃庭，入土釜，貫尾閭，穿夾脊，上衝天谷，下達曲江，流通百脈，灌溉三田，驅逐一身百竅之陰邪，滌蕩五臟六腑之濁穢。如服善見王之藥，眾病咸消。若奏獅子筋之弦，群音頓絕。所以云：一心療萬病，不假藥方多。", "i": 256}, {"t": "p", "s": "是知一切诸圣，皆从此心方便门入，得成祖佛，为人天之师。凡夫不能证者，由不识自心故。故曰：海枯终见底，人死不知心。六道群蒙皆此门出，历千劫而不返，一何痛哉。", "o": "是知一切諸聖，皆從此心方便門入，得成祖佛，為人天之師。凡夫不能証者，由不識自心故。故曰：海枯終見底，人死不知心。六道群蒙皆此門出，歷千劫而不返，一何痛哉。", "i": 257}, {"t": "p", "s": "所以诸怫惊入火宅，祖师特地西来，乃至千圣悲嗟，皆为不达唯心出要道耳。", "o": "所以諸怫驚入火宅，祖師特地西來，乃至千聖悲嗟，皆為不達唯心出要道耳。", "i": 258}, {"t": "p", "s": "如宝藏论云：夫天地之内，宇宙之间，中有一宝，秘在形山，识物灵照，内外空然，寂寞难见，其谓玄玄。巧出于紫微之表，用在于虚无之间。端化不动，独而无双。声出妙响，色吐华容。穷睹无所，寄号空空。唯留其声，不见其形。唯留其功，不见其容。幽明朗照，物理虚通。森罗宝印，万象真宗。其为也形，其寂也冥。本净非莹，法尔圆成。光照日月，德越太清。万物无作，一切无名。转变天地，自在纵横。恒沙妙用，混沌而成。谁闻不喜，谁闻不惊。如何以无价之宝，隐于阴人之坑。哀哉！哀哉！其为自轻。悲哉！悲哉！晦何由明？其宝也焕焕煌煌，朗照十方，间寂无物，应用堂堂。应声应色，应阴应阳。奇物无根，妙用常存。瞬目不见，侧耳不闻。其本也冥，其化也形。其为也圣，其用也灵。可为大道之真精，其精甚灵，万有之因。凝然常住，与道同伦。", "o": "如寶藏論云：夫天地之內，宇宙之間，中有一寶，秘在形山，識物靈照，內外空然，寂寞難見，其謂玄玄。巧出於紫微之表，用在於虛無之間。端化不動，獨而無雙。聲出妙響，色吐華容。窮睹無所，寄號空空。唯留其聲，不見其形。唯留其功，不見其容。幽明朗照，物理虛通。森羅寶印，萬象真宗。其為也形，其寂也冥。本淨非瑩，法爾圓成。光照日月，德越太清。萬物無作，一切無名。轉變天地，自在縱橫。恆沙妙用，混沌而成。誰聞不喜，誰聞不驚。如何以無價之寶，隱於陰人之坑。哀哉！哀哉！其為自輕。悲哉！悲哉！晦何由明？其寶也煥煥煌煌，朗照十方，間寂無物，應用堂堂。應聲應色，應陰應陽。奇物無根，妙用常存。瞬目不見，側耳不聞。其本也冥，其化也形。其為也聖，其用也靈。可為大道之真精，其精甚靈，萬有之因。凝然常住，與道同倫。", "i": 259}, {"t": "p", "s": "天下最亲，莫过心也。百姓之用，而不知心；如鱼在海，而不知水。故佛经云：一切众生，从旷劫来，迷列本心，不自觉悟。妄认四大为身、缘虑为心。譬如百千大海不认，但认一小浮沤。以此迷中复迷，妄中起妄，随境流转，离目生情。取十万端，无时暂暇。至使起惑造业，循环六道，密网自围，不能得出。究竟冥初皆一妄迷真之咎耳。", "o": "天下最親，莫過心也。百姓之用，而不知心；如魚在海，而不知水。故佛經云：一切眾生，從曠劫來，迷列本心，不自覺悟。妄認四大為身、緣慮為心。譬如百千大海不認，但認一小浮漚。以此迷中複迷，妄中起妄，隨境流轉，離目生情。取十萬端，無時暫暇。至使起惑造業，循環六道，密網自圍，不能得出。究竟冥初皆一妄迷真之咎耳。", "i": 260}, {"t": "p", "s": "故灵润曰：妄情牵引何时了，辜负灵台一点光。夫灵台一点光者，即真如灵知心也。最玄最妙，通圣通灵。极高明，极广大。化万法之王，为群有之体。坚彻三界，横亘十方。自混饨未辟之前，而已曾有。虽天地既坏以后，而未尝无。一切境界，皆是心光。若人识得心，大地无寸土。故曰：三界唯心。", "o": "故靈潤曰：妄情牽引何時了，辜負靈台一點光。夫靈台一點光者，即真如靈知心也。最玄最妙，通聖通靈。極高明，極廣大。化萬法之王，為群有之體。堅徹三界，橫亙十方。自混飩未闢之前，而已曾有。雖天地既壞以後，而未嘗無。一切境界，皆是心光。若人識得心，大地無寸土。故曰：三界唯心。", "i": 261}, {"t": "p", "s": "迷人心外求法，至人见境是心。境即是心之境，心即是境之心。对境不迷，逢缘不动，能所互成，一体无异。若能达境，唯心便是。悟心成道，觉尽无始，妄念摄境归心，出缠真如，离垢解脱，永合清净本然，则不更生山河大地诸有为相。如金出矿，终不更染尘泥；似木成灰，岂有再生枝木。一得永得，尽未来际，永脱樊笼，长居圣域矣。", "o": "迷人心外求法，至人見境是心。境即是心之境，心即是境之心。對境不迷，逢緣不動，能所互成，一體無異。若能達境，唯心便是。悟心成道，覺盡無始，妄念攝境歸心，出纏真如，離垢解脫，永合清淨本然，則不更生山河大地諸有為相。如金出礦，終不更染塵泥；似木成灰，豈有再生枝木。一得永得，盡未來際，永脫樊籠，長居聖域矣。", "i": 262}, {"t": "p", "s": "虽然，此最上一乘大道，若根器利者，一超直入如来地。若根器钝者，将如之何？必由下学而上达的功夫，渐次引入法门可也。使之行一步，自有一步效验，升一级，自有一级规模。亦是行远自迩，登高自卑之意。", "o": "雖然，此最上一乘大道，若根器利者，一超直入如來地。若根器鈍者，將如之何？必由下學而上達的功夫，漸次引入法門可也。使之行一步，自有一步效驗，升一級，自有一級規模。亦是行遠自邇，登高自卑之意。", "i": 263}, {"t": "p", "s": "若不知入门下手功夫，安能遽到了手极则地位？若未能尽心，而安能知性？未能明心，而安能见性？夫明心尽心之要者，时以善法扶助自心，时以赤水润泽自心，时以境界净治自心，时以精进坚固自心，时以忍辱坦荡自心，时以觉照洁白自心，时以智慧明利自心，时以佛知见开发自心，时以佛平等广大自心。", "o": "若不知入門下手功夫，安能遽到了手極則地位？若未能盡心，而安能知性？未能明心，而安能見性？夫明心盡心之要者，時以善法扶助自心，時以赤水潤澤自心，時以境界淨治自心，時以精進堅固自心，時以忍辱坦蕩自心，時以覺照潔白自心，時以智慧明利自心，時以佛知見開發自心，時以佛平等廣大自心。", "i": 264}, {"t": "p", "s": "故知明心是生死海中之智楫，尽心是烦恼病中之良医。若昧此心，则永劫轮回而遗失真性；若明此心，则顿起生死而圆证涅盘。始终不出此心，离此心别无玄妙矣。后面虽有次第工夫，不过是成就这个而已。", "o": "故知明心是生死海中之智楫，盡心是煩惱病中之良醫。若昧此心，則永劫輪回而遺失真性；若明此心，則頓起生死而圓証涅盤。始終不出此心，離此心別無玄妙矣。後面雖有次第工夫，不過是成就這個而已。", "i": 265}, {"t": "p", "s": "噫！莫看易了，至人难遇，口诀难闻。故张平叔云：只为丹经无口诀，教君何处结灵胎？殊不知经中口诀自载，大都秘母言子，不肯分开说破，使人凑泊不来。况多为譬辞隐语，使学者眩目惑心，以致中途退步。余甚悯之，今将丹经梵典中之口诀，—一指出，留与后人，为破昏黑的照路灯，辨真伪的试金石。", "o": "噫！莫看易了，至人難遇，口訣難聞。故張平叔云：只為丹經無口訣，教君何處結靈胎？殊不知經中口訣自載，大都秘母言子，不肯分開說破，使人湊泊不來。況多為譬辭隱語，使學者眩目惑心，以致中途退步。余甚憫之，今將丹經梵典中之口訣，—一指出，留與後人，為破昏黑的照路燈，辨真偽的試金石。", "i": 266}, {"t": "p", "s": "太玄真人云：", "o": "太玄真人云：", "i": 267}, {"t": "p", "s": "父母生前一点灵，不灵只为结成形。成形罩却光明种，放下依然彻底清。", "o": "父母生前一點靈，不靈只為結成形。成形罩卻光明種，放下依然徹底清。", "i": 268}, {"t": "p", "s": "空照禅师云：", "o": "空照禪師云：", "i": 269}, {"t": "p", "s": "这个分明个个同，能包天地运虚空。我今直指真心地，空寂灵知是本宗。", "o": "這個分明個個同，能包天地運虛空。我今直指真心地，空寂靈知是本宗。", "i": 270}, {"t": "p", "s": "自然居士云：", "o": "自然居士云：", "i": 271}, {"t": "p", "s": "心如明镜连天净，性似寒潭止水同。十二时中常觉照，休教昧了主人翁。", "o": "心如明鏡連天淨，性似寒潭止水同。十二時中常覺照，休教昧了主人翁。", "i": 272}, {"t": "p", "s": "智觉禅师云：", "o": "智覺禪師云：", "i": 273}, {"t": "p", "s": "菩萨从来不离真，自家昧了不相亲。若能静坐回光照，便见生前旧主人。", "o": "菩薩從來不離真，自家昧了不相親。若能靜坐回光照，便見生前舊主人。", "i": 274}, {"t": "p", "s": "三茅真君云：", "o": "三茅真君云：", "i": 275}, {"t": "p", "s": "灵台湛湛似冰壶，只许<mark>元神</mark>在里居。若向此中留一物，岂能证道合清虚？", "o": "靈台湛湛似冰壺，只許<mark>元神</mark>在裏居。若向此中留一物，豈能証道合清虛？", "i": 276}, {"t": "p", "s": "天然禅师云：", "o": "天然禪師云：", "i": 277}, {"t": "p", "s": "心本绝尘何用洗，身中无病岂求医。欲知是佛非身处，明鉴高悬未照时。", "o": "心本絕塵何用洗，身中無病豈求醫。欲知是佛非身處，明鑒高懸未照時。", "i": 278}, {"t": "p", "s": "主敬道人云：", "o": "主敬道人云：", "i": 279}, {"t": "p", "s": "未发之前心是性，已发之后性是必。心性源头参不透，空从往迹费搜寻。", "o": "未發之前心是性，已發之後性是必。心性源頭參不透，空從往跡費搜尋。", "i": 280}, {"t": "p", "s": "无心其人云：", "o": "無心其人云：", "i": 281}, {"t": "p", "s": "妄念才兴神加迁，神过六贼乱心田。心目既乱身无主，六道轮回在目前。", "o": "妄念才興神加遷，神過六賊亂心田。心目既亂身無主，六道輪回在目前。", "i": 282}, {"t": "p", "s": "高僧妙虚云：", "o": "高僧妙虛云：", "i": 283}, {"t": "p", "s": "惺惺一个主人翁，寂然不动在灵宫。但将此中无持碍，天然本体自虚空。", "o": "惺惺一個主人翁，寂然不動在靈宮。但將此中無持礙，天然本體自虛空。", "i": 284}, {"t": "p", "s": "太乙真人云：", "o": "太乙真人云：", "i": 285}, {"t": "p", "s": "一点圆明等太虚，只因念起结成躯。若能放下回光照，依旧清虚一物无。", "o": "一點圓明等太虛，只因念起結成軀。若能放下回光照，依舊清虛一物無。", "i": 286}, {"t": "p", "s": "华严经颂云；", "o": "華嚴經頌云；", "i": 287}, {"t": "p", "s": "有数无数一切劫，菩萨了知即已念。于此善入菩提行，常勤修习不退转。", "o": "有數無數一切劫，菩薩了知即已念。於此善入菩提行，常勤修習不退轉。", "i": 288}, {"t": "p", "s": "海月禅师云：", "o": "海月禪師云：", "i": 289}, {"t": "p", "s": "六个门头一个关，五门不必更遮栏。从他世事纷纷乱，堂上家尊镇日安。", "o": "六個門頭一個關，五門不必更遮欄。從他世事紛紛亂，堂上家尊鎮日安。", "i": 290}, {"t": "p", "s": "水庵禅师云：", "o": "水庵禪師云：", "i": 291}, {"t": "p", "s": "不起一念须弥山，待立当头著眼看。牛一缕丝轻绊倒，家家门底透长安。", "o": "不起一念須彌山，待立當頭著眼看。牛一縷絲輕絆倒，家家門底透長安。", "i": 292}, {"t": "p", "s": "大沩智颂云：", "o": "大溈智頌云：", "i": 293}, {"t": "p", "s": "真佛无为在我身，三呼三应太惺惺。若人不悟原由者，生劫茫茫认<b>识神</b>。", "o": "真佛無為在我身，三呼三應太惺惺。若人不悟原由者，生劫茫茫認<b>識神</b>。", "i": 294}, {"t": "p", "s": "无垢子谒云：", "o": "無垢子謁云：", "i": 295}, {"t": "p", "s": "五蕴山头一段空，同门出入不相逢。无量劫来赁屋住，到头不识主人翁。", "o": "五蘊山頭一段空，同門出入不相逢。無量劫來賃屋住，到頭不識主人翁。", "i": 296}, {"t": "p", "s": "唯宽禅师云：", "o": "唯寬禪師云：", "i": 297}, {"t": "p", "s": "劝君学道莫贪求，万事无心道合头。无心始体无心道，体得无心道也休。", "o": "勸君學道莫貪求，萬事無心道合頭。無心始體無心道，體得無心道也休。", "i": 298}, {"t": "p", "s": "志公和尚云：", "o": "志公和尚云：", "i": 299}, {"t": "p", "s": "顿悟心原开宝藏，隐显灵踪现真象。独行独坐常巍巍，百亿化身无数量。", "o": "頓悟心原開寶藏，隱顯靈蹤現真象。獨行獨坐常巍巍，百億化身無數量。", "i": 300}, {"t": "p", "s": "呆堂禅师云：", "o": "呆堂禪師云：", "i": 301}, {"t": "p", "s": "应无所住生其心，廓彻圆明处处真。直下顶门开正眼，大千沙界现全身。", "o": "應無所住生其心，廓徹圓明處處真。直下頂門開正眼，大千沙界現全身。", "i": 302}, {"t": "p", "s": "指玄篇云：", "o": "指玄篇云：", "i": 303}, {"t": "p", "s": "若得心空若便无，有何生死有何拘。一朝脱下胎州袄，作个逍遥大丈夫。", "o": "若得心空若便無，有何生死有何拘。一朝脫下胎州襖，作個逍遙大丈夫。", "i": 304}, {"t": "p", "s": "段真人云：", "o": "段真人云：", "i": 305}, {"t": "p", "s": "心内观心觅本心，心心俱绝见真心。真心明彻通三界，外道天魔不敢侵。", "o": "心內觀心覓本心，心心俱絕見真心。真心明徹通三界，外道天魔不敢侵。", "i": 306}, {"t": "p", "s": "张远霄云：", "o": "張遠霄云：", "i": 307}, {"t": "p", "s": "不生不灭本来真，无价夜光人不识。凡夫虚度几千生，杂在矿中不能出。", "o": "不生不滅本來真，無價夜光人不識。凡夫虛度幾千生，雜在礦中不能出。", "i": 308}, {"t": "p", "s": "薛道光云：", "o": "薛道光云：", "i": 309}, {"t": "p", "s": "妙诀五千称道德，真诠三百颂阴符。但得心中无一字，不参禅亦是工夫。", "o": "妙訣五千稱道德，真詮三百頌陰符。但得心中無一字，不參禪亦是工夫。", "i": 310}, {"t": "p", "s": "无垢子云：", "o": "無垢子云：", "i": 311}, {"t": "p", "s": "学道先领识自心，自心深处最难寻。若还寻到无寻处，方悟凡心即佛心。", "o": "學道先領識自心，自心深處最難尋。若還尋到無尋處，方悟凡心即佛心。", "i": 312}, {"t": "p", "s": "逍遥翁云：", "o": "逍遙翁云：", "i": 313}, {"t": "p", "s": "扫除六贼净心基，荣辱悲欢事勿追。专炁至柔窥内景，自然神室产牟尼。", "o": "掃除六賊淨心基，榮辱悲歡事勿追。專炁至柔窺內景，自然神室產牟尼。", "i": 314}, {"t": "p", "s": "弄丸集云：", "o": "弄丸集云：", "i": 315}, {"t": "p", "s": "天机奥妙难轻吐，颜氏如愚曾氏鲁。问渠何处用工夫，只在不闻与不睹。", "o": "天機奧妙難輕吐，顏氏如愚曾氏魯。問渠何處用工夫，只在不聞與不睹。", "i": 316}, {"t": "p", "s": "张三峰云：", "o": "張三峰云：", "i": 317}, {"t": "p", "s": "真心浩浩无穷极，无限神仙从里出。世人耽著小形骸，一颗玄珠迷不识。", "o": "真心浩浩無窮極，無限神仙從裡出。世人耽著小形骸，一顆玄珠迷不識。", "i": 318}, {"t": "p", "s": "解迷歌云：", "o": "解迷歌云：", "i": 319}, {"t": "p", "s": "若要真精无漏泄，须净灵台如朗月。灵台不净神不请，昼夜工夫休断绝。", "o": "若要真精無漏洩，須淨靈台如朗月。靈台不淨神不請，晝夜工夫休斷絕。", "i": 320}, {"t": "p", "s": "北塔祚云：", "o": "北塔祚云：", "i": 321}, {"t": "p", "s": "切忌随他不会他，大随此语播天涯。真净性中方一念，早是千差与万差。", "o": "切忌隨他不會他，大隨此語播天涯。真淨性中方一念，早是千差與萬差。", "i": 322}, {"t": "p", "s": "横川拱云：", "o": "橫川拱云：", "i": 323}, {"t": "p", "s": "洞水无缘会逆流，见他苦切故相救。西来祖意定无意，妄想狂心歇便休。", "o": "洞水無緣會逆流，見他苦切故相救。西來祖意定無意，妄想狂心歇便休。", "i": 324}, {"t": "p", "s": "草堂禅师云：", "o": "草堂禪師云：", "i": 325}, {"t": "p", "s": "断臂觅心心不得，觅心不得始安心。心安后夜雪庭际，满目瑶花无处寻。", "o": "斷臂覓心心不得，覓心不得始安心。心安後夜雪庭際，滿目瑤花無處尋。", "i": 326}, {"t": "p", "s": "佛国禅师云：", "o": "佛國禪師云：", "i": 327}, {"t": "p", "s": "心心即佛佛心心，佛佛心心即佛心。心佛悟来无一物，将军止渴望梅林。", "o": "心心即佛佛心心，佛佛心心即佛心。心佛悟來無一物，將軍止渴望梅林。", "i": 328}, {"t": "p", "s": "华严经偈云：", "o": "華嚴經偈云：", "i": 329}, {"t": "p", "s": "若人欲识佛境界，当净其意即虚空。远离妄想及诸取，令心所向皆无碍。", "o": "若人欲識佛境界，當淨其意即虛空。遠離妄想及諸取，令心所向皆無礙。", "i": 330}, {"t": "p", "s": "宝积经颂云：", "o": "寶積經頌云：", "i": 331}, {"t": "p", "s": "诸佛从心得解说，心者清净名无垢。五道鲜洁不受染，有解此看成大道。", "o": "諸佛從心得解說，心者清淨名無垢。五道鮮潔不受染，有解此看成大道。", "i": 332}, {"t": "p", "s": "圆悟禅师云：", "o": "圓悟禪師云：", "i": 333}, {"t": "p", "s": "佛佛道同同互道，心心真契契真心。廓然透出威音外，地久天长海更深。", "o": "佛佛道同同互道，心心真契契真心。廓然透出威音外，地久天長海更深。", "i": 334}, {"t": "p", "s": "世奇首座云：", "o": "世奇首座云：", "i": 335}, {"t": "p", "s": "诸法空故我心空，我心空故诸法同。诸法我心无别体，只在而今一念中。", "o": "諸法空故我心空，我心空故諸法同。諸法我心無別體，只在而今一念中。", "i": 336}, {"t": "p", "s": "张拙秀才云：", "o": "張拙秀才云：", "i": 337}, {"t": "p", "s": "光明寂煦遍河沙，凡圣原来共一家。一念不生全体现，六根才动被云遮。", "o": "光明寂煦遍河沙，凡聖原來共一家。一念不生全體現，六根才動被雲遮。", "i": 338}, {"t": "p", "s": "中峰禅师云：", "o": "中峰禪師云：", "i": 339}, {"t": "p", "s": "从来至道与心亲，学到无心道即真。心道有无俱泯绝，大千世界一闲身。", "o": "從來至道與心親，學到無心道即真。心道有無俱泯絕，大千世界一閒身。", "i": 340}, {"t": "p", "s": "张无梦云：", "o": "張無夢云：", "i": 341}, {"t": "p", "s": "心在灵关身有主，气归元海寿无穷。", "o": "心在靈關身有主，氣歸元海壽無窮。", "i": 342}, {"t": "p", "s": "白沙先生云：", "o": "白沙先生云：", "i": 343}, {"t": "p", "s": "千修千处得，一念一生持。", "o": "千修千處得，一念一生持。", "i": 344}, {"t": "p", "s": "彭鹤林云：", "o": "彭鶴林云：", "i": 345}, {"t": "p", "s": "神室即是此灵合，中有长生不死胎。", "o": "神室即是此靈合，中有長生不死胎。", "i": 346}, {"t": "p", "s": "永明延寿云：", "o": "永明延壽云：", "i": 347}, {"t": "p", "s": "有念即生死，无念即泥洹。", "o": "有念即生死，無念即泥洹。", "i": 348}, {"t": "p", "s": "胡敬斋云：", "o": "胡敬齋云：", "i": 349}, {"t": "p", "s": "无事时不教心空，有事时不教心乱。", "o": "無事時不教心空，有事時不教心亂。", "i": 350}, {"t": "p", "s": "道玄居士云：", "o": "道玄居士云：", "i": 351}, {"t": "p", "s": "一出便收来，既归须放下。", "o": "一出便收來，既歸須放下。", "i": 352}, {"t": "p", "s": "罗念庵云：", "o": "羅念庵云：", "i": 353}, {"t": "p", "s": "毋以妄念伐其心，母以客气伤<mark>元气</mark>。", "o": "毋以妄念伐其心，母以客氣傷<mark>元氣</mark>。", "i": 354}, {"t": "p", "s": "莎衣道人云：", "o": "莎衣道人云：", "i": 355}, {"t": "p", "s": "心若在腔子里，念不出总持门。", "o": "心若在腔子里，念不出總持門。", "i": 356}, {"t": "p", "s": "白乐天云：", "o": "白樂天云：", "i": 357}, {"t": "p", "s": "自从苦学空门法，消尽平生种种心。", "o": "自從苦學空門法，消盡平生種種心。", "i": 358}, {"t": "p", "s": "海业禅师云：", "o": "海業禪師云：", "i": 359}, {"t": "p", "s": "动不忘于观照，静不忘于止息。", "o": "動不忘於觀照，靜不忘於止息。", "i": 360}, {"t": "p", "s": "韬光集云：", "o": "韜光集云：", "i": 361}, {"t": "p", "s": "心在是念亦在是，动如斯静也如斯。", "o": "心在是念亦在是，動如斯靜也如斯。", "i": 362}, {"t": "p", "s": "冲妙云：", "o": "衝妙云：", "i": 363}, {"t": "p", "s": "身不动而心自安，心不动而神自守。", "o": "身不動而心自安，心不動而神自守。", "i": 364}, {"t": "p", "s": "徐无极云：", "o": "徐無極云：", "i": 365}, {"t": "p", "s": "性从偏处克将去，心自放时收拾来。", "o": "性從偏處克將去，心自放時收拾來。", "i": 366}, {"t": "p", "s": "佛印云：", "o": "佛印云：", "i": 367}, {"t": "p", "s": "一念动时皆是火，万缘寂处即生春。", "o": "一念動時皆是火，萬緣寂處即生春。", "i": 368}, {"t": "p", "s": "陶宏景云：", "o": "陶宏景云：", "i": 369}, {"t": "p", "s": "修心要作长生客，炼性当如活死人。", "o": "修心要作長生客，煉性當如活死人。", "i": 370}, {"t": "p", "s": "无著禅师云：", "o": "無著禪師云：", "i": 371}, {"t": "p", "s": "明即明心空寂，见即见性无生。", "o": "明即明心空寂，見即見性無生。", "i": 372}, {"t": "p", "s": "华严经云：", "o": "華嚴經云：", "i": 373}, {"t": "p", "s": "若能谛观心不二，方见毗卢清净身。", "o": "若能諦觀心不二，方見毗盧清淨身。", "i": 374}, {"t": "p", "s": "华严颂云：", "o": "華嚴頌云：", "i": 375}, {"t": "p", "s": "始从一念终成劫，悉依众生心想生。", "o": "始從一念終成劫，悉依眾生心想生。", "i": 376}, {"t": "p", "s": "马丹阳云：", "o": "馬丹陽云：", "i": 377}, {"t": "p", "s": "若能长守弯弯窍，神自灵明气自充。", "o": "若能長守彎彎竅，神自靈明氣自充。", "i": 378}, {"t": "p", "s": "丘长春云：", "o": "丘長春云：", "i": 379}, {"t": "p", "s": "当时一句师边得，默默垂帘仔细看。", "o": "當時一句師邊得，默默垂簾仔細看。", "i": 380}, {"t": "p", "s": "慧日禅师云：", "o": "慧日禪師云：", "i": 381}, {"t": "p", "s": "一念照了一念之善提也，一念晏息一会之涅盘也。", "o": "一念照了一念之善提也，一念晏息一會之涅盤也。", "i": 382}, {"t": "p", "s": "以上数语，皆成仙作圣之要、八道八德之门也。首阿难多闻总持积岁不登圣果，息缘返照，暂时即证无生。盖凡夫之心，终日趋外，愈远愈背。唯返照者，检清摄念，摄念安心，安心养神，养神归性。即魏伯阳所谓金来归性初，乃得称还丹是也。咦！炼矿成金得宝珍，炼情归性合天真。相逢此理，交谈者千万人中无一人。", "o": "以上數語，皆成仙作聖之要、八道八德之門也。首阿難多聞總持積歲不登聖果，息緣返照，暫時即証無生。蓋凡夫之心，終日趨外，愈遠愈背。唯返照者，檢清攝念，攝念安心，安心養神，養神歸性。即魏伯陽所謂金來歸性初，乃得稱還丹是也。咦！煉礦成金得寶珍，煉情歸性合天真。相逢此理，交談者千萬人中無一人。", "i": 383}, {"t": "h2", "s": "退藏沐浴工夫", "o": "退藏沐浴工夫", "i": 384}, {"t": "p", "s": "易之洗心退藏于密这句话头，唐宋神仙谓之沐浴，近代诸人标为艮背，总只是这个道理，这个窍妙。原夫心属乎火，而藏之以背之水者，洗之之义也，心居乎前，而藏之以背之后者，退之之义也。", "o": "易之洗心退藏於密這句話頭，唐宋神仙謂之沐浴，近代諸人標為艮背，總只是這個道理，這個竅妙。原夫心屬乎火，而藏之以背之水者，洗之之義也，心居乎前，而藏之以背之後者，退之之義也。", "i": 385}, {"t": "p", "s": "故初机之士，降伏其心，束之太紧，未免有烦燥火炎之患，是以暂将心火之南而藏背水之北，水火自然交养，自然念虑不生。即白玉蟾所谓洗心涤虑为沐浴是也。", "o": "故初機之士，降伏其心，束之太緊，未免有煩燥火炎之患，是以暫將心火之南而藏背水之北，水火自然交養，自然念慮不生。即白玉蟾所謂洗心滌慮為沐浴是也。", "i": 386}, {"t": "p", "s": "然沐浴虽为洗心之法，艮背虽有止念之功，二理是则是矣，皆未到实际之地。此向上一著，千圣秘而不传后世。学徒所以罕闻、罕遇。人若明得此窍，真可以夺神功，改天命。", "o": "然沐浴雖為洗心之法，艮背雖有止念之功，二理是則是矣，皆未到實際之地。此向上一著，千聖秘而不傳後世。學徒所以罕聞、罕遇。人若明得此竅，真可以奪神功，改天命。", "i": 387}, {"t": "note", "s": "口诀引证：古仙有言曰：夹脊双关透顶门，修行径路此为尊。以其上通天谷，下达尾闾，中通心肾，召摄灵阳，救护命宝。此非修行径路而何？吾人未有此身，先有此息，此身未灭，此息先灭，此又非修行正路而何？", "o": "口诀引证：古仙有言曰：夾脊雙關透頂門，修行徑路此為尊。以其上通天谷，下達尾閭，中通心腎，召攝靈陽，救護命寶。此非修行徑路而何？吾人未有此身，先有此息，此身未滅，此息先滅，此又非修行正路而何？", "i": 388}, {"t": "p", "s": "原人受生之初，在胞胎内随母呼吸，受气而成此缕，与母联属，渐吹渐开，中空如管，通气在来，前通于脐，后通于肾，上通夹脊泥丸，至山根而生双窍，由双窍下至准头，而成鼻之两孔，是以名曰鼻祖。", "o": "原人受生之初，在胞胎內隨母呼吸，受氣而成此縷，與母聯屬，漸吹漸開，中空如管，通氣在來，前通於臍，後通於腎，上通夾脊泥丸，至山根而生雙竅，由雙竅下至准頭，而成鼻之兩孔，是以名曰鼻祖。", "i": 389}, {"t": "p", "s": "斯时，我之气通母之气，母之气通天地之气，天地之气通太虚之气，窍窍相通，无有隔阂。几乎气数满足，裂胞而出，剪断脐带，囚地一声，一点元阳落于立命之处。自此后天用事，虽有呼吸往来，不得与元始祖气相通。人生自幼至老，未有一息驻于其中。凡夫尘生尘灭，万死万生，只为寻不著来时旧路耳。", "o": "斯時，我之氣通母之氣，母之氣通天地之氣，天地之氣通太虛之氣，竅竅相通，無有隔閡。幾乎氣數滿足，裂胞而出，剪斷臍帶，囚地一聲，一點元陽落於立命之處。自此後天用事，雖有呼吸往來，不得與元始祖氣相通。人生自幼至老，未有一息駐於其中。凡夫塵生塵滅，萬死萬生，只為尋不著來時舊路耳。", "i": 390}, {"t": "p", "s": "太上教人修炼而长生者，由其能夺天地之正气。人之所以能夺天地之正气者，由其有两孔之呼吸也。所呼者自己之<mark>元气</mark>从中而出，所吸者天地之正气从外而入。人若根源牢固，呼吸之间，亦可以夺天地之正气而寿绵长久。若根源不固，精竭气弱，所吸天地之正气随呼而出，身中<mark>元气</mark>不为己之所有，反为天地所夺。何也？盖为呼吸不得其门而入耳。", "o": "太上教人修煉而長生者，由其能奪天地之正氣。人之所以能奪天地之正氣者，由其有兩孔之呼吸也。所呼者自己之<mark>元氣</mark>從中而出，所吸者天地之正氣從外而入。人若根源牢固，呼吸之間，亦可以奪天地之正氣而壽綿長久。若根源不固，精竭氣弱，所吸天地之正氣隨呼而出，身中<mark>元氣</mark>不為己之所有，反為天地所奪。何也？蓋為呼吸不得其門而入耳。", "i": 391}, {"t": "p", "s": "一切常人，时吸皆随咽喉而下，至中脘而回，不能与祖气相连，如鱼饮水而口进腮出，即庄子所谓，众人之息以喉是也。", "o": "一切常人，時吸皆隨咽喉而下，至中脘而回，不能與祖氣相連，如魚飲水而口進腮出，即莊子所謂，眾人之息以喉是也。", "i": 392}, {"t": "p", "s": "若是至人，呼吸直贯明堂，而上至夹脊，而流入命门，得与祖气相连，如磁吸铁，而同类相亲。即庄子所谓，真人之后以踵是也。踵者，其息深深之义。既得深深，则我命在我，而不为大冶陶铸矣。", "o": "若是至人，呼吸直貫明堂，而上至夾脊，而流入命門，得與祖氣相連，如磁吸鐵，而同類相親。即莊子所謂，真人之後以踵是也。踵者，其息深深之義。既得深深，則我命在我，而不為大冶陶鑄矣。", "i": 393}, {"t": "p", "s": "今之人，有调息、数息、抑息、闭息，皆是隔靴止痒，不得到于玄窍。", "o": "今之人，有調息、數息、抑息、閉息，皆是隔靴止癢，不得到於玄竅。", "i": 394}, {"t": "p", "s": "此窍初凝，就生两肾，次生其心。其肾如藕，其心如莲，其梗中通外直，拄地撑天。心肾相去八寸四分，中余一寸二分，谓之腔子里是也，乃心肾往来之路，水火既济之乡。", "o": "此竅初凝，就生兩腎，次生其心。其腎如藕，其心如蓮，其梗中通外直，拄地撐天。心腎相去八寸四分，中餘一寸二分，謂之腔子裡是也，乃心腎往來之路，水火既濟之鄉。", "i": 395}, {"t": "p", "s": "欲通此窍，先要存想山根，则呼吸之气渐次通夹脊，透混元，而直达于命府，方才子母会合，破镜重圆，渐渐扩充，则根本完固，救住命宝，始可言其修炼。按了真了曰：欲点常明灯，当用添油法。尹师曰：涵养本原为先，救护命宝为急。又曰：一息尚存，皆可复命。人若知添油之法，续尽灯而复光明，即如得返魂之香，点枯荄而重茂盛。所以云：油千灯灭，气绝身亡。然非此窍则不能添油，非添油则不能接命，命不接则留性不住，性不住忽一旦无常到来，则懵懵然而去矣。故吕公曰：啬精宜及早，接命莫教迟。果然是接之则长生，不接则夭死。", "o": "欲通此竅，先要存想山根，則呼吸之氣漸次通夾脊，透混元，而直達於命府，方才子母會合，破鏡重圓，漸漸擴充，則根本完固，救住命寶，始可言其修煉。按了真了曰：欲點常明燈，當用添油法。尹師曰：涵養本原為先，救護命寶為急。又曰：一息尚存，皆可複命。人若知添油之法，續盡燈而複光明，即如得返魂之香，點枯荄而重茂盛。所以云：油千燈滅，氣絕身亡。然非此竅則不能添油，非添油則不能接命，命不接則留性不住，性不住忽一旦無常到來，則懵懵然而去矣。故呂公曰：嗇精宜及早，接命莫教遲。果然是接之則長生，不接則夭死。", "i": 396}, {"t": "p", "s": "盖人禀天地气数有限，不知保养，自暴自弃，如刘海蟾云：朝伤暮损迷不知，丧乱精神无所据；细细消磨渐渐衰，耗竭元和神乃去。阖辟之机一停，呼吸之气立断。呜呼！生死机关，其速如此，世人何事而不肯回心向道耶？", "o": "蓋人稟天地氣數有限，不知保養，自暴自棄，如劉海蟾云：朝傷暮損迷不知，喪亂精神無所據；細細消磨漸漸衰，耗竭元和神乃去。闔闢之機一停，呼吸之氣立斷。嗚呼！生死機關，其速如此，世人何事而不肯回心向道耶？", "i": 397}, {"t": "p", "s": "况此著工夫最是简易，不拘行住坐卧，常损此心，退藏夹脊之窍，则天地之正气可扯而进，与己混元真精凝结丹田，以为起生之本。盖以天地无涯之元炁，而续我有限之形躯，不亦易乎？", "o": "況此著工夫最是簡易，不拘行住坐臥，常損此心，退藏夾脊之竅，則天地之正氣可扯而進，與己混元真精凝結丹田，以為起生之本。蓋以天地無涯之元炁，而續我有限之形軀，不亦易乎？", "i": 398}, {"t": "p", "s": "学者只要认定此窍，守而不离，久久纯熟，则里面皎皎明明，如月在水，相似自然，散其邪火，销其杂虑，降其动心，止其妄念。妄念既上，真息自现，真念无念，真息无息。息无则命根永固，念无则性体恒存。性存命固、悬念俱销，此<span class=\"key\">性命双修</span>之第一步也。", "o": "學者只要認定此竅，守而不離，久久純熟，則裏面皎皎明明，如月在水，相似自然，散其邪火，銷其雜慮，降其動心，止其妄念。妄念既上，真息自現，真念無念，真息無息。息無則命根永固，念無則性體恆存。性存命固、懸念俱銷，此<span class=\"key\">性命雙修</span>之第一步也。", "i": 399}, {"t": "p", "s": "嗟乎！人生如无根之树，全凭气息以为根株，一息不来，命非己有。故欲修长生者，必固其气。气固则身中之<mark>元气</mark>不随呼而出，天地之真气恒随吸而入。久之，<b>胎息</b>定，鄞鄂成，而长生有路矣。", "o": "嗟乎！人生如無根之樹，全憑氣息以為根株，一息不來，命非己有。故欲修長生者，必固其氣。氣固則身中之<mark>元氣</mark>不隨呼而出，天地之真氣恆隨吸而入。久之，<b>胎息</b>定，鄞鄂成，而長生有路矣。", "i": 400}, {"t": "p", "s": "此段当与第三节蛰伏藏气穴同看。", "o": "此段當與第三節蟄伏藏氣穴同看。", "i": 401}, {"t": "h2", "s": "玉液炼形法则", "o": "玉液炼形法则", "i": 402}, {"t": "p", "s": "初学之人，平素劳碌，乍入圜中，一旦安逸。逸则四肢不运动，安则百节不流通。以致脉络壅塞，气血凝滞，此通关荡秽之法不能无也。", "o": "初學之人，平素勞碌，乍入圜中，一旦安逸。逸則四肢不運動，安則百節不流通。以致脈絡壅塞，氣血凝滯，此通關蕩穢之法不能無也。", "i": 403}, {"t": "p", "s": "此法先用行气主宰，照在玄膺一窍。此窍可通气管，即黄庭经所谓，玄膺气管受精符是也。少倾，则津液满口，如井水然，微漱数遍，徐徐以意引以重楼，渐达膻中、尻尾、中脘、神阙，至气海而止。就从气海分开两路，至左右大腿，从膝至三里，下脚背及大拇指，又转入涌泉，由脚跟脚弯循大腿而上至尾闾，合作一处，过肾堂、夹脊、双关，分送两肩、两膀、两臂至手背，由中指转手掌，一齐旋回过手腕，由胸旁历腮后，从脑灌顶，复下明堂、上腭，以舌迎之，至玄膺而止。此为一转毕。稍停又眼前行功，则壅滞之处浙次疏通，不唯贯穿诸经，亦能通达诸窍。即心印经所谓，七窍相通，窍窍光明是也。", "o": "此法先用行氣主宰，照在玄膺一竅。此竅可通氣管，即黃庭經所謂，玄膺氣管受精符是也。少傾，則津液滿口，如井水然，微漱數遍，徐徐以意引以重樓，漸達膻中、尻尾、中脘、神闕，至氣海而止。就從氣海分開兩路，至左右大腿，從膝至三里，下腳背及大拇指，又轉入湧泉，由腳跟腳彎循大腿而上至尾閭，合作一處，過腎堂、夾脊、雙關，分送兩肩、兩膀、兩臂至手背，由中指轉手掌，一齊旋回過手腕，由胸旁歷腮後，從腦灌頂，複下明堂、上齶，以舌迎之，至玄膺而止。此為一轉畢。稍停又眼前行功，則壅滯之處浙次疏通，不唯貫穿諸經，亦能通達諸竅。即心印經所謂，七竅相通，竅竅光明是也。", "i": 404}, {"t": "p", "s": "盖吾人灵明，一窍六合而内，六合而外，本无不周，本无不照，其不能然者，为形所碍耳。直要炼到形神俱妙，方才与道合真。", "o": "蓋吾人靈明，一竅六合而內，六合而外，本無不周，本無不照，其不能然者，為形所礙耳。直要煉到形神俱妙，方才與道合真。", "i": 405}, {"t": "p", "s": "夫行气用眼者何也？故施肩吾曰：气是添年药，心为使气神；若知行气主，便是得仙人。普人谓，目之所至，心亦至焉。心之所至，气亦至焉。斯言确之矣。", "o": "夫行氣用眼者何也？故施肩吾曰：氣是添年藥，心為使氣神；若知行氣主，便是得仙人。普人謂，目之所至，心亦至焉。心之所至，氣亦至焉。斯言確之矣。", "i": 406}, {"t": "p", "s": "炼形用液者何也？道家谓之药涤玉液是津，玉池是口。黄庭内景云：口为玉池太和官，漱咽灵液灾不干，体生光华炁香兰，却灭百邪玉铢颜。审能修之登广塞。盖液中有气，气中有液，液气相生，日充月盛，为金液之基，作润身之宝。况能穿关透节，无处不到。古歌曰：华池神水频吞咽，紫府元君直上奔，常使气通关节透，自然精满谷神存。", "o": "煉形用液者何也？道家謂之藥滌玉液是津，玉池是口。黃庭內景云：口為玉池太和官，漱咽靈液災不干，體生光華炁香蘭，卻滅百邪玉銖顏。審能修之登廣塞。蓋液中有氣，氣中有液，液氣相生，日充月盛，為金液之基，作潤身之寶。況能穿關透節，無處不到。古歌曰：華池神水頻吞咽，紫府元君直上奔，常使氣通關節透，自然精滿谷神存。", "i": 407}, {"t": "p", "s": "夫玄膺一窍，乃是津液之海，生化之源，灌溉一身，皆本于此。故太上云：舌下玄膺生死岸，子若遇之升天汉。法华经颂云：白玉齿边流舍利，红莲香上放毫光，喉中甘露涓涓润，心内醍醐滴滴凉。此乃小<mark>玉液炼形</mark>法也。", "o": "夫玄膺一竅，乃是津液之海，生化之源，灌溉一身，皆本於此。故太上云：舌下玄膺生死岸，子若遇之升天漢。法華經頌云：白玉齒邊流舍利，紅蓮香上放毫光，喉中甘露涓涓潤，心內醍醐滴滴涼。此乃小<mark>玉液煉形</mark>法也。", "i": 408}, {"t": "p", "s": "人之孔窍所以通乎其虚，达乎其气，而周流于一身之内焉，一或有所蔽塞则为瘀痰、为壅血，而一身脉络不能相通使生疾病今以此法日行三、五次，但得气血流通，百脉和畅，病即去矣。止而勿行。此与退藏救护是为表里二段并行而不相悖。", "o": "人之孔竅所以通乎其虛，達乎其氣，而周流於一身之內焉，一或有所蔽塞則為瘀痰、為壅血，而一身脈絡不能相通使生疾病今以此法日行三、五次，但得氣血流通，百脈和暢，病即去矣。止而勿行。此與退藏救護是為表裏二段並行而不相悖。", "i": 409}, {"t": "p", "s": "夫涵养本原虽是去情识，实除生灭心。心无生灭，身无生灭定矣。欲除生灭心，必自无念始，无念之积习纯熟足，可致无梦。无念之静定熟足，可致无生。无梦乃现在之大事也，无念乃末后之大事也。无生则不造，无梦则不化，不造不化，即不生不灭也。", "o": "夫涵養本原雖是去情識，實除生滅心。心無生滅，身無生滅定矣。欲除生滅心，必自無念始，無念之積習純熟足，可致無夢。無念之靜定熟足，可致無生。無夢乃現在之大事也，無念乃末後之大事也。無生則不造，無夢則不化，不造不化，即不生不滅也。", "i": 410}, {"t": "p", "s": "夫学道之士，不患不成，唯患不勤。苟能专精而勤，未有学而不得也。设使立志不坚，信道不笃，朝为而夕改，始勤而中辍，悦于须臾，厌于持久，欲望与天齐寿，不亦难乎？", "o": "夫學道之士，不患不成，唯患不勤。苟能專精而勤，未有學而不得也。設使立志不堅，信道不篤，朝為而夕改，始勤而中輟，悅於須臾，厭於持久，欲望與天齊壽，不亦難乎？", "i": 411}, {"t": "p", "s": "内观经云：知道易，信道难；信道易，行道难；行道易，得道难，得道易，守道难。若使不难，则满市皆神仙矣。安足为异耶？", "o": "內觀經云：知道易，信道難；信道易，行道難；行道易，得道難，得道易，守道難。若使不難，則滿市皆神仙矣。安足為異耶？", "i": 412}, {"t": "p", "s": "盖修道者，如农夫之去草一般，务拔其根，则吾心天真种子自然发生矣。况此一字法门，彻头彻尾，甚易行，甚有验。小而试之，可以却病延年，大而用之，可以超凡入圣，在学者用功深浅何如耳。", "o": "蓋修道者，如農夫之去草一般，務拔其根，則吾心天真種子自然發生矣。況此一字法門，徹頭徹尾，甚易行，甚有驗。小而試之，可以卻病延年，大而用之，可以超凡入聖，在學者用功深淺何如耳。", "i": 413}, {"t": "h2", "s": "安神祖窍翕聚先天", "o": "安神祖窍翕聚先天", "i": 414}, {"t": "p", "s": "<b>祖窍</b>真际，举世罕知，不得师传，俨似暗中射垛。", "o": "<b>祖竅</b>真際，舉世罕知，不得師傳，儼似暗中射垛。", "i": 415}, {"t": "p", "s": "盖<b>祖窍</b>者，乃老子所谓玄牝之门也。悟道篇云：要得谷神长不死，须凭玄牝立根基。所以紫阳言：修炼<mark>金丹</mark>，全在玄牝。于四百字序云：玄牝一窍，而采取在此，交媾在此，烹炼在此，沐浴在此，温养在此，结胎在此，至于脱胎神化，无不在此。修炼之士，诚能知此一窍，则<mark>金丹</mark>之道尽矣，所谓得一而万事毕者是也。", "o": "蓋<b>祖竅</b>者，乃老子所謂玄牝之門也。悟道篇云：要得穀神長不死，須憑玄牝立根基。所以紫陽言：修煉<mark>金丹</mark>，全在玄牝。於四百字序云：玄牝一竅，而採取在此，交媾在此，烹煉在此，沐浴在此，溫養在此，結胎在此，至於脫胎神化，無不在此。修煉之士，誠能知此一竅，則<mark>金丹</mark>之道盡矣，所謂得一而萬事畢者是也。", "i": 416}, {"t": "p", "s": "然而丹经大都喻言，使学者无所归著。前辈指为先天主人、万象主宰、太极之蒂、混沌之根、至善之地、凝结之所、虚无之谷、造化之源、不二法门、甚深法界、归根窍、复命关、<b>中黄</b>宫、希夷府、总持门、极乐国、虚空藏、西南乡、<b>戊己</b>门、真一处、<b>黄婆</b>舍、守一坛、净土、西方、黄中、正位、这个、神室、真土、黄庭，种种异名，难以悉举。", "o": "然而丹經大都喻言，使學者無所歸著。前輩指為先天主人、萬象主宰、太極之蒂、混沌之根、至善之地、凝結之所、虛無之谷、造化之源、不二法門、甚深法界、歸根竅、複命關、<b>中黃</b>宮、希夷府、總持門、極樂國、虛空藏、西南鄉、<b>戊己</b>門、真一處、<b>黃婆</b>舍、守一壇、淨土、西方、黃中、正位、這個、神室、真土、黃庭，種種異名，難以悉舉。", "i": 417}, {"t": "p", "s": "然此窍在身中求之，非口、非鼻、非心、非肾、非肝，非肺、非脾胃、非脐轮、非尾闾、非膀胱、非谷道、非两肾中间一穴、非脐下一寸三分、非明堂泥丸、非关<mark>元气</mark>海，然则果何处耶？", "o": "然此竅在身中求之，非口、非鼻、非心、非腎、非肝，非肺、非脾胃、非臍輪、非尾閭、非膀胱、非穀道、非兩腎中間一穴、非臍下一寸三分、非明堂泥丸、非關<mark>元氣</mark>海，然則果何處耶？", "i": 418}, {"t": "p", "s": "纯阳祖师云：玄牝玄牝真玄牝，不在心兮不在肾，穷取生身受气初，莫怪天机都泄尽。且以生身之理言之，父母一念将媾之际，而圆陀陀、光灿灿，先天一点灵光撞于母胞，如此○而已。懦谓之仁，亦曰无极。释谓之珠，亦曰圆明。道谓之丹，亦曰灵光。皆指此先天一气、混元至精而言，实生身之原、受气之初、<b>性命</b>之基、万化之祖也。及父母交罢，精血包罗于外，如此◎而已，即吾儒所谓太极是也。由是而五脏，由是而六腑，由是而四肢，由是而百骸，由是而能视、能听、能持、能行，由是而能仁、能义、能礼、能智，由是而能圣、能神、能文、能武，究竟生身本原，皆从太极中那一些儿发出来耳。", "o": "純陽祖師云：玄牝玄牝真玄牝，不在心兮不在腎，窮取生身受氣初，莫怪天機都洩盡。且以生身之理言之，父母一念將媾之際，而圓陀陀、光燦燦，先天一點靈光撞於母胞，如此○而已。懦謂之仁，亦曰無極。釋謂之珠，亦曰圓明。道謂之丹，亦曰靈光。皆指此先天一氣、混元至精而言，實生身之原、受氣之初、<b>性命</b>之基、萬化之祖也。及父母交罷，精血包羅於外，如此◎而已，即吾儒所謂太極是也。由是而五臟，由是而六腑，由是而四肢，由是而百骸，由是而能視、能聽、能持、能行，由是而能仁、能義、能禮、能智，由是而能聖、能神、能文、能武，究竟生身本原，皆從太極中那一些兒發出來耳。", "i": 419}, {"t": "p", "s": "参同契云：人所禀躯体，本一无。<mark>元精</mark>云布，因炁托。初炁一疑定，玄牝立焉。上结灵关，下结气海。灵关藏觉灵性，气海藏生气命。<b>性命</b>虽分<b>龙虎</b>二弦，而<b>性命</b>之根则总持于<b>祖窍</b>之内。", "o": "參同契云：人所稟軀體，本一無。<mark>元精</mark>雲布，因炁托。初炁一疑定，玄牝立焉。上結靈關，下結氣海。靈關藏覺靈性，氣海藏生氣命。<b>性命</b>雖分<b>龍虎</b>二弦，而<b>性命</b>之根則總持於<b>祖竅</b>之內。", "i": 420}, {"t": "p", "s": "故老子曰：玄牝之门，是谓天地根。何以谓之玄牝之门而曰天地根也？岂非吾身之天地、吾身是玄牝耶？吾身天地之根、吾身玄牝之根耶？吾身玄牝之门、吾身天地之门耶？而天地之门之所从出者，独不有所谓先天地生而为天地之根乎？故天气之根，乃天地之所由以分天而分地也，而玄牝之门之所从出者，独不有所谓先玄牝生而为玄牝之根乎？故玄牝之根，乃玄牝之所由以分玄而分牝也。", "o": "故老子曰：玄牝之門，是謂天地根。何以謂之玄牝之門而曰天地根也？豈非吾身之天地、吾身是玄牝耶？吾身天地之根、吾身玄牝之根耶？吾身玄牝之門、吾身天地之門耶？而天地之門之所從出者，獨不有所謂先天地生而為天地之根乎？故天氣之根，乃天地之所由以分天而分地也，而玄牝之門之所從出者，獨不有所謂先玄牝生而為玄牝之根乎？故玄牝之根，乃玄牝之所由以分玄而分牝也。", "i": 421}, {"t": "p", "s": "何以谓之玄也？岂非从有各之母中发出来也？何以谓之玄之又玄7岂非从无名之始中发山来也？", "o": "何以謂之玄也？豈非從有各之母中發出來也？何以謂之玄之又玄7豈非從無名之始中發山來也？", "i": 422}, {"t": "p", "s": "无名之始，释氏指为不二法门；子思曰其为物不二，则其生物不测；庄子曰昭昭生于冥冥，有伦生于无形。而欲悟性以见性者，其将来之昭昭而有伦乎？抑亦求之冥冥而无形乎？", "o": "無名之始，釋氏指為不二法門；子思曰其為物不二，則其生物不測；莊子曰昭昭生於冥冥，有倫生於無形。而欲悟性以見性者，其將來之昭昭而有倫乎？抑亦求之冥冥而無形乎？", "i": 423}, {"t": "p", "s": "冥冥无形，莫窥其朕。吾儒所谓无声无臭，释氏所谓威音王已前是也。然则何以谓之王，而其所以主张戚音者，太极也，故谓之王。", "o": "冥冥無形，莫窺其朕。吾儒所謂無聲無臭，釋氏所謂威音王已前是也。然則何以謂之王，而其所以主張戚音者，太極也，故謂之王。", "i": 424}, {"t": "p", "s": "余于是而知学仙学佛者，但觅其王之所在而尊之尔，即尊王矣，而又且并其王而无有之，是游太极，而还于无极也。无极者，真中也。故曰圣圣相传在此中，此中就是尧舜久执之中、孔子时中之中、子思未发之中、易之黄中、通理之中、度人经之中、理五炁之中，释迦之空中之中，老子之守中之中。", "o": "餘於是而知學仙學佛者，但覓其王之所在而尊之爾，即尊王矣，而又且並其王而無有之，是游太極，而還於無極也。無極者，真中也。故曰聖聖相傳在此中，此中就是堯舜久執之中、孔子時中之中、子思未發之中、易之黃中、通理之中、度人經之中、理五炁之中，釋迦之空中之中，老子之守中之中。", "i": 425}, {"t": "p", "s": "然中字有二义。若曰中有定在者，在此中也。若曰中无定在者，<b>乾</b><b>坤</b>合处乃其中也。以其可得而久执也，故曰有定在。然岂特在此一身之内为然也？是虽一身之外，而遍满天地，亦皆吾心之中也。又岂特在此天地之内为然也？是虽天地之外，而遍满虚空，亦皆吾心之中也。", "o": "然中字有二義。若曰中有定在者，在此中也。若曰中無定在者，<b>乾</b><b>坤</b>合處乃其中也。以其可得而久執也，故曰有定在。然豈特在此一身之內為然也？是雖一身之外，而遍滿天地，亦皆吾心之中也。又豈特在此天地之內為然也？是雖天地之外，而遍滿虛空，亦皆吾心之中也。", "i": 426}, {"t": "p", "s": "易曰：周流六虚。然周流于六虚之外，而并不足，退藏于一身之窍，而非有余。故曰一窍能纳太虚。空中道经云：天之极上处距地之极下处，相去八万四千里。而天地之中，适当四万二千里之中处也。若人身一小天地也，而心脐相去亦有八寸四分，而中心之中，适当四寸二分之中处也。此窍正在<b>乾</b>之下、<b>坤</b>之上、震之西、兑之东，八脉九窍、经络联辏、虚间二穴，空悬黍珠，是人一身天地之正中，乃藏元始祖炁之窍也。", "o": "易曰：周流六虛。然周流於六虛之外，而並不足，退藏於一身之竅，而非有餘。故曰一竅能納太虛。空中道經云：天之極上處距地之極下處，相去八萬四千里。而天地之中，適當四萬二千里之中處也。若人身一小天地也，而心臍相去亦有八寸四分，而中心之中，適當四寸二分之中處也。此竅正在<b>乾</b>之下、<b>坤</b>之上、震之西、兌之東，八脈九竅、經絡聯輳、虛間二穴，空懸黍珠，是人一身天地之正中，乃藏元始祖炁之竅也。", "i": 427}, {"t": "p", "s": "若知窍而不知妙，犹知中而不知一。昔人有言曰：心是地而性是王，窍是中而妙是一。一有数种，有道之一、有神之一、有气之一、有水之一、有数之一、有一贯之一、有协一之一、有精一之一、有唯一之一、有守一之一、有归一之一。归一者，以其一而归乎其中也。守一者，以其一而守乎其中也。有中则有一，一而非中，则非圣人之所谓一也。有一便有中，中而非一，则非圣人之所谓中也。故孔子之一，以其中之一而贯之也。尧舜之中，以其一之中而执之也。伏羲氏之河图而虚其中者，先天也，乃吾身<b>祖窍</b>之中也。", "o": "若知竅而不知妙，猶知中而不知一。昔人有言曰：心是地而性是王，竅是中而妙是一。一有數種，有道之一、有神之一、有氣之一、有水之一、有數之一、有一貫之一、有協一之一、有精一之一、有唯一之一、有守一之一、有歸一之一。歸一者，以其一而歸乎其中也。守一者，以其一而守乎其中也。有中則有一，一而非中，則非聖人之所謂一也。有一便有中，中而非一，則非聖人之所謂中也。故孔子之一，以其中之一而貫之也。堯舜之中，以其一之中而執之也。伏羲氏之河圖而虛其中者，先天也，乃吾身<b>祖竅</b>之中也。", "i": 428}, {"t": "p", "s": "孔子曰：先天而夫，弗违。", "o": "孔子曰：先天而夫，弗違。", "i": 429}, {"t": "p", "s": "老子曰：无名天地之始。", "o": "老子曰：無名天地之始。", "i": 430}, {"t": "p", "s": "即释氏所谓：茫乎，无联一片，太虚是也。", "o": "即釋氏所謂：茫乎，無聯一片，太虛是也。", "i": 431}, {"t": "p", "s": "神禹氏之洛书而实其中者，后天也，乃吾身<b>祖窍</b>之一也。", "o": "神禹氏之洛書而實其中者，後天也，乃吾身<b>祖竅</b>之一也。", "i": 432}, {"t": "p", "s": "孔子曰：后天而奉天时。", "o": "孔子曰：後天而奉天時。", "i": 433}, {"t": "p", "s": "老子曰：有名，万物之母。", "o": "老子曰：有名，萬物之母。", "i": 434}, {"t": "p", "s": "即道家所谓，露出端倪，一点灵光是也。", "o": "即道家所謂，露出端倪，一點靈光是也。", "i": 435}, {"t": "p", "s": "然而河图中矣，中而未始不一。洛书一矣，一而未始不中。中包乎一，一主乎中，岂非精微之妙理、无为之神机耶？", "o": "然而河圖中矣，中而未始不一。洛書一矣，一而未始不中。中包乎一，一主乎中，豈非精微之妙理、無為之神機耶？", "i": 436}, {"t": "p", "s": "道德经曰：多言数穷，不如守中。", "o": "道德經曰：多言數窮，不如守中。", "i": 437}, {"t": "p", "s": "洞玄经曰：丹书万卷，不如守一。一者，生生不息之仁也。", "o": "洞玄經曰：丹書萬卷，不如守一。一者，生生不息之仁也。", "i": 438}, {"t": "p", "s": "中庸曰：修道以仁。", "o": "中庸曰：修道以仁。", "i": 439}, {"t": "p", "s": "论语曰：天下归仁。", "o": "論語曰：天下歸仁。", "i": 440}, {"t": "p", "s": "礼记曰：中心安仁。", "o": "禮記曰：中心安仁。", "i": 441}, {"t": "p", "s": "周易曰：安土敦仁。", "o": "周易曰：安土敦仁。", "i": 442}, {"t": "p", "s": "予常譬之果实之仁，中有一点者，太极也。而抱之两者，一阴一阳也。", "o": "予常譬之果實之仁，中有一點者，太極也。而抱之兩者，一陰一陽也。", "i": 443}, {"t": "p", "s": "易曰：易有太极，是生两仪。故易也者，两而化也。太极也者，一而神也。以此一点之神而含养于<b>祖窍</b>之中，不得勤，不得怠，谓之安神。<b>祖窍</b>非所以复吾身之<b>乾</b>元乎？以此一点之仁，而敦养于<b>坤</b>土之中，而勿忘，而勿助，谓之安土。敦仁非所以立吾身之太极乎？", "o": "易曰：易有太極，是生兩儀。故易也者，兩而化也。太極也者，一而神也。以此一點之神而含養於<b>祖竅</b>之中，不得勤，不得怠，謂之安神。<b>祖竅</b>非所以複吾身之<b>乾</b>元乎？以此一點之仁，而敦養於<b>坤</b>土之中，而勿忘，而勿助，謂之安土。敦仁非所以立吾身之太極乎？", "i": 444}, {"t": "p", "s": "又若莲子之属中，有一条而抱之两片者，非所谓一以贯之邪？一而二、二而三、三生万物。故张紫阳云：道是虚无生一炁，便从一炁产阴阳，阴阳再合成三体，三体重生万物昌。", "o": "又若蓮子之屬中，有一條而抱之兩片者，非所謂一以貫之邪？一而二、二而三、三生萬物。故張紫陽云：道是虛無生一炁，便從一炁產陰陽，陰陽再合成三體，三體重生萬物昌。", "i": 445}, {"t": "p", "s": "昔文始先生问于老子曰：修身至妙至要，载于何章？老子曰：在于深根固蒂，守中抱一而已。", "o": "昔文始先生問於老子曰：修身至妙至要，載於何章？老子曰：在於深根固蒂，守中抱一而已。", "i": 446}, {"t": "p", "s": "何谓守中？曰：勤守中，莫放逸，外不入，内不出，还本源，万事毕。故老子所谓守中者，守此本体之中也。儒之执中者，执此本体之中。释之空中者，本体之中，本洞然而空也。", "o": "何謂守中？曰：勤守中，莫放逸，外不入，內不出，還本源，萬事畢。故老子所謂守中者，守此本體之中也。儒之執中者，執此本體之中。釋之空中者，本體之中，本洞然而空也。", "i": 447}, {"t": "p", "s": "老子所谓抱一者，抱此本体之一也。释之归一者，归此本体之一也。儒之一贯者，以此本体之一而贯之也。", "o": "老子所謂抱一者，抱此本體之一也。釋之歸一者，歸此本體之一也。儒之一貫者，以此本體之一而貫之也。", "i": 448}, {"t": "p", "s": "唯精唯一者，易之所谓精义入神者是也。久执厥中者，记之所谓王、中心、无为、以守至正者是也。曰王、中心者，盖以一点之仁主此中心之中而命之曰王，所谓天君者是也。夫何为哉？以守至正而已矣。命由此立，性由此存，此两者同出异名，原是窍中旧物。如今复返窍中，则蒙庄所谓南海之倏，北海之忽，相遇于混沌之地矣。", "o": "唯精唯一者，易之所謂精義入神者是也。久執厥中者，記之所謂王、中心、無為、以守至正者是也。曰王、中心者，蓋以一點之仁主此中心之中而命之曰王，所謂天君者是也。夫何為哉？以守至正而已矣。命由此立，性由此存，此兩者同出異名，原是竅中舊物。如今複返竅中，則蒙莊所謂南海之倏，北海之忽，相遇於混沌之地矣。", "i": 449}, {"t": "p", "s": "修丹之士，不明<b>祖窍</b>，则真息不住而神化无基，药物不全而大丹不结。盖此窍是总持之门、万法之都，亦无边傍，更无内外，不可以有心守，不可以无心求。求以有心，守之，则著相。以无心求之，则落空。若何可也？受师诀曰：空洞无涯是玄窍，知而不守是工夫。常将真我安止其中，如如不动、寂寂惺惺、内外两忘、浑然无事，则神恋气而凝，命恋性而住，不归一而一自归，不守中而中自守。中心之心既实，五行之心自虚，此老子抱一守中、虚心实腹之本旨也。", "o": "修丹之士，不明<b>祖竅</b>，則真息不住而神化無基，藥物不全而大丹不結。蓋此竅是總持之門、萬法之都，亦無邊傍，更無內外，不可以有心守，不可以無心求。求以有心，守之，則著相。以無心求之，則落空。若何可也？受師訣曰：空洞無涯是玄竅，知而不守是工夫。常將真我安止其中，如如不動、寂寂惺惺、內外兩忘、渾然無事，則神戀氣而凝，命戀性而住，不歸一而一自歸，不守中而中自守。中心之心既實，五行之心自虛，此老子抱一守中、虛心實腹之本旨也。", "i": 450}, {"t": "p", "s": "张紫阳云：", "o": "張紫陽云：", "i": 451}, {"t": "p", "s": "虚心实腹义俱深，只为虚心要识心。", "o": "虛心實腹義俱深，只為虛心要識心。", "i": 452}, {"t": "p", "s": "刘海蟾云：", "o": "劉海蟾云：", "i": 453}, {"t": "p", "s": "中央神室本虚闲，自有先天真气到。", "o": "中央神室本虛閒，自有先天真氣到。", "i": 454}, {"t": "p", "s": "吕纯阳云：", "o": "呂純陽云：", "i": 455}, {"t": "p", "s": "守中绝学方知奥，抱一无言始见佳。", "o": "守中絕學方知奧，抱一無言始見佳。", "i": 456}, {"t": "p", "s": "徐佐卿云：", "o": "徐佐卿云：", "i": 457}, {"t": "p", "s": "倏忽遨游归混沌，<b>龙虎</b>蟠距入<b>中黄</b>。", "o": "倏忽遨游歸混沌，<b>龍虎</b>蟠距入<b>中黃</b>。", "i": 458}, {"t": "p", "s": "正阳翁云：", "o": "正陽翁云：", "i": 459}, {"t": "p", "s": "要识<mark>金丹</mark>端的处，未生身处下功夫。", "o": "要識<mark>金丹</mark>端的處，未生身處下功夫。", "i": 460}, {"t": "p", "s": "如如居士云：", "o": "如如居士云：", "i": 461}, {"t": "p", "s": "<b>坤</b>之上，<b>乾</b>之下，中间一宝难酬价。", "o": "<b>坤</b>之上，<b>乾</b>之下，中間一寶難酬價。", "i": 462}, {"t": "p", "s": "李清庵中和集云：", "o": "李清庵中和集云：", "i": 463}, {"t": "p", "s": "两含仪肇判分三极，<b>乾</b>以直专<b>坤</b>辟翕。天地中间玄牝门，其动愈出静愈入。", "o": "兩含儀肇判分三極，<b>乾</b>以直專<b>坤</b>闢翕。天地中間玄牝門，其動愈出靜愈入。", "i": 464}, {"t": "p", "s": "王玉阳云光集云：", "o": "王玉陽雲光集云：", "i": 465}, {"t": "p", "s": "谷神从此立天根，上圣强名玄牝门。点破世人生死穴，真仙于此定<b>乾</b><b>坤</b>。", "o": "谷神從此立天根，上聖強名玄牝門。點破世人生死穴，真仙於此定<b>乾</b><b>坤</b>。", "i": 466}, {"t": "p", "s": "谭处端水云集云：", "o": "譚處端水雲集云：", "i": 467}, {"t": "p", "s": "阴居于上阳居下，阳气先升阴气随。配合虎龙交媾处，此时如过小桥时。", "o": "陰居於上陽居下，陽氣先升陰氣隨。配合虎龍交媾處，此時如過小橋時。", "i": 468}, {"t": "p", "s": "河上公过明集云：", "o": "河上公過明集云：", "i": 469}, {"t": "p", "s": "杳杳冥冥开众妙，恍恍惚惚葆真窍。敛之潜藏一粒中，放之弥散六合表。", "o": "杳杳冥冥開眾妙，恍恍惚惚葆真竅。斂之潛藏一粒中，放之彌散六合表。", "i": 470}, {"t": "p", "s": "张紫阳悟真篇云：", "o": "張紫陽悟真篇云：", "i": 471}, {"t": "p", "s": "震龙汞自出离乡，兑虎金生在坎方。二物总因儿产母，五行生要入中央。", "o": "震龍汞自出離鄉，兌虎金生在坎方。二物總因兒產母，五行生要入中央。", "i": 472}, {"t": "p", "s": "张景和枕中记云：", "o": "張景和枕中記云：", "i": 473}, {"t": "p", "s": "混元一窍是先天，内面虚无理自然。若向未生前见得，明知必是大罗仙。", "o": "混元一竅是先天，內面虛無理自然。若向未生前見得，明知必是大羅仙。", "i": 474}, {"t": "p", "s": "葛仙翁玄玄歌云：", "o": "葛仙翁玄玄歌云：", "i": 475}, {"t": "p", "s": "<b>乾</b><b>坤</b>合处乃真中，中在虚无甚空阔。簇将<b>龙虎</b>窍中藏，造化枢机归掌握。", "o": "<b>乾</b><b>坤</b>合處乃真中，中在虛無甚空闊。簇將<b>龍虎</b>竅中藏，造化樞機歸掌握。", "i": 476}, {"t": "p", "s": "罗公远弄九集云：", "o": "羅公遠弄九集云：", "i": 477}, {"t": "p", "s": "一窍虚无天地中，缠绵秘密不通风。恍惚杳冥无色象，真人现在宝珠中。", "o": "一竅虛無天地中，纏綿秘密不通風。恍惚杳冥無色象，真人現在寶珠中。", "i": 478}, {"t": "p", "s": "天来子白虎歌云：", "o": "天來子白虎歌云：", "i": 479}, {"t": "p", "s": "玄牝之门镇日开，中间一窍混灵台。无关无锁无人守，日月东西自往来。", "o": "玄牝之門鎮日開，中間一竅混靈台。無關無鎖無人守，日月東西自往來。", "i": 480}, {"t": "p", "s": "张鸿蒙还元篇云：", "o": "張鴻蒙還元篇云：", "i": 481}, {"t": "p", "s": "天地之根始玄牝，呼日吸月持把柄。隐显俱空空不空，寻之不见呼之应。", "o": "天地之根始玄牝，呼日吸月持把柄。隱顯俱空空不空，尋之不見呼之應。", "i": 482}, {"t": "p", "s": "高象先<mark>金丹</mark>歌云：", "o": "高象先<mark>金丹</mark>歌云：", "i": 483}, {"t": "p", "s": "其一之道何所云，莫若先敲<b>戊己</b>门。<b>戊己</b>门中有真水，真水便是黄芽根。", "o": "其一之道何所云，莫若先敲<b>戊己</b>門。<b>戊己</b>門中有真水，真水便是黃芽根。", "i": 484}, {"t": "p", "s": "丁野鹤逍遥游云：", "o": "丁野鶴逍遙游云：", "i": 485}, {"t": "p", "s": "三教一元这个圆，生在无为象帝先。悟得此中真妙理，始知大道祖根源。", "o": "三教一元這個圓，生在無為象帝先。悟得此中真妙理，始知大道祖根源。", "i": 486}, {"t": "p", "s": "萧祖虚大丹诀云：", "o": "蕭祖虛大丹訣云：", "i": 487}, {"t": "p", "s": "学人若要觅黄芽，两处根源共一家。七返九还须识主，工夫毫发不容差。", "o": "學人若要覓黃芽，兩處根源共一家。七返九還須識主，工夫毫髮不容差。", "i": 488}, {"t": "p", "s": "李灵阳<b>祖窍</b>歌云：", "o": "李靈陽<b>祖竅</b>歌云：", "i": 489}, {"t": "p", "s": "个个无生无尽藏，人人本体本虚空。莫道瞿昙名极乐，孔颜乐亦在其中。", "o": "個個無生無盡藏，人人本體本虛空。莫道瞿曇名極樂，孔顏樂亦在其中。", "i": 490}, {"t": "p", "s": "陈致虚转语偈云：", "o": "陳致虛轉語偈云：", "i": 491}, {"t": "p", "s": "一者名为不二门，得门入去便安身。当年曾子一声唯，误了阎浮多少人。", "o": "一者名為不二門，得門入去便安身。當年曾子一聲唯，誤了閻浮多少人。", "i": 492}, {"t": "p", "s": "薛紫贤虚中诗云：", "o": "薛紫賢虛中詩云：", "i": 493}, {"t": "p", "s": "天地之间犹橐龠，橐龠须知鼓者谁。动静根宗由此得，君看放手有风无。", "o": "天地之間猶橐龠，橐龠須知鼓者誰。動靜根宗由此得，君看放手有風無。", "i": 494}, {"t": "p", "s": "吕祖纯阳文集云：", "o": "呂祖純陽文集云：", "i": 495}, {"t": "p", "s": "阴阳二物隐中微，只为愚徒自不知。实实认为男女是，真真说做<b>坎离</b>非。", "o": "陰陽二物隱中微，只為愚徒自不知。實實認為男女是，真真說做<b>坎離</b>非。", "i": 496}, {"t": "p", "s": "李道纯无一歌云：", "o": "李道純無一歌云：", "i": 497}, {"t": "p", "s": "道本虚无生太极，太极变而先有一。一分为二二生三，四象五行从此出。", "o": "道本虛無生太極，太極變而先有一。一分為二二生三，四象五行從此出。", "i": 498}, {"t": "p", "s": "寿涯禅师语录云：", "o": "壽涯禪師語錄云：", "i": 499}, {"t": "p", "s": "陀罗门启妙难穷，佛佛相传只此中。不识西来真实义，空穿铁履走西东。", "o": "陀羅門啟妙難窮，佛佛相傳只此中。不識西來真實義，空穿鐵履走西東。", "i": 500}, {"t": "p", "s": "马丹阳醉中吟云：", "o": "馬丹陽醉中吟云：", "i": 501}, {"t": "p", "s": "老子<mark>金丹</mark>释氏珠，圆明无欠亦无余。死户生门宗此窍，此窍犹能纳太虚。", "o": "老子<mark>金丹</mark>釋氏珠，圓明無欠亦無餘。死戶生門宗此竅，此竅猶能納太虛。", "i": 502}, {"t": "p", "s": "曹文逸大道歌云：", "o": "曹文逸大道歌云：", "i": 503}, {"t": "p", "s": "借问真人何处来，从前原只在灵台。昔年云雾深遮蔽，今日相逢道眼开。", "o": "借問真人何處來，從前原只在靈台。昔年雲霧深遮蔽，今日相逢道眼開。", "i": 504}, {"t": "p", "s": "刘长生仙药集云：", "o": "劉長生仙藥集云：", "i": 505}, {"t": "p", "s": "一窍虚空玄牝门，调停节候要常温。仙人鼎内无他药，杂矿销成百炼金。", "o": "一竅虛空玄牝門，調停節候要常溫。仙人鼎內無他藥，雜礦銷成百煉金。", "i": 506}, {"t": "p", "s": "李道纯中和集云：", "o": "李道純中和集云：", "i": 507}, {"t": "p", "s": "<b>乾</b><b>坤</b>阖辟无休息，离坎升降有合离。我为诸君明指出，念头是外立丹基。", "o": "<b>乾</b><b>坤</b>闔闢無休息，離坎升降有合離。我為諸君明指出，念頭是外立丹基。", "i": 508}, {"t": "p", "s": "刘海蟾见道歌云：", "o": "劉海蟾見道歌云：", "i": 509}, {"t": "p", "s": "函谷关当天地中，往来日月自西东。试将寸管窥玄窍，虎踞龙蟠气象雄。", "o": "函谷關當天地中，往來日月自西東。試將寸管窺玄竅，虎踞龍蟠氣象雄。", "i": 510}, {"t": "p", "s": "无心昌老秘诀云：", "o": "無心昌老秘訣云：", "i": 511}, {"t": "p", "s": "自晓谷神通此道，谁能理性欲修真。明明说向<b>中黄</b>路，霹雳声中自得神。", "o": "自曉谷神通此道，誰能理性欲修真。明明說向<b>中黃</b>路，霹靂聲中自得神。", "i": 512}, {"t": "p", "s": "玉蟾白真人云：", "o": "玉蟾白真人云：", "i": 513}, {"t": "p", "s": "性之根，命之蒂，同出异名分两类。合归一处结成丹，还为元始先天炁。", "o": "性之根，命之蒂，同出異名分兩類。合歸一處結成丹，還為元始先天炁。", "i": 514}, {"t": "p", "s": "缘督赵真人云：", "o": "緣督趙真人云：", "i": 515}, {"t": "p", "s": "虚无一窍正当中，无生无灭自无穷。昭昭灵灵相非相，杳杳冥冥空不空。", "o": "虛無一竅正當中，無生無滅自無窮。昭昭靈靈相非相，杳杳冥冥空不空。", "i": 516}, {"t": "p", "s": "紫阳张真人<mark>金丹</mark>序云：", "o": "紫陽張真人<mark>金丹</mark>序云：", "i": 517}, {"t": "p", "s": "此窍非凡窍，<b>乾</b><b>坤</b>共合成。名为神气穴，内有<b>坎离</b>精。", "o": "此竅非凡竅，<b>乾</b><b>坤</b>共合成。名為神氣穴，內有<b>坎離</b>精。", "i": 518}, {"t": "p
