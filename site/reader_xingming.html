", "s": "莹蟾李真人道德颂云：", "o": "瑩蟾李真人道德頌云：", "i": 519}, {"t": "p", "s": "阖辟应<b>乾</b><b>坤</b>，斯为玄牝门。自从无出入，三界独称尊。", "o": "闔闢應<b>乾</b><b>坤</b>，斯為玄牝門。自從無出入，三界獨稱尊。", "i": 520}, {"t": "p", "s": "司马子微云：", "o": "司馬子微云：", "i": 521}, {"t": "p", "s": "虚无一窍号<b>玄关</b>，正在人身天地间。八万四千分上下，九三六五列循环。", "o": "虛無一竅號<b>玄關</b>，正在人身天地間。八萬四千分上下，九三六五列循環。", "i": 522}, {"t": "p", "s": "大包法界浑无迹，细入尘埃不见颜。这个名为祖炁穴，黍珠一粒正中悬。", "o": "大包法界渾無跡，細入塵埃不見顏。這個名為祖炁穴，黍珠一粒正中懸。", "i": 523}, {"t": "p", "s": "以上口诀，皆发明<b>祖窍</b>之妙。老子曰：天地之间，其犹橐龠乎。", "o": "以上口訣，皆發明<b>祖竅</b>之妙。老子曰：天地之間，其猶橐龠乎。", "i": 524}, {"t": "note", "s": "口诀引证：庄子曰：枢得其环中，以应无穷<b>坤</b>。", "o": "口诀引证：莊子曰：樞得其環中，以應無窮<b>坤</b>。", "i": 525}, {"t": "p", "s": "曰：正位居体鼎。", "o": "曰：正位居體鼎。", "i": 526}, {"t": "p", "s": "曰：正位凝命根。", "o": "曰：正位凝命根。", "i": 527}, {"t": "p", "s": "曰：君子思不出其位。", "o": "曰：君子思不出其位。", "i": 528}, {"t": "p", "s": "而孟子亦曰：立天下之正位，惟此正位也。以言乎其大，则足以包罗乎。天地而无外。故谓之广居而大道从此出矣。", "o": "而孟子亦曰：立天下之正位，惟此正位也。以言乎其大，則足以包羅乎。天地而無外。故謂之廣居而大道從此出矣。", "i": 529}, {"t": "p", "s": "毛诗曰：秉心寒渊。", "o": "毛詩曰：秉心寒淵。", "i": 530}, {"t": "p", "s": "太玄经曰：藏心于渊，美厥<b>灵根</b>。", "o": "太玄經曰：藏心於淵，美厥<b>靈根</b>。", "i": 531}, {"t": "p", "s": "参同契曰：真人潜深渊，浮游守规中。曰塞、曰藏，潜而守之之义也。然而浮游二字不可不知也。浮游者，优游也。即孟子之所谓勿忘勿助也，释氏所谓应如是住、如是降伏其心，亦此义也。法轮自转工夫（法轮自转图）", "o": "參同契曰：真人潛深淵，浮游守規中。曰塞、曰藏，潛而守之之義也。然而浮游二字不可不知也。浮游者，優游也。即孟子之所謂勿忘勿助也，釋氏所謂應如是住、如是降伏其心，亦此義也。法輪自轉工夫（法輪自轉圖）", "i": 532}, {"t": "p", "s": "三教法门，同途异辙，迹虽分三，理则一也。如此看工夫，释家谓之法轮，道家谓之<b>周天</b>，儒家谓之行庭。", "o": "三教法門，同途異轍，跡雖分三，理則一也。如此看工夫，釋家謂之法輪，道家謂之<b>周天</b>，儒家謂之行庭。", "i": 533}, {"t": "p", "s": "易曰：艮其背不获其身，行其庭不见其人。无咎行庭者，天行健之之行也。天之行也，日一<b>周天</b>，何其健欤。若吾身亦一小天地者，<b>周天</b>之行健也。", "o": "易曰：艮其背不獲其身，行其庭不見其人。無咎行庭者，天行健之之行也。天之行也，日一<b>周天</b>，何其健歟。若吾身亦一小天地者，<b>周天</b>之行健也。", "i": 534}, {"t": "p", "s": "易曰：天行健，君子以自强不息。然吾身中之黄庭太极立焉，而天则旋乎其外而在来之不穷矣。艮曰时止则止，太极立焉。时行则行，<b>周天</b>行焉。", "o": "易曰：天行健，君子以自強不息。然吾身中之黃庭太極立焉，而天則旋乎其外而在來之不窮矣。艮曰時止則止，太極立焉。時行則行，<b>周天</b>行焉。", "i": 535}, {"t": "p", "s": "又不观之系辞乎，系辞曰：日月相推而明生焉。又曰：寒暑相推而岁成焉。又曰：屈仰相感而利生焉。此行庭之心法也。", "o": "又不觀之系辭乎，系辭曰：日月相推而明生焉。又曰：寒暑相推而歲成焉。又曰：屈仰相感而利生焉。此行庭之心法也。", "i": 536}, {"t": "p", "s": "何为立极？即前所谓心中之仁安于中心之中，而为土中者，以敦养之，自有消息真机。而身心<b>性命</b>相为混合矣。", "o": "何為立極？即前所謂心中之仁安於中心之中，而為土中者，以敦養之，自有消息真機。而身心<b>性命</b>相為混合矣。", "i": 537}, {"t": "p", "s": "一屈一伸，一往一来，真有若日月之代明，寒暑之错行，其殆天运之自然，是亦吾身之一天地也。", "o": "一屈一伸，一往一來，真有若日月之代明，寒暑之錯行，其殆天運之自然，是亦吾身之一天地也。", "i": 538}, {"t": "p", "s": "始而有意，终于无意。起初用意引气旋转由中而达外，由小而至大，口中默念十二字诀曰：白虎隐于东方，青龙潜于酉位。一句一圈，数至三十六遍而止。及至收回，从外而旋内，从大而至小，亦念诀曰：青龙潜于酉位，白虎隐于东方。亦数三十六遍，复归太极而止，是为一<b>周天</b>也。久则不必用意，自然璇机不停，法轮自转，真个有歇手不得处。", "o": "始而有意，終於無意。起初用意引氣旋轉由中而達外，由小而至大，口中默念十二字訣曰：白虎隱於東方，青龍潛於酉位。一句一圈，數至三十六遍而止。及至收回，從外而旋內，從大而至小，亦念訣曰：青龍潛於酉位，白虎隱於東方。亦數三十六遍，複歸太極而止，是為一<b>周天</b>也。久則不必用意，自然璇機不停，法輪自轉，真個有歇手不得處。", "i": 539}, {"t": "p", "s": "全阳子云：与日月而周回，同天河而轮转。轮转无穷，寿命无穷。", "o": "全陽子云：與日月而周回，同天河而輪轉。輪轉無窮，壽命無窮。", "i": 540}, {"t": "p", "s": "鸣道集云：安闲自得长生道，昼夜无声转法轮。", "o": "鳴道集云：安閒自得長生道，晝夜無聲轉法輪。", "i": 541}, {"t": "p", "s": "韩逍遥云：法轮要转常须转，只在身中人不见，驾动之时似日轮，日轮向我身中转。", "o": "韓逍遙云：法輪要轉常須轉，只在身中人不見，駕動之時似日輪，日輪向我身中轉。", "i": 542}, {"t": "p", "s": "又云：法轮转得莫停留，念念不离轮自转。", "o": "又云：法輪轉得莫停留，念念不離輪自轉。", "i": 543}, {"t": "p", "s": "当其转也，翁然如云雾之四塞，飒然如风雨之暴至，恍然如昼梦之初觉，涣然如沉疴之脱体。精神冥和，如夫妇之交接；骨肉融和，如澡浴之方起。", "o": "當其轉也，翁然如雲霧之四塞，颯然如風雨之暴至，恍然如晝夢之初覺，渙然如沉痾之脫體。精神冥和，如夫婦之交接；骨肉融和，如澡浴之方起。", "i": 544}, {"t": "p", "s": "易曰：黄中通理，正位居体，美在其中，而畅于四肢。斯言信矣。<b>龙虎</b>交媾法则（<b>龙虎</b>交媾图）", "o": "易曰：黃中通理，正位居體，美在其中，而暢於四肢。斯言信矣。<b>龍虎</b>交媾法則（<b>龍虎</b>交媾圖）", "i": 545}, {"t": "p", "s": "夫人也，<b>坎离</b>交则生，分则死，此理之必然，无一人不如此者。", "o": "夫人也，<b>坎離</b>交則生，分則死，此理之必然，無一人不如此者。", "i": 546}, {"t": "p", "s": "盖离三为阳，而居南，外阳而内阴也，谓之真汞。坎三为阴，而居北，外阴而内阳也，谓之真铅。故紫阳真人云：日居离位反为女，坎配蟾宫却是男。此言坎之男、离之女，犹父之精、母之血也；日之鸟、月之兔也；砂之汞、铅之银也；天之玄、地之黄也。此数者，皆指示<b>龙虎</b>二气也。", "o": "蓋離三為陽，而居南，外陽而內陰也，謂之真汞。坎三為陰，而居北，外陰而內陽也，謂之真鉛。故紫陽真人云：日居離位反為女，坎配蟾宮卻是男。此言坎之男、離之女，猶父之精、母之血也；日之鳥、月之兔也；砂之汞、鉛之銀也；天之玄、地之黃也。此數者，皆指示<b>龍虎</b>二氣也。", "i": 547}, {"t": "p", "s": "参同契曰：离已日光，坎戊月精。故离之已象龙之弦气也，坎之戊象虎之弦气也。夫戊与己是黄庭真土之体，因太极一判，分居<b>龙虎</b>二体之中。修丹之士，若欲返其本，复其初，使<b>龙虎</b>归于鼎中，情性归于窍内，当用龙从火里出、虎向水中生之二诀。则炎烈火中出飞龙之矫矫，泓澄水底跃走虎以耽耽，始得<b>龙虎</b>相交，向鸿蒙而潜归混沌。继则夫妻合体，从恍惚而竟入虚无、共至黄房，互相吞啖，两情留恋，二气交加，有如天地之媾精、日月之交光，盘旅于<b>祖窍</b>之间，自然复此先天未判之气而成混元真一之精。为大药之根原，作还丹之基本也。", "o": "參同契曰：離已日光，坎戊月精。故離之已象龍之弦氣也，坎之戊象虎之弦氣也。夫戊與己是黃庭真土之體，因太極一判，分居<b>龍虎</b>二體之中。修丹之士，若欲返其本，複其初，使<b>龍虎</b>歸於鼎中，情性歸於竅內，當用龍從火裏出、虎向水中生之二訣。則炎烈火中出飛龍之矯矯，泓澄水底躍走虎以耽耽，始得<b>龍虎</b>相交，向鴻蒙而潛歸混沌。繼則夫妻合體，從恍惚而竟入虛無、共至黃房，互相吞啖，兩情留戀，二氣交加，有如天地之媾精、日月之交光，盤旅於<b>祖竅</b>之間，自然複此先天未判之氣而成混元真一之精。為大藥之根原，作還丹之基本也。", "i": 548}, {"t": "p", "s": "原夫龙之情性常在于戊，虎之精性常在于已。只缘彼此各有土气，二土合并而成刀圭，是以<b>坎离</b>交而地天泰，<b>龙虎</b>交而戊合己也。<b>戊己</b>合为一体，则四象会合而产大药也。", "o": "原夫龍之情性常在於戊，虎之精性常在於已。只緣彼此各有土氣，二土合並而成刀圭，是以<b>坎離</b>交而地天泰，<b>龍虎</b>交而戊合己也。<b>戊己</b>合為一體，則四象會合而產大藥也。", "i": 549}, {"t": "p", "s": "易曰：天地氤氲，万物化醇；男女媾精，万物化生。天地以阴阳交媾而生物，丹法以阴阳交媾而生药。盖未有不交媾而用以成造化者也。", "o": "易曰：天地氤氳，萬物化醇；男女媾精，萬物化生。天地以陰陽交媾而生物，丹法以陰陽交媾而生藥。蓋未有不交媾而用以成造化者也。", "i": 550}, {"t": "p", "s": "玉芝书云：玄黄若也无交媾，争得阳从坎下飞。是乃作丹之大端，修仙之第一义也。若天地之气不氤氲，则甘露不降，<b>坎离</b>之体不灾并，则黄芽不生。<b>龙虎</b>二弦之气不会合，则真一种子不产。真一种子不产，则将何者为把柄而凝成金液大丹耶？", "o": "玉芝書云：玄黃若也無交媾，爭得陽從坎下飛。是乃作丹之大端，修仙之第一義也。若天地之氣不氤氳，則甘露不降，<b>坎離</b>之體不災並，則黃芽不生。<b>龍虎</b>二弦之氣不會合，則真一種子不產。真一種子不產，則將何者為把柄而凝成金液大丹耶？", "i": 551}, {"t": "p", "s": "然交媾之理有二，有内交者，有外交者。<b>坎离</b>、<b>龙虎</b>交，内交也，产药也。<b>乾</b><b>坤</b>子午交，外交也，结丹也。此二法天渊不同，学者有细辨之。", "o": "然交媾之理有二，有內交者，有外交者。<b>坎離</b>、<b>龍虎</b>交，內交也，產藥也。<b>乾</b><b>坤</b>子午交，外交也，結丹也。此二法天淵不同，學者有細辨之。", "i": 552}, {"t": "p", "s": "张紫阳云：既驱二物归黄道，争得<mark>金丹</mark>不解生。是此义也。", "o": "張紫陽云：既驅二物歸黃道，爭得<mark>金丹</mark>不解生。是此義也。", "i": 553}, {"t": "p", "s": "吕纯职云：二物会时为道本，五行全处得丹名。是此义也。", "o": "呂純職云：二物會時為道本，五行全處得丹名。是此義也。", "i": 554}, {"t": "p", "s": "陈抱一云：戊已乍交情性合，<b>坎离</b>才媾<b>龙虎</b>降。是此义也。", "o": "陳抱一云：戊已乍交情性合，<b>坎離</b>才媾<b>龍虎</b>降。是此義也。", "i": 555}, {"t": "p", "s": "张用成云：虎跃龙腾凤浪粗，中央正位产玄珠。是此义也。", "o": "張用成云：虎躍龍騰鳳浪粗，中央正位產玄珠。是此義也。", "i": 556}, {"t": "p", "s": "张平叔<mark>金丹</mark>四百字云：龙从东海来，虎向西山起，两兽战一场，化作一泓水。亦此义也。", "o": "張平叔<mark>金丹</mark>四百字云：龍從東海來，虎向西山起，兩獸戰一場，化作一泓水。亦此義也。", "i": 557}, {"t": "p", "s": "夫<b>龙虎</b>交媾者乃三元合一之法也，所以会<b>乾</b><b>坤</b>、交<b>坎离</b>、簇阴阳、合<b>性命</b>，使二者复变而为一。以至九宫、八卦、七政、六位、五行，四象、三才之生于二者，莫不皆归于二矣。一者，有物混成、先天地生是也。大哉！一乎！以其流行谓之炁，以其凝聚谓之精，以其妙用谓之神。", "o": "夫<b>龍虎</b>交媾者乃三元合一之法也，所以會<b>乾</b><b>坤</b>、交<b>坎離</b>、簇陰陽、合<b>性命</b>，使二者複變而為一。以至九宮、八卦、七政、六位、五行，四象、三才之生於二者，莫不皆歸於二矣。一者，有物混成、先天地生是也。大哉！一乎！以其流行謂之炁，以其凝聚謂之精，以其妙用謂之神。", "i": 558}, {"t": "p", "s": "始因太极一判分居二体之中，日远目疏，卒至危殆。是以圣人，则天地之要，知变化之源，取精于水府，召神于灵关。使归玄牝窍中，得与祖炁聚会，<span class=\"key\">三家相见</span>，合为一体。先则凝神于混沌，次则寂照含虚空。抱一无离，是为返本还原之妙道也。", "o": "始因太極一判分居二體之中，日遠目疏，卒至危殆。是以聖人，則天地之要，知變化之源，取精於水府，召神於靈關。使歸玄牝竅中，得與祖炁聚會，<span class=\"key\">三家相見</span>，合為一體。先則凝神於混沌，次則寂照含虛空。抱一無離，是為返本還原之妙道也。", "i": 559}, {"t": "p", "s": "书曰：人心惟危，道心惟微，唯精惟一，允执厥中。盖言心与精而为一，而会归于黄中之中。而允执之者，此尧舜之所以开道统之传，而为万古圣学之宗也。", "o": "書曰：人心惟危，道心惟微，唯精惟一，允執厥中。蓋言心與精而為一，而會歸於黃中之中。而允執之者，此堯舜之所以開道統之傳，而為萬古聖學之宗也。", "i": 560}, {"t": "h2", "s": "天人合发采药归壶", "o": "天人合发采药归壶", "i": 561}, {"t": "p", "s": "闻之师曰：人受天地中气以生原有真种，可以生生无穷，可以不生不灭，但人不能保守，日日消耗，卒至于亡。间知保守，又不知锻炼火法，终不坚固，易为造化所夺。苟能保守无亏，又能以火锻炼，至于凝结成丹，如金如玉，可以长生，可以不化。", "o": "聞之師曰：人受天地中氣以生原有真種，可以生生無窮，可以不生不滅，但人不能保守，日日消耗，卒至於亡。間知保守，又不知鍛煉火法，終不堅固，易為造化所奪。苟能保守無虧，又能以火鍛煉，至於凝結成丹，如金如玉，可以長生，可以不化。", "i": 562}, {"t": "p", "s": "盖欲炼此丹，虽以药物为主，欲采药物，当在根本用功。何谓根本，吾身中太极是也。", "o": "蓋欲煉此丹，雖以藥物為主，欲採藥物，當在根本用功。何謂根本，吾身中太極是也。", "i": 563}, {"t": "p", "s": "天地以混混沌沌为太极，吾身以窈窈冥冥为太极。天地以此阴阳交媾而生万物，吾身以此阴阳交媾而生大药。大药之生于身，与天地生物不异，总只是阴阳二气。二施一化而玄黄相交，一禀一受而上下相接，混而为一。故曰：混沌。混沌，乃天地之郛郭窈冥，亦是大药之胞胎也。", "o": "天地以混混沌沌為太極，吾身以窈窈冥冥為太極。天地以此陰陽交媾而生萬物，吾身以此陰陽交媾而生大藥。大藥之生於身，與天地生物不異，總只是陰陽二氣。二施一化而玄黃相交，一稟一受而上下相接，混而為一。故曰：混沌。混沌，乃天地之郛郭窈冥，亦是大藥之胞胎也。", "i": 564}, {"t": "p", "s": "南华经云：至道之精，窈窈冥冥。", "o": "南華經云：至道之精，窈窈冥冥。", "i": 565}, {"t": "p", "s": "道德经云：窈兮冥兮，其中有精。", "o": "道德經云：窈兮冥兮，其中有精。", "i": 566}, {"t": "p", "s": "其精甚真，唯此真精，乃吾身中之真种子是也。以其入于混沌，故名太极，以其为一身造化之始，故名先天，以其阴阳未分，故名一气；又名黄芽；又名玄珠；又名真铅；又名阳精。", "o": "其精甚真，唯此真精，乃吾身中之真種子是也。以其入於混沌，故名太極，以其為一身造化之始，故名先天，以其陰陽未分，故名一氣；又名黃芽；又名玄珠；又名真鉛；又名陽精。", "i": 567}, {"t": "p", "s": "此精若凝结于天地之间。或为金，或为石，历千百年而不朽。人能反身而求之，于自己阳精凝结成宝，则与天地相，为无穷金石。奚足比哉。", "o": "此精若凝結於天地之間。或為金，或為石，歷千百年而不朽。人能反身而求之，於自己陽精凝結成寶，則與天地相，為無窮金石。奚足比哉。", "i": 568}, {"t": "p", "s": "然此阳精不容易得。盖人之一身彻上彻下，凡属有形者，无非阴邪渣浊之物。故云房真人曰：四大一身皆属阴，不知何物是阳精。", "o": "然此陽精不容易得。蓋人之一身徹上徹下，凡屬有形者，無非陰邪渣濁之物。故雲房真人曰：四大一身皆屬陰，不知何物是陽精。", "i": 569}, {"t": "note", "s": "口诀引证：缘督子曰：一点阳精，秘在形山，不在心肾，而在乎<b>玄关</b>一窍。", "o": "口诀引证：緣督子曰：一點陽精，秘在形山，不在心腎，而在乎<b>玄關</b>一竅。", "i": 570}, {"t": "note", "s": "口诀引证：赵中一曰：一身内外尽皆阴，莫把阳精里面寻。", "o": "口诀引证：趙中一曰：一身內外盡皆陰，莫把陽精裏面尋。", "i": 571}, {"t": "note", "s": "口诀引证：丘长春曰：阳中虽是房中得之，而非御女之术。内非父母所生之躯，外非山林所产之宝。但著在形体上摸索皆不是，亦不可离形体而向外寻求。", "o": "口诀引证：丘長春曰：陽中雖是房中得之，而非禦女之術。內非父母所生之軀，外非山林所產之寶。但著在形體上摸索皆不是，亦不可離形體而向外尋求。", "i": 572}, {"t": "p", "s": "若此等语何异水中捞月，镜里攀花，真正智过颜闵，实难强猜，是以祖师罕言之，而世人罕知之。不独今之为然，然古人亦有难知之语。", "o": "若此等語何異水中撈月，鏡裏攀花，真正智過顏閔，實難強猜，是以祖師罕言之，而世人罕知之。不獨今之為然，然古人亦有難知之語。", "i": 573}, {"t": "p", "s": "如玉鼎真人云：五行四象坎和离，诗谈分明说与伊。药生下手功夫处，几人会得几人知。", "o": "如玉鼎真人云：五行四象坎和離，詩談分明說與伊。藥生下手功夫處，幾人會得幾人知。", "i": 574}, {"t": "p", "s": "紫阳真人云：此个事，世间稀，岂是等闲人得知？", "o": "紫陽真人云：此個事，世間稀，豈是等閒人得知？", "i": 575}, {"t": "p", "s": "杏林真人云：神气归根处，身心复命时，这些真孔窍，料得少人知。", "o": "杏林真人云：神氣歸根處，身心複命時，這些真孔竅，料得少人知。", "i": 576}, {"t": "p", "s": "伯阳真人云：一者，以掩蔽世人莫知之。一者何物也，就是那末发之中，不二之一，即前所谓先天一气是也。", "o": "伯陽真人云：一者，以掩蔽世人莫知之。一者何物也，就是那末發之中，不二之一，即前所謂先天一氣是也。", "i": 577}, {"t": "p", "s": "翠虚篇云：大药须凭神气精，采来一处结交成。丹头只是先天气，炼作黄芽发玉英。", "o": "翠虛篇云：大藥須憑神氣精，採來一處結交成。丹頭只是先天氣，煉作黃芽發玉英。", "i": 578}, {"t": "p", "s": "复命篇云：采二仪未判之气，夺<b>龙虎</b>始媾之精。闪入黄房，煆成至宝。", "o": "複命篇云：採二儀未判之氣，奪<b>龍虎</b>始媾之精。閃入黃房，煆成至寶。", "i": 579}, {"t": "p", "s": "崇正篇云：寒渊万丈睡骊龙，颔下藏珠炯炯红。谨密不惊方采得，更依时日法神功。", "o": "崇正篇云：寒淵萬丈睡驪龍，頷下藏珠炯炯紅。謹密不驚方採得，更依時日法神功。", "i": 580}, {"t": "p", "s": "盖采者，以不采而采之，取者以不取而取之，在于静定中有非动作可为也。昔黄帝遗其玄珠，使知索，使离珠索，使吃诟索，索之皆不得，乃使罔象，罔象得之。罔象者，忘形之谓也。必忘形罔象，然后先天一气可得。", "o": "蓋採者，以不採而採之，取者以不取而取之，在於靜定中有非動作可為也。昔黃帝遺其玄珠，使知索，使離珠索，使吃詬索，索之皆不得，乃使罔象，罔象得之。罔象者，忘形之謂也。必忘形罔象，然後先天一氣可得。", "i": 581}, {"t": "p", "s": "击琅集先天吟云：一片先天号太虚，当其无事见真腴。", "o": "擊琅集先天吟云：一片先天號太虛，當其無事見真腴。", "i": 582}, {"t": "p", "s": "又云：若问先天一字无，后天方要著工夫。", "o": "又云：若問先天一字無，後天方要著工夫。", "i": 583}, {"t": "p", "s": "何谓先天？寂然不动，窈窈冥冥，太极未判之时是也。何谓后天？感而遂通，恍恍惚惚，太极已判之时是也。", "o": "何謂先天？寂然不動，窈窈冥冥，太極未判之時是也。何謂後天？感而遂通，恍恍惚惚，太極已判之時是也。", "i": 584}, {"t": "p", "s": "混元宝章云：寂然不动感而通，窥见阴阳造化功。信乎，寂然不动，则心与天通而造化可夺也。", "o": "混元寶章云：寂然不動感而通，窺見陰陽造化功。信乎，寂然不動，則心與天通而造化可奪也。", "i": 585}, {"t": "p", "s": "翠虚篇云：莫向肾中求造化，却烦心里觅先天。", "o": "翠虛篇云：莫向腎中求造化，卻煩心裏覓先天。", "i": 586}, {"t": "p", "s": "当其喜怒未发之时，睹闻不及之地，河海默然，山岳藏烟，日月停景，璇玑不行，八脉归源，呼吸俱泯，既深入于窈冥之中，竟不知天之为盖，地之为舆，亦不知世之有人，己之有躯。少焉，三宫气满，机动簌鸣，则一剑凿开混沌，两手擘裂鸿蒙，是谓无中生有。", "o": "當其喜怒未發之時，睹聞不及之地，河海默然，山嶽藏煙，日月停景，璇璣不行，八脈歸源，呼吸俱泯，既深入於窈冥之中，竟不知天之為蓋，地之為輿，亦不知世之有人，己之有軀。少焉，三宮氣滿，機動簌鳴，則一劍鑿開混沌，兩手擘裂鴻蒙，是謂無中生有。", "i": 587}, {"t": "p", "s": "宁玄子诗云：不在尘劳不在山，直须求到穹冥端。何谓穹冥端？虚极静笃之时也。心中无物为虚，念头不起为静。致虚而至于极，守静而至于笃，阴阳自然交媾。阴阳一交，而阳精产矣。", "o": "寧玄子詩云：不在塵勞不在山，直須求到穹冥端。何謂穹冥端？虛極靜篤之時也。心中無物為虛，念頭不起為靜。致虛而至於極，守靜而至於篤，陰陽自然交媾。陰陽一交，而陽精產矣。", "i": 588}, {"t": "p", "s": "故陈图南曰：留得阳精，神仙现成。盖阳梢日日发生，但世人不知翕聚，以致错而为周身之气。至人以法追摄，聚而结一黍之珠。释氏呼为菩提，仙家名曰真种。修性者若不识这个善提子，即圆觉经所谓种性外道是也。修命者若不识这个真种子，即玉华经所谓枯坐旁门是也。", "o": "故陳圖南曰：留得陽精，神仙現成。蓋陽梢日日發生，但世人不知翕聚，以致錯而為周身之氣。至人以法追攝，聚而結一黍之珠。釋氏呼為菩提，仙家名曰真種。修性者若不識這個善提子，即圓覺經所謂種性外道是也。修命者若不識這個真種子，即玉華經所謂枯坐旁門是也。", "i": 589}, {"t": "note", "s": "口诀引证：张紫阳曰：大道修之有易难也，知由我，也由天。人若不知药生，不知采取，不知烹炼，但见其难，不见其易。诚知药生时候，采取口诀，烹炼功夫，但见其易，不见其难。此两者在人遇师与不遇师耳。故曰：月之圆存乎口诀，时之子妙在心传。然时之子，却有两说，有个活子时，有个正子时。", "o": "口诀引证：張紫陽曰：大道修之有易難也，知由我，也由天。人若不知藥生，不知採取，不知烹煉，但見其難，不見其易。誠知藥生時候，採取口訣，烹煉功夫，但見其易，不見其難。此兩者在人遇師與不遇師耳。故曰：月之圓存乎口訣，時之子妙在心傳。然時之子，卻有兩說，有個活子時，有個正子時。", "i": 590}, {"t": "p", "s": "昔闻尹师曰：欲求大药为丹本，须认身中活子时。", "o": "昔聞尹師曰：欲求大藥為丹本，須認身中活子時。", "i": 591}, {"t": "p", "s": "又偈云：", "o": "又偈云：", "i": 592}, {"t": "p", "s": "因读<mark>金丹</mark>序，方知玄牝窍。因读入药镜，只知意所到。", "o": "因讀<mark>金丹</mark>序，方知玄牝竅。因讀入藥鏡，只知意所到。", "i": 593}, {"t": "p", "s": "大道有阴阳，阴阳随动静。静则入窈冥，动则恍惚应。", "o": "大道有陰陽，陰陽隨動靜。靜則入窈冥，動則恍惚應。", "i": 594}, {"t": "p", "s": "真土分<b>戊己</b>，戊已不同时。已到但自然，成到有作为。", "o": "真土分<b>戊己</b>，戊已不同時。已到但自然，成到有作為。", "i": 595}, {"t": "p", "s": "烹炼坎中铅，配合离中汞。<b>铅汞</b>结丹砂，身心方入定。", "o": "烹煉坎中鉛，配合離中汞。<b>鉛汞</b>結丹砂，身心方入定。", "i": 596}, {"t": "p", "s": "曰动静，曰窈冥，曰真土，皆是发明活子时之口诀也云。", "o": "曰動靜，曰窈冥，曰真土，皆是發明活子時之口訣也云。", "i": 597}, {"t": "p", "s": "何谓之动静？曰寂然不动，返本复静<b>坤</b>之时也，吾则静以待之。静极而动，阳气潜萌复之时也，菩则动以应之。当动而或杂之以静，当静而或间之以动，或助长于其先，或忘失于其后，则皆非动静之常矣。", "o": "何謂之動靜？曰寂然不動，返本複靜<b>坤</b>之時也，吾則靜以待之。靜極而動，陽氣潛萌複之時也，菩則動以應之。當動而或雜之以靜，當靜而或間之以動，或助長於其先，或忘失於其後，則皆非動靜之常矣。", "i": 598}, {"t": "p", "s": "夫古之至人，其动也，天行其静也。渊默当动则动，当静则静，自有常法。今之学者，不知丹法之动静有常。或专主乎动，或专主乎静。其所谓动者，乃行气之动；其所谓静者，乃禅定之静。二者胥失之矣。", "o": "夫古之至人，其動也，天行其靜也。淵默當動則動，當靜則靜，自有常法。今之學者，不知丹法之動靜有常。或專主乎動，或專主乎靜。其所謂動者，乃行氣之動；其所謂靜者，乃禪定之靜。二者胥失之矣。", "i": 599}, {"t": "p", "s": "指玄篇不云乎：人人气血本通流，荣卫阴阳百刻周，岂在闭门学行气，正如头上又安头。曷尝以行气为动哉。", "o": "指玄篇不云乎：人人氣血本通流，榮衛陰陽百刻周，豈在閉門學行氣，正如頭上又安頭。曷嘗以行氣為動哉。", "i": 600}, {"t": "p", "s": "翠虚篇不云乎：唯此<b>乾</b><b>坤</b>真运用，不必兀兀徒无言，无心无念头已昏，安得凝聚成胎仙？岂以禅定为静哉。", "o": "翠虛篇不云乎：唯此<b>乾</b><b>坤</b>真運用，不必兀兀徒無言，無心無念頭已昏，安得凝聚成胎仙？豈以禪定為靜哉。", "i": 601}, {"t": "p", "s": "凡人动极而静，自然入于窈冥。窃冥即是寐时，虽入于无天、无地、无我、无人境界，却不涉于梦境。若一涉梦境，即有喜怒、惊恐、烦恼、悲欢、爱欲种种情况，与昼间无异，且与穹冥时无天、无地、无人、无我景绝不相似。似窈窈冥冥，唯昼间动极思静，有此景象，若夜间睡熟，必生梦境。安得有此？昼间每有窈冥时候，人多以纷华念虑害之而求其时入窈冥者，盖亦鲜矣。", "o": "凡人動極而靜，自然入於窈冥。竊冥即是寐時，雖入於無天、無地、無我、無人境界，卻不涉於夢境。若一涉夢境，即有喜怒、驚恐、煩惱、悲歡、愛欲種種情況，與晝間無異，且與穹冥時無天、無地、無人、無我景絕不相似。似窈窈冥冥，唯晝間動極思靜，有此景象，若夜間睡熟，必生夢境。安得有此？晝間每有窈冥時候，人多以紛華念慮害之而求其時入窈冥者，蓋亦鮮矣。", "i": 602}, {"t": "p", "s": "崔公入药镜云：一日内，十二时，意所到，皆可为。一日之内，意到不止一次，来药亦不止一次。张平叔所谓一粒复一粒，从微而至著是也。", "o": "崔公入藥鏡云：一日內，十二時，意所到，皆可為。一日之內，意到不止一次，來藥亦不止一次。張平叔所謂一粒複一粒，從微而至著是也。", "i": 603}, {"t": "p", "s": "大抵药物，当以真意求之，故曰：好把真铅著意寻。又日：恒向华池著意寻。盖人身真意，是为真土。真土之生有时，不由感触，自然发生，虽与中马上一切喧闹之地不能禁止，故曰真土。具土有二，戊已是也。土既有二，则意亦有二必矣。所谓二者，一阳一阴是也。谓之真者，无一毫强伪，若有一毫强与伪，即是用心揆度谋虑，便属虚假，非真意也。", "o": "大抵藥物，當以真意求之，故曰：好把真鉛著意尋。又日：恆向華池著意尋。蓋人身真意，是為真土。真土之生有時，不由感觸，自然發生，雖與中馬上一切喧鬧之地不能禁止，故曰真土。具土有二，戊已是也。土既有二，則意亦有二必矣。所謂二者，一陽一陰是也。謂之真者，無一毫強偽，若有一毫強與偽，即是用心揆度謀慮，便屬虛假，非真意也。", "i": 604}, {"t": "p", "s": "有此真意，真铅方生。何谓有此真意？真铅方生？盖动极而静，真意一到，则人窈冥，此意属阴，是谓己土。阴阳交媾，正当一阳爻动之时，自觉心花发现，暖气冲融，阴阳年交，真精自生，真精即是真铅，所谓水乡铅，只一味是也。", "o": "有此真意，真鉛方生。何謂有此真意？真鉛方生？蓋動極而靜，真意一到，則人窈冥，此意屬陰，是謂己土。陰陽交媾，正當一陽爻動之時，自覺心花發現，暖氣衝融，陰陽年交，真精自生，真精即是真鉛，所謂水鄉鉛，只一味是也。", "i": 605}, {"t": "p", "s": "阴阳交媾，将判未判，恍恍惚惚，乃是静极而动，此意属阳，是为戊土。此时真铅微露，药苗新嫩，此乃有物有象之时，与平旦几希一般。拨动关户，急忙用功采取，则窈冥所生真精方无走失。", "o": "陰陽交媾，將判未判，恍恍惚惚，乃是靜極而動，此意屬陽，是為戊土。此時真鉛微露，藥苗新嫩，此乃有物有象之時，與平旦幾希一般。撥動關戶，急忙用功採取，則窈冥所生真精方無走失。", "i": 606}, {"t": "p", "s": "所谓采取功夫，即达摩祖师形解诀，海蟾祖初乘诀。二诀大略相同，不外乎吸舐撮闭四宇。纯阳祖师云：窈窈冥冥生恍惚，恍恍惚惚结成团。正是此诀。虽则是有为之法，然非真土，一生何以施功？是非采铅。由于真土生也，故曰真土擒真铅。铅升与汞配合，汞得铅自不飞走，故曰真铅制真汞。<b>铅汞</b>既即真土，则身心自尔寂然不动，而<mark>金丹</mark>大药结矣。", "o": "所謂採取功夫，即達摩祖師形解訣，海蟾祖初乘訣。二訣大略相同，不外乎吸舐撮閉四宇。純陽祖師云：窈窈冥冥生恍惚，恍恍惚惚結成團。正是此訣。雖則是有為之法，然非真土，一生何以施功？是非採鉛。由於真土生也，故曰真土擒真鉛。鉛升與汞配合，汞得鉛自不飛走，故曰真鉛制真汞。<b>鉛汞</b>既即真土，則身心自爾寂然不動，而<mark>金丹</mark>大藥結矣。", "i": 607}, {"t": "p", "s": "是以一时之内，自有一阳来复之机。是机也，不在冬至，不在朔旦，亦不在子时，非深达天地阴阳、而晓身中造化者，莫如活子时如是其秘也。既曰一日十二时，凡相媾处皆可为，而古仙必用半夜子阳初动之时者，何也？其时太阳正在北方，而人身气到尾闾关，盖与天地相应，乃可以盗天地之机，夺阴阳之妙，炼魂魄而为一，合<b>性命</b>而双修。唯此时乃<b>坤</b>复之间，天地开辟于此时，日月合壁于此时，草木萌孽于此时，人身之阴阳交会于此时，神仙于此时而采药，则内真外应，若合符节，乃天人合发之机，至妙至妙者也。", "o": "是以一時之內，自有一陽來複之機。是機也，不在冬至，不在朔旦，亦不在子時，非深達天地陰陽、而曉身中造化者，莫如活子時如是其秘也。既曰一日十二時，凡相媾處皆可為，而古仙必用半夜子陽初動之時者，何也？其時太陽正在北方，而人身氣到尾閭關，蓋與天地相應，乃可以盜天地之機，奪陰陽之妙，煉魂魄而為一，合<b>性命</b>而雙修。唯此時乃<b>坤</b>複之間，天地開闢於此時，日月合壁於此時，草木萌孽於此時，人身之陰陽交會於此時，神仙於此時而採藥，則內真外應，若合符節，乃天人合發之機，至妙至妙者也。", "i": 608}, {"t": "p", "s": "陈泥丸云：每当天地交合时，盗取阴阳造化机。", "o": "陳泥丸云：每當天地交合時，盜取陰陽造化機。", "i": 609}, {"t": "p", "s": "阴符经云；食其时，百骸埋；盗其机，万化安。何者谓之机？天根理极，微今年初尽处时，日起头时，此际易得，意其间难下词。人能知此意，何事不能知？此际正是造化真机妙处。尽真机之妙者，周易也。尽周易之妙者，复卦也。尽复卦之妙者，初爻也。故曰复其见天地之心乎？", "o": "陰符經云；食其時，百骸埋；盜其機，萬化安。何者謂之機？天根理極，微今年初盡處時，日起頭時，此際易得，意其間難下詞。人能知此意，何事不能知？此際正是造化真機妙處。盡真機之妙者，周易也。盡周易之妙者，複卦也。盡複卦之妙者，初爻也。故曰複其見天地之心乎？", "i": 610}, {"t": "p", "s": "盖此时，天地一阳来复，而吾身之天地亦然，内以采取吾身之阳，外以盗取天地之阳，则天地之阳有不悉归于我之身中而为我之药物乎？然而天地虽大，造化虽妙，亦不能越此发机之外矣，此感彼应理之自然。", "o": "蓋此時，天地一陽來複，而吾身之天地亦然，內以採取吾身之陽，外以盜取天地之陽，則天地之陽有不悉歸於我之身中而為我之藥物乎？然而天地雖大，造化雖妙，亦不能越此發機之外矣，此感彼應理之自然。", "i": 611}, {"t": "p", "s": "人若知此天人合发之机，遂于中夜静坐，凝神聚气，收视返听，闭塞其兑，筑固灵株，一念不生，万缘顿息。浑浑沦沦，如太极之未分；溟溟沁沁，如两仪之未兆。湛兮！独存如清渊之印月，寂然不动；如止水之无波，内不觉，其一身外不知其宇宙。夫亥之末，子之初，天地之阳气至则急采之，未至则虚以待之，不敢为之先也。", "o": "人若知此天人合發之機，遂於中夜靜坐，凝神聚氣，收視返聽，閉塞其兌，築固靈株，一念不生，萬緣頓息。渾渾淪淪，如太極之未分；溟溟沁沁，如兩儀之未兆。湛兮！獨存如清淵之印月，寂然不動；如止水之無波，內不覺，其一身外不知其宇宙。夫亥之末，子之初，天地之陽氣至則急採之，未至則虛以待之，不敢為之先也。", "i": 612}, {"t": "p", "s": "屈原远游篇云；", "o": "屈原遠游篇云；", "i": 613}, {"t": "p", "s": "道可受兮，不可传。", "o": "道可受兮，不可傳。", "i": 614}, {"t": "p", "s": "其小无外兮，其大无限。母滑而魂兮，彼将自然。", "o": "其小無外兮，其大無限。母滑而魂兮，彼將自然。", "i": 615}, {"t": "p", "s": "一气孔神兮，于中夜存。虚以待之兮，无为之先。", "o": "一氣孔神兮，於中夜存。虛以待之兮，無為之先。", "i": 616}, {"t": "p", "s": "许旌阳三药歌云：存心绝虑候晶凝。", "o": "許旌陽三藥歌云：存心絕慮候晶凝。", "i": 617}, {"t": "p", "s": "指玄篇云：塞兑垂帘默默窥。皆是藏器待时之谓也。呜呼！时辰若至不劳心，内自相交自结凝。八室按时须等著，一轮曦驭自腾升。岂可为之先也哉。", "o": "指玄篇云：塞兌垂簾默默窺。皆是藏器待時之謂也。嗚呼！時辰若至不勞心，內自相交自結凝。八室按時須等著，一輪曦馭自騰升。豈可為之先也哉。", "i": 618}, {"t": "p", "s": "夫<mark>金丹</mark>大药，孕于先天，产于后天，其妙在乎太极将判未判之间。静已极而未至于动，阳将复而未离乎阴。斯时也，冥冥兮，如烟岚之罩山，蒙蒙兮，如雾气之笼水，霏霏兮，如冬雪之渐凝渐聚；沉沉兮，如浆水之渐碇渐清。俄顷，痒生毫窍，肢体如绵，心觉恍惚，而阳物勃然举矣。此时阳气通天，信至则琼钟一扣，玉洞双开，时至气化，药产神知，地雷震动巽门开，龙向东潭踊跃来。此时<b>玄关</b>透露而精金出矿之时矣。", "o": "夫<mark>金丹</mark>大藥，孕於先天，產於後天，其妙在乎太極將判未判之間。靜已極而未至於動，陽將複而未離乎陰。斯時也，冥冥兮，如煙嵐之罩山，蒙蒙兮，如霧氣之籠水，霏霏兮，如冬雪之漸凝漸聚；沉沉兮，如漿水之漸碇漸清。俄頃，癢生毫竅，肢體如綿，心覺恍惚，而陽物勃然舉矣。此時陽氣通天，信至則瓊鐘一扣，玉洞雙開，時至氣化，藥產神知，地雷震動巽門開，龍向東潭踊躍來。此時<b>玄關</b>透露而精金出礦之時矣。", "i": 619}, {"t": "p", "s": "邵康节云：恍惚阴阳初变化，氤氲天地三回旋。中间些子好光景，安得功夫入语言。", "o": "邵康節云：恍惚陰陽初變化，氤氳天地三回旋。中間些子好光景，安得功夫入語言。", "i": 620}, {"t": "p", "s": "白玉蟾云：因看斗柄运<b>周天</b>，顿悟神仙妙诀。一点真阳生坎位，补却离宫之缺。自古神仙，这些离坎日日无休歇。今年冬至，梅花依旧凝雪。", "o": "白玉蟾云：因看斗柄運<b>周天</b>，頓悟神仙妙訣。一點真陽生坎位，補卻離宮之缺。自古神仙，這些離坎日日無休歇。今年冬至，梅花依舊凝雪。", "i": 621}, {"t": "p", "s": "先圣此日闭关，不通来往，皆为群生设物。物总含生育意，正在子初亥末，造物无声，水中火起，妙在虚危穴。如今识破，金鸟飞人蟾窟。所谓虚危穴者，即地户禁门是也。其穴在于任督二脉中间，上通天谷，下达涌泉。故先圣有言：天门当开，地户永闭。盖精气聚散常在此处，水火发端也在此处，阴阳变化也在此处，有无入也在此处，子母分胎也在此处。", "o": "先聖此日閉關，不通來往，皆為群生設物。物總含生育意，正在子初亥末，造物無聲，水中火起，妙在虛危穴。如今識破，金鳥飛人蟾窟。所謂虛危穴者，即地戶禁門是也。其穴在於任督二脈中間，上通天谷，下達湧泉。故先聖有言：天門當開，地戶永閉。蓋精氣聚散常在此處，水火發端也在此處，陰陽變化也在此處，有無入也在此處，子母分胎也在此處。", "i": 622}, {"t": "p", "s": "翠虚篇云：有一子母分胎路，妙在尾箕斗牛女。此穴千涉最大，系人生死岸头，故仙家名为生死窟。", "o": "翠虛篇云：有一子母分胎路，妙在尾箕斗牛女。此穴千涉最大，系人生死岸頭，故仙家名為生死窟。", "i": 623}, {"t": "p", "s": "参同契云：筑固灵采者此也，拘束禁门者此也。", "o": "參同契云：築固靈採者此也，拘束禁門者此也。", "i": 624}, {"t": "p", "s": "黄庭经云：闭塞命门保玉都者，此也，闭了精路可长活者此也。", "o": "黃庭經云：閉塞命門保玉都者，此也，閉了精路可長活者此也。", "i": 625}, {"t": "p", "s": "益真阳初生之时，形如烈火，状似炎风，斩关透路而出，必由此穴经过。因闭塞紧密，攻击不开，只得驱回尾闾，连空焰起人天衢，望上奔，一撞<b>三关</b>，直透顶门，得与真汞配合，结成丹砂。非拘束禁门之功而谁欤。", "o": "益真陽初生之時，形如烈火，狀似炎風，斬關透路而出，必由此穴經過。因閉塞緊密，攻擊不開，只得驅回尾閭，連空焰起人天衢，望上奔，一撞<b>三關</b>，直透頂門，得與真汞配合，結成丹砂。非拘束禁門之功而誰歟。", "i": 626}, {"t": "p", "s": "吕组纯阳文集中之口诀：", "o": "呂組純陽文集中之口訣：", "i": 627}, {"t": "p", "s": "无中出有还
