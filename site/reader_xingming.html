顶上飞也。闭者，塞兑垂帘兼逆听，久而神水落黄庭也。", "o": "何謂聚火之法？此法即達摩、海蟾二祖師吸、舐，撮、閉四字訣是也。吸者，鼻中吸氣以接先天也。舐者，舌拄上齶以迎甘露也。撮者，緊攝谷道內中提，明月輝輝頂上飛也。閉者，塞兌垂簾兼逆聽，久而神水落黃庭也。", "i": 750}, {"t": "p", "s": "胡翠湖云：下不闭则火不聚而金不升，上不闭则药不凝而丹不结。是以聚火之法，乃采取烹炼之先务也。其恍恍惚惚是采取时候，猛烹极炼是采取功夫，吸、舐、撮、闭又是烹炼之的旨也。", "o": "胡翠湖云：下不閉則火不聚而金不升，上不閉則藥不凝而丹不結。是以聚火之法，乃採取烹煉之先務也。其恍恍惚惚是採取時候，猛烹極煉是採取功夫，吸、舐、撮、閉又是烹煉之的旨也。", "i": 751}, {"t": "p", "s": "夫采取之法，贵乎知时，不可太早，太早则药嫩易升。亦不可太迟，太迟则药老成质。必铅华吐白，玄珠成象，方是采取时节。", "o": "夫採取之法，貴乎知時，不可太早，太早則藥嫩易升。亦不可太遲，太遲則藥老成質。必鉛華吐白，玄珠成象，方是採取時節。", "i": 752}, {"t": "p", "s": "张紫阳云：铅遇癸生须急采，金逢望远不堪尝。", "o": "張紫陽云：鉛遇癸生須急採，金逢望遠不堪嘗。", "i": 753}, {"t": "p", "s": "张三峰云：电光炼处寻真种，风信来时觅本宗。", "o": "張三峰云：電光煉處尋真種，風信來時覓本宗。", "i": 754}, {"t": "p", "s": "电光炼处，则穹冥之后，恍惚之间，一阳爻动之时，珠落毕池之际。此时节用参同契拘束禁门诀，紧塞太玄，闭任开督。即忙鼓之以橐龠，吹之以巽风，煆之以猛火。火炽则水沸，水沸则驾动河车，载金上升，泥丸与真汞配合，汞得铅降，亦不飞走。如此渐渐抽添，渐渐凝结，自然铅日减，汞日添。久之铅尽汞自<b>乾</b>，阴尽阳自纯，至此则<mark>金丹</mark>大药成矣。", "o": "電光煉處，則穹冥之後，恍惚之間，一陽爻動之時，珠落畢池之際。此時節用參同契拘束禁門訣，緊塞太玄，閉任開督。即忙鼓之以橐龠，吹之以巽風，煆之以猛火。火熾則水沸，水沸則駕動河車，載金上升，泥丸與真汞配合，汞得鉛降，亦不飛走。如此漸漸抽添，漸漸凝結，自然鉛日減，汞日添。久之鉛盡汞自<b>乾</b>，陰盡陽自純，至此則<mark>金丹</mark>大藥成矣。", "i": 755}, {"t": "p", "s": "炼此大药，别无他术，只是采取先天一点祖炁，以为<mark>金丹</mark>之母耳。受之师曰：炼大梵之祖炁，飞时后之金晶，存帝一之妙相，返三素于黄庭。此是口诀中之口诀也。", "o": "煉此大藥，別無他術，只是採取先天一點祖炁，以為<mark>金丹</mark>之母耳。受之師曰：煉大梵之祖炁，飛時後之金晶，存帝一之妙相，返三素於黃庭。此是口訣中之口訣也。", "i": 756}, {"t": "p", "s": "学者徒知以<b>铅汞</b>交结为丹，而不知采取、抽添、烹炼、<b>火候</b>各有次序法度。盖采取以作其始，抽添以成其终，于中调停，全仗<b>火候</b>。", "o": "學者徒知以<b>鉛汞</b>交結為丹，而不知採取、抽添、烹煉、<b>火候</b>各有次序法度。蓋採取以作其始，抽添以成其終，於中調停，全仗<b>火候</b>。", "i": 757}, {"t": "p", "s": "所以紫阳云：", "o": "所以紫陽云：", "i": 758}, {"t": "p", "s": "纵识朱砂及黑铅，不知<b>火候</b>也如闲。", "o": "縱識朱砂及黑鉛，不知<b>火候</b>也如閒。", "i": 759}, {"t": "p", "s": "朱晦翁云：", "o": "朱晦翁云：", "i": 760}, {"t": "p", "s": "神仙不作参同契，<b>火候</b>工夫哪得知。", "o": "神仙不作參同契，<b>火候</b>工夫哪得知。", "i": 761}, {"t": "p", "s": "薛道光云：", "o": "薛道光云：", "i": 762}, {"t": "p", "s": "圣人传药不传火，从来<b>火候</b>少人知。莫将大道为儿戏，须其神仙仔细推。", "o": "聖人傳藥不傳火，從來<b>火候</b>少人知。莫將大道為兒戲，須其神仙仔細推。", "i": 763}, {"t": "p", "s": "<b>火候</b>之法，有文有武，不可一律齐也。静中阳动，金离矿地，下雷轰，火逼金。此第四节之<b>火候</b>也。谩守药炉看<b>火候</b>，但安神息任天然。此第六节之<b>火候</b>也。阳文阴武无令失，进退抽添有驭持。此第五节之<b>火候</b>也。成性存存者，儒家之<b>火候</b>也。绵绵若存者，道家之<b>火候</b>也。不得勤、不得怠者，释家之<b>火候</b>也。三月不违者，颜子之<b>火候</b>也。吾日三省者，曾子之<b>火候</b>也。日知其所亡，月无忘其所能者，夏之<b>火候</b>也。戒慎乎，其所不睹；恐惧乎，其所不闻，子思之<b>火候</b>也。必有事焉而无正心，勿忘而勿助长者，孟子之<b>火候</b>也。发愤忘食，孔子之武火也。乐以忘忧，孔子之文火也。不知老之将至云尔者，至诚无息而<b>火候</b>纯也。<b>火候</b>纯，大丹成，而作圣之功毕也。", "o": "<b>火候</b>之法，有文有武，不可一律齊也。靜中陽動，金離礦地，下雷轟，火逼金。此第四節之<b>火候</b>也。謾守藥爐看<b>火候</b>，但安神息任天然。此第六節之<b>火候</b>也。陽文陰武無令失，進退抽添有馭持。此第五節之<b>火候</b>也。成性存存者，儒家之<b>火候</b>也。綿綿若存者，道家之<b>火候</b>也。不得勤、不得怠者，釋家之<b>火候</b>也。三月不違者，顏子之<b>火候</b>也。吾日三省者，曾子之<b>火候</b>也。日知其所亡，月無忘其所能者，夏之<b>火候</b>也。戒慎乎，其所不睹；恐懼乎，其所不聞，子思之<b>火候</b>也。必有事焉而無正心，勿忘而勿助長者，孟子之<b>火候</b>也。發憤忘食，孔子之武火也。樂以忘憂，孔子之文火也。不知老之將至云爾者，至誠無息而<b>火候</b>純也。<b>火候</b>純，大丹成，而作聖之功畢也。", "i": 764}, {"t": "h2", "s": "乾坤交媾去矿留金", "o": "乾坤交媾去矿留金", "i": 765}, {"t": "p", "s": "予前以<b>性命</b>之统乎其中者而言之，乃上乘法也。予今以<b>性命</b>之归乎其根者而言之，乃最上乘法也。", "o": "予前以<b>性命</b>之統乎其中者而言之，乃上乘法也。予今以<b>性命</b>之歸乎其根者而言之，乃最上乘法也。", "i": 766}, {"t": "p", "s": "夫以<b>性命</b>之统乎其中者，此道寥寥，自钟吕而下世鲜知矣。况乎<b>性命</b>之归乎其根者耶，而世之知之者为尤鲜矣。似此窍妙之奥、<b>性命</b>之微，若不复语重言，则学者难于悟入。", "o": "夫以<b>性命</b>之統乎其中者，此道寥寥，自鐘呂而下世鮮知矣。況乎<b>性命</b>之歸乎其根者耶，而世之知之者為尤鮮矣。似此竅妙之奧、<b>性命</b>之微，若不複語重言，則學者難於悟入。", "i": 767}, {"t": "p", "s": "原人自父母之生以前，本体太虚而已矣。其余之所谓无极者乎？既而父母媾精，而后一点灵光而已矣。其余之所谓太极者乎？而一点灵光，原从太极中来者，我之<mark>元神</mark>也。由是而气，由是而形，唯知有此形气已尔。美衣美食以奉养此身也，功名富贵以尊崇此身也。如此而生，如此而死，自以为得矣。而子思之所谓天命之性者，非唯不能知，亦且不愿知也。而其所以不愿知者，岂非孟子所谓不可以已而失其本心者乎？", "o": "原人自父母之生以前，本體太虛而已矣。其餘之所謂無極者乎？既而父母媾精，而後一點靈光而已矣。其餘之所謂太極者乎？而一點靈光，原從太極中來者，我之<mark>元神</mark>也。由是而氣，由是而形，唯知有此形氣已爾。美衣美食以奉養此身也，功名富貴以尊崇此身也。如此而生，如此而死，自以為得矣。而子思之所謂天命之性者，非唯不能知，亦且不願知也。而其所以不願知者，豈非孟子所謂不可以已而失其本心者乎？", "i": 768}, {"t": "p", "s": "若能知所以，反而求之，以复还我太虚一炁之本初，一点灵光之旧物者，非此<mark>金丹</mark>大道不可也。", "o": "若能知所以，反而求之，以複還我太虛一炁之本初，一點靈光之舊物者，非此<mark>金丹</mark>大道不可也。", "i": 769}, {"t": "p", "s": "然而<mark>金丹</mark>大道之秘密在<b>性命</b>两字。性者，天也，常潜于鼎，故顶者，性之根也。命者，海也，常潜于脐，故脐者，命之带也。经云：性在天边，命在海底是也。", "o": "然而<mark>金丹</mark>大道之秘密在<b>性命</b>兩字。性者，天也，常潛於鼎，故頂者，性之根也。命者，海也，常潛於臍，故臍者，命之帶也。經云：性在天邊，命在海底是也。", "i": 770}, {"t": "p", "s": "盖天中之窍圆而藏性，能通于地中之窍。故其贯也则自上而下，直养而无害也。地中之窍方而藏命，能通于天中之窍，故其贯也则自下而上，直养而无害也。", "o": "蓋天中之竅圓而藏性，能通於地中之竅。故其貫也則自上而下，直養而無害也。地中之竅方而藏命，能通於天中之竅，故其貫也則自下而上，直養而無害也。", "i": 771}, {"t": "note", "s": "口诀引证：孔子曰：智者，动天圆之象也。仁者，静地方之象也。天圆者何？圆陀之义也。乃性之所寄，为命之根矣。地方者何？方寸之义也。乃命之所系，为性之根也。<b>性命</b>混成，实非有两，潜天而天，潜地而地，优优洋洋，无体无方。在眼日见，在耳日闻，在鼻辨香，在口谈论，在手执捉，在足运奔。悟者知是佛性，迷者唤作精魂。", "o": "口诀引证：孔子曰：智者，動天圓之象也。仁者，靜地方之象也。天圓者何？圓陀之義也。乃性之所寄，為命之根矣。地方者何？方寸之義也。乃命之所系，為性之根也。<b>性命</b>混成，實非有兩，潛天而天，潛地而地，優優洋洋，無體無方。在眼日見，在耳日聞，在鼻辨香，在口談論，在手執捉，在足運奔。悟者知是佛性，迷者喚作精魂。", "i": 772}, {"t": "p", "s": "盖怫性者，本性也。而所谓本性者，岂非是我本来之所自有之真性欤。真性者，天命之性也。以其不落边际，故谓之中。以其一直无妄，故谓之诚。以其与物同体，故谓之仁。以其至尊无对，故谓之独。混沦一个，无欠无余。及乎太极一判，两仪始分，则轻清者腾而在上，重浊者碇而在下。于是坎宫有铅，离官有汞，而向之所谓一物分为二，能知二者名。", "o": "蓋怫性者，本性也。而所謂本性者，豈非是我本來之所自有之真性歟。真性者，天命之性也。以其不落邊際，故謂之中。以其一直無妄，故謂之誠。以其與物同體，故謂之仁。以其至尊無對，故謂之獨。混淪一個，無欠無餘。及乎太極一判，兩儀始分，則輕清者騰而在上，重濁者碇而在下。於是坎宮有鉛，離官有汞，而向之所謂一物分為二，能知二者名。", "i": 773}, {"t": "p", "s": "这二者之名，丹经不敢漏泄，巧喻多端，万字千名，不可胜计。如论顶中之性者，喻之曰汞也、龙也、火也、根也、日也、魂也、离也、<b>乾</b>也、己也、天也、君也、虚也、兔也、无也、主也、浮也、朱砂也、扶桑也、姹女也、昆仑也；如论脐中之命者，喻之曰铅也、虎也、水也、蒂也、月也、魄也、坎也、<b>坤</b>也、戊也、地也、臣也、实也、乌也、有也、宾也、沉也、水银也、华岳也、<b>婴儿</b>也、曲江也。至于阴中含阳，阳中藏阴，千言万论，不过引喻二者之名耳。", "o": "這二者之名，丹經不敢漏洩，巧喻多端，萬字千名，不可勝計。如論頂中之性者，喻之曰汞也、龍也、火也、根也、日也、魂也、離也、<b>乾</b>也、己也、天也、君也、虛也、兔也、無也、主也、浮也、朱砂也、扶桑也、奼女也、昆崙也；如論臍中之命者，喻之曰鉛也、虎也、水也、蒂也、月也、魄也、坎也、<b>坤</b>也、戊也、地也、臣也、實也、烏也、有也、賓也、沉也、水銀也、華嶽也、<b>嬰兒</b>也、曲江也。至於陰中含陽，陽中藏陰，千言萬論，不過引喻二者之名耳。", "i": 774}, {"t": "p", "s": "故元皇诀曰：<b>铅汞</b>鼎中居，炼成无价珠。都来两个字，了尽万家书。", "o": "故元皇訣曰：<b>鉛汞</b>鼎中居，煉成無價珠。都來兩個字，了盡萬家書。", "i": 775}, {"t": "note", "s": "口诀引证：钟离翁曰：除却汞铅两味药，其他都是诳愚迷。", "o": "口诀引证：鐘離翁曰：除卻汞鉛兩味藥，其他都是誑愚迷。", "i": 776}, {"t": "note", "s": "口诀引证：高象先曰：梦谒西华到九天，真人授我指玄篇。其中简易无多子，只要教人炼汞铅。", "o": "口诀引证：高象先曰：夢謁西華到九天，真人授我指玄篇。其中簡易無多子，只要教人煉汞鉛。", "i": 777}, {"t": "note", "s": "口诀引证：马丹阳曰：<b>铅汞</b>是水火，水火是<b>龙虎</b>，<b>龙虎</b>是神气，神气是<b>性命</b>。", "o": "口诀引证：馬丹陽曰：<b>鉛汞</b>是水火，水火是<b>龍虎</b>，<b>龍虎</b>是神氣，神氣是<b>性命</b>。", "i": 778}, {"t": "p", "s": "总来只是这两个字，两个字只是一个理。故盲修者岐而二之，若真修者合而一之。合一者，炼炁而凝神，尽性而至命，烹铅而<b>乾</b>汞，取坎而填离。", "o": "總來只是這兩個字，兩個字只是一個理。故盲修者岐而二之，若真修者合而一之。合一者，煉炁而凝神，盡性而至命，烹鉛而<b>乾</b>汞，取坎而填離。", "i": 779}, {"t": "p", "s": "盖离中灵物号曰流珠，寓神则营营而乱，寓精则持盈而难保。所以葛仙翁作流珠歌叹其难驭而易失也。岂不观魏伯阳云乎：太阳流珠，常欲去人，卒得金华，转而相因。又曰：河上姹女，灵而最神，将欲制之，黄芽为根。曰金华，曰黄芽，皆指真铅而言，真铅者，乃太阴之精也。曰流珠，曰姹女，皆指灵汞而言，灵汞者，太阳之气也。", "o": "蓋離中靈物號曰流珠，寓神則營營而亂，寓精則持盈而難保。所以葛仙翁作流珠歌嘆其難馭而易失也。豈不觀魏伯陽云乎：太陽流珠，常欲去人，卒得金華，轉而相因。又曰：河上奼女，靈而最神，將欲制之，黃芽為根。曰金華，曰黃芽，皆指真鉛而言，真鉛者，乃太陰之精也。曰流珠，曰奼女，皆指靈汞而言，靈汞者，太陽之氣也。", "i": 780}, {"t": "p", "s": "然此灵汞，其唯猛烈，见火则飞走无踪，不得真铅，何以制伏？故紫阳曰：要者须制伏觅金公。金公者，铅字也。盖铅自曲江而来，穿夹脊、彻玉京，斡旋沂流直上泥丸。虽名抽铅添汞，实是还精补脑。", "o": "然此靈汞，其唯猛烈，見火則飛走無蹤，不得真鉛，何以制伏？故紫陽曰：要者須制伏覓金公。金公者，鉛字也。蓋鉛自曲江而來，穿夾脊、徹玉京，斡旋沂流直上泥丸。雖名抽鉛添汞，實是還精補腦。", "i": 781}, {"t": "p", "s": "翠虚篇云：", "o": "翠虛篇云：", "i": 782}, {"t": "p", "s": "天有七星地七宝，人有七窍权归脑。", "o": "天有七星地七寶，人有七竅權歸腦。", "i": 783}, {"t": "p", "s": "太古集云：", "o": "太古集云：", "i": 784}, {"t": "p", "s": "<mark>金丹</mark>运至泥丸穴，名姓先将记玉都。", "o": "<mark>金丹</mark>運至泥丸穴，名姓先將記玉都。", "i": 785}, {"t": "p", "s": "法宝遗珠云：", "o": "法寶遺珠云：", "i": 786}, {"t": "p", "s": "识得本来真面目，始知生死在泥丸。", "o": "識得本來真面目，始知生死在泥丸。", "i": 787}, {"t": "p", "s": "黄庭经云：", "o": "黃庭經云：", "i": 788}, {"t": "p", "s": "泥丸百节皆有神。", "o": "泥丸百節皆有神。", "i": 789}, {"t": "p", "s": "又云：", "o": "又云：", "i": 790}, {"t": "p", "s": "脑神精根字泥丸。", "o": "腦神精根字泥丸。", "i": 791}, {"t": "p", "s": "又云：", "o": "又云：", "i": 792}, {"t": "p", "s": "一面之神宗泥丸，泥丸九真皆有房。方圆一寸处此中，但思一部寿无穷。", "o": "一面之神宗泥丸，泥丸九真皆有房。方圓一寸處此中，但思一部壽無窮。", "i": 793}, {"t": "p", "s": "所谓方圆一寸者，即释迦摩顶受记之处也。此处乃玄中之玄，天中之天。郁罗萧台，玉山上京。脑血之琼房，魂精之玉室，百灵之命宅，津液之山源。此正在两耳交通之穴，前明堂后，玉枕上，华盖下，绛宫北极太渊之中，乃真一<mark>元神</mark>所居之室也。", "o": "所謂方圓一寸者，即釋迦摩頂受記之處也。此處乃玄中之玄，天中之天。鬱羅蕭台，玉山上京。腦血之瓊房，魂精之玉室，百靈之命宅，津液之山源。此正在兩耳交通之穴，前明堂後，玉枕上，華蓋下，絳宮北極太淵之中，乃真一<mark>元神</mark>所居之室也。", "i": 794}, {"t": "p", "s": "昔黄帝上峨嵋山，见天真皇人于玉堂，请问真一之道。皇人曰：此道家之至重其经，上帝秘在昆仑五城之内。藏以玉函，刻以金扎，封以紫泥，印以中章。吾闻之精云：在北极太渊之中，前有明堂，后有玉枕。上有华盖，下有绛宫。巍巍华盖，金楼穹窿。左罡右魁，激波扬空。紫芝被崖，朱草朦胧。白玉嵯峨，日月垂光。历火过水，经玄涉黄。城门交错，帷帐琳琅。<b>龙虎</b>烈卫，神人在旁。不施不与，一安其所。不迟不疾，一安其室。能暇能预，一乃不去。守一存真，一乃通神。少欲约食，一乃留息。白刃临头，思一得生。知一不难，难在于终。守之不失，可以无穷。此真一秘旨之略也。", "o": "昔黃帝上峨嵋山，見天真皇人於玉堂，請問真一之道。皇人曰：此道家之至重其經，上帝秘在昆崙五城之內。藏以玉函，刻以金扎，封以紫泥，印以中章。吾聞之精云：在北極太淵之中，前有明堂，後有玉枕。上有華蓋，下有絳宮。巍巍華蓋，金樓穹窿。左罡右魁，激波揚空。紫芝被崖，朱草朦朧。白玉嵯峨，日月垂光。歷火過水，經玄涉黃。城門交錯，帷帳琳琅。<b>龍虎</b>烈衛，神人在旁。不施不與，一安其所。不遲不疾，一安其室。能暇能預，一乃不去。守一存真，一乃通神。少欲約食，一乃留息。白刃臨頭，思一得生。知一不難，難在於終。守之不失，可以無窮。此真一秘旨之略也。", "i": 795}, {"t": "p", "s": "故道德经曰：天得一以清，地得一以宁，神得一以灵，谷得一以盈，万物得一以生，王侯得—以为天下。贞所谓神以知来，知以藏往也。所谓大而化之之谓圣，圣而不可知之之谓神也。分之为二，阴阳之根底也。分之为五，五行之枢纽也。又分为八，八八六十四而为河图之数也。又分为九，九九八十一而为洛书之数也。又散之为万，生生化化万物之纲维也。", "o": "故道德經曰：天得一以清，地得一以寧，神得一以靈，穀得一以盈，萬物得一以生，王侯得—以為天下。貞所謂神以知來，知以藏往也。所謂大而化之之謂聖，聖而不可知之之謂神也。分之為二，陰陽之根底也。分之為五，五行之樞紐也。又分為八，八八六十四而為河圖之數也。又分為九，九九八十一而為洛書之數也。又散之為萬，生生化化萬物之綱維也。", "i": 796}, {"t": "p", "s": "羲文得其一，而周易兴焉；禹箕得其一，而洪范畴焉；周茂叔得其一，而太极图焉；邵尧夫得其一，而经世作焉；老子得其一，而万事毕焉；释迦得其一，而万法归焉。归根者，归此也。复命者，复此也。", "o": "羲文得其一，而周易興焉；禹箕得其一，而洪範疇焉；周茂叔得其一，而太極圖焉；邵堯夫得其一，而經世作焉；老子得其一，而萬事畢焉；釋迦得其一，而萬法歸焉。歸根者，歸此也。複命者，複此也。", "i": 797}, {"t": "p", "s": "西升经曰：人能守一，一亦守人。思一至饥，一与之粮。思一至渴，一与之浆。", "o": "西升經曰：人能守一，一亦守人。思一至飢，一與之糧。思一至渴，一與之漿。", "i": 798}, {"t": "p", "s": "灵枢经曰：天谷<mark>元神</mark>，守之自真。", "o": "靈樞經曰：天穀<mark>元神</mark>，守之自真。", "i": 799}, {"t": "p", "s": "又曰：子欲长生，抱一当明。", "o": "又曰：子欲長生，抱一當明。", "i": 800}, {"t": "p", "s": "又曰：抱一守真，神自通灵。", "o": "又曰：抱一守真，神自通靈。", "i": 801}, {"t": "p", "s": "人能握神守一于本宫，则真炁自升、真息自定、真精自朝、灵苗自长、天门自开、<mark>元神</mark>自现。顶窍开而窍窍齐开，<mark>元神</mark>居而神神听命。神既居其窍而不散，则人安得而死乎？即黄庭经所谓，子欲不死，修昆仑是也。", "o": "人能握神守一於本宮，則真炁自升、真息自定、真精自朝、靈苗自長、天門自開、<mark>元神</mark>自現。頂竅開而竅竅齊開，<mark>元神</mark>居而神神聽命。神既居其竅而不散，則人安得而死乎？即黃庭經所謂，子欲不死，修昆崙是也。", "i": 802}, {"t": "p", "s": "故丘处机云：", "o": "故丘處機云：", "i": 803}, {"t": "p", "s": "久视昆仑守真一，守得摩尼圆又赤。清虚浩旷陀罗门，万佛千仙从此出。", "o": "久視昆崙守真一，守得摩尼圓又赤。清虛浩曠陀羅門，萬佛千仙從此出。", "i": 804}, {"t": "p", "s": "还元篇云：", "o": "還元篇云：", "i": 805}, {"t": "p", "s": "悟道显然明廓落，闲闲端坐运天关。", "o": "悟道顯然明廓落，閒閒端坐運天關。", "i": 806}, {"t": "p", "s": "此是根本功夫，头脑学间，拨天关之手段，脱死籍之灵章。此道上苍所秘，古今仙佛皆不敢明言。真所谓千人万人中一人两人知者也。玄哉！玄哉！更有言不尽的口诀。", "o": "此是根本功夫，頭腦學間，撥天關之手段，脫死籍之靈章。此道上蒼所秘，古今仙佛皆不敢明言。真所謂千人萬人中一人兩人知者也。玄哉！玄哉！更有言不盡的口訣。", "i": 807}, {"t": "p", "s": "再一叮咛，当其真铅入鼎之时，须要驱除杂念，奋速精神，口视顶门，用志不分，霎时<b>龙虎</b>交战，造化争弛，雷轰电掣，撼动<b>乾</b><b>坤</b>，百脉悚然，九宫透彻，金晶灌顶，银浪冲天。", "o": "再一叮嚀，當其真鉛入鼎之時，須要驅除雜念，奮速精神，口視頂門，用志不分，霎時<b>龍虎</b>交戰，造化爭弛，雷轟電掣，撼動<b>乾</b><b>坤</b>，百脈悚然，九宮透徹，金晶灌頂，銀浪衝天。", "i": 808}, {"t": "p", "s": "紫阳所谓：以黑而变红，一鼎云气浓。少顷玉鼎汤温，金炉火散，黄芽遍地，白雪漫天，夫唱妻随，龙吟虎啸，阴恋阳魂，阳抱阴魄，铅精汞髓，凝结如珠。", "o": "紫陽所謂：以黑而變紅，一鼎雲氣濃。少頃玉鼎湯溫，金爐火散，黃芽遍地，白雪漫天，夫唱妻隨，龍吟虎嘯，陰戀陽魂，陽抱陰魄，鉛精汞髓，凝結如珠。", "i": 809}, {"t": "p", "s": "玉蟾所谓：夫妇老相逢，恩情自留恋，此际玄珠成，象矿去金存。而一点金液复落于黄庭旧处矣。", "o": "玉蟾所謂：夫婦老相逢，恩情自留戀，此際玄珠成，象礦去金存。而一點金液複落於黃庭舊處矣。", "i": 810}, {"t": "p", "s": "斯时也，溶溶然如山云之腾太虚，霏霏然似膏雨之遍原野，淫淫然若春雨之满泽，液液然像河水之将释。百脉冲和而畅乎四体，真个是拍拍满怀都是春也。见此效验，急行卯酉<b>周天</b>，进阳火，退阴符，使东西会合，南北混融，则四象五行攒族一鼎，混有灵于天谷，理五气于泥丸也。", "o": "斯時也，溶溶然如山雲之騰太虛，霏霏然似膏雨之遍原野，淫淫然若春雨之滿澤，液液然像河水之將釋。百脈衝和而暢乎四體，真個是拍拍滿懷都是春也。見此效驗，急行卯酉<b>周天</b>，進陽火，退陰符，使東西會合，南北混融，則四象五行攢族一鼎，混有靈於天谷，理五氣於泥丸也。", "i": 811}, {"t": "p", "s": "高象先云：", "o": "高象先云：", "i": 812}, {"t": "p", "s": "玄珠飞到昆仑上，子若求之凭罔象。", "o": "玄珠飛到昆崙上，子若求之憑罔象。", "i": 813}, {"t": "p", "s": "河东歌云：", "o": "河東歌云：", "i": 814}, {"t": "p", "s": "两物擒来共一炉，一泓神水结真酥。", "o": "兩物擒來共一爐，一泓神水結真酥。", "i": 815}, {"t": "p", "s": "指玄篇云：", "o": "指玄篇云：", "i": 816}, {"t": "p", "s": "必知会合东西路，切在冲和上下田。", "o": "必知會合東西路，切在衝和上下田。", "i": 817}, {"t": "p", "s": "陈泥丸云：", "o": "陳泥丸云：", "i": 818}, {"t": "p", "s": "白虎自兹相见后，流珠哪肯不相从。", "o": "白虎自茲相見後，流珠哪肯不相從。", "i": 819}, {"t": "p", "s": "段真人云：", "o": "段真人云：", "i": 820}, {"t": "p", "s": "四象五行攒族处，<b>乾</b><b>坤</b>日月自然归。", "o": "四象五行攢族處，<b>乾</b><b>坤</b>日月自然歸。", "i": 821}, {"t": "p", "s": "渐悟集云：", "o": "漸悟集云：", "i": 822}, {"t": "p", "s": "因烧丹药火焰下，故使黄河水逆流。", "o": "因燒丹藥火焰下，故使黃河水逆流。", "i": 823}, {"t": "p", "s": "纯粹吟云：", "o": "純粹吟云：", "i": 824}, {"t": "p", "s": "子午炉前分进退，<b>乾</b><b>坤</b>鼎内列浮沉。", "o": "子午爐前分進退，<b>乾</b><b>坤</b>鼎內列浮沉。", "i": 825}, {"t": "p", "s": "玄奥集云：", "o": "玄奧集云：", "i": 826}, {"t": "p", "s": "金消木性相交合，黑汞结铅自感通。", "o": "金消木性相交合，黑汞結鉛自感通。", "i": 827}, {"t": "p", "s": "云房真人云：", "o": "雲房真人云：", "i": 828}, {"t": "p", "s": "驱回斗柄<b>玄关</b>理，斡转天关万象通。片响<b>龙虎</b>频斗罢，二物相交顷刻中。", "o": "驅回斗柄<b>玄關</b>理，斡轉天關萬象通。片響<b>龍虎</b>頻鬥罷，二物相交頃刻中。", "i": 829}, {"t": "p", "s": "指玄篇云：", "o": "指玄篇云：", "i": 830}, {"t": "p", "s": "奔归气海名朱骥，飞入泥丸是白鸦。昨夜虎龙争战罢，雪中微见月钩斜。", "o": "奔歸氣海名朱驥，飛入泥丸是白鴉。昨夜虎龍爭戰罷，雪中微見月鉤斜。", "i": 831}, {"t": "p", "s": "醒眼诗云：", "o": "醒眼詩云：", "i": 832}, {"t": "p", "s": "木金间隔各西东，云起龙吟虎啸风。二物寥寥天地回，幸因<b>戊己</b>会雌雄。", "o": "木金間隔各西東，雲起龍吟虎嘯風。二物寥寥天地回，幸因<b>戊己</b>會雌雄。", "i": 833}, {"t": "p", "s": "陈泥丸云：", "o": "陳泥丸云：", "i": 834}, {"t": "p", "s": "子时气到尾闾关，夹脊河东透甑山。一颗水晶入炉内，赤龙舍汞上泥丸。", "o": "子時氣到尾閭關，夾脊河東透甑山。一顆水晶入爐內，赤龍舍汞上泥丸。", "i": 835}, {"t": "p", "s": "翠虚篇云：", "o": "翠虛篇云：", "i": 836}, {"t": "p", "s": "醉倒酣眠梦熟时，满船载宝进曹溪。一方识破丹基后，放去收来总是伊。", "o": "醉倒酣眠夢熟時，滿船載寶進曹溪。一方識破丹基後，放去收來總是伊。", "i": 837}, {"t": "p", "s": "古仙歌云：", "o": "古仙歌云：", "i": 838}, {"t": "p", "s": "水银一味是仙药，从上传流伏火难。若遇河东成紫粉，粉霜一吐化<mark>金丹</mark>。", "o": "水銀一味是仙藥，從上傳流伏火難。若遇河東成紫粉，粉霜一吐化<mark>金丹</mark>。", "i": 839}, {"t": "p", "s": "玄奥集云：", "o": "玄奧集云：", "i": 840}, {"t": "p", "s": "移将北斗过南辰，两手双擎日月轮。飞赴昆仑山上出，须臾化作一天云。", "o": "移將北斗過南辰，兩手雙擎日月輪。飛赴昆崙山上出，須臾化作一天雲。", "i": 841}, {"t": "p", "s": "阴长生云：", "o": "陰長生云：", "i": 842}, {"t": "p", "s": "夜深龙吟虎啸时，急驾河东无暂歇。飞精运上昆仑顶，进火玉炉烹似雪。", "o": "夜深龍吟虎嘯時，急駕河東無暫歇。飛精運上昆崙頂，進火玉爐烹似雪。", "i": 843}, {"t": "p", "s": "张元化云：", "o": "張元化云：", "i": 844}, {"t": "p", "s": "沂流一直上蓬莱，散在甘泉润九垓。从此丹田沾润泽，黄芽遍地一齐开。", "o": "沂流一直上蓬萊，散在甘泉潤九垓。從此丹田沾潤澤，黃芽遍地一齊開。", "i": 845}, {"t": "p", "s": "原道歌云：", "o": "原道歌云：", "i": 846}, {"t": "p", "s": "妙运丹田须上下，须知一体合西东。几回笑指昆山上，夹脊分明有路通。", "o": "妙運丹田須上下，須知一體合西東。幾回笑指昆山上，夾脊分明有路通。", "i": 847}, {"t": "p", "s": "玄奥集云：", "o": "玄奧集云：", "i": 848}, {"t": "p", "s": "独步昆仑望穹冥，龙吟虎啸甚分明。玉池常滴阴阳髓，金帛时烹日月精。", "o": "獨步昆崙望穹冥，龍吟虎嘯甚分明。玉池常滴陰陽髓，金帛時烹日月精。", "i": 849}, {"t": "p", "s": "群仙珠玉云：", "o": "群仙珠玉云：", "i": 850}, {"t": "p", "s": "一点丹阳事回别，须向坎中求赤血。捉来离位制阴精，配合调和有时节。", "o": "一點丹陽事回別，須向坎中求赤血。捉來離位制陰精，配合調和有時節。", "i": 851}, {"t": "p", "s": "<mark>金丹</mark>集云：", "o": "<mark>金丹</mark>集云：", "i": 852}, {"t": "p", "s": "河东搬运上昆山，不动纤毫到玉关。妙在八门牢闭锁，阴阳一气自循环。", "o": "河東搬運上昆山，不動纖毫到玉關。妙在八門牢閉鎖，陰陽一氣自循環。", "i": 853}, {"t": "p", "s": "无一歌云：", "o": "無一歌云：", "i": 854}, {"t": "p", "s": "此到一复忘一可，可与元化同出没。设若执一不能忘，大似痴猫守空窟。", "o": "此到一複忘一可，可與元化同出沒。設若執一不能忘，大似癡貓守空窟。", "i": 855}, {"t": "p", "s": "白玉蟾云：", "o": "白玉蟾云：", "i": 856}, {"t": "p", "s": "汞心炼神赤龙性，铅身凝气白虎命。内外浑无一点阴，万象光中玉清镜。", "o": "汞心煉神赤龍性，鉛身凝氣白虎命。內外渾無一點陰，萬象光中玉清鏡。", "i": 857}, {"t": "p", "s": "纯阳文集云：", "o": "純陽文集云：", "i": 858}, {"t": "p", "s": "盗得<b>乾</b><b>坤</b>祖，阴阳是本宗。天魂生白虎，地魄产青龙。", "o": "盜得<b>乾</b><b>坤</b>祖，陰陽是本宗。天魂生白虎，地魄產青龍。", "i": 859}, {"t": "p", "s": "运宝泥丸住，搬精入上宫。有人明此法，万载貌如童。", "o": "運寶泥丸住，搬精入上宮。有人明此法，萬載貌如童。", "i": 860}, {"t": "p", "s": "抱一子显道图云：", "o": "抱一子顯道圖云：", "i": 861}, {"t": "p", "s": "造道原来本不难，工夫只在定中间。阴阳上下常升降，金水周流自返还。", "o": "造道原來本不難，工夫只在定中間。陰陽上下常升降，金水周流自返還。", "i": 862}, {"t": "p", "s": "紫府青龙交白虎，玄宫地轴合天关。云收雨散神胎就，男子生儿不等闲。", "o": "紫府青龍交白虎，玄宮地軸合天關。雲收雨散神胎就，男子生兒不等閒。", "i": 863}, {"t": "p", "s": "玄奥集云：", "o": "玄奧集云：", "i": 864}, {"t": "p", "s": "要识<b>玄关</b>端的处，儿女笑指最高峰。", "o": "要識<b>玄關</b>端的處，兒女笑指最高峰。", "i": 865}, {"t": "p", "s": "最高峰，秀且奇，彼岸蒙蒙生紫芝。", "o": "最高峰，秀且奇，彼岸蒙蒙生紫芝。", "i": 866}, {"t": "p", "s": "只此便是长生药，无限修行人不知。", "o": "只此便是長生藥，無限修行人不知。", "i": 867}, {"t": "p", "s": "许宣平玄珠歌云：", "o": "許宣平玄珠歌云：", "i": 868}, {"t": "p", "s": "天上日头地下转，海底蝉娟天上飞。<b>乾</b><b>坤</b>日月本不运，皆因斗柄转其机。", "o": "天上日頭地下轉，海底蟬娟天上飛。<b>乾</b><b>坤</b>日月本不運，皆因斗柄轉其機。", "i": 869}, {"t": "p", "s": "人心若与<b>天心</b>合，颠倒阴阳只片时。<b>龙虎</b>战罢三田静，拾起玄珠种在泥。", "o": "人心若與<b>天心</b>合，顛倒陰陽只片時。<b>龍虎</b>戰罷三田靜，拾起玄珠種在泥。", "i": 870}, {"t": "p", "s": "群仙珠玉歌云：", "o": "群仙珠玉歌云：", "i": 871}, {"t": "p", "s": "铅思汞，汞思铅，夺得<b>乾</b><b>坤</b>造化权。<b>性命</b>都来两个字，隐在丹经千万篇。卯酉<b>周天</b>口诀（<b>周天</b>璇玑图）", "o": "鉛思汞，汞思鉛，奪得<b>乾</b><b>坤</b>造化權。<b>性命</b>都來兩個字，隱在丹經千萬篇。卯酉<b>周天</b>口訣（<b>周天</b>璇璣圖）", "i": 872}, {"t": "p", "s": "前段<b>乾</b><b>坤</b>交媾，收外药也。此段卯酉<b>周天</b>，收内药也。外交媾者，后上前下，一升一降也。内交媾者，左旋右转，一起一伏也。两者循环，状似璇玑。", "o": "前段<b>乾</b><b>坤</b>交媾，收外藥也。此段卯酉<b>周天</b>，收內藥也。外交媾者，後上前下，一升一降也。內交媾者，左旋右轉，一起一伏也。兩者循環，狀似璇璣。", "i": 873}, {"t": "p", "s": "故魏伯阳云：循据璇玑，升降上下，周流六爻，难以察睹。世人只知有<b>乾</b><b>坤</b>交媾，而不知卯酉<b>周天</b>，是犹有车而无轮，有舟而无舵，欲望远载，其可得乎？", "o": "故魏伯陽云：循據璇璣，升降上下，周流六爻，難以察睹。世人只知有<b>乾</b><b>坤</b>交媾，而不知卯酉<b>周天</b>，是猶有車而無輪，有舟而無舵，欲望遠載，其可得乎？", "i": 874}, {"t": "p", "s": "故还元篇云：轮回玉兔与金乌，道在人身人自迷，满目尽知调水火，到头几个识东西。东者，水性也。西者，金情也。一物分二，间隔东西。今得斗柄之机干旋，则木性爱金，金情恋木，两相交结，而金木交并矣。金本交并，方成水火全功。丹经谓之<span class=\"key\">和合四象</span>者此也。", "o": "故還元篇云：輪回玉兔與金烏，道在人身人自迷，滿目盡知調水火，到頭幾個識東西。東者，水性也。西者，金情也。一物分二，間隔東西。今得斗柄之機幹旋，則木性愛金，金情戀木，兩相交結，而金木交並矣。金本交並，方成水火全功。丹經謂之<span class=\"key\">和合四象</span>者此也。", "i": 875}, {"t": "p", "s": "故张全一铅火秘诀云：", "o": "故張全一鉛火秘訣云：", "i": 876}, {"t": "p", "s": "大药之生有时节，亥末子初正半夜。精神相媾合光华，恍恍惚惚生明月。", "o": "大藥之生有時節，亥末子初正半夜。精神相媾合光華，恍恍惚惚生明月。", "i": 877}, {"t": "p", "s": "媾罢流下喷泡然，一阳来复休轻泄。急须闭在太<b>玄关</b>，火逼药过尾闾穴。", "o": "媾罷流下噴泡然，一陽來複休輕洩。急須閉在太<b>玄關</b>，火逼藥過尾閭穴。", "i": 878}, {"t": "p", "s": "采时用目守泥丸，垂下左上且凝歇。谓之瞻理脑升玄，右边放下复起折。", "o": "採時用目守泥丸，垂下左上且凝歇。謂之瞻理腦升玄，右邊放下複起折。", "i": 879}, {"t": "p", "s": "六六数毕药生<b>乾</b>，阳极阴生往右迁。须开关门以退火，目光下瞩守<b>坤</b>田。", "o": "六六數畢藥生<b>乾</b>，陽極陰生往右遷。須開關門以退火，目光下矚守<b>坤</b>田。", "i": 880}, {"t": "p", "s": "右上左下方凝住，三八数了一<b>周天</b>。此是天然真<b>火候</b>，自然升降自抽添。", "o": "右上左下方凝住，三八數了一<b>周天</b>。此是天然真<b>火候</b>，自然升降自抽添。", "i": 881}, {"t": "p", "s": "也无弦望与晦朔，也无沐浴共长篇。异各剪除譬喻扫，只斯两句是真诠。", "o": "也無弦望與晦朔，也無沐浴共長篇。異各剪除譬喻掃，只斯兩句是真詮。", "i": 882}, {"t": "p", "s": "其法在<b>乾</b><b>坤</b>交媾后行之，则所结<mark>金丹</mark>不致耗散也。先以法器顶住太<b>玄关</b>口，次以行气主宰下照<b>坤</b>脐。良久，徐徐从左上照<b>乾</b>顶。少停，从右降下<b>坤</b>脐。是为一度。又从<b>坤</b>脐而升上<b>乾</b>顶，又从<b>乾</b>顶而降下<b>坤</b>脐。如此三十六转，是为进阳火。三十六度毕，并关以退火，亦用下照<b>坤</b>脐，从右上至<b>乾</b>顶，左边放下<b>坤</b>脐，是为一度。如此二十四转，是为退阴符。二十四度毕。", "o": "其法在<b>乾</b><b>坤</b>交媾後行之，則所結<mark>金丹</mark>不致耗散也。先以法器頂住太<b>玄關</b>口，次以行氣主宰下照<b>坤</b>臍。良久，徐徐從左上照<b>乾</b>頂。少停，從右降下<b>坤</b>臍。是為一度。又從<b>坤</b>臍而升上<b>乾</b>頂，又從<b>乾</b>頂而降下<b>坤</b>臍。如此三十六轉，是為進陽火。三十六度畢，並關以退火，亦用下照<b>坤</b>臍，從右上至<b>乾</b>頂，左邊放下<b>坤</b>臍，是為一度。如此二十四轉，是為退陰符。二十四度畢。", "i": 883}, {"t": "p", "s": "故张紫阳云：", "o": "故張紫陽云：", "i": 884}, {"t": "p", "s": "斗极建四时，八节无不烦。斗极实兀然，魁杓自移动。", "o": "斗極建四時，八節無不煩。斗極實兀然，魁杓自移動。", "i": 885}, {"t": "p", "s": "只要两眼皎，上下交相送。须向静中行，莫向忙里送。", "o": "只要兩眼皎，上下交相送。須向靜中行，莫向忙裏送。", "i": 886}, {"t": "p", "s": "所以用两眼皎者，何也？盖眼者，阳窍也。人之一身皆属阴，唯有这点阳耳。我以这一点之阳，从下至上，从左至右，转而又转，战退群阴，则阳道日长，阴道日消。", "o": "所以用兩眼皎者，何也？蓋眼者，陽竅也。人之一身皆屬陰，唯有這點陽耳。我以這一點之陽，從下至上，從左至右，轉而又轉，戰退群陰，則陽道日長，陰道日消。", "i": 887}, {"t": "p", "s": "故易曰：龙战于野，其血玄黄。又能使真气上下循环，如天河之流转，其眼之功可谓大矣。", "o": "故易曰：龍戰於野，其血玄黃。又能使真氣上下循環，如天河之流轉，其眼之功可謂大矣。", "i": 888}, {"t": "p", "s": "盖人初结胎时，天一生水，先生黑睛，而有瞳仁属肾，地二生火，而有两皆属心。天三生木，而有黑珠属肝；地四生金，而有白珠属肺；天五生土，而有上下胞胎属脾。由此观之，则五脏精华皆发于目也。", "o": "蓋人初結胎時，天一生水，先生黑睛，而有瞳仁屬腎，地二生火，而有兩皆屬心。天三生木，而有黑珠屬肝；地四生金，而有白珠屬肺；天五生土，而有上下胞胎屬脾。由此觀之，則五臟精華皆發於目也。", "i": 889}, {"t": "p", "s": "因师指窍之后，见妇人小产，半马落胎，并抱鸡之蛋，俱先生双目而脏腑皆未成形。予始知目乃先天之灵，<mark>元神</mark>所游之宅也。", "o": "因師指竅之後，見婦人小產，半馬落胎，並抱雞之蛋，俱先生雙目而臟腑皆未成形。予始知目乃先天之靈，<mark>元神</mark>所游之宅也。", "i": 890}, {"t": "p", "s": "皇极经世书云：天之神，栖于日；人之神，发于目。大矣哉！人之神发于目也。生身处，此物先天地生；没身处，此物先天地没。水、火，木、金、上之五行，攒簇于此，肝、心、脾、肺、肾之五脏，钟灵于此，唾、涕、精、津、气、血、液之七物，结秀于此。其大也，天地可容，其小也，纤毫不纳。兹非吾一身中之大宝也欤。", "o": "皇極經世書云：天之神，棲於日；人之神，發於目。大矣哉！人之神發於目也。生身處，此物先天地生；沒身處，此物先天地沒。水、火，木、金、上之五行，攢簇於此，肝、心、脾、肺、腎之五臟，鐘靈於此，唾、涕、精、津、氣、血、液之七物，結秀於此。其大也，天地可容，其小也，纖毫不納。茲非吾一身中之大寶也歟。", "i": 891}, {"t": "p", "s": "内指通玄诀云：", "o": "內指通玄訣云：", "i": 892}, {"t": "p", "s": "含光便是生长药，变骨成金上品仙。", "o": "含光便是生長藥，變骨成金上品仙。", "i": 893}, {"t": "p", "s": "上阳子云：", "o": "上陽子云：", "i": 894}, {"t": "p", "s": "玄微妙诀无多吉，只在眼前人不顾。", "o": "玄微妙訣無多吉，只在眼前人不顧。", "i": 895}, {"t": "p", "s": "崇正篇云：", "o": "崇正篇云：", "i": 896}, {"t": "p", "s": "搬运有功连昼夜，斡旋至妙体璇玑。", "o": "搬運有功連晝夜，斡旋至妙體璇璣。", "i": 897}, {"t": "p", "s": "<b>火候</b>歌云：", "o": "<b>火候</b>歌云：", "i": 898}, {"t": "p", "s": "欲透玄玄须谨独，谨独工夫机在目。", "o": "欲透玄玄須謹獨，謹獨工夫機在目。", "i": 899}, {"t": "p", "s": "陈泥丸云：", "o": "陳泥丸云：", "i": 900}, {"t": "p", "s": "真阴真阳是其道，只在眼前何远词。", "o": "真陰真陽是其道，只在眼前何遠詞。", "i": 901}, {"t": "p", "s": "薛道光云：", "o": "薛道光云：", "i": 902}, {"t": "p", "s": "分明只在眼睛前，自是时人不见天。", "o": "分明只在眼睛前，自是時人不見天。", "i": 903}, {"t": "p", "s": "刘海蟾云：", "o": "劉海蟾云：", "i": 904}, {"t": "p", "s": "下降上升循壳轴，左旋右复合枢机。", "o": "下降上升循殼軸，左旋右複合樞機。", "i": 905}, {"t": "p", "s": "王子真云：", "o": "王子真云：", "i": 906}, {"t": "p", "s": "昨宵姹女启灵扉，窥见神仙会紫微。北斗南辰前后布，两轮日月往来飞。", "o": "昨宵奼女啟靈扉，窺見神仙會紫微。北斗南辰前後布，兩輪日月往來飛。", "i": 907}, {"t": "p", "s": "萧紫虚云：", "o": "蕭紫虛云：", "i": 908}, {"t": "p", "s": "如龙养珠常自顾，如鸡孵卵常自抱。金液还丹在眼前，迷者多而悟者少。", "o": "如龍養珠常自顧，如雞孵卵常自抱。金液還丹在眼前，迷者多而悟者少。", "i": 909}, {"t": "p", "s": "陈翠虚云：", "o": "陳翠虛云：", "i": 910}, {"t": "p", "s": "不是灯光日月星，药灵自有异常明。垂帘久视光明处，一颗堂堂现本真。", "o": "不是燈光日月星，藥靈自有異常明。垂簾久視光明處，一顆堂堂現本真。", "i": 911}, {"t": "p", "s": "翠虚篇云：", "o": "翠虛篇云：", "i": 912}, {"t": "p", "s": "莫谓<mark>金丹</mark>事等闲，切须勤若力攒研。殷勤好与师资论，不在他途在目前。", "o": "莫謂<mark>金丹</mark>事等閒，切須勤若力攢研。殷勤好與師資論，不在他途在目前。", "i": 913}, {"t": "p", "s": "玄<b>坤</b>集云：", "o": "玄<b>坤</b>集云：", "i": 914}, {"t": "p", "s": "青牛人去几多年，此道分明在目前。欲识目前真的处，一堂风冷月蝉娟。", "o": "青牛人去幾多年，此道分明在目前。欲識目前真的處，一堂風冷月蟬娟。", "i": 915}, {"t": "p", "s": "陈泥丸云：", "o": "陳泥丸云：", "i": 916}, {"t": "p", "s": "大道分明在眼前，时人不会娱归泉。黄芽本是<b>乾</b><b>坤</b>气，神水根基与汞连。", "o": "大道分明在眼前，時人不會娛歸泉。黃芽本是<b>乾</b><b>坤</b>氣，神水根基與汞連。", "i": 917}, {"t": "p", "s": "玄学统宗云：", "o": "玄學統宗云：", "i": 918}, {"t": "p", "s": "几回抖搜上昆仑，运动璇玑造化分。昼夜周而还复始，<b>婴儿</b>从此命常存。", "o": "幾回抖搜上昆崙，運動璇璣造化分。晝夜周而還複始，<b>嬰兒</b>從此命常存。", "i": 919}, {"t": "p", "s": "观吾判感歌云：", "o": "觀吾判感歌云：", "i": 920}, {"t": "p", "s": "这骨董，大奥妙，妙在常有观其窍。此窍分明在目前，下士闻之即大笑。", "o": "這骨董，大奧妙，妙在常有觀其竅。此竅分明在目前，下士聞之即大笑。", "i": 921}, {"t": "p", "s": "<mark>金丹</mark>赋云：", "o": "<mark>金丹</mark>賦云：", "i": 922}, {"t": "p", "s": "呼<b>龙虎</b>吸，魂吞魄吐。南北交媾于水火，卯酉轮还于子午。", "o": "呼<b>龍虎</b>吸，魂吞魄吐。南北交媾於水火，卯酉輪還於子午。", "i": 923}, {"t": "p", "s": "总括<b>乾</b><b>坤</b>之策，优游变化之主。母子包罗于匡廊，育养因依于鼎釜。", "o": "總括<b>乾</b><b>坤</b>之策，優游變化之主。母子包羅於匡廊，育養因依於鼎釜。", "i": 924}, {"t": "p", "s": "郡仙珠玉山云：", "o": "郡仙珠玉山云：", "i": 925}, {"t": "p", "s": "觉中觉了悟中悟，一点灵光无遮护。放开烈焰照娑婆，法界纵横独显露。", "o": "覺中覺了悟中悟，一點靈光無遮護。放開烈焰照娑婆，法界縱橫獨顯露。", "i": 926}, {"t": "p", "s": "这些消息甚幽微，木人遥指白云归。此个<b>玄关</b>口难说，目前见得便忘机。", "o": "這些消息甚幽微，木人遙指白雲歸。此個<b>玄關</b>口難說，目前見得便忘機。", "i": 927}, {"t": "p", "s": "南谷子云：", "o": "南谷子云：", "i": 928}, {"t": "p", "s": "至道不远兮，恒在目前窍。窃天地之机兮，修成仙胎。", "o": "至道不遠兮，恆在目前竅。竊天地之機兮，修成仙胎。", "i": 929}, {"t": "p", "s": "纯阳子云：", "o": "純陽子云：", "i": 930}, {"t": "p", "s": "有人问我修行法，遥指天边日月轮。", "o": "有人問我修行法，遙指天邊日月輪。", "i": 931}, {"t": "p", "s": "以上诸仙雅言，皆发明行气主宰之义也。", "o": "以上諸仙雅言，皆發明行氣主宰之義也。", "i": 932}, {"t": "p", "s": "盖此节工夫与第四节同是一理，承上接下，端如贯珠，采取药物于曲江之下，聚火开之而上升于<b>乾</b>，<b>乾</b><b>坤</b>交媾于九宫之上，<b>周天</b>运之而凝结于鼎。", "o": "蓋此節工夫與第四節同是一理，承上接下，端如貫珠，採取藥物於曲江之下，聚火開之而上升於<b>乾</b>，<b>乾</b><b>坤</b>交媾於九宮之上，<b>周天</b>運之而凝結於鼎。", "i": 933}, {"t": "p", "s": "张紫阳云：", "o": "張紫陽云：", "i": 934}, {"t": "p", "s": "都来片饷工夫，永保无穷逸乐。", "o": "都來片餉工夫，永保無窮逸樂。", "i": 935}, {"t": "p", "s": "轻清者凝于泥丸，重浊者流归气穴。逐日如此此抽添，如此交媾，汞渐多，铅渐少，久则铅将尽，汞亦干，结成一颗摩尼，是为金液大还丹也。", "o": "輕清者凝於泥丸，重濁者流歸氣穴。逐日如此此抽添，如此交媾，汞漸多，鉛漸少，久則鉛將盡，汞亦干，結成一顆摩尼，是為金液大還丹也。", "i": 936}, {"t": "p", "s": "故马宜甫云：", "o": "故馬宜甫云：", "i": 937}, {"t": "p", "s": "收得水中金，采得菩提子。运得昆仑风，长寿无生死。", "o": "收得水中金，採得菩提子。運得昆崙風，長壽無生死。", "i": 938}, {"t": "p", "s": "盖坎中之铅，原是父之真精；离中之汞，原是母之真血。始因<b>乾</b>体一破，二物遂分两弦。是以常人日离日分，分尽而死。所以至人法<b>乾</b><b>坤</b>之体，效<b>坎离</b>之用，夺神功，改天命，求坎中之铅，制离中之汞，取坎中之阳，填离中之汞。阴尽阳纯，复成<b>乾</b>元本体。", "o": "蓋坎中之鉛，原是父之真精；離中之汞，原是母之真血。始因<b>乾</b>體一破，二物遂分兩弦。是以常人日離日分，分盡而死。所以至人法<b>乾</b><b>坤</b>之體，效<b>坎離</b>之用，奪神功，改天命，求坎中之鉛，制離中之汞，取坎中之陽，填離中之汞。陰盡陽純，複成<b>乾</b>元本體。", "i": 939}, {"t": "p", "s": "故张紫阳云：", "o": "故張紫陽云：", "i": 940}, {"t": "p", "s": "取将坎位中心实，点化离官腹内阴。自此变成<b>乾</b>健体，潜藏飞跃尽由心。<span class=\"key\">性命双修</span>万神圭旨第六节口诀灵丹入鼎长养圣胎（灵丹入鼎图）（内附火侯）", "o": "取將坎位中心實，點化離官腹內陰。自此變成<b>乾</b>健體，潛藏飛躍盡由心。<span class=\"key\">性命雙修</span>萬神圭旨第六節口訣靈丹入鼎長養聖胎（靈丹入鼎圖）（內附火侯）", "i": 941}, {"t": "p", "s": "原初那点精金浑然在矿，因火所逼，遂上<b>乾</b>宫，渐采渐积，以烹以熔，损之又损，炼之又炼，直至烟消火灭，矿尽金纯，方才成此一粒<b>龙虎</b><mark>金丹</mark>。圆陀陀，活泼泼，如露如电，非雾非烟，辉煌闪烁，光耀昆仑。放则迸开天地窍，归兮隐人翠微宫。", "o": "原初那點精金渾然在礦，因火所逼，遂上<b>乾</b>宮，漸採漸積，以烹以熔，損之又損，煉之又煉，直至煙消火滅，礦盡金純，方才成此一粒<b>龍虎</b><mark>金丹</mark>。圓陀陀，活潑潑，如露如電，非霧非煙，輝煌閃爍，光耀昆崙。放則迸開天地竅，歸兮隱人翠微宮。", "i": 942}, {"t": "p", "s": "此时药也不生，轮也不转，液也不降，火也不炎。五气皆朝于上阳，三华俱聚于<b>乾</b>顶。阳纯阴剥，丹熟珠灵。", "o": "此時藥也不生，輪也不轉，液也不降，火也不炎。五氣皆朝於上陽，三華俱聚於<b>乾</b>頂。陽純陰剝，丹熟珠靈。", "i": 943}, {"t": "p", "s": "紫阳翁曰：", "o": "紫陽翁曰：", "i": 944}, {"t": "p", "s": "群阴剥尽丹成熟，跳出樊笼寿万年。", "o": "群陰剝盡丹成熟，跳出樊籠壽萬年。", "i": 945}, {"t": "p", "s": "是以唐宋尸解诸仙多于此处分路，随意生身，出没自由，不肯于百尺竿头而再进一步。故有七趣之讥，落空之诮。盖为不知重立我之<b>性命</b>，再造我之<b>乾</b><b>坤</b>，变种性为佛性，化<b>识神</b>为<mark>元神</mark>，自造自化之妙也。", "o": "是以唐宋尸解諸仙多於此處分路，隨意生身，出沒自由，不肯於百尺竿頭而再進一步。故有七趣之譏，落空之誚。蓋為不知重立我之<b>性命</b>，再造我之<b>乾</b><b>坤</b>，變種性為佛性，化<b>識神</b>為<mark>元神</mark>，自造自化之妙也。", "i": 946}, {"t": "p", "s": "若命宗人不知所以自为造化，就是枯坐旁门，而道非其道也。若性宗人不知所以自为造化，就是顽空外道，而释非其释也。", "o": "若命宗人不知所以自為造化，就是枯坐旁門，而道非其道也。若性宗人不知所以自為造化，就是頑空外道，而釋非其釋也。", "i": 947}, {"t": "p", "s": "此法乃仙真佛祖之所深秘，即自从金元以来而学道之人少有知之者。独吾师尹公曰：鼎中有宝非真宝，重结灵胎是圣胎。", "o": "此法乃仙真佛祖之所深秘，即自從金元以來而學道之人少有知之者。獨吾師尹公曰：鼎中有寶非真寶，重結靈胎是聖胎。", "i": 948}, {"t": "p", "s": "然而珠在昆仑，何由得下而结圣胎？必假神庐，窃灵阳真气以催之。太阳真火以逼之，催逼既久，则灵丹应时脱落，吞入口中，化为金液，而直射于丹房之内，霎时云腾雨施，电掣雷轰，鏖战片饷之间，销尽一身阴渣，则百灵如辐之辏壳，七宝若水之朝宗，皆聚于此矣。", "o": "然而珠在昆崙，何由得下而結聖胎？必假神廬，竊靈陽真氣以催之。太陽真火以逼之，催逼既久，則靈丹應時脫落，吞入口中，化為金液，而直射於丹房之內，霎時雲騰雨施，電掣雷轟，鏖戰片餉之間，銷盡一身陰渣，則百靈如輻之輳殼，七寶若水之朝宗，皆聚於此矣。", "i": 949}, {"t": "p", "s": "昔无上元君谓老子曰：", "o": "昔無上元君謂老子曰：", "i": 950}, {"t": "p", "s": "神丹入口寿无穷也。", "o": "神丹入口壽無窮也。", "i": 951}, {"t": "p", "s": "故老子修之是为道祖。", "o": "故老子修之是為道祖。", "i": 952}, {"t": "p", "s": "许宣平曰：", "o": "許宣平曰：", "i": 953}, {"t": "p", "s": "神居窍而千智生，丹入鼎而万种化。", "o": "神居竅而千智生，丹入鼎而萬種化。", "i": 954}, {"t": "p", "s": "陈虚白曰：", "o": "陳虛白曰：", "i": 955}, {"t": "p", "s": "我初凝结圣胎时，百脉俱停气不驰。", "o": "我初凝結聖胎時，百脈俱停氣不馳。", "i": 956}, {"t": "p", "s": "施肩吾曰：", "o": "施肩吾曰：", "i": 957}, {"t": "p", "s": "天人同一气，彼此感而通。", "o": "天人同一氣，彼此感而通。", "i": 958}, {"t": "p", "s": "阳自空中来，抱我主人翁。", "o": "陽自空中來，抱我主人翁。", "i": 959}, {"t": "p", "s": "然我既得灵丹入鼎矣，而内外交修，炼之而复炼之，而必至于天地合德，则太虚中自然有一点真阳以与我之灵丹合而为一。盖吾身之灵感天地之灵，则内真外应，浑然混合。", "o": "然我既得靈丹入鼎矣，而內外交修，煉之而複煉之，而必至於天地合德，則太虛中自然有一點真陽以與我之靈丹合而為一。蓋吾身之靈感天地之靈，則內真外應，渾然混合。", "i": 960}, {"t": "p", "s": "金碧经云：磁石吸铁，隔碍潜通。大同此意。这段功夫全以至静为主。", "o": "金碧經云：磁石吸鐵，隔礙潛通。大同此意。這段功夫全以至靜為主。", "i": 961}, {"t": "p", "s": "老子云：人能常清静，天地悉皆归。当其两阳乍合，圣胎初凝，必须常常觉照，紧紧护持。如小龙之乍养珠，似幼女之初怀孕。牢关神室，不可使之渗漏。", "o": "老子云：人能常清靜，天地悉皆歸。當其兩陽乍合，聖胎初凝，必須常常覺照，緊緊護持。如小龍之乍養珠，似幼女之初懷孕。牢關神室，不可使之滲漏。", "i": 962}, {"t": "p", "s": "故太白真人曰：固济能不泄，变化在须臾。更于一切时中，四威仪内，时时照顾，念念在兹，混混沌沌，如在母胞，终日如愚而不违，不久须臾间断也。", "o": "故太白真人曰：固濟能不洩，變化在須臾。更於一切時中，四威儀內，時時照顧，念念在茲，混混沌沌，如在母胞，終日如愚而不違，不久須臾間斷也。", "i": 963}, {"t": "p", "s": "葛仙翁云：", "o": "葛仙翁云：", "i": 964}, {"t": "p", "s": "息息归中无间断，天真胎里自凝坚。", "o": "息息歸中無間斷，天真胎裡自凝堅。", "i": 965}, {"t": "p", "s": "张用成云：", "o": "張用成云：", "i": 966}, {"t": "p", "s": "一粒灵丹吞入腹，始知我命不由天。", "o": "一粒靈丹吞入腹，始知我命不由天。", "i": 967}, {"t": "p", "s": "石得之云：", "o": "石得之云：", "i": 968}, {"t": "p", "s": "将来掌上霞光灿，吞入腹中宫殿新。", "o": "將來掌上霞光燦，吞入腹中宮殿新。", "i": 969}, {"t": "p", "s": "赵缘督云：", "o": "趙緣督云：", "i": 970}, {"t": "p", "s": "神丹飞落黄金室，<b>婴儿</b>降生极乐国。", "o": "神丹飛落黃金室，<b>嬰兒</b>降生極樂國。", "i": 971}, {"t": "p", "s": "吕纯阳云：", "o": "呂純陽云：", "i": 972}, {"t": "p", "s": "刀主饵了丹书降，跳出尘笼上九天。", "o": "刀主餌了丹書降，跳出塵籠上九天。", "i": 973}, {"t": "p", "s": "朱文公云：", "o": "朱文公云：", "i": 974}, {"t": "p", "s": "刀圭一入口，白日生羽翰。", "o": "刀圭一入口，白日生羽翰。", "i": 975}, {"t": "p", "s": "李清庵云：", "o": "李清庵云：", "i": 976}, {"t": "p", "s": "一颗宝珠吞入腹，作个全真仙眷属。", "o": "一顆寶珠吞入腹，作個全真仙眷屬。", "i": 977}, {"t": "p", "s": "陈希夷云：", "o": "陳希夷云：", "i": 978}, {"t": "p", "s": "邈无踪迹归丹房，潜有机关结圣胎。", "o": "邈無蹤跡歸丹房，潛有機關結聖胎。", "i": 979}, {"t": "p", "s": "薛紫贤云：", "o": "薛紫賢云：", "i": 980}, {"t": "p", "s": "四象包含归<b>戊己</b>，辛勤十月产婴孩。", "o": "四象包含歸<b>戊己</b>，辛勤十月產嬰孩。", "i": 981}, {"t": "p", "s": "悟真篇云：", "o": "悟真篇云：", "i": 982}, {"t": "p", "s": "果生枝上终期熟，子在胞中岂有殊。", "o": "果生枝上終期熟，子在胞中豈有殊。", "i": 983}, {"t": "p", "s": "醉中吟云：", "o": "醉中吟云：", "i": 984}, {"t": "p", "s": "宝珠笑舞辞天谷，才脱胞胎又入胎。", "o": "寶珠笑舞辭天谷，才脫胞胎又入胎。", "i": 985}, {"t": "p", "s": "张紫阳云：", "o": "張紫陽云：", "i": 986}, {"t": "p", "s": "<b>婴儿</b>是一含真炁，十月胎圆入圣基。", "o": "<b>嬰兒</b>是一含真炁，十月胎圓入聖基。", "i": 987}, {"t": "p", "s": "吕纯阳云：", "o": "呂純陽云：", "i": 988}, {"t": "p", "s": "天生一物变三才，交感阴阳结圣胎。", "o": "天生一物變三才，交感陰陽結聖胎。", "i": 989}, {"t": "p", "s": "白玉蟾云：", "o": "白玉蟾云：", "i": 990}, {"t": "p", "s": "鸡能抱卵心常听，蝉到成形壳始分。", "o": "雞能抱卵心常聽，蟬到成形殼始分。", "i": 991}, {"t": "p", "s": "俞石涧云：", "o": "俞石澗云：", "i": 992}, {"t": "p", "s": "虎啸一声龙出窟，鸾飞凤舞入金城。", "o": "虎嘯一聲龍出窟，鸞飛鳳舞入金城。", "i": 993}, {"t": "p", "s": "群仙珠玉云：", "o": "群仙珠玉云：", "i": 994}, {"t": "p", "s": "一粒餐兮天地寿，死生生死不相干。", "o": "一粒餐兮天地壽，死生生死不相干。", "i": 995}, {"t": "p", "s": "张紫阳云：", "o": "張紫陽云：", "i": 996}, {"t": "p", "s": "相吞相咽却相亲，始觉男儿有孕身。", "o": "相吞相咽卻相親，始覺男兒有孕身。", "i": 997}, {"t": "p", "s": "钟离翁云：", "o": "鐘離翁云：", "i": 998}, {"t": "p", "s": "胎内<b>婴儿</b>就，勤加温养功。时时照丹房，刻刻守黄中。", "o": "胎內<b>嬰兒</b>就，勤加溫養功。時時照丹房，刻刻守黃中。", "i": 999}, {"t": "p", "s": "陈泥丸云：", "o": "陳泥丸云：", "i": 1000}, {"t": "p", "s": "男儿怀孕是胎仙，只为蟾光夜夜圆。夺得天机真造化，身中自有玉清天。", "o": "男兒懷孕是胎仙，只為蟾光夜夜圓。奪得天機真造化，身中自有玉清天。", "i": 1001}, {"t": "p", "s": "陈抱一云：", "o": "陳抱一云：", "i": 1002}, {"t": "p", "s": "大道无私感即来，神仙此语岂虚哉。苟非著意求<b>铅汞</b>，争悟天机结圣胎。", "o": "大道無私感即來，神仙此語豈虛哉。苟非著意求<b>鉛汞</b>，爭悟天機結聖胎。", "i": 1003}, {"t": "p", "s": "玄奥集云：", "o": "玄奧集云：", "i": 1004}, {"t": "p", "s": "阆苑蟠桃自熟时，摘来服饵莫教迟。几回下手潜偷处，无限神仙总不知。", "o": "閬苑蟠桃自熟時，摘來服餌莫教遲。幾回下手潛偷處，無限神仙總不知。", "i": 1005}, {"t": "p", "s": "龙眉子云：", "o": "龍眉子云：", "i": 1006}, {"t": "p", "s": "形如雀卵团团大，间似骊珠珠珠圆。龙子脱胎吞入口，此身已证陆行仙。", "o": "形如雀卵團團大，間似驪珠珠珠圓。龍子脫胎吞入口，此身已証陸行仙。", "i": 1007}, {"t": "p", "s": "紫虚真人云：", "o": "紫虛真人云：", "i": 1008}, {"t": "p", "s": "初炼还丹须入室，妇人怀孕更无殊。圣胎凝结圆成后，出入行藏岂有拘。", "o": "初煉還丹須入室，婦人懷孕更無殊。聖胎凝結圓成後，出入行藏豈有拘。", "i": 1009}, {"t": "p", "s": "白紫清云：", "o": "白紫清云：", "i": 1010}, {"t": "p", "s": "和将<b>戊己</b>作丹妒，炼得红丸化玉酥。慢守火符三百日，产成一颗夜明珠。", "o": "和將<b>戊己</b>作丹妒，煉得紅丸化玉酥。慢守火符三百日，產成一顆夜明珠。", "i": 1011}, {"t": "p", "s": "张真人赠白龙洞主歌云：", "o": "張真人贈白龍洞主歌云：", "i": 1012}, {"t": "p", "s": "从此根苗渐长成，随时灌溉抱真精。十月脱胎存入口，不觉凡身已有灵。", "o": "從此根苗漸長成，隨時灌溉抱真精。十月脫胎存入口，不覺凡身已有靈。", "i": 1013}, {"t": "p", "s": "白玉蟾云：", "o": "白玉蟾云：", "i": 1014}, {"t": "p", "s": "怪事教人笑几回，男儿今也会怀胎。自家精血自交媾，身里夫妻是妙哉。", "o": "怪事教人笑幾回，男兒今也會懷胎。自家精血自交媾，身裏夫妻是妙哉。", "i": 1015}, {"t": "p", "s": "黄元吉云：", "o": "黃元吉云：", "i": 1016}, {"t": "p", "s": "鼎内<mark>金丹</mark>灿烂光，无由摘尔到黄房。忽然夜半天风便，吹送灵儿归故乡。", "o": "鼎內<mark>金丹</mark>燦爛光，無由摘爾到黃房。忽然夜半天風便，吹送靈兒歸故鄉。", "i": 1017}, {"t": "p", "s": "陈翠虚云：", "o": "陳翠虛云：", "i": 1018}, {"t": "p", "s": "道要无中养就儿，个中别有真端的。都缘简易妙天机，散在丹书不肯泄。", "o": "道要無中養就兒，個中別有真端的。都緣簡易妙天機，散在丹書不肯洩。", "i": 1019}, {"t": "p", "s": "王重阳云：", "o": "王重陽云：", "i": 1020}, {"t": "p", "s": "闲中偶尔到天台。忽见霞光五色开。想是<mark>金丹</mark>初变化，取归鼎内结婴孩。", "o": "閒中偶爾到天台。忽見霞光五色開。想是<mark>金丹</mark>初變化，取歸鼎內結嬰孩。", "i": 1021}, {"t": "p", "s": "上阳子云：", "o": "上陽子云：", "i": 1022}, {"t": "p", "s": "玉皇若也问丹材，偃月炉中取下来。驰骋英雄吞一粒，男儿怀了一年胎。", "o": "玉皇若也問丹材，偃月爐中取下來。馳騁英雄吞一粒，男兒懷了一年胎。", "i": 1023}, {"t": "p", "s": "陈致虚云：", "o": "陳致虛云：", "i": 1024}, {"t": "p", "s": "饥餐渴饮困来眠，一道分明体自然。十月圣胎完就了，一声霹雳出丹山。", "o": "飢餐渴飲困來眠，一道分明體自然。十月聖胎完就了，一聲霹靂出丹山。", "i": 1025}, {"t": "p", "s": "至于释教教人亦不外此。如楞严经曰：行如佛同受佛气，分如中阴身自求。父母阴信冥通入，如来种名生贵住。既游道胎，亲奉觉乳，如胎已成人相。不缺名方，便具足住。容貌如佛，心相亦同。名正心住，身心合成，日益增长，名不退住，十身灵相，一时具足，名童真住。形成出胎，亲为佛子，名法王子住。表以成人，如国大王，以诸国事分委太子，彼刹利王。世子长成，陈列灌顶，名灌顶住。夫入如来种者，以种性而为如来之种子，以自造化如来也。故曰道胎，又曰觉乳，其与妇人之乳儿，玄门之胎仙，亦何以异？及至形成出贻，亲为佛子，岂不是真人出现，大神通从此，天仙可相贺耶？", "o": "至於釋教教人亦不外此。如楞嚴經曰：行如佛同受佛氣，分如中陰身自求。父母陰信冥通入，如來種名生貴住。既游道胎，親奉覺乳，如胎已成人相。不缺名方，便具足住。容貌如佛，心相亦同。名正心住，身心合成，日益增長，名不退住，十身靈相，一時具足，名童真住。形成出胎，親為佛子，名法王子住。表以成人，如國大王，以諸國事分委太子，彼剎利王。世子長成，陳列灌頂，名灌頂住。夫入如來種者，以種性而為如來之種子，以自造化如來也。故曰道胎，又曰覺乳，其與婦人之乳兒，玄門之胎仙，亦何以異？及至形成出貽，親為佛子，豈不是真人出現，大神通從此，天仙可相賀耶？", "i": 1026}, {"t": "p", "s": "盖丹书梵典，皆有次序口诀，但人不知。而蓦直看过去了正，是珠在路旁人不拾。惜哉！予今略摘此数条表而出之，以引古之是而证今之非也。", "o": "蓋丹書梵典，皆有次序口訣，但人不知。而驀直看過去了正，是珠在路旁人不拾。惜哉！予今略摘此數條表而出之，以引古之是而証今之非也。", "i": 1027}, {"t": "h2", "s": "火候", "o": "火候", "i": 1028}, {"t": "p", "s": "<b>火候</b>最秘，圣人不传，令则露之。药非火不产，药熟则火化矣。火非药不生，火到则丹成矣。且<b>火候</b>之奥，非可一概而论。", "o": "<b>火候</b>最秘，聖人不傳，令則露之。藥非火不產，藥熟則火化矣。火非藥不生，火到則丹成矣。且<b>火候</b>之奧，非可一概而論。", "i": 1029}, {"t": "p", "s": "故未得丹时，须借武火以凝之，既得丹时，须藉文火以养之。文火者。结实之火也。其养之法，节其寒温消息是也。", "o": "故未得丹時，須借武火以凝之，既得丹時，須藉文火以養之。文火者。結實之火也。其養之法，節其寒溫消息是也。", "i": 1030}, {"t": "p", "s": "故参同契曰：候视加谨慎，审察辨寒温。审其火之未燃也，须藉巽风以吹之。察其火之既燃也，须资神水以活之。若太过，则损之；若不及，则益之，俾得中和而无火燥、火寒之病矣。", "o": "故參同契曰：候視加謹慎，審察辨寒溫。審其火之未燃也，須藉巽風以吹之。察其火之既燃也，須資神水以活之。若太過，則損之；若不及，則益之，俾得中和而無火燥、火寒之病矣。", "i": 1031}, {"t": "p", "s": "盖火之寒燥，全在意念上发端。", "o": "蓋火之寒燥，全在意念上發端。", "i": 1032}, {"t": "note", "s": "口诀引证：陈虚白曰：念不可起，念起则火燥；意不可散，意散则火冷。唯只要一念不起，一意不散，含光默然，真息绵绵，圆明觉照，常自惺惺，此长养圣胎之真<b>火候</b>也。", "o": "口诀引证：陳虛白曰：念不可起，念起則火燥；意不可散，意散則火冷。唯只要一念不起，一意不散，含光默然，真息綿綿，圓明覺照，常自惺惺，此長養聖胎之真<b>火候</b>也。", "i": 1033}, {"t": "p", "s": "故白玉蟾曰：", "o": "故白玉蟾曰：", "i": 1034}, {"t": "p", "s": "采药物于不动之中，行<b>火候</b>于无为之内。", "o": "採藥物於不動之中，行<b>火候</b>於無為之內。", "i": 1035}, {"t": "p", "s": "张三峰曰：", "o": "張三峰曰：", "i": 1036}, {"t": "p", "s": "以默以柔存火性，勿忘勿助养灵胎。", "o": "以默以柔存火性，勿忘勿助養靈胎。", "i": 1037}, {"t": "p", "s": "刘海蟾曰：", "o": "劉海蟾曰：", "i": 1038}, {"t": "p", "s": "兀兀无为融至宝，微微文文养潜龙。", "o": "兀兀無為融至寶，微微文文養潛龍。", "i": 1039}, {"t": "p", "s": "张紫阳曰：", "o": "張紫陽曰：", "i": 1040}, {"t": "p", "s": "自有天然真火育，不须柴炭及吹嘘。", "o": "自有天然真火育，不須柴炭及吹噓。", "i": 1041}, {"t": "p", "s": "又曰：", "o": "又曰：", "i": 1042}, {"t": "p", "s": "谩守药炉著<b>火候</b>，但安神息任天然。", "o": "謾守藥爐著<b>火候</b>，但安神息任天然。", "i": 1043}, {"t": "p", "s": "此四翁乃列仙中之铮铮者，皆以天然真火、自然妙用而成无上至真之道。又何尝用卦爻斤两，年月日时哉？", "o": "此四翁乃列仙中之錚錚者，皆以天然真火、自然妙用而成無上至真之道。又何嘗用卦爻斤兩，年月日時哉？", "i": 1044}, {"t": "p", "s": "今时之人，错会仙师本意，泥象执文，认指为月，而必欲推算卦体之策数，求合卦书之阴阳。吾恐终身役役，而不见其成功，倏然疲毙，而不知其归处。", "o": "今時之人，錯會仙師本意，泥象執文，認指為月，而必欲推算卦體之策數，求合卦書之陰陽。吾恐終身役役，而不見其成功，倏然疲斃，而不知其歸處。", "i": 1045}, {"t": "p", "s": "岂不见张平叙云：", "o": "豈不見張平敘云：", "i": 1046}, {"t": "p", "s": "此中得意须忘象，若究群爻谩役情。", "o": "此中得意須忘象，若究群爻謾役情。", "i": 1047}, {"t": "p", "s": "高象先云：", "o": "高象先云：", "i": 1048}, {"t": "p", "s": "昼夜屯蒙法自然，焉用孜孜看火侯。", "o": "晝夜屯蒙法自然，焉用孜孜看火侯。", "i": 1049}, {"t": "p", "s": "陈冲素云：", "o": "陳衝素云：", "i": 1050}, {"t": "p", "s": "火虽有侯不须时，些子机关我自知。", "o": "火雖有侯不須時，些子機關我自知。", "i": 1051}, {"t": "p", "s": "彭真一云：", "o": "彭真一云：", "i": 1052}, {"t": "p", "s": "从来真火无形象，不得师传亦大难。", "o": "從來真火無形象，不得師傳亦大難。", "i": 1053}, {"t": "p", "s": "萧子虚云：", "o": "蕭子虛云：", "i": 1054}, {"t": "p", "s": "药物调和，悟者甚易。<b>火候</b>消息，行之恐难。", "o": "藥物調和，悟者甚易。<b>火候</b>消息，行之恐難。", "i": 1055}, {"t": "p", "s": "一十月功夫存杳杳绵绵之息，三万年气数在来来往往之间。所以养丹田之宝，此宝常在在丹鼎之珠。此珠复还，驾动河车。离尘世尾闾之海，移居天谷上昆仑蓬岛之山。前数句谓成丹之时脱胎而入日，末一句谓功成之后脱胎而出壳，中间两句谓温养子珠，长养圣胎。", "o": "一十月功夫存杳杳綿綿之息，三萬年氣數在來來往往之間。所以養丹田之寶，此寶常在在丹鼎之珠。此珠複還，駕動河車。離塵世尾閭之海，移居天谷上昆崙蓬島之山。前數句謂成丹之時脫胎而入日，末一句謂功成之後脫胎而出殼，中間兩句謂溫養子珠，長養聖胎。", "i": 1056}, {"t": "p", "s": "张三峰曰：", "o": "張三峰曰：", "i": 1057}, {"t": "p", "s": "年月日时空有著，卦爻斤两亦支离。若存会得绵绵意，正是勿忘勿助时。", "o": "年月日時空有著，卦爻斤兩亦支離。若存會得綿綿意，正是勿忘勿助時。", "i": 1058}, {"t": "note", "s": "口诀引证：白紫清曰：流俗浅识。未学凡夫岂知元始天尊与天仙地仙，日日采药物而不停，药物愈采而无穷也。又岂知山河大地与蠢动含灵，时时行<b>火候</b>而无暂助，<b>火候</b>愈行而不歇也。神凝则精气聚而百宝结者，结胎之药物也。真息往来而未尝少有间断者，温养之<b>火候</b>也。", "o": "口诀引证：白紫清曰：流俗淺識。未學凡夫豈知元始天尊與天仙地仙，日日採藥物而不停，藥物愈採而無窮也。又豈知山河大地與蠢動含靈，時時行<b>火候</b>而無暫助，<b>火候</b>愈行而不歇也。神凝則精氣聚而百寶結者，結胎之藥物也。真息往來而未嘗少有間斷者，溫養之<b>火候</b>也。", "i": 1059}, {"t": "note", "s": "口诀引证：陈虚白曰：<b>火候</b>之要，尤当以真息求之。", "o": "口诀引证：陳虛白曰：<b>火候</b>之要，尤當以真息求之。", "i": 1060}, {"t": "note", "s": "口诀引证：丘长春曰：一念不离方寸是<b>真空</b>。此养胎之真火也。夫真火者，我之神也，而与天地之神、虚空之神同其神也。真候者，我之息也，而与天地之息、虚空之息同其息也。", "o": "口诀引证：丘長春曰：一念不離方寸是<b>真空</b>。此養胎之真火也。夫真火者，我之神也，而與天地之神、虛空之神同其神也。真候者，我之息也，而與天地之息、虛空之息同其息也。", "i": 1061}, {"t": "p", "s": "左元放曰：", "o": "左元放曰：", "i": 1062}, {"t": "p", "s": "<b>火候</b>无为合自然，自然真火养胎仙。但存神息居丹扃，调变先天接后天。", "o": "<b>火候</b>無為合自然，自然真火養胎仙。但存神息居丹扃，調變先天接後天。", "i": 1063}, {"t": "p", "s": "王重阳曰：", "o": "王重陽曰：", "i": 1064}, {"t": "p", "s": "圣胎既凝，养以文火。安神定息，任其自如。", "o": "聖胎既凝，養以文火。安神定息，任其自如。", "i": 1065}, {"t": "p", "s": "此以神感，彼以神应。天机妙用，自然而然。", "o": "此以神感，彼以神應。天機妙用，自然而然。", "i": 1066}, {"t": "p", "s": "予于是而知神息者，<b>火候</b>也。而孟子之所谓勿忘勿助、老氏之所谓绵绵若存、释氏之所谓不得勤不得怠者，是皆神息之自然<b>火候</b>之微旨也。", "o": "予於是而知神息者，<b>火候</b>也。而孟子之所謂勿忘勿助、老氏之所謂綿綿若存、釋氏之所謂不得勤不得怠者，是皆神息之自然<b>火候</b>之微旨也。", "i": 1067}, {"t": "p", "s": "故曰：", "o": "故曰：", "i": 1068}, {"t": "p", "s": "神仙不肯分明说，说得分明笑杀人。", "o": "神仙不肯分明說，說得分明笑殺人。", "i": 1069}, {"t": "h2", "s": "婴儿现身出离苦海", "o": "婴儿现身出离苦海", "i": 1070}, {"t": "p", "s": "前面<b>火候</b>已足，圣胎已圆，若果之必熟，儿之必生，弥历十月，脱出其胞。", "o": "前面<b>火候</b>已足，聖胎已圓，若果之必熟，兒之必生，彌歷十月，脫出其胞。", "i": 1071}, {"t": "p", "s": "释氏以此谓之法身，又曰实相。玄门以此谓之赤子，又曰<b>婴儿</b>。<b>婴儿</b>当移胎换鼎之时，跃然而出，潜居气穴之间，又重开一混沌也。", "o": "釋氏以此謂之法身，又曰實相。玄門以此謂之赤子，又曰<b>嬰兒</b>。<b>嬰兒</b>當移胎換鼎之時，躍然而出，潛居氣穴之間，又重開一混沌也。", "i": 1072}, {"t": "p", "s": "盖此穴原是神仙长胎住息之乡，赤子安身立命之处。因是熟境，顺路而归。<b>婴儿</b>既宴坐静室，安处道场，须藏以玄玄，守以默默。始则藉<b>坤</b>母黄芽以育之，继则聚天地生意以哺之。此愿彼应，发迩见远。其中自呼自息，自阖自开，自动自静，自由自在，若神仙逍遥于无何乡，似如来禅定于寂灭海。", "o": "蓋此穴原是神仙長胎住息之鄉，赤子安身立命之處。因是熟境，順路而歸。<b>嬰兒</b>既宴坐靜室，安處道場，須藏以玄玄，守以默默。始則藉<b>坤</b>母黃芽以育之，繼則聚天地生意以哺之。此願彼應，發邇見遠。其中自呼自息，自闔自開，自動自靜，自由自在，若神仙逍遙於無何鄉，似如來禪定於寂滅海。", "i": 1073}, {"t": "p", "s": "到此大安乐处，仍须密守关元，无令外缘六尘魔贼所侵，内结烦恼，奸臣所乱。若坐若卧，常施莹净之功。时止时行，广运修持之力。遂得六门不漏，一道常通，真体如如，永固丹基者矣。日夕如此卫护，如此保顾，如龙养珠，如母育子，不可顷刻暂忘，刹那失照。", "o": "到此大安樂處，仍須密守關元，無令外緣六塵魔賊所侵，內結煩惱，奸臣所亂。若坐若臥，常施瑩淨之功。時止時行，廣運修持之力。遂得六門不漏，一道常通，真體如如，永固丹基者矣。日夕如此衛護，如此保顧，如龍養珠，如母育子，不可頃刻暫忘，剎那失照。", "i": 1074}, {"t": "p", "s": "钟离翁曰：", "o": "鐘離翁曰：", "i": 1075}, {"t": "p", "s": "孩儿幼小未成人，须藉<b>坤</b>娘养育恩。", "o": "孩兒幼小未成人，須藉<b>坤</b>娘養育恩。", "i": 1076}, {"t": "p", "s": "又曰：", "o": "又曰：", "i": 1077}, {"t": "p", "s": "已证无为自在心，更须温养保全真。", "o": "已証無為自在心，更須溫養保全真。", "i": 1078}, {"t": "p", "s": "李清庵曰：", "o": "李清庵曰：", "i": 1079}, {"t": "p", "s": "丹从不炼炼中炼，道向无为为处为。息念息缘调祖炁，忘闻忘见养<b>婴儿</b>。", "o": "丹從不煉煉中煉，道向無為為處為。息念息緣調祖炁，忘聞忘見養<b>嬰兒</b>。", "i": 1080}, {"t": "p", "s": "吕纯阳曰：", "o": "呂純陽曰：", "i": 1081}, {"t": "p", "s": "腹内<b>婴儿</b>养已成，且居尘世暂娱情。无端措大刚饶舌，却入白云深处行。", "o": "腹內<b>嬰兒</b>養已成，且居塵世暫娛情。無端措大剛饒舌，卻入白雲深處行。", "i": 1082}, {"t": "p", "s": "盖温养育婴乃作仙之一大事，若养育失调，<b>婴儿</b>就有弃壳离巢之变。此时著实提防，不可轻纵出去，则一出而迷途，遂失舍而无归。", "o": "蓋溫養育嬰乃作仙之一大事，若養育失調，<b>嬰兒</b>就有棄殼離巢之變。此時著實提防，不可輕縱出去，則一出而迷途，遂失舍而無歸。", "i": 1083}, {"t": "p", "s": "故白玉蟾有重整钓鱼杆，再斫秋筠节之叹。", "o": "故白玉蟾有重整釣魚桿，再斫秋筠節之嘆。", "i": 1084}, {"t": "p", "s": "上阳子云：", "o": "上陽子云：", "i": 1085}, {"t": "p", "s": "既达返还九与七，此即木金三五一。炁全神壮换胎时，照护<b>婴儿</b>休远出。", "o": "既達返還九與七，此即木金三五一。炁全神壯換胎時，照護<b>嬰兒</b>休遠出。", "i": 1086}, {"t": "p", "s": "防护之诀，密固三要为紧。", "o": "防護之訣，密固三要為緊。", "i": 1087}, {"t": "p", "s": "参同契曰：", "o": "參同契曰：", "i": 1088}, {"t": "p", "s": "耳目口三宝，闭塞勿发通。真人潜深渊，浮游守规中。", "o": "耳目口三寶，閉塞勿發通。真人潛深淵，浮游守規中。", "i": 1089}, {"t": "p", "s": "其法是以眼观眼，以耳听耳，以鼻调鼻，以口缄口，潜藏飞跃，在正一心。则外无声色臭味之牵，内无意必固我之累。自然方寸虚明，万缘澄寂，而我本来赤子怡怡然安处其中矣。", "o": "其法是以眼觀眼，以耳聽耳，以鼻調鼻，以口緘口，潛藏飛躍，在正一心。則外無聲色臭味之牽，內無意必固我之累。自然方寸虛明，萬緣澄寂，而我本來赤子怡怡然安處其中矣。", "i": 1090}, {"t": "p", "s": "虽然外固三要，尤要内遣三害。三害者，邪念、烦恼、嗔恚是也。故道觉禅师曰：修此戒定慧，断彼嗅贪痴。盖贪痴易于制伏，唯有嗔毒难降。", "o": "雖然外固三要，尤要內遣三害。三害者，邪念、煩惱、嗔恚是也。故道覺禪師曰：修此戒定慧，斷彼嗅貪癡。蓋貪癡易於制伏，唯有嗔毒難降。", "i": 1091}, {"t": "p", "s": "圣胎诀云：嗔恚之火一燃，胎真去如奔马。直待火灭烟消，方才归于庐舍。", "o": "聖胎訣云：嗔恚之火一燃，胎真去如奔馬。直待火滅煙消，方才歸於廬舍。", "i": 1092}, {"t": "p", "s": "宋儒亦曰：忿火不惩，必有燎原之患，欲水不窒，岂无溃川之灾？", "o": "宋儒亦曰：忿火不懲，必有燎原之患，欲水不窒，豈無潰川之災？", "i": 1093}, {"t": "p", "s": "圆觉道场修证仪云：一念嗔起，具八方障门，今欲去嗔之法，唯宗老子之日损、周易之惩忿、世尊之觉照。", "o": "圓覺道場修証儀云：一念嗔起，具八方障門，今欲去嗔之法，唯宗老子之日損、周易之懲忿、世尊之覺照。", "i": 1094}, {"t": "p", "s": "高憎妙普曰：嗔火正燃时，我以觉照之。犹如汤消冰，了了无分别。缘此嗔火非实有体，皆从无名而来。", "o": "高憎妙普曰：嗔火正燃時，我以覺照之。猶如湯消冰，了了無分別。緣此嗔火非實有體，皆從無名而來。", "i": 1095}, {"t": "p", "s": "犹宝积经偈云：如钻木出火，要假众缘力。若缘不和合，火终不得生。是不悦意生，毕竟无所有。知声性空故，嗔也不复生。嗔不在于声，亦不身中住。因缘和合起，离缘缘不生。如因乳等缘，和合生酥酪。嗔目性无起，因于粗恶事。愚者不能了，热恼自烧燃。应当如是知，究竟无所有。嗔性本寂静，但有于假名，嗔恚即实际。以依真如起，了知如法界。是名嗔三昧。", "o": "猶寶積經偈云：如鑽木出火，要假眾緣力。若緣不和合，火終不得生。是不悅意生，畢竟無所有。知聲性空故，嗔也不複生。嗔不在於聲，亦不身中住。因緣和合起，離緣緣不生。如因乳等緣，和合生酥酪。嗔目性無起，因於粗惡事。愚者不能了，熱惱自燒燃。應當如是知，究竟無所有。嗔性本寂靜，但有於假名，嗔恚即實際。以依真如起，了知如法界。是名嗔三昧。", "i": 1096}, {"t": "p", "s": "宝积经又云：求自然智破无名壳，则无名变成慧炬，而嗔火化作心灯，嗔之一毒既消，八万四千烦恼亦灭。", "o": "寶積經又云：求自然智破無名殼，則無名變成慧炬，而嗔火化作心燈，嗔之一毒既消，八萬四千煩惱亦滅。", "i": 1097}, {"t": "p", "s": "佛经云：诸魔平等，烦恼为先。", "o": "佛經云：諸魔平等，煩惱為先。", "i": 1098}, {"t": "p", "s": "又云：现住菩萨魔，烦恼无所有。", "o": "又云：現住菩薩魔，煩惱無所有。", "i": 1099}, {"t": "p", "s": "文云：智者于苦乐，不动如虚空。善观察烦恼，我我所俱离。", "o": "文云：智者於苦樂，不動如虛空。善觀察煩惱，我我所俱離。", "i": 1100}, {"t": "p", "s": "又云：无障大悲，观诸众生，所有烦恼皆从虚假妄想而失。知诸烦恼，体性自离。如是随觉，即是菩提。烦恼之性，即菩提性。", "o": "又云：無障大悲，觀諸眾生，所有煩惱皆從虛假妄想而失。知諸煩惱，體性自離。如是隨覺，即是菩提。煩惱之性，即菩提性。", "i": 1101}, {"t": "p", "s": "又云：烦恼境是佛境界，观烦恼性空是正修行。", "o": "又云：煩惱境是佛境界，觀煩惱性空是正修行。", "i": 1102}, {"t": "p", "s": "又云：欲除烦恼，当行正念。", "o": "又云：欲除煩惱，當行正念。", "i": 1103}, {"t": "p", "s": "四祖亦云：一切烦恼业障，本来空寂。", "o": "四祖亦云：一切煩惱業障，本來空寂。", "i": 1104}, {"t": "p", "s": "细观佛祖经旨大概，谓烦恼性空勿为窒碍，观如梦幻，不用介怀。设使触景情动，如响应声，既应即止。若此，则烦恼尘劳不待断而自灭，胎真赤子弗假修而自灵。", "o": "細觀佛祖經旨大概，謂煩惱性空勿為窒礙，觀如夢幻，不用介懷。設使觸景情動，如響應聲，既應即止。若此，則煩惱塵勞不待斷而自滅，胎真赤子弗假修而自靈。", "i": 1105}, {"t": "p", "s": "又有经云：", "o": "又有經云：", "i": 1106}, {"t": "p", "s": "以智慧剑破烦恼贼，以智慧刀裂烦恼纲，以智慧火烧烦恼薪。", "o": "以智慧劍破煩惱賊，以智慧刀裂煩惱綱，以智慧火燒煩惱薪。", "i": 1107}, {"t": "p", "s": "僧圆照云：", "o": "僧圓照云：", "i": 1108}, {"t": "p", "s": "对治烦恼魔，清净常欢喜。", "o": "對治煩惱魔，清淨常歡喜。", "i": 1109}, {"t": "p", "s": "庞居士云：", "o": "龐居士云：", "i": 1110}, {"t": "p", "s": "谛现四大本空，烦恼何处安脚。", "o": "諦現四大本空，煩惱何處安腳。", "i": 1111}, {"t": "p", "s": "晁文元云：", "o": "晁文元云：", "i": 1112}, {"t": "p", "s": "身同梦幻非真有，事比风云不久留。既能洞达须刚断，烦恼魔空过即休。", "o": "身同夢幻非真有，事比風雲不久留。既能洞達須剛斷，煩惱魔空過即休。", "i": 1113}, {"t": "p", "s": "张紫阳云：", "o": "張紫陽云：", "i": 1114}, {"t": "p", "s": "可谓道高<b>龙虎</b>伏，堪言德重鬼神饮。已知寿永齐天地，烦恼无由更上心。", "o": "可謂道高<b>龍虎</b>伏，堪言德重鬼神飲。已知壽永齊天地，煩惱無由更上心。", "i": 1115}, {"t": "p", "s": "六祖坛经云：凡夫即佛，烦恼即菩提。前念迷即凡夫，后念悟即佛。前念著境即烦恼，后念离境即菩提。", "o": "六祖壇經云：凡夫即佛，煩惱即菩提。前念迷即凡夫，後念悟即佛。前念著境即煩惱，後念離境即菩提。", "i": 1116}, {"t": "p", "s": "故缨珞经云：佛言我从本来不得一法，究竟定意，始知所谓无念。若得无念者，观一切法，悉皆无形，因此得成无上正真之道。", "o": "故纓珞經云：佛言我從本來不得一法，究竟定意，始知所謂無念。若得無念者，觀一切法，悉皆無形，因此得成無上正真之道。", "i": 1117}, {"t": "p", "s": "又云：世人不能成道而脱生死者，良由妄念为轮回种子耳。", "o": "又云：世人不能成道而脫生死者，良由妄念為輪回種子耳。", "i": 1118}, {"t": "p", "s": "盖妄念起处，即是生灾。妄念息处，即是真元。故玄门以止念为本，释教以无念为宗。", "o": "蓋妄念起處，即是生災。妄念息處，即是真元。故玄門以止念為本，釋教以無念為宗。", "i": 1119}, {"t": "p", "s": "无念者，为无邪念，非无正念。念有念无即名邪念，不念有无助名正念。念善念恶即名邪念，不念善恶即名正念。乃至苦乐、生灭、取舍、冤亲、憎爱，井名邪念，不念苦乐等是名正念。但事来不受一切处，无心即是无念也。无念之念，谓之正念。", "o": "無念者，為無邪念，非無正念。念有念無即名邪念，不念有無助名正念。念善念惡即名邪念，不念善惡即名正念。乃至苦樂、生滅、取舍、冤親、憎愛，井名邪念，不念苦樂等是名正念。但事來不受一切處，無心即是無念也。無念之念，謂之正念。", "i": 1120}, {"t": "p", "s": "佛经云：善男子我等住于无念法中，得如是金色三十二相，放大光明，照无余世界。", "o": "佛經云：善男子我等住於無念法中，得如是金色三十二相，放大光明，照無餘世界。", "i": 1121}, {"t": "p", "s": "高峰禅师云：", "o": "高峰禪師云：", "i": 1122}, {"t": "p", "s": "慈氏受一生成佛之功，不出一念无生性海。", "o": "慈氏受一生成佛之功，不出一念無生性海。", "i": 1123}, {"t": "p", "s": "智常禅师云：", "o": "智常禪師云：", "i": 1124}, {"t": "p", "s": "真如无念。非念法能阶实相，无生岂生心。能至无念念者，即念真如；无生生者，生乎实相。", "o": "真如無念。非念法能階實相，無生豈生心。能至無念念者，即念真如；無生生者，生乎實相。", "i": 1125}, {"t": "p", "s": "李之才云：", "o": "李之才云：", "i": 1126}, {"t": "p", "s": "念之天理则明月之当空，念之人欲则浮云之蔽日。", "o": "念之天理則明月之當空，念之人欲則浮雲之蔽日。", "i": 1127}, {"t": "p", "s": "寒山子云：", "o": "寒山子云：", "i": 1128}, {"t": "p", "s": "旋<b>乾</b>倒岳镇常静，一念万年永不移。", "o": "旋<b>乾</b>倒岳鎮常靜，一念萬年永不移。", "i": 1129}, {"t": "p", "s": "天隐子云：", "o": "天隱子云：", "i": 1130}, {"t": "p", "s": "不睹不闻存觉性，无思无念养胎仙。", "o": "不睹不聞存覺性，無思無念養胎仙。", "i": 1131}, {"t": "p", "s": "宝积经中所说菩萨安住无所住之念，非忆非忘所安住念，即名法界。是知从上若佛、若祖、若圣、若仙，皆因冥心息念而得妙道。", "o": "寶積經中所說菩薩安住無所住之念，非憶非忘所安住念，即名法界。是知從上若佛、若祖、若聖、若仙，皆因冥心息念而得妙道。", "i": 1132}, {"t": "p", "s": "故尚书曰：唯狂克念作圣，然克念之功须要躬行实践，方有进步。不然，一片太虚，途路甚远，少一步定是到不得。", "o": "故尚書曰：唯狂克念作聖，然克念之功須要躬行實踐，方有進步。不然，一片太虛，途路甚遠，少一步定是到不得。", "i": 1133}, {"t": "p", "s": "昔人所谓工夫不到不方圆，工夫若做到极，则处自然入于无念。既得无念真常，则玄窍<b>婴儿</b>寂寂然而无挠扰之患矣。", "o": "昔人所謂工夫不到不方圓，工夫若做到極，則處自然入於無念。既得無念真常，則玄竅<b>嬰兒</b>寂寂然而無撓擾之患矣。", "i": 1134}, {"t": "p", "s": "刘虚谷云：", "o": "劉虛穀云：", "i": 1135}, {"t": "p", "s": "大功欲就三千日，妙用无亏十二时。", "o": "大功欲就三千日，妙用無虧十二時。", "i": 1136}, {"t": "p", "s": "陈朝元云：", "o": "陳朝元云：", "i": 1137}, {"t": "p", "s": "含养胞胎须十月，育婴乳哺要千朝。", "o": "含養胞胎須十月，育嬰乳哺要千朝。", "i": 1138}, {"t": "p", "s": "泥丸翁云：", "o": "泥丸翁云：", "i": 1139}, {"t": "p", "s": "片响工夫修便现，老成须是过三年。", "o": "片響工夫修便現，老成須是過三年。", "i": 1140}, {"t": "p", "s": "三年功夫已完，温养事毕。即悟真所谓，一霎火焰飞，真人自出现。真人既现，必出太玄而升天谷，再加冥心灭尽之功，则有通灵变化之妙。", "o": "三年功夫已完，溫養事畢。即悟真所謂，一霎火焰飛，真人自出現。真人既現，必出太玄而升天谷，再加冥心滅盡之功，則有通靈變化之妙。", "i": 1141}, {"t": "p", "s": "刘海蟾曰：", "o": "劉海蟾曰：", "i": 1142}, {"t": "p", "s": "卦行火侯<b>周天</b>毕，孕个<b>婴儿</b>镇下田。霹雳一声从地起，<b>乾</b>户肇开光万里。翻身推出太<b>玄关</b>，这回方是真仙子。", "o": "卦行火侯<b>周天</b>畢，孕個<b>嬰兒</b>鎮下田。霹靂一聲從地起，<b>乾</b>戶肇開光萬里。翻身推出太<b>玄關</b>，這回方是真仙子。", "i": 1143}, {"t": "h2", "s": "真空炼形法则", "o": "真空炼形法则", "i": 1144}, {"t": "p", "s": "普照怫心曰：", "o": "普照怫心曰：", "i": 1145}, {"t": "p", "s": "异端有白我其观，却叹人从瓮里盘。最上一乘含蓄远，好从玄窍觅天宽。", "o": "異端有白我其觀，卻嘆人從甕裏盤。最上一乘含蓄遠，好從玄竅覓天寬。", "i": 1146}, {"t": "p", "s": "盖<mark>真空炼形</mark>之法，譬喻运瓮相似。若处瓮内，焉能运之，必也处于瓮外。身处瓮外者，即释氏所谓外其身而虚空之是也。", "o": "蓋<mark>真空煉形</mark>之法，譬喻運甕相似。若處甕內，焉能運之，必也處於甕外。身處甕外者，即釋氏所謂外其身而虛空之是也。", "i": 1147}, {"t": "p", "s": "故老子曰：", "o": "故老子曰：", "i": 1148}, {"t": "p", "s": "外其身而身修，忘其形而形存。", "o": "外其身而身修，忘其形而形存。", "i": 1149}, {"t": "p", "s": "薛道光曰：", "o": "薛道光曰：", "i": 1150}, {"t": "p", "s": "若人空此幻化身，亲授圣师真规则。", "o": "若人空此幻化身，親授聖師真規則。", "i": 1151}, {"t": "p", "s": "张全一曰：", "o": "張全一曰：", "i": 1152}, {"t": "p", "s": "太虚是我，先空其身。其身既空，天地亦空。", "o": "太虛是我，先空其身。其身既空，天地亦空。", "i": 1153}, {"t": "p", "s": "天地既空，太空亦空。空无所空，乃是<b>真空</b>。", "o": "天地既空，太空亦空。空無所空，乃是<b>真空</b>。", "i": 1154}, {"t": "p", "s": "清静经曰：内观其心，心无其心。外视其形，形无其形。形无其形者，身空也；心无其心者，心空也。心空无碍，则神愈炼而愈灵；身空无碍，则形愈炼而愈清。直炼到形与神而相涵，身与心而为一，方才是形神俱妙、与道合真者也。", "o": "清靜經曰：內觀其心，心無其心。外視其形，形無其形。形無其形者，身空也；心無其心者，心空也。心空無礙，則神愈煉而愈靈；身空無礙，則形愈煉而愈清。直煉到形與神而相涵，身與心而為一，方才是形神俱妙、與道合真者也。", "i": 1155}, {"t": "note", "s": "口诀引证：古仙曰：形以道全，命以术延。此术是窍无涯之元炁，续有限之形躯。无涯之元炁，是天地阴阳长生真精灵父圣母之炁也。有限之形躯，是阴阳短促浊乱凡父凡母之气也。故以真父母之炁变化凡父母之身为纯阳真精之形，则与天地同寿也。", "o": "口诀引证：古仙曰：形以道全，命以術延。此術是竅無涯之元炁，續有限之形軀。無涯之元炁，是天地陰陽長生真精靈父聖母之炁也。有限之形軀，是陰陽短促濁亂凡父凡母之氣也。故以真父母之炁變化凡父母之身為純陽真精之形，則與天地同壽也。", "i": 1156}, {"t": "p", "s": "按孙陀罗尊者云：世尊教我观鼻端白，我初谛观，经三七日，见鼻中气出入如烟，身心内明，圆洞世界，遍成虚净，犹如硫璃烟相渐消，鼻息成白，心开漏尽，诸出入息化为光照，照十方界，得阿罗汉。", "o": "按孫陀羅尊者云：世尊教我觀鼻端白，我初諦觀，經三七日，見鼻中氣出入如煙，身心內明，圓洞世界，遍成虛淨，猶如硫璃煙相漸消，鼻息成白，心開漏盡，諸出入息化為光照，照十方界，得阿羅漢。", "i": 1157}, {"t": "p", "s": "朱元晦云：", "o": "朱元晦云：", "i": 1158}, {"t": "p", "s": "鼻端有白，我其观之。", "o": "鼻端有白，我其觀之。", "i": 1159}, {"t": "p", "s": "莫认真云：", "o": "莫認真云：", "i": 1160}, {"t": "p", "s": "平生姿韵爱风流，几笑时人向外求。万别千差无觅处，得来原在鼻尖头。", "o": "平生姿韻愛風流，幾笑時人向外求。萬別千差無覓處，得來原在鼻尖頭。", "i": 1161}, {"t": "p", "s": "夫人未生之先，一呼一吸，气通于母。人之既生之后，一呼一吸，气通于天。天人一气，联属流通，相吞相吐，如扯锯焉。天与之我，能取之得其气，气盛而生也。天与之天，复取之失其气，气绝而死也。", "o": "夫人未生之先，一呼一吸，氣通於母。人之既生之後，一呼一吸，氣通於天。天人一氣，聯屬流通，相吞相吐，如扯鋸焉。天與之我，能取之得其氣，氣盛而生也。天與之天，複取之失其氣，氣絕而死也。", "i": 1162}, {"t": "p", "s": "故圣人观天之道，抉天之行，每于义驭未升，肠谷之时，凝神静坐，虚以待之，内含意念，外舍万缘，顿忘天地，粉碎形骸。自然太虚中有一点如露如电之阳，勃勃然，入玄门，透长谷，而境上泥丸，化为甘霖而降于五内。我即鼓动巽风以应之，使其驱逐<b>三关</b>九窍之邪，扫荡五脏六腑之垢，焚身炼质，煆滓销霾，抽尽秽浊之躯，变换纯阳之体。累积长久，化形而仙。", "o": "故聖人觀天之道，抉天之行，每於義馭未升，腸穀之時，凝神靜坐，虛以待之，內含意念，外舍萬緣，頓忘天地，粉碎形骸。自然太虛中有一點如露如電之陽，勃勃然，入玄門，透長谷，而境上泥丸，化為甘霖而降於五內。我即鼓動巽風以應之，使其驅逐<b>三關</b>九竅之邪，掃蕩五臟六腑之垢，焚身煉質，煆滓銷霾，抽盡穢濁之軀，變換純陽之體。累積長久，化形而仙。", "i": 1163}, {"t": "p", "s": "陈翠虚曰：", "o": "陳翠虛曰：", "i": 1164}, {"t": "p", "s": "透体金光骨髓香，金筋玉骨尽纯阳。炼教赤血流为白，阴气消磨身自康。", "o": "透體金光骨髓香，金筋玉骨盡純陽。煉教赤血流為白，陰氣消磨身自康。", "i": 1165}, {"t": "p", "s": "丘长春曰：", "o": "丘長春曰：", "i": 1166}, {"t": "p", "s": "但能息息常相顾，换尽形骸玉液流。", "o": "但能息息常相顧，換盡形骸玉液流。", "i": 1167}, {"t": "p", "s": "张紫琼曰：", "o": "張紫瓊曰：", "i": 1168}, {"t": "p", "s": "天人一气本来同，为有形骸碍不通。炼到形神冥合处，方知色相即<b>真空</b>。", "o": "天人一氣本來同，為有形骸礙不通。煉到形神冥合處，方知色相即<b>真空</b>。", "i": 1169}, {"t": "p", "s": "薛复命曰：", "o": "薛複命曰：", "i": 1170}, {"t": "p", "s": "不知将谓气，得后自然真。", "o": "不知將謂氣，得後自然真。", "i": 1171}, {"t": "note", "s": "口诀引证：董汉醇曰：金用矿消，形由炁炼。炼形之法，总有六门。其一曰<mark>玉液炼形</mark>，其二曰金液炼形，其三曰太阴炼形，其四曰太阳炼形，其五曰内观炼形。若此者总非虚无大道，终不能与太虚同体。唯此一诀，乃曰<mark>真空炼形</mark>。虽曰有作，其实无为，虽曰炼形，其实炼神，是修外而兼修内也。", "o": "口诀引证：董漢醇曰：金用礦消，形由炁煉。煉形之法，總有六門。其一曰<mark>玉液煉形</mark>，其二曰金液煉形，其三曰太陰煉形，其四曰太陽煉形，其五曰內觀煉形。若此者總非虛無大道，終不能與太虛同體。唯此一訣，乃曰<mark>真空煉形</mark>。雖曰有作，其實無為，雖曰煉形，其實煉神，是修外而兼修內也。", "i": 1172}, {"t": "p", "s": "依法炼之，百日则七魄亡形，三尸绝迹，六贼潜藏，而十魔远遁矣。炼之千日，则四大一身，俨如水晶塔干，表里玲珑，内外洞彻，心华灿然，灵光显现。灵光者，慧光也，故曰惹光生处觉花开。盖慧觉花开非炼形入微与道冥一者不能有此。", "o": "依法煉之，百日則七魄亡形，三尸絕跡，六賊潛藏，而十魔遠遁矣。煉之千日，則四大一身，儼如水晶塔干，表裏玲瓏，內外洞徹，心華燦然，靈光顯現。靈光者，慧光也，故曰惹光生處覺花開。蓋慧覺花開非煉形入微與道冥一者不能有此。", "i": 1173}, {"t": "p", "s": "故生神经曰：身神并一，则为真身；身与神合，形随道通。隐则形固于神，显则神合于气。所以蹈水火而无碍，对日月而无影。吾亡在己，出入无间。或留形住世，或脱质升仙。有白日而飞肉尸者，黄帝之谓也。有留形在世者，彭祖之谓也。有受命而居天职者，张天师之谓也。有拔宅而上升者，许施阳之谓也。有示疾而终者，王重阳之谓也。有入仕而臣者，东方朔之谓也。至于老子为柱史，辛钘为大夫，尹喜为关令，伯姬为卿上，唐典隐昆陵，孑休治漆园，帝者师四，皓辅汉惠，仇生仕殷，辅光仕汉，马舟仕晋，海蟾仕燕，正阳弃官，纯阳应举，常有执鞭，琴高执笏。若此者，多不可以枚数。", "o": "故生神經曰：身神並一，則為真身；身與神合，形隨道通。隱則形固於神，顯則神合於氣。所以蹈水火而無礙，對日月而無影。吾亡在己，出入無間。或留形住世，或脫質升仙。有白日而飛肉尸者，黃帝之謂也。有留形在世者，彭祖之謂也。有受命而居天職者，張天師之謂也。有拔宅而上升者，許施陽之謂也。有示疾而終者，王重陽之謂也。有入仕而臣者，東方朔之謂也。至於老子為柱史，辛鈃為大夫，尹喜為關令，伯姬為卿上，唐典隱昆陵，孑休治漆園，帝者師四，皓輔漢惠，仇生仕殷，輔光仕漢，馬舟仕晉，海蟾仕燕，正陽棄官，純陽應舉，常有執鞭，琴高執笏。若此者，多不可以枚數。", "i": 1174}, {"t": "p", "s": "噫！神仙之隐显去留，岂世之凡夫所能测度者哉。更若凭虚御风之，列子折芦过江之，达摩非若淘质炼形之功，又安能如此轻举之身乎？此形神俱妙之道，非坐脱立亡者之所能知。所以不免有抛身入身之失尔。", "o": "噫！神仙之隱顯去留，豈世之凡夫所能測度者哉。更若憑虛御風之，列子折蘆過江之，達摩非若淘質煉形之功，又安能如此輕舉之身乎？此形神俱妙之道，非坐脫立亡者之所能知。所以不免有拋身入身之失爾。", "i": 1175}, {"t": "p", "s": "故学仙佛之流，若独以炼神为妙，不知炼形为要者，所谓清灵善化之鬼，何可与高仙为比哉？大抵温养炼形，无分彼此，虽然在两处发明，其实是一个道理。内外兼修，不相违背。若十日功夫无间，乃悬崖撒手时也。自然言语道断，心思路绝。能所两亡，色空俱泯，无滞无碍，不染不著，身似翔鸿不可笼，心如莲华不著水。火光净净，潇潇洒洒，腾腾任运，任运腾腾，做一个无事无为、自在消逼之散汉也。此际<b>婴儿</b>渐露其形，与人无异，愈要含华隐曜，镇静心田，若起欢忻，就要广境。", "o": "故學仙佛之流，若獨以煉神為妙，不知煉形為要者，所謂清靈善化之鬼，何可與高仙為比哉？大抵溫養煉形，無分彼此，雖然在兩處發明，其實是一個道理。內外兼修，不相違背。若十日功夫無間，乃懸崖撒手時也。自然言語道斷，心思路絕。能所兩亡，色空俱泯，無滯無礙，不染不著，身似翔鴻不可籠，心如蓮華不著水。火光淨淨，瀟瀟灑灑，騰騰任運，任運騰騰，做一個無事無為、自在消逼之散漢也。此際<b>嬰兒</b>漸露其形，與人無異，愈要含華隱曜，鎮靜心田，若起歡忻，就要廣境。", "i": 1176}, {"t": "p", "s": "如陈泥丸云：", "o": "如陳泥丸云：", "i": 1177}, {"t": "p", "s": "我昔功夫行一年，六脉已息气归根。有个<b>婴儿</b>在丹田，与我形貌亦如然。", "o": "我昔功夫行一年，六脈已息氣歸根。有個<b>嬰兒</b>在丹田，與我形貌亦如然。", "i": 1178}, {"t": "p", "s": "<b>婴儿</b>既长，穴不能居，自然裂窍而出、贯顶而升。此之谓出离苦海而起彼岸也。", "o": "<b>嬰兒</b>既長，穴不能居，自然裂竅而出、貫頂而升。此之謂出離苦海而起彼岸也。", "i": 1179}, {"t": "p", "s": "永明寿禅师云：", "o": "永明壽禪師云：", "i": 1180}, {"t": "p", "s": "身在苦海中，赖此铁罗汉。苦海既脱离，舍筏登彼岸。", "o": "身在苦海中，賴此鐵羅漢。苦海既脫離，舍筏登彼岸。", "i": 1181}, {"t": "p", "s": "观吾陈真人云：", "o": "觀吾陳真人云：", "i": 1182}, {"t": "p", "s": "此岸波涛已脱离，到彼方知寿可跻。一得归来宜永得，渡河筏子上天梯。", "o": "此岸波濤已脫離，到彼方知壽可躋。一得歸來宜永得，渡河筏子上天梯。", "i": 1183}, {"t": "h2", "s": "移神内院端拱冥心", "o": "移神内院端拱冥心", "i": 1184}, {"t": "p", "s": "始则有作有为者，采药结丹以了命也；终则无作无为者，抱一冥心以了性也。", "o": "始則有作有為者，採藥結丹以了命也；終則無作無為者，抱一冥心以了性也。", "i": 1185}, {"t": "p", "s": "悟真篇云：", "o": "悟真篇云：", "i": 1186}, {"t": "p", "s": "始则有作人争觉，及至无为众始知。但见无为为道妙，不知有作是根基。", "o": "始則有作人爭覺，及至無為眾始知。但見無為為道妙，不知有作是根基。", "i": 1187}, {"t": "p", "s": "证道歌云：", "o": "証道歌云：", "i": 1188}, {"t": "p", "s": "到无为处不无为，方知吾道是希夷。", "o": "到無為處不無為，方知吾道是希夷。", "i": 1189}, {"t": "p", "s": "今之在象凡夫、出家外道，只知有这边道理，不知有那边境界，只知有此间之妙，不知有彼岸之玄；只知无事，而不知希有之事；只知无为，而不知有为之法。此乃知其一不知其二。修其性不修其命者也。", "o": "今之在象凡夫、出家外道，只知有這邊道理，不知有那邊境界，只知有此間之妙，不知有彼岸之玄；只知無事，而不知希有之事；只知無為，而不知有為之法。此乃知其一不知其二。修其性不修其命者也。", "i": 1190}, {"t": "p", "s": "故丹道未成之先，若不知下学之有为，而著于空焉，则谓之落空汉。丹道已成之后，若不知上达之无为，而著于相焉，则谓之守尸鬼。", "o": "故丹道未成之先，若不知下學之有為，而著於空焉，則謂之落空漢。丹道已成之後，若不知上達之無為，而著於相焉，則謂之守尸鬼。", "i": 1191}, {"t": "p", "s": "石杏林曰：", "o": "石杏林曰：", "i": 1192}, {"t": "p", "s": "有物非无物，无为合有为。", "o": "有物非無物，無為合有為。", "i": 1193}, {"t": "p", "s": "陈泥丸曰：", "o": "陳泥丸曰：", "i": 1194}, {"t": "p", "s": "我闻前代诸圣师，无为之中无不为。", "o": "我聞前代諸聖師，無為之中無不為。", "i": 1195}, {"t": "p", "s": "阴长生曰：", "o": "陰長生曰：", "i": 1196}, {"t": "p", "s": "无为真人居上界，空寂更无尘可碍。有为功就又无为，无为也有功夫在。", "o": "無為真人居上界，空寂更無塵可礙。有為功就又無為，無為也有功夫在。", "i": 1197}, {"t": "p", "s": "所谓真人居上界者，即<b>婴儿</b>出离苦海、移居天谷之时也。空寂冥心者，即吕祖向晦冥息真心合道之法也。", "o": "所謂真人居上界者，即<b>嬰兒</b>出離苦海、移居天穀之時也。空寂冥心者，即呂祖向晦冥息真心合道之法也。", "i": 1198}, {"t": "note", "s": "口诀引证：施肩吾曰：达摩面壁九年，方超内院世尊。冥心六载，始脱樊笼。", "o": "口诀引证：施肩吾曰：達摩面壁九年，方超內院世尊。冥心六載，始脫樊籠。", "i": 1199}, {"t": "p", "s": "夫冥心者，深居静室，端拱默然，一尘不染，万虑俱忘，无思无为，任运自如；无视无听，抱神以静，无内无外，无将无应，离相离空，离迷离妄，体含虚寂，常觉常明，但冥此心，万法归一，则<b>婴儿</b>安居于清灵之境、栖止于不动之场。色不得而碍之，空不得而缚之，体若虚空，安然自在矣。", "o": "夫冥心者，深居靜室，端拱默然，一塵不染，萬慮俱忘，無思無為，任運自如；無視無聽，抱神以靜，無內無外，無將無應，離相離空，離迷離妄，體含虛寂，常覺常明，但冥此心，萬法歸一，則<b>嬰兒</b>安居於清靈之境、棲止於不動之場。色不得而礙之，空不得而縛之，體若虛空，安然自在矣。", "i": 1200}, {"t": "p", "s": "故达观禅师云：", "o": "故達觀禪師云：", "i": 1201}, {"t": "p", "s": "色不缚兮空不碍，昙息冥心观自在。大千万有总归无，世界坏时渠不坏。", "o": "色不縛兮空不礙，曇息冥心觀自在。大千萬有總歸無，世界壞時渠不壞。", "i": 1202}, {"t": "p", "s": "谭长真云：", "o": "譚長真云：", "i": 1203}, {"t": "p", "s": "<b>婴儿</b>移在上丹田，端拱冥心合自然。修到三千功行满，凭他作佛与升仙。", "o": "<b>嬰兒</b>移在上丹田，端拱冥心合自然。修到三千功行滿，憑他作佛與升仙。", "i": 1204}, {"t": "p", "s": "此处是纯一不杂的工夫，岂能空纤毫情想，但起希仙作佛之心，便直生死窍中，不能得出。", "o": "此處是純一不雜的工夫，豈能空纖毫情想，但起希仙作佛之心，便直生死竅中，不能得出。", "i": 1205}, {"t": "p", "s": "所以关尹子云：若有厌生死心，超生死心，只名为妖，不名为道。", "o": "所以關尹子云：若有厭生死心，超生死心，只名為妖，不名為道。", "i": 1206}, {"t": "p", "s": "益清静体中，空空荡荡，晃晃朗朗，一无所有，一切无住。", "o": "益清靜體中，空空蕩蕩，晃晃朗朗，一無所有，一切無住。", "i": 1207}, {"t": "p", "s": "故心要诀云：", "o": "故心要訣云：", "i": 1208}, {"t": "p", "s": "冥心本乎无住无，住心体圆融不测。", "o": "冥心本乎無住無，住心體圓融不測。", "i": 1209}, {"t": "p", "s": "如金刚经云：不应住色生心，不应住声、香、味、触法，生心应生无所住心。", "o": "如金剛經云：不應住色生心，不應住聲、香、味、觸法，生心應生無所住心。", "i": 1210}, {"t": "p", "s": "金刚齐菩萨云：我不依有住而住，不依无住而住，如是而住。", "o": "金剛齊菩薩云：我不依有住而住，不依無住而住，如是而住。", "i": 1211}, {"t": "p", "s": "憎肇云：圣人之心，住无所住，其住坐忘。", "o": "憎肇云：聖人之心，住無所住，其住坐忘。", "i": 1212}, {"t": "p", "s": "论云：不依一法，而心常住。", "o": "論云：不依一法，而心常住。", "i": 1213}, {"t": "p", "s": "了心经云：心无所住，住无所心，了无执著，无住转真。", "o": "了心經云：心無所住，住無所心，了無執著，無住轉真。", "i": 1214}, {"t": "p", "s": "净名经云：一切法以无住为本，安住无为，名之为住，住无方所，故名无住。无住心者，是为真心。", "o": "淨名經云：一切法以無住為本，安住無為，名之為住，住無方所，故名無住。無住心者，是為真心。", "i": 1215}, {"t": "p", "s": "禅源集云：言心者是心之名，言知者是心之体。", "o": "禪源集云：言心者是心之名，言知者是心之體。", "i": 1216}, {"t": "p", "s": "菏泽云：心体能知，知即是心，心本空寂，至虚至灵。由空寂虚灵而知者，先知也。由空寂虚灵而觉者，先觉也。不虑而觉者，谓之正觉。不思而知者，谓之真知。", "o": "菏澤云：心體能知，知即是心，心本空寂，至虛至靈。由空寂虛靈而知者，先知也。由空寂虛靈而覺者，先覺也。不慮而覺者，謂之正覺。不思而知者，謂之真知。", "i": 1217}, {"t": "p", "s": "故祖师云：空寂体上，自有本智能知，即此空寂之知，便是达摩所传清净心也。心常寂是自性体，心常知是自性用。", "o": "故祖師云：空寂體上，自有本智能知，即此空寂之知，便是達摩所傳清淨心也。心常寂是自性體，心常知是自性用。", "i": 1218}, {"t": "p", "s": "所以六祖云：一切万法，不离自性，自性自知，自性自见，自性自悟，自悟自度。悟性还易，了心甚难。故了心也者，了此心也。了心，则心无其心矣。无心之心，是谓真心。真心是性，真性是心。", "o": "所以六祖云：一切萬法，不離自性，自性自知，自性自見，自性自悟，自悟自度。悟性還易，了心甚難。故了心也者，了此心也。了心，則心無其心矣。無心之心，是謂真心。真心是性，真性是心。", "i": 1219}, {"t": "p", "s": "太上云：了心真性，了性真心，空无空处，无处了真。此谓<b>真空</b>不空，空无所空，即是了见本心也。", "o": "太上云：了心真性，了性真心，空無空處，無處了真。此謂<b>真空</b>不空，空無所空，即是了見本心也。", "i": 1220}, {"t": "p", "s": "庞居士云：", "o": "龐居士云：", "i": 1221}, {"t": "p", "s": "十方同聚会，个个学无为。此是选佛场，心空及第归。", "o": "十方同聚會，個個學無為。此是選佛場，心空及第歸。", "i": 1222}, {"t": "p", "s": "与夫空觉极圆，空所空灭，即是了见本性也。", "o": "與夫空覺極圓，空所空滅，即是了見本性也。", "i": 1223}, {"t": "p", "s": "华严经云：", "o": "華嚴經云：", "i": 1224}, {"t": "p", "s": "法性本空寂，无取亦无见。性空即是佛，不可得思量。", "o": "法性本空寂，無取亦無見。性空即是佛，不可得思量。", "i": 1225}, {"t": "p", "s": "原夫性体本空，心体本定。无空无无空即名毕竟空，无定无无定即名其如定。虽修空，不以空为证，不作空想，即是<b>真空</b>也。虽得定，不以定为证，不作定想，即名真定也。空定衡极，通达无碍，一旦天机透露，慧性灵通，乍似莲花开，恍如睡梦觉，忽然现出天然境界，充满于上天下地而无尽藏也。此是心性常明，炯炯不昧，晃朗宇宙，照彻古今，变化无方，神妙莫测。虽具肉眼而开慧眼之光明，非易凡心便同佛心之知见，乃是见性见到彻处，修行修到密处。故得—性圆明六通顿足。", "o": "原夫性體本空，心體本定。無空無無空即名畢竟空，無定無無定即名其如定。雖修空，不以空為証，不作空想，即是<b>真空</b>也。雖得定，不以定為証，不作定想，即名真定也。空定衡極，通達無礙，一旦天機透露，慧性靈通，乍似蓮花開，恍如睡夢覺，忽然現出天然境界，充滿於上天下地而無盡藏也。此是心性常明，炯炯不昧，晃朗宇宙，照徹古今，變化無方，神妙莫測。雖具肉眼而開慧眼之光明，非易凡心便同佛心之知見，乃是見性見到徹處，修行修到密處。故得—性圓明六通頓足。", "i": 1226}, {"t": "p", "s": "何谓六通？按玉阳大师曰：坐到静时，陡然心光发现，内则洞见肺腑，外则自见须眉，智神踊跃，日赋万言，说妙谈玄，无穷无极，此是心境通也。不出庐舍，预知未来事情。身处室中，又能隔墙见物。此是神境通也。正坐之间，刹时迷闷，混沌不分，少顷心窍豁然大开，地理山河，犹如掌上观纹，此是天眼通也。能闻十方之音如耳边音，能忆生前之事如眼前事，此是天耳通也。或昼或夜，入于<b>大定</b>，上是天堂，下见地狱，观透无数劫来宿命所更，此是宿信通也。神通变化，出如自如，洞鉴十方众生，知他心内隐微之事。他虽意念未起，了了先知，他虽意念未萌，了了先觉，此是他心通也。", "o": "何謂六通？按玉陽大師曰：坐到靜時，陡然心光發現，內則洞見肺腑，外則自見須眉，智神踊躍，日賦萬言，說妙談玄，無窮無極，此是心境通也。不出廬舍，預知未來事情。身處室中，又能隔牆見物。此是神境通也。正坐之間，剎時迷悶，混沌不分，少頃心竅豁然大開，地理山河，猶如掌上觀紋，此是天眼通也。能聞十方之音如耳邊音，能憶生前之事如眼前事，此是天耳通也。或晝或夜，入於<b>大定</b>，上是天堂，下見地獄，觀透無數劫來宿命所更，此是宿信通也。神通變化，出如自如，洞鑒十方眾生，知他心內隱微之事。他雖意念未起，了了先知，他雖意念未萌，了了先覺，此是他心通也。", "i": 1227}, {"t": "p", "s": "子思曰：心之精神之谓圣。故心定而能慧，心寂而能感，心静而能知，心空而能灵，心诚而能明，心虚而能觉。", "o": "子思曰：心之精神之謂聖。故心定而能慧，心寂而能感，心靜而能知，心空而能靈，心誠而能明，心虛而能覺。", "i": 1228}, {"t": "note", "s": "口诀引证：四祖道信曰：一切神通作用，皆是自心感现。", "o": "口诀引证：四祖道信曰：一切神通作用，皆是自心感現。", "i": 1229}, {"t": "p", "s": "璎珞经曰：神名<b>天心</b>，通名慧性。天然之慧彻照无得，故名神通。神通具足，愈加默耀，韬光慧而不用，若露圭角，恐染邪魔。", "o": "瓔珞經曰：神名<b>天心</b>，通名慧性。天然之慧徹照無得，故名神通。神通具足，愈加默耀，韜光慧而不用，若露圭角，恐染邪魔。", "i": 1230}, {"t": "p", "s": "古云：道高一尺，魔高一丈。正定之时，或闻种种善恶之声，或现种种违顺之境，总是魔障，不可著他。又须反观一身，四大皆是假，合如梦幻，全体非身。但在此心，魔自消灭。", "o": "古云：道高一尺，魔高一丈。正定之時，或聞種種善惡之聲，或現種種違順之境，總是魔障，不可著他。又須反觀一身，四大皆是假，合如夢幻，全體非身。但在此心，魔自消滅。", "i": 1231}, {"t": "p", "s": "古语云：见怪不怪怪自亡，见魔非魔魔自灭。或脑中有霹雳之声，或眼内有金星灿耀，或顶下红霞了绕，或眉间涌出圆光，此皆幻景，心莫受他，但行工夫，休证效验。", "o": "古語云：見怪不怪怪自亡，見魔非魔魔自滅。或腦中有霹靂之聲，或眼內有金星燦耀，或頂下紅霞了繞，或眉間湧出圓光，此皆幻景，心莫受他，但行工夫，休証效驗。", "i": 1232}, {"t": "p", "s": "所以古仙云：项下有光犹是幻，云生足下未为仙。又于静中忽见楼台珠翠、女乐笙簧、异草奇花、触目如画，彼人不悟，将谓是到天宫，不知自身内院，认作真境，因循而不出。入此际须用虚空观而扩充之，则我天谷之神升入太虚，合而为一也。", "o": "所以古仙云：項下有光猶是幻，雲生足下未為仙。又於靜中忽見樓台珠翠、女樂笙簧、異草奇花、觸目如畫，彼人不悟，將謂是到天宮，不知自身內院，認作真境，因循而不出。入此際須用虛空觀而擴充之，則我天穀之神升入太虛，合而為一也。", "i": 1233}, {"t": "p", "s": "其虚空观者，应观自心。心本不生，自性成就，本来空寂，光明遍照，犹如虚空莹彻，清净廓然，周遍圆明，皎洁成大月轮，量等虚空，浩然无际。复应观察自身，则心之虚空而通于身之虚空，身之虚空而通于天地之虚空，天地之虚空而通于太极之虚空，虚虚相通，共成一片，岂不与太虚混之而为一耶？", "o": "其虛空觀者，應觀自心。心本不生，自性成就，本來空寂，光明遍照，猶如虛空瑩徹，清淨廓然，周遍圓明，皎潔成大月輪，量等虛空，浩然無際。複應觀察自身，則心之虛空而通於身之虛空，身之虛空而通於天地之虛空，天地之虛空而通於太極之虛空，虛虛相通，共成一片，豈不與太虛混之而為一耶？", "i": 1234}, {"t": "p", "s": "始而虚其心也，既而虚其身，又既而虚天地，虚而无虚，无虚而虚，虚也不知，无虚也不知，则我<mark>阳神</mark>冲虚出入而无障碍矣。然后方可与天地合德，太虚同体，而为混虚氏之人欤。", "o": "始而虛其心也，既而虛其身，又既而虛天地，虛而無虛，無虛而虛，虛也不知，無虛也不知，則我<mark>陽神</mark>衝虛出入而無障礙矣。然後方可與天地合德，太虛同體，而為混虛氏之人歟。", "i": 1235}, {"t": "p", "s": "此处只言到太虚之阶梯，未曾造到太虚之实际。谓之炼神则可，谓之<mark>出神</mark>则未也。", "o": "此處只言到太虛之階梯，未曾造到太虛之實際。謂之煉神則可，謂之<mark>出神</mark>則未也。", "i": 1236}, {"t": "p", "s": "欲要高奔帝境，当炼演谷神，常以灵和寂照，为心虚空不住，为观抱本还原归太极，由此进进不已，及其无上可上，玄之又玄，无象可象，不然而然，则一灵之妙有遍法界，而圆通贯云汉，以高跻与穹冥而俱合，此天谷<mark>元神</mark>炼到至极至妙之处也。", "o": "欲要高奔帝境，當煉演谷神，常以靈和寂照，為心虛空不住，為觀抱本還原歸太極，由此進進不已，及其無上可上，玄之又玄，無象可象，不然而然，則一靈之妙有遍法界，而圓通貫雲漢，以高躋與穹冥而俱合，此天穀<mark>元神</mark>煉到至極至妙之處也。", "i": 1237}, {"t": "p", "s": "故章思廉曰：得太极全体，见本来面目，先天一点真，后天却是屋。", "o": "故章思廉曰：得太極全體，見本來面目，先天一點真，後天卻是屋。", "i": 1238}, {"t": "note", "s": "口诀引证：莹蟾子曰：炼<mark>阳神</mark>了出<mark>阳神</mark>，自色界超无色界。既然证成妙道，须要混俗和光。虽处凡尘，而不可流俗；虽居浊世，而莫测行藏。日唯销隐，匿积阴功，开诚心，施法乳，汲引后学，普度众生，上报佛恩，下资群品。", "o": "口诀引证：瑩蟾子曰：煉<mark>陽神</mark>了出<mark>陽神</mark>，自色界超無色界。既然証成妙道，須要混俗和光。雖處凡塵，而不可流俗；雖居濁世，而莫測行藏。日唯銷隱，匿積陰功，開誠心，施法乳，汲引後學，普度眾生，上報佛恩，下資群品。", "i": 1239}, {"t": "p", "s": "金刚经曰：所有一切众生之类，若卵生、若胎生、若湿生、若化生、若有色、若无色、若有想、若无想、若非有想、若非无想、我皆令入无余，涅盘而灭度之。如是灭度无量、无数、无边众生，实无众生得灭度者。故世尊成道之旦，发普度众生之悲，乃曰：先度众生，然后作佛。", "o": "金剛經曰：所有一切眾生之類，若卵生、若胎生、若濕生、若化生、若有色、若無色、若有想、若無想、若非有想、若非無想、我皆令入無餘，涅盤而滅度之。如是滅度無量、無數、無邊眾生，實無眾生得滅度者。故世尊成道之旦，發普度眾生之悲，乃曰：先度眾生，然後作佛。", "i": 1240}, {"t": "note", "s": "口诀引证：肇法师曰：性本无生，故亦无灭，此实千圣同然之真心。众生度尽，方入涅盘，此亦千圣同归之实际。", "o": "口诀引证：肇法師曰：性本無生，故亦無滅，此實千聖同然之真心。眾生度盡，方入涅盤，此亦千聖同歸之實際。", "i": 1241}, {"t": "p", "s": "王方平曰：", "o": "王方平曰：", "i": 1242}, {"t": "p", "s": "鸾鹤来时乘紫雾，玉皇有敕登仙路。九玄七祖尽升天，度了群生方自度。", "o": "鸞鶴來時乘紫霧，玉皇有敕登仙路。九玄七祖盡升天，度了群生方自度。", "i": 1243}, {"t": "p", "s": "噫！试观古佛高仙何等运心之普，如今人有一法一诀者，秘密珍藏，犹恐漏泄，较之古人，可不愧死。", "o": "噫！試觀古佛高仙何等運心之普，如今人有一法一訣者，秘密珍藏，猶恐漏洩，較之古人，可不愧死。", "i": 1244}, {"t": "p", "s": "予之无念也久矣，但未得自度，先要度人，一念存心，不能自释，今之此作，尽泄天机，唯末后一著，尚未发明。今再言之，道书曰：阴神能见人，<mark>阳神</mark>使人见。盖独修一物者，所出乃阴神也。阴神则有影无形，世所谓鬼仙是也。若双修<b>性命</b>者，所出乃<mark>阳神</mark>也。<mark>阳神</mark>则有影有形，世所谓天仙是也。故曰：道本无相，仙贵有形。然而<mark>出神</mark>太早，丹经之所深诃既得，其母当返其始。常留神于天谷，复归如<b>婴儿</b>，不识不知，唯深唯寂，阳光无漏，则愈扩愈大，弥远弥光，自然变化生神。生之再生，则生生而无尽；化之又化，则化化而无穷，又生孙百千万亿。", "o": "予之無念也久矣，但未得自度，先要度人，一念存心，不能自釋，今之此作，盡洩天機，唯末後一著，尚未發明。今再言之，道書曰：陰神能見人，<mark>陽神</mark>使人見。蓋獨修一物者，所出乃陰神也。陰神則有影無形，世所謂鬼仙是也。若雙修<b>性命</b>者，所出乃<mark>陽神</mark>也。<mark>陽神</mark>則有影有形，世所謂天仙是也。故曰：道本無相，仙貴有形。然而<mark>出神</mark>太早，丹經之所深訶既得，其母當返其始。常留神於天谷，複歸如<b>嬰兒</b>，不識不知，唯深唯寂，陽光無漏，則愈擴愈大，彌遠彌光，自然變化生神。生之再生，則生生而無盡；化之又化，則化化而無窮，又生孫百千萬億。", "i": 1245}, {"t": "p", "s": "张紫阳曰：", "o": "張紫陽曰：", "i": 1246}, {"t": "p", "s": "一载生个儿，个个会骑鹤。", "o": "一載生個兒，個個會騎鶴。", "i": 1247}, {"t": "p", "s": "陈泥丸曰：", "o": "陳泥丸曰：", "i": 1248}, {"t": "p", "s": "一载胎生一个儿，子又孙兮孙又枝。", "o": "一載胎生一個兒，子又孫兮孫又枝。", "i": 1249}, {"t": "p", "s": "白玉蟾曰：", "o": "白玉蟾曰：", "i": 1250}, {"t": "p", "s": "一体遍多犹朗月，而影分千水多身。", "o": "一體遍多猶朗月，而影分千水多身。", "i": 1251}, {"t": "p", "s": "入一著明镜，而光寓万形。", "o": "入一著明鏡，而光寓萬形。", "i": 1252}, {"t": "p", "s": "仙家谓之分身，佛氏谓之化身。如世尊之不离菩提树下，而遍升天宫说法。又如善财之不出莎罗林，历二百十城而遍参诸友。", "o": "仙家謂之分身，佛氏謂之化身。如世尊之不離菩提樹下，而遍升天宮說法。又如善財之不出莎羅林，歷二百十城而遍參諸友。", "i": 1253}, {"t": "p", "s": "东华帝君曰：", "o": "東華帝君曰：", "i": 1254}, {"t": "p", "s": "法身刚大通天地，真性圆明贯古今。若未顶门开具眼，休教散影与分形。", "o": "法身剛大通天地，真性圓明貫古今。若未頂門開具眼，休教散影與分形。", "i": 1255}, {"t": "p", "s": "分形散影非不妙也，奈何还滞幻躯中，尚未超脱，欲千变万化，岂不反伤于本体耶？直到九载功完纯，亦不宜忽然跳出五行之外，返于无极之初。证实相妙之，更妙得真功全之，又全成金刚不坏之体，作万年不死之人。自觉觉他绍隆佛种三千功满，而白鹤来迎，八百行圆，而丹书宣诏<mark>飞升</mark>金阁，返佩帝乡。", "o": "分形散影非不妙也，奈何還滯幻軀中，尚未超脫，欲千變萬化，豈不反傷於本體耶？直到九載功完純，亦不宜忽然跳出五行之外，返於無極之初。証實相妙之，更妙得真功全之，又全成金剛不壞之體，作萬年不死之人。自覺覺他紹隆佛種三千功滿，而白鶴來迎，八百行圓，而丹書宣詔飛升金閣，返佩帝鄉。", "i": 1256}, {"t": "p", "s": "即钟离翁云：", "o": "即鐘離翁云：", "i": 1257}, {"t": "p", "s": "九载功成人事尽，纵横天地不由亲。", "o": "九載功成人事盡，縱橫天地不由親。", "i": 1258}, {"t": "p", "s": "萧紫虚云：", "o": "蕭紫虛云：", "i": 1259}, {"t": "p", "s": "功成须是<mark>出神</mark>经，内院繁华无累身。会取古仙超脱法，飘然跨鹤观三清。", "o": "功成須是<mark>出神</mark>經，內院繁華無累身。會取古仙超脫法，飄然跨鶴觀三清。", "i": 1260}, {"t": "p", "s": "诸仙奔壳，各有不同。有从宝塔出者，有从红楼出者，有看月而出者，有对镜而出者，有冲顶门而出者。", "o": "諸仙奔殼，各有不同。有從寶塔出者，有從紅樓出者，有看月而出者，有對鏡而出者，有衝頂門而出者。", "i": 1261}, {"t": "p", "s": "所以玄奥集云：", "o": "所以玄奧集云：", "i": 1262}, {"t": "p", "s": "塞断黄泉路，冲开紫府门。如何海蟾子，化鹤出泥丸。", "o": "塞斷黃泉路，衝開紫府門。如何海蟾子，化鶴出泥丸。", "i": 1263}, {"t": "p", "s": "中和集云：", "o": "中和集云：", "i": 1264}, {"t": "p", "s": "成就顶门开一窍，个中别是一<b>乾</b><b>坤</b>。", "o": "成就頂門開一竅，個中別是一<b>乾</b><b>坤</b>。", "i": 1265}, {"t": "p", "s": "盖顶门一窍岂易开哉。先发三昧火透之，不通。次聚太阳火冲之，略启。二火腾腾，攻击不已。刹时，红光满界，紫焰弥天，霹雳一声，顶门开也。", "o": "蓋頂門一竅豈易開哉。先發三昧火透之，不通。次聚太陽火衝之，略啟。二火騰騰，攻擊不已。剎時，紅光滿界，紫焰彌天，霹靂一聲，頂門開也。", "i": 1266}, {"t": "p", "s": "故吕纯阳曰：", "o": "故呂純陽曰：", "i": 1267}, {"t": "p", "s": "九年<b>火候</b>直经过，忽尔天门顶中破。真人出现大神通，从此天仙可相贺。", "o": "九年<b>火候</b>直經過，忽爾天門頂中破。真人出現大神通，從此天仙可相賀。", "i": 1268}, {"t": "p", "s": "真人出现，乘云气，御飞龙，升玉京，游天阙，飘飘云际，翱翔太空。凤篆金书，朝赴九阳之殿；蟋桃玉液，位登万圣之筵。适意则鸾舆前引，登云则龙驾前迎。紫府鳌宫欲去，而顶中鹤舞，丹台琼苑拟游，而足下云生。劫火洞烧，我则优游于真如之境；桑田变海，我则逍遥于极乐之天。聚则成形，散则成气，隐显莫测，变化无穷。人水火而不溺不焚，步日月而无形无影。刀兵不能害，虎兕不能伤。阴阳不能变迁，五行不能陶铸。阎罗不能制其死，帝释不能宰其生。纵横自在，出入自由。信乎！", "o": "真人出現，乘雲氣，御飛龍，升玉京，游天闕，飄飄雲際，翱翔太空。鳳篆金書，朝赴九陽之殿；蟋桃玉液，位登萬聖之筵。適意則鸞輿前引，登雲則龍駕前迎。紫府鰲宮欲去，而頂中鶴舞，丹台瓊苑擬游，而足下雲生。劫火洞燒，我則優游於真如之境；桑田變海，我則逍遙於極樂之天。聚則成形，散則成氣，隱顯莫測，變化無窮。人水火而不溺不焚，步日月而無形無影。刀兵不能害，虎兕不能傷。陰陽不能變遷，五行不能陶鑄。閻羅不能制其死，帝釋不能宰其生。縱橫自在，出入自由。信乎！", "i": 1269}, {"t": "p", "s": "紫阳云：", "o": "紫陽云：", "i": 1270}, {"t": "p", "s": "一粒灵丹吐入腹，始知我命不由天。", "o": "一粒靈丹吐入腹，始知我命不由天。", "i": 1271}, {"t": "p", "s": "此大丈夫得意之秋，功成名遂之日也。人生到此，宁不快哉？", "o": "此大丈夫得意之秋，功成名遂之日也。人生到此，寧不快哉？", "i": 1272}, {"t": "p", "s": "上阳子云：", "o": "上陽子云：", "i": 1273}, {"t": "p", "s": "总皆凡世播英雄，做尽功名到底空。唯有<mark>金丹</mark>最灵妙，大罗天上显神通。", "o": "總皆凡世播英雄，做盡功名到底空。唯有<mark>金丹</mark>最靈妙，大羅天上顯神通。", "i": 1274}, {"t": "h2", "s": "本体虚空超出三界", "o": "本体虚空超出三界", "i": 1275}, {"t": "p", "s": "按梓童化书云：予之在朝也，以闻方外之言，辞荣而归道。逢隐者指，予以心印授，予以正诀曰，此西方大圣人归寂法也。子能念而习之，可度生死，死而不亡，终成正觉。若能中道而废，则犹能择地而处，亦可为神仙。予于是历观汉、唐诸仙，多在此处超脱而去者，岂非化书所谓中道而废耶？", "o": "按梓童化書云：予之在朝也，以聞方外之言，辭榮而歸道。逢隱者指，予以心印授，予以正訣曰，此西方大聖人歸寂法也。子能念而習之，可度生死，死而不亡，終成正覺。若能中道而廢，則猶能擇地而處，亦可為神仙。予於是歷觀漢、唐諸仙，多在此處超脫而去者，豈非化書所謂中道而廢耶？", "i": 1276}, {"t": "p", "s": "又览龙牙颂云：学道如钻火，逢烟未可休。予又历观宋、元诸仙，多在此处户解而去者，岂非龙牙所谓逢烟而休耶？", "o": "又覽龍牙頌云：學道如鑽火，逢煙未可休。予又歷觀宋、元諸仙，多在此處戶解而去者，豈非龍牙所謂逢煙而休耶？", "i": 1277}, {"t": "p", "s": "虽则仙去，然却缺末后一段工夫，毕竟有些欠稳处。犹傅大士云：侥经八万劫，终是落空亡。亦不知寿命有限而不及修耶，抑亦不知不得此法而不能修也。", "o": "雖則仙去，然卻缺末後一段工夫，畢竟有些欠穩處。猶傅大士云：僥經八萬劫，終是落空亡。亦不知壽命有限而不及修耶，抑亦不知不得此法而不能修也。", "i": 1278}, {"t": "p", "s": "命宗人只知炼精化炁、炼炁化神、炼神还虚而止，竟遗了炼虚合道一段。", "o": "命宗人只知煉精化炁、煉炁化神、煉神還虛而止，竟遺了煉虛合道一段。", "i": 1279}, {"t": "p", "s": "是以无上师曰：养得<mark>金丹</mark>圆似月，未免有圆还有缺。何如炼个太阳红，三界十方俱洞彻。", "o": "是以無上師曰：養得<mark>金丹</mark>圓似月，未免有圓還有缺。何如煉個太陽紅，三界十方俱洞徹。", "i": 1280}, {"t": "p", "s": "盖圣修诣极自是少此一段不得。缘丹经子书皆不曾言及末后一著。唯李清庵曾说到这里。", "o": "蓋聖修詣極自是少此一段不得。緣丹經子書皆不曾言及末後一著。唯李清庵曾說到這裏。", "i": 1281}, {"t": "p", "s": "如门人问：脱胎后还有造化么？", "o": "如門人問：脫胎後還有造化麼？", "i": 1282}, {"t": "note", "s": "口诀引证：清庵曰：有造化在。圣人云，身外有身，未为奇特，虚空粉碎，方露全真。所以脱胎之后，正要脚踏实地，直待与虚空同体，方为了当。", "o": "口诀引证：清庵曰：有造化在。聖人云，身外有身，未為奇特，虛空粉碎，方露全真。所以脫胎之後，正要腳踏實地，直待與虛空同體，方為了當。", "i": 1283}, {"t": "p", "s": "又云：更有炼虚一著，当于言外求之。其见趣可谓度越诸仙矣。", "o": "又云：更有煉虛一著，當於言外求之。其見趣可謂度越諸仙矣。", "i": 1284}, {"t": "p", "s": "但不肯说个实际出来，云何炼虚，作何归著，竟自朦朦胧胧虚应过去。亦不知是不会祖师意而不能说耶，抑亦不知是怕泄漏天机而不敢说也。", "o": "但不肯說個實際出來，云何煉虛，作何歸著，竟自朦朦朧朧虛應過去。亦不知是不會祖師意而不能說耶，抑亦不知是怕洩漏天機而不敢說也。", "i": 1285}, {"t": "p", "s": "故水丘子叹曰：打破虚空消亿劫，既登彼岸舍舟楫。阅尽丹书万万篇，末后一句无人说。", "o": "故水丘子嘆曰：打破虛空消億劫，既登彼岸舍舟楫。閱盡丹書萬萬篇，末後一句無人說。", "i": 1286}, {"t": "p", "s": "盖此秘藏心印，皆佛佛授手、祖祖相承，迄至六祖衣钵止，而不传诸佛，秘藏于兹塞矣。自此而下鲜有知者。故曰：七祖如今未有人。", "o": "蓋此秘藏心印，皆佛佛授手、祖祖相承，迄至六祖衣缽止，而不傳諸佛，秘藏於茲塞矣。自此而下鮮有知者。故曰：七祖如今未有人。", "i": 1287}, {"t": "p", "s": "直到吾师尹公，以其夙植<b>灵根</b>，更得教外别传之旨。忽一日禅关参透，豁然贯通，而千佛秘藏又复开于今日矣。", "o": "直到吾師尹公，以其夙植<b>靈根</b>，更得教外別傳之旨。忽一日禪關參透，豁然貫通，而千佛秘藏又複開於今日矣。", "i": 1288}, {"t": "p", "s": "故悟道偈云：把个疑团打破时，千佛心华今在兹。下大竿头取进步，虚空真宰天人师。", "o": "故悟道偈云：把個疑團打破時，千佛心華今在茲。下大竿頭取進步，虛空真宰天人師。", "i": 1289}, {"t": "p", "s": "我今又承师旨而得此法，如获无价宝珠。即剑南和尚云：自从说得此明珠，释梵轮王俱不要。然佛之地步甚高，而必至于虚空本体。本体虚空方成无上正等在觉而入涅盘。", "o": "我今又承師旨而得此法，如獲無價寶珠。即劍南和尚云：自從說得此明珠，釋梵輪王俱不要。然佛之地步甚高，而必至於虛空本體。本體虛空方成無上正等在覺而入涅盤。", "i": 1290}, {"t": "p", "s": "故邵康节曰：圣人与太虚同体，与天地同用。今人求其义而不得，乃噫之曰：体太虚之体以为体，用天地之用以为用。此言大似隔窗窥日，不过见其光影而已。若言体太虚之体以为体，便是有个太虚在而著于体矣，何以能太虚？若言用天地之用以为用，便是有个天地在而著于用矣，何以能天地？然而太虚其知有体乎？其不知有体乎？天地其知有用乎？其不知有用乎？太虚不知有体而天地之用在于太虚之体，天地不知有用而太虚之体在于天地之用。体其所体者体其所用也，用其所用青用其所体也。乃至于粉碎虚空方为了当，何以故？", "o": "故邵康節曰：聖人與太虛同體，與天地同用。今人求其義而不得，乃噫之曰：體太虛之體以為體，用天地之用以為用。此言大似隔窗窺日，不過見其光影而已。若言體太虛之體以為體，便是有個太虛在而著於體矣，何以能太虛？若言用天地之用以為用，便是有個天地在而著於用矣，何以能天地？然而太虛其知有體乎？其不知有體乎？天地其知有用乎？其不知有用乎？太虛不知有體而天地之用在於太虛之體，天地不知有用而太虛之體在於天地之用。體其所體者體其所用也，用其所用青用其所體也。乃至於粉碎虛空方為了當，何以故？", "i": 1291}, {"t": "p", "s": "益本体，本虚空也。若著虚空相，便非本体虚空。本粉碎也，若有粉碎心，便不虚空。故不知有虚空，然后方可以言太虚天地之本体，不知有粉碎，然后方可以言太虚天地之虚空。究竟到此已会窥破虚空之本体，但未得安本体于虚空中。", "o": "益本體，本虛空也。若著虛空相，便非本體虛空。本粉碎也，若有粉碎心，便不虛空。故不知有虛空，然後方可以言太虛天地之本體，不知有粉碎，然後方可以言太虛天地之虛空。究竟到此已會窺破虛空之本體，但未得安本體於虛空中。", "i": 1292}, {"t": "p", "s": "即华严经云；法性如虚空，诸佛于中住。到这里自知道虚空是本体，本体是虚空。必须再加功而上，上胜进进不已，直到水尽山穷，转身百尺竿头。至必至于不生不灭之根源。终必终于不生不灭之觉岸。于中方是极则处。此处无他，不过是返我于虚，复我于无而已。返复者，回机也。", "o": "即華嚴經云；法性如虛空，諸佛於中住。到這裡自知道虛空是本體，本體是虛空。必須再加功而上，上勝進進不已，直到水盡山窮，轉身百尺竿頭。至必至於不生不滅之根源。終必終於不生不滅之覺岸。於中方是極則處。此處無他，不過是返我於虛，複我於無而已。返複者，回機也。", "i": 1293}, {"t": "p", "s": "故曰：一念回机，便同本得。究竟人之本初原自虚无中来，虚化之为神，神化之为气，气化之为形，顺则生人也。今则形复返之为气，气复返之为神，神复返之为虚，逆则成仙也。", "o": "故曰：一念回機，便同本得。究竟人之本初原自虛無中來，虛化之為神，神化之為氣，氣化之為形，順則生人也。今則形複返之為氣，氣複返之為神，神複返之為虛，逆則成仙也。", "i": 1294}, {"t": "p", "s": "古德云：何物高于天，生天者是。何物大于虚实，运虚空者是。盖大道乃虚空之父母，虚空乃天地之父母，天地乃人物之父母。天地广大，故能生万物；虚空无际，故能生天地；空中不空，故能生虚空。而曰：生天地、生万物，是皆空中不空者之有以主之也。以其空中不空，故能深入万物之性，以主张万物而方便之。毋谓空中不空，能深入万物之性，以主张万物而方便之也；抑亦能深入天地之地，以主张天地而方便之也。汝毋谓空中不空，能深入天地之性以主张天地而方便之也，抑亦能深入虚空，以主张虚空而方便之也。", "o": "古德云：何物高於天，生天者是。何物大於虛實，運虛空者是。蓋大道乃虛空之父母，虛空乃天地之父母，天地乃人物之父母。天地廣大，故能生萬物；虛空無際，故能生天地；空中不空，故能生虛空。而曰：生天地、生萬物，是皆空中不空者之有以主之也。以其空中不空，故能深入萬物之性，以主張萬物而方便之。毋謂空中不空，能深入萬物之性，以主張萬物而方便之也；抑亦能深入天地之地，以主張天地而方便之也。汝毋謂空中不空，能深入天地之性以主張天地而方便之也，抑亦能深入虛空，以主張虛空而方便之也。", "i": 1295}, {"t": "p", "s": "夫空中不空者，<b>真空</b>也。<b>真空</b>者，大道也。今之炼神还虚者，尤落在第二义，未到老氏无上至真之道也。炼虚合道者，此圣帝第一义，即是释氏最上一乘之法也。", "o": "夫空中不空者，<b>真空</b>也。<b>真空</b>者，大道也。今之煉神還虛者，尤落在第二義，未到老氏無上至真之道也。煉虛合道者，此聖帝第一義，即是釋氏最上一乘之法也。", "i": 1296}, {"t": "p", "s": "华严经云：虽尽未来际，遍游诸佛刹。不求此妙法，终不成菩提。", "o": "華嚴經云：雖盡未來際，遍游諸佛剎。不求此妙法，終不成菩提。", "i": 1297}, {"t": "p", "s": "此法只是复炼<mark>阳神</mark>，以归还我毗卢性海耳。所以将前面分形散影之神摄归本体，又将本体之神销归天谷，又将天谷之神退藏于<b>祖窍</b>之中。如龙养额下之珠、若鸡抱巢中之卵，紧紧护持，毋容再出，并前面所修所证者，一齐贬向无先国里。依灭尽定而寂灭之，似释迦掩室于摩竭，如净名杜口于毗耶。此其所以自然造化而复<b>性命</b>之而复虚空之之不可以已也。而复<b>性命</b>，而复虚空，至此已五变化矣。变不尽变，化不尽化，非通灵变化之至神也。", "o": "此法只是複煉<mark>陽神</mark>，以歸還我毗盧性海耳。所以將前面分形散影之神攝歸本體，又將本體之神銷歸天谷，又將天穀之神退藏於<b>祖竅</b>之中。如龍養額下之珠、若雞抱巢中之卵，緊緊護持，毋容再出，並前面所修所証者，一齊貶向無先國里。依滅盡定而寂滅之，似釋迦掩室於摩竭，如淨名杜口於毗耶。此其所以自然造化而複<b>性命</b>之而複虛空之之不可以已也。而複<b>性命</b>，而複虛空，至此已五變化矣。變不盡變，化不盡化，非通靈變化之至神也。", "i": 1298}, {"t": "p", "s": "故神百炼而愈灵，金百炼而愈精，炼之而复炼之，则一炉火焰炼虚空，化作微尘万顷冰。壶照世界大如黍米。少焉，神光满穴，旸焰腾空，自内窍达于外窍外，大窍九而九窍之中，窍窍皆有神光也。小窍八万四千，而八万四千窍之中，窍窍皆有神光也。彻内彻外，透顶透底，在在皆有神光也。如百千灯照耀一室，灯灯互昭，光光相涉，而人也，物也，莫不照耀于神光之中矣。是则是已尤非其至也。", "o": "故神百煉而愈靈，金百煉而愈精，煉之而複煉之，則一爐火焰煉虛空，化作微塵萬頃冰。壺照世界大如黍米。少焉，神光滿穴，暘焰騰空，自內竅達於外竅外，大竅九而九竅之中，竅竅皆有神光也。小竅八萬四千，而八萬四千竅之中，竅竅皆有神光也。徹內徹外，透頂透底，在在皆有神光也。如百千燈照耀一室，燈燈互昭，光光相涉，而人也，物也，莫不照耀於神光之中矣。是則是已尤非其至也。", "i": 1299}, {"t": "p", "s": "然不能塞乎天地之间，则未满东鲁圣人<b>乾</b>元统天之分量也。又敛神韬光，销归<b>祖窍</b>之中，一切不染，依灭尽定而寂灭之。寂灭既久，则神光如云发电，从中窍而贯于上窍，大窍小窍，窍窍皆有神光也。光明洞耀，照彻十方，上彻天界，下彻地界，中彻人界。三界之内，处处神光。若秦镜之互照，犹帝珠之相含，重重交光，历历齐现。而神也，鬼也，莫不照耀于神光之中矣。妙则妙已，尤非其至也。", "o": "然不能塞乎天地之間，則未滿東魯聖人<b>乾</b>元統天之分量也。又斂神韜光，銷歸<b>祖竅</b>之中，一切不染，依滅盡定而寂滅之。寂滅既久，則神光如雲發電，從中竅而貫於上竅，大竅小竅，竅竅皆有神光也。光明洞耀，照徹十方，上徹天界，下徹地界，中徹人界。三界之內，處處神光。若秦鏡之互照，猶帝珠之相含，重重交光，歷歷齊現。而神也，鬼也，莫不照耀於神光之中矣。妙則妙已，尤非其至也。", "i": 1300}, {"t": "p", "s": "然不能遍入尘沙法界，则未满西竺圣人毗卢遮那之分量也。再又敛神韬光，销归<b>祖窍</b>之中，一切不染，依灭尽定而寂灭之，寂灭既久，而六龙之变化全，则神光化为舍利光矣。如赫赫日轮，从<b>祖窍</b>之内一涌而出，化为万万道毫光，直贯于九天之上。若百千昊日，放大光明，普照于三十大千世界。而圣也，贤也，及森罗万象，莫不齐现于舍利光之中矣。", "o": "然不能遍入塵沙法界，則未滿西竺聖人毗盧遮那之分量也。再又斂神韜光，銷歸<b>祖竅</b>之中，一切不染，依滅盡定而寂滅之，寂滅既久，而六龍之變化全，則神光化為舍利光矣。如赫赫日輪，從<b>祖竅</b>之內一湧而出，化為萬萬道毫光，直貫於九天之上。若百千昊日，放大光明，普照於三十大千世界。而聖也，賢也，及森羅萬象，莫不齊現於舍利光之中矣。", "i": 1301}, {"t": "p", "s": "故大觉禅师云：一颗舍利光熠熠，照尽亿万无穷劫。大千世界总皈依，三十三天咸统摄。", "o": "故大覺禪師云：一顆舍利光熠熠，照盡億萬無窮劫。大千世界總皈依，三十三天咸統攝。", "i": 1302}, {"t": "p", "s": "而舍利光既遍满于三千大千世界内，尤未尽其分量。又自三千大千世界中复放无量宝光，宜充塞于极乐世界。既而又升于袈婆幢界，又升于音声轮界，复直冲于胜莲华世界，得与贤胜如来相会也。", "o": "而舍利光既遍滿於三千大千世界內，尤未盡其分量。又自三千大千世界中複放無量寶光，宜充塞於極樂世界。既而又升於袈婆幢界，又升於音聲輪界，複直衝於勝蓮華世界，得與賢勝如來相會也。", "i": 1303}, {"t": "p", "s": "自从无始分离，今日方才会面。彼此舍利交光，吻合一体，如如自然，广无边际。", "o": "自從無始分離，今日方才會面。彼此舍利交光，吻合一體，如如自然，廣無邊際。", "i": 1304}, {"t": "p", "s": "所以经颂云：诸佛似一大圆镜，我身犹若摩尼珠。诸佛法身入我体，我身常入诸佛躯。王祖弘忍云：一佛二佛千万佛，总是自身无别物。昔年亲种善根来，今日依旧得渠力。荷泽禅师云：本来面目是真如，舍利光中认得渠。万劫迷头今始悟，方知自性自文殊。", "o": "所以經頌云：諸佛似一大圓鏡，我身猶若摩尼珠。諸佛法身入我體，我身常入諸佛軀。王祖弘忍云：一佛二佛千萬佛，總是自身無別物。昔年親種善根來，今日依舊得渠力。荷澤禪師云：本來面目是真如，舍利光中認得渠。萬劫迷頭今始悟，方知自性自文殊。", "i": 1305}, {"t": "p", "s": "自性清静，便是无垢佛。自性如如，便是自在佛。自性不昧，便是光明佛。自性坚固，便是不坏佛。各各诸佛，自身俱有。说亦不尽唯一性，尔性即是心，心即是佛。新佛旧成，曾无二体，以报身就法身，如出模之像，像本旧成，一体无异。新成旧佛，亦无二形，以法身就报身，如金成像，昔未成象金，故今成像，竟诸佛如已成像之金仙。众生如未成像之金矿，成与未成，似分前后，则金体始终更无前别。", "o": "自性清靜，便是無垢佛。自性如如，便是自在佛。自性不昧，便是光明佛。自性堅固，便是不壞佛。各各諸佛，自身俱有。說亦不盡唯一性，爾性即是心，心即是佛。新佛舊成，曾無二體，以報身就法身，如出模之像，像本舊成，一體無異。新成舊佛，亦無二形，以法身就報身，如金成像，昔未成象金，故今成像，竟諸佛如已成像之金仙。眾生如未成像之金礦，成與未成，似分前後，則金體始終更無前別。", "i": 1306}, {"t": "p", "s": "故圆觉经曰：既已成金，不重为矿，经无穷时，金性不坏。原此金性，人人本有，个个不无。至于十方众生，皆我金刚佛性。而天地万物，咸囿我如来之法身矣。到此地位，方知天地与我同根，万物与我一体。遍法界是个如来藏，尽大地是个法王身。实际无差，与三世佛而一时成道；<b>真空</b>平等，共十类生而同日涅盘。法身其大也，虚空且难笼其体，真心其妙也，神鬼亦莫测其机。穷未来际为一昼夜，尽微尘海为一刹那。前千古而后乎今，无不是这个总持，上乎天而下乎地，无不是这个充塞。", "o": "故圓覺經曰：既已成金，不重為礦，經無窮時，金性不壞。原此金性，人人本有，個個不無。至於十方眾生，皆我金剛佛性。而天地萬物，咸囿我如來之法身矣。到此地位，方知天地與我同根，萬物與我一體。遍法界是個如來藏，盡大地是個法王身。實際無差，與三世佛而一時成道；<b>真空</b>平等，共十類生而同日涅盤。法身其大也，虛空且難籠其體，真心其妙也，神鬼亦莫測其機。窮未來際為一晝夜，盡微塵海為一剎那。前千古而後乎今，無不是這個總持，上乎天而下乎地，無不是這個充塞。", "i": 1307}, {"t": "note", "s": "口诀引证：二祖慧可曰：囫囫囵囵成这个，世世生生不变迁。太上所以云：天地有坏，这个不坏。", "o": "口诀引证：二祖慧可曰：囫囫圇圇成這個，世世生生不變遷。太上所以云：天地有壞，這個不壞。", "i": 1308}, {"t": "p", "s": "这个才是真我，这个才是真如，这个才是真<b>性命</b>，这个才是真本体，这个才是真虚空，这个才是真实相，这个才是菩提道场，这个才是涅盘实地，这个才是不垢不净，这个才是非色非空，这个才是自觉圣智，这个才是无上法轮，这个才是本性虚无、虚无实体，这个才是常住真心、随心自在，这个才是佛之妙用、快乐无量，这个才是烦恼业净、本来空寂，这个才是一切因果、皆无梦幻，这个才是生灭灭己、寂灭为乐，这个才是金刚不变、不坏之真体，这个才是无始不生、不灭之<mark>元神</mark>，这个方是不可量、不可称、不可思议、无边功德，这个才是清净法身、圆满报身、千百亿化身、毗卢遮那佛。", "o": "這個才是真我，這個才是真如，這個才是真<b>性命</b>，這個才是真本體，這個才是真虛空，這個才是真實相，這個才是菩提道場，這個才是涅盤實地，這個才是不垢不淨，這個才是非色非空，這個才是自覺聖智，這個才是無上法輪，這個才是本性虛無、虛無實體，這個才是常住真心、隨心自在，這個才是佛之妙用、快樂無量，這個才是煩惱業淨、本來空寂，這個才是一切因果、皆無夢幻，這個才是生滅滅己、寂滅為樂，這個才是金剛不變、不壞之真體，這個才是無始不生、不滅之<mark>元神</mark>，這個方是不可量、不可稱、不可思議、無邊功德，這個才是清淨法身、圓滿報身、千百億化身、毗盧遮那佛。", "i": 1309}, {"t": "p", "s": "偈曰：天上天下无如佛，十方世界亦无比。世界所有我尽见，一切无有如佛者。", "o": "偈曰：天上天下無如佛，十方世界亦無比。世界所有我盡見，一切無有如佛者。", "i": 1310}];
