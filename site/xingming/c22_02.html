<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>性命圭旨（性命双修万神圭旨） · 玉液炼形法则（2/2）</title><link rel="stylesheet" href="../assets/reader.css"></head><body data-book="xingming" data-ch="22" data-pg="2"><div class="toolbar"><span class="t">☯ <a href="index.html">性命圭旨（性命双修万神圭旨）</a></span><span class="cnt">第 22 章 · 2/2 页</span><button id="btnTg">切换到繁体原文</button><button id="btnNotes">隐藏注解</button><button id="btnTheme">🌙</button><span class="dl">⬇ <a href="../xingming_guizhi_simp.txt" download>简体</a> · <a href="../xingming_guizhi_annot.txt" download>原文</a></span></div><div class="wrap"><h2 class="ch">玉液炼形法则<span class="pgno">第 2/2 页</span></h2><div class="content-simp"><p>盖修道者，如农夫之去草一般，务拔其根，则吾心天真种子自然发生矣。况此一字法门，彻头彻尾，甚易行，甚有验。小而试之，可以却病延年，大而用之，可以超凡入圣，在学者用功深浅何如耳。</p></div><div class="content-trad"><p>蓋修道者，如農夫之去草一般，務拔其根，則吾心天真種子自然發生矣。況此一字法門，徹頭徹尾，甚易行，甚有驗。小而試之，可以卻病延年，大而用之，可以超凡入聖，在學者用功深淺何如耳。</p></div><div class="nav"><a href="c22_01.html">← 上一页</a><span class="mid"><a href="index.html">☰ 目录</a> · <a href="c22_01.html">玉液炼形法则</a></span><a href="c23_01.html">下一页 →</a></div><p class="end">— 性命圭旨（性命双修万神圭旨） · 玉液炼形法则 · 2/2 —</p></div><script src="../assets/reader.js"></script></body></html>
