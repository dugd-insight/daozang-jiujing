<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>周易参同契 · 二氣感化章第二十一（1/1）</title><link rel="stylesheet" href="../assets/reader.css"></head><body data-book="cantongqi" data-ch="22" data-pg="1"><div class="toolbar"><span class="t">☯ <a href="index.html">周易参同契</a></span><span class="cnt">第 22 章 · 1/1 页</span><button id="btnTg">切换到繁体原文</button><button id="btnNotes">隐藏注解</button><button id="btnTheme">🌙</button><span class="dl">⬇ <a href="../cantongqi_simp.txt" download>简体</a> · <a href="../cantongqi_annot.txt" download>原文</a></span></div><div class="wrap"><h2 class="ch">二氣感化章第二十一<span class="pgno">第 1/1 页</span></h2><div class="content-simp"><p>阳燧以取火，非日不生光。方诸非星月，安能得水浆？二（气）玄且远，感化尚相通，何况近存身？切在于心胸。阴阳配日月，水火为效征。</p></div><div class="content-trad"><p>陽燧以取火，非日不生光。方諸非星月，安能得水漿？二（氣）玄且遠，感化尚相通，何況近存身？切在於心胸。陰陽配日月，水火為效徵。</p></div><div class="nav"><a href="c21_01.html">← 上一页</a><span class="mid"><a href="index.html">☰ 目录</a> · <a href="c22_01.html">二氣感化章第二十一</a></span><a href="c23_01.html">下一页 →</a></div><p class="end">— 周易参同契 · 二氣感化章第二十一 · 1/1 —</p></div><script src="../assets/reader.js"></script></body></html>
