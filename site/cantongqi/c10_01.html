<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>周易参同契 · 龍虎兩弦章第九（1/1）</title><link rel="stylesheet" href="../assets/reader.css"></head><body data-book="cantongqi" data-ch="10" data-pg="1"><div class="toolbar"><span class="t">☯ <a href="index.html">周易参同契</a></span><span class="cnt">第 10 章 · 1/1 页</span><button id="btnTg">切换到繁体原文</button><button id="btnNotes">隐藏注解</button><button id="btnTheme">🌙</button><span class="dl">⬇ <a href="../cantongqi_simp.txt" download>简体</a> · <a href="../cantongqi_annot.txt" download>原文</a></span></div><div class="wrap"><h2 class="ch">龍虎兩弦章第九<span class="pgno">第 1/1 页</span></h2><div class="content-simp"><p>火计不虚作，演易以明之。偃月法炉鼎，白虎为熬枢；<b>汞</b>日为流珠，青龙与之俱。举东以合西，魂魄自相拘。<span class="key">上弦兑数八，下弦艮亦八</span>，两弦合其精，<b>乾坤</b>体乃成。<span class="key">二八应一斤，易道正不倾</span>。</p></div><div class="content-trad"><p>火計不虛作，演易以明之。偃月法爐鼎，白虎為熬樞；<b>汞</b>日為流珠，青龍與之俱。舉東以合西，魂魄自相拘。<span class="key">上弦兌數八，下弦艮亦八</span>，兩弦合其精，<b>乾坤</b>體乃成。<span class="key">二八應一斤，易道正不傾</span>。</p></div><div class="nav"><a href="c09_01.html">← 上一页</a><span class="mid"><a href="index.html">☰ 目录</a> · <a href="c10_01.html">龍虎兩弦章第九</a></span><a href="c11_01.html">下一页 →</a></div><p class="end">— 周易参同契 · 龍虎兩弦章第九 · 1/1 —</p></div><script src="../assets/reader.js"></script></body></html>
