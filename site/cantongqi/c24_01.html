<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>周易参同契 · 傍門無功章第二十三（1/1）</title><link rel="stylesheet" href="../assets/reader.css"></head><body data-book="cantongqi" data-ch="24" data-pg="1"><div class="toolbar"><span class="t">☯ <a href="index.html">周易参同契</a></span><span class="cnt">第 24 章 · 1/1 页</span><button id="btnTg">切换到繁体原文</button><button id="btnNotes">隐藏注解</button><button id="btnTheme">🌙</button><span class="dl">⬇ <a href="../cantongqi_simp.txt" download>简体</a> · <a href="../cantongqi_annot.txt" download>原文</a></span></div><div class="wrap"><h2 class="ch">傍門無功章第二十三<span class="pgno">第 1/1 页</span></h2><div class="content-simp"><p>世人好小术，不审道深浅。弃正从邪径，裕速阏不通。犹盲不任杖，聋者听宫商，没水捕雉兔，登山索鱼龙，植麦裕获黍，运规以求方。竭力劳精神，终年无见功。裕知伏食法，事约而不繁。</p></div><div class="content-trad"><p>世人好小術，不審道深淺。棄正從邪徑，裕速閼不通。猶盲不任杖，聾者聽宮商，沒水捕雉兔，登山索魚龍，植麥裕獲黍，運規以求方。竭力勞精神，終年無見功。裕知伏食法，事約而不繁。</p></div><div class="nav"><a href="c23_01.html">← 上一页</a><span class="mid"><a href="index.html">☰ 目录</a> · <a href="c24_01.html">傍門無功章第二十三</a></span><a href="c25_01.html">下一页 →</a></div><p class="end">— 周易参同契 · 傍門無功章第二十三 · 1/1 —</p></div><script src="../assets/reader.js"></script></body></html>
