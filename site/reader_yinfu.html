var SEGS = [{"t": "h1", "s": "黄帝阴符经（阴符经）", "o": "黄帝阴符经（阴符经）", "i": 0}, {"t": "q", "s": "道教修炼经典，全称《黄帝阴符经》，托名轩辕黄帝，学界一般认为成书于南北朝至唐初，唐李筌得之于骊山（或曰石室），此后广为流传，历代注家极多（李筌、张果、朱熹等）。全篇约四百字，历来分上中下三篇：上篇「神仙抱一演道章」、中篇「富国安民演法章」、下篇「强兵战胜演术章」。", "o": "道教修炼经典，全称《黄帝阴符经》，托名轩辕黄帝，学界一般认为成书于南北朝至唐初，唐李筌得之于骊山（或曰石室），此后广为流传，历代注家极多（李筌、张果、朱熹等）。全篇约四百字，历来分上中下三篇：上篇「神仙抱一演道章」、中篇「富国安民演法章」、下篇「强兵战胜演术章」。", "i": 1}, {"t": "q", "s": "文本来源：中国哲学书电子化计划（ctext.org）《黄帝阴符经》。", "o": "文本来源：中国哲学书电子化计划（ctext.org）《黄帝阴符经》。", "i": 2}, {"t": "p", "s": "<span class=\"key\">观天之道，执天之行，尽矣</span>。", "o": "<span class=\"key\">觀天之道，執天之行，盡矣</span>。", "i": 3}, {"t": "p", "s": "<mark>天有五贼，见之者昌</mark>。<mark>五贼在心，施行于天</mark>，<mark>宇宙在乎手，万物生乎身</mark>。", "o": "<mark>天有五賊，見之者昌</mark>。<mark>五賊在心，施行於天</mark>，<mark>宇宙在乎手，萬物生乎身</mark>。", "i": 4}, {"t": "note", "s": "疏曰：天者，阴阳之总名也。阳之精炁轻清，上浮为天；阴之精炁重浊，下沉为地。相连而不相离，故列子御寇谓杞国人曰：天积炁耳，地积块耳，自地已上则皆天也。子终日行于天，奈何忧乎天崩？故知天地则阴阳之二炁，炁中有子，名曰<b>五行</b>。<b>五行</b>者，天地阴阳之用也，万物从而生焉，万物则<b>五行</b>之子也。故使人观天地阴阳之道，执天五炁而行，则兴废可知，生死可察，除此外无可观执，故言尽矣。", "o": "疏曰：天者，陰陽之總名也。陽之精炁輕清，上浮為天；陰之精炁重濁，下沉為地。相連而不相離，故列子禦寇謂杞國人曰：天積炁耳，地積塊耳，自地已上則皆天也。子終日行於天，奈何憂乎天崩？故知天地則陰陽之二炁，炁中有子，名曰<b>五行</b>。<b>五行</b>者，天地陰陽之用也，萬物從而生焉，萬物則<b>五行</b>之子也。故使人觀天地陰陽之道，執天五炁而行，則興廢可知，生死可察，除此外無可觀執，故言盡矣。", "i": 5}, {"t": "p", "s": "<mark>天性，人也；人心，机也</mark>；<mark>立天之道以定人也</mark>。", "o": "<mark>天性，人也；人心，機也</mark>；<mark>立天之道以定人也</mark>。", "i": 6}, {"t": "note", "s": "疏曰：<b>五贼</b>者，<b>五行</b>之炁也，则金、木、水、火、土焉。太公注云：<b>圣人</b>为之<b>五贼</b>，天下为之五德。人食五味而死，无有死而弃之者，此<b>五贼</b>之义。所言贼者，害也。逆之不顺，则与人生害，故曰贼也。此言阴阳之中包含五炁，故云：天有<b>五贼</b>。五●2者在天为五星，在地为五岳，在位为五方，在物为五色，在声为五音，在食为五味，在人为五脏，在道为五德，不善用之则为贼。又，贼者，<b>五行</b>更相制伏，递为生杀，<b>昼夜</b>不停，亦能盗窃人之生死、万物成败，故言贼也。见之者昌，何也？人但能明此<b>五行</b>制伏之道，审阴阳兴废之源，则而行之，此为见也；如人审<b>五贼</b>，善能明之则为福，德之昌盛也。", "o": "疏曰：<b>五賊</b>者，<b>五行</b>之炁也，則金、木、水、火、土焉。太公注云：<b>聖人</b>為之<b>五賊</b>，天下為之五德。人食五味而死，無有死而棄之者，此<b>五賊</b>之義。所言賊者，害也。逆之不順，則與人生害，故曰賊也。此言陰陽之中包含五炁，故云：天有<b>五賊</b>。五●2者在天為五星，在地為五嶽，在位為五方，在物為五色，在聲為五音，在食為五味，在人為五臟，在道為五德，不善用之則為賊。又，賊者，<b>五行</b>更相制伏，遞為生殺，<b>晝夜</b>不停，亦能盜竊人之生死、萬物成敗，故言賊也。見之者昌，何也？人但能明此<b>五行</b>制伏之道，審陰陽興廢之源，則而行之，此為見也；如人審<b>五賊</b>，善能明之則為福，德之昌盛也。", "i": 7}, {"t": "p", "s": "天发<b>杀机</b>，斗转星移；地发<b>杀机</b>，龙蛇起陆；人发<b>杀机</b>，天地反复；<span class=\"key\">天人合发，万化定基</span>。", "o": "天發<b>殺機</b>，斗轉星移；地發<b>殺機</b>，龍蛇起陸；人發<b>殺機</b>，天地反覆；<span class=\"key\">天人合發，萬化定基</span>。", "i": 8}, {"t": "note", "s": "疏曰：夫人心主魂之官，身为神之府也。将欲施行<b>五贼</b>者，莫尚乎心，故心能之士，有所图必合天道。此则宇宙虽广，观览只在手中；万物虽多，生杀不出于术内。故曰：心正可以辟邪也。", "o": "疏曰：夫人心主魂之官，身為神之府也。將欲施行<b>五賊</b>者，莫尚乎心，故心能之士，有所圖必合天道。此則宇宙雖廣，觀覽只在手中；萬物雖多，生殺不出於術內。故曰：心正可以辟邪也。", "i": 9}, {"t": "p", "s": "<mark>性有巧拙，可以伏藏</mark>。<mark>九窍之邪，在乎三要</mark>。可以动静。<mark>火生于木，祸发必克</mark>，<mark>奸生于国，时动必溃</mark>；<mark>知之修练，谓之圣人</mark>。", "o": "<mark>性有巧拙，可以伏藏</mark>。<mark>九竅之邪，在乎三要</mark>。可以動靜。<mark>火生於木，禍發必克</mark>，<mark>奸生於國，時動必潰</mark>；<mark>知之修練，謂之聖人</mark>。", "i": 10}, {"t": "note", "s": "疏曰：天含五炁，递为生杀，自然有之。天道生杀，皆合其机宜，不妄发动。阴阳改变，时代迁谢，去故就新，此天发<b>杀机</b>，皆至公也。乘天威杀之机，或龙或蛇，沉隐之类皆能震起于陵陆。顺天应时，畅达于其间，为乘天之机，不失其宜也。人发<b>杀机</b>，天地反复者，人是<b>五行</b>之子，须顺五炁之生杀，任阴阳之陶运，何得擅自兴其生杀乎？至如世间之法，杀人者死，杀生者罪，何也？为非天之合杀，彼人奈何杀之乎？言人不合妄动<b>杀机</b>也。至如奸臣逆节，违背天道，反叛君亲，恣行凶恶，损害于世，擅行屠戮，妄动<b>杀机</b>者，同翻天作地，覆地作天，如此之大乱为逆，天之大祸，是名天地反复。", "o": "疏曰：天含五炁，遞為生殺，自然有之。天道生殺，皆合其機宜，不妄發動。陰陽改變，時代遷謝，去故就新，此天發<b>殺機</b>，皆至公也。乘天威殺之機，或龍或蛇，沉隱之類皆能震起於陵陸。順天應時，暢達於其間，為乘天之機，不失其宜也。人發<b>殺機</b>，天地反覆者，人是<b>五行</b>之子，須順五炁之生殺，任陰陽之陶運，何得擅自興其生殺乎？至如世間之法，殺人者死，殺生者罪，何也？為非天之合殺，彼人奈何殺之乎？言人不合妄動<b>殺機</b>也。至如奸臣逆節，違背天道，反叛君親，恣行凶惡，損害於世，擅行屠戮，妄動<b>殺機</b>者，同翻天作地，覆地作天，如此之大亂為逆，天之大禍，是名天地反覆。", "i": 11}, {"t": "h2", "s": "中篇 · 富国安民演法章", "o": "中篇 · 富国安民演法章", "i": 12}, {"t": "p", "s": "<mark>天地万物之盗</mark>；<mark>万物人之盗</mark>；<mark>人万物之盗</mark>也。<mark>三盗既宜，三才既安</mark>。故曰：<mark>食其时，百骸理；动其机，万化安</mark>。", "o": "<mark>天地萬物之盜</mark>；<mark>萬物人之盜</mark>；<mark>人萬物之盜</mark>也。<mark>三盜既宜，三才既安</mark>。故曰：<mark>食其時，百骸理；動其機，萬化安</mark>。", "i": 13}, {"t": "note", "s": "疏曰：人怀性智<b>巧拙</b>，贤愚悉共有之。但少而言之，人有少巧智辩慧，便驰骋显露，不料得失，显招其咎者，何也？为不能隐密，不自诫慎，以致倾败耳。故《道德经》云：大辩若讷，大巧若拙。其言隐密也。《易》曰：君不密则失臣，臣不密则失身，机事不密则害成。此之谓也。可以<b>伏藏</b>者，贤人君子纵有巧智辩慧之性、博学多闻之才，动静合其机宜，可不为巧乎？常能隐伏，藏匿巨细，用之恐被嫉佞谗毁，反招其咎耳。况愚拙之人，自率于心，造次兴动，不自藏隐，立招祸患。", "o": "疏曰：人懷性智<b>巧拙</b>，賢愚悉共有之。但少而言之，人有少巧智辯慧，便馳騁顯露，不料得失，顯招其咎者，何也？為不能隱密，不自誡慎，以致傾敗耳。故《道德經》云：大辯若訥，大巧若拙。其言隱密也。《易》曰：君不密則失臣，臣不密則失身，機事不密則害成。此之謂也。可以<b>伏藏</b>者，賢人君子縱有巧智辯慧之性、博學多聞之才，動靜合其機宜，可不為巧乎？常能隱伏，藏匿巨細，用之恐被嫉佞讒毀，反招其咎耳。況愚拙之人，自率於心，造次興動，不自藏隱，立招禍患。", "i": 14}, {"t": "p", "s": "人知其神而神，不知其不神之所以神。日月有数，大小有定，圣功生焉，神明出焉。其<b>盗机</b>也，天下莫不能见，莫不能知。<mark>君子得之固躬，小人得之轻命</mark>。", "o": "人知其神而神，不知其不神之所以神。日月有數，大小有定，聖功生焉，神明出焉。其<b>盜機</b>也，天下莫不能見，莫不能知。<mark>君子得之固躬，小人得之輕命</mark>。", "i": 15}, {"t": "note", "s": "疏曰：《南华》云：人有百骸、<b>九窍</b>、五脏，体而存之，人禀五炁而成形，头圆足方，四肢五脏，三魂七魄，递生邪正，互为君臣，在身通流。运动者，<b>九窍</b>也。邪正祸福之急者，在<b>三要</b>焉，即耳、目、口也。故《道德经》云：五色令人目盲、五音令人耳聋，五味令人口爽是也。道德之士，眼不视邪色，耳不听邪声，口不谈邪事，所以正事则视听言谈之，此名动也；涉其邪妄，悉不将心视听言说，此名静也。宣尼云：择其善者而从之，此名动也；择其不善者而改之，在此名静也。《孝经》云：言满天下无口过，行满天下无怨恶者，所缘身心静正而无邪恶，以致此也。但遇善即动，逢邪即静，此则身无祸患，皆在<b>耳目口</b>之防慎。", "o": "疏曰：《南華》云：人有百骸、<b>九竅</b>、五臟，體而存之，人稟五炁而成形，頭圓足方，四肢五臟，三魂七魄，遞生邪正，互為君臣，在身通流。運動者，<b>九竅</b>也。邪正禍福之急者，在<b>三要</b>焉，即耳、目、口也。故《道德經》云：五色令人目盲、五音令人耳聾，五味令人口爽是也。道德之士，眼不視邪色，耳不聽邪聲，口不談邪事，所以正事則視聽言談之，此名動也；涉其邪妄，悉不將心視聽言說，此名靜也。宣尼云：擇其善者而從之，此名動也；擇其不善者而改之，在此名靜也。《孝經》云：言滿天下無口過，行滿天下無怨惡者，所緣身心靜正而無邪惡，以致此也。但遇善即動，逢邪即靜，此則身無禍患，皆在<b>耳目口</b>之防慎。", "i": 16}, {"t": "h2", "s": "下篇 · 强兵战胜演术章", "o": "下篇 · 强兵战胜演术章", "i": 17}, {"t": "p", "s": "<mark>瞽者善听，聋者善视</mark>。<span class=\"key\">绝利一源，用师十倍；三反昼夜，用师万倍</span>。心生于物，死于物，<span class=\"key\">机在目</span>。天之无恩而恩生，迅雷烈风，莫不蠢然。", "o": "<mark>瞽者善聽，聾者善視</mark>。<span class=\"key\">絕利一源，用師十倍；三反晝夜，用師萬倍</span>。心生於物，死於物，<span class=\"key\">機在目</span>。天之無恩而恩生，迅雷烈風，莫不蠢然。", "i": 18}, {"t": "note", "s": "疏曰：天地者，阴阳也。阴阳二字，洎乎<b>五行</b>，共成其七，此外更改于物，则何惑之甚矣？言天地万物胎卵湿化，百谷草木悉承此七炁而生长，从无形至于有形，潜生复育以成其体，如行窃盗，不觉不知。天地亦潜与其炁应用无穷；万物私纳其复育，各获其安。故曰：天地，万物之盗。", "o": "疏曰：天地者，陰陽也。陰陽二字，洎乎<b>五行</b>，共成其七，此外更改於物，則何惑之甚矣？言天地萬物胎卵濕化，百穀草木悉承此七炁而生長，從无形至於有形，潛生覆育以成其體，如行竊盜，不覺不知。天地亦潛與其炁應用无窮；萬物私納其覆育，各獲其安。故曰：天地，萬物之盜。", "i": 19}, {"t": "p", "s": "<mark>至乐性余，至静则廉</mark>。<mark>天之至私，用之至公</mark>。禽之制在炁。<mark>死者生之根，生者死之根</mark>。<mark>恩生于害，害于恩</mark>。愚人以天地文理圣，我以时物文理哲。人以愚虞圣，我以不愚虞圣。人以奇期圣，我以不奇期圣。", "o": "<mark>至樂性餘，至靜則廉</mark>。<mark>天之至私，用之至公</mark>。禽之制在炁。<mark>死者生之根，生者死之根</mark>。<mark>恩生於害，害於恩</mark>。愚人以天地文理聖，我以時物文理哲。人以愚虞聖，我以不愚虞聖。人以奇期聖，我以不奇期聖。", "i": 20}, {"t": "note", "s": "疏曰：人与禽兽草木俱禀阴阳而生，人之最灵，位处中宫，心怀智度，", "o": "疏曰：人與禽獸草木俱稟陰陽而生，人之最靈，位處中宮，心懷智度，", "i": 21}, {"t": "p", "s": "<span class=\"key\">自然之道静，故天地万物生</span>。<mark>天地之道浸，故阴阳胜</mark>。<mark>阴阳相推，而变化顺矣</mark>。", "o": "<span class=\"key\">自然之道靜，故天地萬物生</span>。<mark>天地之道浸，故陰陽勝</mark>。<mark>陰陽相推，而變化順矣</mark>。", "i": 22}, {"t": "note", "s": "疏曰：言人但能盗万物资身以充荣禄富贵，殊不知万物反能盗人以生祸患。言上来三义更相为盗者，亦自然之理。凡此相盗，其中皆须有道，惬其宜则吉，乖其理则凶。故《列子》言：盗亦有道乎？何适其无道也？见室中之藏，圣也；知可否，智也；入先，勇也；出后，义也；分均，仁也。人无此五德而能行盗者，未之有也。此盗中之道也。向于<b>三盗</b>之中，皆须有道，令尽合其宜，则<b>三才</b>不差，尽安其任矣。皆不令越分伤性，以生祸患者也。", "o": "疏曰：言人但能盜萬物資身以充榮祿富貴，殊不知萬物反能盜人以生禍患。言上來三義更相為盜者，亦自然之理。凡此相盜，其中皆須有道，愜其宜則吉，乖其理則凶。故《列子》言：盜亦有道乎？何適其无道也？見室中之藏，聖也；知可否，智也；入先，勇也；出後，義也；分均，仁也。人无此五德而能行盜者，未之有也。此盜中之道也。向於<b>三盜</b>之中，皆須有道，令盡合其宜，則<b>三才</b>不差，盡安其任矣。皆不令越分傷性，以生禍患者也。", "i": 23}, {"t": "p", "s": "是故<mark>圣人知自然之道不可违</mark>，因而制之。至静之道，<b>律历</b>所不能契。<mark>爰有奇器，是生万象</mark>。<mark>八卦甲子，神机鬼藏</mark>。阴阳相胜之术，<span class=\"key\">昭昭乎进乎象矣</span>。", "o": "是故<mark>聖人知自然之道不可違</mark>，因而制之。至靜之道，律曆所不能契。<mark>爰有奇器，是生萬象</mark>。<mark>八卦甲子，神機鬼藏</mark>。陰陽相勝之術，<span class=\"key\">昭昭乎進乎象矣</span>。", "i": 24}, {"t": "note", "s": "疏曰：言人理性命者，皆须饮食滋味也。故《左传》曰：味与道炁，炁以实志，滋形润神，必归饮食。黄帝曰：人服饮食，必先五味、五肉、五菜、五菓，皆须调候得所，量体而进。熟则益人，生则伤脏，此食时之义也。故使饮食不失其时，滋味不越其宜，适其中道，不令乖分伤性，则四肢调畅，五脏安和，无诸疾病，长寿保终，岂不为百骸理乎？故亢仓子曰：冬饱则身温，夏饱则身凉。温凉时适，则人无疾疢，疫疠不行，得终其天年。故曰：谷者，人之天也。所以兴，王务农；王不务农，是弃人也。人既弃之，将何有国哉？但<b>三盗</b>既合其宜，<b>三才</b>尽安其任，此皆合自然之理。", "o": "疏曰：言人理性命者，皆須飲食滋味也。故《左傳》曰：味與道炁，炁以實志，滋形潤神，必歸飲食。黃帝曰：人服飲食，必先五味、五肉、五菜、五菓，皆須調候得所，量體而進。熟則益人，生則傷臟，此食時之義也。故使飲食不失其時，滋味不越其宜，適其中道，不令乖分傷性，則四肢調暢，五臟安和，無諸疾病，長壽保終，豈不為百骸理乎？故亢倉子曰：冬飽則身溫，夏飽則身涼。溫涼時適，則人无疾疢，疫癘不行，得終其天年。故曰：穀者，人之天也。所以興，王務農；王不務農，是棄人也。人既棄之，將何有國哉？但<b>三盜</b>既合其宜，<b>三才</b>盡安其任，此皆合自然之理。", "i": 25}];
