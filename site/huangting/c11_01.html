<p>金铃朱带坐婆娑，调血理命身不枯，外应口舌吐五华。临绝呼之亦登苏，</p>
<p>久久行之飞太霞。</p></div><div class="content-trad"><p>心部之宮蓮含華，下有童子丹元家。主適寒熱榮衛和，丹錦飛裳披玉羅。</p>
<p>金鈴朱帶坐婆娑，調血理命身不枯，外應口舌吐五華。臨絕呼之亦登蘇，</p>
<p>久久行之飛太霞。</p></div><div class="nav"><a href="c10_01.html">← 上一页</a><span class="mid"><a href="index.html">☰ 目录</a> · <a href="c11_01.html">心部章第十</a></span><a href="c12_01.html">下一页 →</a></div><p class="end">— 黄庭经（内景·外景） · 心部章第十 · 1/1 —</p></div><script src="../assets/reader.js"></script></body></html>
