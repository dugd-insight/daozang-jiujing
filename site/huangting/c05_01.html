<p>重扇金关密枢机。<b>玄泉</b>幽关高崔巍，<mark>三田之中精气微</mark>。<b>娇女</b>窈窕翳霄晖，</p>
<p>重堂焕焕明八威。天庭地关列斧斤，灵台盘固永不衰。</p></div><div class="content-trad"><p><b>黃庭</b>內人服錦衣，紫華飛裙雲氣羅。丹青綠條翠靈柯。七蕤玉籥閉兩扉，</p>
<p>重扇金關密樞機。<b>玄泉</b>幽關高崔巍，<mark>三田之中精氣微</mark>。<b>嬌女</b>窈窕翳霄暉，</p>
<p>重堂煥煥明八威。天庭地關列斧斤，靈臺盤固永不衰。</p></div><div class="nav"><a href="c04_01.html">← 上一页</a><span class="mid"><a href="index.html">☰ 目录</a> · <a href="c05_01.html">黃庭章第四</a></span><a href="c06_01.html">下一页 →</a></div><p class="end">— 黄庭经（内景·外景） · 黃庭章第四 · 1/1 —</p></div><script src="../assets/reader.js"></script></body></html>
