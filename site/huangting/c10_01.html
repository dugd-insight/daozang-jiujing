<p>素锦衣裳黄云带，喘息呼吸体不快。急存白元和六气，神仙久视无灾害。</p>
<p>用之不已形不滞。</p></div><div class="content-trad"><p>肺部之宮似<b>華蓋</b>，下有童子坐玉闕。七元之子主調氣，外應中嶽鼻齊位。</p>
<p>素錦衣裳黃雲帶，喘息呼吸體不快。急存白元和六氣，神仙久視無災害。</p>
<p>用之不已形不滯。</p></div><div class="nav"><a href="c09_01.html">← 上一页</a><span class="mid"><a href="index.html">☰ 目录</a> · <a href="c10_01.html">肺部章第九</a></span><a href="c11_01.html">下一页 →</a></div><p class="end">— 黄庭经（内景·外景） · 肺部章第九 · 1/1 —</p></div><script src="../assets/reader.js"></script></body></html>
