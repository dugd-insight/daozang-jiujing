<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黄庭经（内景·外景） · 天中章第六（1/1）</title><link rel="stylesheet" href="../assets/reader.css"></head><body data-book="huangting" data-ch="7" data-pg="1"><div class="toolbar"><span class="t">☯ <a href="index.html">黄庭经（内景·外景）</a></span><span class="cnt">第 7 章 · 1/1 页</span><button id="btnTg">切换到繁体原文</button><button id="btnNotes">隐藏注解</button><button id="btnTheme">🌙</button><span class="dl">⬇ <a href="../huangting_jing_simp.txt" download>简体</a> · <a href="../huangting_jing.txt" download>原文</a></span></div><div class="wrap"><h2 class="ch">天中章第六<span class="pgno">第 1/1 页</span></h2><div class="content-simp"><p>天中之岳精谨修，云宅既清玉帝游。通利道路无终休，眉号<b>华盖</b>覆明珠。</p>
<p>九幽日月洞空无，宅中有真常衣丹。<mark>审能见之无疾患</mark>，<b>赤珠</b>灵裙华茜粲。</p>
<p><mark>舌下玄膺生死岸</mark>，出青入玄二气焕，子若遇之升天汉。</p></div><div class="content-trad"><p>天中之岳精謹修，雲宅既清玉帝游。通利道路無終休，眉號<b>華蓋</b>覆明珠。</p>
<p>九幽日月洞空無，宅中有真常衣丹。<mark>審能見之無疾患</mark>，<b>赤珠</b>靈裙華茜粲。</p>
<p><mark>舌下玄膺生死岸</mark>，出青入玄二氣煥，子若遇之昇天漢。</p></div><div class="nav"><a href="c06_01.html">← 上一页</a><span class="mid"><a href="index.html">☰ 目录</a> · <a href="c07_01.html">天中章第六</a></span><a href="c08_01.html">下一页 →</a></div><p class="end">— 黄庭经（内景·外景） · 天中章第六 · 1/1 —</p></div><script src="../assets/reader.js"></script></body></html>
