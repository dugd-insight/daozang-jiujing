<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黄庭经（内景·外景） · 膽部章第十四（1/1）</title><link rel="stylesheet" href="../assets/reader.css"></head><body data-book="huangting" data-ch="15" data-pg="1"><div class="toolbar"><span class="t">☯ <a href="index.html">黄庭经（内景·外景）</a></span><span class="cnt">第 15 章 · 1/1 页</span><button id="btnTg">切换到繁体原文</button><button id="btnNotes">隐藏注解</button><button id="btnTheme">🌙</button><span class="dl">⬇ <a href="../huangting_jing_simp.txt" download>简体</a> · <a href="../huangting_jing.txt" download>原文</a></span></div><div class="wrap"><h2 class="ch">膽部章第十四<span class="pgno">第 1/1 页</span></h2><div class="content-simp"><p>胆部之宫六府精，中有童子曜威明。雷电八震扬玉旌，龙旗横天掷火铃。</p>
<p>主诸气力摄虎兵，外应眼童鼻柱间。脑发相扶亦俱鲜，九色锦衣绿华裙。</p>
<p>佩金带玉龙虎文，能存威明乘庆云，役使万神朝三元。</p></div><div class="content-trad"><p>膽部之宮六府精，中有童子曜威明。雷電八震揚玉旌，龍旗橫天擲火鈴。</p>
<p>主諸氣力攝虎兵，外應眼童鼻柱間。腦發相扶亦俱鮮，九色錦衣綠華裙。</p>
<p>佩金帶玉龍虎文，能存威明乘慶雲，役使萬神朝三元。</p></div><div class="nav"><a href="c14_01.html">← 上一页</a><span class="mid"><a href="index.html">☰ 目录</a> · <a href="c15_01.html">膽部章第十四</a></span><a href="c16_01.html">下一页 →</a></div><p class="end">— 黄庭经（内景·外景） · 膽部章第十四 · 1/1 —</p></div><script src="../assets/reader.js"></script></body></html>
