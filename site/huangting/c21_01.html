<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黄庭经（内景·外景） · 呼吸章第二十（1/1）</title><link rel="stylesheet" href="../assets/reader.css"></head><body data-book="huangting" data-ch="21" data-pg="1"><div class="toolbar"><span class="t">☯ <a href="index.html">黄庭经（内景·外景）</a></span><span class="cnt">第 21 章 · 1/1 页</span><button id="btnTg">切换到繁体原文</button><button id="btnNotes">隐藏注解</button><button id="btnTheme">🌙</button><span class="dl">⬇ <a href="../huangting_jing_simp.txt" download>简体</a> · <a href="../huangting_jing.txt" download>原文</a></span></div><div class="wrap"><h2 class="ch">呼吸章第二十<span class="pgno">第 1/1 页</span></h2><div class="content-simp"><p>呼吸元气以求仙，仙公公子已在前。朱鸟吐缩白石源，结精育胞化生身。</p>
<p>留胎止精可长生，三气右回九道明。正一含华乃充盈，遥望一心如罗星。</p>
<p>金室之下可不倾，延我白首反孩婴。</p></div><div class="content-trad"><p>呼吸元氣以求仙，仙公公子已在前。朱鳥吐縮白石源，結精育胞化生身。</p>
<p>留胎止精可長生，三氣右回九道明。正一含華乃充盈，遙望一心如羅星。</p>
<p>金室之下可不傾，延我白首反孩嬰。</p></div><div class="nav"><a href="c20_01.html">← 上一页</a><span class="mid"><a href="index.html">☰ 目录</a> · <a href="c21_01.html">呼吸章第二十</a></span><a href="c22_01.html">下一页 →</a></div><p class="end">— 黄庭经（内景·外景） · 呼吸章第二十 · 1/1 —</p></div><script src="../assets/reader.js"></script></body></html>
