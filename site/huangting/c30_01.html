<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黄庭经（内景·外景） · 紫清章第二十九（1/1）</title><link rel="stylesheet" href="../assets/reader.css"></head><body data-book="huangting" data-ch="30" data-pg="1"><div class="toolbar"><span class="t">☯ <a href="index.html">黄庭经（内景·外景）</a></span><span class="cnt">第 30 章 · 1/1 页</span><button id="btnTg">切换到繁体原文</button><button id="btnNotes">隐藏注解</button><button id="btnTheme">🌙</button><span class="dl">⬇ <a href="../huangting_jing_simp.txt" download>简体</a> · <a href="../huangting_jing.txt" download>原文</a></span></div><div class="wrap"><h2 class="ch">紫清章第二十九<span class="pgno">第 1/1 页</span></h2><div class="content-simp"><p>紫清上皇太道君，太玄太和侠侍端。化生万物使我仙，飞升十天驾玉轮。</p>
<p><mark>昼夜七日思勿眠</mark>，子能行此可长存。积功成炼非自然，是由精诚亦由专。</p>
<p>内守坚固真之真，<span class="key">虚中恬淡自致神</span>。</p></div><div class="content-trad"><p>紫清上皇太道君，太玄太和俠侍端。化生萬物使我仙，飛升十天駕玉輪。</p>
<p><mark>晝夜七日思勿眠</mark>，子能行此可長存。積功成煉非自然，是由精誠亦由專。</p>
<p>內守堅固真之真，<span class="key">虛中恬淡自致神</span>。</p></div><div class="nav"><a href="c29_01.html">← 上一页</a><span class="mid"><a href="index.html">☰ 目录</a> · <a href="c30_01.html">紫清章第二十九</a></span><a href="c31_01.html">下一页 →</a></div><p class="end">— 黄庭经（内景·外景） · 紫清章第二十九 · 1/1 —</p></div><script src="../assets/reader.js"></script></body></html>
