<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黄庭经（内景·外景） · 口為章第三（1/1）</title><link rel="stylesheet" href="../assets/reader.css"></head><body data-book="huangting" data-ch="4" data-pg="1"><div class="toolbar"><span class="t">☯ <a href="index.html">黄庭经（内景·外景）</a></span><span class="cnt">第 4 章 · 1/1 页</span><button id="btnTg">切换到繁体原文</button><button id="btnNotes">隐藏注解</button><button id="btnTheme">🌙</button><span class="dl">⬇ <a href="../huangting_jing_simp.txt" download>简体</a> · <a href="../huangting_jing.txt" download>原文</a></span></div><div class="wrap"><h2 class="ch">口為章第三<span class="pgno">第 1/1 页</span></h2><div class="content-simp"><p>口为<b>玉池</b>太和官。<mark>漱咽灵液灾不干</mark>。体生光华气香兰，却灭百邪玉炼颜。</p>
<p><mark>审能修之登广寒</mark>。<mark>昼夜不寐乃成真</mark>，<mark>雷鸣电激神泯泯</mark>。</p></div><div class="content-trad"><p>口為<b>玉池</b>太和官。漱咽<b>靈液</b>災不干。體生光華氣香蘭，卻滅百邪玉煉顏。</p>
<p><mark>審能修之登廣寒</mark>。<mark>晝夜不寐乃成真</mark>，<mark>雷鳴電激神泯泯</mark>。</p></div><div class="nav"><a href="c03_01.html">← 上一页</a><span class="mid"><a href="index.html">☰ 目录</a> · <a href="c04_01.html">口為章第三</a></span><a href="c05_01.html">下一页 →</a></div><p class="end">— 黄庭经（内景·外景） · 口為章第三 · 1/1 —</p></div><script src="../assets/reader.js"></script></body></html>
