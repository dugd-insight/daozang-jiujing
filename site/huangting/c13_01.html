<p>苍锦云衣舞龙幡，上致明霞日月烟。百病千灾急当存，两部水王对<b>生门</b>，</p>
<p>使人长生升九天。</p></div><div class="content-trad"><p>腎部之宮玄闕圓，中有童子冥上玄。主諸六府九液源，外應兩耳百液津。</p>
<p>蒼錦雲衣舞龍幡，上致明霞日月煙。百病千災急當存，兩部水王對<b>生門</b>，</p>
<p>使人長生升九天。</p></div><div class="nav"><a href="c12_01.html">← 上一页</a><span class="mid"><a href="index.html">☰ 目录</a> · <a href="c13_01.html">腎部章第十二</a></span><a href="c14_01.html">下一页 →</a></div><p class="end">— 黄庭经（内景·外景） · 腎部章第十二 · 1/1 —</p></div><script src="../assets/reader.js"></script></body></html>
