<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黄庭经（内景·外景） · 肝部章第十一（1/1）</title><link rel="stylesheet" href="../assets/reader.css"></head><body data-book="huangting" data-ch="12" data-pg="1"><div class="toolbar"><span class="t">☯ <a href="index.html">黄庭经（内景·外景）</a></span><span class="cnt">第 12 章 · 1/1 页</span><button id="btnTg">切换到繁体原文</button><button id="btnNotes">隐藏注解</button><button id="btnTheme">🌙</button><span class="dl">⬇ <a href="../huangting_jing_simp.txt" download>简体</a> · <a href="../huangting_jing.txt" download>原文</a></span></div><div class="wrap"><h2 class="ch">肝部章第十一<span class="pgno">第 1/1 页</span></h2><div class="content-simp"><p>肝部之中翠重里，下有青童神公子。主诸关键聪明始，青锦披裳佩玉铃。</p>
<p>和制魂魄津液平，外应眼目日月清。百疴不钟存无英,同用七日自充盈。</p>
<p>垂绝念神死复生，摄魂还魄永无倾。</p></div><div class="content-trad"><p>肝部之中翠重里，下有青童神公子。主諸關鍵聰明始，青錦披裳佩玉鈴。</p>
<p>和制魂魄津液平，外應眼目日月清。百痾不鍾存無英,同用七日自充盈。</p>
<p>垂絕念神死復生，攝魂還魄永無傾。</p></div><div class="nav"><a href="c11_01.html">← 上一页</a><span class="mid"><a href="index.html">☰ 目录</a> · <a href="c12_01.html">肝部章第十一</a></span><a href="c13_01.html">下一页 →</a></div><p class="end">— 黄庭经（内景·外景） · 肝部章第十一 · 1/1 —</p></div><script src="../assets/reader.js"></script></body></html>
