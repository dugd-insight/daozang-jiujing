<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黄庭经（内景·外景） · 肺之章第三十四（1/1）</title><link rel="stylesheet" href="../assets/reader.css"></head><body data-book="huangting" data-ch="35" data-pg="1"><div class="toolbar"><span class="t">☯ <a href="index.html">黄庭经（内景·外景）</a></span><span class="cnt">第 35 章 · 1/1 页</span><button id="btnTg">切换到繁体原文</button><button id="btnNotes">隐藏注解</button><button id="btnTheme">🌙</button><span class="dl">⬇ <a href="../huangting_jing_simp.txt" download>简体</a> · <a href="../huangting_jing.txt" download>原文</a></span></div><div class="wrap"><h2 class="ch">肺之章第三十四<span class="pgno">第 1/1 页</span></h2><div class="content-simp"><p>肺之为气三焦起，视听幽冥候童子。调理五华精发齿，二十六咽<b>玉池</b>里。</p>
<p>开通百脉血液始，颜色生光金玉泽。齿坚发黑不知白，存此真神勿落落。</p>
<p>当忆此宫有座席，众神合会转相索。</p></div><div class="content-trad"><p>肺之為氣三焦起，視聽幽冥候童子。調理五華精發齒，二十六咽<b>玉池</b>里。</p>
<p>開通百脈血液始，顏色生光金玉澤。齒堅發黑不知白，存此真神勿落落。</p>
<p>當憶此宮有座席，眾神合會轉相索。</p></div><div class="nav"><a href="c34_01.html">← 上一页</a><span class="mid"><a href="index.html">☰ 目录</a> · <a href="c35_01.html">肺之章第三十四</a></span><a href="c36_01.html">下一页 →</a></div><p class="end">— 黄庭经（内景·外景） · 肺之章第三十四 · 1/1 —</p></div><script src="../assets/reader.js"></script></body></html>
