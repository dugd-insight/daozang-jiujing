<p><b>肾神</b>玄冥字育婴，<b>脾神</b>常在字魂停。<b>胆神</b>龙曜字威明。六腑五藏神体精，</p>
<p>皆在心内运天经。昼夜存之自长生。</p></div><div class="content-trad"><p><b>心神</b>丹元字守靈，<b>肺神</b>皓華字虛成。<b>肝神</b>龍煙字含明，翳鬱導煙主濁清。</p>
<p><b>腎神</b>玄冥字育嬰，<b>脾神</b>常在字魂停。<b>膽神</b>龍曜字威明。六腑五藏神體精，</p>
<p>皆在心內運天經。晝夜存之自長生。</p></div><div class="nav"><a href="c08_01.html">← 上一页</a><span class="mid"><a href="index.html">☰ 目录</a> · <a href="c09_01.html">心神章第八</a></span><a href="c10_01.html">下一页 →</a></div><p class="end">— 黄庭经（内景·外景） · 心神章第八 · 1/1 —</p></div><script src="../assets/reader.js"></script></body></html>
