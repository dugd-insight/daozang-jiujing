<p>四气所合列宿分，紫烟上下三素云。灌溉五华植<b>灵根</b>，<mark>七液洞流冲庐间</mark>。</p>
<p><mark>回紫抱黄入丹田</mark>，<mark>幽室内明照阳明</mark>。</p></div><div class="content-trad"><p><mark>上有魂靈下關元</mark>，左為<b>少陽</b>右<b>太陰</b>。後有<b>密戶</b>前<b>生門</b>。<mark>出日入月呼吸存</mark>。</p>
<p>四氣所合列宿分，紫煙上下三素雲。灌溉五華植<b>靈根</b>，七液洞流沖廬間。</p>
<p><mark>回紫抱黃入丹田</mark>，<mark>幽室內明照陽明</mark>。</p></div><div class="nav"><a href="c02_01.html">← 上一页</a><span class="mid"><a href="index.html">☰ 目录</a> · <a href="c03_01.html">上有章第二</a></span><a href="c04_01.html">下一页 →</a></div><p class="end">— 黄庭经（内景·外景） · 上有章第二 · 1/1 —</p></div><script src="../assets/reader.js"></script></body></html>
