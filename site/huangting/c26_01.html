<p>三明出华生死际，洞房灵象斗日月。父曰<b>泥丸</b>母雌一，二光焕照入子室。</p>
<p>能存玄真万事毕，一身精神不可失。</p></div><div class="content-trad"><p>五行相推反歸一，三五合氣九九節。可用隱地回八術，伏牛<b>幽闕</b>羅品列。</p>
<p>三明出華生死際，洞房靈象斗日月。父曰<b>泥丸</b>母雌一，二光煥照入子室。</p>
<p>能存玄真萬事畢，一身精神不可失。</p></div><div class="nav"><a href="c25_01.html">← 上一页</a><span class="mid"><a href="index.html">☰ 目录</a> · <a href="c26_01.html">五行章第二十五</a></span><a href="c27_01.html">下一页 →</a></div><p class="end">— 黄庭经（内景·外景） · 五行章第二十五 · 1/1 —</p></div><script src="../assets/reader.js"></script></body></html>
