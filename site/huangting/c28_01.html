<p>六神合集虚中宴，结珠固精养神根。玉𥫽金籥常完坚，闭口屈舌食胎津，</p>
<p>使我遂炼获飞仙。</p></div><div class="content-trad"><p>玄元上一魂魄煉，一之為物叵卒見。須得至真始顧盼，至忌死氣諸穢賤。</p>
<p>六神合集虛中宴，結珠固精養神根。玉𥫽金籥常完堅，閉口屈舌食胎津，</p>
<p>使我遂煉獲飛仙。</p></div><div class="nav"><a href="c27_01.html">← 上一页</a><span class="mid"><a href="index.html">☰ 目录</a> · <a href="c28_01.html">玄元章第二十七</a></span><a href="c29_01.html">下一页 →</a></div><p class="end">— 黄庭经（内景·外景） · 玄元章第二十七 · 1/1 —</p></div><script src="../assets/reader.js"></script></body></html>
