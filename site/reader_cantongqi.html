<script>
var SEGS = [{"t": "h1", "s": "周易参同契", "o": "周易参同契", "i": 0}, {"t": "q", "s": "道教丹经之祖（万古丹经王），东汉魏伯阳撰，借《周易》卦爻象数与黄老之学阐发炉火炼丹（内丹）原理，共三篇（上中下卷）。", "o": "道教丹经之祖（万古丹经王），东汉魏伯阳撰，借《周易》卦爻象数与黄老之学阐发炉火炼丹（内丹）原理，共三篇（上中下卷）。", "i": 1}, {"t": "p", "s": "历代注家极多：彭晓《分章通真义》、朱熹《周易参同契考异》、陈显微、俞琰、陈致虚（上阳子）《分章注》等，皆以其为丹道根本经典。", "o": "历代注家极多：彭晓《分章通真义》、朱熹《周易参同契考异》、陈显微、俞琰、陈致虚（上阳子）《分章注》等，皆以其为丹道根本经典。", "i": 2}, {"t": "q", "s": "文本来源：中国哲学书电子化计划（ctext.org）《周易参同契》（分章本，共三十五章）。", "o": "文本来源：中国哲学书电子化计划（ctext.org）《周易参同契》（分章本，共三十五章）。", "i": 3}, {"t": "h2", "s": "大易总叙章第一", "o": "大易總敘章第一", "i": 4}, {"t": "note", "s": "俞琰发挥曰：阖户谓之<b>坤</b>，辟户谓之<b>乾</b>。一阖一辟谓之变，往来不穷谓之通，此<b>乾</b>、<b>坤</b>所以为《易》之门户也。<b>乾</b>生三男，<b>坤</b>生三女，男女构精，万物化生，此<b>乾</b>、<b>坤</b>所以为众卦之父母也。夫人之一身，法天象地，与天地同一阴阳也。人知此身与天地同一阴阳，则可与论还丹之道矣。", "o": "俞琰发挥曰：闔戶謂之<b>坤</b>，闢戶謂之<b>乾</b>。一闔一闢謂之變，往來不窮謂之通，此<b>乾</b>、<b>坤</b>所以為《易》之門戶也。<b>乾</b>生三男，<b>坤</b>生三女，男女構精，萬物化生，此<b>乾</b>、<b>坤</b>所以為眾卦之父母也。夫人之一身，法天象地，與天地同一陰陽也。人知此身與天地同一陰陽，則可與論還丹之道矣。", "i": 5}, {"t": "note", "s": "俞琰发挥曰：卦有六爻，下三爻为内，上三爻为外。试即《<b>屯</b>》、《<b>蒙</b>》二卦明之。朝用《<b>屯</b>》，阳火上升之候也。而《<b>屯</b>》之初九，正当身中之子，由内而外，故日：春夏据内体，从子到辰巳。暮用《<b>蒙</b>》，阴符下降之候也。而《<b>蒙</b>》之上九，正当身中之午，由外而内，故日：秋冬当外用，自午讫戌亥。然所谓春夏秋冬、子午巳亥，与夫内体外用之说，皆譬喻也。乃若泥象执文而行卦气，则徒自劳苦，何益哉？", "o": "俞琰发挥曰：卦有六爻，下三爻為內，上三爻為外。試即《<b>屯</b>》、《<b>蒙</b>》二卦明之。朝用《<b>屯</b>》，陽火上升之候也。而《<b>屯</b>》之初九，正當身中之子，由內而外，故日：春夏據內體，從子到辰巳。暮用《<b>蒙</b>》，陰符下降之候也。而《<b>蒙</b>》之上九，正當身中之午，由外而內，故日：秋冬當外用，自午訖戌亥。然所謂春夏秋冬、子午巳亥，與夫內體外用之說，皆譬喻也。乃若泥象執文而行卦氣，則徒自勞苦，何益哉？", "i": 6}, {"t": "p", "s": "<span class=\"key\">乾坤者，易之门户，众卦之父母</span>。<span class=\"key\">坎离匡廓，运毂正轴</span>，牝牡四卦，以为橐籥。<b>复</b>冒阴阳之道，尤工御者准绳墨，执衔辔，正规距，随轨辙，<mark>处中以制外</mark>，<mark>数在律历纪</mark>。月节有五六，经纬奉日使，兼并为六十，刚柔有表里。<mark>朔旦屯直事</mark>，至暮<b>蒙</b>当受，昼夜各一卦用之依次序。即未至晦爽，终则<b>复</b>更始，日月为期度，动静有早晚。春夏据内体，从子到辰巳，秋冬当外用，自午讫戌亥。赏罚应春秋，昏明顺寒暑，爻辞有仁义，随时发喜怒，如是应四时，五行得其理。", "o": "<b>乾坤</b>者，易之門戶，眾卦之父母。坎離匡廓，運轂正軸，牝牡四卦，以為橐籥。覆冒陰陽之道，尤工御者準繩墨，執銜轡，正規距，隨軌轍，處中以制外，數在律歷紀。月節有五六，經緯奉日使，兼並為六十，剛柔有表裏。<mark>朔旦屯直事</mark>，至暮<b>蒙</b>當受，晝夜各一卦用之依次序。即未至晦爽，終則復更始，日月為期度，動靜有早晚。春夏據內體，從子到辰巳，秋冬當外用，自午訖戌亥。賞罰應春秋，昏明順寒暑，爻辭有仁義，隨時發喜怒，如是應四時，五行得其理。", "i": 7}, {"t": "h2", "s": "乾坤设位章第二", "o": "乾坤設位章第二", "i": 8}, {"t": "note", "s": "俞琰发挥曰：幽潜沦匿者，神入气中，气入脐中，而沉归海底去也。变化于中者，时至气自化，静极机自发，而抱出日头来也。陈希夷《指玄篇》云：邈无踪迹归玄武，潜有机关结圣胎。此之谓也。", "o": "俞琰发挥曰：幽潛淪匿者，神入氣中，氣入臍中，而沉歸海底去也。變化於中者，時至氣自化，靜極機自發，而抱出日頭來也。陳希夷《指玄篇》云：邈無蹤跡歸玄武，潛有機關結聖胎。此之謂也。", "i": 9}, {"t": "note", "s": "俞琰发挥曰：《道德经》云：三十辐共一毂，当其无，有车之用。挺垣以为器，当其无，有器之用。凿户牖以为室，当其无，有室之用。故有之以为利，无之以为用。林庸斋注云：毂，车之容轴者也。辐，轮之股也。毂惟虚中，故可以行车。涎值，陶者之器也，虚而圆，故可以成器。户牖，室中之通明处也。此三者皆是譬喻虚者之为用，故日：有之以为利，无之以为用。车、器、室皆实有之利也，而其所以为车为器为室，皆虚中之用。今魏公谓<span class=\"key\">以无制有，器用者空</span>，实用老子之说。盖丹法以太虚为鼎炉，而太虚之中自有天然妙用，奇哉奇哉。《关尹子》云：衣摇空得风，气嘘物得水。陈抱一注云：知摇空得风，则鼓吾弃籥，可以生气。知嘘物得水，则胎吾之气，可以化精。", "o": "俞琰发挥曰：《道德經》云：三十輻共一轂，當其無，有車之用。挺垣以為器，當其無，有器之用。鑿戶牖以為室，當其無，有室之用。故有之以為利，無之以為用。林庸齋註云：轂，車之容軸者也。輻，輪之股也。轂惟虛中，故可以行車。涎值，陶者之器也，虛而圓，故可以成器。戶牖，室中之通明處也。此三者皆是譬喻虛者之為用，故日：有之以為利，無之以為用。車、器、室皆實有之利也，而其所以為車為器為室，皆虛中之用。今魏公謂以無制有，器用者空，實用老子之說。蓋丹法以太虛為鼎爐，而太虛之中自有天然妙用，奇哉奇哉。《關尹子》云：衣搖空得風，氣噓物得水。陳抱一註云：知搖空得風，則鼓吾棄籥，可以生氣。知噓物得水，則胎吾之氣，可以化精。", "i": 10}, {"t": "p", "s": "天地设位，而易行乎其中。天地者，<b>乾坤</b>之象也；设位者，列阴阳配合之位也；易谓<b>坎离</b>者，<b>乾坤</b>二用。二用无爻位，周流行六虚，往来既不定，上下亦无常，幽潜沦匿，变化于中，包囊万物，为道纪纲，<span class=\"key\">以无制有，器用者空</span>，故推<b>消息</b>，<b>坎离</b>没亡。言不茍造，论不虚生，引验见效，校度神明，推论结字，原理为证。<span class=\"key\">坎戊月精，离己日光</span>，<span class=\"key\">日月为易，刚柔相当</span>，土旺四季，罗络始终，青赤黑白，各居一方，<mark>皆秉中宫，戊己之功</mark>。", "o": "天地設位，而易行乎其中。天地者，<b>乾坤</b>之象也；設位者，列陰陽配合之位也；易謂坎離者，<b>乾坤</b>二用。二用無爻位，周流行六虛，往來既不定，上下亦無常，幽潛淪匿，變化於中，包囊萬物，為道紀綱，以無制有，器用者空，故推<b>消息</b>，坎離沒亡。言不茍造，論不虛生，引驗見效，校度神明，推論結字，原理為證。坎戊月精，離己日光，日月為易，剛柔相當，土旺四季，羅絡始終，青赤黑白，各居一方，皆秉中宮，<b>戊己</b>之功。", "i": 11}, {"t": "h2", "s": "日月悬象章第三", "o": "日月懸象章第三", "i": 12}, {"t": "note", "s": "俞琰发挥曰：一部全《易》计三百八十四爻，<b>一斤</b>大药计三百八十四铢，此丹道、《易》道之相通，而《参同契》所以作也。爻者，卦画也。符者，卦之合体也。《易》有六十四卦，丹法以<b>乾</b>、<b>坤</b>为<b>鼎器</b>，以坎、离为<b>药物</b>，以其余六十卦为<b>火候</b>。今以《<b>乾</b>》、《<b>坤</b>》<b>观</b>之，始于《<b>屯</b>》、《<b>蒙</b>》，终于《既济》、《未挤》，其问反体、对体，无一不相合。于此，见一阴一阳之谓道。而古仙据爻摘符，以比喻<b>鼎器</b>、<b>药物</b>、<b>火候</b>，可谓巧且备矣。", "o": "俞琰发挥曰：一部全《易》計三百八十四爻，<b>一斤</b>大藥計三百八十四銖，此丹道、《易》道之相通，而《參同契》所以作也。爻者，卦畫也。符者，卦之合體也。《易》有六十四卦，丹法以<b>乾</b>、<b>坤</b>為<b>鼎器</b>，以坎、離為藥物，以其餘六十卦為<b>火候</b>。今以《<b>乾</b>》、《<b>坤</b>》觀之，始於《<b>屯</b>》、《<b>蒙</b>》，終於《既濟》、《未擠》，其問反體、對體，無一不相合。於此，見一陰一陽之謂道。而古仙據爻摘符，以比喻<b>鼎器</b>、藥物、<b>火候</b>，可謂巧且備矣。", "i": 13}, {"t": "note", "s": "俞琰发挥曰：鄞鄂，即根蒂也。丹法经营于此而回光内照，则神恋气而凝，气恋神而住，自然交结成胎。如其神光内泄，气马外驰，则日月失道，金<b>汞</b>异炉，欲望成丹，不亦远乎。白紫清《珠玉集·丹髓歌》日：昔日遇师亲口诀，只要凝神入气穴。此所以称之为神丹，而号之日神仙也。", "o": "俞琰发挥曰：鄞鄂，即根蒂也。丹法經營於此而回光內照，則神戀氣而凝，氣戀神而住，自然交結成胎。如其神光內泄，氣馬外馳，則日月失道，金<b>汞</b>異爐，欲望成丹，不亦遠乎。白紫清《珠玉集·丹髓歌》日：昔日遇師親口訣，只要凝神入氣穴。此所以稱之為神丹，而號之日神仙也。", "i": 14}, {"t": "p", "s": "易者，象也。悬象著明，莫大忽日月，穷神以知化，阳往则阴来，辐辏而轮转，出入更卷舒。易有三百八十四爻，据爻摘符，符谓六十四卦。<mark>晦至朔旦，震来受符</mark>。当斯之际，天地媾其精，日月相担持。雄阳播玄施，雌阴化黄包。混沌相交接，权舆树根基。经营养鄞鄂，凝神以成躯。众夫蹈以出，蠕动莫不由。", "o": "易者，象也。懸象著明，莫大忽日月，窮神以知化，陽往則陰來，輻輳而輪轉，出入更卷舒。易有三百八十四爻，據爻摘符，符謂六十四卦。晦至朔旦，震來受符。當斯之際，天地媾其精，日月相擔持。雄陽播玄施，雌陰化黃包。混沌相交接，權輿樹根基。經營養鄞鄂，凝神以成軀。眾夫蹈以出，蠕動莫不由。", "i": 15}, {"t": "h2", "s": "圣人上观章第四", "o": "聖人上觀章第四", "i": 16}, {"t": "note", "s": "俞琰发挥曰：<b>乾</b>父下交于<b>坤</b>母之初爻而成震，震为长男，故曰：长子继父体。震自<b>坤</b>体而生，犹婴兄生于母腹中，故曰：因母立兆基。《悟真篇》云：金公本是东家子，送与西邻寄体。生。与此同旨。知此则知炼丹不用寻冬至，身中自有一阳生，而不泥乎年、月、日、时之说矣。", "o": "俞琰发挥曰：<b>乾</b>父下交於<b>坤</b>母之初爻而成震，震為長男，故曰：長子繼父體。震自<b>坤</b>體而生，猶嬰兄生於母腹中，故曰：因母立兆基。《悟真篇》云：金公本是東家子，送與西鄰寄體。生。與此同旨。知此則知鍊丹不用尋冬至，身中自有一陽生，而不泥乎年、月、日、時之說矣。", "i": 17}, {"t": "note", "s": "俞琰发挥曰：作丹之时，当外立表漏以测天运之晷刻，内修真一以验本身之刻漏，庶不失天地之机。然神定气和，则内外符合；神昏气躁，则时刻差互，不可不定也。", "o": "俞琰发挥曰：作丹之時，當外立表漏以測天運之晷刻，內修真一以驗本身之刻漏，庶不失天地之機。然神定氣和，則內外符合；神昏氣躁，則時刻差互，不可不定也。", "i": 18}, {"t": "p", "s": "于是仲尼赞鸿<b>蒙</b>，<b>乾坤</b>德洞虚，稽古当元皇，关睢建始初，冠婚气相纽，元年乃芽滋。圣人不虚生，上<b>观</b>显天符。天符有进退，屈伸以应时。故易统天心，<b>复</b>卦建始萌，长子继父体，因母立兆基。<b>消息</b>应中律，升降据斗此亦造字之法明坎月离日之合而为易也盖坎戊离巳皆居<b>中宫</b>土位而四方四行皆禀其气易者象也悬象著明莫大乎日月穷神以知化阳往则隂来辐凑而轮转出入更卷舒此緫明日月为易之意下乃详言其法与一月之<b>火候</b>晦至朔旦震来受符当斯之时天地媾其精日月相撢持雄阳播玄施雌隂化黄包混沌相交接权舆树根基经营养鄞鄂凝神以成<b>乾坤</b>括始终。七八数十五，九六亦相应，四者合三十，阳（气）索灭藏。八卦布列曜，运移不失中，元精眇难睹，推度效符证。居则<b>观</b>其象，准拟其形容，立表以为范，占候定吉凶，发号顺时令，勿失爻动时。上察河文，下序地形流，中稽于人心，参合考三才。动则循卦节，静则因彖辞<b>乾坤</b>用施行，天下然后治。（一本云，可得不慎乎，非是）", "o": "於是仲尼贊鴻<b>蒙</b>，<b>乾坤</b>德洞虛，稽古當元皇，關睢建始初，冠婚氣相紐，元年乃芽滋。聖人不虛生，上觀顯天符。天符有進退，屈伸以應時。故易統天心，復卦建始萌，長子繼父體，因母立兆基。<b>消息</b>應中律，升降據斗此亦造字之法明坎月離日之合而為易也蓋坎戊離巳皆居<b>中宫</b>土位而四方四行皆禀其氣易者象也懸象著明莫大乎日月窮神以知化陽往則隂來輻湊而輪轉出入更卷舒此緫明日月為易之意下乃詳言其法與一月之<b>火候</b>晦至朔旦震來受符當斯之時天地媾其精日月相撢持雄陽播玄施雌隂化黄包混沌相交接權輿樹根基經營養鄞鄂凝神以成<b>乾坤</b>括始終。七八數十五，九六亦相應，四者合三十，陽（氣）索滅藏。八卦布列曜，運移不失中，元精眇難睹，推度效符證。居則觀其象，準擬其形容，立表以為範，占候定吉兇，發號順時令，勿失爻動時。上察河文，下序地形流，中稽於人心，參合考三才。動則循卦節，靜則因彖辭<b>乾坤</b>用施行，天下然後治。（一本云，可得不慎乎，非是）", "i": 19}, {"t": "h2", "s": "君臣御政章第五", "o": "君臣御政章第五", "i": 20}, {"t": "note", "s": "俞琰发挥曰：始，月朔也。终，月晦也。存亡之绪者，晦朔之闲，阴将尽而犹未尽，阳将生而犹未生也。然所谓晦朔，乃譬喻尔，非真所谓三十日之终，初一日之始也。", "o": "俞琰发挥曰：始，月朔也。終，月晦也。存亡之緒者，晦朔之閒，陰將盡而猶未盡，陽將生而猶未生也。然所謂晦朔，乃譬喻爾，非真所謂三十日之終，初一日之始也。", "i": 21}, {"t": "note", "s": "俞琰发挥曰：《史记天官书》云：东宫苍龙房心。心为明堂，在人身则洞房紫极灵门户是也。《黄庭经》云：明堂金匮紫房问，上清真人当吾前心黄裳子丹气频烦，借问何在两眉端。于此垂光下照，则犹人君坐明堂而布政，而通道于九夷八蛮也。《<b>复</b>命篇》云：洞门常寂照，蓬岛镇长春。与此同旨。", "o": "俞琰发挥曰：《史記天官書》云：東宮蒼龍房心。心為明堂，在人身則洞房紫極靈門戶是也。《黃庭經》云：明堂金匱紫房問，上清真人當吾前心黃裳子丹氣頻煩，借問何在兩眉端。於此垂光下照，則猶人君坐明堂而布政，而通道於九夷八蠻也。《復命篇》云：洞門常寂照，蓬島鎮長春。與此同旨。", "i": 22}, {"t": "p", "s": "御政之首，鼎新革故。管括微密，开舒布宝。要道魁柄，统化纲纽。爻象内动，吉凶外起，五纬错顺，应时感动。四七乖戾，誃离俯仰。文昌统录，诘责台辅百官有司，各典所部。日合五行精，月受六律纪。五六三十度，度竟<b>复</b>更始。原始要终，存亡之绪，或君骄佚，亢满违道；或臣邪佞，行不顺轨。弦望盈缩，乖变凶咎。执法刺讥，诘过贻主。辰极受正，优游任下。明堂布政，国无害道。", "o": "御政之首，鼎新革故。管括微密，開舒布寶。要道魁柄，統化綱紐。爻象內動，吉兇外起，五緯錯順，應時感動。四七乖戾，誃離俯仰。文昌統錄，詰責臺輔百官有司，各典所部。日合五行精，月受六律紀。五六三十度，度竟復更始。原始要終，存亡之緒，或君驕佚，亢滿違道；或臣邪佞，行不順軌。弦望盈縮，乖變兇咎。執法刺譏，詰過貽主。辰極受正，優游任下。明堂布政，國無害道。", "i": 23}, {"t": "h2", "s": "炼己立基章第六", "o": "煉己立基章第六", "i": 24}, {"t": "note", "s": "俞琰发挥曰：王重阳《全真集》云：玄关妙用不难穷，只在无言静默中。盖心安而虚，道自来居；虚极静笃，则元阳真气自<b>复</b>也。", "o": "俞琰发挥曰：王重陽《全真集》云：玄關妙用不難窮，只在無言靜默中。蓋心安而虛，道自來居；虛極靜篤，則元陽真氣自復也。", "i": 25}, {"t": "note", "s": "俞琰发挥曰：《全真集》云：如通须是搜元有，要见还应向内<b>观</b>。盖返本还源、回光内照，乃修炼之大端。先儒谓道家养生之法，收视返听，如<b>金水</b>潜光于内。诚哉是言也。", "o": "俞琰发挥曰：《全真集》云：如通須是搜元有，要見還應向內觀。蓋返本還源、回光內照，乃修鍊之大端。先儒謂道家養生之法，收視返聽，如<b>金水</b>潛光於內。誠哉是言也。", "i": 26}, {"t": "p", "s": "<mark>内以养己，安静虚无</mark>。<mark>原本隐明，内照形躯</mark>。<mark>闭塞其兑，筑固灵株</mark>。三光陆沉，温养子珠，视之不见，近而易求。黄中渐通理，润泽达肌肤。初正则终修，<b>乾</b>立未可持。一者以掩蔽，世人莫知之。", "o": "內以養己，安靜虛無。原本隱明，內照形軀。閉塞其兌，築固靈株。三光陸沉，溫養子珠，視之不見，近而易求。黃中漸通理，潤澤達肌膚。初正則終修，<b>乾</b>立未可持。一者以掩蔽，世人莫知之。", "i": 27}, {"t": "h2", "s": "明两知窍章第七", "o": "明兩知竅章第七", "i": 28}, {"t": "note", "s": "俞琰发挥曰：《道德经》云：上德无为而无以为，下德为之而有以为。今日上德无为，不以察求者，神守于玄官，而默默无为也。下德为之，其用不休者，气腾于牝府，而绵绵不绝也。盖借老子之说，以发坎、离两穴之秘也。", "o": "俞琰发挥曰：《道德經》云：上德無為而無以為，下德為之而有以為。今日上德無為，不以察求者，神守於玄官，而默默無為也。下德為之，其用不休者，氣騰於牝府，而綿綿不絕也。蓋借老子之說，以發坎、離兩穴之秘也。", "i": 29}, {"t": "note", "s": "俞琰发挥曰：白者，金也。黑者，水也。丹法以水为基，而金精生于水中，所以知白者惟守其黑，守黑则白自现也。守之何如？即如猫之守窟以待鼠，至其身不动，其目不瞬，而此心惟鼠是务，更无他念也。神明者，天机也。如欲盗其机，爻先虚其心。心虚则神凝，神凝则息定，息定则两畔同升共<b>一斤</b>，而神明自来也。《离骚·远游篇》云：毋滑而魂兮，彼将自然。壹气孔神兮，于中夜存。虚以待之兮，无为之先。与此同旨。紫阳朱子注云：盖广成子之告黄帝不过如此，实神仙之要诀也。", "o": "俞琰发挥曰：白者，金也。黑者，水也。丹法以水為基，而金精生於水中，所以知白者惟守其黑，守黑則白自現也。守之何如？即如貓之守窟以待鼠，至其身不動，其目不瞬，而此心惟鼠是務，更無他念也。神明者，天機也。如欲盜其機，爻先虛其心。心虛則神凝，神凝則息定，息定則兩畔同升共<b>一斤</b>，而神明自來也。《離騷·遠遊篇》云：毋滑而魂兮，彼將自然。壹氣孔神兮，於中夜存。虛以待之兮，無為之先。與此同旨。紫陽朱子註云：蓋廣成子之告黃帝不過如此，實神仙之要訣也。", "i": 30}, {"t": "p", "s": "上德无为，不以察求。下德为之，其用不休。上闭则称有，下闭则称无。无者以奉上，上有神德居。此两孔穴法，金气亦相胥。<span class=\"key\">知白守黑，神明自来</span>，<mark>白者金精，黑者水基</mark>。水者道枢，去数名一。阴阳之始，玄含<b>黄芽</b>。五金之主，北方河车。故<b>铅</b>外黑，内怀金华，被褐怀玉，外为狂夫。金为水母，母隐子胎。水为金子，子藏母胞。真人至妙，若有若无。仿佛大渊，乍沉乍浮。退尔分布，各守境隅。采之类白，造之则朱。炼为表卫，白里真居。方圆径寸，混而相拘。先天地生，巍巍尊高。旁有垣阙，状似蓬壶。环匝关闭，四通踟蹰。守御密固，阏绝奸邪。曲阖相通，以戒不虞。可以无思，难以愁劳。神（气）满室，莫之能留。守之者昌，失之者亡。动静休息，常与人俱。", "o": "上德無為，不以察求。下德為之，其用不休。上閉則稱有，下閉則稱無。無者以奉上，上有神德居。此兩孔穴法，金氣亦相胥。知白守黑，神明自來，<mark>白者金精，黑者水基</mark>。水者道樞，去數名一。陰陽之始，玄含黃芽。五金之主，北方河車。故鉛外黑，內懷金華，被褐懷玉，外為狂夫。金為水母，母隱子胎。水為金子，子藏母胞。真人至妙，若有若無。仿佛大淵，乍沉乍浮。退爾分布，各守境隅。採之類白，造之則朱。煉為表衛，白裏真居。方圓徑寸，混而相拘。先天地生，巍巍尊高。旁有垣闕，狀似蓬壺。環匝關閉，四通踟躕。守禦密固，閼絕姦邪。曲闔相通，以戒不虞。可以無思，難以愁勞。神（氣）滿室，莫之能留。守之者昌，失之者亡。動靜休息，常與人俱。", "i": 31}, {"t": "h2", "s": "明辨邪正章第八", "o": "明辨邪正章第八", "i": 32}, {"t": "note", "s": "俞琰发挥曰：魏公作此《参同契》一书，柴然如昏衢之烛，昭然如迷海之缄。盖欲使后之明者因言会意，旷然洞达，知所以修炼之由也。魏公此心可谓仁矣。或者乃视之为纸上语，而更不著眼，是诚自暴自弃，岂不惜哉？", "o": "俞琰发挥曰：魏公作此《參同契》一書，柴然如昏衢之燭，昭然如迷海之緘。蓋欲使後之明者因言會意，曠然洞達，知所以修鍊之由也。魏公此心可謂仁矣。或者乃視之為紙上語，而更不著眼，是誠自暴自棄，豈不惜哉？", "i": 33}, {"t": "note", "s": "俞琰发挥曰：邱长春《呜道集》云：不是斩昏坐，行功扭捏成。盖修炼九转金液大丹与旁门小安乐法不同，是叉谢绝人事，专心致志，夜以继日，勤而行之，乃能成功。彭真一不云乎。志士又须撤声色，去嗜欲，弃名利，投灵山，绝常交，结仙友，隐密潜修，昼夜无怠，方可希望。或不如是，则虚劳动尔。真一此说，厥亦明甚。或者昧此，惟欲日用两时为<b>火候</b>，闻五昼夜不休之说，则莫不惊笑，以为不胜其劳且烦，盖亦弗思甚矣。《翠虚篇》云：执著之人得不真，朝行暮辍又非诚。切不可轻信日用两时为<b>火候</b>之说。昔者皇甫履道见王三一置筹壶，问日：安用？日：欲知子午二正尔。日：十二时中，当无令问断，何止子、午耶？要之，丹道与天道一也。", "o": "俞琰发挥曰：邱長春《嗚道集》云：不是斬昏坐，行功扭捏成。蓋修鍊九轉金液大丹與旁門小安樂法不同，是叉謝絕人事，專心致志，夜以繼日，勤而行之，乃能成功。彭真一不云乎。志士又須撤聲色，去嗜慾，棄名利，投靈山，絕常交，結仙友，隱密潛修，晝夜無怠，方可希望。或不如是，則虛勞動爾。真一此說，厥亦明甚。或者昧此，惟欲日用兩時為<b>火候</b>，聞五晝夜不休之說，則莫不驚笑，以為不勝其勞且煩，蓋亦弗思甚矣。《翠虛篇》云：執著之人得不真，朝行暮輟又非誠。切不可輕信日用兩時為<b>火候</b>之說。昔者皇甫履道見王三一置籌壺，問日：安用？日：欲知子午二正爾。日：十二時中，當無令問斷，何止子、午耶？要之，丹道與天道一也。", "i": 34}, {"t": "p", "s": "是非历脏法，内<b>观</b>有所思，履行步斗宿，六甲以日辰。阴道厌九一，浊乱弄元胞。食气鸣肠胃，吐正吸外邪。昼夜不卧寐，晦朔未尝休。身体日疲倦，恍惚状若痴。百脉鼎沸驰，不得清澄居。累土立坛宇，朝暮敬祭祀。鬼神见形象，梦寐感慨之。心欢意喜悦，自谓必延期，遽以夭命死，腐露其形骸。举措辄有违，悖逆失枢机。诸术甚众多，千条有万余，前却违黄老，曲折戾九都。明者省厥旨，旷然知所由。勤而行之，夙夜不休。伏食三载，轻举远游，跨火不焦，入水不濡，能存能亡，长乐无忧。道成德就，潜伏俟时。太乙乃召，移居中洲，功满上升，膺箓受图。", "o": "是非歷臟法，內觀有所思，履行步斗宿，六甲以日辰。陰道厭九一，濁亂弄元胞。食氣鳴腸胃，吐正吸外邪。晝夜不臥寐，晦朔未嘗休。身體日疲倦，恍惚狀若癡。百脈鼎沸馳，不得清澄居。累土立壇宇，朝暮敬祭祀。鬼神見形象，夢寐感慨之。心歡意喜悅，自謂必延期，遽以夭命死，腐露其形骸。舉措輒有違，悖逆失樞機。諸術甚眾多，千條有萬餘，前卻違黃老，曲折戾九都。明者省厥旨，曠然知所由。勤而行之，夙夜不休。伏食三載，輕舉遠游，跨火不焦，入水不濡，能存能亡，長樂無憂。道成德就，潛伏俟時。太乙乃召，移居中洲，功滿上升，膺籙受圖。", "i": 35}, {"t": "h2", "s": "龙虎两弦章第九", "o": "龍虎兩弦章第九", "i": 36}, {"t": "p", "s": "火计不虚作，演易以明之。偃月法炉鼎，白虎为熬枢；<b>汞</b>日为流珠，青龙与之俱。举东以合西，魂魄自相拘。<span class=\"key\">上弦兑数八，下弦艮亦八</span>，两弦合其精，<b>乾坤</b>体乃成。<span class=\"key\">二八应一斤，易道正不倾</span>。", "o": "火計不虛作，演易以明之。偃月法爐鼎，白虎為熬樞；<b>汞</b>日為流珠，青龍與之俱。舉東以合西，魂魄自相拘。上弦兌數八，下弦艮亦八，兩弦合其精，<b>乾坤</b>體乃成。<b>二八</b>應<b>一斤</b>，易道正不傾。", "i": 37}, {"t": "h2", "s": "金返归性章第十", "o": "金返歸性章第十", "i": 38}, {"t": "p", "s": "<span class=\"key\">金入于猛火，色不夺精光</span>。自开辟以来，日月不亏明。金不失其重，日月形如常。金本从月生，朔旦日受符。金返归其母，月晦日相包。隐藏其匡廓，沉浮于洞虚。<span class=\"key\">金复其故性，威光鼎乃熺</span>。", "o": "金入於猛火，色不奪精光。自開闢以來，日月不虧明。金不失其重，日月形如常。金本從月生，朔旦日受符。金返歸其母，月晦日相包。隱藏其匡廓，沉浮於洞虛。金復其故性，威光鼎乃熺。", "i": 39}, {"t": "h2", "s": "二土全功章第十一", "o": "二土全功章第十一", "i": 40}, {"t": "note", "s": "俞琰发挥曰：土无定位，周流于辰、戌、丑、未之间，在辰为季春，在未为季夏，在戎为季秋，在丑为季冬；春、夏、秋、冬皆是土游之地，故日：土游于四季。土能竭水藏火，守于水则水不流，守于火则火不焰今以之守于<b>坤</b>而探药，守于<b>乾</b>而运火，故日：守界定规矩。", "o": "俞琰发挥曰：土無定位，周流於辰、戌、丑、未之間，在辰為季春，在未為季夏，在戎為季秋，在丑為季冬；春、夏、秋、冬皆是土遊之地，故日：土遊於四季。土能竭水藏火，守於水則水不流，守於火則火不焰今以之守於<b>坤</b>而探藥，守於<b>乾</b>而運火，故日：守界定規矩。", "i": 41}, {"t": "note", "s": "俞琰发挥曰：金砂之升鼎也，穿两肾，导夹脊，过心经，入髓海，冲肺脸，度肝历脾，<b>复</b>还于丹田。当其升时，沦然如云雾之四塞，飒然如风雨之暴至，恍然如昼梦之初觉，泱然如沉疠之脱体，精神冥合如夫妇之交接，骨肉融和如澡浴之方起，是皆真景象也，非譬喻也。《<b>复</b>命篇》云：不知将谓气，得一后自然真。盖非亲历，则莫能知之。", "o": "俞琰发挥曰：金砂之升鼎也，穿兩腎，導夾脊，過心經，入髓海，衝肺臉，度肝歷脾，復還於丹田。當其升時，淪然如雲霧之四塞，颯然如風雨之暴至，恍然如晝夢之初覺，泱然如沉癘之脫體，精神冥合如夫婦之交接，骨肉融和如澡浴之方起，是皆真景象也，非譬喻也。《復命篇》云：不知將謂氣，得一後自然真。蓋非親歷，則莫能知之。", "i": 42}, {"t": "p", "s": "<mark>子午数合三，戊己号称五</mark>。<mark>三五既和谐，八石正纲纪</mark>。呼吸相含育，伫思为夫妇。黄土金之父，流珠水之子。水以土为鬼，土镇水不起。朱雀为火精，执平调胜负。水盛火消灭，俱死归厚土。三性即合会，本性共祖宗。巨胜尚延年，还丹可入口。金性不败朽，故为万物宝。术士伏食之，寿命得长久。土游于四季，守界定规矩。<mark>金砂入五内，雾散若风雨</mark>。熏蒸达四肢，颜色悦泽好。发白皆变黑，齿落生旧所。老翁<b>复</b>丁壮，耆妪成咤女。改形免世厄，号之曰真人。", "o": "子午數合三，<b>戊己</b>號稱五。三五既和諧，八石正綱紀。呼吸相含育，佇思為夫婦。黃土金之父，流珠水之子。水以土為鬼，土鎮水不起。朱雀為火精，執平調勝負。水盛火消滅，俱死歸厚土。三性即合會，本性共祖宗。巨勝尚延年，還丹可入口。金性不敗朽，故為萬物寶。術士伏食之，壽命得長久。土遊於四季，守界定規矩。金砂入五內，霧散若風雨。熏蒸達四肢，顏色悅澤好。髮白皆變黑，齒落生舊所。老翁復丁壯，耆嫗成吒女。改形免世厄，號之曰真人。", "i": 43}, {"t": "h2", "s": "同类合体章第十二", "o": "同類合體章第十二", "i": 44}, {"t": "p", "s": "胡粉投火中，色坏还为<b>铅</b>。冰雪得温汤，解释成太玄。金以砂为主，秉和于水银。变化由其真，终始自相因。欲作伏食仙，宜以同类者，植禾当以谷，覆鸡用其卵。以类补自然，物成易陶冶。鱼目岂为珠？蓬蒿不成槚。类同者相从，事乖不成宝。燕雀不生凤，狐兔不乳马。水流不炎上，火动不润下。时间多学士，高妙负良材。邂逅不遭遇，耗火亡资财。据按依文说，妄以言为之。端绪无因缘，度量失操持。捣治羌石胆，云母及矾磁。硫磺烧豫章，泥于相炼治。鼓下五石铜，以之为辅枢。杂性不同类，安肯同体居。千举必万败，欲黠反成痴。稚年至白首，中道生狐疑。背道守迷路，出正入邪蹊。管窥不广见，难以揆方来。", "o": "胡粉投火中，色壞還為鉛。冰雪得溫湯，解釋成太玄。金以砂為主，秉和於水銀。變化由其真，終始自相因。欲作伏食仙，宜以同類者，植禾當以穀，覆雞用其卵。以類補自然，物成易陶冶。魚目豈為珠？蓬蒿不成檟。類同者相從，事乖不成寶。燕雀不生鳳，狐兔不乳馬。水流不炎上，火動不潤下。時間多學士，高妙負良材。邂逅不遭遇，耗火亡資財。據按依文說，妄以言為之。端緒無因緣，度量失操持。擣治羌石膽，雲母及礬磁。硫磺燒豫章，泥於相煉治。鼓下五石銅，以之為輔樞。雜性不同類，安肯同體居。千舉必萬敗，欲黠反成癡。稚年至白首，中道生狐疑。背道守迷路，出正入邪蹊。管窺不廣見，難以揆方來。", "i": 45}, {"t": "h2", "s": "三圣前识章第十三", "o": "三聖前識章第十三", "i": 46}, {"t": "note", "s": "俞琰发挥曰：《悟真篇》云：契论经歌讲至真，不将火侯著于文。要知口诀通玄处，须共神仙仔细论。后学不悟真荃，见有所谓《火记》六百篇之说，则莫不惘然自失。以为<b>火候</b>如此其繁且难，殊不知六百篇亦犹六十卦尔。六十卦为一月之候，六百篇乃十个月之侯。盖一月六十卦，卦卦一般；十个月六百篇，篇篇相似，故日所趣等不殊也。", "o": "俞琰发挥曰：《悟真篇》云：契論經歌講至真，不將火侯著於文。要知口訣通玄處，須共神仙仔細論。後學不悟真荃，見有所謂《火記》六百篇之說，則莫不惘然自失。以為<b>火候</b>如此其繁且難，殊不知六百篇亦猶六十卦爾。六十卦為一月之候，六百篇乃十箇月之侯。蓋一月六十卦，卦卦一般；十箇月六百篇，篇篇相似，故日所趣等不殊也。", "i": 47}, {"t": "p", "s": "若夫至圣，不过伏羲，始画八卦，效法天地。文王帝之宗，结体演爻辞。夫子庶圣雄，十翼以辅之。三君天所挺，迭兴更御时。优劣有步骤，功德不相殊。制作有所踵，推度审分铢。有形易忖量，无兆难虑谋。作事令可法，为世定诗书。素无前识资，因师觉悟之。皓若寒帷帐，嗔目登高台。火记六百篇，所趣等不殊。文字郑重说，世人不孰思。寻度其源流，幽明本共居。窃为贤者谈，曷敢轻为书？若遂结舌㖣，绝道获罪诛。写情著竹帛，又恐泄天符。犹豫增叹息，俯仰缀斯愚。陶冶有法度，未可悉陈敷。略述其纲纪，枝条见扶疏。", "o": "若夫至聖，不過伏羲，始畫八卦，效法天地。文王帝之宗，結體演爻辭。夫子庶聖雄，十翼以輔之。三君天所挺，迭興更御時。優劣有步驟，功德不相殊。制作有所踵，推度審分銖。有形易忖量，無兆難慮謀。作事令可法，為世定詩書。素無前識資，因師覺悟之。皓若寒帷帳，嗔目登高臺。火記六百篇，所趣等不殊。文字鄭重說，世人不孰思。尋度其源流，幽明本共居。竊為賢者談，曷敢輕為書？若遂結舌㖣，絕道獲罪誅。寫情著竹帛，又恐洩天符。猶豫增嘆息，俯仰綴斯愚。陶冶有法度，未可悉陳敷。略述其綱紀，枝條見扶疏。", "i": 48}, {"t": "h2", "s": "金丹刀圭章第十四", "o": "金丹刀圭章第十四", "i": 49}, {"t": "note", "s": "俞琰发挥曰：候视加谨慎者，塞兑垂帘，含光默默，候天地之气将至，然后定息以探之，聚火以烹之，须当视其老嫩不可轻易也。《悟真篇》云：大都全藉修持力，毫发差殊不作丹。岂可轻易哉？审察调寒温者，调停火力，审察紧缓，以渐而猛，不可荒忙骤进也。《<b>复</b>命篇》云：<b>火候</b>直须牢稳审，吹嘘全藉巽方风。岂可骤进哉？", "o": "俞琰发挥曰：候視加謹慎者，塞兌垂簾，含光默默，候天地之氣將至，然後定息以探之，聚火以烹之，須當視其老嫩不可輕易也。《悟真篇》云：大都全藉修持力，毫髮差殊不作丹。豈可輕易哉？審察調寒溫者，調停火力，審察緊緩，以漸而猛，不可荒忙驟進也。《復命篇》云：<b>火候</b>直須牢穩審，吹噓全藉巽方風。豈可驟進哉？", "i": 50}, {"t": "note", "s": "俞琰发挥曰：夫修炼金丹，将求长生。今魏公乃谓气索命将绝，休死亡魄魂。何也？《翠虚篇》云：促将百豚尽归源，豚住气停丹始结。盖金液凝结", "o": "俞琰发挥曰：夫修鍊金丹，將求長生。今魏公乃謂氣索命將絕，休死亡魄魂。何也？《翠虛篇》云：促將百豚盡歸源，豚住氣停丹始結。蓋金液凝結", "i": 51}, {"t": "p", "s": "以金为堤防，水入乃优游。金计有十五，水数亦如之。<b>临</b>炉定铢两，五分水有余。二者以为真，金重如本初。其三遂不入，火二与之俱。三物相含受，变化状有神。下有太阳气，伏蒸须臾间。先液而后凝，号曰黄□焉。岁月将欲讫，毁惟伤寿年。形体如灰土，状若明窗尘。捣治并合之，持入赤色门。固塞其际会，务令至完坚。炎火张于下，昼夜声正勤。始文使可修，终意武乃陈。候视加谨慎，审察调寒温。周旋十二节，节尽更须亲。气索命将绝，休死亡魄魂。色转更为紫，赫然成还丹。粉提以一丸，刀圭最为神。", "o": "以金為堤防，水入乃優游。金計有十五，水數亦如之。臨爐定銖兩，五分水有餘。二者以為真，金重如本初。其三遂不入，火二與之俱。三物相含受，變化狀有神。下有太陽氣，伏蒸須臾間。先液而後凝，號曰黃□焉。歲月將欲訖，毀惟傷壽年。形體如灰土，狀若明窗塵。擣治并合之，持入赤色門。固塞其際會，務令至完堅。炎火張於下，晝夜聲正勤。始文使可修，終意武乃陳。候視加謹慎，審察調寒溫。周旋十二節，節盡更須親。氣索命將絕，休死亡魄魂。色轉更為紫，赫然成還丹。粉提以一丸，刀圭最為神。", "i": 52}, {"t": "h2", "s": "水火情性章第十五", "o": "水火情性章第十五", "i": 53}, {"t": "note", "s": "俞琰发挥曰：《易》曰：天一地二，天三地四，天五地六，天七地八，天九地十，乃五行生成数也。《子华子》云：天地之大数，莫过乎五，莫中乎五。盖五为土数，位居中央，合北方水一则成六，合南方火二则成七，合束方木三则成八，合西方金四则成九。九者，数之极也。天下之数至九而止汨以九数言之，五居一、二、三、四、六、七、八、九之中，实为中数也。数本无十，所谓土之成数十者，乃北方之一，南方之二，束方之三，西方之四，聚于中央，辏而成十也。故以中央之五散于四方而成六、七、八、九，则水、火、木、金皆赖土而成。若以四方之一、二、三、四归于中央而成十，则水、火、木、金皆返本还元而会于土中也。吁，玄哉。", "o": "俞琰发挥曰：《易》曰：天一地二，天三地四，天五地六，天七地八，天九地十，乃五行生成數也。《子華子》云：天地之大數，莫過乎五，莫中乎五。蓋五為土數，位居中央，合北方水一則成六，合南方火二則成七，合束方木三則成八，合西方金四則成九。九者，數之極也。天下之數至九而止汨以九數言之，五居一、二、三、四、六、七、八、九之中，實為中數也。數本無十，所謂土之成數十者，乃北方之一，南方之二，束方之三，西方之四，聚於中央，輳而成十也。故以中央之五散於四方而成六、七、八、九，則水、火、木、金皆賴土而成。若以四方之一、二、三、四歸於中央而成十，則水、火、木、金皆返本還元而會於土中也。吁，玄哉。", "i": 54}, {"t": "note", "s": "俞琰发挥曰：子得一，万事毕。大哉一乎，其千经万论之原，千变万化之祖乎，信矣哉。天下无二道，圣人无二心，而万巷仙经语总同，金丹即此是根宗也。", "o": "俞琰发挥曰：子得一，萬事畢。大哉一乎，其千經萬論之原，千變萬化之祖乎，信矣哉。天下無二道，聖人無二心，而萬巷仙經語總同，金丹即此是根宗也。", "i": 55}, {"t": "p", "s": "推演五行数，较约而不繁。举水以激火，奄然灭光明。日月相薄蚀，常在朔望间。水盛坎侵阳，火衰离昼昏。阴阳相饮食，交感道自然。名者以定情，字者以性言。金来归性初，乃得称还丹。吾不敢虚说，仿效圣人文。古记题<b>龙虎</b>，黄帝美金华。淮南炼秋石，玉阳加<b>黄芽</b>。贤者能持行，不肖毋与俱。古今道由一，对谈吐所谋。学者加勉力，留念深思惟。至要言甚露，昭昭不我欺。", "o": "推演五行數，較約而不繁。舉水以激火，奄然滅光明。日月相薄蝕，常在朔望間。水盛坎侵陽，火衰離晝昏。陰陽相飲食，交感道自然。名者以定情，字者以性言。金來歸性初，乃得稱還丹。吾不敢虛說，仿效聖人文。古記題龍虎，黃帝美金華。淮南煉秋石，玉陽加黃芽。賢者能持行，不肖毋與俱。古今道由一，對談吐所謀。學者加勉力，留念深思惟。至要言甚露，昭昭不我欺。", "i": 56}, {"t": "h2", "s": "阴阳精气章第十六", "o": "陰陽精氣章第十六", "i": 57}, {"t": "note", "s": "俞琰发挥曰：《赤龙大丹诀》云：有物号玄冥，金丹向此生。是物也，寂兮寥兮，眇不可测，岂可得而画图哉？既不可得而画图，则惟可心知意会而已。然在己者固可心知意会，而示人者得不假象托文而使之默会其机乎？圣人于是探迹索隐以发明先天之极玄，广譬曲喻以参序金丹之元基，此丹经、子书所以传行于世，而《参同契》所以准《易》而作也。元基，即根基也。《悟真篇》云：要得谷神长不死，须凭玄牝立根基。盖伏<b>铅</b>制<b>汞</b>全在玄牝，所以玄牝为还丹之根基。男子玄牝立则精气固，女子玄牝立则月事绝。修炼若不知此，则药材从何而生，还丹从何而结，火侯从何而运用哉？", "o": "俞琰发挥曰：《赤龍大丹訣》云：有物號玄冥，金丹向此生。是物也，寂兮寥兮，眇不可測，豈可得而畫圖哉？既不可得而畫圖，則惟可心知意會而已。然在己者固可心知意會，而示人者得不假象託文而使之默會其機乎？聖人於是探蹟索隱以發明先天之極玄，廣譬曲喻以參序金丹之元基，此丹經、子書所以傳行於世，而《參同契》所以準《易》而作也。元基，即根基也。《悟真篇》云：要得谷神長不死，須憑玄牝立根基。蓋伏鉛制<b>汞</b>全在玄牝，所以玄牝為還丹之根基。男子玄牝立則精氣固，女子玄牝立則月事絕。修鍊若不知此，則藥材從何而生，還丹從何而結，火侯從何而運用哉？", "i": 58}, {"t": "p", "s": "<b>乾坤</b>刚柔，配合相包。阳秉阴受，雌雄相须。须以造化，精气乃舒。<b>坎离</b>冠首，先映垂敷。玄冥难测，不可画图。圣人揆度，参序元基。四者混沌，径入虚无。六十卦周，张布为舆。龙马就驾，明君御时。和则随从，路平不邪。邪道险阻，倾危国家。", "o": "<b>乾坤</b>剛柔，配合相包。陽秉陰受，雌雄相須。須以造化，精氣乃舒。坎離冠首，先映垂敷。玄冥難測，不可畫圖。聖人揆度，參序元基。四者混沌，徑入虛無。六十卦周，張布為輿。龍馬就駕，明君御時。和則隨從，路平不邪。邪道險阻，傾危國家。", "i": 59}, {"t": "h2", "s": "君子居室章第十七", "o": "君子居室章第十七", "i": 60}, {"t": "note", "s": "俞琰发挥曰：高鸿<b>蒙</b>《梦仙谣》云：探有时，取有日，探兮取兮须馑密。故叉按历法令，知下手之。诀，至诚专密，无纤毫之杂想，然后神芝可录。乃若一年处室，自朝至暮，内运灵旗，亦当至诚专密，用志不分，然后丹可成，身可仙。若将大道为儿戏，而轻易窃弄天机，则朝行暮辍，又非诚矣。《黄庭经》云：积功成炼非自然，是由精诚亦由专。古今修丹之士，固未有不诚而得之者，亦未有不专心致志而可以成事者也。昔者弈秋诲二人弈j一人专心致志，惟弈秋之为听；一人虽听之，一心以为有鸿鹊将至，思援弓缴而射之，虽与之俱学，弗若之矣。夫弈之为数，小数也，弗专心政志则弗得也。况于道乎？司马子微《坐忘论》云：无事安闲，方可修道。", "o": "俞琰发挥曰：高鴻濛《夢仙謠》云：探有時，取有日，探兮取兮須饉密。故叉按歷法令，知下手之。訣，至誠專密，無纖毫之雜想，然後神芝可錄。乃若一年處室，自朝至暮，內運靈旗，亦當至誠專密，用志不分，然後丹可成，身可仙。若將大道為兒戲，而輕易竊弄天機，則朝行暮輟，又非誠矣。《黃庭經》云：積功成鍊非自然，是由精誠亦由專。古今修丹之士，固未有不誠而得之者，亦未有不專心致志而可以成事者也。昔者弈秋誨二人弈j一人專心致志，惟弈秋之為聽；一人雖聽之，一心以為有鴻鵲將至，思援弓繳而射之，雖與之俱學，弗若之矣。夫弈之為數，小數也，弗專心政志則弗得也。況於道乎？司馬子微《坐忘論》云：無事安閑，方可修道。", "i": 61}, {"t": "note", "s": "俞琰发挥曰：《<b>复</b>命篇》云一夫一妇资天地，三女三男合始终。盖<b>乾</b>生三男，<b>坤</b>生三女，总日六子。今<b>乾</b>父<b>坤</b>母，位乎上下，而六子运用于其间，往来上下，一惟父母是从，故名之日孝子。皇极者，中央正位也，周回八方会归之所也。孝子能用心而感动之，则虎啸一声龙出窟，鸾飞凤舞入金城矣。如其举动悖乱，不协于极，则玄珠迸散，灵<b>汞</b>逃亡。六子非孝子，迺丹道之逆贼焉尔。", "o": "俞琰发挥曰：《復命篇》云一夫一婦資天地，三女三男合始終。蓋<b>乾</b>生三男，<b>坤</b>生三女，總日六子。今<b>乾</b>父<b>坤</b>母，位乎上下，而六子運用於其間，往來上下，一惟父母是從，故名之日孝子。皇極者，中央正位也，周回八方會歸之所也。孝子能用心而感動之，則虎嘯一聲龍出窟，鸞飛鳳舞入金城矣。如其舉動悖亂，不協于極，則玄珠迸散，靈<b>汞</b>逃亡。六子非孝子，迺丹道之逆賊焉爾。", "i": 62}, {"t": "p", "s": "君子居其室，出其言善，则千里之外应之。谓万乘之主，处九重之室，发号出令，顺阴阳节。藏器俟时，勿违卦月。<b>屯</b>以子申，<b>蒙</b>用寅戍。余六十卦，各自有日。聊陈两象，未能究悉。立意设刑，当仁施德，逆之者凶，顺之者吉。按历法令，至诚专密。谨候日辰，审查<b>消息</b>。纤芥不正，悔吝为贼。二至改度，乖错委曲。隆冬大暑，盛夏霜雪。二分纵横，不应漏刻。水旱相伐，风雨不节，蝗虫涌沸，群异旁出。天见其怪，山崩地裂。孝子用心，感动皇极。近出己口，远流殊域。或以召祸，或以至福，或造太平，或造兵革。四者之来，由乎胸臆。动静有常，奉其绳墨。四时顺宜，与（气）相得。刚柔断矣，不相涉入。五行守界，不妄盈缩。易行周流，屈伸反<b>复</b>。", "o": "君子居其室，出其言善，則千里之外應之。謂萬乘之主，處九重之室，發號出令，順陰陽節。藏器俟時，勿違卦月。<b>屯</b>以子申，<b>蒙</b>用寅戍。餘六十卦，各自有日。聊陳兩象，未能究悉。立意設刑，當仁施德，逆之者凶，順之者吉。按歷法令，至誠專密。謹候日辰，審查<b>消息</b>。纖芥不正，悔吝為賊。二至改度，乖錯委曲。隆冬大暑，盛夏霜雪。二分縱橫，不應漏刻。水旱相伐，風雨不節，蝗蟲湧沸，群異旁出。天見其怪，山崩地裂。孝子用心，感動皇極。近出己口，遠流殊域。或以召禍，或以至福，或造太平，或造兵革。四者之來，由乎胸臆。動靜有常，奉其繩墨。四時順宜，與（氣）相得。剛柔斷矣，不相涉入。五行守界，不妄盈縮。易行周流，屈伸反覆。", "i": 63}, {"t": "h2", "s": "晦朔合符章第十八", "o": "晦朔合符章第十八", "i": 64}, {"t": "note", "s": "俞琰发挥曰：《还丹篇》云：万里阴沉春气合，九霄清彻露华凝。妙矣哉，其阴阳交感之真景象欤。斯时也，精神四达并流，无所不极。上际于天，下蟠于地，冥冥兮如烟岚之罩山，<b>蒙</b><b>蒙</b>兮如雾气之笼水，霏霏兮如冬雪之渐凝渐聚，沉沉兮如浆水之渐订渐清，此乃身中之天地捆缢、身中之男女构精也。迨夫时至气化，感而遂通，则倏尔火轮煎地豚，愕然神汉涌山椒。天地之间，被润泽而大丰美矣。《击壤集·恍惚吟》云：恍惚阴阳初变化，捆缢天地乍回旋。中问些子好光景，安得功夫入语言。苟非亲造实诣，又岂信有如此之真景象哉？天地神灵，不可度量。阴阳相交而神煞藏没，此天地神灵之时也。<b>龙虎</b>相交而鬼神不知，此吾身神灵之时也。", "o": "俞琰发挥曰：《還丹篇》云：萬里陰沉春氣合，九霄清徹露華凝。妙矣哉，其陰陽交感之真景象歟。斯時也，精神四達並流，無所不極。上際於天，下蟠於地，冥冥兮如煙嵐之罩山，濛濛兮如霧氣之籠水，霏霏兮如冬雪之漸凝漸聚，沉沉兮如漿水之漸訂漸清，此乃身中之天地綑縊、身中之男女構精也。迨夫時至氣化，感而遂通，則倏爾火輪煎地豚，愕然神漢湧山椒。天地之間，被潤澤而大豐美矣。《擊壤集·恍惚吟》云：恍惚陰陽初變化，綑縊天地乍迴旋。中問些子好光景，安得功夫入語言。苟非親造實詣，又豈信有如此之真景象哉？天地神靈，不可度量。陰陽相交而神煞藏沒，此天地神靈之時也。龍虎相交而鬼神不知，此吾身神靈之時也。", "i": 65}, {"t": "note", "s": "俞琰发挥曰：晦朔之问，日月合璧于北方，光耀隐而不见。丹法以时易日，于半夜《<b>坤</b>》、《<b>复</b>》之交，叠足端坐如山石之不动，口缄舌气如冬蛇之垫伏，此即利用安身，隐形而藏也。其时含光默默，返照于其内，一呼一吸，悠悠绵绵，迤逦归于命蒂。久之，但觉窈窈冥冥，如<b>临</b>万丈不测之渊潭，此乃神气归根、身心<b>复</b>命、金液凝结之时也。《翠虚篇》云：气入丹田养白鸦，斯时方日结<b>黄芽</b>。如其心猿不定，意马四驰，则神气散乱于外。欲望结成还丹，其可得乎？", "o": "俞琰发挥曰：晦朔之問，日月合璧於北方，光耀隱而不見。丹法以時易日，於半夜《<b>坤</b>》、《復》之交，疊足端坐如山石之不動，口緘舌氣如冬蛇之墊伏，此即利用安身，隱形而藏也。其時含光默默，返照於其內，一呼一吸，悠悠綿綿，迤邐歸於命蒂。久之，但覺窈窈冥冥，如臨萬丈不測之淵潭，此乃神氣歸根、身心復命、金液凝結之時也。《翠虛篇》云：氣入丹田養白鴉，斯時方日結黃芽。如其心猿不定，意馬四馳，則神氣散亂於外。欲望結成還丹，其可得乎？", "i": 66}, {"t": "p", "s": "晦朔之间，合符行中。混沌鸿<b>蒙</b>，牝牡相从。滋液润泽，施化流通。天地神明，不可度量。利用安身，隐形而藏。始于东北，箕斗之乡。旋而右转，呕轮吐萌。潜潭见象，发散精光。昂毕之上，震为出征。阳（气）造端，初九潜龙。阳以三立，阴以八通。三日震动，八日兑行。九二见龙，和平有明。三五德就，<b>乾</b>体乃成。九三夕惕，亏折神符。盛衰渐革，终还其初。巽继其统，固际操持。九四或跃，进退道危。艮主进止，不得逾时。二十三日，典守弦期。九五飞龙，天位加嘉。六五<b>坤</b>承，结括终始。酝养众子，世为类母。上九亢龙，战德于野，用九翩翩，为道规矩。阳数已讫，讫则<b>复</b>起。推情合性，转而相与。循环璇玑，升降上下。周流六爻，难可察睹。故无常位，为易宗祖。", "o": "晦朔之間，合符行中。混沌鴻<b>蒙</b>，牝牡相從。滋液潤澤，施化流通。天地神明，不可度量。利用安身，隱形而藏。始於東北，箕斗之鄉。旋而右轉，嘔輪吐萌。潛潭見象，發散精光。昂畢之上，震為出徵。陽（氣）造端，初九潛龍。陽以三立，陰以八通。三日震動，八日兌行。九二見龍，和平有明。三五德就，<b>乾</b>體乃成。九三夕惕，虧折神符。盛衰漸革，終還其初。巽繼其統，固際操持。九四或躍，進退道危。艮主進止，不得踰時。二十三日，典守弦期。九五飛龍，天位加嘉。六五<b>坤</b>承，結括終始。醞養眾子，世為類母。上九亢龍，戰德於野，用九翩翩，為道規矩。陽數已訖，訖則復起。推情合性，轉而相與。循環璇璣，升降上下。周流六爻，難可察睹。故無常位，為易宗祖。", "i": 67}, {"t": "h2", "s": "爻变功用章第十九", "o": "爻變功用章第十九", "i": 68}, {"t": "note", "s": "俞琰发挥曰：《<b>大壮</b>》，四阳之卦也，律应夹钟。以一日言之，为日出卯；以一月言之，为初八半至初十；以一岁言之，则斗杓建卯之月是也。此时阴佐阳气，聚物而出，喻身中阳火方半，气候停匀，故言刑德相负，昼夜始分。然万物莫不当春而发生，而榆荚至是堕落，何也？盖阳中有阴也。", "o": "俞琰发挥曰：《大壯》，四陽之卦也，律應夾鍾。以一日言之，為日出卯；以一月言之，為初八半至初十；以一歲言之，則斗杓建卯之月是也。此時陰佐陽氣，聚物而出，喻身中陽火方半，氣候停勻，故言刑德相負，晝夜始分。然萬物莫不當春而發生，而榆莢至是墮落，何也？蓋陽中有陰也。", "i": 69}, {"t": "p", "s": "朔旦为<b>复</b>，阳□（气）始通。出入无疾，立表微刚。黄钟建子，兆乃滋彰。播施柔暖，黎蒸得常。<b>临</b>炉施条，开路正光。光耀渐进，日以益长。丑之大侣，结正低昂。仰以成<b>泰</b>，刚柔并隆。远游交接，小往大来。辐辏于银，运而趋时。渐历<b>大壮</b>，侠列卯门。榆荚堕落，还归本根。刑德相负，昼夜始分。<b>夬</b>阴以退，阳升而前。洗涤羽翮，振索宿尘。<b>乾</b>健盛明，广被四邻。阳终于己，中而相干。媾始纪序，履霜最先。井底寒泉，午为蕤宾。宾伏于阴，阴为主人。<b>遁</b>世去位，收敛其精。怀德俟时，栖迟昧冥。<b>否</b>塞不通，萌芽不生。阴申阳屈，没阳姓名。<b>观</b>其权量，察众秋情。任畜微稚，老枯<b>复</b>荣。荠麦牙孽，因冒以生。<b>剥</b>烂肢体，消减其形。化（气）既竭，亡失至神。道穷则返，归乎<b>坤</b>元。恒顺地理，承天布宣。玄幽远眇，隔阂相连。应度育种，阴阳之元。廖廓恍惚，莫知其端。先迷失轨，后为主君。无平不陂，道之自然。变易更盛，<b>消息</b>相因。<mark>终坤复始，如复连环</mark>。<mark>帝王承御，千载常存</mark>。", "o": "朔旦為復，陽□（氣）始通。出入無疾，立表微剛。黃鐘建子，兆乃滋彰。播施柔暖，黎蒸得常。臨爐施條，開路正光。光耀漸進，日以益長。丑之大侶，結正低昂。仰以成<b>泰</b>，剛柔並隆。遠游交接，小往大來。輻輳於銀，運而趨時。漸歷大壯，俠列卯門。榆莢墮落，還歸本根。刑德相負，晝夜始分。<b>夬</b>陰以退，陽升而前。洗滌羽翮，振索宿塵。<b>乾</b>健盛明，廣被四鄰。陽終於己，中而相干。媾始紀序，履霜最先。井底寒泉，午為蕤賓。賓伏於陰，陰為主人。<b>遁</b>世去位，收斂其精。懷德俟時，棲遲昧冥。<b>否</b>塞不通，萌芽不生。陰申陽屈，沒陽姓名。觀其權量，察眾秋情。任畜微稚，老枯復榮。薺麥牙孽，因冒以生。剝爛肢體，消減其形。化（氣）既竭，亡失至神。道窮則返，歸乎<b>坤</b>元。恆順地理，承天布宣。玄幽遠眇，隔閡相連。應度育種，陰陽之元。廖廓恍惚，莫知其端。先迷失軌，後為主君。無平不陂，道之自然。變易更盛，<b>消息</b>相因。終<b>坤</b>復始，如復連環。帝王承御，千載常存。", "i": 70}, {"t": "h2", "s": "养性立命章第二十", "o": "養性立命章第二十", "i": 71}, {"t": "note", "s": "俞琰发挥曰：天有黄道，为度三百六十五。其运转也，一日一周。日月行乎其问，往来上下，迭为出入，此所以分昼夜而定寒暑也。然天道密旋，本无度数，以日月经历诸辰而为行度。日月往来，本无定居，以朝暮出入之地而为所居。明乎此，然后知魏公所谓阴阳为度，魂魄所居矣。夫人身中黄道，即阴符阳火所行之处也，即日魂月魄所居之方也。有能<b>观</b>天之道，执天之行，识阴阳之行度，知魂魄之所居，则周天三百六十五度，循环乎一息之顷，而日月出入乎呼吸之微。呼为阳，吸为阴，与天道同一妙用，不叉求之他也。", "o": "俞琰发挥曰：天有黃道，為度三百六十五。其運轉也，一日一周。日月行乎其問，往來上下，迭為出入，此所以分晝夜而定寒暑也。然天道密旋，本無度數，以日月經歷諸辰而為行度。日月往來，本無定居，以朝暮出入之地而為所居。明乎此，然後知魏公所謂陰陽為度，魂魄所居矣。夫人身中黃道，即陰符陽火所行之處也，即日魂月魄所居之方也。有能觀天之道，執天之行，識陰陽之行度，知魂魄之所居，則周天三百六十五度，循環乎一息之頃，而日月出入乎呼吸之微。呼為陽，吸為陰，與天道同一妙用，不叉求之他也。", "i": 72}, {"t": "note", "s": "俞琰发挥曰：古歌云：日魂月魄若个识，识者便是真仙子。此所谓日魂月魄，非天地有形有象显然之日魂月魄，乃吾身无形无象隐然之日魂月魄也。不遇真人指授，焉能识之哉？夫日为太阳，昼以舒光，故称魂。月为太阴，夜以含景，故称魄。然日魂属阳，谓之阳神固宜。而月魄属阴，谓之阴精可也。岂可以神言？今皆谓之神者，以其变动不居，周流六虚，往来既不定，上下亦无常也。魂，束方木也。魄，西方金也。金木本来无二体，束邻即便是西家；往来束西，迭为出入，故日互为室宅也。", "o": "俞琰发挥曰：古歌云：日魂月魄若箇識，識者便是真仙子。此所謂日魂月魄，非天地有形有象顯然之日魂月魄，乃吾身無形無象隱然之日魂月魄也。不遇真人指授，焉能識之哉？夫日為太陽，晝以舒光，故稱魂。月為太陰，夜以含景，故稱魄。然日魂屬陽，謂之陽神固宜。而月魄屬陰，謂之陰精可也。豈可以神言？今皆謂之神者，以其變動不居，周流六虛，往來既不定，上下亦無常也。魂，束方木也。魄，西方金也。金木本來無二體，束鄰即便是西家；往來束西，迭為出入，故日互為室宅也。", "i": 73}, {"t": "p", "s": "将欲养性，延命却期。审思后末，当虑其先。人所秉躯，体本一无。元精云布，因（气）托初。阴阳为度，魂魄所居。阳神日魂，阴神月魄。魂之与魄，互为室宅。性主处内，立置鄞鄂。情主营外，筑垣城郭。城郭完全，人物乃安。爰斯之时，情和<b>乾坤</b>。<b>乾</b>动而直，（气）布精流；<b>坤</b>静而翕，为道舍庐。刚施而退，柔化以滋。九还七返，八归六居。男白女赤，金火相拘。则水定火，五行之初。上善若水，清而无瑕。道之形象，真一难图。变而分布，各自独居。类如鸡子，白黑相符，纵广一寸，以为始初。四肢五脏，筋骨乃俱。弥历十月，脱出其胞。骨弱可卷，肉滑若<b>铅</b>。", "o": "將欲養性，延命卻期。審思後末，當慮其先。人所秉軀，體本一無。元精雲布，因（氣）託初。陰陽為度，魂魄所居。陽神日魂，陰神月魄。魂之與魄，互為室宅。性主處內，立置鄞鄂。情主營外，築垣城郭。城郭完全，人物乃安。爰斯之時，情和<b>乾坤</b>。<b>乾</b>動而直，（氣）布精流；<b>坤</b>靜而翕，為道舍廬。剛施而退，柔化以滋。九還七返，八歸六居。男白女赤，金火相拘。則水定火，五行之初。上善若水，清而無瑕。道之形象，真一難圖。變而分布，各自獨居。類如雞子，白黑相符，縱廣一寸，以為始初。四肢五臟，筋骨乃俱。彌歷十月，脫出其胞。骨弱可卷，肉滑若鉛。", "i": 74}, {"t": "h2", "s": "二气感化章第二十一", "o": "二氣感化章第二十一", "i": 75}, {"t": "p", "s": "阳燧以取火，非日不生光。方诸非星月，安能得水浆？二（气）玄且远，感化尚相通，何况近存身？切在于心胸。阴阳配日月，水火为效征。", "o": "陽燧以取火，非日不生光。方諸非星月，安能得水漿？二（氣）玄且遠，感化尚相通，何況近存身？切在於心胸。陰陽配日月，水火為效徵。", "i": 76}, {"t": "h2", "s": "关键三宝章第二十二", "o": "關鍵三寶章第二十二", "i": 77}, {"t": "note", "s": "俞琰发挥曰：真人，即元神也。深渊，即太渊也。异名众多，今试举而言之，日泥丸宫、流珠官、玉清官、紫清官、翠微官、太微官、太一官、太玄关、玄门、玄官、玄室、玄谷、玄田、砂田、第一关、都关、天关、，天门、天谷、天田、天心、天轮、天轴、天源、天池、天根、天堂、天官、<b>乾</b>宫、<b>乾</b>家、交感官、离官、神官、神室、神关、神京、神都、玄都、故都、故乡、故丘、故林、故官、紫府、紫庭、紫金城、紫金鼎、朱砂鼎、<b>汞</b>鼎、玉鼎、玉室、玉京、玉宇、瑶峰、第一峰、最高峰、祝融峰、昆仑顶、崆峒山、蓬莱、上岛、上京、上官、上玄、上元、上谷、上土釜、上丹田，其名虽众，其实则一也。《翠虚篇》云：天有七星地七宝，人有七窍权归脑。", "o": "俞琰发挥曰：真人，即元神也。深淵，即太淵也。異名眾多，今試舉而言之，日泥丸宮、流珠官、玉清官、紫清官、翠微官、太微官、太一官、太玄關、玄門、玄官、玄室、玄谷、玄田、砂田、第一關、都關、天關、，天門、天谷、天田、天心、天輪、天軸、天源、天池、天根、天堂、天官、<b>乾</b>宮、<b>乾</b>家、交感官、離官、神官、神室、神關、神京、神都、玄都、故都、故鄉、故丘、故林、故官、紫府、紫庭、紫金城、紫金鼎、朱砂鼎、<b>汞</b>鼎、玉鼎、玉室、玉京、玉宇、瑤峰、第一峰、最高峰、祝融峰、崑崙頂、崆峒山、蓬萊、上島、上京、上官、上玄、上元、上谷、上土釜、上丹田，其名雖眾，其實則一也。《翠虛篇》云：天有七星地七寶，人有七竅權歸腦。", "i": 78}, {"t": "note", "s": "俞琰发挥曰：精生有时，时至神知。百刻之中，切忌昏迷，须是行、住、坐、外，绵绵若存，如鸡抱卵，煖气不绝，方可谓之修炼。至于真积力久，功夫纯熟，昼夜如一，更无梦觉之异。虽当寝寐之问，神亦不昧，而精生之时，神与天通。虽不待唤醒，亦自觉悟，夏云峰云：自·然时节，梦裹也教知是也。今魏公谓寝寐神相抱，觉悟候存亡，欲修炼之士常惺惺也。盖金丹大药由神气交结而成，乃是无质生质，结成圣胎，辛勤保护十月，如幼女之初怀孕，似小龙之乍养珠。盖神气始凝结，极易练失，寝寐之际，须当与神相抱，切不可昏迷而沉于梦境。觉悟之后，惟恐火玲而丹力或迟，故铃候其存亡。", "o": "俞琰发挥曰：精生有時，時至神知。百刻之中，切忌昏迷，須是行、住、坐、外，綿綿若存，如雞抱卵，煖氣不絕，方可謂之修鍊。至於真積力久，功夫純熟，晝夜如一，更無夢覺之異。雖當寢寐之問，神亦不昧，而精生之時，神與天通。雖不待喚醒，亦自覺悟，夏雲峰云：自·然時節，夢裹也教知是也。今魏公謂寢寐神相抱，覺悟候存亡，欲修鍊之士常惺惺也。蓋金丹大藥由神氣交結而成，乃是無質生質，結成聖胎，辛勤保護十月，如幼女之初懷孕，似小龍之乍養珠。蓋神氣始凝結，極易練失，寢寐之際，須當與神相抱，切不可昏迷而沉於夢境。覺悟之後，惟恐火玲而丹力或遲，故鈴候其存亡。", "i": 79}, {"t": "p", "s": "<span class=\"key\">耳目口三宝，闭门无发通</span>。<mark>真人潜深渊，浮游守规中</mark>，旋曲以视听，开阖皆合同，为己之枢辖，动静不竭穷。离（气）内营卫，坎乃不用聪，兑合不以谈，希言顺鸿<b>蒙</b>，三者既关键，缓体处空房。委志归虚无，无念以为常。证难以推移，心专不纵横，寝寐神相抱，觉悟候存亡。颜色浸以润，骨节益坚强。排却众阴邪，然后立正阳。修之不辍体，庶（气）云雨行。淫淫若春泽，液液象解冰，从头流达足，究竟<b>复</b>上升，往来洞无极，怫怫被容中。反者道之验，弱者德之枘。耕耘宿秽污，细微得调畅。浊者清之路，昏久则昭明。", "o": "耳目口三寶，閉門無發通。真人潛深淵，浮游守規中，旋曲以視聽，開闔皆合同，為己之樞轄，動靜不竭窮。離（氣）內營衛，坎乃不用聰，兌合不以談，希言順鴻<b>蒙</b>，三者既關鍵，緩體處空房。委志歸虛無，無念以為常。證難以推移，心專不縱橫，寢寐神相抱，覺悟候存亡。顏色浸以潤，骨節益堅強。排卻眾陰邪，然後立正陽。脩之不輟體，庶（氣）雲雨行。淫淫若春澤，液液象解冰，從頭流達足，究竟復上升，往來洞無極，怫怫被容中。反者道之驗，弱者德之枘。耕耘宿穢污，細微得調暢。濁者清之路，昏久則昭明。", "i": 80}, {"t": "h2", "s": "傍门无功章第二十三", "o": "傍門無功章第二十三", "i": 81}, {"t": "p", "s": "世人好小术，不审道深浅。弃正从邪径，裕速阏不通。犹盲不任杖，聋者听宫商，没水捕雉兔，登山索鱼龙，植麦裕获黍，运规以求方。竭力劳精神，终年无见功。裕知伏食法，事约而不繁。", "o": "世人好小術，不審道深淺。棄正從邪徑，裕速閼不通。猶盲不任杖，聾者聽宮商，沒水捕雉兔，登山索魚龍，植麥裕獲黍，運規以求方。竭力勞精神，終年無見功。裕知伏食法，事約而不繁。", "i": 82}, {"t": "h2", "s": "流珠金华章第二十四", "o": "流珠金華章第二十四", "i": 83}, {"t": "note", "s": "俞琰发挥曰：太阳流珠，乃灵<b>汞</b>也。《灵源大道歌》云：此物何曾有定位，随时变化因心意。在体感热则为汗，在鼻成风则为涕，在肾感合则为精，在眼感悲则为泪。可见其常欲去人也。金华，即真<b>铅</b>也。<b>汞</b>得真<b>铅</b>则转而相依，自然不飞不走，留恋于内，而化为金液，凝而至坚也。", "o": "俞琰发挥曰：太陽流珠，乃靈<b>汞</b>也。《靈源大道歌》云：此物何曾有定位，隨時變化因心意。在體感熱則為汗，在鼻成風則為涕，在腎感合則為精，在眼感悲則為淚。可見其常欲去人也。金華，即真鉛也。<b>汞</b>得真鉛則轉而相依，自然不飛不走，留戀於內，而化為金液，凝而至堅也。", "i": 84}, {"t": "note", "s": "俞琰发挥曰：荧惑守西者，火入金乡也。太白经天者，金过南方午位而出现也。作丹之时，运神火照入金乡，金被火逼，遂飞腾而起现于南方，《还金篇》云：沉归海底去，抱出日头来是也。金，即真<b>铅</b>也。杀气所<b>临</b>，何有不倾者，真<b>铅</b>飞上擒真<b>汞</b>，真<b>汞</b>自出投真<b>铅</b>。元阳子《大道歌》云：白虎自玆相见后，流珠那肯不相从是也。", "o": "俞琰发挥曰：熒惑守西者，火入金鄉也。太白經天者，金過南方午位而出現也。作丹之時，運神火照入金鄉，金被火逼，遂飛騰而起現於南方，《還金篇》云：沉歸海底去，抱出日頭來是也。金，即真鉛也。殺氣所臨，何有不傾者，真鉛飛上擒真<b>汞</b>，真<b>汞</b>自出投真鉛。元陽子《大道歌》云：白虎自玆相見後，流珠那肯不相從是也。", "i": 85}, {"t": "p", "s": "太阳流珠，常欲去人。卒得金华，转而相因，化为白液，凝而至坚。金华先唱，有倾之间，解化为水，马齿瓓玕，阳乃往和，情性自然。迫促时阴，拘蓄禁门，慈母养育，孝子报恩，严父施令，教敕子孙。五行错王，相据以生，火性销金，金伐木荣。三五与一，天地至精，可以口诀，难以书传。子当右转，午乃车旋，卯酉界隔，主客二名。龙呼于虎，虎吸于精，两相饮食，具相贪便，遂相衔咽，咀嚼相吞。荧惑守西，太白经天，杀气所<b>临</b>，何有不倾。貍犬守鼠，鸟雀畏鹯，各有其功，何敢有声。不得其理，难以妄言。竭殚家产，妻子饥贫，自古及今，好者亿人，汽不谐遇，希有能成。广求名药，与道乖殊。", "o": "太陽流珠，常欲去人。卒得金華，轉而相因，化為白液，凝而至堅。金華先唱，有傾之間，解化為水，馬齒瓓玕，陽乃往和，情性自然。迫促時陰，拘蓄禁門，慈母養育，孝子報恩，嚴父施令，教敕子孫。五行錯王，相據以生，火性銷金，金伐木榮。三五與一，天地至精，可以口訣，難以書傳。子當右轉，午乃車旋，卯酉界隔，主客二名。龍呼於虎，虎吸於精，兩相飲食，具相貪便，遂相銜咽，咀嚼相吞。熒惑守西，太白經天，殺氣所臨，何有不傾。貍犬守鼠，鳥雀畏鸇，各有其功，何敢有聲。不得其理，難以妄言。竭殫家產，妻子饑貧，自古及今，好者億人，汽不諧遇，希有能成。廣求名藥，與道乖殊。", "i": 86}, {"t": "h2", "s": "如审遭逢章第二十五", "o": "如審遭逢章第二十五", "i": 87}, {"t": "note", "s": "俞琰发挥曰：旁门小卫，其法繁难，易遇而难成。金丹大道，其法简易，难遇而易成。如审遭逢，睹其端绪，即物类以相况，揆物理之终始，则天地之问形生气化，洪纤高下，有情无情，头头是道，皆可触类而长之也。有如鹤呜夜半，鸡唱五更，其故何也？盖与天地之气相应也。他如寒蝉之吸风、犀牛之望星、老蚌之含月、顽石之怀玉、蝶翅之开阖、萤焰之明灭、描睛之舒敛、鹿尾之逆运、龟之纳息、鼇之射影、风袋之鼓风、水滴之吸水、磁石之引针、琥珀之拾芥、桔杆槐鲈之运水、莒蒲稻花之凝露、蛇之入垫、鱼之在水，蜕蚊之转九、蟋蜻之呢子、鸡之抱卯、兔之怀胎、牛之有黄、龙之有珠、梅核之生仁、甜瓜之脱蒂，与夫芭蕉春风之机、梧桐秋雨之秘、碧潭之夜月、青山之暮云，无……", "o": "俞琰发挥曰：旁門小衛，其法繁難，易遇而難成。金丹大道，其法簡易，難遇而易成。如審遭逢，睹其端緒，即物類以相況，揆物理之終始，則天地之問形生氣化，洪纖高下，有情無情，頭頭是道，皆可觸類而長之也。有如鶴嗚夜半，雞唱五更，其故何也？蓋與天地之氣相應也。他如寒蟬之吸風、犀牛之望星、老蚌之含月、頑石之懷玉、蝶翅之開闔、螢焰之明滅、描睛之舒斂、鹿尾之逆運、龜之納息、鼇之射影、風袋之鼓風、水滴之吸水、磁石之引針、琥珀之拾芥、桔桿槐鱸之運水、莒蒲稻花之凝露、蛇之入墊、魚之在水，蛻蚊之轉九、蟋蜻之呢子、雞之抱卯、兔之懷胎、牛之有黃、龍之有珠、梅核之生仁、甜瓜之脫蒂，與夫芭蕉春風之機、梧桐秋雨之祕、碧潭之夜月、青山之暮雲，無……", "i": 88}, {"t": "note", "s": "俞琰发挥曰：五行之精凝结于天地问，或为金，或为石，历千百载而不朽。人能反身而求之，以吾自己五行之精凝结成宝，则将与天地相为无穷。金石奚足多哉？", "o": "俞琰发挥曰：五行之精凝結於天地問，或為金，或為石，歷千百載而不朽。人能反身而求之，以吾自己五行之精凝結成寶，則將與天地相為無窮。金石奚足多哉？", "i": 89}, {"t": "p", "s": "如审遭逢，睹其端绪。以类相况，揆物终始。五行相克，更为父母。母含滋液，父主秉与，凝精流形，金石不朽。审专不泄，得为成道。立竿见影，呼谷传响。岂不灵哉！天地至象。若以野葛一寸，巴豆一两，如喉辄僵，不得俯仰。当此之时，周文揲蓍，孔子占象，扁鹊操针，巫咸扣鼓，安能令苏，<b>复</b>起驰走？", "o": "如審遭逢，睹其端緒。以類相況，揆物終始。五行相克，更為父母。母含滋液，父主秉與，凝精流形，金石不朽。審專不洩，得為成道。立竿見影，呼谷傳響。豈不靈哉！天地至象。若以野葛一寸，巴豆一兩，如喉輒僵，不得俯仰。當此之時，周文揲蓍，孔子占象，扁鵲操鍼，巫咸扣鼓，安能令蘇，復起馳走？", "i": 90}, {"t": "h2", "s": "姹女黄芽章第二十六", "o": "奼女黃芽章第二十六", "i": 91}, {"t": "note", "s": "俞琰发挥曰：《全真集》云：气调神定呼交媾。《翠虚篇》云：譬如夫妇交媾时，一点精血结成婴。盖金丹之所谓交媾，乃阴阳内感，神气交结。曰雌中雄，曰夫妇，皆譬喻也。《还源篇》云：神气归根处，身心<b>复</b>命时。这般真孔窍，料得少人知。当其神入气中，气与神合，得其节符，真有刚柔相结而不可解之状，又岂有工巧以制御之？但见其然而然，吾亦不知其所以然而然，妙哉妙哉。", "o": "俞琰发挥曰：《全真集》云：氣調神定呼交媾。《翠虛篇》云：譬如夫婦交媾時，一點精血結成嬰。蓋金丹之所謂交媾，乃陰陽內感，神氣交結。曰雌中雄，曰夫婦，皆譬喻也。《還源篇》云：神氣歸根處，身心復命時。這般真孔竅，料得少人知。當其神入氣中，氣與神合，得其節符，真有剛柔相結而不可解之狀，又豈有工巧以制御之？但見其然而然，吾亦不知其所以然而然，妙哉妙哉。", "i": 92}, {"t": "p", "s": "河上姹女，灵而最神，得火则飞，不见埃尘，鬼隐龙匿，莫知所存。将欲制之，<mark>黄芽为根</mark>。物为阴阳，违天背元，牝鸡自卵，其雏不全。夫何故乎？配合未连，三五不交，刚柔离分。施化之精，天地自然，火动炎上，水流润下，非有师导，使其然也。资使统正，不可<b>复</b>改。<b>观</b>夫雌雄交媾之时，刚柔相结而不可解，得其节符，非有工巧以制御之。男生而伏，女偃其躯，秉乎胞胎，受（气）之初，非徒生时，著而见之，及其死也，亦<b>复</b>效之，此非父母教令使然。本在交媾，定置始先。", "o": "河上奼女，靈而最神，得火則飛，不見埃塵，鬼隱龍匿，莫知所存。將欲制之，黃芽為根。物為陰陽，違天背元，牝雞自卵，其雛不全。夫何故乎？配合未連，三五不交，剛柔離分。施化之精，天地自然，火動炎上，水流潤下，非有師導，使其然也。資使統正，不可復改。觀夫雌雄交媾之時，剛柔相結而不可解，得其節符，非有工巧以制御之。男生而伏，女偃其軀，秉乎胞胎，受（氣）之初，非徒生時，著而見之，及其死也，亦復效之，此非父母教令使然。本在交媾，定置始先。", "i": 93}, {"t": "h2", "s": "男女相须章第二十七", "o": "男女相須章第二十七", "i": 94}, {"t": "note", "s": "俞琰发挥曰：金生于坎官，气而已矣。盖未化为水也。因太阳真火伏需于其下，遂镕化为水，水性周章，沛然孰能御之？然火热既极，则又化而为土，火化为土，则土克水，水见土则止，故不得行也。", "o": "俞琰发挥曰：金生於坎官，氣而已矣。蓋未化為水也。因太陽真火伏需於其下，遂鎔化為水，水性周章，沛然孰能禦之？然火熱既極，則又化而為土，火化為土，則土剋水，水見土則止，故不得行也。", "i": 95}, {"t": "p", "s": "坎男为月，离女为日，日以施德，月以舒光，月受日化，体不污伤。日失其契，阴侵其明，晦朔薄蚀，掩冒相倾，日消其形，阴凌灾生。男女相胥，含土以滋，雌雄错杂，以类相求。金化为水，水性周章，火化为土，水不得行。男动外施，女静内藏，溢度过节，为女所拘。魄以钤魂，不得淫奢。不寒不暑，进退和时，各得其和，俱吐政符。", "o": "坎男為月，離女為日，日以施德，月以舒光，月受日化，體不污傷。日失其契，陰侵其明，晦朔薄蝕，掩冒相傾，日消其形，陰凌災生。男女相胥，含土以滋，雌雄錯雜，以類相求。金化為水，水性周章，火化為土，水不得行。男動外施，女靜內藏，溢度過節，為女所拘。魄以鈐魂，不得淫奢。不寒不暑，進退和時，各得其和，俱吐政符。", "i": 96}, {"t": "h2", "s": "四者混沌章第二十八", "o": "四者混沌章第二十八", "i": 97}, {"t": "note", "s": "俞琰发挥曰：元阳子《大道歌》云：欲识丹砂是木精，移来西位与金并。盖<b>汞</b>性飞走，最难降伏。惟投入于<b>铅</b>炉之内，与<b>铅</b>相合，然后不飞不走也。", "o": "俞琰发挥曰：元陽子《大道歌》云：欲識丹砂是木精，移來西位與金并。蓋<b>汞</b>性飛走，最難降伏。惟投入於鉛爐之內，與鉛相合，然後不飛不走也。", "i": 98}, {"t": "p", "s": "丹砂木精，得金乃并，<b>金水</b>合处，木火为侣。四者混沌，列为<b>龙虎</b>，龙阳数奇，虎阴数偶。肝青为父，肺白为母，肾黑为子，离赤为女，脾黄为祖，子午为始。三物一家，都归<b>戊己</b>。", "o": "丹砂木精，得金乃并，<b>金水</b>合處，木火為侶。四者混沌，列為龍虎，龍陽數奇，虎陰數偶。肝青為父，肺白為母，腎黑為子，離赤為女，脾黃為祖，子午為始。三物一家，都歸<b>戊己</b>。", "i": 99}, {"t": "h2", "s": "卯酉刑德章第二十九", "o": "卯酉刑德章第二十九", "i": 100}, {"t": "note", "s": "俞琰发挥曰：一九之数，即戴九履一之数也。自一而九，自九而一，往来上下，周流不息。", "o": "俞琰发挥曰：一九之數，即戴九履一之數也。自一而九，自九而一，往來上下，周流不息。", "i": 101}, {"t": "p", "s": "刚柔迭兴，更历分布。龙西虎东，建纬卯酉，刑德并会，相见懽喜，刑主伏杀，德主生起。二月榆落，魁<b>临</b>于卯，八月麦生，天罡据酉。子南午北，互为纲纪。一九之数，终而<b>复</b>始。含元虚危，播精于子。", "o": "剛柔迭興，更歷分布。龍西虎東，建緯卯酉，刑德並會，相見懽喜，刑主伏殺，德主生起。二月榆落，魁臨於卯，八月麥生，天罡據酉。子南午北，互為綱紀。一九之數，終而復始。含元虛危，播精於子。", "i": 102}, {"t": "h2", "s": "君子好逑章第三十", "o": "君子好逑章第三十", "i": 103}, {"t": "p", "s": "关关雎鸠，在河之洲，窈窕淑女，君子好逑。雄不独处，雌不孤居。玄武龟蛇，蟠虬相扶，以明牝牡，意当相须。假使二女共室，颜色甚姝，苏秦通言，张仪合媒，发辩利舌，奋舒美辞，推心调谐，合为夫妻，弊发腐齿，终不相知。若<b>药物</b>非种，名类不同，分刻参差，失其纲纪，虽黄帝<b>临</b>炉，太公执火，八公捣炼，淮南调合，立宇崇坛，玉为阶陛，麟脯凤脂，把籍长跪，祷祝神祗，请哀诸鬼，沐浴斋戒，冀有所望，亦犹和胶补釜，以硇涂疮，去冷加冰，除热用汤，飞龟舞蛇，愈见乖张。", "o": "關關雎鳩，在河之洲，窈窕淑女，君子好逑。雄不獨處，雌不孤居。玄武龜蛇，蟠虯相扶，以明牝牡，意當相須。假使二女共室，顏色甚姝，蘇秦通言，張儀合媒，發辯利舌，奮舒美辭，推心調諧，合為夫妻，弊髮腐齒，終不相知。若藥物非種，名類不同，分刻參差，失其綱紀，雖黃帝臨爐，太公執火，八公擣煉，淮南調合，立宇崇壇，玉為階陛，麟脯鳳脂，把籍長跪，禱祝神祗，請哀諸鬼，沐浴齋戒，冀有所望，亦猶和膠補釜，以硇塗瘡，去冷加冰，除熱用湯，飛龜舞蛇，愈見乖張。", "i": 104}, {"t": "h2", "s": "圣贤伏炼章第三十一", "o": "聖賢伏煉章第三十一", "i": 105}, {"t": "note", "s": "俞琰发挥曰：无视无听，抱神以静，广成子之怀玄抱真也。专气致柔，能如婴兄，老子之怀玄抱真也。乃若女娲氏炼五色石以补天，冉相氏得其环中以随成，此又列御寇、漆园史之丹法也。学》者勿谓风有仙骨方可希求，要之但办肯心无不可者，圣贤何人哉？予何人哉？有为者亦若是。志道之士，诚能发勇猛心，办精进力，勤而行之，夙夜不休，则时至而气自化，水到而渠自成。又何息乎煮顽石之不烂，磨铁杵之不为针也哉？但恐学而不遇，遇而不得，虽得真诀，<b>复</b>不能守；朝为而夕欲其成，坐修而立望其效；升勺之利未坚，而钟石之费相寻；根黄之据未极，而冰霜之毒交攻，如是则虽有广成、老子为之师，列子、庄子为之友，亦末如之何也已矣。", "o": "俞琰发挥曰：無視無聽，抱神以靜，廣成子之懷玄抱真也。專氣致柔，能如嬰兄，老子之懷玄抱真也。乃若女媧氏鍊五色石以補天，冉相氏得其環中以隨成，此又列禦寇、漆園史之丹法也。學》者勿謂風有仙骨方可希求，要之但辦肯心無不可者，聖賢何人哉？予何人哉？有為者亦若是。志道之士，誠能發勇猛心，辦精進力，勤而行之，夙夜不休，則時至而氣自化，水到而渠自成。又何息乎煮頑石之不爛，磨鐵杵之不為針也哉？但恐學而不遇，遇而不得，雖得真訣，復不能守；朝為而夕欲其成，坐修而立望其效；升勺之利未堅，而鐘石之費相尋；根黃之據未極，而冰霜之毒交攻，如是則雖有廣成、老子為之師，列子、莊子為之友，亦末如之何也已矣。", "i": 106}, {"t": "p", "s": "惟昔圣贤，怀玄抱真，伏炼九鼎，化迹隐沦，含精养神，通德三光，津液腠理，筋骨致坚，众邪辟除，正气长存，积累长久，变形而仙。忧悯后生，好道之伦，随傍风采，指画古文，著为图集，开示后昆，露见枝条，隐藏本根，托号诸名，覆谬众文，学者得之，韫椟终身。子继父业，孙踵祖先，传世迷惑，竟无见闻，随使宦者不仕，农夫失耘，商人弃货，志士家贫。吾甚伤之，定录此文，字约易思，事省不繁，披列其条，核实可<b>观</b>，分两有数，因而相循，故为乱辞，孔窍其门，智者审思，用意参焉。", "o": "惟昔聖賢，懷玄抱真，伏煉九鼎，化跡隱淪，含精養神，通德三光，津液腠理，筋骨致堅，眾邪辟除，正氣長存，積累長久，變形而仙。憂憫後生，好道之倫，隨傍風采，指畫古文，著為圖集，開示後昆，露見枝條，隱藏本根，託號諸名，覆謬眾文，學者得之，韞櫝終身。子繼父業，孫踵祖先，傳世迷惑，竟無見聞，隨使宦者不仕，農夫失耘，商人棄貨，志士家貧。吾甚傷之，定錄此文，字約易思，事省不繁，披列其條，核實可觀，分兩有數，因而相循，故為亂辭，孔竅其門，智者審思，用意參焉。", "i": 107}, {"t": "h2", "s": "法象成功章第三十二", "o": "法象成功章第三十二", "i": 108}, {"t": "note", "s": "俞琰发挥曰：道之大，无可得而形容。若铃欲形容此道，则惟有天地而已矣。天地者，法象之至大者也。有玄沟焉，自尾、箕之问至柳、星之分，界断天盘，不知其几万里也。修丹者诚能法天象地，反而求之吾身，则身中自有一壶天，方知魏公之所谓玄沟，吾身亦自有之，盖不用求之于天也。何谓玄沟？天河是也。", "o": "俞琰发挥曰：道之大，無可得而形容。若鈴欲形容此道，則惟有天地而已矣。天地者，法象之至大者也。有玄溝焉，自尾、箕之問至柳、星之分，界斷天盤，不知其幾萬里也。修丹者誠能法天象地，反而求之吾身，則身中自有一壺天，方知魏公之所謂玄溝，吾身亦自有之，蓋不用求之於天也。何謂玄溝？天河是也。", "i": 109}, {"t": "note", "s": "俞琰发挥曰：河鼓，天河边之星也。其位在斗、牛之问。星纪，天盘之丑位也。河鼓<b>临</b>星纪，则驱回尾穴连空焰，赶入天衢直上奔。正当其斩关出路之时，一身之人民，岂不练然惊骇？《翠虚篇》云：曲江之上金乌飞，姐娥已与斗牛欢。即河鼓<b>临</b>星纪之谓也。又云：山河大地发猛火，于中万象生风雷。即人民皆惊骇之谓也。", "o": "俞琰发挥曰：河鼓，天河邊之星也。其位在斗、牛之問。星紀，天盤之丑位也。河鼓臨星紀，則驅回尾穴連空焰，趕入天衢直上奔。正當其斬關出路之時，一身之人民，豈不練然驚駭？《翠虛篇》云：曲江之上金烏飛，姐娥已與斗牛歡。即河鼓臨星紀之謂也。又云：山河大地發猛火，於中萬象生風雷。即人民皆驚駭之謂也。", "i": 110}, {"t": "p", "s": "法象莫大乎天地兮，玄沟数万里。河鼓<b>临</b>星纪兮，人民皆惊骇。晷影妄前却兮，九年被凶咎。皇上览视之兮，王者退自改。关键有低昂兮，害（气）遂奔走。江淮之枯竭兮，水流注于海。天地之雌雄兮，徘徊子与午。寅申阴阳祖兮，出入<b>复</b>终始。循斗而招摇兮，执衡定元纪。升熬于甑山兮，炎火张设下。白虎导唱前兮，苍液和于后。朱雀翱翔戏兮，飞扬色五彩；遭遇罗网施兮，压之不得举；嗷嗷声甚悲兮，婴儿之慕母；颠倒就汤镬兮摧折伤毛羽。漏刻未过半兮，鱼鳞狎鬣起。五色象炫耀兮，变化无常主。沸潏鼎沸驰兮，暴涌不休止。接连重叠累兮，犬牙相错距。形似仲冬冰兮，瓓玕吐钟乳。崔嵬而杂厕兮，交积相支柱。阴阳得其配兮，淡薄而相守。青龙处房六兮，春花震东卯。白虎在昂七兮，秋芒兑西酉。朱雀在张二兮，正阳杂南午。三者具来朝兮，家属为亲侣。本之但二物兮，末而为三五。三五并与一兮，都集归二所。治之如上科兮，日数亦取甫。先白而后黄兮，赤黑达表里。名曰第一鼎兮，食如大黍米。自然之所为兮，非有邪伪道。山泽（气）相蒸兮，兴云而为雨，泥竭遂成尘兮，火灭化为土。若檗染为黄兮，似蓝成绿组。皮革煮成胶兮，曲□（蘗木换米）化为酒。同类易施工兮，非种难为巧。惟斯之妙术兮，审谛不诳语。传于亿世后兮，昭然自可考。焕若星经汉兮，昺如水宗海。思之务令熟兮，反<b>复</b>视上下。千周粲彬彬兮，万遍将可睹。神明或告人兮，心灵乍自吾。探端索其绪兮，必得其门户，入道无适莫兮，常传于贤者。", "o": "法象莫大乎天地兮，玄溝數萬里。河鼓臨星紀兮，人民皆驚駭。晷影妄前卻兮，九年被凶咎。皇上覽視之兮，王者退自改。關鍵有低昂兮，害（氣）遂奔走。江淮之枯竭兮，水流注於海。天地之雌雄兮，徘徊子與午。寅申陰陽祖兮，出入復終始。循斗而招搖兮，執衡定元紀。升熬於甑山兮，炎火張設下。白虎導唱前兮，蒼液和於後。朱雀翱翔戲兮，飛揚色五彩；遭遇羅網施兮，壓之不得舉；嗷嗷聲甚悲兮，嬰兒之慕母；顛倒就湯鑊兮摧折傷毛羽。漏刻未過半兮，魚鱗狎鬣起。五色象炫耀兮，變化無常主。沸潏鼎沸馳兮，暴湧不休止。接連重疊累兮，犬牙相錯距。形似仲冬冰兮，瓓玕吐鐘乳。崔嵬而雜廁兮，交積相支柱。陰陽得其配兮，淡薄而相守。青龍處房六兮，春花震東卯。白虎在昂七兮，秋芒兌西酉。朱雀在張二兮，正陽雜南午。三者具來朝兮，家屬為親侶。本之但二物兮，末而為三五。三五并與一兮，都集歸二所。治之如上科兮，日數亦取甫。先白而後黃兮，赤黑達表裏。名曰第一鼎兮，食如大黍米。自然之所為兮，非有邪偽道。山澤（氣）相蒸兮，興雲而為雨，泥竭遂成塵兮，火滅化為土。若檗染為黃兮，似藍成綠組。皮革煮成膠兮，麴□（蘗木換米）化為酒。同類易施工兮，非種難為巧。惟斯之妙術兮，審諦不誑語。傳於億世後兮，昭然自可考。煥若星經漢兮，昺如水宗海。思之務令熟兮，反覆視上下。千周粲彬彬兮，萬遍將可睹。神明或告人兮，心靈乍自吾。探端索其緒兮，必得其門戶，入道無適莫兮，常傳於賢者。", "i": 111}, {"t": "h2", "s": "鼎器妙用章第三十三", "o": "鼎器妙用章第三十三", "i": 112}, {"t": "note", "s": "俞琰发挥曰：阴上阳下，水火既济也。《还源篇》云：娑竭海中火，昆仑山上波。谁能知运用，大意要黄婆。向微黄婆运用之功，则水日润下，火日炎上。何由既济哉？", "o": "俞琰发挥曰：陰上陽下，水火既濟也。《還源篇》云：娑竭海中火，崑崙山上波。誰能知運用，大意要黃婆。向微黃婆運用之功，則水日潤下，火日炎上。何由既濟哉？", "i": 113}, {"t": "note", "s": "俞琰发挥曰：首尾，晦朔也。中间，月望也。晦朔乃阴极阳生之时，故用武火。月望乃阳极阴生之时，故用文火。然所谓晦朔月望，亦譬喻耳。却不可只就纸上推究也。", "o": "俞琰发挥曰：首尾，晦朔也。中間，月望也。晦朔乃陰極陽生之時，故用武火。月望乃陽極陰生之時，故用文火。然所謂晦朔月望，亦譬喻耳。卻不可只就紙上推究也。", "i": 114}, {"t": "p", "s": "圆三五，寸一分，口四八，两寸唇，长尺二，厚薄均。腹齐三，坐垂温。阴在上，阳下奔。首尾武，中间文。始七十，终三旬，三百六，善调均。阴火白，<b>黄芽</b><b>铅</b>。两七聚，辅翼人。赡理脑，定玄升。子处中，得安存？来去游，不出门。渐成大，性情纯。却归一，还本原。善爱敬，如君臣。至一周，甚辛勤。密防护，莫迷昏。途路远，<b>复</b>幽玄。若达此，会<b>乾坤</b>。乃圭沾，净魄魂。得长生，居仙村。乐道者，寻其根。审五行，定铢分。谛思之，不须论。深藏守，莫传文。御白鹤，驾龙鳞，游太虚，谒仙君，录天图，号真人。", "o": "圓三五，寸一分，口四八，兩寸唇，長尺二，厚薄均。腹齊三，坐垂溫。陰在上，陽下奔。首尾武，中間文。始七十，終三旬，三百六，善調均。陰火白，黃芽鉛。兩七聚，輔翼人。贍理腦，定玄升。子處中，得安存？來去游，不出門。漸成大，性情純。卻歸一，還本原。善愛敬，如君臣。至一周，甚辛勤。密防護，莫迷昏。途路遠，復幽玄。若達此，會<b>乾坤</b>。乃圭沾，凈魄魂。得長生，居仙村。樂道者，尋其根。審五行，定銖分。諦思之，不須論。深藏守，莫傳文。御白鶴，駕龍鱗，游太虛，謁仙君，錄天圖，號真人。", "i": 115}, {"t": "h2", "s": "补塞遗脱章第三十四", "o": "補塞遺脫章第三十四", "i": 116}, {"t": "note", "s": "俞琰发挥曰：四象，即七、八、九、六也，即上文所谓七八数十五，九六亦相当是也。以七、八、九、六合之，则为三十，应一月三十日之数，皆设象比喻也。魏公恐学者不得其说，以盲引盲，妄认三十日之盈虚<b>消息</b>为一月火侯，故又别序此七、八、九、六之四象，以晓其未晓者，庶有以显夫一月三十日之数皆譬喻，而非真以月之三日进火，月之十六日退符也。有如子午卯酉、子申寅戌、春夏秋冬、分至启闭、昼夜晨昏、还返归居，皆此义也。学者若知七、八、九、六即一月三十日之数，则其余泛引曲喻，皆可默而识之矣。何铃执文泥象哉？八卦布列曜，运移不失中。中者，黄道也。八方布以八卦，周回列以二十八宿，乃日月往来之行路也。", "o": "俞琰发挥曰：四象，即七、八、九、六也，即上文所謂七八數十五，九六亦相當是也。以七、八、九、六合之，則為三十，應一月三十日之數，皆設象比喻也。魏公恐學者不得其說，以盲引盲，妄認三十日之盈虛<b>消息</b>為一月火侯，故又別序此七、八、九、六之四象，以曉其未曉者，庶有以顯夫一月三十日之數皆譬喻，而非真以月之三日進火，月之十六日退符也。有如子午卯酉、子申寅戌、春夏秋冬、分至啟閉、晝夜晨昏、還返歸居，皆此義也。學者若知七、八、九、六即一月三十日之數，則其餘泛引曲喻，皆可默而識之矣。何鈴執文泥象哉？八卦布列曜，運移不失中。中者，黃道也。八方布以八卦，周回列以二十八宿，乃日月往來之行路也。", "i": 117}, {"t": "note", "s": "俞琰发挥曰：道者，万物之本，犹木之根株也。发而为枝茎，于是有三圣之《易》。散而为华叶，于是有炉火之衍。至于结为果实，而返本还源，此黄老之所以不失其素，而修炼金液内丹，养成圣胎也。魏公以此三者互相类之道鼎立而言，岂故好为此郑重？实欲使学者洞晓阴阳，深达造化也。其言出于诚心，厥亦审而不误矣。", "o": "俞琰发挥曰：道者，萬物之本，猶木之根株也。發而為枝莖，於是有三聖之《易》。散而為華葉，於是有爐火之衍。至於結為果實，而返本還源，此黃老之所以不失其素，而修鍊金液內丹，養成聖胎也。魏公以此三者互相類之道鼎立而言，豈故好為此鄭重？實欲使學者洞曉陰陽，深達造化也。其言出於誠心，厥亦審而不誤矣。", "i": 118}, {"t": "p", "s": "参同契者，敷陈梗概，不能纯一，泛滥而说，纤微未备，阙略仿佛。今更撰录，补塞遗脱，润色幽深，钩援相逮，旨意等齐，所趋不悖，故<b>复</b>作此，命三相类，则大易之情性尽矣。", "o": "參同契者，敷陳梗概，不能純一，泛濫而說，纖微未備，闕略仿佛。今更撰錄，補塞遺脫，潤色幽深，鉤援相逮，旨意等齊，所趨不悖，故復作此，命三相類，則大易之情性盡矣。", "i": 119}, {"t": "p", "s": "乙「浮右」丁「文火」已物辛「世银」癸「真<b>铅</b>」五位相得三木二火五土四金一水甲「沉左」丙「武火」戊药庚「世金」壬「真<b>汞</b>」而各有合", "o": "乙「浮右」丁「文火」已物辛「世銀」癸「真鉛」五位相得三木二火五土四金一水甲「沉左」丙「武火」戊藥庚「世金」壬「真<b>汞</b>」而各有合", "i": 120}, {"t": "p", "s": "大易性情，各如其度。黄老用究，较而可御。炉火之事，真有所据。三道由一，俱出径路。枝茎华叶，果实垂布，正在根株，不失其素。诚心所言，审而不误。象彼仲冬节，竹木皆摧伤。佐阳诘贾旅，人君深自藏。象时顺节令，闭口不用谈。天道其浩广，太玄无形容，虚寂不可睹，匡廓以消亡。谬误失事绪，言还自败伤。别序斯四象，以晓后生盲。", "o": "大易性情，各如其度。黃老用究，較而可御。爐火之事，真有所據。三道由一，俱出徑路。枝莖華葉，果實垂布，正在根株，不失其素。誠心所言，審而不誤。象彼仲冬節，竹木皆摧傷。佐陽詰賈旅，人君深自藏。象時順節令，閉口不用談。天道其浩廣，太玄無形容，虛寂不可睹，匡廓以消亡。謬誤失事緒，言還自敗傷。別序斯四象，以曉後生盲。", "i": 121}, {"t": "h2", "s": "自叙启后章第三十五", "o": "自敘啟後章第三十五", "i": 122}, {"t": "p", "s": "会稽鄙夫，幽谷朽生，挟怀朴素，不乐权荣，栖迟僻陋，忽略利名，执守恬淡，希时安宁，晏然闲居，乃撰斯文。歌叙大易，三圣遗言，察其旨趣，一统共论。勿在顺理，宣耀精神。神化流通，四海和平。表以为历，万世可循。序以御政，行之不繁，引内养性，黄老自然，含德之厚，归根返元。近在我心，不离己身，抱一毋舍，可以长存。配以伏食，雄雌设陈。挺除武都，八石弃捐。审用成物，世俗所珍。罗列三条，枝茎相连。同出异名，皆由一门。非徒累句，谐偶斯文，殆有其真，砾硌可<b>观</b>。使予敷伪，却被赘愆。命参同契，微览其端，辞寡意大，后嗣宜尊。委时去害，依托丘山。循游寥廓，与鬼为邻。化形而仙，沦寂无声。百世而下，遨游人间。敷陈羽翮，东西南倾。汤遭厄际，水旱隔并。柯叶萎黄，失其华荣。吉人相乘负，安稳可长生。", "o": "會稽鄙夫，幽谷朽生，挾懷朴素，不樂權榮，棲遲僻陋，忽略利名，執守恬淡，希時安寧，晏然閑居，乃撰斯文。歌敘大易，三聖遺言，察其旨趣，一統共論。勿在順理，宣耀精神。神化流通，四海和平。表以為歷，萬世可循。序以御政，行之不繁，引內養性，黃老自然，含德之厚，歸根返元。近在我心，不離己身，抱一毋舍，可以長存。配以伏食，雄雌設陳。挺除武都，八石棄捐。審用成物，世俗所珍。羅列三條，枝莖相連。同出異名，皆由一門。非徒累句，諧偶斯文，殆有其真，礫硌可觀。使予敷偽，卻被贅愆。命參同契，微覽其端，辭寡意大，後嗣宜尊。委時去害，依托丘山。循遊寥廓，與鬼為鄰。化形而仙，淪寂無聲。百世而下，遨游人間。敷陳羽翮，東西南傾。湯遭厄際，水旱隔並。柯葉萎黃，失其華榮。吉人相乘負，安穩可長生。", "i": 123}, {"t": "p", "s": "文中（气）均为上无下火", "o": "文中（氣）均為上無下火", "i": 124}];

       + '<div class="legend">阅读说明：<span class="key-s">金底深红</span>=全书总诀；<mark>橙底</mark>=关键句；<b>深棕加粗</b>=核心术语；右侧<b style="color:#8a6a3f">灰底竖线块</b>为历代注解。顶栏可<b>隐藏注解</b>、切换繁简。〈注〉八卦等专名（乾/坤/坎/离/巽/兑…）在简体版中均按规范保留原字形。<details><summary>📋 查看本经高亮词库（31 条）</summary><div class="phrases">乾坤者，易之门户，众卦之父母，坎离匡廓，运毂正轴，坎戊月精，离己日光，日月为易，刚柔相当，知白守黑，神明自来，金入于猛火，色不夺精光，金复其故性，威光鼎乃熺，耳目口三宝，闭门无发通，上弦兑数八，下弦艮亦八，二八应一斤，易道正不倾，朔旦为复，阳气始通，以无制有，器用者空，覆冒阴阳之道，处中以制外，数在律历纪，朔旦屯直事，晦至朔旦，震来受符，天地媾其精，日月相撢持，皆秉中宫，戊己之功，内以养己，安静虚无，原本隐明，内照形躯，闭塞其兑，筑固灵株，白者金精，黑者水基，水者道枢，其数名一，子午数合三，戊己号称五，三五既和谐，八石正纲纪，真人潜深渊，浮游守规中，终坤复始，如复连环，帝王承御，千载常存，黄芽为根，金砂入五内，雾散若风雨</div></details></div>'
       + '<div class="toc"><h3>章节目录</h3>' + toc + '</div>' + html;
  root.innerHTML = html;
}
