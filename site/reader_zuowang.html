var SEGS = [{"t": "h1", "s": "坐忘论", "o": "坐忘论", "i": 0}, {"t": "q", "s": "唐·司马承祯（天台白云子）撰，上清派修心要典。七篇：敬信、断缘、收心、简事、真观、泰定、得道，附《坐忘枢翼》。历代有赵坚《坐忘论注》等注本，天台宗湛然、司马承祯同门亦多称述。", "o": "唐·司马承祯（天台白云子）撰，上清派修心要典。七篇：敬信、断缘、收心、简事、真观、泰定、得道，附《坐忘枢翼》。历代有赵坚《坐忘论注》等注本，天台宗湛然、司马承祯同门亦多称述。", "i": 1}, {"t": "q", "s": "文本来源：中国哲学书电子化计划（ctext.org）《坐忘论》。", "o": "文本来源：中国哲学书电子化计划（ctext.org）《坐忘论》。", "i": 2}, {"t": "p", "s": "司马承祯子微撰", "o": "司馬承禎子微撰", "i": 3}, {"t": "p", "s": "夫人之所贵者生，生之所贵者道。人之有道，若鱼之有水。涸辙之鱼犹希斗水。弱丧之俗无情造道，恶生死之苦，乐生死之业，重<b>道德</b>之名，轻<b>道德</b>之行。审惟倒置，何甚如之。穷而思通，迷而思复，寸阴如璧，愧叹交深，是以恭寻经旨而与心法相应者，略成七条，以为修道阶次。<b>枢翼</b>附焉。", "o": "夫人之所貴者生，生之所貴者道。人之有道，若魚之有水。涸轍之魚猶希斗水。弱喪之俗無情造道，惡生死之苦，樂生死之業，重<b>道德</b>之名，輕<b>道德</b>之行。審惟倒置，何甚如之。窮而思通，迷而思復，寸陰如璧，愧歎交深，是以恭尋經旨而與心法相應者，略成七條，以為修道階次。<b>樞翼</b>附焉。", "i": 4}, {"t": "h2", "s": "敬信第一", "o": "敬信第一", "i": 5}, {"t": "p", "s": "夫信者道之根，敬者德之蒂，根深则道可长，蒂固则德可茂。然则璧耀连城之彩，卞和致刖。言开保国之效，伍子从诛。斯乃形器著而心绪迷，理事萌而情思忽。况<b>至道</b>超于色味，真性隔于可欲，而能闻希微以悬信，听罔象而不惑者哉。如人闻<b>坐忘</b>之言，信是修道之要，<mark>敬仰尊重，决定无疑</mark>者，加之勤行，<b>得道</b>必矣。故《庄》云：坟支体，黜聪明，离形去智，<span class=\"key\">同于大通</span>，是谓<b>坐忘</b>。夫<b>坐忘</b>者，何所不忘哉。<span class=\"key\">内不觉其一身，外不知乎宇宙</span>，<span class=\"key\">与道冥一，万虑皆遗</span>。《庄》云<span class=\"key\">同于大通</span>，此则言浅而意深。惑者闻而不信，怀宝求宝，其如之何。经云：信不足焉，有不信。谓信道之心不足，乃有不信之祸及之，何道之可望乎。", "o": "夫信者道之根，敬者德之蒂，根深則道可長，蒂固則德可茂。然則璧耀連城之彩，卞和致刖。言開保國之效，伍子從誅。斯乃形器著而心緒迷，理事萌而情思忽。況<b>至道</b>超於色味，真性隔於可欲，而能聞希微以懸信，聽罔象而不惑者哉。如人聞<b>坐忘</b>之言，信是修道之要，<mark>敬仰尊重，決定無疑</mark>者，加之勤行，<b>得道</b>必矣。故《莊》云：墳支體，黜聰明，離形去智，<span class=\"key\">同於大通</span>，是謂<b>坐忘</b>。夫<b>坐忘</b>者，何所不忘哉。<span class=\"key\">內不覺其一身，外不知乎宇宙</span>，<span class=\"key\">與道冥一，萬慮皆遺</span>。《莊》云<span class=\"key\">同於大通</span>，此則言淺而意深。惑者聞而不信，懷寶求寶，其如之何。經云：信不足焉，有不信。謂信道之心不足，乃有不信之禍及之，何道之可望乎。", "i": 6}, {"t": "p", "s": "断绿者，断有为俗事之缘也。弃事则形不劳，<b>无为</b>则心自安，恬简日就，尘累日薄，边弥远俗，心弥近道，至圣至神，孰不由此乎。经云：塞其兑，闭其门，终身不勤。或显德露能，求人保己，或遗问庆吊，以事往还，或假隐逸，情希升进，或酒食邀致，以望后恩。斯乃巧蕴机心，以干时利，既非顺道，深妨正业。凡此类例，皆应绝之。经云：开其兑，济其事，终身不救。我但不唱，彼自不和，彼虽有唱，我不和之。旧绿渐断，新绿莫结，体交势合，自致日疏，无事安闲，方可修道。《庄》云：不将不迎，<b>无为</b>交俗之情。又云：<b>无为</b>谋府，<b>无为</b>事任，<b>无为</b>知主。若事有不可废者，不得已而行之，勿遂生爱，击心为业。", "o": "斷綠者，斷有為俗事之緣也。棄事則形不勞，無為則心自安，恬簡日就，塵累日薄，邊彌遠俗，心彌近道，至聖至神，孰不由此乎。經云：塞其兌，閉其門，終身不勤。或顯德露能，求人保己，或遺問慶弔，以事往還，或假隱逸，情希升進，或酒食邀致，以望後恩。斯乃巧蘊機心，以干時利，既非順道，深妨正業。凡此類例，皆應絕之。經云：開其兌，濟其事，終身不救。我但不唱，彼自不和，彼雖有唱，我不和之。舊綠漸斷，新綠莫結，體交勢合，自致日疏，無事安閑，方可修道。《莊》云：不將不迎，無為交俗之情。又云：無為謀府，無為事任，無為知主。若事有不可廢者，不得已而行之，勿遂生愛，擊心為業。", "i": 7}, {"t": "p", "s": "夫心者一身之主，百神之帅，静则生慧，动则成昏。欣迷幻境之中，唯言实是，甘宴有为之内，谁悟虚非，心识颠痴，良由所托之地。且卜邻而居，犹从改操，择交而友，尚能致益，配身离生死之境，心居<b>至道</b>之中，能不舍彼乎，安不得此乎。所以学道之初，要须安坐，<span class=\"key\">收心离境，住无所有</span>。因住无所有，不著一物，自入虚无，心乃合道。经云：<b>至道</b>之中，寂无所有，神用无方，心体亦然。原其心体，以道为本，但为心神被染，蒙蔽渐深，流浪日久，遂与道隔。若争除心垢，开识神本，名曰修道。无复流浪，与道冥合，安在道中，名曰归根。守根不离，名曰静定。静定日久，病消命复，复而又续，自得知常。知则无所不明，常则无所变灭，出离生死，实由于此。是故法道<b>安心</b>，贵无所著。经云：夫物芸芸，各归其根，归根白静，静曰复命，复命日常，知常曰明。若执心住空，还是有所，非谓无所，凡住有所，则令心劳，既不合理，又反成病。但心不著物，又得不动，此是真定。正基用此为定，心气调和，久益轻爽，以此为验，则邪正可知矣。若心起皆灭，不简是非，则永断觉知，入于盲定。若任心所起，一无收制，则与凡夫元来不别。若唯断善恶，心无指归，肆意浮游』待自定者，徒自误尔。若褊行诸事，言心无所染者，于言甚善，于行极非，真学之流，特宜诚此。今则息乱而不灭照，守静而不著空，行之有常，自得真见。如有时事或法要有疑者，且任思量，令事得济，所疑复悟，此亦生慧正根。悟已则止，必莫有思，思则以智害恬，为子伤本。虽骋一时之俊，终亏万代之业。若烦邪乱想，随觉则除，若闻毁誉之名，善恶等事，皆即拨去，莫将心受。受之则心满，心满则道无所居。所有闻见，如不闻见，即是非善恶不入于心。心不受外名曰<b>虚心</b>，心不逐外名曰<b>安心</b>，心安而虚，道自来居。经云：人能<b>虚心</b><b>无为</b>，非欲于道，道自归之。内心既无所著，外行亦无所为，非争非秽，故毁誉无从生，非智非愚，故利害无由挠。实则顺中为常，权则与时消息，苟免诸累，是其智也。若非时非事，役思强为者，自云不著，终非真学。何耶？心法如眼也，纤毫入眼，跟则不安，小事关心，心必动乱，既有动病，难入定门。是故修道之要，急在除病，病若不除，终难得定。有如良田，刑棘未诛，虽下种子，嘉苗不茂。爱见思虑，是心刑棘，若不除蓊，定慧不生。或身居富贵，或学备经史，言则慈俭，行则贪残，辩足以饰非，势足以威物，得则名己，过则尤人，此病最深，虽学无益。所以然者，为自是故。然此心犹来依境，未惯独立，乍无所托，难以自安，纵得暂安，还复散乱。随起随制，务令不动，久久调熟，自得安闲。无问昼夜二，行住坐外，及应事之时，常须作意安之。若心得定，即须安养，莫有恼触，少得定分，即堪自乐，渐渐驯狎，惟益清远。平生所爱，已嫌蔽陋，况因定生慧，深达真假乎。且牛马家畜也，放纵不收，犹自生梗，不受驾驭。鹰鹤野乌也，为人羁绊，终日在手，自然调熟。况心之放逸，纵任不收，唯益厅疏，何能观妙。经云：虽有拱璧，以先驷马，不如坐进此道。夫法之妙用也，其在能行，不在能言，行之则斯言为当，不行则斯言如妄。又时人所学，贵难而贱易，若论法要，广说虚无，思虑所莫能达，行用所莫能阶者，则叹不可思议。而下风尽礼，如其信言不美，指事直说，闻则心解，言则可行者，此实不可思议，而人翻以为浅近，而轻忽不信。经云：吾言甚易知，甚易行，天下莫能知，莫能行。夫惟无知，是以不我知。又有言火不热，灯不照间，称为妙义。夫火以热为用，灯以照间为功。今则盛谈火不热，未尝一时废火，灯不照间，必须终夜然灯。言行相违，理实无取，此即破相之言，而人反以为深玄之妙。虽惠子宏辩，庄生以为不堪。肤受之流，谁能断简，至学之士，庶不留心。", "o": "夫心者一身之主，百神之帥，靜則生慧，動則成昏。欣迷幻境之中，唯言實是，甘宴有為之內，誰悟虛非，心識顛癡，良由所託之地。且卜鄰而居，猶從改操，擇交而友，尚能致益，配身離生死之境，心居<b>至道</b>之中，能不捨彼乎，安不得此乎。所以學道之初，要須安坐，<span class=\"key\">收心離境，住無所有</span>。因住無所有，不著一物，自入虛無，心乃合道。經云：<b>至道</b>之中，寂無所有，神用無方，心體亦然。原其心體，以道為本，但為心神被染，蒙蔽漸深，流浪日久，遂與道隔。若爭除心垢，開識神本，名曰修道。無復流浪，與道冥合，安在道中，名曰歸根。守根不離，名曰靜定。靜定日久，病消命復，復而又續，自得知常。知則無所不明，常則無所變滅，出離生死，實由於此。是故法道<b>安心</b>，貴無所著。經云：夫物芸芸，各歸其根，歸根白靜，靜曰復命，復命日常，知常曰明。若執心住空，還是有所，非謂無所，凡住有所，則令心勞，既不合理，又反成病。但心不著物，又得不動，此是真定。正基用此為定，心氣調和，久益輕爽，以此為驗，則邪正可知矣。若心起皆滅，不簡是非，則永斷覺知，入於盲定。若任心所起，一無收制，則與凡夫元來不別。若唯斷善惡，心無指歸，肆意浮游』待自定者，徒自誤爾。若褊行諸事，言心無所染者，於言甚善，於行極非，真學之流，特宜誠此。今則息亂而不滅照，守靜而不著空，行之有常，自得真見。如有時事或法要有疑者，且任思量，令事得濟，所疑復悟，此亦生慧正根。悟已則止，必莫有思，思則以智害恬，為子傷本。雖騁一時之俊，終虧萬代之業。若煩邪亂想，隨覺則除，若聞毀譽之名，善惡等事，皆即撥去，莫將心受。受之則心滿，心滿則道無所居。所有聞見，如不聞見，即是非善惡不入於心。心不受外名曰<b>虛心</b>，心不逐外名曰<b>安心</b>，心安而虛，道自來居。經云：人能<b>虛心</b>無為，非欲於道，道自歸之。內心既無所著，外行亦無所為，非爭非穢，故毀譽無從生，非智非愚，故利害無由撓。實則順中為常，權則與時消息，苟免諸累，是其智也。若非時非事，役思強為者，自云不著，終非真學。何耶？心法如眼也，纖毫入眼，跟則不安，小事關心，心必動亂，既有動病，難入定門。是故修道之要，急在除病，病若不除，終難得定。有如良田，刑棘未誅，雖下種子，嘉苗不茂。愛見思慮，是心刑棘，若不除蓊，定慧不生。或身居富貴，或學備經史，言則慈儉，行則貪殘，辯足以飾非，勢足以威物，得則名己，過則尤人，此病最深，雖學無益。所以然者，為自是故。然此心猶來依境，未慣獨立，乍無所託，難以自安，縱得暫安，還復散亂。隨起隨制，務令不動，久久調熟，自得安閑。無問晝夜二，行住坐外，及應事之時，常須作意安之。若心得定，即須安養，莫有惱觸，少得定分，即堪自樂，漸漸馴狎，惟益清遠。平生所愛，已嫌蔽陋，況因定生慧，深達真假乎。且牛馬家畜也，放縱不收，猶自生梗，不受駕馭。鷹鶴野烏也，為人羈絆，終日在手，自然調熟。況心之放逸，縱任不收，唯益廳疏，何能觀妙。經云：雖有拱璧，以先駟馬，不如坐進此道。夫法之妙用也，其在能行，不在能言，行之則斯言為當，不行則斯言如妄。又時人所學，貴難而賤易，若論法要，廣說虛無，思慮所莫能達，行用所莫能階者，則歎不可思議。而下風盡禮，如其信言不美，指事直說，聞則心解，言則可行者，此實不可思議，而人翻以為淺近，而輕忽不信。經云：吾言甚易知，甚易行，天下莫能知，莫能行。夫惟無知，是以不我知。又有言火不熱，燈不照間，稱為妙義。夫火以熱為用，燈以照間為功。今則盛談火不熱，未嘗一時廢火，燈不照間，必須終夜然燈。言行相違，理實無取，此即破相之言，而人反以為深玄之妙。雖惠子宏辯，莊生以為不堪。膚受之流，誰能斷簡，至學之士，庶不留心。", "i": 8}, {"t": "p", "s": "或曰：夫为大道者，在物而心不染，处动而神不乱，无事而不为，无时而不寂。今独避事而取安，离动而求定，劳于控制，乃有动静二心，滞于住守，是成取舍两病。都未觉其外执，而谓道之阶要，何其谬邪。答日：总物而称大，通物之谓道，在物而不染，处事而不乱，真为大矣，实为妙矣。然谓吾子之鉴有所未明，何耶？徒见贝锦之辉焕，未晓始抽之素丝，才闻呜鹤之冲天，诅识先资于谷食。蔽日之干，起于毫末。神凝至圣，积习而成今。徒学语其圣德，而不知圣之所以德，可谓见卯而求时夜，见弹而求鹊炙。何其造次哉。故经云：玄德深矣，远矣，与物反矣。然后乃至大顺。", "o": "或曰：夫為大道者，在物而心不染，處動而神不亂，無事而不為，無時而不寂。今獨避事而取安，離動而求定，勞於控制，乃有動靜二心，滯於住守，是成取捨兩病。都未覺其外執，而謂道之階要，何其謬邪。答日：總物而稱大，通物之謂道，在物而不染，處事而不亂，真為大矣，實為妙矣。然謂吾子之鑒有所未明，何耶？徒見貝錦之輝煥，未曉始抽之素絲，纔聞嗚鶴之沖天，詛識先資於穀食。蔽日之幹，起於毫末。神凝至聖，積習而成今。徒學語其聖德，而不知聖之所以德，可謂見卯而求時夜，見彈而求鵲炙。何其造次哉。故經云：玄德深矣，遠矣，與物反矣。然後乃至大順。", "i": 9}, {"t": "p", "s": "夫人之生也，必尝于事物，事物称万，不独委于一人。巢林一枝，乌见遗于丛泊。饮河满腹，兽不悟于洪波。外求诸物，内明诸己，知生之有分，不务分之所无，识事之有当，不任事之非当。任非当则伤于智，力务过分则弊于形神。身且不安，何能及道。是以修道之人，莫若断<b>简事</b>物，知其闲要，较量轻重，识其去取，非要非重，皆应绝之。犹人食有酒肉，衣有罗绮，身有名位，财有金玉，此并情欲之余好，非益生之良药。众皆徇之，自致亡败。静而思之，何迷之甚。《庄》云：达生之情者，不务生之所无以为。生之所无以为者，分外物也。蔬食弊衣，足养性命，岂待酒肉罗绮，然后生全哉？是故于生无所要用者，并须去之。于生之用有余者，亦须舍之。财有害气，积则伤人，虽少犹累，而况多乎？以隋珠而弹千仞之雀，人犹笑之，况背<b>道德</b>，忽性命，而从非要，以自促伐者乎？夫以名位比<b>道德</b>，则名位假而贱，<b>道德</b>真而贵。能知贵贱，应须去取，不以名害身，不以位易志。《庄》云：行名失己，非士也。《西升经》云：抱元守一，过度神仙，子未能守，但坐荣官。若不简择，触事皆为，心劳智昏，修道事阙。若处事安闲，在物无累者，自属证成之人。若实未成，而言无累者，诚自诳耳。", "o": "夫人之生也，必嘗於事物，事物稱萬，不獨委於一人。巢林一枝，烏見遺於叢泊。飲河滿腹，獸不悟於洪波。外求諸物，內明諸己，知生之有分，不務分之所無，識事之有當，不任事之非當。任非當則傷於智，力務過分則弊於形神。身且不安，何能及道。是以修道之人，莫若斷<b>簡事</b>物，知其閑要，較量輕重，識其去取，非要非重，皆應絕之。猶人食有酒肉，衣有羅綺，身有名位，財有金玉，此並情欲之餘好，非益生之良藥。眾皆徇之，自致亡敗。靜而思之，何迷之甚。《莊》云：達生之情者，不務生之所無以為。生之所無以為者，分外物也。蔬食弊衣，足養性命，豈待酒肉羅綺，然後生全哉？是故於生無所要用者，並須去之。於生之用有餘者，亦須捨之。財有害氣，積則傷人，雖少猶累，而況多乎？以隋珠而彈千仞之雀，人猶笑之，況背<b>道德</b>，忽性命，而從非要，以自促伐者乎？夫以名位比<b>道德</b>，則名位假而賤，<b>道德</b>真而貴。能知貴賤，應須去取，不以名害身，不以位易志。《莊》云：行名失己，非士也。《西昇經》云：抱元守一，過度神仙，子未能守，但坐榮官。若不簡擇，觸事皆為，心勞智昏，修道事闕。若處事安閑，在物無累者，自屬證成之人。若實未成，而言無累者，誠自誑耳。", "i": 10}, {"t": "h2", "s": "真观第五", "o": "真观第五", "i": 11}, {"t": "p", "s": "夫<span class=\"key\">真观者，智士之先鉴</span>，能人之善察，究傥来之祸福，详动静之吉凶，得见机前，因之造适，深祈卫足，窃务全生，自始至末，行无遗累，理不违此者，谓之<b>真观</b>。然一餐一寝，俱为损益之源，一行一言，堪成祸福之本。虽作巧持其末，不如拙诚其本。观本知末，又非躁竞之情。是故<b>收心</b><b>简事</b>，日损有为，体静心闲，方可观妙。经云：常无欲，以观其妙。然修道之身，必资衣食，事有不可废，物有不可弃者，当须虚襟而受之，明目而当之，勿以为妨，心生烦躁。若因事烦躁者，心病已动，何名<b>安心</b>？夫人事衣食者，我之船舫也。欲渡于海，事资船舫，渡海若讫，理自不留。因何未渡，先欲废舍？衣食虚幻，实不足营，为出离虚幻，故求衣食，虽有营求之事，莫生得失之心，即有事无事，心常安泰。与物同求而不同贪，与物同得而不同积，不贪故无忧，不积故无失，边每同人，心常异俗。此实行之宗要，可力为之。前虽断简，病有难除者，但依法观之。若色病重者，当观染色都由想尔，想若不生，终无色事。当知色想外空，色心内妄，妄想心空，谁为色主？经云：色者想尔，想悉是空，何有色也？又思妖妍美色，甚于狐魅，狐魅媚人，令人厌患，虽身致死，不入恶道，为厌患故，永离邪姪。妖艳惑人，令人爱著，乃致身死，留恋弥深，为邪念故，死堕诸趣，生地狱中。故经云：今代发心为夫妻，死后不得俱生人道。所以者何？为邪念故。又观色若定是美，何故鱼见深入，乌见高飞，仙人观之为秽浊，贤人喻之为刀斧？一生之命，七日不食，便至于死，百年无色，翻免夭伤。故知色者非身心之要，适为性命之仇贼，何须系著，自取消毁。若见他人为恶，心生嫌恶者，犹如见人自杀，己身引颈，乘取他刀以自害命。他自为恶不遣，我当何故引取他恶，以为己病。又见为恶者若可嫌，见为善者亦须恶。何以然耶？同障道故。若贫者亦审观之，谁与我贫？天地平等，覆载无私，我今贫苦，非天地也。父母生子，欲令富贵，我今贫贱，非父母也。人及鬼神，自救无暇，何能有力将贫与我？进退寻察，无所从来，乃知我业也，乃知天命也。业由我造，命由天赋，业之与命，犹影响之逐形声。既不可逃，又不可怨，唯有智者善而达之，乐天知命，故不忧，何贫之可苦也。《庄》云：业入而不可舍，为自业故，贫病来入，不可舍止。经云：天地不能改其操，阴阳不能回其业。由此言之，故真命也，非假物耳，有何怨焉？又如勇士逢贼，无所畏惧，挥剑当前，草寇皆溃，功勋一立，荣禄终身。今有贫病恼乱我身，则寇贼也，我有止心，则勇士也，用智观察，则挥剑也，恼累消除，则战胜也，湛然常乐，则荣禄也。凡有苦事来迫，我心不以此观而生忧累，则如人逢贼不立功勋，弃甲背军，逃亡获罪，去乐就苦，何可悯焉？若病苦者，当观此病由有我身，若无我身，患无所托。经云：及吾无身，吾有何患。次观于心，亦无真宰，内外求觅，无能受者，所有计念，从妄心生。然枯形灰心，则万病俱泯。若恶死者，应思我身是神之舍，身今老病，气力衰微，如屋朽坏，不堪居止，自须舍离，别处求安。身死神逝，亦复如是。若恋生恶死，拒违变化，则神识错乱，失其正业。以此托生，受气之际，不感清秀，多逢浊辱。盖下愚贪鄙，实此之由。若当生不悦，顺死不恶者，一为生死理齐，二为后身成业。若贪爱万境，一爱一病。一肢有病，犹令举体不安；况一心万病，身欲长生，岂可得乎？凡有爱恶，皆是妄生，积妄不除，以妨见道。是故须舍诸欲，住无所有，徐清有本，然后返观旧所爱处，自生厌薄。若以合境之心观境，终身不觉有恶。如将离境之心观境，方能了见是非。譬如醒人能观醉者为恶，如其自醉不觉其非。经云：吾本弃俗，压离世问。又云：耳目声色，为子留愆，鼻口所喜，香味是怨。老君厌世弃俗，独见香味是怨，嗜欲之流，焉知鲍肆为臭哉。", "o": "夫<b>真觀</b>者，智士之先鑒，能人之善察，究儻來之禍福，詳動靜之吉凶，得見機前，因之造適，深祈衛足，竊務全生，自始至末，行無遺累，理不違此者，謂之<b>真觀</b>。然一餐一寢，俱為損益之源，一行一言，堪成禍福之本。雖作巧持其末，不如拙誠其本。觀本知末，又非躁競之情。是故<b>收心</b><b>簡事</b>，日損有為，體靜心閑，方可觀妙。經云：常無欲，以觀其妙。然修道之身，必資衣食，事有不可廢，物有不可棄者，當須虛襟而受之，明目而當之，勿以為妨，心生煩躁。若因事煩躁者，心病已動，何名<b>安心</b>？夫人事衣食者，我之船舫也。欲渡於海，事資船舫，渡海若訖，理自不留。因何未渡，先欲廢捨？衣食虛幻，實不足營，為出離虛幻，故求衣食，雖有營求之事，莫生得失之心，即有事無事，心常安泰。與物同求而不同貪，與物同得而不同積，不貪故無憂，不積故無失，邊每同人，心常異俗。此實行之宗要，可力為之。前雖斷簡，病有難除者，但依法觀之。若色病重者，當觀染色都由想爾，想若不生，終無色事。當知色想外空，色心內妄，妄想心空，誰為色主？經云：色者想爾，想悉是空，何有色也？又思妖妍美色，甚於狐魅，狐魅媚人，令人厭患，雖身致死，不入惡道，為厭患故，永離邪姪。妖艷惑人，令人愛著，乃致身死，留戀彌深，為邪念故，死墮諸趣，生地獄中。故經云：今代發心為夫妻，死後不得俱生人道。所以者何？為邪念故。又觀色若定是美，何故魚見深入，烏見高飛，仙人觀之為穢濁，賢人喻之為刀斧？一生之命，七日不食，便至於死，百年無色，翻免夭傷。故知色者非身心之要，適為性命之仇賊，何須繫著，自取消毀。若見他人為惡，心生嫌惡者，猶如見人自殺，己身引頸，乘取他刀以自害命。他自為惡不遣，我當何故引取他惡，以為己病。又見為惡者若可嫌，見為善者亦須惡。何以然耶？同障道故。若貧者亦審觀之，誰與我貧？天地平等，覆載無私，我今貧苦，非天地也。父母生子，欲令富貴，我今貧賤，非父母也。人及鬼神，自救無暇，何能有力將貧與我？進退尋察，無所從來，乃知我業也，乃知天命也。業由我造，命由天賦，業之與命，猶影響之逐形聲。既不可逃，又不可怨，唯有智者善而達之，樂天知命，故不憂，何貧之可苦也。《莊》云：業入而不可舍，為自業故，貧病來入，不可舍止。經云：天地不能改其操，陰陽不能迴其業。由此言之，故真命也，非假物耳，有何怨焉？又如勇士逢賊，無所畏懼，揮劍當前，草寇皆潰，功勳一立，榮祿終身。今有貧病惱亂我身，則寇賊也，我有止心，則勇士也，用智觀察，則揮劍也，惱累消除，則戰勝也，湛然常樂，則榮祿也。凡有苦事來迫，我心不以此觀而生憂累，則如人逢賊不立功勳，棄甲背軍，逃亡獲罪，去樂就苦，何可憫焉？若病苦者，當觀此病由有我身，若無我身，患無所託。經云：及吾無身，吾有何患。次觀於心，亦無真宰，內外求覓，無能受者，所有計念，從妄心生。然枯形灰心，則萬病俱泯。若惡死者，應思我身是神之舍，身今老病，氣力衰微，如屋朽壞，不堪居止，自須捨離，別處求安。身死神逝，亦復如是。若戀生惡死，拒違變化，則神識錯亂，失其正業。以此託生，受氣之際，不感清秀，多逢濁辱。蓋下愚貪鄙，實此之由。若當生不悅，順死不惡者，一為生死理齊，二為後身成業。若貪愛萬境，一愛一病。一肢有病，猶令舉體不安；況一心萬病，身欲長生，豈可得乎？凡有愛惡，皆是妄生，積妄不除，以妨見道。是故須捨諸欲，住無所有，徐清有本，然後返觀舊所愛處，自生厭薄。若以合境之心觀境，終身不覺有惡。如將離境之心觀境，方能了見是非。譬如醒人能觀醉者為惡，如其自醉不覺其非。經云：吾本棄俗，壓離世問。又云：耳目聲色，為子留愆，鼻口所喜，香味是怨。老君厭世棄俗，獨見香味是怨，嗜慾之流，焉知鮑肆為臭哉。", "i": 12}, {"t": "h2", "s": "泰定第六", "o": "泰定第六", "i": 13}, {"t": "p", "s": "夫定者，出俗之极地，致道之初基，习静之成功，持安之毕事。<mark>形如槁木，心若死灰</mark>，无感无求，寂泊之至，无心于定，而无所不定，故日<b>泰定</b>。《庄》云：宇<b>泰定</b>者，发乎天光。宇则心也，天光则发慧也。心为道之器宇，虚静至极则，道居而慧生，慧出本性，非适今有，故日天光。但以贪爱浊乱，遂至昏迷。澡雪柔挺，复归纯静，本真神识，稍稍自明，非谓今时别生他慧。慧既生已，宝而怀之，勿以多知而伤于定。非生慧难，慧而不用难。自古忘形者众，忘名者寡。慧而不用，是忘名也，天下希及之，故为难。贵能不骄，富能不奢，为无俗过，故得长守富贵。定而不动，慧而不用，为无道过，故得深证真常。《庄》云：知道易，而弗言难。知而不言，所以之天；知而言之，所以之人。古之人天，而不人慧，能知道，非<b>得道</b>也。人知得慧之利，未知<b>得道</b>之益。因慧以明至理，纵辩以感物情，兴心徇事，触类而长，自云处动而常寂，焉知寂者寂以待物乎。此语俱非<b>泰定</b>也。智虽出众，弥不近道。本期逐鹿，获兔而归。所得太微，良由局小。《庄》云：古之治道者，以恬养智。智生而无以智为也，谓之以智养恬。智与恬交相养，而和理出其性。恬智则定慧也，和理则<b>道德</b>也。有智不用而安其恬，积而久之自成<b>道德</b>。然论此定，因为而得成，或因观利而见害，惧祸而息心，捐舍涤除，积习心熟，同归于定，咸若自然。疾雷破山而不惊，白刃交前而不惧，视名利如过隙，知生死如溃瘫，故知用志不分，乃凝于神。心之虚妙，不可思也。夫心之为物也，即体非有，随用非无，不驰而速，不召而至，怒则玄石饮羽，怨则朱夏陨霜，纵恶则九幽匪遥，积善则三清何远，忽来忽往，动寂不能名，时可时否，耆龟莫能测，其为调御，岂鹿马比其难乎。太上老君运常善以度人，升灵台而演妙，略三乘之因果，广万有之自然，渐之以日损有为，顿之以证归无学，喻则张弓凿矢，法则挫锐解纷，修之有常，习以成性，黜聪填体，嗜然<b>坐忘</b>，不动于寂，几微入照。履殊方者，了义无日，游斯道者，观妙可期，力少功多，要矣妙矣。", "o": "夫定者，出俗之極地，致道之初基，習靜之成功，持安之畢事。<mark>形如槁木，心若死灰</mark>，無感無求，寂泊之至，無心於定，而無所不定，故日<b>泰定</b>。《莊》云：宇<b>泰定</b>者，發乎天光。宇則心也，天光則發慧也。心為道之器宇，虛靜至極則，道居而慧生，慧出本性，非適今有，故日天光。但以貪愛濁亂，遂至昏迷。澡雪柔挺，復歸純靜，本真神識，稍稍自明，非謂今時別生他慧。慧既生已，寶而懷之，勿以多知而傷於定。非生慧難，慧而不用難。自古忘形者眾，忘名者寡。慧而不用，是忘名也，天下希及之，故為難。貴能不驕，富能不奢，為無俗過，故得長守富貴。定而不動，慧而不用，為無道過，故得深證真常。《莊》云：知道易，而弗言難。知而不言，所以之天；知而言之，所以之人。古之人天，而不人慧，能知道，非<b>得道</b>也。人知得慧之利，未知<b>得道</b>之益。因慧以明至理，縱辯以感物情，興心徇事，觸類而長，自云處動而常寂，焉知寂者寂以待物乎。此語俱非<b>泰定</b>也。智雖出眾，彌不近道。本期逐鹿，獲兔而歸。所得太微，良由局小。《莊》云：古之治道者，以恬養智。智生而無以智為也，謂之以智養恬。智與恬交相養，而和理出其性。恬智則定慧也，和理則<b>道德</b>也。有智不用而安其恬，積而久之自成<b>道德</b>。然論此定，因為而得成，或因觀利而見害，懼禍而息心，捐捨滌除，積習心熟，同歸於定，咸若自然。疾雷破山而不驚，白刃交前而不懼，視名利如過隙，知生死如潰癱，故知用志不分，乃凝於神。心之虛妙，不可思也。夫心之為物也，即體非有，隨用非無，不馳而速，不召而至，怒則玄石飲羽，怨則朱夏隕霜，縱惡則九幽匪遙，積善則三清何遠，忽來忽往，動寂不能名，時可時否，耆龜莫能測，其為調御，豈鹿馬比其難乎。太上老君運常善以度人，昇靈臺而演妙，略三乘之因果，廣萬有之自然，漸之以日損有為，頓之以證歸無學，喻則張弓鑿矢，法則挫銳解紛，修之有常，習以成性，黜聰填體，嗜然<b>坐忘</b>，不動於寂，幾微入照。履殊方者，了義無日，遊斯道者，觀妙可期，力少功多，要矣妙矣。", "i": 14}, {"t": "h2", "s": "得道第七", "o": "得道第七", "i": 15}, {"t": "p", "s": "夫道者，神异之物，灵而有性，虚而无象，随迎不测，影响莫求，不知所以然而然，通生无匮谓之道。至圣得之于古，妙法传之于今，循名究理，全然有实。上士纯信，克己勤行，<b>虚心</b>谷神，唯道来集。道有深力，徐易形神，形随道通，与神合一，谓之神人。神性虚融，体无变灭，形与道同，故无生死。隐则形同于神，显则神同于气，所以蹈水火而无害，对日月而无影，存亡在己，出入无问，身为滓质，犹至虚妙，况其灵智益深益远乎？《生神经》云：身神并一，则为真身。又《西升经》云：形神合同，故能长久。然虚无之道，力有浅深，深则兼被于形，浅则唯及于心。被形者，神人也。及心者，但得慧觉，而身不免谢。何耶？慧是心用，用多则心劳。初得少慧，悦而多辩，神气漏泄，无灵润身光，遂致早终，道故难备。经云尸解，此之谓也。是故大人含光藏辉，以期全备，凝神宝气，学道无心，<mark>神与道合</mark>，谓之<b>得道</b>。经云：同于道者，道亦得之。又云：古之所以贵此道者何？不日求以得，有罪以免邪？山有玉，草木以之不雕。人怀道，形骸以之永固。资薰日久，变质同神，链形入微，与道冥一。散一身为万法，混万法为一身，智照无边，形超靡极，总色空而为用，含造化以成功，真应无方，其惟<b>道德</b>。《西升经》云：与天同心而无知，与道同身而无体，然后天道盛矣。谓证得其极者也。又云：神不出身，与道同久。且身与道同，则无时而不存；心与道同，则无法而不通；耳与道同，则无声而不闻；眼与道同，则无色而不见。六根洞达，良由于此。近代常流，识不及远，唯闻舍形之道，未达即身之妙，无暂己短，有效人非。其犹夏虫不信冰霜，酝鹦断无天地。其愚不可及，何可诲焉。", "o": "夫道者，神異之物，靈而有性，虛而無象，隨迎不測，影響莫求，不知所以然而然，通生無匱謂之道。至聖得之於古，妙法傳之於今，循名究理，全然有實。上士純信，克己勤行，<b>虛心</b>谷神，唯道來集。道有深力，徐易形神，形隨道通，與神合一，謂之神人。神性虛融，體無變滅，形與道同，故無生死。隱則形同於神，顯則神同於氣，所以蹈水火而無害，對日月而無影，存亡在己，出入無問，身為滓質，猶至虛妙，況其靈智益深益遠乎？《生神經》云：身神並一，則為真身。又《西昇經》云：形神合同，故能長久。然虛無之道，力有淺深，深則兼被於形，淺則唯及於心。被形者，神人也。及心者，但得慧覺，而身不免謝。何耶？慧是心用，用多則心勞。初得少慧，悅而多辯，神氣漏洩，無靈潤身光，遂致早終，道故難備。經云尸解，此之謂也。是故大人含光藏輝，以期全備，凝神寶氣，學道無心，<mark>神與道合</mark>，謂之<b>得道</b>。經云：同於道者，道亦得之。又云：古之所以貴此道者何？不日求以得，有罪以免邪？山有玉，草木以之不彫。人懷道，形骸以之永固。資薰日久，變質同神，鍊形入微，與道冥一。散一身為萬法，混萬法為一身，智照無邊，形超靡極，總色空而為用，含造化以成功，真應無方，其惟<b>道德</b>。《西昇經》云：與天同心而無知，與道同身而無體，然後天道盛矣。謂證得其極者也。又云：神不出身，與道同久。且身與道同，則無時而不存；心與道同，則無法而不通；耳與道同，則無聲而不聞；眼與道同，則無色而不見。六根洞達，良由於此。近代常流，識不及遠，唯聞捨形之道，未達即身之妙，無暫己短，有效人非。其猶夏蟲不信冰霜，醞鸚斷無天地。其愚不可及，何可誨焉。", "i": 16}, {"t": "h2", "s": "坐忘枢翼", "o": "坐忘枢翼", "i": 17}, {"t": "p", "s": "夫欲修道成真，先去邪僻之行，外事都绝，无以干心，然后端坐，内观正觉。觉一念起，即须除灭，随起随制，务令安静。其次，虽非的有贪著，浮游乱想，亦尽灭除，昼夜勤行，须臾不替。唯灭动心，不灭照心，但冥<b>虚心</b>，不冥有心，不依一物，而心常住。此法玄妙，利益甚深，自非夙有道绿、信心无二者，莫能信重。虽知诵读其文，仍须辩识真伪，所以者何？声色昏心，邪佞惑耳，人我成性，自是病深，心与道隔，理难晓悟。若有心归<b>至道</b>，深生信慕，先受三戒，依戒修行，在终如始，乃得真道。其三戒者，一曰简绿，二曰无欲，三曰静心。勤行此三戒而无懈退者，则无心求道而道自来。经云：人能<b>虚心</b><b>无为</b>，非欲于道，道自归之。由此言之，简要之法，实可信哉，实可贵哉。然则凡心躁竞，其来固久，依戒息心，其事甚难。或息之而不得，暂得而还失，去留交战，百体流汗，久久柔挺，方乃调熟。莫以暂收不得，遂废平生之业。少得静已，则行立坐卧之时，涉事喧阗之处，皆须作意安之。<span class=\"key\">有事无事，常若无心</span>，处静处喧，其志唯一。若束心太急，急则成病，气发狂痴，是其候也。心若不动，又须放任，宽急得中，常自调适，制而无著，放而不逸，处喧无恶，涉事无恼者，此真定也。不以涉事无恼，故求多事，不以处喧无动，故来就喧。以无事为真定，以有事为应迩。若水镜之为鉴，则遇物而见形。善巧方便，唯能入定，发慧迟速，则不由人。勿于定中急急求慧，求慧则伤定，伤定则无慧。定不求慧，而慧自生，此真慧也。慧而不用，实智若愚，益资定慧，双美无极。若定中念想，则有多感，众邪百魅，随心应现，真人老君，神异诡怪，是其祥也。唯<b>定心</b>之上，豁然无覆，<b>定心</b>之下，旷然无基，旧业永消，新业不造，无所缠碍，迥脱尘网，行而久之，自然<b>得道</b>。", "o": "夫欲修道成真，先去邪僻之行，外事都絕，無以干心，然後端坐，內觀正覺。覺一念起，即須除滅，隨起隨制，務令安靜。其次，雖非的有貪著，浮遊亂想，亦盡滅除，晝夜勤行，須臾不替。唯滅動心，不滅照心，但冥<b>虛心</b>，不冥有心，不依一物，而心常住。此法玄妙，利益甚深，自非夙有道綠、信心無二者，莫能信重。雖知誦讀其文，仍須辯識真偽，所以者何？聲色昏心，邪佞惑耳，人我成性，自是病深，心與道隔，理難曉悟。若有心歸<b>至道</b>，深生信慕，先受三戒，依戒修行，在終如始，乃得真道。其三戒者，一曰簡綠，二曰無欲，三曰靜心。勤行此三戒而無懈退者，則無心求道而道自來。經云：人能<b>虛心</b>無為，非欲於道，道自歸之。由此言之，簡要之法，實可信哉，實可貴哉。然則凡心躁競，其來固久，依戒息心，其事甚難。或息之而不得，暫得而還失，去留交戰，百體流汗，久久柔挺，方乃調熟。莫以暫收不得，遂廢平生之業。少得靜已，則行立坐臥之時，涉事喧闐之處，皆須作意安之。<span class=\"key\">有事無事，常若無心</span>，處靜處喧，其志唯一。若束心太急，急則成病，氣發狂癡，是其候也。心若不動，又須放任，寬急得中，常自調適，制而無著，放而不逸，處喧無惡，涉事無惱者，此真定也。不以涉事無惱，故求多事，不以處喧無動，故來就喧。以無事為真定，以有事為應邇。若水鏡之為鑑，則遇物而見形。善巧方便，唯能入定，發慧遲速，則不由人。勿於定中急急求慧，求慧則傷定，傷定則無慧。定不求慧，而慧自生，此真慧也。慧而不用，實智若愚，益資定慧，雙美無極。若定中念想，則有多感，眾邪百魅，隨心應現，真人老君，神異詭怪，是其祥也。唯<b>定心</b>之上，豁然無覆，<b>定心</b>之下，曠然無基，舊業永消，新業不造，無所纏礙，迥脫塵網，行而久之，自然<b>得道</b>。", "i": 18}, {"t": "p", "s": "夫<b>得道</b>之人，心有五时，身有七候。心有五时者，一动多静少；二动静相半；三静多动少；四无事则静，事触还动；五心与道合，触而不动。心至此地，始得安乐，罪垢灭尽，无复烦恼。身有七候者，一举动顺时，容色和悦；二夙疾普消，身心轻爽；三填补夭伤，还元复命；四延数千岁，名曰仙人；五链形为气，名日真人；六炼气成神，名日神人；七炼神合道，名日至人。其于鉴力，随候益明，得<b>至道</b>成，慧乃圆备。虽久学<b>定心</b>，身无五时七候者，促龄秽质，色谢归空，自云慧觉，复称成道，求诸通理，实所未然，可谓谬矣。", "o": "夫<b>得道</b>之人，心有五時，身有七候。心有五時者，一動多靜少；二動靜相半；三靜多動少；四無事則靜，事觸還動；五心與道合，觸而不動。心至此地，始得安樂，罪垢滅盡，無復煩惱。身有七候者，一舉動順時，容色和悅；二夙疾普消，身心輕爽；三填補夭傷，還元復命；四延數千歲，名曰仙人；五鍊形為氣，名日真人；六鍊氣成神，名日神人；七鍊神合道，名日至人。其於鑒力，隨候益明，得<b>至道</b>成，慧乃圓備。雖久學<b>定心</b>，身無五時七候者，促齡穢質，色謝歸空，自云慧覺，復稱成道，求諸通理，實所未然，可謂謬矣。", "i": 19}];

       + '<div class="legend">阅读说明：<span class="key-s">金底深红</span>=全书总诀（最核心）；<mark>橙底</mark>=关键句；<b>深棕加粗</b>=核心术语；右侧<b style="color:#8a6a3f">灰底竖线块</b>为历代注解。顶栏可<b>隐藏注解</b>只读原文，也可切换繁简。<details><summary>📋 查看本经高亮词库（24 条）</summary><div class="phrases">内不觉其一身，外不知乎宇宙，与道冥一，万虑皆遗，同于大通，收心离境，住无所有，心依道则心安，有事无事，常若无心，真观者，智士之先鉴，泰定者，出俗之极地，致道之初基，得道者，神与道合，谓之得道，虚静至极，则道居而慧生，敬仰尊重，决定无疑，断缘者，谓断有为俗事之缘，简事者，即凡事皆须简省，贵在安心，心不受外，名曰虚心，心不逐外，名曰安心，空而照之，身与道一，神与道合，坐忘枢翼，形如槁木，心若死灰，若常无事，善恶都忘，觉而常明</div></details></div>'
